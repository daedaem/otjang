<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="어울">
  <meta name="description" content="내 옷을 정리하고, 함께 입을 조합과 다음 구매 후보를 살펴보세요. 어울에서 옷장부터 구매 판단까지 이어갑니다.">
  <title>어울 · 내 옷에서 시작하는 스타일</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="어울">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
  <div id="app" class="app"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="camera-photo-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
  <input id="label-photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden>
  <input id="wardrobe-backup-input" type="file" hidden aria-label="옷장 백업 파일 선택">
  <script type="module" src="./src/main.js"></script>
</body>
</html>
