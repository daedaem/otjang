<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옷장들이</title>
<style>
:root{
  --paper:#F5F2EA; --card:#FFFDF8; --ink:#1E2227; --ink2:#5B6068; --line:#DDD6C8; --line2:#C4BBA9;
  --accent:#1F2A45; --accent-ink:#FFFFFF; --warm:#A8502A; --warm-bg:#F6E3D8; --ok:#3F6B4A; --ok-bg:#E3EEDF; --tint:#ECE7DB; --thumb:#EAE5D9; --stage:#d9d1c4;
  --serif:"Nanum Myeongjo","AppleMyungjo","Noto Serif KR",Georgia,serif;
  --sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#16181B; --card:#1E2125; --ink:#ECE9E2; --ink2:#A3A7AD; --line:#32363C; --line2:#4A4F57;
    --accent:#B5C4EA; --accent-ink:#141821; --warm:#E59A72; --warm-bg:#3A261C; --ok:#8FBF9B; --ok-bg:#1F2D23; --tint:#24272C; --thumb:#2A2D32; --stage:#2a2d31; }
}
:root[data-theme="dark"]{ --paper:#16181B; --card:#1E2125; --ink:#ECE9E2; --ink2:#A3A7AD; --line:#32363C; --line2:#4A4F57;
  --accent:#B5C4EA; --accent-ink:#141821; --warm:#E59A72; --warm-bg:#3A261C; --ok:#8FBF9B; --ok-bg:#1F2D23; --tint:#24272C; --thumb:#2A2D32; --stage:#2a2d31; }
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding:22px 0 12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.mark{font:700 26px/1.1 var(--serif);letter-spacing:-.01em}
.tag{color:var(--ink2);font-size:14px}
.local{font-size:12.5px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.local.warn{color:var(--warm);border-color:var(--warm)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;background:var(--paper);z-index:5;padding-top:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:10px 14px;white-space:nowrap;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-weight:500;font-size:12.5px;color:var(--ink2);margin-left:4px}
@media (max-width:520px){.tab{padding:10px 9px;font-size:14px}.tab .n{margin-left:3px}}
main{padding:20px 0 64px}
.lead{color:var(--ink2);max-width:62ch;margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.bar .grow{flex:1}
.chip{appearance:none;border:1px solid var(--line2);background:none;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{appearance:none;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--warm);border-color:var(--warm)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input[type=text],input[type=number],input[type=url],textarea{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:64px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.cand{border-color:var(--warm)}
.thumb{aspect-ratio:1/1;background:var(--thumb);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.thumb.nopic{aspect-ratio:5/3}
.thumb.nopic .lbl{display:none}
.thumb .sw{height:56%;aspect-ratio:1/1;border-radius:10px;border:1px solid rgba(0,0,0,.12)}
.thumb .lbl{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--ink2)}
.thumb .pk{position:absolute;left:6px;top:6px;font-size:11px;line-height:1;padding:4px 6px;border-radius:6px;background:rgba(30,34,39,.78);color:#fff}
.thumb .pk.sub{background:rgba(168,80,42,.9)}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.cbody h3{font-size:14.5px;line-height:1.35;font-weight:650;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--ink2)}
.rec{font-size:12.5px;color:var(--ink)}
.quote{font-size:12.5px;color:var(--ink);border-left:2px solid var(--line2);padding-left:8px;margin-top:2px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px}
.badge{font-size:11.5px;line-height:1;padding:4px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.badge.cand{background:var(--warm-bg);border-color:var(--warm);color:var(--warm);font-weight:700}
.badge.draft{border-style:dashed}
.badge.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.badge.warn{background:var(--warm-bg);border-color:var(--warm);color:var(--warm)}
.cfoot{margin-top:auto;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{color:var(--ink2);font-size:13.5px;margin-bottom:12px}
.big{font:700 22px/1.2 var(--serif)}
.split{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%}
.row[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row .mini{flex:none}
.mini{width:48px;height:48px;border-radius:8px;background:var(--thumb);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mini .sw{width:60%;height:60%;border-radius:6px;border:1px solid rgba(0,0,0,.12)}
.rowt{min-width:0;flex:1}
.rowt b{display:block;font-size:14px;overflow-wrap:anywhere}
.rowt span{font-size:12.5px;color:var(--ink2)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pair:first-of-type{border-top:0}
.pair .vs{color:var(--ink2);font-size:12.5px}
@media (max-width:520px){.pair{grid-template-columns:1fr;gap:6px}.pair .vs{padding-left:58px}}
.side{display:flex;gap:10px;align-items:center;min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.fact{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--tint);color:var(--ink)}
.fact.diff{background:none;border:1px dashed var(--line2);color:var(--ink2)}
.outfits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.outfit{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);min-width:0}
.stack{display:flex;gap:6px;margin-bottom:10px}
.stack .mini{width:auto;flex:1;height:auto;aspect-ratio:1/1;position:relative}
.stack .mini.cand{outline:2px solid var(--warm);outline-offset:-2px}
.names{font-size:13.5px;font-weight:650;margin-bottom:6px;overflow-wrap:anywhere}
ul.why{margin:0;padding-left:18px;font-size:13px;color:var(--ink)}
ul.why li{margin:2px 0}
ul.why.warn li{color:var(--warm)}
.score{font-size:12px;color:var(--ink2);margin-top:8px}
.draftnote{font-size:12px;color:var(--ink2);border:1px dashed var(--line2);border-radius:8px;padding:6px 10px;margin-top:8px}
.steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.step{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.step.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.step.done{border-color:var(--ok);color:var(--ok)}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.choice{position:relative}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice span{display:block;padding:8px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--card);font-weight:600}
.choice input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.choice input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>span.l{font-size:12.5px;color:var(--ink2);font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
dialog{border:1px solid var(--line2);border-radius:14px;background:var(--paper);color:var(--ink);padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:1}
.dhead h2{font-size:16px}
.dbody{padding:16px}
.dfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper)}
.dfoot .grow{flex:1}
.note{font-size:12.5px;color:var(--ink2)}
.warnnote{font-size:13px;color:var(--warm)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:22px;text-align:center;color:var(--ink2)}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th,table.log td{text-align:left;padding:8px 8px;border-top:1px solid var(--line);vertical-align:top}
table.log th{font-size:12.5px;color:var(--ink2);font-weight:600;border-top:0}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;overflow-wrap:anywhere}
a{color:var(--accent)}
.range{display:flex;align-items:center;gap:8px}
.range input{flex:1;padding:0}
.range .sw{width:28px;height:28px;border-radius:6px;border:1px solid var(--line2);flex:none}
.inl{display:flex;gap:8px;align-items:center}
.inl input{flex:1}
.pics{display:flex;gap:12px;flex-wrap:wrap}
.pics .pbox{width:120px}
.pics .thumb{border-radius:8px;border:1px solid var(--line)}
.pics .cap{font-size:12px;color:var(--ink2);margin-top:4px;text-align:center}
.candlist{display:flex;flex-direction:column;gap:6px}
.candrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;border:1px dashed var(--line2);border-radius:8px;padding:6px 10px}
.candrow .grow{flex:1;min-width:120px}
/* 3D 옷장 */
.stage{position:relative;height:min(70vh,640px);min-height:380px;border-radius:14px;overflow:hidden;background:var(--stage);border:1px solid var(--line);margin-bottom:12px}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage .sui{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.stage .sui .btn{background:rgba(255,253,249,.92);color:#1c1a17;border-color:transparent;box-shadow:0 1px 4px rgba(28,26,23,.2)}
.stage .shint{position:absolute;left:50%;bottom:58px;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(28,26,23,.78);color:#fbf8f2;font-size:12.5px;white-space:nowrap;pointer-events:none;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.stage .schips{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;background:rgba(255,253,249,.82);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.stage .schips button{display:flex;align-items:center;gap:7px;flex:none;border:1px solid transparent;background:transparent;border-radius:999px;padding:5px 11px 5px 5px;font:inherit;font-size:13px;font-weight:600;color:#1c1a17;cursor:pointer}
.stage .schips button[aria-pressed="true"]{background:#fff;border-color:rgba(28,26,23,.14)}
.stage .schips i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(28,26,23,.2);flex:none}
.stage .smsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);max-width:min(440px,86%);padding:14px 16px;border-radius:12px;background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:14px;text-align:center}
.stage .sload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#1c1a17;font-size:14px;background:rgba(217,209,196,.6);pointer-events:none}
.racklist .row{cursor:default}
.racklist .row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lookpick{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.lookpick select{width:auto}
/* 상품 */
.prod{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
@media (max-width:520px){.prod{grid-template-columns:72px minmax(0,1fr)}}
.prod .thumb{border-radius:8px;aspect-ratio:1/1}
.prod h3{font-size:15px;font-weight:650;overflow-wrap:anywhere}
.prod .price{font-weight:700}
.prod .rank{font-size:12.5px;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1 class="mark">옷장들이</h1><span class="tag">오래 입는 옷의 기록</span></div>
    <div class="local" id="saveNote">이 브라우저 안에만 저장됩니다</div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="stageHolder" hidden>
  <div class="stage" id="stage"><canvas id="stage3d" aria-label="옷장 3D 화면. 옷을 누르면 크게 보이고, 끌면 자리를 바꿉니다."></canvas>
    <div class="sui"><button class="btn small" type="button" id="stageHome">처음 시점</button><button class="btn small" type="button" id="stagePoke">툭 쳐 보기</button></div>
    <p class="shint" id="stageHint">옷을 누르면 크게 보입니다 · 끌면 자리를 바꾸고 흔들립니다</p>
    <div class="schips" id="stageChips" role="group" aria-label="걸린 옷"></div>
    <div class="sload" id="stageLoad">옷장을 준비하는 중…</div>
    <p class="smsg" id="stageMsg" hidden></p>
  </div>
</div>

<dialog id="editor" aria-labelledby="edTitle">
  <form id="edForm" method="dialog">
    <div class="dhead"><h2 id="edTitle">옷 기록</h2><button class="btn small" type="button" id="edClose">닫기</button></div>
    <div class="dbody">
      <div class="form">
        <div class="field full"><label for="f-name">이름</label><input id="f-name" type="text" maxlength="80" required placeholder="예: 흰색 옥스퍼드 버튼다운 셔츠"></div>
        <div class="field"><label for="f-cat">분류</label><select id="f-cat"></select></div>
        <div class="field"><label for="f-kind">종류</label><select id="f-kind"></select></div>
        <div class="field"><label for="f-family">색 계열</label><select id="f-family"></select></div>
        <div class="field"><label for="f-light">밝기 <span id="f-lightv"></span></label><div class="range"><span class="sw" id="f-sw"></span><input id="f-light" type="range" min="0" max="100" step="1"></div></div>
        <div class="field"><label for="f-formality">격식</label><select id="f-formality"></select></div>
        <div class="field"><label for="f-pattern">무늬</label><select id="f-pattern"></select></div>
        <div class="field full"><span class="l">계절 (비워 두면 사계절로 봅니다)</span><div class="checks" id="f-seasons"></div></div>
        <div class="field full"><div class="checks"><label><input id="f-confirmed" type="checkbox"> 색·밝기·격식·무늬를 직접 확인했습니다</label></div><span class="note" id="f-draftNote"></span></div>
      </div>
      <hr class="hr">
      <div class="form">
        <div class="field full"><span class="l">사진</span><div class="pics" id="f-pics"></div><span class="note" id="f-photoNote"></span></div>
        <div class="field full"><div class="inl"><input id="f-photo" type="file" accept="image/*"><button class="btn small" type="button" id="f-match">상품 사진·확인</button></div><span class="note">내 사진은 얼굴과 몸이 없는 옷 사진으로. 상품 사진은 직접 넣고, 같은 상품인지는 직접 확인합니다.</span></div>
      </div>
      <hr class="hr">
      <div class="form">
        <div class="field"><label for="f-brand">브랜드</label><input id="f-brand" type="text" maxlength="60"></div>
        <div class="field"><label for="f-model">상품명·품번</label><input id="f-model" type="text" maxlength="80"></div>
        <div class="field"><label for="f-size">사이즈</label><input id="f-size" type="text" maxlength="30" placeholder="예: 100, M, 32"></div>
        <div class="field" id="w-year"><label for="f-year">산 해</label><input id="f-year" type="number" min="1950" max="2100" step="1" placeholder="예: 2021"></div>
        <div class="field" id="w-rebuy"><label for="f-rebuy">다시 살까</label><select id="f-rebuy"></select></div>
        <div class="field"><label for="f-fabric">두께</label><select id="f-fabric"></select></div>
        <div class="field" id="w-neck"><label for="f-neck">넥 높이</label><select id="f-neck"></select></div>
        <div class="field full" id="w-review"><label for="f-review">오래 입어 본 후기</label><textarea id="f-review" maxlength="500" placeholder="예: 3년째. 세탁해도 목이 늘지 않았다. 기장이 조금 길다."></textarea></div>
        <div class="field full"><span class="l">실측 (cm, 아는 것만)</span><div class="form" id="f-measures"></div></div>
      </div>
      <hr class="hr">
      <div class="form">
        <div class="field full"><label for="f-link">링크 (직접 넣은 값만 보여 줍니다. 열거나 긁어 오지 않습니다)</label><input id="f-link" type="url" maxlength="400" placeholder="https://"></div>
        <div class="field"><label for="f-price">가격 (원)</label><input id="f-price" type="number" min="0" step="100"></div>
        <div class="field"><label for="f-checked">가격을 확인한 날</label><input id="f-checked" type="text" maxlength="10" placeholder="2026-10-10"></div>
      </div>
      <p class="warnnote" id="edErr" hidden></p>
    </div>
    <div class="dfoot"><button class="btn danger small" type="button" id="edDelete">삭제</button><span class="grow"></span><button class="btn" type="button" id="edCancel">취소</button><button class="btn primary" type="submit" id="edSave">저장</button></div>
  </form>
</dialog>

<dialog id="wizard" aria-labelledby="wzTitle">
  <form id="wzForm" method="dialog">
    <div class="dhead"><h2 id="wzTitle">옷 추가</h2><button class="btn small" type="button" id="wzClose">닫기</button></div>
    <div class="dbody">
      <div class="steps" id="wzSteps"></div>
      <div id="wzBody"></div>
      <p class="warnnote" id="wzErr" hidden></p>
    </div>
    <div class="dfoot"><button class="btn" type="button" id="wzBack">이전</button><span class="grow"></span><button class="btn" type="button" id="wzCancel">취소</button><button class="btn primary" type="button" id="wzNext">다음</button></div>
  </form>
</dialog>

<dialog id="match" aria-labelledby="mtTitle">
  <form id="mtForm" method="dialog">
    <div class="dhead"><h2 id="mtTitle">상품 사진과 확인</h2><button class="btn small" type="button" id="mtClose">닫기</button></div>
    <div class="dbody" id="mtBody"></div>
    <div class="dfoot"><span class="grow"></span><button class="btn" type="button" id="mtCancel">닫기</button></div>
  </form>
</dialog>

<dialog id="product" aria-labelledby="pdTitle">
  <form id="pdForm" method="dialog">
    <div class="dhead"><h2 id="pdTitle">상품 추가</h2><button class="btn small" type="button" id="pdClose">닫기</button></div>
    <div class="dbody">
      <p class="note" style="margin-bottom:12px">쇼핑하다 본 실제 상품을 직접 적습니다. 이 화면은 가격과 재고를 찾아오지 않으므로, 적은 날짜가 함께 남습니다.</p>
      <div class="form">
        <div class="field"><label for="p-brand">브랜드</label><input id="p-brand" type="text" maxlength="60"></div>
        <div class="field"><label for="p-name">상품명</label><input id="p-name" type="text" maxlength="80" required></div>
        <div class="field"><label for="p-code">품번 (선택)</label><input id="p-code" type="text" maxlength="60"></div>
        <div class="field"><label for="p-link">상품 주소 (선택)</label><input id="p-link" type="url" maxlength="400" placeholder="https://"></div>
        <div class="field"><label for="p-cat">분류</label><select id="p-cat"></select></div>
        <div class="field"><label for="p-kind">종류</label><select id="p-kind"></select></div>
        <div class="field"><label for="p-family">색 계열</label><select id="p-family"></select></div>
        <div class="field"><label for="p-light">밝기 <span id="p-lightv"></span></label><div class="range"><span class="sw" id="p-sw"></span><input id="p-light" type="range" min="0" max="100" step="1"></div></div>
        <div class="field"><label for="p-formality">격식</label><select id="p-formality"></select></div>
        <div class="field"><label for="p-pattern">무늬</label><select id="p-pattern"></select></div>
        <div class="field full"><span class="l">계절 (비워 두면 사계절)</span><div class="checks" id="p-seasons"></div></div>
        <div class="field"><label for="p-price">확인한 가격 (원)</label><input id="p-price" type="number" min="0" step="100"></div>
        <div class="field"><label for="p-checked">확인한 날</label><input id="p-checked" type="text" maxlength="10" placeholder="2026-10-12"></div>
        <div class="field full"><label for="p-photo">상품 사진 (직접 넣은 것만)</label><input id="p-photo" type="file" accept="image/*"><span class="note" id="p-photoNote"></span></div>
        <div class="field full"><label for="p-note">메모 (선택)</label><input id="p-note" type="text" maxlength="200"></div>
      </div>
      <p class="warnnote" id="pdErr" hidden></p>
    </div>
    <div class="dfoot"><button class="btn danger small" type="button" id="pdDelete">지우기</button><span class="grow"></span><button class="btn" type="button" id="pdCancel">취소</button><button class="btn primary" type="submit" id="pdSave">저장</button></div>
  </form>
</dialog>

<script>/*@@CATALOG_LIB@@*/</script>
<script>const BASE = /*@@WARDROBE@@*/;
const TEMPLATE = /*@@TEMPLATE@@*/;</script>
<script>/*@@CLOSET@@*/</script>
<script>
(function () {
  'use strict';
  const R = window.Recommend, J = window.Judge, W = window.Wardrobe, C = window.Catalog, X = window.OtjangCloset || null;
  const { SEASONS, CATS, KINDS, FAM, PATTERNS, FORMAL, REBUY, FABRIC, NECK, MEASURES, LEAN, DECIDE, HELP, SHIFT, PHOTO_KIND, EVIDENCE, LOOK_KINDS, str, num, safeImg, safeLink, today } = W;
  const KEY1 = 'otjang.v1', KEY2 = 'otjang.v2', DB = 'otjang';
  const YEAR = new Date().getFullYear();

  // ---------- 작은 도구 ----------
  const $ = (s, el) => (el || document).querySelector(s);
  /** 글자는 모두 textContent로 넣는다. 가져온 파일의 글자가 마크업으로 해석되지 않게 한다. */
  function h(tag, attrs) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'style') el.style.cssText = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (let i = 2; i < arguments.length; i++) {
      const c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach((x) => x != null && x !== false && el.append(x));
      else el.append(c);
    }
    return el;
  }
  const swatch = (it) => { const f = FAM[it.family] || FAM.gray; return 'hsl(' + f[1] + ' ' + f[2] + '% ' + Math.round(Math.max(6, Math.min(96, it.light * 0.9 + 5))) + '%)'; };
  const kindLabel = (it) => (KINDS[it.cat] && KINDS[it.cat][it.kind]) || it.kind || '';
  const famLabel = (it) => (FAM[it.family] ? FAM[it.family][0] : it.family || '');
  const fmtWon = (n) => n.toLocaleString('ko-KR') + '원';
  function download(name, obj) {
    const a = h('a', { href: URL.createObjectURL(new Blob([JSON.stringify(obj)], { type: 'application/json' })), download: name });
    document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function readImage(file, max) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, (max || 480) / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        let out = c.toDataURL('image/webp', 0.82); if (out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', 0.85);
        resolve(safeImg(out));
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }
  async function readFileJson(input) { const f = input.files[0]; if (!f) return undefined; try { return JSON.parse(await f.text()); } catch (e) { return null; } }

  // ---------- 저장소: IndexedDB를 쓰고, 안 되면 localStorage, 그것도 안 되면 메모리 ----------
  const store = { db: null, mode: 'memory' };
  function openDb() {
    return new Promise((res) => {
      try {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open(DB, 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
        r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
  }
  const kvGet = (k) => new Promise((res) => { try { const t = store.db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); } catch (e) { res(undefined); } });
  const kvSet = (k, v) => new Promise((res) => { try { const t = store.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false); } catch (e) { res(false); } });
  const kvDel = (k) => new Promise((res) => { try { const t = store.db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); } });
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  /** 저장된 상태를 정리한다. 옷장 파일(스키마 1·2) + others + catalog + rack(3D 옷장에 건 옷). */
  function cleanState(raw) {
    const w = W.cleanWardrobe(raw); if (!w) return null;
    const s = { schema: 2, owner: w.owner, items: w.items, decisions: w.decisions, others: [], catalog: { products: [] }, rack: [] };
    s.others = (Array.isArray(raw.others) ? raw.others : []).slice(0, 6).map(W.cleanWardrobe).filter(Boolean);
    const cat = raw.catalog && C.cleanCatalog(Object.assign({ schema: 1, kind: 'catalog' }, raw.catalog)); s.catalog = { products: cat ? cat.products : [] };
    const ids = new Set(s.items.map((i) => i.id)), slots = new Set();
    s.rack = (Array.isArray(raw.rack) ? raw.rack : []).map((r) => (r && typeof r === 'object' ? { id: str(r.id, 40), slot: num(r.slot, 0, 5) } : null)).filter((r) => r && ids.has(r.id) && r.slot != null && !slots.has(r.slot) && slots.add(r.slot));
    return s;
  }
  function defaultRack(items) {                                                                   // 처음에는 3D 형태가 있는 옷을 보유 옷부터 6벌까지 건다
    const can = items.filter((i) => i.status !== 'gone' && i.look3d).sort((a, b) => (a.status === b.status ? 0 : a.status === 'owned' ? -1 : 1));
    return can.slice(0, 6).map((i, k) => ({ id: i.id, slot: k }));
  }
  async function load() {
    store.db = await openDb();
    let raw = null, from = '';
    if (store.db) { store.mode = 'idb'; const t = await kvGet('state'); if (t) { try { raw = JSON.parse(t); from = 'idb'; } catch (e) { raw = null; } } }
    if (!raw) { const t = lsGet(KEY2); if (t) { try { raw = JSON.parse(t); from = 'ls2'; } catch (e) { raw = null; } } }
    if (!raw) { const t = lsGet(KEY1); if (t) { try { raw = JSON.parse(t); from = 'ls1'; } catch (e) { raw = null; } } }   // v0.3 저장소: 읽어서 옮긴다. v1 키는 지우지 않는다
    if (!store.db) { try { localStorage.setItem('__probe__', '1'); localStorage.removeItem('__probe__'); store.mode = 'ls'; } catch (e) { store.mode = 'memory'; } }
    let s = raw && cleanState(raw);
    if (!s) { s = cleanState(BASE); from = 'base'; }
    if (from !== 'idb' && from !== 'ls2') s.rack = defaultRack(s.items);
    s.loadedFrom = from; return s;
  }
  let state = null, storageOk = true, savePromise = Promise.resolve();
  const ui = { tab: 'closet', cat: 'all', season: '', judgeId: '', rejudge: '', mixCand: false, exclude: [], src: 'template', cmpSeason: '', delArm: false, resetArm: false, importArm: null, exp: { img: true, otherImg: false, cands: false, price: false, body: false, log: false },
    shopSeason: '', shopGap: 'template', shopImportArm: null, catImport: null, rackPick: '', stageSel: null };
  function save() {
    const data = JSON.stringify(state);
    savePromise = (async () => {
      let ok = false;
      if (store.mode === 'idb') ok = await kvSet('state', data);
      if (!ok && store.mode !== 'memory') { try { localStorage.setItem(KEY2, data); ok = true; } catch (e) { ok = false; } }
      storageOk = ok;
      const n = $('#saveNote');
      n.textContent = storageOk ? '이 브라우저 안에만 저장됩니다' : '저장할 수 없는 상태입니다. 기록 탭에서 파일로 내보내 보관하세요';
      n.classList.toggle('warn', !storageOk);
    })();
    return savePromise;
  }
  async function wipe() { if (store.mode === 'idb') await kvDel('state'); try { localStorage.removeItem(KEY2); } catch (e) { /* 저장소를 못 쓰는 환경 */ } }
  const owned = () => state.items.filter((i) => i.status === 'owned');
  const cands = () => state.items.filter((i) => i.status === 'candidate');
  const byId = (id) => state.items.find((i) => i.id === id);
  const newId = (p) => p + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  function replaceItem(it) { const at = state.items.findIndex((i) => i.id === it.id); if (at >= 0) state.items[at] = it; else state.items.push(it); return it; }

  // ---------- 공통 조각 ----------
  function pic(it, cls) {
    const img = it.photo ? it.photo.img : it.img, kind = it.photo ? it.photo.kind : (img ? 'own' : 'none');
    const box = h('div', { class: cls || (img ? 'thumb' : 'thumb nopic') });
    if (img) box.append(h('img', { src: img, alt: '', loading: 'lazy' }));
    else { box.append(h('span', { class: 'sw', style: 'background:' + swatch(it) })); if (!cls) box.append(h('span', { class: 'lbl', text: '사진 없음' })); }
    if (!cls && img && kind !== 'own') box.append(h('span', { class: 'pk' + (kind === 'substitute' ? ' sub' : ''), text: kind === 'confirmed' ? '확인된 동일 제품' : kind === 'candidate' ? '미확인 후보' : '대체 이미지 · 내 옷 아님' }));
    return box;
  }
  function recordLine(it) {
    const parts = [];
    if (it.brand) parts.push(it.brand);
    if (it.size) parts.push('사이즈 ' + it.size);
    if (it.boughtYear) parts.push(it.boughtYear >= YEAR ? '올해 삼' : (YEAR - it.boughtYear + 1) + '년째');
    if (it.rebuy !== 'unknown') parts.push(REBUY[it.rebuy]);
    return parts.join(' · ');
  }
  function stateBadges(it, opts) {
    const badges = h('div', { class: 'badges' });
    if (it.status === 'candidate') badges.append(h('span', { class: 'badge cand', text: '구매 후보' }));
    else if (!opts.theirs) badges.append(h('span', { class: 'badge', text: '보유' }));
    if (!opts.theirs && W.isDraft(it)) badges.append(h('span', { class: 'badge draft', text: '사진에서 뽑은 초안' }));
    if (it.photo && it.photo.kind === 'confirmed') badges.append(h('span', { class: 'badge ok', text: '확인된 동일 제품' }));
    else if (it.photo && it.photo.kind === 'candidate') badges.append(h('span', { class: 'badge draft', text: '미확인 후보' }));
    else if (it.photo && it.photo.kind === 'substitute') badges.append(h('span', { class: 'badge warn', text: '대체 이미지 · 내 옷 아님' }));
    if (!opts.theirs && it.matchCandidates && it.matchCandidates.length && !(it.photo && it.photo.kind === 'confirmed')) badges.append(h('span', { class: 'badge draft', text: '브랜드 후보 ' + it.matchCandidates.length }));
    return badges;
  }
  function itemCard(it, opts) {
    opts = opts || {};
    const rec = recordLine(it);
    const body = h('div', { class: 'cbody' }, stateBadges(it, opts), h('h3', { text: it.name }),
      h('p', { class: 'meta', text: [famLabel(it), kindLabel(it), PATTERNS[it.pattern] !== '무지' ? PATTERNS[it.pattern] : '', it.seasons.length && it.seasons.length < 4 ? it.seasons.join('·') : ''].filter(Boolean).join(' · ') }),
      rec ? h('p', { class: 'rec', text: rec }) : (opts.theirs ? null : h('p', { class: 'meta', text: '기록이 아직 없습니다' })),
      it.review ? h('p', { class: 'quote', text: it.review }) : null);
    if (opts.actions) body.append(h('div', { class: 'cfoot' }, opts.actions));
    return h('article', { class: 'card' + (it.status === 'candidate' ? ' cand' : ''), 'data-id': it.id }, pic(it), body);
  }
  const chip = (label, on, fn) => h('button', { class: 'chip', type: 'button', 'aria-pressed': on ? 'true' : 'false', onclick: fn, text: label });
  function seasonChips(cur, set) {
    return [chip('모든 계절', !cur, () => set(''))].concat(SEASONS.map((s) => chip(s, cur === s, () => set(s))));
  }
  /** 결과에 쓰인 옷 가운데 속성이 초안인 것을 알려 주는 줄. 점수는 바꾸지 않는다. */
  function draftNote(items) {
    const d = items.filter((i) => i && W.isDraft(i));
    if (!d.length) return null;
    return h('p', { class: 'draftnote', text: '확인 전 속성 포함: ' + d.map((i) => i.name).join(', ') + ' — 사진에서 뽑은 초안이라 색·밝기·격식이 다를 수 있습니다. 옷장 탭에서 확인해 주세요.' });
  }
  function outfitCard(c, candId) {
    const parts = [c.outer, c.top, c.bottom].filter(Boolean);
    const stack = h('div', { class: 'stack' }, parts.map((p) => { const m = pic(p, 'mini' + (p.id === candId || p.status === 'candidate' ? ' cand' : '')); m.title = p.name; return m; }));
    const el = h('div', { class: 'outfit' }, stack, h('p', { class: 'names', text: parts.map((p) => p.name).join(' + ') }),
      h('ul', { class: 'why' }, (c.why || []).map((w) => h('li', { text: w }))));
    if (c.caution && c.caution.length) el.append(h('ul', { class: 'why warn' }, c.caution.map((w) => h('li', { text: w }))));
    el.append(h('p', { class: 'score', text: '규칙 점수 ' + c.score + ' (가산과 감점의 합. 확률이 아닙니다)' }));
    const dn = draftNote(parts); if (dn) el.append(dn);
    return el;
  }

  // ---------- 탭 ----------
  const TABS = [['closet', '옷장'], ['closet3d', '3D 옷장'], ['judge', '살까 말까'], ['outfits', '코디'], ['shop', '살 만한 옷'], ['compare', '옷장 구경'], ['log', '기록']];
  function renderTabs() {
    const nav = $('#tabs'); nav.textContent = '';
    for (const [id, label] of TABS) {
      const n = id === 'closet' ? owned().length : id === 'judge' ? cands().length : id === 'log' ? state.decisions.filter((d) => d.after).length : id === 'shop' ? state.catalog.products.length : id === 'closet3d' ? state.rack.length : null;
      nav.append(h('button', { class: 'tab', type: 'button', role: 'tab', id: 'tabbtn-' + id, 'aria-selected': ui.tab === id ? 'true' : 'false', onclick: () => { ui.tab = id; render(); } }, label, n != null ? h('span', { class: 'n', text: String(n) }) : null));
    }
  }
  const stageEl = $('#stage'), stageHolder = $('#stageHolder'), sq = (sel) => stageEl.querySelector(sel);   // 3D 화면은 한 번 만들어 탭 사이를 오간다 (WebGL을 다시 만들지 않게)
  function render() {
    renderTabs();
    stageHolder.append(stageEl); stageHolder.hidden = true;
    const main = $('#main'); main.textContent = '';
    ({ closet: renderCloset, closet3d: renderCloset3d, judge: renderJudge, outfits: renderOutfits, shop: renderShop, compare: renderCompare, log: renderLog })[ui.tab](main);
    if (ui.tab !== 'closet3d' && closet.api) closet.api.setActive(false);
  }

  // ---------- 옷장 ----------
  function renderCloset(main) {
    const drafts = owned().filter(W.isDraft).length;
    main.append(h('p', { class: 'lead', text: '가진 옷과 그 옷에 대한 기록입니다. 사이즈, 산 해, 오래 입어 본 후기를 적어 두면 다음에 살 때의 근거가 됩니다.' + (drafts ? ' 지금 ' + drafts + '벌은 사진에서 뽑은 초안이라 색과 종류를 직접 확인해야 합니다.' : '') }));
    const bar = h('div', { class: 'bar' }, chip('전체', ui.cat === 'all', () => { ui.cat = 'all'; render(); }),
      Object.keys(CATS).map((c) => chip(CATS[c], ui.cat === c, () => { ui.cat = c; render(); })), h('span', { class: 'grow' }),
      h('button', { class: 'btn primary', type: 'button', id: 'addOwned', onclick: () => openWizard(null, 'owned'), text: '옷 추가' }));
    main.append(bar, h('div', { class: 'bar' }, seasonChips(ui.season, (s) => { ui.season = s; render(); })));
    const list = state.items.filter((i) => i.status !== 'gone' && (ui.cat === 'all' || i.cat === ui.cat) && J.inSeason(i, ui.season));
    if (!list.length) { main.append(h('div', { class: 'empty', text: '이 조건에 맞는 옷이 없습니다.' })); return; }
    const order = { outer: 0, top: 1, bottom: 2, shoes: 3 };
    list.sort((a, b) => (a.status === b.status ? order[a.cat] - order[b.cat] : a.status === 'candidate' ? 1 : -1));
    main.append(h('div', { class: 'grid', id: 'closetGrid' }, list.map((it) => itemCard(it, { actions: [
