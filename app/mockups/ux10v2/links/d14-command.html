<style>
/* d14 한 칸 명령 앱: 모든 일은 위의 한 칸(옴니박스)에서 시작한다. 칸은 화면에 따라 명령 팔레트(홈·결과), 옷장 필터(옷장), 상품 찾기(넣기·중고), 질문 칸(상담)이 된다.
   색은 중립 회색 + 강조색(파랑) 하나. 주 행동 버튼은 검정. 글자 단계 26 · 20 · 16 · 15 · 13 · 12. 고정 영역: 위 칸 56 + 아래 탭 52. */
:root {
  --bg: #fafafa; --surface: #ffffff; --well: #f1f1f3; --well2: #e9e9ec; --ptile: #eeeeee;
  --ink: #111114; --ink2: #4b4b55; --ink3: #76767f; --line: #e4e4e8; --line2: #cfcfd6;
  --acc: #2f5bea; --acc-text: #2448c4; --acc-soft: #e9eefc; --btn-bg: #111114; --btn-fg: #ffffff;
  --ok: #15803d; --ok-soft: #e4f5ea; --stop: #b42318; --stop-soft: #fbe9e7; --warn-text: #92400e; --warn-soft: #fdf1dc;
  --dim: rgba(10, 10, 14, .42); --shadow: 0 12px 36px rgba(10, 10, 20, .12), 0 1px 2px rgba(10, 10, 20, .06);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --r: 10px; --gutL: max(16px, env(safe-area-inset-left, 0px)); --gutR: max(16px, env(safe-area-inset-right, 0px));
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --omni: 56px; --tabs: 52px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0f12; --surface: #17171b; --well: #1f1f25; --well2: #2a2a31; --ptile: #e9e9ea;
  --ink: #f2f2f4; --ink2: #c4c4cc; --ink3: #8e8e99; --line: #2a2a32; --line2: #3b3b45;
  --acc: #7aa2ff; --acc-text: #a3bdff; --acc-soft: #1b2540; --btn-bg: #f2f2f4; --btn-fg: #111114;
  --ok: #4ade80; --ok-soft: #10261a; --stop: #f87171; --stop-soft: #2d1515; --warn-text: #fbbf24; --warn-soft: #2d2210;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 12px 36px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f0f12; --surface: #17171b; --well: #1f1f25; --well2: #2a2a31; --ptile: #e9e9ea;
  --ink: #f2f2f4; --ink2: #c4c4cc; --ink3: #8e8e99; --line: #2a2a32; --line2: #3b3b45;
  --acc: #7aa2ff; --acc-text: #a3bdff; --acc-soft: #1b2540; --btn-bg: #f2f2f4; --btn-fg: #111114;
  --ok: #4ade80; --ok-soft: #10261a; --stop: #f87171; --stop-soft: #2d1515; --warn-text: #fbbf24; --warn-soft: #2d2210;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 12px 36px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .4); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
html { scroll-padding: calc(var(--sat) + var(--omni) + 12px) 0 calc(150px + var(--sab)); }
body { margin: 0; color: var(--ink); font: 400 15px/1.5 var(--font); letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; --k-font: var(--font); --k-toast-bg: var(--ink); --k-toast-fg: var(--bg); --k-info-bg: var(--surface); --k-info-fg: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: var(--sat); z-index: 40; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.ph, .ph-fill { line-height: 1; }
.num { font-variant-numeric: tabular-nums; }
.nw { white-space: nowrap; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.h1 { font-size: 26px; line-height: 34px; font-weight: 800; letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.h2 { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.h3 { font-size: 16px; line-height: 24px; font-weight: 700; margin: 0; }
.t5 { font-size: 15px; line-height: 22px; }
.t6 { font-size: 13px; line-height: 19px; color: var(--ink3); }
.t7 { font-size: 12px; line-height: 17px; color: var(--ink3); }
.sub { color: var(--ink2); }
.acc { color: var(--acc-text); }
.wrap { max-width: 640px; margin: 0 auto; }

/* ── 위의 한 칸(옴니박스): 모든 화면에 고정. 모드 칩 + 입력 + 단축키. */
.omni { position: sticky; top: var(--sat); z-index: 30; background: var(--bg); }
.omni > .in { max-width: 640px; margin: 0 auto; height: var(--omni); display: flex; align-items: center; gap: 6px; padding: 0 var(--gutR) 0 var(--gutL); }
.omni .back { width: 40px; height: 44px; margin-left: -8px; display: grid; place-items: center; font-size: 22px; border-radius: 10px; flex: none; }
.omni .back:active { background: var(--well); }
.box { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line2); border-radius: 12px; background: var(--surface); display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; transition: box-shadow 160ms ease, border-color 160ms ease; }
.box:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.box > i { font-size: 19px; color: var(--ink3); flex: none; }
.box .mode { flex: none; height: 26px; padding: 0 4px 0 9px; border-radius: 7px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.box .mode i { font-size: 15px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; }
.box .mode:active i { background: rgba(255, 255, 255, .2); }
.box input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 16px; font-weight: 500; padding: 0; }
.box input::placeholder { color: var(--ink3); font-weight: 400; }
.box .clr { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink3); font-size: 17px; flex: none; }
.box .clr:active { background: var(--well); }
kbd { display: inline-flex; align-items: center; gap: 1px; height: 22px; padding: 0 6px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 6px; background: var(--well); color: var(--ink3); font: 600 12px/1 var(--font); flex: none; }
.box kbd { display: none; }
.omni .icon { width: 44px; height: 44px; margin-right: -8px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; color: var(--ink2); flex: none; }
.omni .icon:active { background: var(--well); }
@media (min-width: 900px) { .box kbd { display: inline-flex; } }

/* 팔레트: 휴대폰은 칸 아래 전체, PC는 칸 아래 떠 있는 판. */
.pal { position: fixed; z-index: 29; left: 0; right: 0; top: calc(var(--sat) + var(--omni)); bottom: 0; background: var(--bg); overflow: auto; padding: 0 var(--gutR) calc(var(--tabs) + 24px + var(--sab)) var(--gutL); overscroll-behavior: contain; }
.pal .list { max-width: 640px; margin: 0 auto; }
.pal .gh { margin: 14px 2px 4px; font-size: 12px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; justify-content: space-between; }
.pal .gh .quiet { min-height: 24px; font-size: 12px; }
.pr { width: 100%; min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: 10px; text-align: left; }
.pr .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--well); display: grid; place-items: center; font-size: 18px; color: var(--ink2); flex: none; }
.pr.cmd .ic { background: var(--ink); color: var(--bg); }
.pr .ph-box { width: 34px; border-radius: 7px; flex: none; }
.pr .tx { flex: 1; min-width: 0; }
.pr .tt { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .tt em { font-style: normal; color: var(--acc-text); }
.pr .ss { display: block; font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr .tag { flex: none; font-size: 12px; font-weight: 700; color: var(--ink3); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }
.pr kbd { display: none; }
.pr[aria-selected="true"] { background: var(--well); }
.pr:active { background: var(--well2); }
@media (min-width: 900px) {
  .pal { position: absolute; top: 100%; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); max-height: min(70vh, 640px); margin-top: -4px; padding: 6px 8px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
  .pr kbd { display: inline-flex; }
}

/* 화면 */
.app { max-width: 640px; margin: 0 auto; padding: 0 var(--gutR) calc(var(--tabs) + 28px + var(--sab)) var(--gutL); }
.app.notabs { padding-bottom: calc(28px + var(--sab)); }
.app.bar { padding-bottom: calc(108px + var(--sab)); }
.view { animation: in 200ms ease-out both; }
.view.back { animation-name: inback; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes inback { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }
.section { margin-top: 24px; }
.section .h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.foot { margin: 28px 0 0; font-size: 12px; line-height: 17px; color: var(--ink3); }

/* 아래 탭(3개): 글자 없이 다니는 곳 둘(옷장·기록)과 홈. 나머지는 모두 칸의 명령. */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding-bottom: var(--sab); }
.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tabs button { height: var(--tabs); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--ink3); white-space: nowrap; }
.tabs button i { font-size: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }

/* 버튼·칩·세그먼트 */
.btn { min-height: 48px; padding: 0 16px; border-radius: var(--r); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 120ms ease; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.go { background: var(--btn-bg); color: var(--btn-fg); }
.btn.soft { background: var(--well); color: var(--ink); }
.btn.line { border: 1px solid var(--line2); color: var(--ink); background: var(--surface); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 40px; font-size: 14px; padding: 0 12px; border-radius: 8px; }
.quiet { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.quiet i { font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--gutL)); margin-right: calc(-1 * var(--gutR)); padding: 0 var(--gutR) 2px var(--gutL); }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--surface); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; flex: none; }
.chip i { font-size: 15px; color: var(--ink3); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.on i { color: inherit; }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--well); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; }
.seg button { min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink2); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 1px var(--line); }
.badge { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--well); color: var(--ink2); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.stop { background: var(--stop-soft); color: var(--stop); }
.badge.acc { background: var(--acc-soft); color: var(--acc-text); }
.badge.warn { background: var(--warn-soft); color: var(--warn-text); }
.badge i { font-size: 13px; }
.card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px; }
.row { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
.row .grow { flex: 1; min-width: 0; }
.row .arr { color: var(--ink3); font-size: 18px; flex: none; }
.notice { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--well); font-size: 13px; line-height: 18px; color: var(--ink2); }
.notice .grow { flex: 1; min-width: 0; }
.notice button { color: var(--ink); font-weight: 700; white-space: nowrap; min-height: 32px; padding: 0 8px; border-radius: 6px; background: var(--surface); }
.notice i { font-size: 17px; flex: none; color: var(--ink3); }

/* 사진: 모든 칸 3:4, 같은 밝은 바탕. 흰 배경 단독 사진은 바탕에 녹이고, 모델 사진은 채운다. */
.ph-box { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; background: var(--ptile); overflow: hidden; display: grid; place-items: center; }
.ph-box img { display: block; }
.ph-box img.cover { width: 100%; height: 100%; object-fit: cover; }
.ph-box img.flat { width: 84%; height: 84%; object-fit: contain; mix-blend-mode: multiply; }
.ph-box .eo-ph, .ph-box .eo-tile { position: absolute; inset: 0; aspect-ratio: auto !important; border-radius: 0 !important; }
.ph-box .swatch { position: absolute; inset: 0; display: grid; place-items: center; }
.ph-box .swatch i { width: 44%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.ph-box .swatch b { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px; font-weight: 700; color: #333; }
.ph-box .tag { position: absolute; left: 6px; top: 6px; max-width: calc(100% - 12px); height: 22px; padding: 0 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(17, 17, 20, .82); color: #fff; }
.ph-box .tag.stop { background: #b42318; }
.ph-box .tag.ok { background: rgba(255, 255, 255, .94); color: #15803d; }
.ph-box .tag.info { background: rgba(255, 255, 255, .94); color: #333; }
.ph-box .rank { position: absolute; left: 6px; bottom: 6px; height: 22px; min-width: 22px; padding: 0 7px 0 5px; border-radius: 6px; background: var(--acc); color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 2px; }
.ph-box .rank i { font-size: 12px; }
.pin { position: absolute; right: 2px; top: 2px; width: 44px; height: 44px; display: grid; place-items: center; }
.pin span { width: 30px; height: 30px; border-radius: 8px; background: rgba(255, 255, 255, .94); color: #333; display: grid; place-items: center; font-size: 17px; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.pin[aria-pressed="true"] span { background: var(--acc); color: #fff; }

/* 홈 */
.hero { margin-top: 18px; }
.hero .t6 { margin-top: 6px; }
.cmds { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.cmds .pr { border-radius: 0; border-bottom: 1px solid var(--line); min-height: 56px; padding: 9px 12px; }
.cmds .pr:last-child { border-bottom: 0; }
.stat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stat .c { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; text-align: left; min-height: 64px; display: flex; flex-direction: column; justify-content: center; }
.stat .k { font-size: 12px; color: var(--ink3); font-weight: 600; }
.stat .v { font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -.02em; }
.stat .v small { font-size: 13px; font-weight: 600; color: var(--ink3); margin-left: 2px; }
.recent-row { display: flex; align-items: center; gap: 10px; }

/* 결과 격자 */
.rhead { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.rhead .cnt { font-size: 13px; color: var(--ink3); white-space: nowrap; }
.ai { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 9px 12px; border-radius: 10px; background: var(--acc-soft); color: var(--acc-text); font-size: 13px; line-height: 18px; font-weight: 600; }
.ai i { font-size: 16px; flex: none; }
.ai.wait i { animation: spin 1s linear infinite; }
.ai.off { background: var(--well); color: var(--ink2); }
@keyframes spin { to { transform: rotate(360deg); } }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; margin-top: 14px; }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 16px; } }
.gc { display: grid; gap: 7px; align-content: start; position: relative; }
.gc .open-p { display: block; width: 100%; text-align: left; }
.gc .b { font-size: 12px; font-weight: 700; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gc .n { font-size: 14px; line-height: 19px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.gc .p { font-size: 15px; font-weight: 800; letter-spacing: -.01em; margin-top: 3px; display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.gc .p small { font-size: 12px; font-weight: 500; color: var(--ink3); }
.gc .why { font-size: 12px; line-height: 16px; color: var(--acc-text); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { margin-top: 26px; }
.empty .h2 { margin-top: 0; }
.alts .row .t5 { font-weight: 600; }

/* 상세 */
.pdp { margin-top: 8px; }
.pdp .photo { margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); }
.pdp .ph-box { border-radius: 0; aspect-ratio: 4 / 5; }
.pdp img.flat { width: 72%; height: 72%; }
.pdp .zoomb { position: absolute; inset: 0; width: 100%; height: 100%; cursor: zoom-in; }
.pdp .pin { right: 10px; top: 10px; }
.pdp .pin span { width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
@media (min-width: 900px) { .pdp { margin: 12px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; } .pdp .photo { margin: 0; } .pdp .ph-box { border-radius: 14px; } .pdp .pin { right: 12px; } }
.pdp-head { padding-top: 14px; }
.pdp-head .b { font-size: 13px; font-weight: 700; color: var(--ink2); }
.pdp-head h1 { font-size: 20px; line-height: 27px; font-weight: 600; margin: 2px 0 0; letter-spacing: -.015em; }
.price { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.price b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.price small { font-size: 12px; color: var(--ink3); }

<script>
(() => {
  const { M, esc, $, $$ } = K;
  const DESIGN = '한 칸으로 쇼핑';
  const UI_KEY = 'eoul-d14:ui', CHAT_KEY = 'eoul-d14:consult', REG_KEY = 'eoul-d14:reg';
  const S = { ai: {}, aiOrder: {}, aiSummary: {}, result: null, shown: null, curQ: '', pending: null, ui: { absent: {}, brand: null, group: '' } };
  try { S.ui = { ...S.ui, ...JSON.parse(localStorage.getItem(UI_KEY) || '{}') }; } catch {}
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify({ absent: S.ui.absent })); } catch {} };
  const FLAT = window.PHOTO_FLAT || new Set();
  const PIC = ['tee', 'shirt', 'knit', 'sweat', 'pants', 'jeans', 'jacket', 'coat', 'sneaker', 'loafer', 'cardigan', 'blazer'];
  const GROUPS = [['상의', ['tee', 'longtee', 'shirt', 'polo', 'knit', 'sweat']], ['하의', ['pants', 'jeans', 'skirt', 'dress']], ['아우터', ['jacket', 'blazer', 'cardigan', 'coat', 'down', 'vest']], ['신발', ['sneaker', 'loafer', 'boot']], ['그 밖', ['bag', 'cap', 'beanie', 'belt']]];
  const MOODS = [['work', '출근'], ['date', '데이트'], ['weekend', '주말·여행'], ['formal', '격식·하객']];
  const DEC = { buy: '살게요', hold: '보류', skip: '안 살래요' };
  const won = (n) => `${Number(n).toLocaleString('ko-KR')}원`;
  const josa = (w, a, b) => { const c = String(w || '').trim().slice(-1).charCodeAt(0); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? a : b; };
  const dayKey = (iso) => { if (!iso) return '날짜 없음'; const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  const whenText = (iso) => { const d = new Date(iso); const now = new Date(); return d.toDateString() === now.toDateString() ? `오늘 ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}` : `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  const isPC = () => matchMedia('(min-width: 900px)').matches;
  const mac = /Mac|iPhone|iPad/.test(navigator.platform || '');

  // ── 직접 등록한 옷(목록에 없는 상품). 서버가 없으니 이 기기에만 남고, 같은 옷을 3명이 등록해야 공유 목록에 오른다는 상태를 정직하게 보여 준다.
  let REG = {};
  try { REG = JSON.parse(localStorage.getItem(REG_KEY) || '{}') || {}; } catch { REG = {}; }
  const saveReg = () => { try { localStorage.setItem(REG_KEY, JSON.stringify(REG)); } catch {} };
  const norm = (s) => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const regOf = (gid) => REG[gid] || null;
  const regList = () => Object.entries(REG).map(([gid, r]) => ({ gid, ...r }));
  const regSimilar = (brand, name) => { const key = norm(`${brand} ${name}`); if (key.length < 2) return []; const ws = key.split(' ').filter(Boolean); return regList().filter((r) => { const k = norm(`${r.brand} ${r.name}`); return k === key || ws.every((w) => k.includes(w)); }); };
  const SHARE_LINE = '같은 옷을 3명이 등록하면 모두가 검색할 수 있어요';
  const shareState = (r) => `지금 ${r?.people || 1}/3 · 서버 연결 전에는 이 기기에만`;

  // ── 사진
  function productPic(id, { tag = '', tagCls = '', extra = '' } = {}) {
    const ph = M.photo({ id });
    const t = tag ? `<span class="tag ${tagCls}">${tag}</span>` : '';
    if (!ph) return `<span class="ph-box">${M.photoHtml({ id }, { caption: false })}${t}${extra}</span>`;
    const flat = FLAT.has(id) || K.WHITE.has(id);
    return `<span class="ph-box"><img class="${flat ? 'flat' : 'cover'}" src="${esc(ph.src)}" alt="${esc(ph.alt)}" decoding="async" loading="lazy">${t}${extra}</span>`;
  }
  function garmentPic(g) {
    if (g.productId && M.photo({ id: g.productId })) return productPic(g.productId);
    const id = K.CUT[`${g.gender || M.getState().gender || 'M'}|${g.kind}|${g.color}`]?.[0];
    if (id) { const ph = M.photo({ id }); if (ph) return `<span class="ph-box"><img class="flat" src="${esc(ph.src)}" alt="${esc(`비슷한 상품 사진 · ${g.colorLabel || ''} ${g.kindName || ''}`.trim())}" decoding="async" loading="lazy"></span>`; }
    return `<span class="ph-box" role="img" aria-label="${esc(`${g.colorLabel || ''} ${g.kindName || ''}`.trim())}"><span class="swatch"><i style="background:${esc(g.colorHex || '#ccc')}"></i><b>${esc(g.kindName || '')}</b></span></span>`;
  }
  const piecePic = (p) => { const g = p.garmentId && M.getState().closet.find((x) => x.id === p.garmentId); if (g) return garmentPic(g); if (p.product) return productPic(p.product.id); return garmentPic({ kind: p.kind, kindName: p.kindName, color: p.color, colorHex: p.colorHex, colorLabel: p.colorLabel }); };
  const pinBtn = (id) => { const on = M.compareHas(id); return `<button class="pin" data-pin="${id}" aria-pressed="${on}" aria-label="${on ? '비교에서 빼기' : '비교에 담기'}"><span><i class="${on ? 'ph-fill' : 'ph'} ph-columns"></i></span></button>`; };
  const ownedTag = (p) => { const o = p.owned; if (!o || o.tone === 'none') return ''; const cls = o.tone === 'stop' ? 'stop' : o.tone === 'new' ? 'ok' : 'info'; return `<span class="tag ${cls}">${esc(o.label)}</span>`; };

  // ── 결과 카드(사진 · 브랜드 · 품명 · 수집가 · 이유)
  function cardHtml(p, ai) {
    const why = ai?.reason || '';
    return `<div class="gc" data-card="${p.id}"><button class="open-p" data-pid="${p.id}" aria-label="${esc(p.brand)} ${esc(p.name)}">${productPic(p.id, { extra: `${ownedTag(p)}${ai ? `<span class="rank num" aria-label="AI 순위 ${ai.rank}위"><i class="ph-fill ph-sparkle"></i>${ai.rank}</span>` : ''}` })}</button>${pinBtn(p.id)}
      <button class="open-p" data-pid="${p.id}"><div class="b">${esc(p.brand)}</div><div class="n">${esc(p.name)}</div><div class="p num">${esc(p.priceText)}<small>${esc(p.priceShort)}</small></div>${why ? `<div class="why">${esc(why)}</div>` : ''}</button></div>`;
  }

  const redrawGrid = () => { if (curView !== 'results' || !S.shown) return; const g = $('#grid'); if (g) g.innerHTML = gridHtml(S.shown.main); const o = $('#offgrid'); if (o) o.innerHTML = gridHtml(S.shown.off); drawCmpPill(); };

        ${st.closet.filter((g) => g.productId).length ? `<p class="t6">내 옷장</p><div class="rail">${st.closet.filter((g) => g.productId).slice(0, 8).map((g) => `<div class="gc"><button data-used-pid="${g.productId}" aria-label="${esc(g.label)}">${productPic(g.productId)}<div class="n">${esc(g.label)}</div></button></div>`).join('')}</div>` : ''}
        ${seen.length ? `<p class="t6" style="margin-top:12px">방금 본 결과</p><div class="rail">${seen.map((p) => `<div class="gc"><button data-used-pid="${p.id}" aria-label="${esc(p.brand)} ${esc(p.name)}">${productPic(p.id)}<div class="b">${esc(p.brand)}</div><div class="n">${esc(p.name)}</div></button></div>`).join('')}</div>` : ''}
        ${recs.length ? `<p class="t6" style="margin-top:12px">기록한 옷</p><div class="rail">${recs.map((r) => `<div class="gc"><button data-used-pid="${r.productId}" aria-label="${esc(r.product?.name || '')}">${productPic(r.productId)}<div class="n">${esc(r.product?.name || '')}</div></button></div>`).join('')}</div>` : ''}
        ${!seen.length && !recs.length && !st.closet.some((g) => g.productId) ? '<p class="t6">위 칸에 상품이나 브랜드를 적으면 바로 9곳 링크를 만들어요. 결과에서 본 상품·옷장의 상품으로도 찾을 수 있어요.</p>' : ''}</section>`;
    },

    consult() {
      const th = C.thread();
      if (!th) {
        const list = [...C.threads].sort((a, b) => String(b.at).localeCompare(String(a.at)));
        return `${title('코디 상담', '옷·코디 이야기만 답해요. 내 옷장을 보고 답하고, 그 밖의 주제는 진행하지 않아요.')}
          <div class="chips">${CHAT_EX.map((x) => `<button class="chip" data-ask="${esc(x)}"><i class="ph ph-chats-circle"></i>${esc(x)}</button>`).join('')}</div>
          ${list.length ? `<section class="section"><div class="h"><h2 class="h3">이전 상담 <span class="t6 num">${list.length}</span></h2><button class="quiet" data-delall>모두 지우기</button></div>
            <div class="hist">${list.map((t) => `<div class="hrow"><button class="grow" data-thread="${t.id}"><span class="n">${esc(t.title)}</span><span class="t6">${esc(whenText(t.at))} · 주고받은 말 ${t.turns.filter((x) => x.role !== 'note').length}개 · 이어서 물어보기</span></button><button class="icon" data-delthread="${t.id}" aria-label="이 상담 지우기"><i class="ph ph-trash"></i></button></div>`).join('')}</div></section>` : '<p class="t6" style="margin-top:20px">상담 내용은 이 기기에만 남아요. 다음에 와서 이어서 물어볼 수 있어요.</p>'}
          <p class="foot">AI 답변이라 틀릴 수 있어요 · 옷·코디 주제만 답해요. 상품 가격은 수집한 날의 판매가예요.</p>`;
      }
      const body = th.turns.map((x) => {
        if (x.role === 'user') return `<div class="msg me">${esc(x.text)}</div>`;
        if (x.role === 'note') return `<div class="msg err" role="status">${esc(x.text)}</div>`;
        if (x.refused) return `<div class="msg bot refuse"><span class="who"><i class="ph ph-hand"></i>상담 범위 밖이에요</span>${esc(x.text)}</div>`;
        return `<div class="msg bot"><span class="who"><i class="ph-fill ph-sparkle"></i>AI 코디 상담</span>${esc(x.text)}</div>${x.ids?.length ? `<div class="recs">${x.ids.map(recCard).join('')}</div>` : ''}`;
      }).join('');
      return `<div class="ttl"><i class="ph ph-chats-circle" style="color:var(--ink3)"></i><span class="grow">${esc(th.title)}</span><button class="quiet" data-chatlist>이전 상담</button><button class="quiet" data-newchat><i class="ph ph-plus"></i>새 상담</button></div>
        <div class="thread" id="thread" aria-live="polite">${body}${C.busy ? '<div class="msg bot wait" role="status"><span class="who"><i class="ph ph-circle-notch"></i>생각하는 중이에요</span></div>' : ''}</div>
        <p class="foot">위 칸에 이어서 물어보세요. AI 답변이라 틀릴 수 있어요 · 옷·코디 주제만 답해요. 이 상담은 이 기기에 남아요.</p>`;
    },

    closet() {
      const { st, mine, out, brands, reg } = closetStat();
      const cands = M.compareList().map((id) => M.product(id)).filter(Boolean);
      const brandOf = (g) => regOf(g.id)?.brand || (g.productId ? M.product(g.productId)?.brand || null : null);
      const bc = new Map(); mine.forEach((g) => { const b = brandOf(g); if (b) bc.set(b, (bc.get(b) || 0) + 1); });
      const brandRows = [...bc.entries()].sort((a, b) => b[1] - a[1]);
      const bf = S.ui.brand && bc.has(S.ui.brand) ? S.ui.brand : null;
      const grp = GROUPS.find(([n]) => n === S.ui.group) || null;
      const qq = norm(S.closetQ || '');
      let shown = bf ? mine.filter((g) => brandOf(g) === bf) : mine;
      if (grp) shown = shown.filter((g) => grp[1].includes(g.kind));
      if (qq) shown = shown.filter((g) => norm(`${g.label} ${g.kindName} ${g.colorLabel} ${brandOf(g) || ''}`).includes(qq));
      const gt = (g) => { const b = brandOf(g); const miss = g.detailMissing; const r = regOf(g.id); const n = M.closetOutfits({ detail: true }).list.filter((o) => o.pieces.some((x) => x.garmentId === g.id)).length; return `<button class="gt" data-g="${g.id}" aria-label="${esc(g.label)}">${garmentPic(g)}<span class="n">${esc(g.label)}</span><span class="m${miss ? ' miss' : ''}">${esc(miss ? `${miss} · 눌러서 채우기` : `${b || g.colorLabel}${g.trial ? ' · 체험용' : r ? ' · 직접 등록 1/3' : ''} · 코디 ${n}`)}</span></button>`; };
      if (!mine.length) {
        return `${title('옷장이 비어 있어요', '비워 둬도 찾고 살 수 있어요. 3벌만 넣으면 겹치는 옷과 코디를 알려 드려요.')}
          <div class="card" style="margin-top:14px"><h2 class="h3">브랜드나 상품명으로 찾아서 ‘가지고 있어요’</h2><p class="t6" style="margin:4px 0 0">이 앱이 아는 상품 ${M.catalog.count}개 안에서 찾아요. 없으면 직접 등록할 수 있어요(사진 없이 브랜드·이름·종류·색).</p>
          <div class="chips">${addExamples().map((b) => `<button class="chip" data-add-q="${esc(b)}"><i class="ph ph-plus"></i>${esc(b)}</button>`).join('')}</div>
          <button class="btn go wide" data-add-open style="margin-top:14px"><i class="ph ph-plus"></i>옷장에 넣기</button>
          <div style="display:flex;gap:14px;margin-top:6px"><button class="quiet" data-trial>체험용 옷장으로 먼저 보기</button><button class="quiet" data-reg-open>직접 등록</button></div></div>
          ${cands.length ? `<section class="section"><div class="h"><h2 class="h3">비교에 담은 후보 <span class="t6 num">${cands.length}</span></h2>${cands.length >= 2 ? '<button class="quiet" data-go-compare>나란히 보기</button>' : ''}</div><div class="rail">${cands.map((p) => cardHtml(p, null)).join('')}</div></section>` : ''}`;
      }
      return `${title(`옷 <span class="num">${mine.length}</span>벌${out ? ` · 코디 <span class="num">${out}</span>가지` : ''}`, out ? '종류·색 기준으로 규칙이 센 숫자예요. 한 벌 더 넣으면 조합이 늘어요.' : '상의·하의·신발이 한 벌씩 모이면 입을 수 있는 조합을 세어 드려요.')}
        <div class="stat"><button class="c" data-go-looks><span class="k">입을 수 있는 코디</span><span class="v num">${out}<small>가지</small></span></button><button class="c" data-brand=""><span class="k">모은 브랜드</span><span class="v num">${brands}<small>개</small></span></button><button class="c" data-reg-open><span class="k">직접 등록</span><span class="v num">${reg}<small>벌</small></span></button></div>
        ${st.trialCount ? `<div class="notice"><i class="ph ph-info"></i><span class="grow">체험용 옷 ${st.trialCount}벌이 섞여 있어요 · 내 옷을 넣으면 내려도 돼요</span><button data-mine>내리기</button></div>` : ''}
        ${reg ? `<div class="notice"><i class="ph ph-users-three"></i><span class="grow">직접 등록 ${reg}벌 · ${SHARE_LINE} (지금 각 1/3 · 서버 연결 전에는 이 기기에만)</span></div>` : ''}
        ${cands.length ? `<section class="section"><div class="h"><h2 class="h3">비교에 담은 후보 <span class="t6 num">${cands.length}</span></h2>${cands.length >= 2 ? '<button class="quiet" data-go-compare>나란히 보기</button>' : ''}</div><div class="rail">${cands.map((p) => cardHtml(p, null)).join('')}</div></section>` : ''}
        <div class="seg scroll" role="group" aria-label="종류" style="margin-top:20px"><button data-group="" aria-pressed="${!grp}">전체 <span class="num">${mine.length}</span></button>${GROUPS.map(([n, ks]) => { const c = mine.filter((g) => ks.includes(g.kind)).length; return c ? `<button data-group="${n}" aria-pressed="${grp?.[0] === n}">${n} <span class="num">${c}</span></button>` : ''; }).join('')}</div>
        ${brandRows.length ? `<div class="chips scroll" aria-label="브랜드">${brandRows.map(([b, n]) => `<button class="chip ${bf === b ? 'on' : ''}" data-brand="${esc(b)}" aria-pressed="${bf === b}">${esc(b)} <span class="num">${n}</span></button>`).join('')}</div>` : ''}
        ${shown.length ? `<div class="shelf">${[...shown].reverse().map(gt).join('')}</div>` : `<div class="empty"><h2 class="h3">${qq ? `‘${esc(S.closetQ)}’에 맞는 옷이 없어요` : '이 조건의 옷이 없어요'}</h2><p class="t6">필터를 풀거나 다른 말로 찾아 보세요.</p></div>`}
        <p class="foot">상품으로 넣은 옷은 판매처 사진, 종류·색으로 넣은 옷은 비슷한 상품 사진이에요. 사진이 없으면 색으로 보여 드려요. 코디 수는 이 옷이 든 조합 수(체험용 포함)예요.</p>`;
    },

    add({ q: text = '' } = {}) {
      return `<p class="t6" style="margin-top:12px">이 앱이 아는 상품 <b class="num" style="color:var(--ink)">${M.catalog.count}개</b>(${esc(M.catalog.store)} · ${esc(M.catalog.checkedLabel)}) 안에서 찾아요. 모든 상품이 있지는 않아요.</p>
        <div id="ares"></div>
        <div class="reg" id="regbox"><div class="h3">목록에 없어요?</div><p class="t6" style="margin:4px 0 0">사진 없이 브랜드·이름·종류·색만 적어 직접 등록해요. 바로 내 옷장에 들어가고, ${SHARE_LINE}.</p><button class="btn line wide sm" data-reg-open="${esc(text)}" style="margin-top:10px"><i class="ph ph-pencil-simple"></i>직접 등록</button><button class="quiet" data-addkind style="margin-top:4px"><i class="ph ph-palette"></i>브랜드 없이 종류·색으로만 넣기</button></div>`;
    },

    looks({ mood = '' } = {}) {
      const st = M.getState(); const mine = st.closet;
      if (!mine.length) {
        return `${title('내 옷으로 코디', '상의·하의·신발 3벌만 넣으면 입을 수 있는 조합과 ‘한 벌만 더 있으면’을 보여 드려요.')}
          <div class="card" style="margin-top:14px"><div class="chips" style="margin-top:0">${addExamples().map((b) => `<button class="chip" data-add-q="${esc(b)}"><i class="ph ph-plus"></i>${esc(b)}</button>`).join('')}</div><div style="display:flex;gap:14px;margin-top:6px"><button class="quiet" data-add-open><i class="ph ph-plus"></i>옷장에 넣기</button><button class="quiet" data-trial>체험용 옷장으로 먼저 보기</button></div></div>`;
      }
      const avail = MOODS.map(([id, label]) => [id, label, moodAsk(label)]).filter((m) => m[2]);
      const cur = avail.find((m) => m[0] === mood) || null;
      const seg = `<div class="seg scroll" role="tablist" aria-label="상황" style="margin-top:12px"><button role="tab" data-mood="" aria-selected="${!cur}">내 옷 전체</button>${avail.map(([id, label]) => `<button role="tab" data-mood="${id}" aria-selected="${cur?.[0] === id}">${esc(label)}</button>`).join('')}</div>`;
      if (!cur) {
        const d = M.closetOutfits({ detail: true });
        const seen = new Set(); const list = d.list.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 10);
        const sg = M.suggest({ limit: 3 }); const sgRows = sg.basis === 'closet' ? sg.items : [];
        return `${title(`내 옷 ${mine.length}벌로 <span class="num">${d.total}</span>가지`, d.total ? `코디 공식 ${d.formulas}개 · 기본 조합 ${d.basic}개 · 종류·색 기준${st.trialCount ? ' · 체험용 포함' : ''}` : '상의·하의·신발이 한 벌씩 있으면 조합이 생겨요')}
          ${seg}
          ${list.length ? `<div style="margin-top:12px">${list.map((o) => lookHtml(o, { sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : `<div class="empty"><h2 class="h2">아직 조합이 없어요</h2><p class="t5 sub" style="margin-top:6px">상의·하의·신발을 한 벌씩 넣으면 바로 세어 드려요.</p><button class="btn line sm" data-add-open style="margin-top:12px"><i class="ph ph-plus"></i>옷장에 넣기</button></div>`}
          ${sgRows.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2><span class="t6">내 옷과 함께 쓰는 코디 공식</span></div>${sgRows.map((p) => sgRow(p)).join('')}<p class="t7" style="margin-top:8px">규칙으로 고른 실제 상품이에요. 가격은 수집한 날의 판매가예요.</p></section>` : ''}
          <p class="foot">${esc(d.note)}</p>`;
      }
      const r = cur[2]; const o = r.outfit;
      const cands = o ? o.pieces.filter((x) => !x.owned && x.product) : [];
      const condText = (r.conditions || []).map((c) => c.label).join(' · ');
      return `${title(`${esc(cur[1])} 코디`, o ? (o.buyCount ? `내 옷 ${o.ownedCount}벌에 ${o.buyCount}벌만 더하면 돼요` : `내 옷 ${o.ownedCount}벌로 입을 수 있어요`) : '내 옷으로는 아직 맞는 코디 공식이 없어요')}
        ${seg}
        ${o ? `<div style="margin-top:12px">${lookHtml(o, { sub: esc(condText), owned: !o.buyCount })}</div>` : `<div class="empty" style="margin-top:20px"><p class="t5 sub">${esc(r.outfitNote || `${cur[1]} 조건에 맞는 코디 공식이 내 옷만으로는 아직 없어요. 조건을 풀지 않았어요.`)}</p></div>`}
        ${cands.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2><span class="t6">${esc(condText)} 안에서 고름</span></div>${cands.map((x) => sgRow(M.product(x.product.id) || x.product, `${cur[1]} 코디의 ${x.kindName} 자리`)).join('')}</section>` : ''}
        ${r.products.length ? `<button class="row" data-q="${esc(r.text)}" style="margin-top:8px"><span class="grow t5" style="font-weight:600">${esc(cur[1])} 조건에 맞는 옷 ${r.products.length}개 더 보기</span><i class="ph ph-caret-right arr"></i></button>` : ''}
        <p class="foot">조합은 정해 둔 코디 공식과 종류·색 규칙으로 고른 예시예요. 핏·소재·현재 가격은 판매처에서 확인해요.</p>`;
    },

    compare() {
      const ids = M.compareList();
      if (ids.length < 2) return `${title('두 개 이상 담으면 나란히 봐요', `결과 사진 모서리의 비교 버튼을 눌러 담아 주세요. 지금 ${ids.length}개 담겨 있어요.`)}`;
      const c = M.compareRows(ids);
      const head = c.items.map((it) => `<th scope="col"><button data-pid="${it.id}" style="display:block;width:100%;text-align:left">${productPic(it.id)}<div class="n">${esc(it.brand)} ${esc(it.name)}</div></button><button class="rm" data-unpin="${it.id}">빼기</button></th>`).join('');
      const rows = (list) => list.map((r) => `<tr class="${r.same ? 'same' : ''}"><th scope="row">${esc(r.label)}</th>${r.values.map((v) => `<td class="num">${esc(v)}</td>`).join('')}</tr>`).join('');
      return `${title(`비교 ${ids.length}개`, esc(c.note))}
        <div class="cmp" id="cmp"><table><colgroup><col style="width:72px">${c.items.map(() => '<col>').join('')}</colgroup><thead><tr><th scope="col"><span class="t6">항목</span></th>${head}</tr></thead><tbody>${rows([...c.rows.filter((r) => !r.same), ...c.rows.filter((r) => r.same)])}</tbody></table></div>
        <p class="t7" style="margin-top:8px">흐린 줄은 값이 모두 같은 항목이에요.</p>`;
    },

    records() {
      const all = M.getState().records.filter((r) => r.decision);
      const decided = all.filter((r) => r.decision !== 'hold');
      const buy = all.filter((r) => r.decision === 'buy'); const holds = all.filter((r) => r.decision === 'hold');
      const sum = buy.reduce((a, r) => a + (r.product?.price || 0), 0);
      const waiting = buy.filter((x) => ['candidate', 'ordered', 'received'].includes(x.stage));
      const byDay = new Map(); all.forEach((r) => { const k = dayKey(r.updatedAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(r); });
      const stage = (r) => r.decision === 'buy' ? (r.stage === 'candidate' ? '주문 전' : r.stageLabel) : (r.stage === 'candidate' ? '' : r.stageLabel);
      return `${title(decided.length ? `<span class="num">${decided.length}</span>벌을 정했어요` : holds.length ? `보류 <span class="num">${holds.length}</span>벌` : '아직 정한 옷이 없어요', all.length ? '직접 남긴 기록이에요. 보류는 정한 것으로 세지 않아요.' : '상품 상세에서 살게요·보류·안 살래요를 누르면 여기에 남아요.')}
        ${all.length ? `<div class="stat"><div class="c"><span class="k">살게요</span><span class="v num">${buy.length}${sum ? `<small>${won(sum)} 수집가</small>` : ''}</span></div><div class="c"><span class="k">보류</span><span class="v num">${holds.length}</span></div><div class="c"><span class="k">안 살래요</span><span class="v num">${all.length - buy.length - holds.length}</span></div></div>` : ''}
        ${waiting.length ? `<section class="section"><div class="h"><h2 class="h3">사기로 한 옷</h2><span class="t6">받고 계속 입으면 옷장에 들어가요</span></div>${waiting.map((x) => { const nx = (x.next || []).find((n) => !n.needsReason); return `<div class="rec">${productPic(x.productId)}<span class="grow"><span class="n">${esc(x.product?.name || '')}</span><span class="t6">${esc(x.stageLabel)}</span></span>${nx ? `<button class="btn sm ${nx.step === 'kept' ? 'go' : 'soft'}" data-adv="${x.productId}" data-step="${nx.step}">${nx.step === 'kept' ? '계속 입을게요' : esc(nx.label)}</button>` : ''}</div>`; }).join('')}</section>` : ''}
        ${[...byDay.entries()].map(([d, rs]) => `<div class="day">${esc(d)}</div>${rs.map((r) => `<button class="rec" data-pid="${r.productId}">${productPic(r.productId)}<span class="grow"><span class="n">${esc(r.product?.name || '')}</span><span class="t6"><span class="badge ${r.decision === 'buy' ? 'ok' : ''}">${DEC[r.decision]}</span>${stage(r) ? ` ${esc(stage(r))}` : ''}</span></span><span class="pr num">${esc(r.product?.priceText || '')}</span></button>`).join('')}`).join('') || '<button class="btn soft wide" data-tabgo="home" style="margin-top:20px">옷 찾으러 가기</button>'}`;
    },
  };

  // ── 상세의 결정: 아래 바 = 가격·수집가 + 결정 세그먼트(살게요·보류·안 살래요) + 판매처 링크.

    const with_ = M.closetOutfits({ detail: true }).list.filter((o) => o.pieces.some((x) => x.garmentId === id));
    const seen = new Set(); const sets = with_.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 2);
    const sh = sheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:12px"><span style="width:84px;display:block;flex:none">${garmentPic(g)}</span><div style="min-width:0"><h2 class="h2" style="margin:0">${esc(g.label)}</h2><div class="t6">${esc([brand, g.color ? g.colorLabel : null, g.kindName, g.trial ? '체험용' : r ? '직접 등록' : g.productId ? '판매처 사진' : '비슷한 상품 사진'].filter(Boolean).join(' · '))}</div>${r?.url ? `<a class="quiet" href="${esc(r.url)}" target="_blank" rel="noopener" style="min-height:28px">판매처 링크<i class="ph ph-arrow-up-right"></i></a>` : ''}</div></div>
      ${r ? `<div class="share"><b>공유 목록 대기 <span class="dots"><i class="on"></i><i></i><i></i></span>1/3</b>${SHARE_LINE} · ${shareState(r)}</div>` : ''}
      ${g.detailMissing === '색 미확인' ? `<div class="notice" style="margin:12px 0 0"><i class="ph ph-palette"></i><span class="grow">색을 알려 주시면 코디에 셀 수 있어요</span><button data-gcolor>색 고르기</button></div>` : ''}
      <h3 class="h3" style="margin:14px 0 4px">이 옷으로 입을 수 있는 코디 <span class="num acc">${with_.length}</span>가지</h3>
      ${sets.length ? `<div style="margin-top:8px">${sets.map((o) => lookHtml(o, { sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : `<p class="t6">${g.detailMissing ? '색을 채우면 조합을 셀 수 있어요.' : '상의·하의·신발이 한 벌씩 있으면 조합이 생겨요.'}</p>`}
      <div style="display:flex;gap:8px;margin-top:16px">${g.productId ? `<button class="btn line sm" data-used-pid="${g.productId}" style="flex:1"><i class="ph ph-recycle"></i>중고로 찾기</button>` : ''}${g.detailMissing !== '색 미확인' ? '<button class="btn line sm" data-gcolor style="flex:1">색 바꾸기</button>' : ''}<button class="btn soft sm" data-rm style="flex:1">옷장에서 빼기</button></div>`);
    $$('[data-gcolor]', sh.s).forEach((b) => { b.onclick = async () => { await sh.close(); pickColor(id, g.kindName, g.color); }; });
    $$('[data-used-pid]', sh.s).forEach((b) => { b.addEventListener('click', () => sh.close(), { once: true }); });
    $('[data-rm]', sh.s).onclick = async () => { try { M.removeGarment(id); if (REG[id]) { delete REG[id]; saveReg(); } await sh.close(); K.refresh(); } catch (err) { K.toast(err.message, { bottom: 64 }); } };
  }
  function pickColor(gid, kindName, current = null, done = null) {
    const sh = sheet(`<h2 class="h2">${esc(kindName)}${josa(kindName, '은', '는')} 무슨 색이에요?</h2>${colorGrid(current)}`);
    $$('[data-c]', sh.s).forEach((b) => { b.onclick = async () => { M.updateGarment(gid, { color: b.dataset.c }); await sh.close(); if (done) done(); else K.refresh(); }; });
    return sh;
  }
  function confirmSheet(title, sub, okLabel, onOk) {
    const sh = sheet(`<h2 class="h2">${esc(title)}</h2><p class="t6">${esc(sub)}</p><div class="decs"><button class="btn go" data-ok>${esc(okLabel)}</button><button class="btn soft" data-no>그대로 둘게요</button></div>`);
    $('[data-ok]', sh.s).onclick = async () => { await sh.close(); onOk(); };
    $('[data-no]', sh.s).onclick = () => sh.close();
  }
  function menu() {
    const sh = sheet(`<div class="menu"><button class="row" data-info><span class="grow t5">이 시안에 대해</span><i class="ph ph-info arr"></i></button><button class="row" data-theme><span class="grow t5">밝게 · 어둡게</span><i class="ph ph-moon arr"></i></button><button class="row" data-reset style="border-bottom:0"><span class="grow t5">처음부터 다시</span><i class="ph ph-arrow-counter-clockwise arr"></i></button></div><p class="t7" style="margin-top:10px">PC에서는 ${mac ? '⌘K' : 'Ctrl K'} 또는 /로 칸을 열고, ↑↓로 고르고, Enter로 실행해요.</p>`);
    $('[data-info]', sh.s).onclick = async () => { await sh.close(); M.openDisclosure ? M.openDisclosure() : K.info(DESIGN); };
    $('[data-theme]', sh.s).onclick = async () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; await sh.close(); };
    $('[data-reset]', sh.s).onclick = async () => { K.reset(); S.ai = {}; S.aiOrder = {}; S.ui = { absent: {}, brand: null, group: '' }; saveUi(); REG = {}; saveReg(); S.closetQ = ''; await sh.close(); K.tab('home'); };
  }

  // ── 옷장 넣기(브랜드·품명 검색) + 직접 등록
  function renderAddResults(text) {
    const box = $('#ares'); if (!box) return;
    const t = String(text || '').trim();
    const mine = M.getState().closet; const has = (id) => mine.find((g) => g.productId === id);
    $('#regbox [data-reg-open]')?.setAttribute('data-reg-open', t);
    if (!t) {
      const recent = [...mine].slice(-3).reverse();
      box.innerHTML = `<div class="chips">${addExamples().map((b) => `<button class="chip" data-aq="${esc(b)}"><i class="ph ph-magnifying-glass"></i>${esc(b)}</button>`).join('')}</div>
        ${recent.length ? `<section class="section"><div class="h"><h2 class="h3">최근 넣은 옷</h2></div>${recent.map((g) => `<div class="srow">${garmentPic(g)}<span class="grow"><span class="n">${esc(g.label)}</span><span class="m">${esc(g.detailMissing || (regOf(g.id) ? `직접 등록 · 공유 목록 1/3` : g.sourceLabel))}</span></span></div>`).join('')}</section>` : ''}`;
      $$('[data-aq]', box).forEach((b) => { b.onclick = () => { q().value = b.dataset.aq; $('#clr').hidden = false; renderAddResults(b.dataset.aq); }; });
      return;
    }
    let hits = [];
    try { hits = M.findProducts(t, { limit: 20 }); } catch {}
    const regs = regList().filter((r) => norm(`${r.brand} ${r.name}`).includes(norm(t)));
    const regHtml = regs.length ? `<section class="section" style="margin-top:14px"><div class="h"><h2 class="h3">직접 등록한 옷</h2><span class="t6">이 기기에만</span></div>${regs.map((r) => { const g = mine.find((x) => x.id === r.gid); return g ? `<div class="srow done">${garmentPic(g)}<span class="grow"><span class="b">${esc(r.brand)}</span><span class="n">${esc(r.name)}</span><span class="m">공유 목록 1/3 · ${SHARE_LINE}</span></span><span class="ok"><i class="ph-fill ph-check-circle"></i>옷장에 있어요</span></div>` : ''; }).join('')}</section>` : '';
    if (!hits.length) { box.innerHTML = `<div class="empty" style="margin-top:20px"><h2 class="h2">‘${esc(t)}’로 찾은 상품이 없어요</h2><p class="t5 sub" style="margin-top:6px">아는 상품 ${M.catalog.count}개 안에서만 찾을 수 있어요. 브랜드만 적거나 한 단어로 줄여 보세요. 없으면 아래에서 직접 등록해요.</p></div>${regHtml}`; return; }
    const g0 = M.getState().gender;
    box.innerHTML = `<p class="t6" style="margin-top:12px">${hits.length}개${hits.length >= 20 ? ' 이상' : ''} · 브랜드·품명에 적은 말이 모두 든 상품</p>
      ${hits.map((p) => { const g = has(p.id); return `<div class="srow${g ? ' done' : ''}" data-srow="${p.id}"><button data-pid="${p.id}" style="flex:none;width:56px" aria-label="${esc(p.brand)} ${esc(p.name)} 자세히">${productPic(p.id)}</button><span class="grow"><span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="m">${esc(p.colorFromPhoto ? p.kindName : `${p.colorLabel} ${p.kindName}`)}${p.gender !== g0 ? ` · ${p.gender === 'F' ? '여성' : '남성'}` : ''}</span></span>${g ? '<span class="ok"><i class="ph-fill ph-check-circle"></i>옷장에 있어요</span>' : `<button class="btn line sm" data-own-add="${p.id}">가지고 있어요</button>`}</div>`; }).join('')}${regHtml}`;
  }
  function drawShelf({ pop = false } = {}) {
    const st = M.getState(); const mine = st.closet;
    const out = mine.length ? M.closetOutfits().total : 0;
    const last = [...mine].slice(-4);
    $('#bar').innerHTML = `<div class="shelfbar" id="shelf"><div class="in"><span class="ths" aria-hidden="true">${last.map((g) => garmentPic(g)).join('')}${last.length < 4 ? '<span class="ph-box empty"></span>' : ''}</span><span class="grow"><b class="num">옷 ${mine.length}벌</b> · ${out ? `코디 ${out}가지` : '코디는 3종류부터'}</span><button class="btn sm go" data-tabgo="closet">옷장 보기</button></div></div>`;
    if (pop && !K.reduce) $('#shelf .grow')?.animate([{ transform: 'translateY(4px)', opacity: .4 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: K.SPRING.css });
  }
  function ownAdd(id) {
    const p = M.product(id); if (!p) return;
    const before = M.getState().closetCount ? M.closetOutfits().total : 0;
    let g;
    try { g = M.addOwnedProduct(id); } catch (err) { K.toast(err.message, { bottom: 80 }); return; }
    const finish = () => {
      const gain = M.closetOutfits().total - before;
      const row = $(`.srow[data-srow="${id}"]`);
      if (row) {
        const from = row.querySelector('.ph-box')?.getBoundingClientRect();
        drawShelf({ pop: true });
        const to = $('#shelf .ths .ph-box:last-child'); if (from && to) K.fly(productPic(id), from, to, { radius: 6 });
        row.classList.add('done');
        const ok = document.createElement('span'); ok.className = 'ok'; ok.setAttribute('role', 'status'); ok.innerHTML = `<i class="ph-fill ph-check-circle"></i>${gain > 0 ? `넣었어요 · 코디 +${gain}` : '옷장에 넣었어요'}`;
        row.querySelector('[data-own-add]')?.replaceWith(ok);
      } else { if (curView === 'add') drawShelf({ pop: true }); else K.refresh(); K.toast(gain > 0 ? `옷장에 넣었어요 · 코디 +${gain}` : '옷장에 넣었어요', { bottom: 64 }); }
    };
    if (!g.color) { pickColor(g.id, p.kindName, null, finish); return; }
    finish();
  }
  // 직접 등록: 브랜드 · 상품명 · 종류 · 색 · (선택) 판매처 링크. 사진은 받지 않는다(기기 밖으로 나가지 않음).
  function regSheet(seed = '') {
    const g0 = M.getState().gender || 'M';
    const words = seed.trim().split(/\s+/).filter(Boolean);
    const kinds = (g) => M.kindChoices(g);
    const form = (g) => `<div class="field"><label for="rg-brand">브랜드</label><input id="rg-brand" value="${esc(words[0] || '')}" placeholder="예: 유니클로" autocomplete="off"></div>
      <div class="field"><label for="rg-name">상품명</label><input id="rg-name" value="${esc(words.slice(1).join(' '))}" placeholder="예: 에어리즘 코튼 크루넥 티셔츠" autocomplete="off"></div>
      <div class="field"><label for="rg-kind">종류</label><select id="rg-kind"><option value="">골라 주세요</option>${kinds(g).map((k) => `<option value="${k.id}">${esc(k.name)}</option>`).join('')}</select></div>
      <div class="field"><label>색</label><div id="rg-colors">${colorGrid(null).replace('style="margin-top:12px"', '')}</div></div>
      <div class="field"><label for="rg-url">판매처 링크 (선택)</label><input id="rg-url" type="url" inputmode="url" placeholder="https://" autocomplete="off"></div>`;
    const sh = sheet(`<h2 class="h2">직접 등록</h2><p class="t6" style="margin:4px 0 0">사진은 받지 않아요(기기 밖으로 나가지 않아요). 바로 내 옷장에 들어가고, ${SHARE_LINE}.</p>
      <div class="seg" role="group" aria-label="성별 상품" style="margin-top:12px"><button data-rg-g="M" aria-pressed="${g0 === 'M'}">남성</button><button data-rg-g="F" aria-pressed="${g0 === 'F'}">여성</button></div>
      <div id="rg-dup"></div>
      <form class="form" id="rg-form">${form(g0)}<button class="btn go wide" type="submit" style="margin-top:4px"><i class="ph ph-plus"></i>내 옷장에 넣기 · 공유 목록에 올리기</button></form>`);
    let gender = g0, color = null;
    const el = (s) => $(s, sh.s);
    const bindColors = () => $$('#rg-colors [data-c]', sh.s).forEach((b) => { b.type = 'button'; b.onclick = () => { color = b.dataset.c; $$('#rg-colors [data-c]', sh.s).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); }; });
    bindColors();
    $$('[data-rg-g]', sh.s).forEach((b) => { b.onclick = () => { gender = b.dataset.rgG; $$('[data-rg-g]', sh.s).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); const kind = el('#rg-kind'); const cur = kind.value; kind.innerHTML = `<option value="">골라 주세요</option>${kinds(gender).map((k) => `<option value="${k.id}"${k.id === cur ? ' selected' : ''}>${esc(k.name)}</option>`).join('')}`; }; });
    // 중복 힌트: 이 기기에서 등록한 옷, 또는 아는 상품 목록에 이미 있는 상품.
    let dt;
    const dup = () => {
      const brand = el('#rg-brand').value.trim(), name = el('#rg-name').value.trim();
      const box = el('#rg-dup'); if (!box) return;
      if (!brand && !name) { box.innerHTML = ''; return; }
      const sim = regSimilar(brand, name);
      let hits = []; try { hits = `${brand} ${name}`.trim().length >= 2 ? M.findProducts(`${brand} ${name}`, { limit: 2 }) : []; } catch {}
      box.innerHTML = `${sim.length ? `<div class="notice" style="margin-top:12px"><i class="ph ph-question"></i><span class="grow">비슷한 등록이 있어요? ‘${esc(sim[0].brand)} ${esc(sim[0].name)}’을 이미 이 기기에서 등록했어요(1/3). 같은 옷이면 두 번 넣지 않아도 돼요.</span></div>` : ''}${hits.length ? `<div class="notice" style="margin-top:12px"><i class="ph ph-magnifying-glass"></i><span class="grow">목록에 비슷한 상품이 있어요: ${esc(hits[0].brand)} ${esc(hits[0].name)} → 찾아서 ‘가지고 있어요’로 넣으면 판매처 사진이 붙어요.</span><button type="button" data-rg-find="${esc(`${brand} ${name}`.trim())}">찾기</button></div>` : ''}`;
      $$('[data-rg-find]', sh.s).forEach((b) => { b.onclick = async () => { await sh.close(); if (curView === 'add') { q().value = b.dataset.rgFind; $('#clr').hidden = false; renderAddResults(b.dataset.rgFind); } else K.go('add', { q: b.dataset.rgFind }); }; });
    };
    ['#rg-brand', '#rg-name'].forEach((s) => { el(s).oninput = () => { clearTimeout(dt); dt = setTimeout(dup, 160); }; });
    dup();
    el('#rg-form').onsubmit = async (e) => {
      e.preventDefault();
      const brand = el('#rg-brand').value.trim(), name = el('#rg-name').value.trim(), kind = el('#rg-kind').value, url = el('#rg-url').value.trim();
      if (!brand) { el('#rg-brand').focus(); K.toast('브랜드를 적어 주세요', { bottom: 24 }); return; }
      if (!name) { el('#rg-name').focus(); K.toast('상품명을 적어 주세요', { bottom: 24 }); return; }
      if (!kind) { el('#rg-kind').focus(); K.toast('종류를 골라 주세요', { bottom: 24 }); return; }
      if (!color) { K.toast('색을 골라 주세요', { bottom: 24 }); return; }
      if (url && !/^https?:\/\//.test(url)) { el('#rg-url').focus(); K.toast('링크는 https://로 시작해야 해요', { bottom: 24 }); return; }
      const before = M.getState().closetCount ? M.closetOutfits().total : 0;
      let g;
      try { g = M.addGarment({ kind, color, slot: M.slotChoices(kind, gender)[0]?.id || null, gender, label: name.slice(0, 80) }); } catch (err) { K.toast(err.message, { bottom: 24 }); return; }
      REG[g.id] = { brand, name, kind, color, url: url || null, gender, people: 1, at: new Date().toISOString() }; saveReg();
      const gain = M.closetOutfits().total - before;
      await sh.close();
      if (curView === 'add') { renderAddResults(q().value); drawShelf({ pop: true }); } else K.refresh();
      const done = sheet(`<div style="display:flex;gap:14px;align-items:center"><span style="width:72px;display:block;flex:none">${garmentPic(M.getState().closet.find((x) => x.id === g.id) || g)}</span><div style="min-width:0"><h2 class="h2" style="margin:0">내 옷장에 넣었어요</h2><div class="t6">${esc(brand)} · ${esc(name)}${gain > 0 ? ` · 코디 +${gain}` : ''}</div></div></div>
        <div class="share" role="status"><b>공유 목록 대기 <span class="dots"><i class="on"></i><i></i><i></i></span>1/3</b>${SHARE_LINE} (지금 1/3 · 서버 연결 전에는 이 기기에만)</div>
        <p class="t7" style="margin-top:10px">사진이 없는 옷은 같은 종류·색의 비슷한 상품 사진으로 보여 드려요. 판매처 사진·가격은 공유 목록에 오른 뒤 확인해요.</p>
        <div class="decs"><button class="btn go" data-ok-closet>옷장 보기</button><button class="btn soft" data-ok-more>한 벌 더 등록</button></div>`);
      $('[data-ok-closet]', done.s).onclick = async () => { await done.close(); K.tab('closet'); };
      $('[data-ok-more]', done.s).onclick = async () => { await done.close(); regSheet(''); };
    };
  }

  // ── 시작
  const r0 = M.route.current();
  K.start(render, { view: 'home', params: {} });
  if (M.boot?.q) K.go('results', { q: M.boot.q });
  else if (/^\/p\/.+/.test(r0.path)) K.go('detail', { id: r0.path.slice(3) });
  else if (r0.path === '/search' && r0.params.q) K.go('results', { q: r0.params.q });
  else if (['/closet', '/records'].includes(r0.path)) K.tab(r0.path.slice(1));
  else if (['/consult', '/looks', '/used', '/add', '/compare'].includes(r0.path)) K.go(r0.path.slice(1), {});
})();
</script>
