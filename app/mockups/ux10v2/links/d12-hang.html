<style>
/* 걸어 보고 사기(d12): 장바구니 대신 '걸어 보기'. 레일은 옷걸이 탭에만 있고, 다른 화면에는 걸린 옷이 있을 때만 한 줄 띠가 보인다.
   강조색은 가격표(택)의 주황 하나. 글자 단계 30 · 22 · 17 · 15 · 13. 고정 영역: 위 44 + 띠 34 + 탭 48 = 126px(844px의 14.9%). */
:root {
  --bg: #fbfbfa; --surface: #ffffff; --well: #f0f0ed; --tile: #ededea; --ptile: #efefec;
  --ink: #1b1b19; --ink2: #55554f; --ink3: #7c7c75; --line: #e2e2de;
  --acc: #e4571e; --acc-text: #b23c0b; --acc-soft: #fdebe2; --btn-bg: #c94612; --btn-fg: #ffffff;
  --dim: rgba(0, 0, 0, .45); --shadow: 0 10px 28px rgba(40, 30, 20, .12);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --r: 14px; --gutL: max(16px, env(safe-area-inset-left, 0px)); --gutR: max(16px, env(safe-area-inset-right, 0px));
  --top: 44px; --tabs: 48px; --strip: 34px; --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141412; --surface: #1c1c19; --well: #252521; --tile: #2b2b27; --ptile: #e6e6e2;
  --ink: #f3f3ef; --ink2: #c8c8c0; --ink3: #9a9a92; --line: #31312c;
  --acc: #ff6b2c; --acc-text: #ff9a6b; --acc-soft: #3a2116; --btn-bg: #ff7a3d; --btn-fg: #1b0c05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1c1c19; --well: #252521; --tile: #2b2b27; --ptile: #e6e6e2;
  --ink: #f3f3ef; --ink2: #c8c8c0; --ink3: #9a9a92; --line: #31312c;
  --acc: #ff6b2c; --acc-text: #ff9a6b; --acc-soft: #3a2116; --btn-bg: #ff7a3d; --btn-fg: #1b0c05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 400 16px/1.55 var(--font); letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; --k-font: var(--font); --k-toast-bg: var(--ink); --k-toast-fg: var(--bg); --k-info-bg: var(--surface); --k-info-fg: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.ph, .ph-fill { line-height: 1; }
.num { font-variant-numeric: tabular-nums; }
.nw { white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; padding: 0 var(--gutR) calc(var(--tabs) + 24px + var(--sab)) var(--gutL); }
.app.strip-on { padding-bottom: calc(var(--tabs) + var(--strip) + 24px + var(--sab)); }
.app.bar { padding-bottom: calc(112px + var(--sab)); }
.app.chat { padding-bottom: calc(var(--tabs) + 84px + var(--sab)); }
.app.pin { padding-bottom: calc(var(--tabs) + 88px + var(--sab)); }
.view { animation: in 240ms ease-out both; }
.view.back { animation-name: inback; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes inback { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.h1 { font-size: 30px; line-height: 38px; font-weight: 800; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.h2 { font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.h3 { font-size: 17px; line-height: 25px; font-weight: 700; margin: 0; }
.t5 { font-size: 15px; line-height: 22px; }
.t6 { font-size: 13px; line-height: 19px; color: var(--ink3); }
.sub { color: var(--ink2); }
.acc { color: var(--acc-text); }

/* 위쪽 막대(44px). 결과에서는 내리면 숨고 올리면 나온다. */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; height: var(--top); display: flex; align-items: center; gap: 2px; margin: 0 -6px; background: var(--bg); box-shadow: 22px 0 0 var(--bg), -22px 0 0 var(--bg); transition: transform 200ms ease; }
.top.hide { transform: translateY(-110%); }
.top .sp { flex: 1; }
.icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--ink); flex: none; }
.icon.quiet-i { font-size: 20px; color: var(--ink3); width: 36px; }
.icon:active { background: var(--well); }
.mark { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.mark i { color: var(--acc); font-size: 22px; }
.qbox { flex: 1; min-width: 0; height: 36px; margin: 0 6px 0 2px; border-radius: 10px; background: var(--well); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 600; text-align: left; }
.qbox i { font-size: 18px; color: var(--ink3); flex: none; }
.qbox span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink2); }
.tbtn i { font-size: 18px; }

/* 버튼 */
.btn { min-height: 52px; padding: 0 18px; border-radius: var(--r); font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 120ms ease; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.go { background: var(--btn-bg); color: var(--btn-fg); }
.btn.soft { background: var(--well); color: var(--ink); }
.btn.line { border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; border-radius: 12px; }
.quiet { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); white-space: nowrap; }

/* 아래 탭(48px) */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding-bottom: var(--sab); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { height: var(--tabs); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--ink3); white-space: nowrap; }
.tabs button i { font-size: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }

/* 걸린 옷 띠(34px): 걸린 옷이 있을 때만, 탭 위 한 줄. 누르면 옷걸이 탭. */
.strip { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabs) + var(--sab)); height: var(--strip); background: var(--ink); color: var(--bg); display: block; width: 100%; }
.strip .in { max-width: 560px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 var(--gutR) 0 var(--gutL); font-size: 13px; font-weight: 700; }
.strip .in i { font-size: 18px; color: var(--acc); flex: none; }
.strip .in .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.strip .in .go { flex: none; display: inline-flex; align-items: center; gap: 2px; font-weight: 600; opacity: .8; }
.strip .in .go i { font-size: 14px; color: inherit; }
.strip.pop { animation: strip-in 320ms var(--spring, ease) both; }
@keyframes strip-in { from { transform: translateY(100%); } to { transform: none; } }

/* 사진: 모든 상품 칸은 3:4, 같은 밝은 바탕. 흰 배경 단독 사진은 바탕에 녹이고(multiply), 모델 사진은 채운다. */
.ph-box { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; background: var(--ptile); overflow: hidden; display: grid; place-items: center; }
.ph-box img { display: block; }
.ph-box img.cover { width: 100%; height: 100%; object-fit: cover; }
.ph-box img.flat { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
.ph-box .eo-ph, .ph-box .eo-tile { position: absolute; inset: 0; aspect-ratio: auto !important; border-radius: 0 !important; }
.ph-box .swatch { position: absolute; inset: 0; display: grid; place-items: center; }
.ph-box .swatch i { width: 46%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.ph-box .tag { position: absolute; left: 6px; top: 6px; max-width: calc(100% - 56px); height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(27, 27, 25, .82); color: #fff; }
.ph-box .tag.go { background: var(--btn-bg); color: var(--btn-fg); }
.ph-box .tag.ok { background: rgba(255, 255, 255, .92); color: #1b1b19; }
.ph-box .rank { position: absolute; left: 6px; bottom: 6px; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: rgba(27, 27, 25, .8); color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
/* 걸기 토글: 사진 모서리의 옷걸이. 누르는 곳은 44px, 보이는 동그라미는 32px. */
.hangt { position: absolute; right: 0; top: 0; width: 44px; height: 44px; display: grid; place-items: center; }
.hangt span { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .92); color: #1b1b19; display: grid; place-items: center; font-size: 19px; box-shadow: 0 1px 4px rgba(0, 0, 0, .14); transition: transform 160ms var(--spring, ease), background 160ms ease; }
.hangt[aria-pressed="true"] span { background: var(--btn-bg); color: var(--btn-fg); }
.hangt.pop span { animation: pop 420ms var(--spring, ease); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
.hangt.big { width: 56px; height: 56px; right: 4px; top: 4px; }
.hslot { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 3 / 4; pointer-events: none; }
.hslot > * { pointer-events: auto; }
.strip[hidden], .tabs[hidden] { display: none; }
.pdp-photo .zoomb { display: grid; place-items: center; }
.hangt.big span { width: 44px; height: 44px; font-size: 24px; }

/* 홈 */
.hero { margin-top: 16px; }
.ask { margin-top: 16px; display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; height: 56px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); padding: 0 16px; font-size: 17px; outline: none; }
.ask input:focus { border-color: var(--acc); }
.ask input::placeholder { color: var(--ink3); }
.ask button { width: 56px; height: 56px; border-radius: var(--r); background: var(--btn-bg); color: var(--btn-fg); display: grid; place-items: center; font-size: 24px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--gutL)); margin-right: calc(-1 * var(--gutR)); padding: 0 var(--gutR) 0 var(--gutL); }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll.fade { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
.chip { min-height: 38px; padding: 0 13px; border-radius: 999px; background: var(--well); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); white-space: nowrap; flex: none; }
.chip i { font-size: 14px; color: var(--ink3); }
.chip.ex { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); }
.section { margin-top: 24px; }
.section > .h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section > .h .h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proof { margin-top: 24px; padding: 16px; border-radius: 18px; background: var(--well); }
.proof .label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.proof .label i { font-size: 16px; color: var(--acc-text); }
.proof .h3 { margin-top: 4px; }
.prow { width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); text-align: left; }
.prow:first-of-type { border-top: 0; }
.prow .ph-box { width: 56px; flex: none; border-radius: 8px; }
.prow .grow { flex: 1; min-width: 0; }
.prow .n { font-size: 14px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.prow .d { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--acc-text); display: block; }
.prow .n { white-space: normal; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.prow .d.stop { color: var(--ink2); }
.prow .arr { color: var(--ink3); font-size: 18px; flex: none; }
.demo { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; margin-top: 12px; }
.demo .ths { display: flex; gap: 6px; flex-wrap: wrap; }
.demo .ths .ph-box { width: 40px; border-radius: 7px; }
.demo .cap { margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--ink2); }

/* 결과: 무신사 밀도. 2열, 3:4 사진, 글 3줄. 카드마다 이유는 없고(위에 한 줄 총평), 걸기는 사진 모서리 토글. */
.chips.scroll { margin-top: 8px; height: 36px; overflow-y: hidden; align-items: center; }
.chips.scroll .chip { min-height: 36px; }
.chips.scroll .cnt { flex: none; font-size: 13px; color: var(--ink3); white-space: nowrap; padding-right: 2px; }
.ai { margin-top: 8px; min-height: 34px; padding: 7px 12px; border-radius: 10px; background: var(--acc-soft); color: var(--ink); font-size: 13px; line-height: 18px; display: flex; gap: 8px; align-items: center; }
.ai i { color: var(--acc-text); font-size: 17px; flex: none; }
.ai.wait, .ai.off { background: var(--well); color: var(--ink2); }
.ai.wait i { animation: spin 1.2s linear infinite; color: var(--ink3); }
.ai span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes spin { to { transform: rotate(360deg); } }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 10px; margin-top: 10px; }
.card { min-width: 0; display: flex; flex-direction: column; position: relative; }
.card .open-p { text-align: left; display: block; }
.card .b { margin-top: 7px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .n { font-size: 13px; line-height: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.has-d .n { -webkit-line-clamp: 1; }
.card .p { margin-top: 3px; font-size: 15px; line-height: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .p small { font-size: 12px; font-weight: 500; color: var(--ink3); margin-left: 4px; }
.card .d { margin-top: 1px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--acc-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .d.stop { color: var(--ink2); }
/* 한 번 묻기: 걸었는데 옷장이 비어 있거나 이 종류가 없으면, 그 줄 아래에 두 칸짜리 한 줄로 묻는다(카드 높이는 그대로). */
.qrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 8px 6px 14px; border-radius: 12px; background: var(--well); margin-top: -4px; }
.qrow .qq { flex: 1; min-width: 0; font-size: 14px; line-height: 19px; font-weight: 700; }
.qrow .qq small { display: block; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink3); }
.qrow button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 700; background: var(--ink); color: var(--bg); white-space: nowrap; }
.qrow button.no { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.qrow.note { background: var(--acc-soft); color: var(--ink); font-size: 14px; font-weight: 600; }
.qrow.note i { color: var(--acc-text); font-size: 18px; flex: none; }
.offh { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); }
.empty { margin-top: 32px; }
.row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .arr { color: var(--ink3); font-size: 18px; }
.foot { margin-top: 24px; font-size: 12px; line-height: 17px; color: var(--ink3); }

/* 상세: 주 행동은 '판매처에서 사기' 하나. 걸기는 사진 모서리, 결정은 돌아왔을 때 묻거나 조용한 글자 버튼. */
.pdp-photo { margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); border-radius: 0; aspect-ratio: 4 / 5; }
.pdp-photo .ph-box { border-radius: 0; aspect-ratio: 4 / 5; }
.pdp-photo img.flat { width: 74%; height: 74%; }
.pdp-photo .zoomb { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: zoom-in; }
.pdp-head { margin-top: 16px; }
.pdp-head .h2 { font-size: 20px; line-height: 28px; }
.pdp-head .b { font-size: 14px; font-weight: 700; color: var(--ink2); }
.pricetag { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 22px; border-radius: 6px 10px 10px 6px; background: var(--surface); border: 1px solid var(--line); position: relative; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); }
.pricetag::before { content: ""; position: absolute; left: 11px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--acc); }
.pricetag b { font-size: 22px; font-weight: 800; }
.pricetag small { font-size: 13px; color: var(--ink3); white-space: nowrap; }
.box { margin-top: 16px; padding: 16px; border-radius: 18px; background: var(--well); }
.box .label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.box .label i { font-size: 16px; }
.box.ai-why .label { color: var(--acc-text); }
.box .h2 { margin-top: 6px; }
.box .h3 { margin-top: 6px; }
.box p { margin: 6px 0 0; }
.box .h2 b { color: var(--acc-text); }
.ownq { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ownq button { min-height: 48px; border-radius: 12px; font-size: 15px; font-weight: 700; background: var(--ink); color: var(--bg); }
.ownq button.no { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.looks2 { display: grid; gap: 10px; margin-top: 12px; }
.lk { padding: 10px; border-radius: 14px; background: var(--surface); }
.lk .ps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.lk .ps .p1 { min-width: 0; }
.lk .ps .ph-box { border-radius: 8px; }
.lk .ps .p1.me .ph-box { box-shadow: inset 0 0 0 2px var(--acc); }

<script>
(() => {
  const { M, esc, $, $$ } = K;
  const DESIGN = '걸어 보고 사기';
  const UI_KEY = 'eoul-d12-hang:ui';
  const S = { ai: {}, aiOrder: {}, result: null, snackT: 0, asking: null, pending: null, ui: { absent: {} } };
  try { S.ui = { absent: {}, ...JSON.parse(localStorage.getItem(UI_KEY) || '{}') }; } catch {}
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(S.ui)); } catch {} };
  const FLAT = window.PHOTO_FLAT || new Set();
  const PIC = ['tee', 'shirt', 'knit', 'sweat', 'pants', 'jeans', 'jacket', 'coat', 'sneaker', 'loafer', 'cardigan', 'blazer'];
  const won = (n) => `${Number(n).toLocaleString('ko-KR')}원`;
  const dayKey = (iso) => { if (!iso) return '날짜 없음'; const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  const DEC = { buy: '살게요', hold: '보류', skip: '안 살래요' };
  const josa = (w, a, b) => { const c = String(w || '').trim().slice(-1).charCodeAt(0); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? a : b; };
  const GROUPS = [['상의', ['tee', 'longtee', 'shirt', 'polo', 'knit', 'sweat']], ['하의', ['pants', 'jeans', 'skirt']], ['아우터', ['jacket', 'blazer', 'cardigan', 'coat', 'down', 'vest']], ['신발', ['sneaker', 'loafer', 'boot']]];

  // ── 사진: 흰 배경 단독 사진은 칸에 띄우고(배경을 칸 색에 녹임), 나머지는 칸을 채운다. 내 옷은 같은 종류·색의 흰 배경 사진, 없으면 색 동그라미.
  function productPic(id, { tag = '', tagCls = '', extra = '' } = {}) {
    const ph = M.photo({ id });
    const t = tag ? `<span class="tag ${tagCls}">${tag}</span>` : '';
    if (!ph) return `<span class="ph-box">${M.photoHtml({ id }, { caption: false })}${t}${extra}</span>`;
    const flat = FLAT.has(id) || K.WHITE.has(id);
    return `<span class="ph-box"><img class="${flat ? 'flat' : 'cover'}" src="${esc(ph.src)}" alt="${esc(ph.alt)}" decoding="async">${t}${extra}</span>`;
  }
  function garmentPic(g) {
    const id = K.CUT[`${g.gender || M.getState().gender || 'M'}|${g.kind}|${g.color}`]?.[0];
    if (id) { const ph = M.photo({ id }); if (ph) return `<span class="ph-box"><img class="flat" src="${esc(ph.src)}" alt="${esc(`${g.colorLabel || ''} ${g.kindName || ''}`.trim())}" decoding="async"></span>`; }
    return `<span class="ph-box" role="img" aria-label="${esc(`${g.colorLabel || ''} ${g.kindName || ''}`.trim())}"><span class="swatch"><i style="background:${esc(g.colorHex || '#ccc')}"></i></span></span>`;
  }
  const piecePic = (p) => {
    const g = p.garmentId && M.getState().closet.find((x) => x.id === p.garmentId);
    if (g) return garmentPic(g);
    if (p.product) return productPic(p.product.id);
    return garmentPic({ kind: p.kind, kindName: p.kindName, color: p.color, colorHex: p.colorHex, colorLabel: p.colorLabel });
  };
  const hangToggle = (id, cls = '') => { const on = M.compareHas(id); return `<button class="hangt ${cls}" data-hang="${id}" aria-pressed="${on}" aria-label="${on ? '걸어 보는 중 · 내리기' : '걸어 보기'}"><span><i class="${on ? 'ph-fill' : 'ph'} ph-coat-hanger"></i></span></button>`; };

  // ── 걸어 본 후보 = 비교함(최대 4개, 이 브라우저에 저장). 걸면 내 옷 기준 판정이 바로 따라온다.
  const hung = () => M.compareList();
  const sameOwned = (v) => (v?.owned || []).filter((o) => ['same-product', 'same-color'].includes(o.relation));
  const ownKey = (p) => `${p.gender || 'M'}|${p.kind}|${p.colorFromPhoto ? '' : p.color || ''}`;
  // 한 번 묻기가 필요한가: 옷장이 비었거나(코어가 판단 못 함), 이 종류가 옷장에 없어 코어가 묻는 중일 때.
  function needAsk(id) {
    const p = M.product(id); if (!p) return false;
    const v = p.verdict;
    if (v.basis === 'none') return !S.ui.absent[ownKey(p)];
    return !!(v.ask && v.ask.value === 'unknown');
  }
  const askText = (p) => `${p.colorFromPhoto ? '' : `${p.colorLabel} `}${p.kindName} 있어요?`;
  // 걸었을 때 달라지는 것 한 줄. 옷장이 없어도 '모른다'로 끝내지 않고, 사용자가 답한 사실로 말한다.
  function delta(id) {
    const p = M.product(id); if (!p) return null;
    const v = p.verdict;
    if (v.basis === 'none') {
      if (S.ui.absent[ownKey(p)]) return { text: `겹치는 ${p.kindName} 없음`, short: '겹침 없음', cls: 'ok', tone: 'ok' };
      return null;
    }
    const same = sameOwned(v).length;
    if (same || v.tone === 'stop') return { text: `비슷한 옷 ${same || 1}벌 있어요`, short: `비슷한 옷 ${same || 1}벌`, cls: '', tone: 'stop' };
    if (v.newLookCount) return { text: `새 코디 +${v.newLookCount}`, short: `새 코디 +${v.newLookCount}`, cls: 'go', tone: 'go' };
    if (v.ask && v.ask.value === 'absent') return { text: `겹치는 ${p.kindName} 없음`, short: '겹침 없음', cls: 'ok', tone: 'ok' };
    if (v.ask && v.ask.value === 'unknown') return null;
    const other = (v.owned || []).filter((o) => ['other-color', 'unknown-color'].includes(o.relation)).length;
    if (other) return { text: `${p.kindName} ${other}벌 있음 · 색 달라요`, short: '색 달라요', cls: 'ok', tone: 'info' };
    return { text: v.title, short: '비교함', cls: 'ok', tone: 'info' };
  }
  function stripText() {
    const ids = hung();
    if (!ids.length) return '';
    let looks = 0, same = 0;
    ids.forEach((id) => { const v = M.judge(id); if (!v || v.basis === 'none') return; looks += v.newLookCount || 0; same += sameOwned(v).length; });
    const parts = [`걸어 봄 ${ids.length}`];
    if (looks) parts.push(`새 코디 +${looks}`);
    if (same) parts.push(`비슷한 옷 ${same}`);
    if (!looks && !same && ids.length >= 2) parts.push('나란히 비교');
    return parts.join(' · ');
  }

  function cardHtml(p, ai) {
    const isHung = M.compareHas(p.id);
    const d = isHung ? delta(p.id) : null;
    const extra = `${ai ? `<span class="rank num">${ai.rank}</span>` : ''}${hangToggle(p.id)}`;
    const dl = d ? `걸어 봄 · ${d.text}` : isHung ? '걸어 봄' : '';
    const body = `<button class="open-p" data-pid="${p.id}"><div class="b">${esc(p.brand)}</div><div class="n">${esc(p.name)}</div>${dl ? `<div class="d ${d?.tone === 'stop' ? 'stop' : ''}">${esc(dl)}</div>` : ''}<div class="p num">${esc(p.priceText)}<small>${esc(p.priceShort)}</small></div></button>`;

  function grounding(q) {

        if (x.role === 'user') return `<div class="msg me">${esc(x.text)}</div>`;
        if (x.role === 'note') return `<div class="msg err" role="status">${esc(x.text)}</div>`;
        if (x.refused) return `<div class="msg bot refuse"><span class="who"><i class="ph ph-hand"></i>상담 범위 밖이에요</span>${esc(x.text)}</div>`;
        return `<div class="msg bot"><span class="who"><i class="ph-fill ph-sparkle"></i>AI 코디 상담</span>${esc(x.text)}</div>${x.ids?.length ? `<div class="recs">${x.ids.map(recCard).join('')}</div>` : ''}`;
      }).join('');

        <p class="t5 sub" style="margin-top:4px">옷·코디 이야기만 할 수 있어요.</p>
        ${!t.length ? `<div class="chips">${CHAT_EX.map((q) => `<button class="chip ex" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>` : ''}
        <div class="thread" id="thread" aria-live="polite">${body}${C.busy ? '<div class="msg bot wait" role="status"><span class="who"><i class="ph ph-circle-notch"></i>생각하는 중이에요</span></div>' : ''}</div>
        <p class="foot">AI 답변이라 틀릴 수 있어요 · 옷·코디 주제만 답해요. 상품 가격은 수집한 날의 판매가예요.</p>`;
    },

    detail({ id }) {
      const p = M.product(id);
      if (!p) return `${top()}<p class="t5">상품을 찾지 못했어요.</p>`;
      const ai = S.ai[id];
      const v = p.verdict;
      const same = sameOwned(v);
      const looks = (v.looks || []).slice(0, 2);
      const isHung = M.compareHas(id);
      const nvu = M.newVsUsed(id);
      const ask = needAsk(id);
      const d = delta(id);
      let head, sub = v.lines?.[0] || '';
      if (ask) { head = esc(askText(p)); sub = v.basis === 'none' ? '한 번만 답하면 겹치는지 바로 알려 드려요. 옷장은 안 채워도 돼요.' : '한 번만 답하면 겹치는지 바로 알려 드려요.'; }
      else if (v.basis === 'none' && d) { head = `겹치는 ${esc(p.kindName)}${josa(p.kindName, '이', '가')} <b>없어요</b>`; sub = `가진 ${p.kindName}${josa(p.kindName, '이', '가')} 없다고 답했어요. 바지·신발도 걸면 새 코디 수까지 세어 드려요.`; }
      else if (same.length) head = `비슷한 옷이 <b>${same.length}벌</b> 걸려 있어요`;
      else if (v.newLookCount) head = `걸면 새 코디가 <b>${v.newLookCount}개</b> 생겨요`;
      else head = esc(v.title);
      return `${top()}
        <div class="pdp"><div class="pdp-photo"><span class="ph-box" style="display:block"><button class="zoomb" data-zoom="${id}" aria-label="사진 크게 보기">${productPic(id).replace(/^<span class="ph-box">|<\/span>$/g, '')}</button>${hangToggle(id, 'big')}</span></div>
        <div>
        <div class="pdp-head"><div class="b">${esc(p.brand)}</div><h1 class="h2" style="margin-top:2px">${esc(p.name)}</h1>
          <div class="pricetag num"><b>${esc(p.priceText)}</b><small>${esc(p.priceNote)}</small></div>
          <p class="t6" style="margin-top:6px">${esc(p.colorLabel)} · ${esc(p.slotName)}${p.rating ? ` · 평점 ${esc(p.rating)} · 후기 ${Number(p.reviews || 0).toLocaleString('ko-KR')}개` : ''}</p></div>
        ${ai?.reason ? `<section class="box ai-why" aria-label="AI 이유"><div class="label"><i class="ph-fill ph-sparkle"></i>AI 순위 ${ai.rank}위${ai.fit ? ` · ${esc(ai.fit)}` : ''}</div><p class="h3">${esc(ai.reason)}</p></section>` : ''}
        <section class="box" id="hangbox" aria-label="내 옷에 걸어 보면"><div class="label"><i class="ph ph-coat-hanger"></i>내 옷에 걸어 보면 · ${esc(v.basisLabel)}</div>
          <h2 class="h2">${head}</h2>
          ${sub ? `<p class="t5 sub">${esc(sub)}</p>` : ''}
          ${ask ? `<div class="ownq"><button data-own="yes" data-for="${id}">있어요</button><button class="no" data-own="no" data-for="${id}">없어요</button></div>` : ''}
          ${same.length ? `<div class="owned">${same.map((o) => `<div class="o">${garmentPic(o)}<div class="t6">${esc(o.colorLabel)} ${esc(o.kindName)}${o.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : ''}
          ${looks.length ? `<div class="looks2">${looks.map((l) => { const ps = l.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4); return `<div class="lk"><div class="ps">${ps.map((x) => `<div class="p1${x.candidate ? ' me' : ''}">${piecePic(x)}<div class="t6">${x.candidate ? '이 옷' : `${esc(x.colorLabel)} ${esc(x.kindName)}${x.trial ? ' · 체험용' : ''}`}</div></div>`).join('')}</div><div class="cap">${esc(l.title || '')}${l.new ? ' · 새 코디' : ''} · 규칙으로 조합한 예시</div></div>`; }).join('')}</div>` : ''}
          ${!ask && v.addSuggestion && !(v.owned || []).length && !(v.basis === 'none' && d) ? `<div style="margin-top:10px"><button class="quiet" data-addlike="${id}"><i class="ph ph-plus"></i>가진 ${esc(v.addSuggestion.kindName)} 걸기</button></div>` : ''}
        </section>
        <details class="used"><summary><span>중고로 찾기</span><i class="ph ph-caret-right"></i></summary>
          <p class="t6">외부 사이트의 검색 결과로 이동해요 · 이 앱은 매물·가격·상태를 확인하지 않았어요</p>
          <div class="links">${nvu.used.groups[0].links.slice(0, 3).map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}<i class="ph ph-arrow-up-right"></i></a>`).join('')}</div></details>
        <p class="foot">${esc(v.fine || '')}</p>
        </div></div>`;
    },

    compare() {
      const ids = hung();
      if (ids.length < 2) {
        return `${top()}<h1 class="h2" style="margin-top:8px">두 벌 이상 걸면 나란히 봐요</h1><p class="t5 sub" style="margin-top:6px">결과 사진 모서리의 옷걸이를 눌러 후보를 걸어 주세요. 지금 ${ids.length}벌 걸려 있어요.</p>`;
      }
      const c = M.compareRows(ids);
      const head = c.items.map((it) => `<th scope="col"><button data-pid="${it.id}" style="display:block;width:100%;text-align:left">${productPic(it.id)}<div class="n">${esc(it.brand)} ${esc(it.name)}</div></button><button class="rm" data-unhang="${it.id}">내리기</button></th>`).join('');
      const rows = (list) => list.map((r) => `<tr class="${r.same ? 'same' : ''}"><th scope="row">${esc(r.label)}</th>${r.values.map((v) => `<td class="num">${esc(v)}</td>`).join('')}</tr>`).join('');
      const nSame = c.rows.filter((r) => r.same).length;
      const ordered = [...c.rows.filter((r) => !r.same), ...c.rows.filter((r) => r.same)];
      return `${top()}<h1 class="h2" style="margin-top:8px">걸어 본 ${ids.length}벌</h1><p class="t6" style="margin-top:4px">${esc(c.note)}</p>
        <div class="cmp" id="cmp"><table><thead><tr><th scope="col"><span class="t6">항목</span></th>${head}</tr></thead><tbody>${rows(ordered)}</tbody></table></div>
        ${nSame ? `<button class="quiet sametog" data-sametog aria-expanded="false"><i class="ph ph-caret-down"></i>같은 항목 ${nSame}개 보기</button>` : ''}`;
    },

    closet() {
      const st = M.getState();
      const mine = st.closet;
      const cands = hung().map((id) => M.product(id)).filter(Boolean);
      const other = mine.filter((g) => !GROUPS.some(([, ks]) => ks.includes(g.kind)));
      const out = mine.length ? M.closetOutfits().total : 0;
      const received = st.records.filter((x) => x.decision === 'buy' && ['ordered', 'received'].includes(x.stage)).length;
      const tile = (inner, cls, attrs, label, d = '') => `<button class="hg ${cls}" ${attrs}><i class="${cls.includes('cand') ? 'ph-fill' : 'ph'} ph-coat-hanger" aria-hidden="true"></i><span class="tile">${inner}</span><span class="t6">${label}</span>${d}</button>`;
      const railC = cands.map((p) => { const d = delta(p.id); return tile(productPic(p.id), 'cand', `data-pid="${p.id}" aria-label="걸어 보는 중: ${esc(p.brand)} ${esc(p.name)}"`, esc(p.name), `<span class="d ${d?.tone === 'stop' ? 'stop' : ''}">${esc(d ? d.text : (needAsk(p.id) ? '한 번 물어볼게요' : '비교 중'))}</span>`); });
      const railG = [];
      const vacant = cands.length ? '' : [0, 1].map((i) => tile('', 'vacant', mine.length ? 'data-tabgo="home" aria-label="옷 찾으러 가기"' : 'data-add aria-label="가진 옷 걸기"', i ? '' : (mine.length ? '찾기에서 걸어 보기' : '아직 빈 옷걸이'))).join('');
      return `${top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' })}
        <h1 class="h1" style="margin-top:12px">${mine.length ? `옷 <span class="num">${mine.length}</span>벌이 걸려 있어요` : '옷걸이가 비어 있어요'}</h1>
        <p class="t5 sub" style="margin-top:4px">${mine.length ? (out ? `종류·색 기준으로 <b class="num">${out}</b>가지 입을 수 있어요` : '상의·하의·신발을 함께 걸면 입을 수 있는 조합을 세어 드려요') : '비워 둬도 찾고 살 수 있어요. 걸어 두면 겹치는 옷을 알려 드려요.'}</p>
        <div class="section" style="margin-top:22px"><div class="h"><h2 class="h3">걸어 보는 중 ${cands.length ? `<span class="num acc">${cands.length}</span>` : ''}</h2>${cands.length >= 2 ? '<button class="quiet" data-go-compare>나란히 비교</button>' : ''}</div>
        <div class="rail" aria-label="걸어 본 옷 레일"><span class="bar-line" aria-hidden="true"></span><div class="hgs">${railC.join('')}${railG.join('')}${vacant}</div></div></div>
        ${st.trialCount ? `<div class="notice"><span class="grow">체험용 옷 ${st.trialCount}벌이 걸려 있어요</span><button data-mine>내리기</button></div>` : !mine.length ? `<div class="notice"><span class="grow">예시 옷장으로 먼저 써 볼 수 있어요</span><button data-trial>체험용 옷 걸기</button></div>` : ''}
        ${received ? `<div class="notice"><span class="grow">사기로 한 옷 ${received}벌 · 받으면 기록에서 ‘계속 입을게요’를 눌러 옷걸이로 옮겨요</span><button data-tabgo="records">기록</button></div>` : ''}
        ${GROUPS.map(([name, ks]) => { const items = mine.filter((g) => ks.includes(g.kind)); return items.length ? `<section class="section"><div class="h"><h2 class="h3">${name} <span class="t6 num">${items.length}</span></h2></div><div class="cgrid">${items.map((g) => `<button class="g" data-g="${g.id}">${garmentPic(g)}<div class="t6">${esc(g.colorLabel)} ${esc(g.kindName)}${g.trial ? ' · 체험용' : g.bought ? ' · 산 옷' : ''}</div></button>`).join('')}</div></section>` : ''; }).join('')}
        ${other.length ? `<section class="section"><div class="h"><h2 class="h3">기타</h2></div><div class="cgrid">${other.map((g) => `<button class="g" data-g="${g.id}">${garmentPic(g)}<div class="t6">${esc(g.colorLabel)} ${esc(g.kindName)}</div></button>`).join('')}</div></section>` : ''}
        ${mine.length ? '<p class="foot">옷걸이의 사진은 내 옷이 아니라 종류·색이 같은 상품 사진이에요. 사진이 없으면 색으로 보여 드려요.</p>' : ''}`;
    },

    records() {
      const all = M.getState().records.filter((r) => r.decision);
      const decided = all.filter((r) => r.decision !== 'hold');
      const buy = all.filter((r) => r.decision === 'buy');
      const holds = all.filter((r) => r.decision === 'hold');
      const sum = buy.reduce((a, r) => a + (r.product?.price || 0), 0);
      const waiting = buy.filter((x) => ['candidate', 'ordered', 'received'].includes(x.stage));
      const byDay = new Map();
      all.forEach((r) => { const k = dayKey(r.updatedAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(r); });
      const stage = (r) => r.decision === 'buy' ? (r.stage === 'candidate' ? '주문 전' : r.stageLabel) : (r.stage === 'candidate' ? '' : r.stageLabel);
      return `${top({ back: false })}
        <h1 class="h1" style="margin-top:12px">${decided.length ? `<span class="num">${decided.length}</span>벌을 정했어요` : holds.length ? `보류 <span class="num">${holds.length}</span>벌 · 아직 정하지 않았어요` : '아직 정한 옷이 없어요'}</h1>
        <p class="t5 sub" style="margin-top:4px">${all.length ? '직접 남긴 기록이에요. 보류는 정한 것으로 세지 않아요.' : '걸어 본 옷을 살지 정하면 여기에 남아요. 직접 남긴 기록이에요.'}</p>
        ${all.length ? `<div class="sum"><div class="c"><div class="k">살게요</div><div class="v num">${buy.length}</div><div class="t6 num nw" style="font-size:12px">${won(sum)} 수집가</div></div><div class="c"><div class="k">보류</div><div class="v num">${holds.length}</div></div><div class="c"><div class="k">안 살래요</div><div class="v num">${all.length - buy.length - holds.length}</div></div></div>` : ''}
        ${waiting.length ? `<section class="section"><div class="h"><h2 class="h3">사기로 한 옷</h2><span class="t6">받고 계속 입으면 옷걸이에 걸려요</span></div>
          ${waiting.map((x) => { const nx = (x.next || []).find((n) => !n.needsReason); return `<div class="wait-row">${productPic(x.productId)}<span class="grow"><span class="n">${esc(x.product?.name || '')}</span><span class="t6">${esc(x.stageLabel)}</span></span>${nx ? `<button class="btn ${nx.step === 'kept' ? 'go' : 'soft'}" data-adv="${x.productId}" data-step="${nx.step}">${nx.step === 'kept' ? '계속 입을게요 · 걸기' : esc(nx.label)}</button>` : ''}</div>`; }).join('')}</section>` : ''}
        <div class="tl">${[...byDay.entries()].map(([d, rs]) => `<div class="day">${esc(d)}</div>${rs.map((r) => `<button class="rec" data-pid="${r.productId}">${productPic(r.productId)}<span class="grow"><span class="n">${esc(r.product?.name || '')}</span><span class="t6"><span class="pill ${r.decision === 'buy' ? 'buy' : ''}">${DEC[r.decision]}</span>${stage(r) ? ` ${esc(stage(r))}` : ''}</span></span><span class="pr num">${esc(r.product?.priceText || '')}</span></button>`).join('')}`).join('') || '<button class="btn soft wide" data-tabgo="home" style="margin-top:20px">옷 찾으러 가기</button>'}</div>`;
    },
  };

  // ── 화면별 동작
  const A = {
    home() {
      $('#sf').onsubmit = (e) => { e.preventDefault(); const q = $('#q').value.trim(); if (q) K.go('results', { q }); else $('#q').focus(); };
      $('[data-trial]') && ($('[data-trial]').onclick = () => { M.loadTrialCloset(); K.refresh(); });
      $('[data-mine]') && ($('[data-mine]').onclick = () => { M.clearTrialCloset(); K.refresh(); });
    },
    async results({ q, drop = [] }) {
      $$('[data-drop]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: [...drop, b.dataset.drop] }, { replace: true }); });
      $$('[data-relax]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: JSON.parse(b.dataset.relax) }, { replace: true }); });
      fadeChips();
      const r = S.result;
      const box = $('#ai');
      if (!r?.products?.length || !box) { box?.remove(); return; }
      if (S.aiOrder[q]) return;
      const res = await AIRank.rank(q, r, { limit: 12 });
      if (!document.body.contains(box)) return;
      if (res.ok) {
        res.order.forEach((o) => { S.ai[o.id] = o; });
        S.aiOrder[q] = Object.fromEntries(res.order.map((o) => [o.id, o.rank]));
        (S.aiSummary ||= {})[q] = res.summary || '';
        const byId = Object.fromEntries(r.products.map((p) => [p.id, p]));
        const grid = $('#grid');
        const first = new Map($$('.card', grid).map((c) => [c.dataset.card, c.getBoundingClientRect()]));
        S.shown.main = res.order.map((o) => byId[o.id]).filter(Boolean);
        grid.innerHTML = gridHtml(S.shown.main);
        if (!K.reduce) $$('.card', grid).forEach((c) => { const a = first.get(c.dataset.card), b = c.getBoundingClientRect(); if (a) c.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px)` }, { transform: 'none' }], { duration: 420, easing: K.SPRING.css }); });
        box.className = 'ai'; box.innerHTML = `<i class="ph-fill ph-sparkle"></i><span>${esc(res.summary || 'AI가 후보 순서를 정했어요')}</span>`;
      } else {
        const why = { unavailable: 'AI 순위 꺼짐(claude.ai에서 열면 켜져요)', not_granted: 'AI 사용을 허용하지 않아 기본 순서', rate_limited: 'AI 요청이 많아 지금은 기본 순서', sampling_disabled: '이 계정은 AI를 쓸 수 없어 기본 순서' }[res.why] || 'AI 순위를 받지 못해 기본 순서';
        box.className = 'ai off'; box.innerHTML = `<i class="ph ph-info"></i><span>${esc(why)} · ${esc(r.listNote || '평점과 후기 수 순')}</span>`;
      }
    },
    detail({ id }) {
      const p = M.product(id); if (!p) return;
      drawDecision(id);
    },
    consult() {
      $('#bar').innerHTML = `<div class="chatbar"><form id="cf"><input id="cq" maxlength="400" enterkeyhint="send" autocomplete="off" placeholder="예: 베이지 니트에 어울리는 바지는?" aria-label="코디 질문"${C.busy ? ' disabled' : ''}><button aria-label="보내기"${C.busy ? ' disabled' : ''}><i class="ph ph-paper-plane-right"></i></button></form></div>`;
      $('#cf').onsubmit = (e) => { e.preventDefault(); const v = $('#cq').value; askConsult(v); };
      $$('[data-ask]').forEach((b) => { b.onclick = () => askConsult(b.dataset.ask); });
      $('[data-newchat]') && ($('[data-newchat]').onclick = () => { C.turns = []; C.busy = false; saveChat(); K.refresh(); });
      requestAnimationFrame(() => { if (C.turns.length) scrollTo(0, document.documentElement.scrollHeight); });
    },
    compare() {
      const b = $('[data-sametog]'); if (!b) return;
      b.onclick = () => { const on = $('#cmp').classList.toggle('showsame'); b.setAttribute('aria-expanded', on); b.innerHTML = `<i class="ph ph-caret-${on ? 'up' : 'down'}"></i>같은 항목 ${$$('#cmp tr.same').length}개 ${on ? '접기' : '보기'}`; };
    },
    closet() {
      $('#bar').innerHTML = '<div class="pinbar"><div class="in"><button class="btn go wide" data-add><i class="ph ph-plus"></i>가진 옷 걸기</button></div></div>';
      $$('[data-add]').forEach((b) => { b.onclick = () => addFlow(); });
      $('[data-mine]') && ($('[data-mine]').onclick = () => { M.clearTrialCloset(); K.refresh(); });
      $('[data-trial]') && ($('[data-trial]').onclick = () => { M.loadTrialCloset(); K.refresh(); });
      $$('[data-g]').forEach((b) => { b.onclick = () => garmentSheet(b.dataset.g); });
    },
    records() {
      $$('[data-adv]').forEach((b) => { b.onclick = () => { try { M.advance(b.dataset.adv, b.dataset.step); K.refresh(); } catch (e) { K.toast(e.message, { bottom: 60 }); } }; });
    },
  };

  // ── 상세의 결정: 주 행동은 '판매처에서 사기' 하나. 돌아오면 묻고, 아직이면 조용한 글자 버튼으로 남긴다.
  // 아래 바 한 줄: 결정 전에는 가격·수집가와 조용한 '보류 · 안 살래요', 결정 뒤에는 상태 한 줄과 '바꾸기'. 말풍선은 띄우지 않는다.
  function drawDecision(id) {
    const p = M.product(id); if (!p) return;
    const rec = p.verdict.record;
    const nvu = M.newVsUsed(id);
    const dec = rec?.decision;
    const meta = dec
      ? `<span class="fb" role="status"><i class="ph-fill ph-check-circle"></i><span class="nt" style="color:inherit">${esc(DEC[dec])}로 남겼어요${rec.stage !== 'candidate' ? ` · ${esc(rec.stageLabel)}` : dec === 'buy' ? ' · 주문·도착은 기록에서' : ''}</span></span><span class="qs">${rec.stage === 'candidate' ? '<button class="quiet" data-redecide>바꾸기</button>' : '<button class="quiet" data-tabgo="records">기록</button>'}</span>`
      : `<span class="pr"><b class="num">${esc(p.priceText)}</b><span class="nt">${esc(p.priceNote)} · ${esc(nvu.fresh.store)} · 현재 가격은 판매처에서</span></span><span class="qs"><button class="quiet" data-dec="hold">보류</button><button class="quiet" data-dec="skip">안 살래요</button></span>`;
    $('#bar').innerHTML = `<div class="buybar"><div class="in"><div class="meta">${meta}</div>
      <a class="btn go wide" href="${esc(p.url)}" target="_blank" rel="noopener" data-seller="${id}">판매처에서 사기<i class="ph ph-arrow-up-right"></i></a></div></div>`;
    $$('[data-dec]').forEach((b) => { b.onclick = () => decide(id, b.dataset.dec); });
    $('[data-redecide]') && ($('[data-redecide]').onclick = () => decisionSheet(id, { title: '어떻게 할까요?' }));
    $('[data-seller]').onclick = () => { S.pending = { id, t: Date.now() }; };
  }
  function decide(id, dec) {
    const rec = M.product(id)?.verdict.record;
    if (rec && rec.stage !== 'candidate') return;
    if (dec === 'clear') M.removeRecord(id); else M.decide(id, dec);
    drawDecision(id);
  }
  function decisionSheet(id, { title = '판매처에서 돌아왔어요 · 어떻게 하셨어요?' } = {}) {
    const p = M.product(id); if (!p) return;
    if ($('.sheet')) return;
    const has = !!p.verdict.record?.decision;
    const sh = sheet(`<h2 class="h2">${esc(title)}</h2><p class="t6 sub">${esc(p.brand)} ${esc(p.name)} · ${esc(p.priceText)}</p>
      <div class="decs"><button class="btn go" data-d="buy"><i class="ph ph-check"></i>샀어요</button><button class="btn soft" data-d="hold">보류</button><button class="btn soft" data-d="skip">안 살래요</button>${has ? '<button class="btn line" data-d="clear">기록 지우기</button>' : ''}<button class="quiet" data-d="" style="justify-content:center;width:100%">${has ? '그대로 둘게요' : '아직 보는 중이에요'}</button></div>`);
    $$('[data-d]', sh.s).forEach((b) => { b.onclick = async () => { await sh.close(); if (b.dataset.d) decide(id, b.dataset.d); }; });
  }
  // 판매처에서 돌아왔을 때(탭이 다시 보이거나 창이 다시 초점을 받으면) 한 번 묻는다.
  const onReturn = () => {
    const pd = S.pending; if (!pd) return;
    if (document.visibilityState !== 'visible') return;
    const dt = Date.now() - pd.t;
    if (dt < 700) return;
    if (dt > 30 * 60 * 1000 || curView !== 'detail' || curParams.id !== pd.id) { S.pending = null; return; }
    S.pending = null;
    setTimeout(() => { if (curView === 'detail' && curParams.id === pd.id && !M.product(pd.id)?.verdict.record?.decision) decisionSheet(pd.id); }, 300);
  };
  document.addEventListener('visibilitychange', onReturn);
  addEventListener('focus', onReturn);
  addEventListener('pageshow', onReturn);

  // ── 공통 이벤트(한 번만 건다)
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-back],[data-pid],[data-tabgo],[data-menu],[data-q],[data-hang],[data-unhang],[data-go-compare],[data-zoom],[data-addlike],[data-disclose],[data-own],[data-edit]');
    if (!t) return;
    if (t.hasAttribute('data-back')) K.back();
    else if (t.dataset.hang) toggleHang(t.dataset.hang, t);
    else if (t.dataset.own) answerOwn(t.dataset.for, t.dataset.own === 'yes');
    else if (t.dataset.unhang) { M.compareRemove(t.dataset.unhang); K.refresh(); }
    else if (t.dataset.pid) K.go('detail', { id: t.dataset.pid });
    else if (t.dataset.tabgo) K.tab(t.dataset.tabgo);
    else if (t.hasAttribute('data-edit')) K.tab('home', { q: t.dataset.edit });
    else if (t.dataset.q) K.go('results', { q: t.dataset.q });
    else if (t.hasAttribute('data-go-compare')) K.go('compare', {});
    else if (t.dataset.zoom) zoom(t.dataset.zoom);
    else if (t.dataset.addlike) addLike(t.dataset.addlike);
    else if (t.hasAttribute('data-disclose')) M.openDisclosure ? M.openDisclosure() : K.info(DESIGN);
    else if (t.hasAttribute('data-menu')) menu();
  });
  $$('#tabs [data-tab]').forEach((b) => { b.onclick = () => K.tab(b.dataset.tab); });
  // 결과에서 내리면 위 막대가 숨고, 올리면 다시 나온다.
  let lastY = 0;
  addEventListener('scroll', () => {
    const y = scrollY; const tp = $('#top');
    if (tp && curView === 'results') { if (y > lastY + 6 && y > 90) tp.classList.add('hide'); else if (y < lastY - 6 || y < 90) tp.classList.remove('hide'); }
    lastY = y;
  }, { passive: true });

  // 걸기: 사진 모서리 토글. 걸면 카드가 바뀌고(띠·표시), 옷장이 없으면 그 자리에서 한 번 묻는다. 알림 말풍선은 띄우지 않는다.
  function toggleHang(id, btn) {
    const was = M.compareHas(id);
    if (was) { M.compareRemove(id); if (S.asking === id) S.asking = null; }
    else {
      try { M.compareAdd(id); } catch (err) { showCardNote(id, btn, /비교함|4개/.test(err.message) ? '옷걸이에는 4벌까지 걸 수 있어요. 하나를 내리고 다시 걸어 주세요.' : err.message); return; }
      if (needAsk(id)) S.asking = id;
    }
    afterHang(id, btn, !was);
  }
  // 안내는 겹치지 않게: 결과에서는 그 줄 아래 두 칸짜리 줄로, 다른 곳에서는 카드 아래에 붙인다.
  function showCardNote(id, btn, text) {
    clearTimeout(S.noteT);
    if (curView === 'results') { S.note = { id, text }; redrawGrids(); S.noteT = setTimeout(() => { S.note = null; redrawGrids(); }, 3200); return; }
    const host = btn.closest('.rc, .g, .pdp-photo') || btn.parentElement;
    $('.card-note', host)?.remove();
    const n = document.createElement('div'); n.className = 'card-note t6'; n.setAttribute('role', 'alert'); n.textContent = text; n.style.cssText = 'margin-top:6px;color:var(--acc-text);font-weight:700';
    host.appendChild(n); setTimeout(() => n.remove(), 3200);
  }
  function afterHang(id, btn, added) {
    if (curView === 'results') {
      redrawGrids();
      const nb = $(`[data-card="${id}"] .hangt`); if (nb && added && !K.reduce) nb.classList.add('pop');
      renderStrip({ pop: added && hung().length === 1 });
      if (added) $(`.qrow[data-for="${id}"]`)?.scrollIntoView({ behavior: K.reduce ? 'auto' : 'smooth', block: 'nearest' });
    } else if (curView === 'consult') {
      $$(`.rc[data-card="${id}"] .hangt`).forEach((b) => { b.outerHTML = hangToggle(id); });
      renderStrip({ pop: added && hung().length === 1 });
    } else if (curView === 'detail') {
      const old = $('.pdp-photo .hangt'); if (old) { old.outerHTML = hangToggle(id, 'big'); const nb = $('.pdp-photo .hangt'); if (added && !K.reduce) nb.classList.add('pop'); }
      if (added && needAsk(id)) { S.asking = id; $('#hangbox')?.scrollIntoView({ behavior: K.reduce ? 'auto' : 'smooth', block: 'center' }); }
    } else K.refresh();
  }
  function findCard(id) {
    const r = S.result;
    return r ? [...r.products, ...(r.offOccasion || [])].find((p) => p.id === id) : null;
  }
  // 한 번 묻기의 답. '있어요'는 색만 고르고(이 상품 색이 맨 앞), '없어요'는 그 사실로 바로 판정한다.
  function answerOwn(id, yes) {
    const p = M.product(id); if (!p) return;
    const v = p.verdict;
    if (!yes) {
      if (v.basis === 'none') { S.ui.absent[ownKey(p)] = 1; saveUi(); }
      else { try { M.setOwnership(id, 'absent'); } catch {} }
      S.asking = null;
      refreshAfterOwn(id);
      return;
    }
    const add = v.addSuggestion || { kind: p.kind, kindName: p.kindName, slot: p.slot, gender: p.gender, color: p.colorFromPhoto ? null : p.color };
    const sh = sheet(`<h2 class="h2">가진 ${esc(add.kindName)}${josa(add.kindName, '은', '는')} 무슨 색이에요?</h2><p class="t6 sub">이 옷과 같은 색이면 맨 앞을 누르세요. 다른 색이어도 돼요.</p>${colorGrid(add.color)}`);
    $$('[data-c]', sh.s).forEach((b) => { b.onclick = async () => {
      M.addGarment({ kind: add.kind, color: b.dataset.c, slot: add.slot, gender: add.gender });
      try { M.setOwnership(id, 'present'); } catch {}
      S.asking = null;
      await sh.close();
      refreshAfterOwn(id);
    }; });
  }
  function refreshAfterOwn(id) {
    if (curView === 'results') {
      redrawGrids();
      $(`[data-card="${id}"]`)?.scrollIntoView({ behavior: K.reduce ? 'auto' : 'smooth', block: 'nearest' });
    } else { const y = scrollY; K.refresh(); requestAnimationFrame(() => scrollTo(0, y)); }
  }

  function zoom(id) {
    const ph = M.photo({ id }); if (!ph) return;
    const w = document.createElement('div');
    w.className = 'zoom'; w.setAttribute('role', 'dialog'); w.setAttribute('aria-label', '사진 크게 보기');
    w.innerHTML = `<img src="${esc(ph.src)}" alt="${esc(ph.alt)}"><button aria-label="닫기"><i class="ph ph-x"></i></button>`;
    document.body.appendChild(w);
    const close = () => { w.remove(); removeEventListener('keydown', key); };
    const key = (e) => { if (e.key === 'Escape') close(); };
    addEventListener('keydown', key);
    w.onclick = close;
    w.querySelector('button').focus();
  }

  // ── 시트
  function sheet(html) {
    const w = document.createElement('div');
    w.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    document.body.appendChild(w);
    const s = $('.sheet', w);
    if (!K.reduce) { s.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: K.SPRING.ms, easing: K.SPRING.css }); }
    const close = async () => {
      removeEventListener('keydown', key);
      if (!K.reduce) await s.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: 200, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }).finished;
      w.remove();
    };
    const key = (e) => { if (e.key === 'Escape') close(); };
    $('.scrim', w).onclick = close;
    addEventListener('keydown', key);
    return { w, s, close };
  }
  const colorGrid = (first = null) => { const cs = M.colorChoices(); const sorted = first ? [...cs.filter((c) => c.id === first), ...cs.filter((c) => c.id !== first)] : cs; return `<div class="colors">${sorted.map((c) => `<button data-c="${c.id}" class="${c.id === first ? 'same' : ''}" aria-label="${esc(c.label)}${c.id === first ? ' (이 옷과 같은 색)' : ''}"><i style="background:${c.hex}"></i>${esc(c.label)}${c.id === first ? ' · 같은 색' : ''}</button>`).join('')}</div>`; };

  // 상세에서 '가진 ○○ 걸기': 종류는 이 상품과 같게 미리 고르고 색만 묻는다. 걸고 나면 같은 상품 화면으로 돌아와 판정이 바뀐다.
  function addLike(id) {
    const add = M.judge(id)?.addSuggestion; if (!add) return;
    const sh = sheet(`<h2 class="h2">가진 ${esc(add.kindName)}${josa(add.kindName, '은', '는')} 무슨 색이에요?</h2>${colorGrid(add.color)}`);
    $$('[data-c]', sh.s).forEach((b) => { b.onclick = async () => {
      M.addGarment({ kind: add.kind, color: b.dataset.c, slot: add.slot, gender: add.gender });
      await sh.close();
      const y = scrollY; K.refresh(); requestAnimationFrame(() => scrollTo(0, y));
    }; });
  }
  // 옷걸이 탭의 '가진 옷 걸기': 종류 → 색, 한 번에 한 질문.
  function addFlow() {
    const kinds = M.kindChoices().filter((k) => PIC.includes(k.id)).sort((a, b) => PIC.indexOf(a.id) - PIC.indexOf(b.id));
    const g0 = M.getState().gender || 'M';
    const thumbColor = (kid) => ['white', 'black', 'navy', 'grey', 'indigo', 'blue', 'beige'].find((c) => K.CUT[`${g0}|${kid}|${c}`]) || 'black';
    const sh = sheet(`<h2 class="h2">어떤 옷을 걸까요?</h2><div class="kinds">${kinds.map((k) => `<button data-k="${k.id}">${garmentPic({ kind: k.id, kindName: k.name, color: thumbColor(k.id), gender: g0 })}${esc(k.name)}</button>`).join('')}</div>`);
    $$('[data-k]', sh.s).forEach((b) => { b.onclick = () => {
      const kind = b.dataset.k, kname = kinds.find((k) => k.id === kind).name;
      sh.s.innerHTML = `<div class="grab"></div><h2 class="h2">${esc(kname)} 색을 골라 주세요</h2>${colorGrid()}`;
      $$('[data-c]', sh.s).forEach((cb) => { cb.onclick = async () => {
        const before = M.getState().closetCount ? M.closetOutfits().total : 0;
        M.addGarment({ kind, color: cb.dataset.c, slot: M.slotChoices(kind)[0]?.id || null });
        await sh.close();
        K.refresh();
        const gain = M.closetOutfits().total - before;
        K.toast(gain > 0 ? `옷걸이에 걸었어요 · 입을 수 있는 조합 +${gain}` : '옷걸이에 걸었어요', { bottom: 128 });
      }; });
    }; });
  }
  function garmentSheet(id) {
    const g = M.getState().closet.find((x) => x.id === id);
    if (!g) return;
    const sh = sheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:18px"><span style="width:84px;display:block;flex:none">${garmentPic(g)}</span><div><h2 class="h2">${esc(g.colorLabel)} ${esc(g.kindName)}</h2><div class="t6">${esc(g.sourceLabel || (g.trial ? '체험용' : '내 옷'))} · 사진은 같은 종류·색의 상품</div></div></div><button class="btn soft wide" data-rm>옷걸이에서 내리기</button>`);
    $('[data-rm]', sh.s).onclick = async () => { try { M.removeGarment(id); await sh.close(); K.refresh(); } catch (err) { K.toast(err.message, { bottom: 128 }); } };
  }
  function menu() {
    const sh = sheet(`<div class="menu"><button class="row" data-info><span class="grow t5">이 시안에 대해</span><i class="ph ph-info arr"></i></button><button class="row" data-theme><span class="grow t5">밝게 · 어둡게</span><i class="ph ph-moon arr"></i></button><button class="row" data-reset><span class="grow t5">처음부터 다시</span><i class="ph ph-arrow-counter-clockwise arr"></i></button></div>`);
    $('[data-info]', sh.s).onclick = async () => { await sh.close(); M.openDisclosure ? M.openDisclosure() : K.info(DESIGN); };
    $('[data-theme]', sh.s).onclick = async () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; await sh.close(); };
    $('[data-reset]', sh.s).onclick = async () => { K.reset(); S.ai = {}; S.aiOrder = {}; S.asking = null; S.ui = { absent: {} }; saveUi(); await sh.close(); K.tab('home'); };
  }

  const r0 = M.route.current();
  K.start(render, { view: 'home', params: {} });
  if (M.boot?.q) K.go('results', { q: M.boot.q });
  else if (/^\/p\/.+/.test(r0.path)) K.go('detail', { id: r0.path.slice(3) });
  else if (r0.path === '/search' && r0.params.q) K.go('results', { q: r0.params.q });
  else if (['/closet', '/records', '/consult', '/compare'].includes(r0.path)) K.tab(r0.path.slice(1));
})();
</script>
