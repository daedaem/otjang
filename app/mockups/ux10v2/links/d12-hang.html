        <a href="https://developers.rakuten.com/" target="_blank">Supported by Rakuten Developers</a>
        <!-- Rakuten Web Services Attribution Snippet TO HERE -->`;
    } catch (error) { box.innerHTML = `<p class="t6" role="status">${esc(error.message || '라쿠텐 검색을 불러오지 못했어요.')} 아래 링크로 직접 검색할 수 있어요.</p>`; }
    finally { button.disabled = false; }
  }
  // 설치 앱이 공용 목록(EOUL_CROWD.search)을 주면 '사용자 등록 · n명 확인' 줄을 덧붙인다. 없으면 이 기기에서 직접 등록한 옷만 보인다.
  let crowdSeq = 0;
  async function crowdSearch(text) {
    const seq = ++crowdSeq;
    const q = text.toLowerCase();
    const local = Object.values(registrationCatalog()).filter((c) => normKey(c.brand, c.name).includes(normKey(q, '')));
    let items = [];
    const cr = crowd();
    if (cr && typeof cr.search === 'function') { try { const r = await cr.search(text); items = Array.isArray(r?.items) ? r.items : []; } catch {} }
    if (seq !== crowdSeq) return;
    const box = $('#acrowd'); if (!box) return;
    const seen = new Set();
    const all = [...items.map((x) => ({ ...x, server: true })), ...local.map((c) => ({ brand: c.brand, name: c.name, kind: c.kind, color: c.color, count: c.count, server: false }))]
      .filter((x) => x.brand && x.name && !seen.has(normKey(x.brand, x.name)) && seen.add(normKey(x.brand, x.name))).slice(0, 10);
    if (!all.length) { box.innerHTML = ''; return; }
    const kname = (k) => M.kindChoices().find((x) => x.id === k)?.name || '';
    const cname = (c) => M.colorChoices().find((x) => x.id === c)?.label || '';
    box.innerHTML = `<section class="section"><div class="h"><h2 class="h3">사용자 등록</h2></div>${all.map((x, i) => `<div class="srow" data-crow="${i}">${garmentPic({ kind: x.kind, color: x.color, gender: M.getState().gender, kindName: kname(x.kind) })}<span class="grow"><span class="b">${esc(x.brand)}</span><span class="n">${esc(x.name)}</span><span class="m">${esc([cname(x.color), kname(x.kind)].filter(Boolean).join(' '))}<span class="pill">${x.server ? `${x.count || 1}명 확인` : `이 기기 · ${x.count || 1}/${NEED}`}</span></span></span><button class="btn line sm" data-crowd-add="${i}">가지고 있어요</button></div>`).join('')}</section>`;
    box._items = all;
  }
  function crowdAdd(i, btn) {
    const x = $('#acrowd')?._items?.[Number(i)]; if (!x) return;
    const kind = M.kindChoices().some((k) => k.id === x.kind) ? x.kind : null;
    if (!kind) { K.toast('옷 종류를 알 수 없어서 직접 등록으로 넣어 주세요', { bottom: 110 }); return; }
    const before = M.getState().closetCount ? M.closetOutfits().total : 0;
    let g; try { g = x.savedGarment || M.addGarment({ kind, color: x.color || null, slot: M.slotChoices(kind)[0]?.id || null, label: String(x.name).slice(0, 80) }); } catch (err) { K.toast(err.message, { bottom: 110 }); return; }
    x.savedGarment = g; // 부가정보만 실패하면 같은 화면에서 같은 옷으로 재시도한다.
    const key = normKey(x.brand, x.name);
    const c = REG.catalog[key] || { key, brand: x.brand, name: x.name, kind, color: x.color || null, url: '', count: 0, mine: false, at: new Date().toISOString() };
    if (!c.mine) { c.count = Math.min(NEED, (c.count || 0) + 1); c.mine = true; }
    if (x.server) { c.server = true; c.serverCount = x.count || c.serverCount; }
    REG.catalog[key] = c; REG.items[g.id] = { brand: x.brand, name: x.name, kind, color: x.color || null, key, at: new Date().toISOString() };
    try { saveReg(); } catch (err) { btn.textContent = '추가 정보 다시 저장'; K.toast('옷은 저장됐어요. 추가 정보 저장에 실패해 다시 시도해 주세요.', { bottom: 110 }); return; }
    const row = btn.closest('.srow'); if (row) { row.classList.add('done'); const ok = document.createElement('span'); ok.className = 'ok'; ok.innerHTML = '<i class="ph-fill ph-check-circle"></i>옷장에 넣었어요'; btn.replaceWith(ok); }
    drawShelf({ pop: true });
    const gain = M.closetOutfits().total - before;
    K.toast(gain > 0 ? `옷장에 넣었어요 · 코디 +${gain}` : '옷장에 넣었어요', { bottom: 100 });
    if (!g.color) pickColor(g.id, M.kindChoices().find((k) => k.id === kind)?.name || '옷', null, () => drawShelf());
  }
  function drawShelf({ pop = false } = {}) {
    const st = M.getState(); const mine = st.closet;
    const out = mine.length ? M.closetOutfits().total : 0;
    const last = [...mine].slice(-4);
    $('#bar').innerHTML = `<div class="shelfbar${pop && !K.reduce ? ' pop' : ''}" id="shelf"><div class="in"><span class="ths" aria-hidden="true">${last.map((g) => garmentPic(g)).join('')}${last.length < 4 ? '<span class="ph-box empty"></span>' : ''}</span><span class="grow"><b class="num">옷 ${mine.length}벌</b> · ${out ? `코디 ${out}가지` : '코디는 3종류부터'}</span><button class="btn sm go" data-tabgo="closet">옷장 보기</button></div></div>`;
  }
  async function ownAdd(id, btn) {
    const p = M.product(id); if (!p) return;
    const before = M.getState().closetCount ? M.closetOutfits().total : 0;
    let g;
    try { g = M.addOwnedProduct(id); } catch (err) { K.toast(err.message, { bottom: 110 }); return; }
    const finish = () => {
      const after = M.closetOutfits().total; const gain = after - before;
      const row = $(`.srow[data-srow="${id}"]`);
      if (row) {
        const from = row.querySelector('.ph-box')?.getBoundingClientRect();
        drawShelf({ pop: true });
        const to = $('#shelf .ths .ph-box:last-child');
        if (from && to) K.fly(productPic(id), from, to, { radius: 8 });
        row.classList.add('done');
        const ok = document.createElement('span'); ok.className = 'ok'; ok.setAttribute('role', 'status');
        ok.innerHTML = `<i class="ph-fill ph-check-circle"></i>${gain > 0 ? `넣었어요 · 코디 +${gain}` : '옷장에 넣었어요'}`;
        row.querySelector('[data-own-add]')?.replaceWith(ok);
      } else drawShelf({ pop: true });
    };
    if (!g.color) { pickColor(g.id, p.kindName, null, finish); return; }
    finish();
  }
  // ── 직접 등록 화면의 동작: 브랜드·상품명을 적으면 비슷한 등록(이 앱이 아는 상품·사용자 등록)을 먼저 보여 주고, 넣기는 아래 고정 버튼 하나.
  function wireReg() {
    const R = S.reg;
    const rb = $('#rb'), rn = $('#rn'), ru = $('#ru'), dup = $('#rdup');
    $('#bar').innerHTML = '<div class="regbar"><div class="in"><button class="btn go" id="rdone" disabled><i class="ph ph-coat-hanger"></i>옷장에 넣기</button></div></div>';
    const okAll = () => rb.value.trim().length >= 1 && rn.value.trim().length >= 2 && !!R.kind && !!R.color;
    const upd = () => { $('#rdone').disabled = !okAll(); };
    let t;
    const findDup = () => {
      R.brand = rb.value.trim(); R.name = rn.value.trim();
      if (R.source) { dup.innerHTML = ''; return; }
      clearTimeout(t); t = setTimeout(() => {
        if (!R.brand || R.name.length < 2) { dup.innerHTML = ''; return; }
        let hits = [];
        try { const tries = [`${R.brand} ${R.name}`, R.name, ...R.name.split(/\s+/).filter((w) => w.length >= 2).sort((a, b) => b.length - a.length)]; for (const q of tries) { hits = M.findProducts(q, { limit: 3 }); if (hits.length) break; } } catch {}
        const mineHas = (id) => M.getState().closet.some((g) => g.productId === id);
        dup.innerHTML = hits.length ? `<div class="section" style="margin-top:14px"><div class="h"><h2 class="h3">혹시 이 옷이에요?</h2></div>${hits.map((p) => `<div class="srow" data-srow="${p.id}">${productPic(p.id)}<span class="grow"><span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="m">판매처 사진으로 들어가요</span></span>${mineHas(p.id) ? '<span class="ok"><i class="ph-fill ph-check-circle"></i>옷장에 있어요</span>' : `<button type="button" class="btn line sm" data-dup-own="${p.id}">이거예요</button>`}</div>`).join('')}</div>` : '';
        $$('[data-dup-own]', dup).forEach((b) => { b.onclick = () => { let g; try { g = M.addOwnedProduct(b.dataset.dupOwn); } catch (err) { K.toast(err.message, { bottom: 96 }); return; } S.reg = null; const done = () => { K.back(); K.toast('옷장에 넣었어요', { bottom: 100 }); }; if (!g.color) pickColor(g.id, M.product(b.dataset.dupOwn)?.kindName || '옷', null, done); else done(); }; });
      }, 160);
    };
    rb.oninput = rn.oninput = () => { findDup(); upd(); };
    ru.oninput = () => { R.url = ru.value.trim(); };
    $$('[data-k]').forEach((b) => { b.onclick = () => { R.kind = b.dataset.k; $$('[data-k]').forEach((x) => x.setAttribute('aria-pressed', x === b)); upd(); }; });
    $$('[data-c]').forEach((b) => { b.onclick = () => { R.color = b.dataset.c; $$('[data-c]').forEach((x) => x.setAttribute('aria-pressed', x === b)); upd(); }; });
    const lockSavedFields = () => { if (!R.savedGarment) return; clearTimeout(t); dup.innerHTML = ''; rb.readOnly = rn.readOnly = ru.readOnly = true; $$('[data-k], [data-c], [data-dup-own]').forEach((b) => { b.disabled = true; }); };
    lockSavedFields();
    const done = async () => {
      if (R.saving) return;
      R.brand = rb.value.trim(); R.name = rn.value.trim(); R.url = ru.value.trim();
      if (!okAll()) { K.toast('브랜드·상품명·종류·색을 채워 주세요', { bottom: 96 }); return; }
      if (R.url && !/^https?:\/\/\S+$/i.test(R.url)) { K.toast('링크는 https://로 시작해야 해요', { bottom: 96 }); ru.focus(); return; }
      const before = M.getState().closetCount ? M.closetOutfits().total : 0;
      let g; try { g = R.savedGarment || M.addGarment({ kind: R.kind, color: R.color, slot: M.slotChoices(R.kind)[0]?.id || null, label: R.name.slice(0, 80) }); } catch (err) { K.toast(err.message, { bottom: 96 }); return; }
      R.savedGarment = g; lockSavedFields();
      const key = normKey(R.brand, R.name);
      const c = (!R.source && REG.catalog[key]) || { key, brand: R.brand, name: R.name, kind: R.kind, color: R.color, url: '', count: 0, mine: false, at: new Date().toISOString() };
      if (!c.mine) { c.count = Math.min(NEED, (c.count || 0) + 1); c.mine = true; } // 같은 사람이 또 등록해도 한 명으로 센다.
      if (R.url) c.url = R.url;
      // 공개 원본을 사용자 3명 확인 목록과 합치거나 독립 확인으로 세지 않는다.
      if (!R.source) REG.catalog[key] = c;
      REG.items[g.id] = { brand: R.brand, name: R.name, kind: R.kind, kindName: M.kindChoices().find((k) => k.id === R.kind)?.name || '', color: R.color, url: R.url, key, at: new Date().toISOString(), ...(R.source ? { source: R.source } : {}) };
      try { saveReg(); } catch (err) { $('#rdone').textContent = '추가 정보 다시 저장'; K.toast('옷은 저장됐어요. 브랜드·링크 저장에 실패했어요. 이 화면에서 다시 시도해 주세요.', { bottom: 96 }); return; }
      R.saving = true; $('#rdone').disabled = true;
      // 설치 앱의 공용 목록. 답이 오면 그 숫자로, 못 보내면(not_configured·offline) 이 기기 숫자 그대로.
      const cr = crowd();
      if (cr && !R.source) { try { const r = await cr.submit({ brand: R.brand, name: R.name, kind: R.kind, color: R.color, link: R.url }); if (r && Number.isFinite(+r.count)) { c.server = true; c.serverCount = +r.count; c.serverMin = +r.min || NEED; c.searchable = !!r.searchable; saveReg(); } } catch {} }
      const gain = M.closetOutfits().total - before;
      S.reg = null;
      K.tab('closet');
      K.toast(`옷장에 넣었어요${gain > 0 ? ` · 코디 +${gain}` : ''}`, { bottom: 128 });
      setTimeout(() => garmentSheet(g.id), 350);
    };
    $('#rdone').onclick = done;
    $('#rf').onsubmit = (e) => { e.preventDefault(); if (document.activeElement === rb) rn.focus(); else if (okAll()) done(); };
    upd(); if (R.brand && R.name && !R.savedGarment) findDup();
    if (!R.brand) setTimeout(() => rb.focus(), 60);
  }

  // 날씨 지역(설치 앱에서만): 현재 위치 또는 내 지역. 이 기기에만 저장하고, 바꾸면 날씨를 다시 받는다.
  function placeSheet() {
    const P = window.EOUL_WEATHER_PLACE;
    if (!P || $('.sheet')) return;
    const cur = P.get();
    const sh = sheet(`<h2 class="h2" style="margin:4px 0 4px">날씨 지역</h2>
      <p class="t6" style="margin:0 0 12px">이 기기에만 저장해요. 날씨를 물을 때는 약 10km 단위로 줄인 위치만 보내요.</p>
      <div class="menu"><button class="row" data-pl-here aria-pressed="${cur.mode === 'here'}"><span class="grow t5">현재 위치<span class="t6" style="display:block">열 때마다 위치로 · 거절하면 서울</span></span>${cur.mode === 'here' ? '<i class="ph-fill ph-check-circle arr"></i>' : ''}</button>
      <button class="row" data-pl-save><span class="grow t5">지금 있는 곳을 내 지역으로</span><i class="ph ph-map-pin arr"></i></button></div>
      <div class="label" style="margin:14px 0 8px">내 지역 고르기${cur.mode === 'fixed' ? ` · 지금 ${esc(cur.name)}` : ''}</div>
      <div class="chips wrap">${P.presets.map((p, i) => `<button class="chip ${cur.mode === 'fixed' && cur.name === p.name ? 'on' : ''}" data-pl="${i}" aria-pressed="${cur.mode === 'fixed' && cur.name === p.name}">${esc(p.name)}</button>`).join('')}</div>
      <p class="t6" role="status" data-pl-msg style="margin:10px 0 0"></p>`);
    const apply = async (place) => { P.set(place); WX.real = undefined; WX.failed = false; await sh.close(); if (['home', 'looks'].includes(curView)) K.refresh(); loadWeather(); };
    $('[data-pl-here]', sh.s).onclick = () => apply({ mode: 'here' });
    $$('[data-pl]', sh.s).forEach((b) => { b.onclick = () => { const p = P.presets[+b.dataset.pl]; apply({ mode: 'fixed', ...p }); }; });
    $('[data-pl-save]', sh.s).onclick = async () => {
      const msg = $('[data-pl-msg]', sh.s);
      msg.textContent = '위치를 확인하는 중이에요…';
      const c = await P.here();
      if (!c) { msg.textContent = '위치를 받지 못했어요. 설정에서 위치를 허용하거나 목록에서 골라 주세요.'; return; }
      apply({ mode: 'fixed', name: '저장한 위치', lat: c.lat, lon: c.lon });
    };
  }
  function menu() {
    const sh = sheet(`<div class="menu"><button class="row" data-info><span class="grow t5">이 시안에 대해</span><i class="ph ph-info arr"></i></button>${window.EOUL_WEATHER_PLACE ? '<button class="row" data-place><span class="grow t5">날씨 지역</span><i class="ph ph-map-pin arr"></i></button>' : ''}<button class="row" data-theme><span class="grow t5">밝게 · 어둡게</span><i class="ph ph-moon arr"></i></button><button class="row" data-reset><span class="grow t5">처음부터 다시</span><i class="ph ph-arrow-counter-clockwise arr"></i></button></div>`);
    $('[data-info]', sh.s).onclick = async () => { await sh.close(); disclose(); };
    const pl = $('[data-place]', sh.s); if (pl) pl.onclick = async () => { await sh.close(); placeSheet(); };
    $('[data-theme]', sh.s).onclick = async () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; await sh.close(); };
    $('[data-reset]', sh.s).onclick = async () => { K.reset(); S.ai = {}; S.aiOrder = {}; S.asking = null; S.ui = { absent: {} }; saveUi(); REG.items = {}; REG.catalog = {}; saveReg(); WX.idx = {}; WX.day = 'today'; await sh.close(); K.tab('home'); };
  }

  const r0 = M.route.current();
  K.start(render, { view: 'home', params: {} });
  // 저장소 문제는 잠깐 뜨는 안내가 아니라 해결될 때까지 남는 알림으로 보여 준다.
  const storageNotice = () => {
    document.getElementById('eo-storage-issue')?.remove();
    const core = M.storageIssue?.() || null;
    const raws = [];
    if (core?.code === 'storage_unreadable') raws.push({ name: 'closet', text: M.unreadableRaw() });
    if (regRaw) raws.push({ name: 'brand-link', text: regRaw });
    if (!core && regRaw === null) return false;
    const el = document.createElement('div');
    el.id = 'eo-storage-issue'; el.setAttribute('role', 'alert');
    el.style.cssText = 'position:fixed;z-index:95;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:14px 16px;border-radius:14px;background:#fff4e5;color:#3d2600;box-shadow:0 8px 24px rgba(0,0,0,.18);font:14px/1.5 system-ui,-apple-system,sans-serif';
    const lines = [core?.message, regRaw !== null ? REG_UNREADABLE : ''].filter(Boolean);
    el.innerHTML = lines.map((l) => `<p style="margin:0 0 8px">${esc(l)}</p>`).join('');
    const bar = document.createElement('div'); bar.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px';
    const button = (text, onclick) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = text; b.style.cssText = 'min-height:40px;padding:0 12px;border:0;border-radius:10px;background:#3d2600;color:#fff;font:600 13px system-ui,sans-serif'; b.onclick = onclick; bar.append(b); return b; };
    for (const r of raws) button(`원문 받기(${r.name === 'closet' ? '옷장' : '브랜드·링크'})`, () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([r.text], { type: 'application/json' }));
      a.download = `eoul-${r.name}-unreadable-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    if (raws.length) {
      const fresh = button('원문을 이 기기에 따로 보관하고 새로 시작', () => {
        if (!fresh.dataset.arm) { fresh.dataset.arm = '1'; fresh.textContent = '한 번 더 누르면 새로 시작해요'; return; }
        try {
          if (M.storageIssue?.()?.code === 'storage_unreadable') M.startFresh();
          if (regRaw !== null) startFreshReg();
          K.toast('원문은 이 기기에 따로 보관했어요. 새로 시작합니다.', { bottom: 128 });
        } catch (error) { K.toast(error.message, { bottom: 128 }); }
        K.refresh(); storageNotice();
      });
    }
    if (bar.children.length) el.append(bar);
    document.body.append(el);
    return true;
  };
  M.subscribe(() => { if (document.getElementById('eo-storage-issue') || M.storageIssue?.()) storageNotice(); });
  if (!storageNotice() && M.boot?.storageError) K.toast(M.boot.storageError, { bottom: 128 });
  if (M.boot?.q) K.go('results', { q: M.boot.q });
  else if (/^\/p\/.+/.test(r0.path)) K.go('detail', { id: r0.path.slice(3) });
  else if (r0.path === '/search' && r0.params.q) K.go('results', { q: r0.params.q });
  else if (['/closet', '/records', '/consult', '/looks'].includes(r0.path)) K.tab(r0.path.slice(1));
  else if (r0.path === '/add') K.go('add', {});
  else if (r0.path === '/reg') K.go('reg', {});
  else if (r0.path === '/compare') K.go('compare', {});
})();
</script>
