<title>걸어 보고 사기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="shared/fonts/pretendard.css">
<link rel="stylesheet" href="shared/icons/regular.css">
<link rel="stylesheet" href="shared/icons/fill.css">
<script>window.EOUL_PHOTO_BASE='p/'; window.EOUL_MOCK_KEY='eoul-d12-hang:v1';</script>

<style>
/* 걸어 보고 사기(d12): 장바구니 대신 '걸어 보기'. 레일은 옷걸이 탭에만 있고, 다른 화면에는 걸린 옷이 있을 때만 한 줄 띠가 보인다.
   강조색은 가격표(택)의 주황 하나. 글자 단계 30 · 22 · 17 · 15 · 13. 고정 영역: 위 44 + 띠 34 + 탭 48 = 126px(844px의 14.9%). */
:root {
  --bg: #fbfbfa; --surface: #ffffff; --well: #f0f0ed; --tile: #ededea; --ptile: #efefec;
  --ink: #1b1b19; --ink2: #55554f; --ink3: #7c7c75; --line: #e2e2de;
  --acc: #e4571e; --acc-text: #b23c0b; --acc-soft: #fdebe2; --btn-bg: #c94612; --btn-fg: #ffffff;
  --dim: rgba(0, 0, 0, .45); --shadow: 0 10px 28px rgba(40, 30, 20, .12);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --tile-on-well: #ffffff;
  --r: 14px; --gutL: max(16px, env(safe-area-inset-left, 0px)); --gutR: max(16px, env(safe-area-inset-right, 0px));
  --top: 44px; --tabs: 48px; --strip: 34px; --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141412; --surface: #1c1c19; --well: #252521; --tile: #2b2b27; --ptile: #e6e6e2;
  --ink: #f3f3ef; --ink2: #c8c8c0; --ink3: #9a9a92; --line: #31312c;
  --acc: #ff6b2c; --acc-text: #ff9a6b; --acc-soft: #3a2116; --btn-bg: #ff7a3d; --btn-fg: #1b0c05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); --tile-on-well: #e6e6e2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1c1c19; --well: #252521; --tile: #2b2b27; --ptile: #e6e6e2;
  --ink: #f3f3ef; --ink2: #c8c8c0; --ink3: #9a9a92; --line: #31312c;
  --acc: #ff6b2c; --acc-text: #ff9a6b; --acc-soft: #3a2116; --btn-bg: #ff7a3d; --btn-fg: #1b0c05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); --tile-on-well: #e6e6e2; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 400 16px/1.55 var(--font); letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; --k-font: var(--font); --k-toast-bg: var(--ink); --k-toast-fg: var(--bg); --k-info-bg: var(--surface); --k-info-fg: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.ph, .ph-fill { line-height: 1; }
.num { font-variant-numeric: tabular-nums; }
.nw { white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; padding: 0 var(--gutR) calc(var(--tabs) + 24px + var(--sab)) var(--gutL); }
.app.strip-on { padding-bottom: calc(var(--tabs) + var(--strip) + 24px + var(--sab)); }
.app.bar { padding-bottom: calc(112px + var(--sab)); }
.app.chat { padding-bottom: calc(var(--tabs) + 84px + var(--sab)); }
.app.pin { padding-bottom: calc(var(--tabs) + 88px + var(--sab)); }
.app.addv { padding-bottom: calc(96px + var(--sab)); }
.view { animation: in 240ms ease-out both; }
.view.back { animation-name: inback; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes inback { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.h1 { font-size: 30px; line-height: 38px; font-weight: 800; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.h2 { font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.h3 { font-size: 17px; line-height: 25px; font-weight: 700; margin: 0; }
.t5 { font-size: 15px; line-height: 22px; }
.t6 { font-size: 13px; line-height: 19px; color: var(--ink3); }
.sub { color: var(--ink2); }
.acc { color: var(--acc-text); }

/* 위쪽 막대(44px). 결과에서는 내리면 숨고 올리면 나온다. */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; height: var(--top); display: flex; align-items: center; gap: 2px; margin: 0 -6px; background: var(--bg); box-shadow: 22px 0 0 var(--bg), -22px 0 0 var(--bg); transition: transform 200ms ease; }
.top.hide { transform: translateY(-110%); }
.top .sp { flex: 1; }
.icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--ink); flex: none; }
.icon.quiet-i { font-size: 20px; color: var(--ink3); margin-left: -6px; }
.icon.quiet-i.end { margin-left: 0; }
.icon:active { background: var(--well); }
.mark { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.mark i { color: var(--acc); font-size: 22px; }
.qbox { flex: 1; min-width: 0; height: 36px; margin: 0 6px 0 2px; border-radius: 10px; background: var(--well); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 600; text-align: left; }
.qbox i { font-size: 18px; color: var(--ink3); flex: none; }
.qbox span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink2); }
.tbtn i { font-size: 18px; }

/* 버튼 */
.btn { min-height: 52px; padding: 0 18px; border-radius: var(--r); font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 120ms ease; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.go { background: var(--btn-bg); color: var(--btn-fg); }
.btn.soft { background: var(--well); color: var(--ink); }
.btn.line { border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; border-radius: 12px; }
.quiet { min-height: 44px; min-width: 44px; padding: 0 4px; margin: 0 -4px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); white-space: nowrap; }

/* 아래 탭(48px) */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding-bottom: var(--sab); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { height: var(--tabs); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--ink3); white-space: nowrap; }
.tabs button i { font-size: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }

/* 걸린 옷 띠(34px): 걸린 옷이 있을 때만, 탭 위 한 줄. 누르면 옷걸이 탭. */
.strip { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabs) + var(--sab)); height: var(--strip); background: var(--ink); color: var(--bg); display: block; width: 100%; }
.strip .in { max-width: 560px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 var(--gutR) 0 var(--gutL); font-size: 13px; font-weight: 700; }
.strip .in i { font-size: 18px; color: var(--acc); flex: none; }
.strip .in .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.strip .in .go { flex: none; display: inline-flex; align-items: center; gap: 2px; font-weight: 600; opacity: .8; }
.strip .in .go i { font-size: 14px; color: inherit; }
.strip.pop { animation: strip-in 320ms var(--spring, ease) both; }
@keyframes strip-in { from { transform: translateY(100%); } to { transform: none; } }

/* 사진: 모든 상품 칸은 3:4, 같은 밝은 바탕. 흰 배경 단독 사진은 바탕에 녹이고(multiply), 모델 사진은 채운다. */
.ph-box { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; background: var(--ptile); overflow: hidden; display: grid; place-items: center; }
.ph-box img { display: block; }
.ph-box img.cover { width: 100%; height: 100%; object-fit: cover; }
.ph-box img.flat { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
.ph-box .eo-ph, .ph-box .eo-tile { position: absolute; inset: 0; aspect-ratio: auto !important; border-radius: 0 !important; }
.ph-box .swatch { position: absolute; inset: 0; display: grid; place-items: center; }
.ph-box .swatch i { width: 46%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.ph-box .tag { position: absolute; left: 6px; top: 6px; max-width: calc(100% - 56px); height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(27, 27, 25, .82); color: #fff; }
.ph-box .tag.go { background: var(--btn-bg); color: var(--btn-fg); }
.ph-box .tag.ok { background: rgba(255, 255, 255, .92); color: #1b1b19; }
.hslot .rank { position: absolute; left: 6px; bottom: 6px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; background: rgba(27, 27, 25, .82); color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; pointer-events: none; }
.hslot .rank i { font-size: 12px; color: var(--acc); }
/* 걸기 토글: 사진 모서리의 옷걸이. 누르는 곳은 44px, 보이는 동그라미는 32px. */
.hangt { position: absolute; right: 0; top: 0; width: 44px; height: 44px; display: grid; place-items: center; }
.hangt span { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .92); color: #1b1b19; display: grid; place-items: center; font-size: 19px; box-shadow: 0 1px 4px rgba(0, 0, 0, .14); transition: transform 160ms var(--spring, ease), background 160ms ease; }
.hangt[aria-pressed="true"] span { background: var(--btn-bg); color: var(--btn-fg); }
.hangt.pop span { animation: pop 420ms var(--spring, ease); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
.hangt.big { width: 56px; height: 56px; right: 4px; top: 4px; }
.hslot { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 3 / 4; pointer-events: none; }
.hslot > * { pointer-events: auto; }
.strip[hidden], .tabs[hidden] { display: none; }
.pdp-photo .zoomb { display: grid; place-items: center; }
.hangt.big span { width: 44px; height: 44px; font-size: 24px; }

/* 홈 */
.hero { margin-top: 16px; }
.ask { margin-top: 16px; display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; height: 56px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); padding: 0 16px; font-size: 17px; outline: none; }
.ask input:focus { border-color: var(--acc); }
.ask input::placeholder { color: var(--ink3); }
.ask button { width: 56px; height: 56px; border-radius: var(--r); background: var(--btn-bg); color: var(--btn-fg); display: grid; place-items: center; font-size: 24px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--gutL)); margin-right: calc(-1 * var(--gutR)); padding: 0 var(--gutR) 0 var(--gutL); }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll::after { content: ""; flex: none; width: 28px; }
.chips.scroll.fade { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
.chip { min-height: 38px; padding: 0 13px; border-radius: 999px; background: var(--well); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); white-space: nowrap; flex: none; }
.chip i { font-size: 14px; color: var(--ink3); }
.chip.ex { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); }
.section { margin-top: 24px; }
.section > .h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section > .h .h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proof { margin-top: 24px; padding: 16px; border-radius: 18px; background: var(--well); }
.proof .label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.proof .label i { font-size: 16px; color: var(--acc-text); }
.proof .h3 { margin-top: 4px; }
.prow { width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); text-align: left; }
.prow:first-of-type { border-top: 0; }
.prow .ph-box { width: 56px; flex: none; border-radius: 8px; }
.prow .grow { flex: 1; min-width: 0; }
.prow .n { font-size: 14px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.prow .d { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--acc-text); display: block; }
.prow .n { white-space: normal; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.prow .d.stop { color: var(--ink2); }
.prow .arr { color: var(--ink3); font-size: 18px; flex: none; }
.demo { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; margin-top: 12px; }
.demo .ths { display: flex; gap: 6px; flex-wrap: wrap; }
.demo .ths .ph-box { width: 40px; border-radius: 7px; }
.demo .cap { margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--ink2); }

/* 오늘 날씨 코디(R17): 첫 화면 맨 위. 기온 한 줄 → 사진 네 장 → 이유 한 줄. 설명문은 ⓘ에만. */
.wx { margin-top: 12px; padding: 14px 16px 12px; border-radius: 20px; background: var(--well); }
.wx .wx-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; margin-top: 2px; }
.wx .wx-t { font-size: 22px; line-height: 30px; font-weight: 800; letter-spacing: -.025em; min-width: 0; }
.wx .wx-days { display: inline-flex; flex: none; border-radius: 999px; background: var(--surface); margin: -6px -6px -6px 0; }
.wx .wx-place { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: -12px 0; padding: 0 4px; font: inherit; color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.chips.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.wx .wx-day { min-height: 44px; min-width: 48px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink3); }
.wx .wx-day[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.wx .wx-band { margin-top: 2px; font-size: 15px; line-height: 22px; color: var(--ink2); }
.wx .wx-band b { color: var(--ink); }
.wx .wx-note { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--ink2); display: flex; gap: 6px; }
.wx .wx-note i { font-size: 17px; flex: none; color: var(--ink3); margin-top: 1px; }
.wx .wx-ps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.wx .wx-ps .p1 { min-width: 0; }
.wx .wx-ps .ph-box { border-radius: 10px; background: var(--tile-on-well); }
.wx .wx-ps .t6 { margin-top: 5px; font-size: 12px; line-height: 16px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wx .wx-why { margin: 10px 0 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--acc-text); display: flex; gap: 6px; }
.wx .wx-why i { font-size: 18px; flex: none; }
.wx .wx-ac { display: flex; align-items: center; gap: 14px; margin-top: 2px; flex-wrap: wrap; }
.wx .wx-ac .quiet { text-decoration: none; }
.wx .wx-ac .quiet i { font-size: 16px; }
.wx .wx-miss { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
.wx .wx-miss .h3 { font-size: 15px; line-height: 22px; }
.wx .wx-miss .wx-mg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.wx .wx-miss .wx-mg .ph-box { background: var(--tile-on-well); }
.wx .wx-miss .wx-mg .card .n { -webkit-line-clamp: 1; }
.wx .wx-miss .wx-mg .card .p { font-size: 14px; white-space: normal; }
.wx .wx-miss .wx-mg .card .p small { display: block; margin-left: 0; line-height: 16px; }
.wx .wx-miss .quiet { text-decoration: none; }
.wx .wx-ex { display: flex; flex-direction: column; align-items: stretch; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.wx .wx-ex .t6 { font-size: 12px; font-weight: 700; }
.wx .wx-ex .chips.scroll { min-width: 0; margin: 0 -16px; padding: 0 16px; height: 44px; }
.wx .wx-ex .chips.scroll::after { width: 8px; }
.wx .wx-ex .chips .chip { min-height: 44px; padding: 0 12px; font-size: 13px; background: var(--surface); }
.wx .wx-ex .chips .chip.on { background: var(--ink); color: var(--bg); }
.wx .wx-invite { margin-top: 2px; }
.wx .wx-invite .h3 { margin-top: 4px; }
.wx .wx-invite .btns { display: flex; gap: 8px; margin-top: 12px; }
.wx .wx-invite .btns .btn { flex: 1; min-height: 46px; font-size: 15px; padding: 0 10px; }
.wx .label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; align-items: center; gap: 6px; min-height: 32px; }
.wx .label > i { font-size: 16px; color: var(--acc-text); }
.wx .label .sp { flex: 1; }
.wx .wx-wait { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink2); font-size: 14px; }
.wx .wx-wait i { animation: spin 1.2s linear infinite; }
.hero.after-wx { margin-top: 28px; }

/* 직접 등록(목록에 없는 옷): 한 화면, 브랜드·상품명·종류·색·링크(선택). 사진은 받지 않는다. */
.field { margin-top: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }
.field input { width: 100%; height: 50px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; font-size: 16px; outline: none; }
.field input:focus { border-color: var(--acc); }
.field .hint { margin-top: 6px; font-size: 12px; line-height: 16px; color: var(--ink3); }
.regk { margin-top: 14px; }
.regk .label { font-size: 13px; font-weight: 700; color: var(--ink2); margin-bottom: 8px; display: flex; justify-content: space-between; }
.regk .kinds { grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.regk .kinds button { font-size: 13px; position: relative; min-height: 44px; }
.regk .kinds button .ph-box { margin-bottom: 4px; }
.regk .kinds button[aria-pressed="true"] .ph-box { box-shadow: 0 0 0 2px var(--acc); }
.regk .colors { grid-template-columns: repeat(6, 1fr); gap: 12px 6px; }
.regk .colors button { font-size: 12px; }
.regk .colors button i { width: 40px; height: 40px; }
.regk .colors button[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--acc); }
.regk .colors button[aria-pressed="true"] { color: var(--acc-text); font-weight: 700; }

/* 결과: 무신사 밀도. 2열, 3:4 사진, 글 3줄. 카드마다 이유는 없고(위에 한 줄 총평), 걸기는 사진 모서리 토글. */

/* 한 번 묻기: 걸었는데 옷장이 비어 있거나 이 종류가 없으면, 그 줄 아래에 두 칸짜리 한 줄로 묻는다(카드 높이는 그대로). */

.pdp-photo { margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); border-radius: 0; aspect-ratio: 4 / 5; }

.box { margin-top: 16px; padding: 16px; border-radius: 18px; background: var(--well); }

.rail { margin-top: 4px; position: relative; padding: 4px 0 2px; }

.pinbar { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabs) + var(--sab)); padding: 10px var(--gutR) 10px var(--gutL); background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }

/* 기록 */

.rc { flex: none; width: 132px; display: flex; flex-direction: column; position: relative; }

<script>
(() => {
  const { M, esc, $, $$ } = K;
  // 기존 동기/비동기 이벤트 중 개별 catch가 없는 곳도 저장 실패를 사용자에게 알린다.
  const reportStorageError = (event, error) => {
    if (!['storage_write_failed', 'storage_unreadable', 'registration_write_failed'].includes(error?.code)) return;
    event.preventDefault(); K.toast(error.message, { bottom: 128 });
  };
  window.addEventListener('error', (event) => reportStorageError(event, event.error));
  window.addEventListener('unhandledrejection', (event) => reportStorageError(event, event.reason));
  const DESIGN = '걸어 보고 사기';
  const UI_KEY = 'eoul-d12-hang:ui';
  const S = { ai: {}, aiOrder: {}, result: null, snackT: 0, asking: null, pending: null, ui: { absent: {} } };
  try { S.ui = { absent: {}, ...JSON.parse(localStorage.getItem(UI_KEY) || '{}') }; } catch {}
  const saveUi = () => { try { localStorage.setItem(UI_KEY, JSON.stringify(S.ui)); } catch {} };

  // ── 직접 등록한 옷(목록에 없는 옷, R15): 브랜드·상품명·종류·색·링크만, 사진 없음. 이 기기에 저장(eoul-d12-hang:reg).
  // 설치 앱이 window.EOUL_CROWD를 주면 공용 목록에도 보낸다(같은 옷 3명 → 모두 검색). 없으면 '이 기기에만 1/3'로 정직하게 센다.
  const REG_KEY = 'eoul-d12-hang:reg';
  const NEED = 3;
  const REG = { items: {}, catalog: {} };
  // 읽지 못한 부가정보 원문은 빈 값으로 덮어쓰지 않는다. regRaw가 있으면 저장을 멈추고 보관 후 새로 시작만 허용한다.
  const REG_UNREADABLE = '저장된 브랜드·링크 정보를 읽지 못했어요. 지우지 않도록 저장을 멈췄어요.';
  const obj = (x) => x && typeof x === 'object' && !Array.isArray(x);
  let regRaw = null;
  try {
    const raw = localStorage.getItem(REG_KEY);
    if (raw) {
      try {
        const v = JSON.parse(raw);
        if (!obj(v) || (v.items !== undefined && !obj(v.items)) || (v.catalog !== undefined && !obj(v.catalog))) throw new Error('unsupported');
        Object.assign(REG, { items: v.items || {}, catalog: v.catalog || {} });
      } catch { regRaw = String(raw); }
    }
  } catch { regRaw = ''; } // 읽기 자체가 막히면 무엇이 저장돼 있는지 모르므로 쓰지 않는다.
  let savedReg = structuredClone(REG);
  const regFailed = (message) => Object.assign(new Error(message), { code: 'registration_write_failed' });
  const startFreshReg = () => {
    if (regRaw === null) return null;
    const keep = regFailed('브랜드·링크 원문을 따로 보관하지 못해 새로 시작하지 않았어요. 원문 파일을 먼저 받아 주세요.');
    let current; try { current = localStorage.getItem(REG_KEY); } catch { throw keep; }
    if (current !== regRaw) throw regFailed('다른 화면에서 정보가 바뀌었어요. 새로고침한 뒤 다시 확인해 주세요.');
    const archiveKey = `${REG_KEY}:unreadable:${new Date().toISOString()}`;
    try {
      localStorage.setItem(archiveKey, regRaw);
      if (localStorage.getItem(archiveKey) !== regRaw) throw new Error('mismatch');
      localStorage.setItem(REG_KEY, JSON.stringify({ items: {}, catalog: {} }));
    } catch { throw keep; }
    regRaw = null; REG.items = {}; REG.catalog = {}; savedReg = structuredClone(REG);
    return archiveKey;
  };
  const saveReg = () => {
    if (regRaw !== null) { Object.assign(REG, structuredClone(savedReg)); throw regFailed(REG_UNREADABLE); }
    try {
      const next = structuredClone(REG);
      localStorage.setItem(REG_KEY, JSON.stringify(next));
      savedReg = next;
    } catch {
      Object.assign(REG, structuredClone(savedReg));
      throw Object.assign(new Error('추가 정보를 저장하지 못했어요. 옷장 변경은 이미 저장됐을 수 있어요.'), { code: 'registration_write_failed' });
    }
  };
  const normKey = (brand, name) => `${brand} ${name}`.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' ');
  const regOf = (gid) => M.registrationMetadata?.(gid) || REG.items[gid] || null;
  const registrationCatalog = () => {
    const catalog = { ...REG.catalog };
    for (const g of M.getState().closet) {
      const meta = M.registrationMetadata?.(g.id);
      if (meta && !meta.source) catalog[meta.key] = { ...catalog[meta.key], ...meta, mine: true, count: catalog[meta.key]?.count || 1 };
    }
    return catalog;
  };
  // 공개 DB에서 선택한 정보는 개인 등록에 출처를 남기고 공용(3명 확인) 목록에 재전송하지 않는다.
  const opfNotice = (source) => source?.provider === 'opf' && /^\d{6,24}$/.test(source.code)
    ? `<p class="t6" style="margin:10px 0">Open Products Facts에서 가져온 정보 · <a href="https://world.openproductsfacts.org/product/${source.code}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">원본 확인</a> · <a href="https://opendatacommons.org/licenses/odbl/1-0/" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">ODbL</a><br>종류·색과 실제로 가진 상품인지 확인해 주세요. 상품 사진·가격은 제공하지 않아요.</p>` : '';
  const rakutenLink = (q) => {
    const text = String(q || '').trim();
    const url = text ? `https://search.rakuten.co.jp/search/mall/${encodeURIComponent(text)}/` : null;
    return url ? `<section class="section" data-rakuten-panel><h2 class="h3">일본 상품도 더 찾아볼까요?</h2><p class="t6">라쿠텐 키워드 검색 · 앱의 예산·핏·코디 조건은 적용되지 않아요. 일본어 판매처에서 구매하며 한국 배송은 판매처에서 확인해 주세요.</p>${window.EOUL_RAKUTEN ? `${window.EOUL_SERVER_AI ? `<button class="btn line sm" data-rakuten-plan data-rakuten-q="${esc(text)}">AI로 일본어 검색어 만들기</button><div data-rakuten-plan-result aria-live="polite"></div>` : ''}<button class="btn line sm" data-rakuten-search data-rakuten-q="${esc(text)}">입력한 말로 라쿠텐 검색</button><div data-rakuten-results aria-live="polite"></div>` : ''}<a class="row" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><span class="grow t5">라쿠텐 사이트에서 직접 검색</span><i class="ph ph-arrow-up-right arr"></i></a></section>` : '';
  };
  const adpickLink = (q) => {
    const text = String(q || '').trim();
    if (text.length > 100) return '<p class="t6">국내 상품 검색어는 100자 이내로 입력해 주세요.</p>';
    return text && window.EOUL_ADPICK ? `<section class="section" data-adpick-panel data-adpick-q="${esc(text)}"><h2 class="h3">국내 쇼핑몰 상품</h2><p class="t6">애드픽 제휴 광고 · 입력한 단어로 찾아요. 예산·핏·코디 조건은 적용하지 않아요.</p><div data-adpick-results aria-live="polite"><p class="t6" role="status">국내 상품을 찾고 있어요…</p></div></section>` : '';
  };
  const shoppingLinks = (q) => adpickLink(q) + rakutenLink(q);
  const searchSources = (q) => adpickLink(q) + (window.EOUL_OPEN_PRODUCT_SEARCH ? '<section class="section" data-open-recommendations aria-live="polite"></section>' : '') + rakutenLink(q);
  const crowd = () => (window.EOUL_CROWD && typeof window.EOUL_CROWD.submit === 'function' ? window.EOUL_CROWD : null);
  // 등록 상태 한 줄: 서버가 답하면 그 숫자, 아니면 이 기기 숫자.
  const crowdLine = (c) => {
    const n = Math.min(NEED, c.serverCount || c.count || 1), min = c.serverMin || NEED;
    const meter = `<span class="meter" aria-hidden="true">${Array.from({ length: min }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
    if (c.searchable) return `같은 옷을 ${min}명이 등록해서 이제 모두가 검색할 수 있어요${meter}`;
    return `같은 옷을 ${min}명이 등록하면 모두가 검색할 수 있어요 · 지금 ${n}/${min}${meter}${c.server ? '' : ' · 서버 연결 전에는 이 기기에만'}`;
  };

  // ── 오늘 날씨 코디(R17). 날씨는 설치 앱이 window.EOUL_WEATHER로 준다. 없으면(이 링크 페이지) '예시 날씨'를 분명히 표시하고 골라 보게 한다.
  const WX_EX = [
    { id: 'cold2', label: '아주 추움 -3°/4°', today: { min: -3, max: 4, rain: false }, tomorrow: { min: -1, max: 6, rain: false } },
    { id: 'cold', label: '추움 6°/15°', today: { min: 6, max: 15, rain: false }, tomorrow: { min: 9, max: 18, rain: false } },
    { id: 'cool', label: '쌀쌀 14°/24° 비', today: { min: 14, max: 24, rain: true }, tomorrow: { min: 12, max: 21, rain: false } },
    { id: 'hot', label: '더움 22°/30°', today: { min: 22, max: 30, rain: false }, tomorrow: { min: 23, max: 31, rain: false } },
  ];
  const WX = { real: undefined, failed: false, loading: false, day: 'today', idx: {} };
  const wxNum = (w) => w && Number.isFinite(+w.min) && Number.isFinite(+w.max) ? { min: +w.min, max: +w.max, rain: !!w.rain, date: w.date || '' } : null;
  function wxSource() {
    if (WX.real) return { kind: 'real', place: WX.real.place || '', today: WX.real.today, tomorrow: WX.real.tomorrow || null };
    const ex = WX_EX.find((e) => e.id === S.ui.wxEx) || WX_EX[1];
    return { kind: 'example', ex, today: ex.today, tomorrow: ex.tomorrow };
  }
  async function loadWeather() {
    if (WX.real !== undefined || WX.loading) return;
    if (typeof window.EOUL_WEATHER !== 'function') { WX.real = null; return; }
    WX.loading = true;
    try { const w = await window.EOUL_WEATHER(); const t = wxNum(w?.today); WX.real = t ? { place: w.place || '', today: t, tomorrow: wxNum(w.tomorrow) } : null; WX.failed = !t; }
    catch { WX.real = null; WX.failed = true; }
    WX.loading = false;
    if (['home', 'looks'].includes(curView)) { const y = scrollY; K.refresh(); requestAnimationFrame(() => scrollTo(0, y)); }
  }

  // ── 설명은 한 곳에(ⓘ): 코어의 고지 + 이 시안이 더한 것(날씨 규칙, AI 순위·상담, 직접 등록). 화면마다 같은 말을 반복하지 않는다.
  function disclose() {
    if ($('.sheet')) return;
    let base = { title: '이 시안에 대해', sections: [] };
    try { base = M.disclosure(); } catch {}
    const extra = [

    }
    // 옷장이 비어 있으면 날씨 카드가 초대를 맡는다(홈에 초대를 두 번 두지 않는다).
    return '';
  }
  // 옷장이 비었을 때의 초대: 브랜드·품명 검색 상자와 예시, 체험용 옷장. 옷장·코디에서 같이 쓴다.
  const ADD_EX = ['무신사 옥스포드', '유니클로', '나이키', '폴로', '뉴발란스', '아디다스'];
  const addExamples = () => ADD_EX.filter((b) => { try { return M.findProducts(b, { limit: 1 }).length; } catch { return false; } }).slice(0, 4);
  function inviteHtml({ label, h }) {
    return `<section class="proof" aria-label="옷장 넣기"><div class="label"><i class="ph-fill ph-coat-hanger"></i>${esc(label)}</div>
      <h2 class="h3">${esc(h)}</h2>
      <button class="sbox" data-add-open style="margin-top:12px"><i class="ph ph-magnifying-glass"></i>브랜드나 상품명으로 찾기</button>
      <div class="chips" style="margin-top:10px">${addExamples().map((b) => `<button class="chip ex" data-add-q="${esc(b)}">${esc(b)}</button>`).join('')}</div>
      <div style="display:flex;gap:16px;margin-top:4px;flex-wrap:wrap"><button class="quiet" data-trial>체험용 옷장으로 먼저 보기</button><button class="quiet" data-reg-open>직접 등록</button><button class="quiet" data-addkind>종류·색만</button></div></section>`;
  }
  // 코디 한 벌: 내 옷은 판매처 사진이나 비슷한 상품 사진, 후보는 주황 테두리. '규칙으로 조합한 예시' 같은 설명은 ⓘ에만.
  function lookHtml(o, { title = '', sub = '', owned = true } = {}) {
    const ps = o.pieces.filter((x) => ['outer', 'top', 'inner', 'bottom', 'shoes', 'dress'].includes(x.role));
    const main = ps.filter((x) => x.role !== 'inner').slice(0, 4);
    const cap = (x) => x.owned ? `${esc(x.label)}${x.trial ? ' · 체험용' : ''}` : x.product ? `후보 · ${esc(x.product.priceText)}` : esc(x.label);
    const tail = owned ? sub : `${sub ? `${sub} · ` : ''}내 옷 ${o.ownedCount}벌 + 후보 ${o.buyCount}벌`;
    return `<div class="lk"><div class="head"><b>${esc(title || (o.formula && o.formula !== o.title ? o.formula : o.title))}</b><span class="t6">${tail}</span></div>
      <div class="ps">${main.map((x) => `<div class="p1${x.owned ? '' : ' cand'}">${x.owned ? piecePic(x) : x.product ? productPic(x.product.id) : piecePic(x)}<div class="${x.owned ? 't6' : 'pr'}">${cap(x)}</div></div>`).join('')}</div></div>`;
  }

  // ── 오늘 날씨 코디 카드: 기온 한 줄 → 사진 네 장 → 이유 한 줄. 홈 맨 위와 코디 탭 맨 위에서 같은 카드를 쓴다.
  function weatherHtml({ where = 'home' } = {}) {
    const st = M.getState();
    if (WX.loading || (WX.real === undefined && typeof window.EOUL_WEATHER === 'function')) {
      return `<section class="wx" aria-label="오늘 날씨 코디"><div class="wx-wait" role="status"><i class="ph ph-circle-notch"></i>오늘 날씨를 불러오는 중이에요</div></section>`;
    }
    const src = wxSource();
    const day = WX.day === 'tomorrow' && src.tomorrow ? 'tomorrow' : 'today';
    const w = src[day];
    const canPlace = !!window.EOUL_WEATHER_PLACE;
    const srcTag = src.kind === 'real'
      ? (canPlace ? `<button class="wx-place" data-wxplace aria-label="날씨 지역 바꾸기: ${esc(src.place || '현재 위치')}">${esc(src.place || '현재 위치')}<i class="ph ph-caret-down"></i></button>` : esc(src.place || '현재 위치'))
      : '예시 날씨';
    const temp = `<span class="wx-t num">${day === 'today' ? '오늘' : '내일'} · 아침 ${w.min}° → 낮 ${w.max}°${w.rain ? ' · 비' : ''}</span>`;
    const days = src.tomorrow ? `<span class="wx-days" role="group" aria-label="날짜"><button class="wx-day" data-wxday="today" aria-pressed="${day === 'today'}">오늘</button><button class="wx-day" data-wxday="tomorrow" aria-pressed="${day === 'tomorrow'}">내일</button></span>` : '';
    const head = `<div class="label"><i class="ph-fill ph-sun-horizon"></i>날씨 코디 · ${srcTag}<span class="sp"></span>${days}</div><div class="wx-h">${temp}</div>`;
    const exRow = src.kind === 'example' ? `<div class="wx-ex"><span class="t6 nw">${WX.failed ? '날씨를 못 받아 예시로' : '예시 날씨 · 설치 앱에서는 실제 날씨'}</span><div class="chips scroll" aria-label="예시 날씨 고르기">${WX_EX.map((e) => `<button class="chip ${e.id === src.ex.id ? 'on' : 'ex'}" data-wxex="${e.id}" aria-pressed="${e.id === src.ex.id}">${esc(e.label)}</button>`).join('')}</div></div>` : '';
    if (!st.closetCount) {
      return `<section class="wx" aria-label="오늘 날씨 코디">${head}
        <div class="wx-invite"><h2 class="h3">옷장을 채우면 날씨에 맞춰 골라 드려요</h2>
        <div class="btns"><button class="btn go" data-add-open><i class="ph ph-magnifying-glass"></i>브랜드로 찾아 넣기</button><button class="btn soft" data-trial>체험용 옷장</button></div></div>${exRow}</section>`;
    }
    let r;
    try { r = M.weatherOutfits(w, { limit: 3 }); } catch (e) { r = { ok: false, message: e.message }; }
    if (!r.ok) return `<section class="wx" aria-label="오늘 날씨 코디">${head}<p class="t5 sub" style="margin:8px 0 0">${esc(r.message || '날씨 정보가 없어요.')}</p>${exRow}</section>`;
    const key = `${day}|${w.min}|${w.max}|${w.rain ? 1 : 0}`;
    const n = r.outfits.length;
    const i = n ? (WX.idx[key] || 0) % n : 0;
    const o = n ? r.outfits[i] : null;
    const band = `<div class="wx-band"><b>${esc(r.band.label)}</b> · ${esc(r.band.advice)}</div>${r.notes.length ? `<p class="wx-note"><i class="ph ${w.rain ? 'ph-umbrella' : 'ph-thermometer'}"></i><span>${esc(r.notes.join(' '))}</span></p>` : ''}`;
    const pieces = o ? o.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4) : [];
    const photos = o ? `<div class="wx-ps">${pieces.map((x) => `<div class="p1">${piecePic(x)}<div class="t6">${esc(x.label)}${x.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : '';
    const why = o ? (r.short ? '딱 맞는 조합이 없어서 가진 옷 중 가장 가까운 거예요' : (o.reasons[0] || `${esc(r.band.label)}에 맞는 조합이에요`)) : '상의·하의·신발이 한 벌씩 있어야 조합이 생겨요';
    const whyMore = o && !r.short && o.reasons.length > 1 ? ` · ${o.reasons.slice(1).join(' · ')}` : '';
    const ac = `<div class="wx-ac">${n > 1 ? `<button class="quiet" data-wxnext><i class="ph ph-arrows-clockwise"></i>다른 조합 <span class="num">${i + 1}/${n}</span></button>` : ''}${where === 'home' ? '<button class="quiet" data-tabgo="looks">코디 더 보기<i class="ph ph-caret-right"></i></button>' : ''}</div>`;
    let miss = '';
    if (r.missing) {
      let ps = [];
      try { const q = M.ask(r.missing.query); ps = q.understood ? q.products.slice(0, 3) : []; } catch {}
      miss = `<div class="wx-miss"><h3 class="h3">${day === 'today' ? '오늘' : '내일'} 같은 날엔 ${esc(r.missing.label)}${josa(r.missing.label, '이', '가')} 있으면 좋아요</h3>
        ${ps.length ? `<div class="wx-mg">${ps.map((p) => cardHtml(p, null)).join('')}</div><button class="quiet" data-q="${esc(r.missing.query)}" style="margin-top:2px">${esc(r.missing.query)} 더 보기<i class="ph ph-caret-right"></i></button>` : `<p class="t6" style="margin:4px 0 0">맞는 ${esc(r.missing.label)} 상품을 찾지 못했어요.</p>`}</div>`;
    }
    return `<section class="wx" aria-label="오늘 날씨 코디">${head}${band}${photos}<p class="wx-why"><i class="ph-fill ph-check-circle"></i><span>${esc(why)}${esc(whyMore)}</span></p>${ac}${miss}${exRow}</section>`;
  }
  function wireWeather() {
    $$('[data-wxex]').forEach((b) => { b.onclick = () => { S.ui.wxEx = b.dataset.wxex; saveUi(); keepY(); }; });
    $$('[data-wxday]').forEach((b) => { b.onclick = () => { WX.day = b.dataset.wxday; keepY(); }; });
    $$('[data-wxplace]').forEach((b) => { b.onclick = placeSheet; });
    const nx = $('[data-wxnext]'); if (nx) nx.onclick = () => { const src = wxSource(); const day = WX.day === 'tomorrow' && src.tomorrow ? 'tomorrow' : 'today'; const w = src[day]; const key = `${day}|${w.min}|${w.max}|${w.rain ? 1 : 0}`; WX.idx[key] = (WX.idx[key] || 0) + 1; keepY(); };
    loadWeather();
  }
  const keepY = () => { const y = scrollY; K.refresh(); requestAnimationFrame(() => scrollTo(0, y)); };
  const MOODS = [['work', '출근'], ['date', '데이트'], ['weekend', '주말·여행'], ['formal', '격식·하객']];
  const moodAsk = (label) => { try { const r = M.ask(`${label} 코디`); return r.understood && (r.conditions || []).some((c) => c.key === 'occasion') ? r : null; } catch { return null; } };
  // ‘한 벌만 더’ 상품 줄: 사진·브랜드·품명·이유·수집가 + 걸기 토글.
  const sgRow = (p, why = '') => `<div class="sg" data-card="${p.id}"><span class="pic">${productPic(p.id)}${hangToggle(p.id)}</span><button class="grow" data-pid="${p.id}"><span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="why">${esc(why || p.why || p.reason || '')}</span><span class="p num">${esc(p.priceText)}<small>${esc(p.priceShort)}</small></span></button></div>`;

  const V = {
    home({ q = '' } = {}) {
      const ex = M.examples().slice(0, 4);
      return `${top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' })}
        ${weatherHtml({ where: 'home' })}
        <h1 class="h1 hero after-wx">뭐 사려고요?<br><span class="acc">걸어 보고</span> 사요.</h1>
        <form class="ask" id="sf" role="search"><input id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="대충 말해도 돼요" aria-label="찾는 옷" value="${esc(q)}"><button aria-label="찾기"><i class="ph ph-arrow-right"></i></button></form>
        <div class="chips">${ex.map((x) => `<button class="chip ex" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        ${proofHtml()}`;
    },

    results({ q, drop = [] }) {
      const parsed = M.ask(q, { drop });
      // Do not present a broad local match as the requested brand/condition.
      // Provider search still receives the full request independently below.
      const partial = (parsed.notices || []).filter((n) => ['unknown', 'unsupported'].includes(n.kind));
      const r = partial.length ? { ...parsed, understood: false, products: [], notices: [{ text: '기존 상품 목록에서 요청의 일부를 확인하지 못해 다른 상품으로 채우지 않았어요. 브랜드·상품명으로 다시 검색하거나 아래 국내 상품 결과를 확인해 주세요.' }] } : parsed;
      const chips = (r.conditions || []).map((c) => c.removable ? `<button class="chip" data-drop="${esc(c.key)}" aria-label="${esc(c.label)} 조건 빼기">${esc(c.label)}<i class="ph ph-x"></i></button>` : `<span class="chip on">${esc(c.label)}</span>`).join('');
      const head = top({ mid: `<button class="qbox" data-edit="${esc(q)}" aria-label="다시 찾기: ${esc(q)}"><i class="ph ph-magnifying-glass"></i><span>${esc(q)}</span></button>` });
      S.result = null;
      if (partial.length && (window.EOUL_ADPICK || window.EOUL_OPEN_PRODUCT_SEARCH)) {
        return `${head}${searchSources(q)}<details class="ai-info"><summary>기존 상품 목록에서 찾지 못한 이유</summary><p class="t6">${esc(r.notices[0].text)}</p></details>`;
      }
      if (!r.understood || !r.products.length) {
        const rel = r.understood ? M.relax(r) : [];
        const note = (r.notices || []).find((n) => n.text)?.text;
        const kindLabel = (r.conditions || []).find((c) => c.key === 'kind')?.label || '';
        const alts = [];
        if (r.understood && kindLabel) {
          const genderNotice = /남성 상품에는/.test(note || '') ? 'F' : /여성 상품에는/.test(note || '') ? 'M' : null;
          if (genderNotice) alts.push({ label: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}로 보기`, q: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}` });
          M.kindChoices().filter((k) => k.name !== kindLabel).slice(0, 5).forEach((k) => alts.push({ label: `${k.name}${josa(k.name, '으로', '로')} 보기`, q: q.includes(kindLabel) ? q.replace(kindLabel, k.name) : k.name }));
        }
        return `${head}${chips ? `<div class="chips scroll">${chips}</div>` : ''}
          <div class="empty"><h2 class="h2">${partial.length ? '기존 목록에서 일부 조건을 확인하지 못했어요' : r.understood ? '조건에 맞는 옷이 없어요' : '무슨 옷인지 못 알아들었어요'}</h2>
          <p class="sub t5" style="margin-top:6px">${esc(note || (r.understood ? '다른 옷으로 바꿔 채우지 않았어요.' : '종류를 넣어 다시 말해 주세요. 예: 셔츠, 코트, 운동화'))}</p>
          ${rel.length ? `<div style="margin-top:12px">${rel.map((x) => `<button class="row" data-relax='${esc(JSON.stringify(x.drop))}'><span class="grow t5">${esc(x.title)}</span><i class="ph ph-caret-right arr"></i></button>`).join('')}</div>` : ''}
          ${alts.length ? `<p class="t6" style="margin-top:20px">대신 이렇게 볼 수도 있어요</p><div class="chips">${alts.map((a) => `<button class="chip ex" data-q="${esc(a.q)}">${esc(a.label)}</button>`).join('')}</div>` : ''}
          ${!rel.length && !alts.length ? `<div class="chips" style="margin-top:18px">${M.examples().slice(0, 3).map((x) => `<button class="chip ex" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}</div>${searchSources(q)}`;
      }
      S.result = r;
      const basis = M.judge(r.products[0].id)?.basisLabel || '';
      const list = r.products.slice(0, 12);
      const order = S.aiOrder[q];
      const sorted = order ? [...list].sort((a, b) => (order[a.id] ?? 99) - (order[b.id] ?? 99)) : list;
      S.shown = { main: sorted, off: (r.offOccasion || []).slice(0, 6) }; S.curQ = q;
      return `${head}
        <div class="chips scroll" aria-label="조건"><span class="cnt num">${r.products.length}개 · ${esc(basis.replace(' 판단했어요', ''))}</span>${chips}</div>
        <div class="ai ${order ? '' : 'wait'}" id="ai" role="status">${order ? `<i class="ph-fill ph-sparkle"></i><span>${esc(S.aiSummary?.[q] || 'AI가 후보 순서를 정했어요')}</span>` : '<i class="ph ph-circle-notch"></i><span>AI가 후보 순서를 정하는 중이에요</span>'}</div>
        <div class="grid" id="grid">${gridHtml(sorted)}</div>
        ${r.offOccasion?.length ? `<section class="offh"><h2 class="h3">${esc(r.offOccasionTitle || '상황과 덜 맞는 옷')}</h2><div class="grid" id="offgrid">${gridHtml(S.shown.off)}</div></section>` : ''}${searchSources(q)}`;
    },

    consult() {
      const th = C.thread();
      if (!th) {
        const list = [...C.threads].sort((a, b) => String(b.at).localeCompare(String(a.at)));
        return `${top({ back: false, right: list.length ? '<button class="tbtn" data-delall>모두 지우기</button>' : '' })}
          <h1 class="h1" style="margin-top:12px">코디 상담</h1>
          <p class="t5 sub" style="margin-top:4px">옷·코디 이야기만 답해요</p>
          <div class="chips">${CHAT_EX.map((q) => `<button class="chip ex" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>
          ${list.length ? `<section class="section"><div class="h"><h2 class="h3">이전 상담 <span class="t6 num">${list.length}</span></h2></div>
            <div class="hist">${list.map((t) => `<div class="hrow"><button class="grow" data-thread="${t.id}"><span class="n">${esc(t.title)}</span><span class="t6">${esc(whenText(t.at))} · 주고받은 말 ${t.turns.filter((x) => x.role !== 'note').length}개</span></button><button class="icon" data-delthread="${t.id}" aria-label="이 상담 지우기"><i class="ph ph-trash"></i></button></div>`).join('')}</div></section>` : ''}`;
      }
      const body = th.turns.map(chatTurnHtml).join('');
      return `${top({ back: false, right: '<button class="tbtn" data-chatlist><i class="ph ph-list-bullets"></i>이전 상담</button><button class="tbtn" data-newchat>새 상담</button>' })}
        <div class="ttl"><i class="ph ph-chats-circle"></i><span class="grow">${esc(th.title)}</span><span class="t6 nw">${esc(whenText(th.at))}</span></div>
        <div class="thread" id="thread" aria-live="polite">${body}${C.busy ? '<div class="msg bot wait" role="status"><span class="who"><i class="ph ph-circle-notch"></i>생각하는 중이에요</span></div>' : ''}</div>`;
    },

    detail({ id }) {
      const p = M.product(id);
      if (!p) return `${top()}<p class="t5">상품을 찾지 못했어요.</p>`;
      const ai = S.ai[id];
      const v = p.verdict;
      const same = sameOwned(v);
      const looks = (v.looks || []).slice(0, 2);
      const isHung = M.compareHas(id);
      const nvu = M.newVsUsed(id);
      const ask = needAsk(id);
      const d = delta(id);
      let head, sub = v.lines?.[0] || '';
      if (ask) { head = esc(askText(p)); sub = ''; }
      else if (v.basis === 'none' && d) { head = `겹치는 ${esc(p.kindName)}${josa(p.kindName, '이', '가')} <b>없어요</b>`; sub = `가진 ${p.kindName}${josa(p.kindName, '이', '가')} 없다고 답했어요.`; }
      else if (same.length) head = `비슷한 옷이 <b>${same.length}벌</b> 걸려 있어요`;
      else if (v.newLookCount) head = `걸면 새 코디가 <b>${v.newLookCount}개</b> 생겨요`;
      else head = esc(v.title);
      return `${top()}
        <div class="pdp"><div class="pdp-photo"><span class="ph-box" style="display:block"><button class="zoomb" data-zoom="${id}" aria-label="사진 크게 보기">${productPic(id).replace(/^<span class="ph-box">|<\/span>$/g, '')}</button>${hangToggle(id, 'big')}</span></div>
        <div>
        <div class="pdp-head"><div class="b">${esc(p.brand)}</div><h1 class="h2" style="margin-top:2px">${esc(p.name)}</h1>
          <div class="pricetag num"><b>${esc(p.priceText)}</b><small>${esc(p.priceNote)}</small></div>
          <p class="t6" style="margin-top:6px">${esc(p.colorLabel)} · ${esc(p.slotName)}${p.rating ? ` · 평점 ${esc(p.rating)} · 후기 ${Number(p.reviews || 0).toLocaleString('ko-KR')}개` : ''}</p></div>
        ${ai?.reason ? `<section class="box ai-why" aria-label="AI 이유"><div class="label"><i class="ph-fill ph-sparkle"></i>AI 순위 ${ai.rank}위${ai.fit ? ` · ${esc(ai.fit)}` : ''}</div><p class="h3">${esc(ai.reason)}</p></section>` : ''}
        <section class="box" id="hangbox" aria-label="내 옷에 걸어 보면"><div class="label"><i class="ph ph-coat-hanger"></i>내 옷에 걸어 보면 · ${esc(v.basisLabel)}</div>
          <h2 class="h2">${head}</h2>
          ${sub ? `<p class="t5 sub">${esc(sub)}</p>` : ''}
          ${ask ? `<div class="ownq"><button data-own="yes" data-for="${id}">있어요</button><button class="no" data-own="no" data-for="${id}">없어요</button></div>` : ''}
          ${same.length ? `<div class="owned">${same.map((o) => `<div class="o">${garmentPic(o)}<div class="t6">${esc(o.colorLabel)} ${esc(o.kindName)}${o.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : ''}
          ${looks.length ? `<div class="looks2">${looks.map((l) => { const ps = l.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4); return `<div class="lk"><div class="head"><b>${esc(l.title || '')}</b>${l.new ? '<span class="t6 acc" style="font-weight:700">새 코디</span>' : ''}</div><div class="ps">${ps.map((x) => `<div class="p1${x.candidate ? ' me' : ''}">${piecePic(x)}<div class="t6">${x.candidate ? '이 옷' : `${esc(x.colorLabel)} ${esc(x.kindName)}${x.trial ? ' · 체험용' : ''}`}</div></div>`).join('')}</div></div>`; }).join('')}</div>` : ''}
          ${!ask && v.addSuggestion && !(v.owned || []).length && !(v.basis === 'none' && d) ? `<div style="margin-top:10px"><button class="quiet" data-addlike="${id}"><i class="ph ph-plus"></i>가진 ${esc(v.addSuggestion.kindName)} 걸기</button></div>` : ''}
        </section>
        <details class="used"><summary><span>중고로 찾기</span><span class="pill">외부 검색 · ${nvu.used.groups.reduce((a, g) => a + g.links.length, 0)}곳</span><span class="sp"></span><i class="ph ph-caret-right"></i></summary>
          ${nvu.used.groups.map((g) => `<p class="t6 ug">${esc(g.region)}</p><div class="links">${g.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}${l.note ? `<span class="t6 un"> · ${esc(l.note)}</span>` : ''}</span><i class="ph ph-arrow-up-right"></i></a>`).join('')}</div>`).join('')}</details>
        </div></div>`;
    },

    compare() {
      const ids = hung();
      if (ids.length < 2) {
        return `${top()}<h1 class="h2" style="margin-top:8px">두 벌 이상 걸면 나란히 봐요</h1><p class="t5 sub" style="margin-top:6px">결과 사진 모서리의 옷걸이를 눌러 후보를 걸어 주세요. 지금 ${ids.length}벌 걸려 있어요.</p>`;
      }
      const c = M.compareRows(ids);
      const head = c.items.map((it) => `<th scope="col"><button data-pid="${it.id}" style="display:block;width:100%;text-align:left">${productPic(it.id)}<div class="n">${esc(it.brand)} ${esc(it.name)}</div></button><button class="rm" data-unhang="${it.id}">내리기</button></th>`).join('');
      const rows = (list) => list.map((r) => `<tr class="${r.same ? 'same' : ''}"><th scope="row">${esc(r.label)}</th>${r.values.map((v) => `<td class="num">${esc(v)}</td>`).join('')}</tr>`).join('');
      const nSame = c.rows.filter((r) => r.same).length;
      const ordered = [...c.rows.filter((r) => !r.same), ...c.rows.filter((r) => r.same)];
      return `${top()}<h1 class="h2" style="margin-top:8px">걸어 본 ${ids.length}벌</h1><p class="t6" style="margin-top:4px">${esc(c.note)}</p>
        <div class="cmp" id="cmp"><table><colgroup><col style="width:68px">${c.items.map(() => '<col>').join('')}</colgroup><thead><tr><th scope="col"><span class="t6">항목</span></th>${head}</tr></thead><tbody>${rows(ordered)}</tbody></table></div>
        ${nSame ? `<button class="quiet sametog" data-sametog aria-expanded="false"><i class="ph ph-caret-down"></i>같은 항목 ${nSame}개 보기</button>` : ''}`;
    },

    closet() {
      const st = M.getState();
      const mine = st.closet;
      const cands = hung().map((id) => M.product(id)).filter(Boolean);
      const out = mine.length ? M.closetOutfits().total : 0;
      const received = st.records.filter((x) => x.decision === 'buy' && ['ordered', 'received'].includes(x.stage)).length;
      const brandOf = (g) => (g.productId ? M.product(g.productId)?.brand || null : regOf(g.id)?.brand || null);
      const bc = new Map(); mine.forEach((g) => { const b = brandOf(g); if (b) bc.set(b, (bc.get(b) || 0) + 1); });
      const brands = [...bc.entries()].sort((a, b) => b[1] - a[1]);
      const bf = S.brandFilter && bc.has(S.brandFilter) ? S.brandFilter : null;
      const shown = bf ? mine.filter((g) => brandOf(g) === bf) : mine;
      const gt = (g) => { const b = brandOf(g); const miss = g.detailMissing; return `<button class="gt" data-g="${g.id}" aria-label="${esc(g.label)}">${garmentPic(g)}<span class="n">${esc(g.label)}</span><span class="m${miss ? ' miss' : ''}">${esc(miss ? `${miss} · 눌러서 채우기` : (b || `${g.colorLabel} ${g.kindName}`) + (g.trial ? ' · 체험용' : ''))}</span></button>`; };
      const tile = (inner, cls, attrs, label, d = '') => `<button class="hg ${cls}" ${attrs}><i class="${cls.includes('cand') ? 'ph-fill' : 'ph'} ph-coat-hanger" aria-hidden="true"></i><span class="tile">${inner}</span><span class="t6">${label}</span>${d}</button>`;
      const railC = cands.map((p) => { const d = delta(p.id); return tile(productPic(p.id), 'cand', `data-pid="${p.id}" aria-label="걸어 보는 중: ${esc(p.brand)} ${esc(p.name)}"`, esc(p.name), `<span class="d ${d?.tone === 'stop' ? 'stop' : ''}">${esc(d ? d.text : (needAsk(p.id) ? '한 번 물어볼게요' : '비교 중'))}</span>`); });
      const railHtml = cands.length ? `<div class="section"><div class="h"><h2 class="h3">걸어 보는 중 <span class="num acc">${cands.length}</span></h2>${cands.length >= 2 ? '<button class="quiet" data-go-compare>나란히 비교</button>' : ''}</div><div class="rail" aria-label="걸어 본 옷 레일"><span class="bar-line" aria-hidden="true"></span><div class="hgs">${railC.join('')}</div></div></div>` : '';
      const groups = [...GROUPS.map(([name, ks]) => [name, shown.filter((g) => ks.includes(g.kind))]), ['기타', shown.filter((g) => !GROUPS.some(([, ks]) => ks.includes(g.kind)))]].filter(([, items]) => items.length);
      if (!mine.length) {
        return `${top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' })}
          <h1 class="h1" style="margin-top:12px">옷장이 비어 있어요</h1>
          ${inviteHtml({ label: '가장 빠른 방법', h: '브랜드나 상품명으로 찾아서 ‘가지고 있어요’' })}
          ${railHtml}`;
      }
      return `${top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' })}
        <h1 class="h1" style="margin-top:12px">옷 <span class="num">${mine.length}</span>벌${out ? ` · 코디 <span class="num">${out}</span>가지` : ''}</h1>
        <div class="stat"><button class="c" data-tabgo="looks"><span class="k">내 옷으로 코디</span><span class="v num">${out}<small>가지</small></span><span class="go">코디 보기<i class="ph ph-caret-right"></i></span></button><button class="c" data-add-open><span class="k">옷장</span><span class="v num">${mine.length}<small>벌</small></span><span class="go">옷 넣기<i class="ph ph-plus"></i></span></button></div>
        ${st.trialCount ? `<div class="notice"><span class="grow">체험용 옷 ${st.trialCount}벌 · 내 옷이 아니에요</span><button data-mine>내리기</button></div>` : ''}
        ${received ? `<div class="notice"><span class="grow">사기로 한 옷 ${received}벌 · 받으면 기록에서 걸어요</span><button data-tabgo="records">기록</button></div>` : ''}
        ${railHtml}
        ${mine.length >= 4 ? `<section class="section"><div class="h"><h2 class="h3">최근 넣은 옷</h2></div><div class="recent">${[...mine].slice(-4).reverse().map(gt).join('')}</div></section>` : ''}
        ${brands.length ? `<section class="section"><div class="h"><h2 class="h3">모은 브랜드 <span class="t6 num">${brands.length}</span></h2>${bf ? '<button class="quiet" data-brand="">전체 보기</button>' : ''}</div><div class="chips brands">${brands.map(([b, n]) => `<button class="chip ${bf === b ? '' : 'ex'}" data-brand="${esc(b)}" aria-pressed="${bf === b}">${esc(b)} <span class="num">${n}</span></button>`).join('')}</div></section>` : ''}
        ${groups.map(([name, items]) => `<section class="section"><div class="h"><h2 class="h3">${name} <span class="t6 num">${items.length}</span></h2></div><div class="shelf">${items.map(gt).join('')}</div></section>`).join('')}`;
    },

    // 옷장 넣기: 브랜드·품명으로 찾아 ‘가지고 있어요’. 목록(이 앱이 아는 상품) 밖이면 직접 등록(브랜드·상품명·종류·색).
    add({ q = '' } = {}) {
      return `${top({ mid: `<form class="qform" id="af" role="search" style="display:flex;align-items:center"><input id="aq" style="flex:1;min-width:0" value="${esc(q)}" enterkeyhint="search" autocomplete="off" placeholder="브랜드나 상품명으로 찾기" aria-label="브랜드나 상품명"><button type="submit" class="icon" aria-label="상품 검색"><i class="ph ph-magnifying-glass"></i></button></form>` })}
        <div id="ares"></div><div id="adom"></div><div id="aopen" aria-live="polite"></div>
        <button class="row" data-reg-open style="margin-top:8px"><span class="grow"><span class="t5">목록에 없어요 → 직접 등록</span><span class="t6" style="display:block">브랜드·상품명·종류·색만 적어요</span></span><i class="ph ph-caret-right arr"></i></button>`;
    },

    // 직접 등록: 한 화면에 브랜드·상품명·종류·색·링크(선택). 사진은 받지 않는다. 넣으면 옷장에 걸리고, 같은 옷 등록 수(3명)를 센다.
    reg({ q = '' } = {}) {
      const R = S.reg || (S.reg = { brand: '', name: '', kind: '', color: '', url: '' });
      if (q && !R.brand && !R.name) { const [b, ...rest] = q.split(' '); R.brand = b; R.name = rest.join(' '); }
      const kinds = M.kindChoices().filter((k) => PIC.includes(k.id)).sort((a, b) => PIC.indexOf(a.id) - PIC.indexOf(b.id));
      const g0 = M.getState().gender || 'M';
      const thumbColor = (kid) => ['white', 'black', 'navy', 'grey', 'indigo', 'blue', 'beige'].find((c) => K.CUT[`${g0}|${kid}|${c}`]) || 'black';
      return `${top({ mid: '<span class="sp"></span>' })}
        <h1 class="h2" style="margin-top:8px">${R.source ? '찾은 상품으로 옷장에 넣기' : '목록에 없는 옷 직접 등록'}</h1>
        ${opfNotice(R.source)}
        <form id="rf" autocomplete="off">
          <div class="field"><label for="rb">브랜드</label><input id="rb" value="${esc(R.brand)}" placeholder="예: 유니클로" enterkeyhint="next"></div>
          <div class="field"><label for="rn">상품명</label><input id="rn" value="${esc(R.name)}" placeholder="예: 옥스포드 슬림핏 셔츠" enterkeyhint="next"><div class="hint">${R.source ? '내 옷과 같은 상품인지 확인하고, 필요한 내용만 수정해 주세요' : '택이나 주문 내역의 이름이면 다른 사람과 같은 옷으로 모여요'}</div></div>
          <div id="rdup"></div>
          <div class="regk"><div class="label"><span>종류</span></div><div class="kinds">${kinds.map((k) => `<button type="button" data-k="${k.id}" aria-pressed="${R.kind === k.id}">${garmentPic({ kind: k.id, kindName: k.name, color: thumbColor(k.id), gender: g0 })}${esc(k.name)}</button>`).join('')}</div></div>
          <div class="regk"><div class="label"><span>색</span></div><div class="colors">${M.colorChoices().map((c) => `<button type="button" data-c="${c.id}" aria-pressed="${R.color === c.id}" aria-label="${esc(c.label)}"><i style="background:${c.hex}"></i>${esc(c.label)}</button>`).join('')}</div></div>
          <div class="field"><label for="ru">판매처 링크 <span style="font-weight:500;color:var(--ink3)">선택</span></label><input id="ru" value="${esc(R.url)}" inputmode="url" placeholder="https://" enterkeyhint="done"></div>
        </form>`;
    },

    // 코디: 내 옷으로 입을 수 있는 조합(규칙), 상황별로 보기, ‘한 벌만 더 있으면’.
    looks({ mood = '' } = {}) {
      const st = M.getState();
      const mine = st.closet;
      const head = top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' });
      if (!mine.length) {
        return `${head}<h1 class="h1" style="margin-top:12px">내 옷으로 코디를 짜 드려요</h1>
          ${weatherHtml({ where: 'looks' })}`;
      }
      const avail = MOODS.map(([id, label]) => [id, label, moodAsk(label)]).filter((m) => m[2]);
      const cur = avail.find((m) => m[0] === mood) || null;
      const chips = `<div class="chips scroll moods" aria-label="상황"><button class="chip ${cur ? 'ex' : ''}" data-mood="" aria-pressed="${!cur}">내 옷 전체</button>${avail.map(([id, label]) => `<button class="chip ${cur?.[0] === id ? '' : 'ex'}" data-mood="${id}" aria-pressed="${cur?.[0] === id}">${esc(label)}</button>`).join('')}</div>`;
      if (!cur) {
        const d = M.closetOutfits({ detail: true });
        const seen = new Set(); const list = d.list.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 12);
        const sg = M.suggest({ limit: 3 });
        const sgRows = sg.basis === 'closet' ? sg.items : [];
        return `${head}${weatherHtml({ where: 'looks' })}
          <h1 class="h2" style="margin-top:28px">내 옷 ${mine.length}벌로 <span class="num">${d.total}</span>가지</h1>
          ${chips}
          ${list.length ? `<div class="lks">${list.map((o) => lookHtml(o, { sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : `<div class="empty"><h2 class="h2">아직 조합이 없어요</h2><p class="t5 sub" style="margin-top:6px">상의·하의·신발을 한 벌씩 넣으면 세어 드려요.</p><button class="btn line wide sm" data-add-open style="margin-top:12px"><i class="ph ph-plus"></i>옷 넣기</button></div>`}
          ${sgRows.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2></div>${sgRows.map((p) => sgRow(p)).join('')}</section>` : ''}`;
      }
      const r = cur[2];
      const o = r.outfit;
      const cands = o ? o.pieces.filter((x) => !x.owned && x.product) : [];
      const condText = (r.conditions || []).map((c) => c.label).join(' · ');
      return `${head}<h1 class="h1" style="margin-top:12px">${esc(cur[1])} 코디</h1>
        <p class="t5 sub" style="margin-top:4px">${o ? (o.buyCount ? `내 옷 ${o.ownedCount}벌에 한 벌만 더하면 돼요` : `내 옷 ${o.ownedCount}벌로 입을 수 있어요`) : '내 옷으로는 아직 맞는 코디 공식이 없어요'}</p>
        ${chips}
        ${o ? `<div class="lks">${lookHtml(o, { sub: esc(condText), owned: !o.buyCount })}</div>` : `<div class="empty" style="margin-top:20px"><p class="t5 sub">${esc(r.outfitNote || `${cur[1]} 조건에 맞는 코디 공식이 내 옷만으로는 아직 없어요. 조건을 풀지 않았어요.`)}</p></div>`}
        ${cands.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2></div>${cands.map((x) => sgRow(M.product(x.product.id) || x.product, `${cur[1]} 코디의 ${x.kindName} 자리`)).join('')}</section>` : ''}
        ${r.products.length ? `<button class="row" data-q="${esc(r.text)}" style="margin-top:8px"><span class="grow t5">${esc(cur[1])} 조건에 맞는 옷 ${r.products.length}개 더 보기</span><i class="ph ph-caret-right arr"></i></button>` : ''}`;
    },

    records() {
      const all = M.getState().records.filter((r) => r.decision);
      const decided = all.filter((r) => r.decision !== 'hold');
      const buy = all.filter((r) => r.decision === 'buy');
      const holds = all.filter((r) => r.decision === 'hold');
      const sum = buy.reduce((a, r) => a + (r.product?.price || 0), 0);
      const waiting = buy.filter((x) => ['candidate', 'ordered', 'received'].includes(x.stage));
      const byDay = new Map();
      all.forEach((r) => { const k = dayKey(r.updatedAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(r); });
      const stage = (r) => r.decision === 'buy' ? (r.stage === 'candidate' ? '주문 전' : r.stageLabel) : (r.stage === 'candidate' ? '' : r.stageLabel);
      return `${top({ back: false })}
        <h1 class="h1" style="margin-top:12px">${decided.length ? `<span class="num">${decided.length}</span>벌을 정했어요` : holds.length ? `보류 <span class="num">${holds.length}</span>벌 · 아직 정하지 않았어요` : '아직 정한 옷이 없어요'}</h1>
        ${all.length ? '' : '<p class="t5 sub" style="margin-top:4px">걸어 본 옷을 살지 정하면 여기에 남아요.</p>'}
        ${all.length ? `<div class="sum"><div class="c"><div class="k">살게요</div><div class="v num">${buy.length}</div>${sum ? `<div class="t6 num nw" style="font-size:12px">${won(sum)} 수집가</div>` : ''}</div><div class="c"><div class="k">보류</div><div class="v num">${holds.length}</div></div><div class="c"><div class="k">안 살래요</div><div class="v num">${all.length - buy.length - holds.length}</div></div></div>` : ''}
        ${waiting.length ? `<section class="section"><div class="h"><h2 class="h3">사기로 한 옷</h2></div>
          ${waiting.map((x) => { const nx = (x.next || []).find((n) => !n.needsReason); return `<div class="wait-row">${productPic(x.productId)}<span class="grow"><span class="n">${esc(x.product?.name || '')}</span><span class="t6">${esc(x.stageLabel)}</span></span>${nx ? `<button class="btn ${nx.step === 'kept' ? 'go' : 'soft'}" data-adv="${x.productId}" data-step="${nx.step}">${nx.step === 'kept' ? '계속 입을게요 · 걸기' : esc(nx.label)}</button>` : ''}</div>`; }).join('')}</section>` : ''}
        <div class="tl">${[...byDay.entries()].map(([d, rs]) => `<div class="day">${esc(d)}</div>${rs.map((r) => `<button class="rec" data-pid="${r.productId}">${productPic(r.productId)}<span class="grow"><span class="n">${esc(r.product?.name || '')}</span><span class="t6"><span class="pill ${r.decision === 'buy' ? 'buy' : ''}">${DEC[r.decision]}</span>${stage(r) ? ` ${esc(stage(r))}` : ''}</span></span><span class="pr num">${esc(r.product?.priceText || '')}</span></button>`).join('')}`).join('') || '<button class="btn soft wide" data-tabgo="home" style="margin-top:20px">옷 찾으러 가기</button>'}</div>`;
    },
  };

  // ── 화면별 동작
  const A = {
    home() {
      $('#sf').onsubmit = (e) => { e.preventDefault(); const q = $('#q').value.trim(); if (q) K.go('results', { q }); else $('#q').focus(); };
      wireWeather(); fadeChips();
    },
    reg() { wireReg(); },
    async results({ q, drop = [] }) {
      autoDomesticSearch(document);
      void recommendOpenProducts(q);
      $$('[data-drop]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: [...drop, b.dataset.drop] }, { replace: true }); });
      $$('[data-relax]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: JSON.parse(b.dataset.relax) }, { replace: true }); });
      fadeChips();
      const r = S.result;
      const box = $('#ai');
      if (!r?.products?.length || !box) { box?.remove(); return; }
      if (S.aiOrder[q]) return;
      const res = await AIRank.rank(q, r, { limit: 12 });
      if (!document.body.contains(box)) return;
      if (res.ok) {
        res.order.forEach((o) => { S.ai[o.id] = o; });

      } else {

    },

    add({ q = '' } = {}) {

  // ── 상세의 결정: 주 행동은 '판매처에서 사기' 하나. 돌아오면 묻고, 아직이면 조용한 글자 버튼으로 남긴다.
  // 아래 바 한 줄: 결정 전에는 가격·수집가와 조용한 '보류 · 안 살래요', 결정 뒤에는 상태 한 줄과 '바꾸기'. 말풍선은 띄우지 않는다.
  function drawDecision(id) {
    const p = M.product(id); if (!p) return;
    const rec = p.verdict.record;
    const nvu = M.newVsUsed(id);
    const dec = rec?.decision;
    const meta = dec
      ? `<span class="fb" role="status"><i class="ph-fill ph-check-circle"></i><span class="nt" style="color:inherit">${esc(DEC[dec])}로 남겼어요${rec.stage !== 'candidate' ? ` · ${esc(rec.stageLabel)}` : dec === 'buy' ? ' · 주문·도착은 기록에서' : ''}</span></span><span class="qs">${rec.stage === 'candidate' ? '<button class="quiet" data-redecide>바꾸기</button>' : '<button class="quiet" data-tabgo="records">기록</button>'}</span>`
      : `<span class="pr"><b class="num">${esc(p.priceText)}</b><span class="nt">${esc(p.priceShort)} · ${esc(nvu.fresh.store)}</span></span><span class="qs"><button class="quiet" data-dec="hold">보류</button><button class="quiet" data-dec="skip">안 살래요</button></span>`;
    $('#bar').innerHTML = `<div class="buybar"><div class="in"><div class="meta">${meta}</div>
      <a class="btn go wide" href="${esc(p.url)}" target="_blank" rel="noopener" data-seller="${id}">판매처에서 사기<i class="ph ph-arrow-up-right"></i></a></div></div>`;
    $$('[data-dec]').forEach((b) => { b.onclick = () => decide(id, b.dataset.dec); });
    $('[data-redecide]') && ($('[data-redecide]').onclick = () => decisionSheet(id, { title: '어떻게 할까요?' }));
    $('[data-seller]').onclick = () => { S.pending = { id, t: Date.now() }; };
  }
  function decide(id, dec) {
    const rec = M.product(id)?.verdict.record;
    if (rec && rec.stage !== 'candidate') return;
    if (dec === 'clear') M.removeRecord(id); else M.decide(id, dec);
    drawDecision(id);
  }
  function decisionSheet(id, { title = '판매처에서 돌아왔어요 · 어떻게 하셨어요?' } = {}) {
    const p = M.product(id); if (!p) return;
    if ($('.sheet')) return;
    const has = !!p.verdict.record?.decision;
    const sh = sheet(`<h2 class="h2">${esc(title)}</h2><p class="t6 sub">${esc(p.brand)} ${esc(p.name)} · ${esc(p.priceText)}</p>
      <div class="decs"><button class="btn go" data-d="buy"><i class="ph ph-check"></i>샀어요</button><button class="btn soft" data-d="hold">보류</button><button class="btn soft" data-d="skip">안 살래요</button>${has ? '<button class="btn line" data-d="clear">기록 지우기</button>' : ''}<button class="quiet" data-d="" style="justify-content:center;width:100%">${has ? '그대로 둘게요' : '아직 보는 중이에요'}</button></div>`);
    $$('[data-d]', sh.s).forEach((b) => { b.onclick = async () => { await sh.close(); if (b.dataset.d) decide(id, b.dataset.d); }; });

  // 판매처에서 돌아왔을 때(탭이 다시 보이거나 창이 다시 초점을 받으면) 한 번 묻는다.

    S.pending = null;
    setTimeout(() => { if (curView === 'detail' && curParams.id === pd.id && !M.product(pd.id)?.verdict.record?.decision) decisionSheet(pd.id); }, 300);
  };
  document.addEventListener('visibilitychange', onReturn);
  addEventListener('focus', onReturn);

  // ── 공통 이벤트(한 번만 건다)
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-back],[data-pid],[data-tabgo],[data-menu],[data-q],[data-hang],[data-unhang],[data-go-compare],[data-zoom],[data-addlike],[data-disclose],[data-own],[data-edit],[data-add-open],[data-add-q],[data-addkind],[data-own-add],[data-trial],[data-mine],[data-reg-open],[data-crowd-add],[data-rakuten-search],[data-rakuten-plan],[data-adpick-search]');

    else if (t.dataset.crowdAdd) crowdAdd(t.dataset.crowdAdd, t);

    else if (t.dataset.ownAdd) ownAdd(t.dataset.ownAdd, t);
    else if (t.hasAttribute('data-trial')) { M.loadTrialCloset(); K.refresh(); }
    else if (t.hasAttribute('data-mine')) { M.clearTrialCloset(); K.refresh(); }
    else if (t.dataset.hang) toggleHang(t.dataset.hang, t);
    else if (t.dataset.own) answerOwn(t.dataset.for, t.dataset.own === 'yes');
    else if (t.dataset.unhang) { M.compareRemove(t.dataset.unhang); K.refresh(); }
    else if (t.dataset.pid) K.go('detail', { id: t.dataset.pid });
    else if (t.dataset.tabgo) K.tab(t.dataset.tabgo);
    else if (t.hasAttribute('data-edit')) K.tab('home', { q: t.dataset.edit });
    else if (t.dataset.q) K.go('results', { q: t.dataset.q });
    else if (t.hasAttribute('data-go-compare')) K.go('compare', {});
    else if (t.dataset.zoom) zoom(t.dataset.zoom);
    else if (t.dataset.addlike) addLike(t.dataset.addlike);

  $$('#tabs [data-tab]').forEach((b) => { b.onclick = () => K.tab(b.dataset.tab); });
  // 결과에서 내리면 위 막대가 숨고, 올리면 다시 나온다.
  let lastY = 0;
  addEventListener('scroll', () => {
    const y = scrollY; const tp = $('#top');
    if (tp && curView === 'results') { if (y > lastY + 6 && y > 90) tp.classList.add('hide'); else if (y < lastY - 6 || y < 90) tp.classList.remove('hide'); }
    lastY = y;
  }, { passive: true });

  // 걸기: 사진 모서리 토글. 걸면 카드가 바뀌고(띠·표시), 옷장이 없으면 그 자리에서 한 번 묻는다. 알림 말풍선은 띄우지 않는다.
  function toggleHang(id, btn) {
    const was = M.compareHas(id);
    if (was) { M.compareRemove(id); if (S.asking === id) S.asking = null; }
    else {
      try { M.compareAdd(id); } catch (err) { showCardNote(id, btn, /비교함|4개/.test(err.message) ? '옷걸이에는 4벌까지 걸 수 있어요. 하나를 내리고 다시 걸어 주세요.' : err.message); return; }
      if (needAsk(id)) S.asking = id;

    afterHang(id, btn, !was);

  // 안내는 겹치지 않게: 결과에서는 그 줄 아래 두 칸짜리 줄로, 다른 곳에서는 카드 아래에 붙인다.
  function showCardNote(id, btn, text) {

    if (curView === 'results') { S.note = { id, text }; redrawGrids(); $(`.qrow.note[data-for="${id}"]`)?.scrollIntoView({ behavior: K.reduce ? 'auto' : 'smooth', block: 'center' }); S.noteT = setTimeout(() => { S.note = null; redrawGrids(); }, 4000); return; }
    const host = btn.closest('.rc, .g, .pdp-photo') || btn.parentElement;
    $('.card-note', host)?.remove();
    const n = document.createElement('div'); n.className = 'card-note t6'; n.setAttribute('role', 'alert'); n.textContent = text; n.style.cssText = 'margin-top:6px;color:var(--acc-text);font-weight:700';
    host.appendChild(n); setTimeout(() => n.remove(), 3200);

  function afterHang(id, btn, added) {

    } else if (curView === 'consult') {

      renderStrip({ pop: added && hung().length === 1 });
    } else if (curView === 'detail') {

      if (added && needAsk(id)) { S.asking = id; $('#hangbox')?.scrollIntoView({ behavior: K.reduce ? 'auto' : 'smooth', block: 'center' }); }
    } else K.refresh();

  function findCard(id) {
    const r = S.result;
    return r ? [...r.products, ...(r.offOccasion || [])].find((p) => p.id === id) : null;
  }
  // 한 번 묻기의 답. '있어요'는 색만 고르고(이 상품 색이 맨 앞), '없어요'는 그 사실로 바로 판정한다.
  function answerOwn(id, yes) {
    const p = M.product(id); if (!p) return;
    const v = p.verdict;
    const twins = hung().filter((x) => ownKey(M.product(x) || {}) === ownKey(p));
    if (!yes) {
      if (v.basis === 'none') { S.ui.absent[ownKey(p)] = 1; saveUi(); }
      else { [id, ...twins].forEach((x) => { try { M.setOwnership(x, 'absent'); } catch {} }); }
      S.asking = null;
      refreshAfterOwn(id);
      return;
    }
    const add = v.addSuggestion || { kind: p.kind, kindName: p.kindName, slot: p.slot, gender: p.gender, color: p.colorFromPhoto ? null : p.color };
    const sh = sheet(`<h2 class="h2">가진 ${esc(add.kindName)}${josa(add.kindName, '은', '는')} 무슨 색이에요?</h2><p class="t6 sub">이 옷과 같은 색이면 맨 앞을 누르세요. 다른 색이어도 돼요.</p>${colorGrid(add.color)}`);
    $$('[data-c]', sh.s).forEach((b) => { b.onclick = async () => {
      M.addGarment({ kind: add.kind, color: b.dataset.c, slot: add.slot, gender: add.gender });
      [id, ...twins].forEach((x) => { try { M.setOwnership(x, 'present'); } catch {} });

  function refreshAfterOwn(id) {

  function zoom(id) {

  // ── 시트
  function sheet(html) {
    const w = document.createElement('div');

    document.body.appendChild(w);

    const close = async () => {
      removeEventListener('keydown', key);
      if (!K.reduce) await s.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: 200, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }).finished;
      w.remove();

  const colorGrid = (first = null) => { const cs = M.colorChoices(); const sorted = first ? [...cs.filter((c) => c.id === first), ...cs.filter((c) => c.id !== first)] : cs; return `<div class="colors">${sorted.map((c) => `<button data-c="${c.id}" class="${c.id === first ? 'same' : ''}" aria-label="${esc(c.label)}${c.id === first ? ' (이 옷과 같은 색)' : ''}"><i style="background:${c.hex}"></i>${esc(c.label)}${c.id === first ? ' · 같은 색' : ''}</button>`).join('')}</div>`; };

  // 상세에서 '가진 ○○ 걸기': 종류는 이 상품과 같게 미리 고르고 색만 묻는다. 걸고 나면 같은 상품 화면으로 돌아와 판정이 바뀐다.
  function addLike(id) {
    const add = M.judge(id)?.addSuggestion; if (!add) return;
    const sh = sheet(`<h2 class="h2">가진 ${esc(add.kindName)}${josa(add.kindName, '은', '는')} 무슨 색이에요?</h2>${colorGrid(add.color)}`);
    $$('[data-c]', sh.s).forEach((b) => { b.onclick = async () => {
      M.addGarment({ kind: add.kind, color: b.dataset.c, slot: add.slot, gender: add.gender });

  }
  // 옷걸이 탭의 '가진 옷 걸기': 종류 → 색, 한 번에 한 질문.
  function addFlow() {
    const kinds = M.kindChoices().filter((k) => PIC.includes(k.id)).sort((a, b) => PIC.indexOf(a.id) - PIC.indexOf(b.id));
    const g0 = M.getState().gender || 'M';
    const thumbColor = (kid) => ['white', 'black', 'navy', 'grey', 'indigo', 'blue', 'beige'].find((c) => K.CUT[`${g0}|${kid}|${c}`]) || 'black';
    const sh = sheet(`<h2 class="h2">어떤 옷을 걸까요?</h2><div class="kinds">${kinds.map((k) => `<button data-k="${k.id}">${garmentPic({ kind: k.id, kindName: k.name, color: thumbColor(k.id), gender: g0 })}${esc(k.name)}</button>`).join('')}</div>`);
    $$('[data-k]', sh.s).forEach((b) => { b.onclick = () => {
      const kind = b.dataset.k, kname = kinds.find((k) => k.id === kind).name;
      sh.s.innerHTML = `<div class="grab"></div><h2 class="h2">${esc(kname)} 색을 골라 주세요</h2>${colorGrid()}`;
      $$('[data-c]', sh.s).forEach((cb) => { cb.onclick = async () => {
        const before = M.getState().closetCount ? M.closetOutfits().total : 0;
        M.addGarment({ kind, color: cb.dataset.c, slot: M.slotChoices(kind)[0]?.id || null });
        await sh.close();
        K.refresh();
        const gain = M.closetOutfits().total - before;
        if (curView === 'add') drawShelf({ pop: true });
        K.toast(gain > 0 ? `옷장에 넣었어요 · 입을 수 있는 조합 +${gain}` : '옷장에 넣었어요', { bottom: curView === 'add' ? 100 : 128 });
      }; });
    }; });
  }
  function garmentSheet(id) {
    const g = M.getState().closet.find((x) => x.id === id);
    if (!g) return;
    const reg = regOf(id);
    const brand = g.productId ? M.product(g.productId)?.brand : reg?.brand || null;
    const with_ = M.closetOutfits({ detail: true }).list.filter((o) => o.pieces.some((x) => x.garmentId === id));
