<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>대표 디자인</title>
<!-- 서체: Google Fonts SIL OFL(Inter: 라틴·숫자, Noto Sans KR: 한글). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
  /* ── 대표 디자인 토큰: 흑백 + 판정 의미색 2개, 가는 선과 여백으로 구획, 사진이 주인공 */
  .fx {
    --ink: #111; --ink2: #3a3a3a; --sub: #707070; --mute: #9a9a9a; --hair: #e6e6e6; --field: #f3f2ef; --bg: #fff;
    --over: #9b3a28; --new: #1f5c45; --info: #1d3f6e;
    --f: "Inter", "Noto Sans KR", system-ui, sans-serif;
    font-family: var(--f); color: var(--ink); background: var(--bg); font-size: 14px; line-height: 1.5; letter-spacing: -.005em;
    -webkit-font-smoothing: antialiased; position: relative; height: 844px; overflow: hidden;
  }
  .fx.pc { height: 800px; }
  .fx * { box-sizing: border-box; }
  .fx .ico { width: 22px; height: 22px; stroke-width: 1.5; }
  .fx .caps { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .fx .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  /* 사진: 같은 바탕(field) 위에 곱하기 합성 → 흰 바탕 상품 사진이 바탕에 녹아 톤이 통일된다(파일은 가공하지 않음) */
  .fx .ph { position: relative; background: var(--field); overflow: hidden; }
  .fx .ph .eo-ph { background: var(--field) !important; aspect-ratio: 3 / 4 !important; height: auto !important; border-radius: 0 !important; }
  .fx .ph img { mix-blend-mode: multiply; object-fit: cover !important; }
  .fx .ph .eo-cap { left: 8px; bottom: 8px; background: rgba(255,255,255,.9) !important; border-radius: 2px !important; font: 500 10px var(--f) !important; letter-spacing: .02em; }
  /* 워드마크 */
  .fx .wm { font-family: "Inter", sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .32em; padding-left: .32em; }
  .fx .wm small { display: none; }
  /* 머리 */
  .fx .bar { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .fx .bar .ib { width: 40px; height: 44px; display: grid; place-items: center; position: relative; }
  .fx .bar .ib i { position: absolute; top: 8px; right: 4px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--ink); color: #fff; font: 600 9px/15px var(--f); text-align: center; font-style: normal; }
  .fx .bar .r { display: flex; gap: 2px; }
  .fx .seal { font-size: 10px; letter-spacing: .06em; color: var(--mute); border: 1px solid var(--hair); padding: 2px 6px; border-radius: 2px; margin-left: 8px; }
  /* 검색 */
  .fx .qbar { display: flex; align-items: center; gap: 10px; height: 44px; margin: 0 16px; padding: 0 14px; background: var(--field); font-size: 15px; }
  .fx .qbar span { flex: 1; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx .scope { display: flex; gap: 6px; padding: 12px 16px 0; overflow: hidden; }
  .fx .scope span { flex: none; height: 30px; padding: 0 10px; border: 1px solid var(--hair); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
  .fx .scope span.k { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .fx .scope span b { font-weight: 400; color: var(--mute); font-size: 13px; }
  .fx .meta { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 12px; font-size: 12px; color: var(--sub); }
  .fx .meta .sort { color: var(--ink); display: inline-flex; gap: 2px; align-items: center; }
  /* 그리드 카드 */
  .fx .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 1px; }
  .fx .card .ph { aspect-ratio: 3 / 4; border-radius: 0; }
  .fx .ph { border-radius: 0 !important; }
  .fx .card .add { position: absolute; z-index: 2; right: 6px; top: 6px; width: 32px; height: 32px; display: grid; place-items: center; background: rgba(255,255,255,.85); border-radius: 16px; }
  .fx .card .add::before { content: ''; position: absolute; inset: -6px; } /* 누르는 영역 44 */
  .fx .card .info { padding: 10px 12px 0; }
  .fx .card .br { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .fx .card .nm { font-size: 13px; color: var(--ink2); margin-top: 2px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fx .card .pr { font-size: 14px; font-weight: 600; margin-top: 6px; }
  .fx .card .own { margin-top: 6px; font-size: 11px; font-weight: 500; display: inline-flex; gap: 5px; align-items: center; }
  .fx .dot { width: 6px; height: 6px; border-radius: 3px; display: inline-block; }
  .fx .over { color: var(--over); } .fx .over .dot { background: var(--over); }
  .fx .new { color: var(--new); } .fx .new .dot { background: var(--new); }
  .fx .inf { color: var(--info); } .fx .inf .dot { background: var(--info); }
  /* 홈 */
  .fx .hero-q { padding: 28px 16px 0; }
  .fx .hero-q h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 500; letter-spacing: -.03em; }
  .fx .hero-q p { margin: 10px 0 0; font-size: 13px; color: var(--sub); }
  .fx .bigq { margin: 22px 16px 0; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border: 1px solid var(--ink); font-size: 15px; color: var(--mute); }
  .fx .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 16px 0; }
  .fx .tags span { font-size: 13px; padding: 7px 12px; background: var(--field); color: var(--ink2); }
  .fx .sect { padding: 36px 16px 0; }
  .fx .sect .h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .fx .sect .h b { font-size: 15px; font-weight: 600; } .fx .sect .h span { font-size: 12px; color: var(--sub); }
  .fx .closet0 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--hair); border: 1px solid var(--hair); }
  .fx .closet0 div { aspect-ratio: 3 / 4; background: #fff; display: grid; place-items: center; color: var(--mute); font-size: 20px; font-weight: 300; }
  .fx .closet0 div:first-child { color: var(--ink); }
  .fx .rail { display: flex; gap: 8px; overflow: hidden; } .fx .rail .ph { width: 116px; flex: none; }
  .fx .rail .cap { font-size: 12px; margin-top: 6px; color: var(--ink2); }
  .fx .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--hair); padding-bottom: 8px; }
  .fx .tabs a { display: grid; place-items: center; align-content: center; gap: 2px; font-size: 10px; color: var(--mute); letter-spacing: .02em; }
  .fx .tabs a.on { color: var(--ink); font-weight: 600; }
  /* 상세 */
  .fx .pdp-ph { position: relative; }
  .fx .pdp-ph .ph .eo-ph { aspect-ratio: 4 / 5 !important; }
  .fx .pdp-ph .over-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 3; }
  .fx .pdp-ph .dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .fx .pdp-ph .dots i { width: 5px; height: 5px; border-radius: 3px; background: rgba(17,17,17,.25); } .fx .pdp-ph .dots i:first-child { background: var(--ink); }
  .fx .pdp-ph .zoom { position: absolute; right: 12px; bottom: 8px; width: 40px; height: 40px; display: grid; place-items: center; }
  .fx .pinfo { padding: 18px 16px 0; }
  .fx .pinfo .br { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .fx .pinfo h1 { margin: 6px 0 0; font-size: 17px; font-weight: 400; line-height: 1.45; letter-spacing: -.02em; }
  .fx .pinfo .price { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; }
  .fx .pinfo .price b { font-size: 19px; font-weight: 600; }
  .fx .pinfo .price span { font-size: 12px; color: var(--sub); }
  .fx .vd { margin: 20px 16px 0; padding: 16px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--hair); }
  .fx .vd .k { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
  .fx .vd .t { margin-top: 8px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .fx .vd p { margin: 6px 0 0; font-size: 13px; color: var(--ink2); line-height: 1.55; }
  .fx .vd .mine { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .fx .vd .mine .ph { width: 48px; } .fx .vd .mine span { font-size: 12px; color: var(--sub); }
  .fx .vd .act { margin-top: 12px; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; display: inline-block; min-height: 24px; }
  .fx .acc { margin: 0 16px; }
  .fx .acc .row { display: flex; justify-content: space-between; align-items: center; min-height: 52px; border-bottom: 1px solid var(--hair); font-size: 13px; }
  .fx .acc .row b { font-weight: 500; } .fx .acc .row span { color: var(--sub); font-size: 12px; }
  .fx .nu { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hair); margin: 0 16px; border: 1px solid var(--hair); }
  .fx .nu > div { background: #fff; padding: 12px; } .fx .nu .l { font-size: 11px; color: var(--sub); letter-spacing: .04em; } .fx .nu .v { font-size: 14px; font-weight: 600; margin-top: 4px; } .fx .nu .s { font-size: 11px; color: var(--sub); margin-top: 2px; line-height: 1.45; }
  .fx .dk { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; padding: 10px 16px 18px; border-top: 1px solid var(--hair); }
  .fx .seg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--ink); height: 48px; }
  .fx .seg3 span { display: grid; place-items: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .fx .seg3 span + span { border-left: 1px solid var(--ink); }
  .fx .seg3 span.on { background: var(--ink); color: #fff; }
  .fx .dk .sub2 { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--sub); }
  /* 시트 */
  .fx .sc { position: absolute; inset: 0; background: rgba(17,17,17,.32); z-index: 8; }
  .fx .sh { position: absolute; left: 0; right: 0; bottom: 0; z-index: 9; background: #fff; padding: 10px 16px 24px; }
  .fx .sh .grab { width: 32px; height: 3px; background: var(--hair); margin: 0 auto 18px; }
  .fx .sh h3 { margin: 0; font-size: 17px; font-weight: 600; } .fx .sh .d { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .fx .sw { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 6px; margin: 22px 0 24px; }
  .fx .sw div { display: grid; justify-items: center; gap: 6px; font-size: 11px; color: var(--ink2); }
  .fx .sw i { width: 40px; height: 40px; border-radius: 20px; border: 1px solid rgba(0,0,0,.12); display: block; }
  .fx .sw div.on i { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }
  .fx .primary { height: 52px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 600; letter-spacing: .02em; }
  /* 비교 */
  .fx .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
  .fx .cmp .info { padding: 10px 12px 0; }
  .fx .ctab { margin: 18px 16px 0; }
  .fx .ctab .r { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); font-size: 13px; }
  .fx .ctab .r .k { grid-column: 1 / -1; font-size: 11px; color: var(--sub); letter-spacing: .04em; }
  .fx .ctab .r.same { color: var(--mute); }
  /* 기록 */
  .fx .rc { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 16px; border-bottom: 1px solid var(--hair); }
  .fx .rc .ph { width: 72px; }
  .fx .steps { display: flex; gap: 0; margin-top: 10px; }
  .fx .steps i { flex: 1; height: 2px; background: var(--hair); margin-right: 3px; } .fx .steps i.on { background: var(--ink); }
  .fx .steps + div { font-size: 11px; color: var(--sub); margin-top: 6px; display: flex; justify-content: space-between; }
  /* 빈 결과 */
  .fx .em { padding: 36px 16px 0; }
  .fx .em h2 { margin: 0; font-size: 20px; font-weight: 500; line-height: 1.4; letter-spacing: -.02em; }
  .fx .em p { margin: 10px 0 0; font-size: 13px; color: var(--sub); line-height: 1.6; }
  .fx .rx { margin-top: 24px; border-top: 1px solid var(--ink); }
  .fx .rx .it { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--hair); }
  .fx .rx .it .pv { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; }
  .fx .rx .it b { font-size: 14px; font-weight: 600; } .fx .rx .it span { font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  /* PC */
  .fx.pc .bar { height: 64px; padding: 0 40px; border-bottom: 1px solid var(--hair); }
  .fx.pc .pcq { width: 520px; height: 40px; background: var(--field); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 14px; }
  .fx.pc .pcnav { display: flex; gap: 22px; font-size: 12px; letter-spacing: .06em; }
</style>
<script src="../shared/eoul-mock.js"></script>
<script src="kit.js"></script>
</head>
<body>
<script>
(() => {
  if (!window.K) return;
  const { M, esc, ico } = K;
  K.board({ n: '대표', name: '대표 디자인(서비스 이름 미정)', idea: '사진이 주인공, 흑백과 가는 선, 절제된 글자. 그 위에 이 서비스만의 ‘내 옷과’ 판정 층. 모든 상품 사진은 같은 바탕과 비율로 맞춰(화면에서 처리, 파일 가공 없음) 한 회사가 찍은 것처럼 보이게 했다.', refs: '기준 비교: 무신사·29CM·SSENSE 실제 화면(같은 과업). 따라 하지 않은 것: 할인율·쿠폰·배너·타임세일.', note: '서체 Inter·Noto Sans KR(SIL OFL).' });
  const ph = (t, o) => `<div class="ph">${M.photoHtml(t, { eager: true, ...o })}</div>`;
  const { r, d } = K.data();
  const P = r.products;
  const wm = '<span class="wm">NAME</span>';
  const tabs = (on) => `<nav class="tabs">${[['search', '찾기'], ['compare', '비교'], ['closet', '옷장'], ['records', '기록']].map(([i, l], k) => `<a class="${k === on ? 'on' : ''}">${ico(i)}${l}</a>`).join('')}</nav>`;
  const own = (o) => !o || o.tone === 'none' || !o.label ? '' : `<div class="own ${o.tone === 'stop' ? 'over' : o.tone === 'new' ? 'new' : 'inf'}"><span class="dot"></span>${esc(o.label)}</div>`;
  const card = (p, on = false) => `<div class="card">${ph(p).replace('<div class="ph">', '<div class="ph">' + `<span class="add" aria-label="비교 담기">${on ? ico('ok', 's') : ico('plus', 's')}</span>`)}<div class="info"><div class="br">${esc(p.brand)}</div><div class="nm">${esc(p.name)}</div><div class="pr num">${esc(p.priceText)}</div>${own(p.owned)}</div></div>`;
  const tone = (v) => v.tone === 'stop' ? 'over' : v.tone === 'go' ? 'new' : '';
  const verdict = (v, before = null) => `<section class="vd"><div class="k"><span>내 옷과</span><span>${esc(v.basisLabel)}</span></div><div class="t ${tone(v)}">${v.tone === 'stop' || v.tone === 'go' ? '<span class="dot"></span>' : ''}${esc(v.title)}</div>${before ? `<p style="color:var(--mute)">방금 바뀜 · 전에는 ‘${esc(before)}’</p>` : ''}<p>${esc(v.lines[0] || '')}</p>${v.owned.length ? `<div class="mine">${v.owned.slice(0, 3).map((o) => ph(o, { caption: false })).join('')}<span>${esc(v.owned[0].label)} · 비슷한 상품 사진</span></div>` : ''}<a class="act">가진 ${esc(v.addSuggestion?.kindName || '옷')} 넣고 비교</a></section>`;
  const seg = (v) => { const on = v.lean === 'buy' ? 2 : v.lean === 'hold' ? 0 : -1; return `<div class="seg3">${['보류', '안 살래', '사기로 함'].map((x, i) => `<span class="${i === on ? 'on' : ''}">${x}</span>`).join('')}</div>`; };
  const decideBar = (v) => `<div class="dk">${seg(v)}<div class="sub2"><span>무신사에서 보기 ↗</span><span>결정은 이 기기에만 기록돼요</span></div></div>`;
  const pdp = (dd, extra = '', before = null) => `<div class="pdp-ph"><div class="over-bar"><div class="bar"><span class="ib">${ico('back')}</span><span class="r"><span class="ib">${ico('compare')}</span><span class="ib">${ico('closet')}</span></span></div></div>${ph(dd)}<div class="dots"><i></i><i></i><i></i></div><span class="zoom">${ico('zoom')}</span></div><div class="pinfo"><div class="br">${esc(dd.brand)}</div><h1>${esc(dd.name)}</h1><div class="price"><b class="num">${esc(dd.priceText)}</b><span>${esc(dd.priceShort)} · ${esc(dd.store)}</span></div></div>${verdict(dd.verdict, before)}<div class="acc"><div class="row"><b>새 상품과 중고</b><span>중고 매물은 확인하지 않았어요 ›</span></div><div class="row"><b>사이즈·소재·착용 사진</b><span>무신사에서 확인 ›</span></div><div class="row"><b>같은 조건 다른 셔츠</b><span>${dd.alternatives.length}개 ›</span></div></div><div style="height:110px"></div>${decideBar(dd.verdict)}${extra}`;
  const head = `<div class="bar">${wm}<span class="r"><span class="ib">${ico('compare')}</span><span class="ib">${ico('closet')}</span><span class="ib">${ico('records')}</span></span></div>`;
  // 1행
  const home = `${head}<div class="hero-q"><h1>무엇을 찾으세요?<br>가진 옷과 겹치는지 함께 볼게요.</h1><p>옷장을 비워 둔 채로 시작해도 돼요.</p></div><div class="bigq">${ico('search')}출근용 셔츠 10만원 이하</div><div class="tags">${M.examples().slice(0, 5).map((x) => `<span>${esc(x)}</span>`).join('')}</div><div class="sect"><div class="h"><b>내 옷장</b><span>0벌</span></div><div class="closet0"><div>+</div><div></div><div></div><div></div></div><div style="font-size:12px;color:var(--sub);margin-top:10px">한 벌만 넣어도 겹치는 옷을 알려 드려요</div></div><div class="sect"><div class="h"><b>이번 계절 기본</b><span>규칙으로 골랐어요</span></div><div class="rail">${M.suggest({ limit: 4 }).items.map((p) => `<div>${ph(p)}<div class="cap">${esc(p.kindName)}</div></div>`).join('')}</div></div>${tabs(0)}`;
  const results = `<div class="bar"><span class="ib">${ico('back')}</span>${wm}<span class="r"><span class="ib">${ico('compare')}</span></span></div><div class="qbar">${ico('search', 's')}<span>${esc(K.Q)}</span></div><div class="scope">${r.conditions.map((c) => `<span class="${c.removable ? '' : 'k'}">${esc(c.label)}${c.removable ? '<b>×</b>' : ''}</span>`).join('')}</div><div class="meta"><span>${r.total}개 · 10/13 수집가</span><span class="sort">추천순 ${ico('down', 's')}</span></div><div class="grid">${P.slice(0, 4).map((p, i) => card(p, i === 1)).join('')}</div>${tabs(0)}`;
  K.row(K.phone('홈 · 처음', `<div class="fx">${home}</div>`, { fold: false, notes: ['큰 문장 + 검색 하나 + 예시. 옷장은 빈 칸 4개로 ‘넣으면 무엇이 되는지’ 암시'] })
    + K.phone('검색 결과', `<div class="fx">${results}</div>`, { fold: false, notes: ['사진 3:4, 2열 사이 1px, 카드 테두리 없음', '브랜드 대문자 11 · 품명 13 · 가격 14/600', '겹침 표시는 점 + 글자(색만으로 구분 안 함)'] })
    + K.phone('상품 상세', `<div class="fx">${pdp(d)}</div>`, { fold: false, notes: ['사진 4:5 가득, 머리는 사진 위에 투명하게', '판정은 굵은 위 선 하나로 구획(상자 없음)', '결정은 3칸 한 줄, 판정이 기울 때만 한 칸 채움'] }));
  // 2행: 옷 넣기 → 복귀
  const v = d.verdict, s = v.addSuggestion;
  const sheet = `<div class="sc"></div><div class="sh"><div class="grab"></div><h3>가진 셔츠의 색을 골라 주세요</h3><div class="d">종류는 ${esc(s.slotName)}로 넣어요 · 사진 없이도 돼요</div><div class="sw">${M.colorChoices().slice(0, 12).map((c) => `<div class="${c.id === 'white' ? 'on' : ''}"><i style="background:${c.hex}"></i>${esc(c.label)}</div>`).join('')}</div><div class="primary">넣고 이 상품으로 돌아가기</div></div>`;
  M.addGarment({ kind: s.kind, slot: s.slot, color: 'white' });
  const r2 = M.ask(K.Q), d2 = M.product(r2.products[0].id);
  K.row(K.phone('옷 넣기(시트)', `<div class="fx">${pdp(d, sheet)}</div>`, { fold: false, notes: ['색만 고르면 끝(종류는 이 상품에서)', '고른 색은 이중 테두리, 주 버튼 하나'] })
    + K.phone('같은 상품으로 복귀', `<div class="fx">${pdp(d2, '', v.title)}</div>`, { fold: false, notes: ['판정이 바뀌고 ‘방금 바뀜’ 한 줄, 겹치는 내 옷 사진', '판정이 ‘보류’ 쪽으로 기울어 보류 칸이 채워짐'] }));
  // 3행: 비교·기록·빈 결과
  M.compareAdd(r2.products[0].id); M.compareAdd(r2.products[1].id);
  const c = M.compareRows();
  const compare = `<div class="bar"><span class="ib">${ico('back')}</span><span style="font-size:13px;font-weight:600;letter-spacing:.06em">비교 2</span><span class="ib">${ico('close')}</span></div><div class="cmp">${c.items.map((p) => `<div>${ph(p)}<div class="info"><div class="br caps">${esc(p.brand)}</div><div style="font-size:13px;color:var(--ink2);margin-top:2px">${esc(p.name)}</div><div class="num" style="font-weight:600;margin-top:6px">${esc(p.priceText)}</div></div></div>`).join('')}</div><div class="ctab">${c.rows.filter((x) => x.primary).map((x) => `<div class="r${x.same ? ' same' : ''}"><div class="k">${esc(x.label)}${x.same ? ' · 같음' : ''}</div>${x.values.map((y) => `<div>${esc(y)}</div>`).join('')}</div>`).join('')}</div><div class="dk"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="seg3" style="grid-template-columns:1fr 1fr"><span>보류</span><span>사기로 함</span></div><div class="seg3" style="grid-template-columns:1fr 1fr"><span>보류</span><span>사기로 함</span></div></div></div>`;
  M.decide(r2.products[0].id, 'hold'); M.decide(r2.products[2].id, 'buy'); M.advance(r2.products[2].id, 'ordered');
  const recs = M.getState().records;
  const stepIdx = (x) => ({ candidate: x.decision === 'buy' ? 1 : 0, ordered: 2, received: 3, kept: 4, returned: 4 }[x.stage]);
  const records = `${head}<div style="padding:8px 16px 4px"><div style="font-size:20px;font-weight:500;letter-spacing:-.02em">기록</div><div style="font-size:12px;color:var(--sub);margin-top:4px">직접 남긴 기록이에요 · 확인된 거래가 아니에요</div></div>${recs.map((x) => `<div class="rc">${ph(x)}<div><div class="br caps">${esc(x.product.brand)}</div><div style="font-size:13px;margin-top:2px">${esc(x.product.name)}</div><div class="num" style="font-weight:600;margin-top:4px">${esc(x.product.priceText)}</div><div class="steps">${[0, 1, 2, 3].map((k) => `<i class="${k < stepIdx(x) ? 'on' : ''}"></i>`).join('')}</div><div><span>${esc(x.stageLabel)}</span><span>${x.next?.[0] ? esc(x.next[0].label) + ' ›' : ''}</span></div></div></div>`).join('')}${tabs(3)}`;
  const re = M.ask('셔츠 1만원 이하'), rel = M.relax(re);
  const empty = `<div class="bar"><span class="ib">${ico('back')}</span>${wm}<span class="r"></span></div><div class="qbar">${ico('search', 's')}<span>셔츠 1만원 이하</span></div><div class="em"><h2>1만원 이하 셔츠는<br>아직 없어요</h2><p>조건을 몰래 넓히지 않았어요. 하나를 빼면 이만큼 있어요.</p><div class="rx">${rel.map((x) => `<div class="it"><b>‘${esc(x.label)}’ 빼고 ${x.total}개</b><span>이 조건으로 보기</span><div class="pv">${x.preview.slice(0, 4).map((p) => ph(p)).join('')}</div></div>`).join('')}</div></div>${tabs(0)}`;
  K.row(K.phone('후보 둘 비교', `<div class="fx">${compare}</div>`, { fold: false, notes: ['사진 두 장이 위에 크게, 표는 ‘내 옷과’부터', '같은 값 줄은 흐리게'] })
    + K.phone('기록', `<div class="fx">${records}</div>`, { fold: false, notes: ['진행 막대 4칸(결정→주문→받음→입음)', '다음 단계 버튼이 줄 안에'] })
    + K.phone('빈 결과', `<div class="fx">${empty}</div>`, { fold: false, notes: ['막다른 길 대신 ‘하나 빼면’ 결과 수와 사진, 누를 때만 적용'] }));
  // PC
  const pc = `<div class="fx pc"><div class="bar">${wm}<div class="pcq">${ico('search', 's')}${esc(K.Q)}</div><div class="pcnav"><span>비교 2</span><span>옷장 1</span><span>기록 ${recs.length}</span></div></div><div style="display:grid;grid-template-columns:220px 1fr;gap:40px;padding:28px 40px 0"><div style="font-size:13px"><div class="caps" style="color:var(--sub);margin-bottom:12px">검색 범위</div>${r2.conditions.map((x) => `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--hair)"><span>${esc(x.label)}</span>${x.removable ? '<span style="color:var(--mute)">빼기</span>' : ''}</div>`).join('')}<div class="caps" style="color:var(--sub);margin:28px 0 12px">내 옷장 1벌</div><div style="width:72px">${ph(M.getState().closet[0], { caption: false })}</div><div style="font-size:12px;color:var(--sub);margin-top:6px">흰 옥스퍼드 셔츠 · 비슷한 상품 사진</div></div><div><div class="meta" style="padding:0 0 16px"><span>${r2.total}개 · 가격은 10월 13일 수집가</span><span class="sort">추천순 ${ico('down', 's')}</span></div><div class="grid" style="grid-template-columns:repeat(4,1fr);gap:36px 1px">${r2.products.slice(0, 8).map((p) => card(p, M.compareHas(p.id))).join('')}</div></div></div></div>`;
  K.row(K.pc('PC 검색 결과', pc, { notes: ['왼쪽 검색 범위·내 옷장, 오른쪽 4열'] }));
  const pcPdp = `<div class="fx pc"><div class="bar">${wm}<div class="pcq">${ico('search', 's')}${esc(K.Q)}</div><div class="pcnav"><span>비교 2</span><span>옷장 1</span><span>기록</span></div></div><div style="display:grid;grid-template-columns:1fr 440px;gap:0;padding:0 0 0 40px"><div style="max-width:560px;margin:24px auto 0;width:100%">${ph(d2)}</div><div style="padding:32px 40px 0 32px;position:relative"><div class="pinfo" style="padding:0"><div class="br">${esc(d2.brand)}</div><h1 style="font-size:20px">${esc(d2.name)}</h1><div class="price"><b class="num" style="font-size:22px">${esc(d2.priceText)}</b><span>${esc(d2.priceShort)} · ${esc(d2.store)}</span></div></div>${verdict(d2.verdict).replace('class="vd"', 'class="vd" style="margin:24px 0 0"')}<div style="margin-top:20px">${seg(d2.verdict)}</div><div style="display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--sub)"><span>무신사에서 보기 ↗</span><span>비교 담기 +</span></div></div></div></div>`;
  K.row(K.pc('PC 상품 상세', pcPdp, { notes: ['사진 1장(자료에 상품당 사진 1장뿐) + 오른쪽 정보 열 440', '판매처에서 사진을 더 받으면 2열 사진 격자로 확장'] }));
})();
</script>
</body>
</html>
