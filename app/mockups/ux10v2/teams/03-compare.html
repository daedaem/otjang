<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>어울 · 비교함</title>
<!-- 시안 03 비교함 2판. 후보를 사람이 직접 비교함에 담고(자동 담기 없음) 나란히 보고 고른다. 검토용 설명은 화면 밖(시안 표시 → 고지)에 둔다. -->
<script src="../shared/eoul-mock.js"></script>
<style>
:root{
  --ink:#111;--ink2:#2b2b2b;--sub:#5c5c5c;--mute:#737373;--line:#e8e8e5;--line2:#d0d0cb;--bg:#fff;--soft:#f5f5f3;--soft2:#eeeeea;
  --acc:#0b6b4d;--acc-bg:#e6f3ed;--stop:#a1221b;--stop-bg:#fbedec;--go:#16613a;--go-bg:#e6f2ea;--info:#1b4b8a;--info-bg:#e9eff8;
  --hdr:56px;--gut:16px;--max:1280px;--bar:68px;color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px;scroll-padding-bottom:160px}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.num,.price,.cp b{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fine{font-size:12px;color:var(--sub);line-height:1.5}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.eo-cap{font-size:12px!important}
.ic{display:block;flex:none}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:14px;font-weight:600;text-decoration:none;line-height:1.25;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.block{display:flex;width:100%}
.btn[disabled]{background:var(--soft);border-color:var(--line);color:#6a6a6a;cursor:not-allowed}
.link{background:none;border:0;padding:0 4px;min-height:32px;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:#fff;font-size:14px;white-space:nowrap;text-decoration:none}
.chip.fixed{background:var(--soft);border-color:var(--soft);font-weight:600}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .x{display:inline-flex;margin-right:-4px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;line-height:1.4;padding:1px 6px;border-radius:4px;background:var(--soft2);color:#333;white-space:nowrap}
.t-stop{background:var(--stop-bg);color:var(--stop)}
.t-go{background:var(--go-bg);color:var(--go)}
.t-info{background:var(--info-bg);color:var(--info)}
.t-ink{background:var(--ink);color:#fff}

/* 머리글 */
.hdr{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.hdr-in{max-width:var(--max);margin:0 auto;height:var(--hdr);display:flex;align-items:center;gap:4px;padding:0 10px}
.hback{display:none;width:40px;height:44px;border:0;background:none;align-items:center;justify-content:center;margin-left:-4px}
body.sub .hback{display:inline-flex}
.logo{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;font-size:21px;font-weight:800;letter-spacing:-.04em;text-decoration:none}
.mock{min-height:30px;padding:0 9px;border:1px solid var(--line2);border-radius:999px;background:#fff;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.hsearch{display:none}
.hnav{margin-left:auto;display:flex;align-items:center}
.hbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:48px;gap:1px;font-size:12px;line-height:1.1;text-decoration:none;color:var(--ink);border-radius:8px}
.hbtn[aria-current="page"]{font-weight:800}
.hbtn[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--ink);border-radius:2px}
.hbtn .cnt{position:absolute;top:2px;left:25px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;line-height:18px;text-align:center}
.hbtn .cnt:empty{display:none}

/* 틀 */
main{max-width:var(--max);margin:0 auto;padding:0 var(--gut) 40px}
body.has-tray main{padding-bottom:96px}
body.v-pdp main{padding-bottom:calc(var(--bar) + 32px)}

/* 검색 */
form.sf{position:relative;display:flex;gap:8px}
.sf-box{position:relative;flex:1;min-width:0}
.sf-box .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none}
.sf input{width:100%;min-height:46px;padding:0 12px 0 40px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;font-size:16px}
.sf button[type=submit]{min-height:46px;padding:0 18px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:35;background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;display:none}
.sug.on{display:block}
.sug button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border:0;background:none;border-radius:6px;text-align:left;font-size:15px}
.sug button:hover,.sug button:focus-visible{background:var(--soft)}
.sug .k{flex:none;width:34px;font-size:12px;color:var(--sub);font-weight:700}
.sug-foot{display:flex;justify-content:flex-end;padding:2px 4px 0}
.msearch{padding:12px 0 4px}

/* 홈 */
.home-h{font-size:24px;line-height:1.3;letter-spacing:-.02em;margin:22px 0 14px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.sec-h{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sec-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:36px 0 14px}
.resume{display:flex;align-items:center;gap:12px;margin-top:22px;padding:12px;border:1px solid var(--line);border-radius:10px;text-decoration:none}
.resume .ths{display:flex;gap:4px}
.resume .ths span{width:40px;border-radius:4px;overflow:hidden}
.resume b{display:block;font-size:15px}

/* 결과 */
.rtitle{font-size:16px;font-weight:700;margin:10px 0 8px;letter-spacing:-.01em}
.scope{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--gut) * -1);padding:0 var(--gut) 2px}
.scope::-webkit-scrollbar{display:none}
.rmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:12px 0 14px;font-size:13px;color:var(--sub)}
.rmeta b{color:var(--ink);font-size:14px}
.rmeta .hint{margin-left:auto}
.notice{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:8px;padding:8px 12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 10px}
.off-h{font-size:16px;font-weight:800;margin:40px 0 12px}

/* 상품 카드 */
.card{position:relative;min-width:0;display:flex;flex-direction:column}
.card-a{display:flex;flex-direction:column;text-decoration:none;color:inherit;min-width:0}
.card-ph{position:relative;display:block;border-radius:4px;overflow:hidden;background:var(--soft)}
.card.in .card-ph{box-shadow:inset 0 0 0 2px var(--ink)}
.card.in .card-ph .eo-ph{box-shadow:inset 0 0 0 2px var(--ink)}
.slotno{position:absolute;left:8px;top:8px;display:none;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;line-height:24px;text-align:center}
.card.in .slotno{display:block}
.card-b{margin-top:10px;font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-n{margin-top:2px;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.cp{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-top:4px}
.cp b{font-size:16px;font-weight:800}
.cp span{font-size:12px;color:var(--mute)}
.ctags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:44px;margin-top:10px;padding:0 8px;border:1px solid var(--line2);border-radius:6px;background:#fff;font-size:13px;font-weight:700}
.tg .box{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1.5px solid #555;border-radius:4px;color:transparent;background:#fff}
.tg[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.tg[aria-pressed="true"] .box{border-color:#fff;background:#fff;color:var(--ink)}
.tg:hover{border-color:var(--ink)}
.more{margin:20px auto 0;display:flex}

/* 비교함 바(하단) */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(255,255,255,.98);border-top:1px solid var(--line2);box-shadow:0 -6px 24px rgba(0,0,0,.08);padding:0 0 env(safe-area-inset-bottom);transform:translateY(110%);transition:transform .22s ease}
.tray.on{transform:none}
.tray-in{max-width:var(--max);margin:0 auto;height:72px;display:flex;align-items:center;gap:10px;padding:0 12px}
.slots{display:flex;gap:7px;flex:none}
.slot{position:relative;width:48px;height:60px;flex:none;border-radius:4px}
.slot a{display:block;width:48px;height:60px;border-radius:4px;overflow:hidden;background:var(--soft)}
.slot.empty{border:1.5px dashed var(--line2);display:flex;align-items:center;justify-content:center;color:#9a9a9a}
.slot .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;padding:0;border-radius:12px;border:2px solid #fff;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.slot .meta{display:none}
.tray-txt{display:none}
.tray-go{margin-left:auto;flex:none;min-height:48px;padding:0 14px;font-size:15px}
.tray-go .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--ink);font-size:12px;font-weight:800}
.tray-msg{position:absolute;left:12px;right:12px;bottom:calc(100% + 8px);padding:10px 14px;border-radius:8px;background:var(--ink);color:#fff;font-size:14px;display:none}
.tray-msg.on{display:block}

/* 알림(누르는 곳 없음) */
.toast{position:fixed;left:50%;top:calc(var(--hdr) + 10px);z-index:60;transform:translate(-50%,-8px);max-width:calc(100% - 32px);padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 상세 */
.pdp-top{display:block}
.pdp-ph{margin:0 calc(var(--gut) * -1)}
.pdp-zoom{position:relative;display:block;width:100%;padding:0;border:0;background:var(--soft);cursor:zoom-in}
.zoom-ic{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.94);box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:12px;font-weight:700}
.pdp-info{padding-top:18px}
.pdp-brand{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:800}
.pdp-name{font-size:18px;font-weight:400;line-height:1.45;letter-spacing:-.01em;margin:4px 0 12px}
.pdp-pr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.pdp-price{font-size:26px;font-weight:800;letter-spacing:-.02em}
.pdp-meta{font-size:13px;color:var(--sub)}
.pdp-rate{margin-top:4px;font-size:13px;color:var(--sub)}
.pdp-why{margin-top:14px;font-size:14px;color:var(--ink2);border-left:3px solid var(--ink);padding:2px 0 2px 10px}
.pdp-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pdp-acts .tg{margin:0;min-height:48px;font-size:14px}
.pdp-acts .btn{min-height:48px}
.pdp-rec{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:12px;font-size:13px}
.pdp-size{margin-top:10px}
.decide{position:fixed;left:0;right:0;bottom:0;z-index:26;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.98);border-top:1px solid var(--line2);box-shadow:0 -6px 24px rgba(0,0,0,.06)}
.decide.with-cmp{grid-template-columns:62px repeat(3,minmax(0,1fr))}
.dbtn{min-height:48px;padding:0 6px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px}
.dbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.dbtn .ck{display:none}
.dbtn[aria-pressed="true"] .ck{display:block}
.dcmp{position:relative;display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line2);border-radius:8px;text-decoration:none;background:#fff}
.dcmp .st{position:relative;width:40px;height:40px}
.dcmp .st span{position:absolute;top:0;width:26px;height:33px;border-radius:3px;overflow:hidden;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line2)}
.dcmp .st span:nth-child(1){left:0}
.dcmp .st span:nth-child(2){left:13px;top:6px}
.dcmp .n{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;line-height:22px;text-align:center}
.sec{margin-top:36px}
.sec > .sec-h{margin-bottom:12px}
.sec-sub{margin:-6px 0 12px}

/* 내 옷과 비교 */
.mine{border:1px solid var(--line);border-radius:12px;padding:16px}
.mine.tone-stop{border-color:#e7c2bf;background:#fffafa}
.mine.tone-go{border-color:#bfdccb;background:#f8fcf9}
.mine-basis{font-size:12px;font-weight:700;color:var(--sub)}
.mine-t{font-size:19px;font-weight:800;line-height:1.35;letter-spacing:-.01em;margin:4px 0 6px}
.mine.tone-stop .mine-t{color:var(--stop)}
.mine.tone-go .mine-t{color:var(--go)}
.mine-l{font-size:14px;color:var(--ink2);margin-top:2px}
.mine-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mine-acts .btn{flex:1 1 150px}
.flash{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-bottom:12px;padding:8px 12px;border-radius:8px;background:var(--go-bg);color:#0f3f25;font-size:13px;font-weight:600}
.owned{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.owned figure{min-width:0}
.owned .ph{border-radius:4px;overflow:hidden}
.owned figcaption{margin-top:6px;font-size:12px;line-height:1.4}
.owned figcaption b{display:block;font-size:13px}
.ask{margin-top:14px}
.ask p{font-size:14px;font-weight:700;margin-bottom:8px}
.ask .row{display:flex;flex-wrap:wrap;gap:6px}
.cautions{margin-top:10px;font-size:13px;color:var(--stop)}

/* 새 상품 · 중고 */
.nu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.nu-c{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;display:flex;flex-direction:column}
.nu-lab{font-size:15px;font-weight:800;margin-bottom:10px}
.nu-ph{border-radius:6px;overflow:hidden;background:var(--soft);aspect-ratio:1/1}
.nu-ph .eo-ph{aspect-ratio:1/1!important}
.nu-ph.none{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:13px;color:var(--sub);border:1.5px dashed var(--line2);background:#fafaf8}
.nu-cap{font-size:12px;color:var(--sub);margin:6px 0 8px}
.nu dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;font-size:13px;margin-bottom:12px}
.nu dt{color:var(--sub)}
.nu dd{font-weight:600}
.nu dd b{font-size:16px}
.nu .links{display:grid;gap:6px;margin-top:auto}
.nu .links .btn{min-height:40px;font-size:13px;padding:0 8px}
.nu details{margin-top:8px}
.nu summary{min-height:40px;display:flex;align-items:center;font-size:13px;font-weight:700;cursor:pointer}
.nu details .links{margin-top:4px}

/* 코디 */
.look-t{font-size:15px;font-weight:700;margin:-4px 0 12px}
.look{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
.look figure{min-width:0}
.look .ph{display:block;border-radius:4px;overflow:hidden}
.look .focus .ph{box-shadow:0 0 0 2px var(--ink)}
.look figcaption{margin-top:6px;font-size:12px;line-height:1.4;color:var(--sub)}
.look figcaption b{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look a{text-decoration:none}

/* 시트·사진 보기 */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.42)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:88vh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:16px 16px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.grab{width:40px;height:4px;border-radius:2px;background:#cfcfcf;margin:4px auto 12px}
.sheet-h{display:flex;align-items:flex-start;gap:8px}
.sheet-h h2{flex:1;font-size:19px;line-height:1.35;letter-spacing:-.01em}
.xbtn{flex:none;width:44px;height:44px;margin:-6px -8px 0 0;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;border-radius:22px}
.sheet .step{font-size:13px;font-weight:800;color:var(--ink2);margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:14px}
.opt i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:none}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:0 13px;font-weight:700}
.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.colors .opt{padding:0 10px}
.colors .opt[aria-pressed="true"]{padding:0 9px}
.sheet-foot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:grid;gap:8px}
.sheet-foot .btn{min-height:50px;font-size:15px}
.viewer{position:fixed;inset:0;z-index:72;background:#fff;display:flex;flex-direction:column}
.vw-bar{display:flex;align-items:center;gap:8px;height:56px;padding:0 6px 0 16px;border-bottom:1px solid var(--line)}
.vw-bar p{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw-ph{position:relative;flex:1;min-height:0;overflow:hidden;cursor:zoom-in;background:#fff}
.vw-ph .eo-ph{aspect-ratio:auto!important;height:100%;background:#fff!important}
.vw-ph img{transition:transform .2s ease}
.vw-ph.z{cursor:zoom-out}
.vw-ph.z img{transform:scale(2.2)}
.vw-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));font-size:12px;color:var(--sub);text-align:center;border-top:1px solid var(--line)}

/* 비교(오버레이) */
.cmpo{position:fixed;inset:0;z-index:45;background:#fff;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cmpo-panel{min-height:100%;background:#fff}
.cmpo-bar{position:sticky;top:0;z-index:8;display:flex;align-items:center;gap:6px;height:56px;padding:0 8px 0 4px;background:#fff;border-bottom:1px solid var(--line)}

  const had = M.compareHas(id);
  if (!had && M.compareList().length >= MAX) {
    const m = $('#tray-msg');
    const text = `비교함은 ${MAX}개까지예요. 아래에서 하나를 빼면 담을 수 있어요.`;
    if (m && trayEl.classList.contains('on')) { m.textContent = text; m.classList.add('on'); setTimeout(() => m.classList.remove('on'), 3200); say(text); }
    else toast(`비교함은 ${MAX}개까지예요. 비교함에서 하나를 빼 주세요.`);
    return;
  }
  act(() => { if (had) M.compareRemove(id); else M.compareAdd(id); });
  const n = M.compareList().length;
  say(had ? `비교함에서 뺐어요. ${n}개 남았어요.` : `비교함에 담았어요. ${n}/${MAX}`);
  syncCompare(id);
}
function decide(id, d) {
  const before = M.judge(id);
  const prev = before && before.record ? before.record.decision : null;
  const r = act(() => M.decide(id, d));
  if (!r) return;
  ui.decFlash = { id, d, prev };
  say(DONE[d]);
  if (document.body.classList.contains('cmp-open')) { drawCompare(); renderedVersion = -1; return; }
  // 상세: 버튼 상태와 기록 줄만 바꾼다(사진을 다시 그리지 않는다).
  $$(`[data-product-id="${id}"][data-flow^="decide-"]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.flow === 'decide-' + d)));
  const line = $('#pdp-rec'); if (line) line.innerHTML = recLine(id, M.judge(id).record);
  renderedVersion = M.version();
  chrome();
}
function undoDecision(id) {
  const f = ui.decFlash; if (!f || f.id !== id) return;
  act(() => { if (f.prev) M.decide(id, f.prev); else M.removeRecord(id); });
  ui.decFlash = null;
  say('결정을 되돌렸어요');
  if (document.body.classList.contains('cmp-open')) { drawCompare(); renderedVersion = -1; } else refresh();
}
function saveGarment() {
  const a = ui.add; if (!a || !a.kind || !a.color) return;
  const g = act(() => M.addGarment({ kind: a.kind, color: a.color, slot: a.slot || null }));
  if (!g) return;
  ui.flash = { ctx: a.ctx === 'pdp' ? a.pid : a.ctx, gid: g.id, text: `${g.colorLabel} ${g.slotName || g.kindName}${a.ctx === 'closet' ? '을(를) 넣었어요.' : '을(를) 넣고 다시 비교했어요.'}` };
  say(ui.flash.text);
  if (a.ctx === 'compare') ui.sameOpen = false;
  // 바탕 화면을 새 판정으로 다시 그린 뒤 시트를 닫는다(같은 상품·같은 비교로 돌아감).
  refresh();
  if (document.body.classList.contains('cmp-open')) drawCompare();
  closeOverlay();
}
function loadTrial() {
  act(() => M.loadTrialCloset());
  const t = `체험용 옷 ${M.getState().trialCount}벌을 넣었어요(내 옷으로 세지 않아요).`;
  say(t);
  if (layer.innerHTML) { refresh(); if (document.body.classList.contains('cmp-open')) drawCompare(); closeOverlay(); }
  else if (document.body.classList.contains('cmp-open')) { drawCompare(); renderedVersion = -1; }
  else refresh();
  toast(t);
}

// ── 검색 제안(입력 중)
function showSug(form) {
  const input = $('input', form), box = $('.sug', form);
  const rows = M.searchSuggestions(input.value, { limit: 6 });
  const hasRecent = rows.some((r) => r.kind === 'recent');
  if (!rows.length) { box.classList.remove('on'); input.setAttribute('aria-expanded', 'false'); return; }
  box.innerHTML = rows.map((r) => `<button type="button" role="option" data-act="sug" data-q="${esc(r.q)}"><span class="k">${esc(r.label)}</span>${esc(r.q)}</button>`).join('') + (hasRecent ? '<div class="sug-foot"><button type="button" class="link" data-act="clear-recent">최근 검색 지우기</button></div>' : '');
  box.classList.add('on'); input.setAttribute('aria-expanded', 'true');
}
function hideSug() { $$('.sug.on').forEach((b) => { b.classList.remove('on'); const i = $('input', b.parentElement); if (i) i.setAttribute('aria-expanded', 'false'); }); }
document.addEventListener('focusin', (e) => { if (e.target.matches('.sf input')) showSug(e.target.closest('form')); });
document.addEventListener('input', (e) => { if (e.target.matches('.sf input')) showSug(e.target.closest('form')); });
document.addEventListener('submit', (e) => {
  const f = e.target.closest('form.sf'); if (!f) return;
  e.preventDefault(); hideSug();
  const q = String($('input', f).value || '').trim();
  $('input', f).blur();
  go('/search', q ? { q } : {});
});

// ── 누르기
document.addEventListener('click', (e) => {
  if (!e.target.closest('form.sf')) hideSug();
  const t = e.target.closest('button, a, [data-act]');
  if (!t || t.disabled) return;
  const f = t.dataset.flow, a = t.dataset.act, d = t.dataset;
  if (f === 'mock-label') { M.openDisclosure(); return; }
  if (f === 'nav-ask' && (cur.view === 'search' || cur.view === 'home') && !document.body.classList.contains('cmp-open')) {
    e.preventDefault(); window.scrollTo(0, 0); const i = $('.msearch input') || $('#hsearch input'); if (i && i.offsetParent) i.focus(); return;
  }
  if (t.tagName === 'A' && !a) {
    if (t.closest('.cmpo') && t.getAttribute('href') && t.getAttribute('href').startsWith('#/p/')) { ui.page = 0; }
    return; // 주소 이동은 브라우저에 맡긴다(뒤로가기·새 창).
  }
  if (f === 'compare-add') return toggleCompare(d.productId);
  if (f && f.startsWith('decide-')) return decide(d.productId, f.slice(7));
  if (f === 'closet-add') { if (a === 'add-closet') return openOverlay({ add: '1' }); return openOverlay({ add: document.body.classList.contains('cmp-open') ? d.id : '1' }); }
  if (f === 'kind-option' && ui.add) { ui.add.kind = d.kind; ui.add.slot = null; ui.add.kindName = (M.kindChoices().find((k) => k.id === d.kind) || {}).name || '옷'; return redrawSheet(); }
  if (f === 'color-option' && ui.add) { ui.add.color = d.color; return redrawSheet(d.color); }
  if (f === 'slot-option' && ui.add) { ui.add.slot = ui.add.slot === d.slot && ui.add.ctx === 'closet' ? null : d.slot; return redrawSheet(); }
  if (f === 'closet-save') return saveGarment();
  if (f === 'trial-closet') return loadTrial();
  if (f === 'record-step') {
    if (d.step === 'returned') { ui.retFor = d.productId; return refresh(); }
    const r = act(() => M.advance(d.productId, d.step)); if (r) say(`기록했어요: ${r.stageLabel}`); return refresh();
  }
  if (f === 'reset') { act(() => { M.reset(); M.compareClear(); }); lastSearch = null; lastResult = null; ui.page = 0; memo.clear(); go('/', {}); refresh(); toast('처음 상태로 돌렸어요'); return; }
  switch (a) {
    case 'back': if (document.body.dataset.nav) history.back(); else go('/'); return;
    case 'zoom': overlayPushed = true; go(cur.path, { ...baseParams(), view: 'photo' }); return;
    case 'zoom-toggle': {
      const img = $('img', t); t.classList.toggle('z');
      if (img && t.classList.contains('z')) { const r = t.getBoundingClientRect(); img.style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`; }
      return;
    }
    case 'close': return closeOverlay();
    case 'close-cmp': return closeCompare();
    case 'tray-rm': act(() => M.compareRemove(d.id)); say('비교함에서 뺐어요'); return syncCompare(d.id);
    case 'cmp-rm': act(() => M.compareRemove(d.id)); say(`비교함에서 뺐어요. ${M.compareList().length}개 남았어요.`); drawCompare(); renderedVersion = -1; chrome(); return;
    case 'pg': return setPage(ui.page + Number(d.d));
    case 'same': ui.sameOpen = !ui.sameOpen; return drawCompare();
    case 'alt-more': ui.altMore = true; return refresh();
    case 'undo-dec': return undoDecision(d.id);
    case 'undo-g': act(() => M.removeGarment(d.id)); ui.flash = null; say('방금 넣은 옷을 뺐어요'); refresh(); if (document.body.classList.contains('cmp-open')) drawCompare(); return;
    case 'own': act(() => M.setOwnership(d.id, d.v)); return refresh();
    case 'slots': if (ui.add) { ui.add.slots = !ui.add.slots; redrawSheet(); } return;
    case 'gender': act(() => M.setGender(d.v)); return refresh();
    case 'g-rm': act(() => M.removeGarment(d.id)); say('옷을 뺐어요'); return refresh();
    case 'clear-trial': act(() => M.clearTrialCloset()); say('체험용 옷을 뺐어요'); return refresh();
    case 'rec-rm': act(() => M.removeRecord(d.id)); say('기록을 지웠어요'); return refresh();
    case 'ret': { const r = act(() => M.advance(d.id, 'returned', { reason: d.v })); ui.retFor = null; if (r) say(`기록했어요: ${r.stageLabel}`); return refresh(); }
    case 'ret-cancel': ui.retFor = null; return refresh();
    case 'sug': hideSug(); go('/search', { q: d.q }); return;
    case 'clear-recent': act(() => M.clearRecent()); hideSug(); return;
    default:
  }
});
function redrawSheet(focusColor) {
  const sc = $('.sheet', layer); const y = sc ? sc.scrollTop : 0;
  layer.innerHTML = sheetHtml();
  const ns = $('.sheet', layer); if (ns) ns.scrollTop = y;
  const fb = focusColor ? $(`[data-color="${focusColor}"]`, layer) : null; if (fb) fb.focus({ preventScroll: true });
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('.sug.on')) return hideSug();
    if (layer.innerHTML) { e.preventDefault(); return closeOverlay(); }
    if (document.body.classList.contains('cmp-open') && !$('#eo-disclosure[open]')) { e.preventDefault(); return closeCompare(); }
  }
  if (document.body.classList.contains('cmp-open') && !mqPC.matches && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.matches('input')) setPage(ui.page + (e.key === 'ArrowRight' ? 1 : -1));
});
mqPC.addEventListener('change', () => { if (cur.key) refresh(); if (document.body.classList.contains('cmp-open')) drawCompare(); });
M.subscribe(() => { if (busy) return; if (cur.key) refresh(); if (document.body.classList.contains('cmp-open')) drawCompare(); });

if (M.boot.q && !location.hash) history.replaceState(null, '', href('/search', { q: M.boot.q }));
M.route.on(onRoute, { restoreScroll: false });
})();
</script>
