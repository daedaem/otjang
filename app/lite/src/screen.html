    const band = `<div class="wx-band"><b>${esc(m.band.label)}</b> · ${esc(m.band.advice)}</div>${m.notes ? `<p class="wx-note"><i class="ph ${m.temp.rain ? 'ph-umbrella' : 'ph-thermometer'}"></i><span>${esc(m.notes)}</span></p>` : ''}`;
    const photos = m.outfit ? `<div class="wx-ps">${m.pieces.map((x) => `<div class="p1">${x.html}<div class="t6">${esc(x.label)}${x.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : '';
    const ac = `<div class="wx-ac">${m.count > 1 ? `<button class="quiet" data-wxnext><i class="ph ph-arrows-clockwise"></i>다른 조합 <span class="num">${m.index + 1}/${m.count}</span></button>` : ''}${m.where === 'home' ? '<button class="quiet" data-tabgo="looks">코디 더 보기<i class="ph ph-caret-right"></i></button>' : ''}</div>`;
    const miss = m.missing ? `<div class="wx-miss"><h3 class="h3">${esc(m.missing.heading)}</h3>
        ${m.missing.products.length ? `<div class="wx-mg">${m.missing.products.map((p) => p.html).join('')}</div><button class="quiet" data-q="${esc(m.missing.query)}" style="margin-top:2px">${esc(m.missing.query)} 더 보기<i class="ph ph-caret-right"></i></button>` : `<p class="t6" style="margin:4px 0 0">맞는 ${esc(m.missing.label)} 상품을 찾지 못했어요.</p>`}</div>` : '';
    return `<section class="wx" aria-label="오늘 날씨 코디">${head}${band}${photos}<p class="wx-why${m.good ? ' good' : ''}"><i class="ph-fill ph-check-circle"></i><span>${esc(m.why)}${esc(m.whyMore)}</span></p>${ac}${miss}${exRow}</section>`;
  }
  // 날씨 상태를 바꾸는 동작은 모두 여기로 모은다. React 카드는 subscribe로 다시 그리고,
  // React 카드가 없는 바닐라 화면만 예전처럼 화면을 다시 그린다(keepY).
  const weatherCtl = {
    version: 0, subs: new Set(),
    subscribe(fn) { weatherCtl.subs.add(fn); return () => weatherCtl.subs.delete(fn); },
    getVersion: () => weatherCtl.version,
    changed() { weatherCtl.version++; weatherCtl.subs.forEach((fn) => fn()); if (!weatherCtl.subs.size && ['home', 'looks'].includes(curView)) keepY(); },
    model: (where) => weatherModel({ where }),
    load: () => loadWeather(),
    setDay(day) { WX.day = day === 'tomorrow' ? 'tomorrow' : 'today'; weatherCtl.changed(); },
    setExample(id) { if (!WX_EX.some((e) => e.id === id)) return; S.ui.wxEx = id; saveUi(); weatherCtl.changed(); },
    next() {
      const src = wxSource(); const day = WX.day === 'tomorrow' && src.tomorrow ? 'tomorrow' : 'today'; const w = src[day];
      const key = `${day}|${w.min}|${w.max}|${w.rain ? 1 : 0}`; WX.idx[key] = (WX.idx[key] || 0) + 1; weatherCtl.changed();
    },
    // 날씨 지역(설치 앱에서만). 위치는 사용자가 이 시트에서 고를 때만 묻는다.
    places: () => {
      const P = window.EOUL_WEATHER_PLACE;
      return P ? { current: P.get(), presets: P.presets, here: () => P.here() } : null;
    },
    applyPlace(place) {
      const P = window.EOUL_WEATHER_PLACE; if (!P) return;
      P.set(place); WX.real = undefined; WX.failed = false; weatherCtl.changed(); loadWeather();
    },
  };
  // React 날씨 카드가 쓰는 이동. 바닐라의 data-add-open/data-trial/data-tabgo/data-q와 같은 동작이다.
  const weatherHost = {
    ctl: weatherCtl,
    add: () => K.go('add', {}),
    trial: () => { M.loadTrialCloset(); K.refresh(); },
    looks: () => K.tab('looks'),
    search: (q) => K.go('results', { q }),
    reduce: () => !!K.reduce,
    // 부족 아이템 상품 카드(WO-08c): 바닐라 data-pid·data-hang(toggleHang)과 같은 동작. 못 걸면 안내 문구를 돌려준다.
    product: (id) => K.go('detail', { id }),
    hang(id) {
      const was = M.compareHas(id);
      if (was) { M.compareRemove(id); if (S.asking === id) S.asking = null; }
      else {
        try { M.compareAdd(id); } catch (err) { return /비교함|4개/.test(err.message) ? '옷걸이에는 4벌까지 걸 수 있어요. 하나를 내리고 다시 걸어 주세요.' : err.message; }
        if (needAsk(id)) S.asking = id;
      }
      afterHang(id, null, !was);
      return null;
    },
  };
  function wireWeather() {
    $$('[data-wxex]').forEach((b) => { b.onclick = () => { S.ui.wxEx = b.dataset.wxex; saveUi(); keepY(); }; });
    $$('[data-wxday]').forEach((b) => { b.onclick = () => { WX.day = b.dataset.wxday; keepY(); }; });
    $$('[data-wxplace]').forEach((b) => { b.onclick = placeSheet; });
    const nx = $('[data-wxnext]'); if (nx) nx.onclick = () => { const src = wxSource(); const day = WX.day === 'tomorrow' && src.tomorrow ? 'tomorrow' : 'today'; const w = src[day]; const key = `${day}|${w.min}|${w.max}|${w.rain ? 1 : 0}`; WX.idx[key] = (WX.idx[key] || 0) + 1; keepY(); };
    loadWeather();
  }
  const keepY = () => { const y = scrollY; K.refresh(); requestAnimationFrame(() => scrollTo(0, y)); };
  const MOODS = [['work', '출근'], ['date', '데이트'], ['weekend', '주말·여행'], ['formal', '격식·하객']];
  const moodAsk = (label) => { try { const r = M.readSearch(`${label} 코디`); return r.understood && (r.conditions || []).some((c) => c.key === 'occasion') ? r : null; } catch { return null; } };
  // ‘한 벌만 더’ 상품 줄: 사진·브랜드·품명·이유·수집가 + 걸기 토글.
  const sgRow = (p, why = '') => `<div class="sg" data-card="${p.id}"><span class="pic">${productPic(p.id)}${hangToggle(p.id)}</span><button class="grow" data-pid="${p.id}"><span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="why">${esc(why || p.why || p.reason || '')}</span><span class="p num">${esc(p.priceText)}<small>${esc(p.priceShort)}</small></span></button></div>`;

  const V = {
    home({ q = '' } = {}) {
      const ex = M.examples().slice(0, 4);
      // WO-11 새 디자인(v2): 찾기 칸을 맨 위에, 날씨 코디는 그 아래에 둔다.
      const v2 = document.documentElement.dataset.look === 'v2';
      const wx = weatherHtml({ where: 'home' });
      return `${top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' })}
        ${v2 ? '' : wx}
        <h1 class="h1 hero${v2 ? '' : ' after-wx'}">뭐 사려고요?<br><span class="acc">걸어 보고</span> 사요.</h1>
        <form class="ask" id="sf" role="search"><input id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="대충 말해도 돼요" aria-label="찾는 옷" value="${esc(q)}"><button aria-label="찾기"><i class="ph ph-arrow-right"></i></button></form>
        <div class="chips">${ex.map((x) => `<button class="chip ex" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>${v2 ? `\n        ${wx}` : ''}
        ${proofHtml()}`;
    },

    results({ q, drop = [] }) {
      const m = resultsModel({ q, drop });
      const chips = m.chips.map((c) => c.removable ? `<button class="chip" data-drop="${esc(c.key)}" aria-label="${esc(c.label)} 조건 빼기">${esc(c.label)}<i class="ph ph-x"></i></button>` : `<span class="chip on">${esc(c.label)}</span>`).join('');
      const head = top({ mid: `<button class="qbox" data-edit="${esc(q)}" aria-label="다시 찾기: ${esc(q)}"><i class="ph ph-magnifying-glass"></i><span>${esc(q)}</span></button>` });
      if (m.kind === 'partial') {
        return `${head}${searchSources(q)}<details class="ai-info"><summary>기존 상품 목록에서 찾지 못한 이유</summary><p class="t6">${esc(m.notice)}</p></details>`;
      }
      if (m.kind === 'empty') {
        return `${head}${chips ? `<div class="chips scroll">${chips}</div>` : ''}
          <div class="empty"><h2 class="h2">${m.title}</h2>
          <p class="sub t5" style="margin-top:6px">${esc(m.sub)}</p>
          ${m.relax.length ? `<div style="margin-top:12px">${m.relax.map((x) => `<button class="row" data-relax='${esc(JSON.stringify(x.drop))}'><span class="grow t5">${esc(x.title)}</span><i class="ph ph-caret-right arr"></i></button>`).join('')}</div>` : ''}
          ${m.alts.length ? `<p class="t6" style="margin-top:20px">대신 이렇게 볼 수도 있어요</p><div class="chips">${m.alts.map((a) => `<button class="chip ex" data-q="${esc(a.q)}">${esc(a.label)}</button>`).join('')}</div>` : ''}
          ${m.examples ? `<div class="chips" style="margin-top:18px">${m.examples.map((x) => `<button class="chip ex" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}</div>${searchSources(q)}`;
      }
      return `${head}
        <div class="chips scroll" aria-label="조건"><span class="cnt num">${m.count}개 · ${esc(m.basis)}</span>${chips}</div>
        <div class="ai ${m.ranked ? '' : 'wait'}" id="ai" role="status">${m.ranked ? `<i class="ph-fill ph-sparkle"></i><span>${esc(m.summary)}</span>` : '<i class="ph ph-circle-notch"></i><span>AI가 후보 순서를 정하는 중이에요</span>'}</div>
        <div class="grid" id="grid">${gridHtml(m.main)}</div>
        ${m.offTitle ? `<section class="offh"><h2 class="h3">${esc(m.offTitle)}</h2><div class="grid" id="offgrid">${gridHtml(m.off)}</div></section>` : ''}${searchSources(q)}`;
    },

    consult() {
      const th = C.thread();
      if (!th) {
        const list = [...C.threads].sort((a, b) => String(b.at).localeCompare(String(a.at)));
        return `${top({ back: false, right: list.length ? '<button class="tbtn" data-delall>모두 지우기</button>' : '' })}
          <h1 class="h1" style="margin-top:12px">코디 상담</h1>
          <p class="t5 sub" style="margin-top:4px">옷·코디 이야기만 답해요</p>
          <div class="chips">${CHAT_EX.map((q) => `<button class="chip ex" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>
          ${list.length ? `<section class="section"><div class="h"><h2 class="h3">이전 상담 <span class="t6 num">${list.length}</span></h2></div>
            <div class="hist">${list.map((t) => `<div class="hrow"><button class="grow" data-thread="${t.id}"><span class="n">${esc(t.title)}</span><span class="t6">${esc(whenText(t.at))} · 주고받은 말 ${t.turns.filter((x) => x.role !== 'note').length}개</span></button><button class="icon" data-delthread="${t.id}" aria-label="이 상담 지우기"><i class="ph ph-trash"></i></button></div>`).join('')}</div></section>` : ''}`;
      }
      const body = th.turns.map(chatTurnHtml).join('');
      return `${top({ back: false, right: '<button class="tbtn" data-chatlist><i class="ph ph-list-bullets"></i>이전 상담</button><button class="tbtn" data-newchat>새 상담</button>' })}
        <div class="ttl"><i class="ph ph-chats-circle"></i><span class="grow">${esc(th.title)}</span><span class="t6 nw">${esc(whenText(th.at))}</span></div>
        <div class="thread" id="thread" aria-live="polite">${body}${C.busy ? '<div class="msg bot wait" role="status"><span class="who"><i class="ph ph-circle-notch"></i>생각하는 중이에요</span></div>' : ''}</div>`;
    },

    detail({ id }) {
      const m = detailModel(id);
      if (!m) return `${top()}<p class="t5">상품을 찾지 못했어요.</p>`;
      const ai = m.ai, v = m.v, same = m.same, looks = m.looks, nvu = m.nvu, ask = m.ask;
      const head = m.head.kind === 'ask' ? esc(m.head.text) : m.head.kind === 'none' ? `겹치는 ${esc(m.head.kindName)}${m.head.josa} <b class="good">없어요</b>` : m.head.kind === 'same' ? `비슷한 옷이 <b>${m.head.n}벌</b> 걸려 있어요` : m.head.kind === 'new' ? `걸면 새 코디가 <b class="good">${m.head.n}개</b> 생겨요` : esc(m.head.text);
      const sub = m.sub;
      // WO-11 새 디자인(v2): 판단(내 옷에 걸어 보면)을 가격 바로 아래에, 실측·가치·거울은 그 뒤에 둔다.
      const v2 = document.documentElement.dataset.look === 'v2';
      const tools = `        <button class="btn line wide" data-measure="${id}" style="margin:14px 0"><i class="ph ph-ruler" aria-hidden="true"></i>내 기준 옷과 실측 비교</button>
        <button class="quiet" data-collection="${id}" style="margin-bottom:14px">활용·소장 가치 비교 →</button>
        <button class="quiet" data-mirror="${id}" style="margin-bottom:14px">내 사진 거울 옆에 놓고 보기 →</button>
        ${ai?.reason ? `<section class="box ai-why" aria-label="AI 이유"><div class="label"><i class="ph-fill ph-sparkle"></i>AI 순위 ${ai.rank}위${ai.fit ? ` · ${esc(ai.fit)}` : ''}</div><p class="h3">${esc(ai.reason)}</p></section>` : ''}
`;
      const hang = `        <section class="box" id="hangbox" aria-label="내 옷에 걸어 보면"><div class="label"><i class="ph ph-coat-hanger"></i>내 옷에 걸어 보면 · ${esc(v.basisLabel)}</div>
          <h2 class="h2">${head}</h2>
          ${sub ? `<p class="t5 sub">${esc(sub)}</p>` : ''}
          ${m.cautions.map((c) => `<p class="t6 warn"><i class="ph ph-warning-circle" aria-hidden="true"></i>${esc(c)}</p>`).join('')}
          ${ask ? `<div class="ownq"><button data-own="yes" data-for="${id}">있어요</button><button class="no" data-own="no" data-for="${id}">없어요</button></div>` : ''}
          ${same.length ? `<div class="owned">${same.map((o) => `<div class="o">${garmentPic(o)}<div class="t6">${esc(o.colorLabel)} ${esc(o.kindName)}${o.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : ''}
          ${looks.length ? `<div class="looks2">${looks.map((l) => { const ps = l.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4); return `<div class="lk"><div class="head"><b>${esc(l.title || '')}</b>${l.new ? '<span class="t6 acc" style="font-weight:700">새 코디</span>' : ''}</div><div class="ps">${ps.map((x) => `<div class="p1${x.candidate ? ' me' : ''}">${piecePic(x)}<div class="t6">${x.candidate ? '이 옷' : `${esc(x.colorLabel)} ${esc(x.kindName)}${x.trial ? ' · 체험용' : ''}`}</div></div>`).join('')}</div></div>`; }).join('')}</div>` : ''}
          ${m.addLike ? `<div style="margin-top:10px"><button class="quiet" data-addlike="${id}"><i class="ph ph-plus"></i>가진 ${esc(m.addLike.kindName)} 걸기</button></div>` : ''}
        </section>
`;
      return `${top()}
        <div class="pdp"><div class="pdp-photo"><span class="ph-box" style="display:block"><button class="zoomb" data-zoom="${id}" aria-label="사진 크게 보기">${productPic(id).replace(/^<span class="ph-box">|<\/span>$/g, '')}</button>${hangToggle(id, 'big')}</span></div>
        <div>
        <div class="pdp-head"><div class="b">${esc(m.brand)}</div><h1 class="h2" style="margin-top:2px">${esc(m.name)}</h1>
          <div class="pricetag num"><b>${esc(m.priceText)}</b><small>${esc(m.priceNote)}</small></div>
          <p class="t6" style="margin-top:6px">${esc(m.facts)}</p></div>
${v2 ? `${hang}        <div class="pdp-more">\n${tools}        </div>\n` : tools + hang}        <details class="used"><summary><span>중고로 찾기</span><span class="pill">외부 검색 · ${m.usedCount}곳</span><span class="sp"></span><i class="ph ph-caret-right"></i></summary>
          ${nvu.used.groups.map((g) => `<p class="t6 ug">${esc(g.region)}</p><div class="links">${g.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}${l.note ? `<span class="t6 un"> · ${esc(l.note)}</span>` : ''}</span><i class="ph ph-arrow-up-right"></i></a>`).join('')}</div>`).join('')}</details>
        </div></div>`;
    },

    compare() {
      const m = compareModel();
      if (m.few) {
        return `${top()}<h1 class="h2" style="margin-top:8px">두 벌 이상 걸면 나란히 봐요</h1><p class="t5 sub" style="margin-top:6px">결과 사진 모서리의 옷걸이를 눌러 후보를 걸어 주세요. 지금 ${m.count}벌 걸려 있어요.</p>`;
      }
      const head = m.items.map((it) => `<th scope="col"><button data-pid="${it.id}" style="display:block;width:100%;text-align:left">${productPic(it.id)}<div class="n">${esc(it.brand)} ${esc(it.name)}</div></button><button class="rm" data-unhang="${it.id}">내리기</button></th>`).join('');
      const rows = (list) => list.map((r) => `<tr class="${r.same ? 'same' : ''}"><th scope="row">${esc(r.label)}</th>${r.values.map((v) => `<td class="num">${esc(v)}</td>`).join('')}</tr>`).join('');
      return `${top()}<h1 class="h2" style="margin-top:8px">걸어 본 ${m.count}벌</h1><p class="t6" style="margin-top:4px">${esc(m.note)}</p>
        <div class="cmp" id="cmp"><table><colgroup><col style="width:68px">${m.items.map(() => '<col>').join('')}</colgroup><thead><tr><th scope="col"><span class="t6">항목</span></th>${head}</tr></thead><tbody>${rows(m.rows)}</tbody></table></div>
        ${m.nSame ? `<button class="quiet sametog" data-sametog aria-expanded="false"><i class="ph ph-caret-down"></i>같은 항목 ${m.nSame}개 보기</button>` : ''}`;
    },

    closet() {
      const st = M.getState();
      const mine = st.closet;
      const cands = hung().map((id) => M.product(id)).filter(Boolean);
      const out = mine.length ? M.closetOutfits().total : 0;
      const received = st.records.filter((x) => x.decision === 'buy' && ['ordered', 'received'].includes(x.stage)).length;
      const brandOf = (g) => (g.productId ? M.product(g.productId)?.brand || null : regOf(g.id)?.brand || null);
      const bc = new Map(); mine.forEach((g) => { const b = brandOf(g); if (b) bc.set(b, (bc.get(b) || 0) + 1); });
      const brands = [...bc.entries()].sort((a, b) => b[1] - a[1]);
      const bf = S.brandFilter && bc.has(S.brandFilter) ? S.brandFilter : null;
      const shown = bf ? mine.filter((g) => brandOf(g) === bf) : mine;
      const gt = (g) => { const b = brandOf(g); const miss = g.detailMissing; return `<button class="gt" data-g="${g.id}" aria-label="${esc(g.label)}">${garmentPic(g)}<span class="n">${esc(g.label)}</span><span class="m${miss ? ' miss' : ''}">${esc(miss ? `${miss} · 눌러서 채우기` : (b || `${g.colorLabel} ${g.kindName}`) + (g.trial ? ' · 체험용' : ''))}</span></button>`; };
      const tile = (inner, cls, attrs, label, d = '') => `<button class="hg ${cls}" ${attrs}><i class="${cls.includes('cand') ? 'ph-fill' : 'ph'} ph-coat-hanger" aria-hidden="true"></i><span class="tile">${inner}</span><span class="t6">${label}</span>${d}</button>`;
      const railC = cands.map((p) => { const d = delta(p.id); return tile(productPic(p.id), 'cand', `data-pid="${p.id}" aria-label="걸어 보는 중: ${esc(p.brand)} ${esc(p.name)}"`, esc(p.name), `<span class="d ${d?.tone === 'stop' ? 'stop' : ''}">${esc(d ? d.text : (needAsk(p.id) ? '한 번 물어볼게요' : '비교 중'))}</span>`); });
      const railHtml = cands.length ? `<div class="section"><div class="h"><h2 class="h3">걸어 보는 중 <span class="num acc">${cands.length}</span></h2>${cands.length >= 2 ? '<button class="quiet" data-go-compare>나란히 비교</button>' : ''}</div><div class="rail" aria-label="걸어 본 옷 레일"><span class="bar-line" aria-hidden="true"></span><div class="hgs">${railC.join('')}</div></div></div>` : '';
      const groups = [...GROUPS.map(([name, ks]) => [name, shown.filter((g) => ks.includes(g.kind))]), ['기타', shown.filter((g) => !GROUPS.some(([, ks]) => ks.includes(g.kind)))]].filter(([, items]) => items.length);
      if (!mine.length) {
        return `${top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' })}
          <h1 class="h1" style="margin-top:12px">옷장이 비어 있어요</h1>
          ${inviteHtml({ label: '가장 빠른 방법', h: '브랜드나 상품명으로 찾아서 ‘가지고 있어요’' })}
          ${railHtml}`;
      }
      return `${top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' })}
        <h1 class="h1" style="margin-top:12px">옷 <span class="num">${mine.length}</span>벌${out ? ` · 코디 <span class="num">${out}</span>가지` : ''}</h1>
        <div class="stat"><button class="c" data-tabgo="looks"><span class="k">내 옷으로 코디</span><span class="v num">${out}<small>가지</small></span><span class="go">코디 보기<i class="ph ph-caret-right"></i></span></button><button class="c" data-add-open><span class="k">옷장</span><span class="v num">${mine.length}<small>벌</small></span><span class="go">옷 넣기<i class="ph ph-plus"></i></span></button></div>
        ${st.trialCount ? `<div class="notice"><span class="grow">체험용 옷 ${st.trialCount}벌 · 내 옷이 아니에요</span><button data-mine>내리기</button></div>` : ''}
        ${received ? `<div class="notice"><span class="grow">사기로 한 옷 ${received}벌 · 받으면 기록에서 걸어요</span><button data-tabgo="records">기록</button></div>` : ''}
        ${railHtml}
        ${mine.length >= 4 ? `<section class="section"><div class="h"><h2 class="h3">최근 넣은 옷</h2></div><div class="recent">${[...mine].slice(-4).reverse().map(gt).join('')}</div></section>` : ''}
        ${brands.length ? `<section class="section"><div class="h"><h2 class="h3">모은 브랜드 <span class="t6 num">${brands.length}</span></h2>${bf ? '<button class="quiet" data-brand="">전체 보기</button>' : ''}</div><div class="chips brands">${brands.map(([b, n]) => `<button class="chip ${bf === b ? '' : 'ex'}" data-brand="${esc(b)}" aria-pressed="${bf === b}">${esc(b)} <span class="num">${n}</span></button>`).join('')}</div></section>` : ''}
        ${groups.map(([name, items]) => `<section class="section"><div class="h"><h2 class="h3">${name} <span class="t6 num">${items.length}</span></h2></div><div class="shelf">${items.map(gt).join('')}</div></section>`).join('')}`;
    },

    // 옷장 넣기: 브랜드·품명으로 찾아 ‘가지고 있어요’. 목록(이 앱이 아는 상품) 밖이면 직접 등록(브랜드·상품명·종류·색).
    add({ q = '' } = {}) {
      return `${top({ mid: `<form class="qform" id="af" role="search" style="display:flex;align-items:center"><input id="aq" style="flex:1;min-width:0" value="${esc(q)}" enterkeyhint="search" autocomplete="off" placeholder="브랜드나 상품명으로 찾기" aria-label="브랜드나 상품명"><button type="submit" class="icon" aria-label="상품 검색"><i class="ph ph-magnifying-glass"></i></button></form>` })}
        <div id="ares"></div><div id="adom"></div><div id="aopen" aria-live="polite"></div>
        <button class="row" data-reg-open style="margin-top:8px"><span class="grow"><span class="t5">목록에 없어요 → 직접 등록</span><span class="t6" style="display:block">브랜드·상품명·종류·색만 적어요</span></span><i class="ph ph-caret-right arr"></i></button>`;
    },

    // 직접 등록: 한 화면에 브랜드·상품명·종류·색·링크(선택). 사진은 받지 않는다. 넣으면 옷장에 걸리고, 같은 옷 등록 수(3명)를 센다.
    reg({ q = '' } = {}) {
      const state = Input.getSnapshot(), R = state.values;
      if (state.pending) return `${top()}<h1 class="h2">쓰던 입력이 있어요</h1><p>${esc(state.pending.type === 'ready' ? `${state.pending.value.values.brand} ${state.pending.value.values.name} · ${state.pending.value.step + 1}/3단계` : state.pending.message)}</p>${state.pending.type === 'ready' ? '<button class="btn go" data-input-restore>이어서 입력</button>' : ''}<button class="btn" data-input-restart>초안 지우고 새로 입력</button><p data-input-notice role="alert"></p>`;
      const kinds = M.kindChoices().filter((k) => PIC.includes(k.id)).sort((a, b) => PIC.indexOf(a.id) - PIC.indexOf(b.id));
      const g0 = M.getState().gender || 'M';
      const thumbColor = (kid) => ['white', 'black', 'navy', 'grey', 'indigo', 'blue', 'beige'].find((c) => K.CUT[`${g0}|${kid}|${c}`]) || 'black';
      return `${top({ mid: '<span class="sp"></span>' })}
        <h1 class="h2" style="margin-top:8px">${R.source ? '찾은 상품으로 옷장에 넣기' : '목록에 없는 옷 직접 등록'}</h1>
        ${opfNotice(R.source)}
        <p data-input-notice role="alert">${esc(state.notice)}</p>
        <form id="rf" autocomplete="off">
          <div class="field"><label for="rb">브랜드</label><input id="rb" maxlength="80" value="${esc(R.brand)}" placeholder="예: 유니클로" enterkeyhint="next"></div>
          <div class="field"><label for="rn">상품명</label><input id="rn" maxlength="80" value="${esc(R.name)}" placeholder="예: 옥스포드 슬림핏 셔츠" enterkeyhint="next"><div class="hint">${R.source ? '내 옷과 같은 상품인지 확인하고, 필요한 내용만 수정해 주세요' : '택이나 주문 내역의 이름이면 다른 사람과 같은 옷으로 모여요'}</div></div>
          <div id="rdup"></div>
          <div class="regk"><div class="label"><span>종류</span></div><div class="kinds">${kinds.map((k) => `<button type="button" data-k="${k.id}" aria-pressed="${R.kind === k.id}">${garmentPic({ kind: k.id, kindName: k.name, color: thumbColor(k.id), gender: g0 })}${esc(k.name)}</button>`).join('')}</div></div>
          <div class="regk"><div class="label"><span>색</span></div><div class="colors">${M.colorChoices().map((c) => `<button type="button" data-c="${c.id}" aria-pressed="${R.color === c.id}" aria-label="${esc(c.label)}"><i style="background:${c.hex}"></i>${esc(c.label)}</button>`).join('')}</div></div>
          <div class="field"><label for="ru">판매처 링크 <span style="font-weight:500;color:var(--ink3)">선택</span></label><input id="ru" maxlength="2000" value="${esc(R.url)}" inputmode="url" placeholder="https://" enterkeyhint="done"></div>
        </form>`;
    },

    // 코디: 내 옷으로 입을 수 있는 조합(규칙), 상황별로 보기, ‘한 벌만 더 있으면’.
    looks({ mood = '' } = {}) {
      const st = M.getState();
      const mine = st.closet;
      const head = top({ back: false, right: '<button class="icon" data-menu aria-label="더보기"><i class="ph ph-dots-three"></i></button>' });
      if (!mine.length) {
        return `${head}<h1 class="h1" style="margin-top:12px">내 옷으로 코디를 짜 드려요</h1>
          ${weatherHtml({ where: 'looks' })}`;
      }
      const avail = MOODS.map(([id, label]) => [id, label, moodAsk(label)]).filter((m) => m[2]);
      const cur = avail.find((m) => m[0] === mood) || null;
      const chips = `<div class="chips scroll moods" aria-label="상황"><button class="chip ${cur ? 'ex' : ''}" data-mood="" aria-pressed="${!cur}">내 옷 전체</button>${avail.map(([id, label]) => `<button class="chip ${cur?.[0] === id ? '' : 'ex'}" data-mood="${id}" aria-pressed="${cur?.[0] === id}">${esc(label)}</button>`).join('')}</div>`;
      if (!cur) {
        const d = M.closetOutfits({ detail: true });
        const seen = new Set(); const list = d.list.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 12);
        const sg = M.suggest({ limit: 3 });
        const sgRows = sg.basis === 'closet' ? sg.items : [];
        return `${head}${weatherHtml({ where: 'looks' })}
          <h1 class="h2" style="margin-top:28px">내 옷 ${mine.length}벌로 <span class="num">${d.total}</span>가지</h1>
          ${chips}
          ${list.length ? `<div class="lks">${list.map((o) => lookHtml(o, { sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : `<div class="empty"><h2 class="h2">아직 조합이 없어요</h2><p class="t5 sub" style="margin-top:6px">상의·하의·신발을 한 벌씩 넣으면 세어 드려요.</p><button class="btn line wide sm" data-add-open style="margin-top:12px"><i class="ph ph-plus"></i>옷 넣기</button></div>`}
          ${sgRows.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2></div>${sgRows.map((p) => sgRow(p)).join('')}</section>` : ''}`;
      }
      const r = cur[2];
      const o = r.outfit;
      const cands = o ? o.pieces.filter((x) => !x.owned && x.product) : [];
      const condText = (r.conditions || []).map((c) => c.label).join(' · ');
      return `${head}<h1 class="h1" style="margin-top:12px">${esc(cur[1])} 코디</h1>
        <p class="t5 sub" style="margin-top:4px">${o ? (o.buyCount ? `내 옷 ${o.ownedCount}벌에 한 벌만 더하면 돼요` : `내 옷 ${o.ownedCount}벌로 입을 수 있어요`) : '내 옷으로는 아직 맞는 코디 공식이 없어요'}</p>
        ${chips}
        ${o ? `<div class="lks">${lookHtml(o, { sub: esc(condText), owned: !o.buyCount })}</div>` : `<div class="empty" style="margin-top:20px"><p class="t5 sub">${esc(r.outfitNote || `${cur[1]} 조건에 맞는 코디 공식이 내 옷만으로는 아직 없어요. 조건을 풀지 않았어요.`)}</p></div>`}
        ${cands.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2></div>${cands.map((x) => sgRow(M.product(x.product.id) || x.product, `${cur[1]} 코디의 ${x.kindName} 자리`)).join('')}</section>` : ''}
        ${r.products.length ? `<button class="row" data-q="${esc(r.text)}" style="margin-top:8px"><span class="grow t5">${esc(cur[1])} 조건에 맞는 옷 ${r.products.length}개 더 보기</span><i class="ph ph-caret-right arr"></i></button>` : ''}`;
    },

    records() {
      const m = recordsModel();
      return `${top({ back: false })}
        <h1 class="h1" style="margin-top:12px">${m.decided ? `<span class="num">${m.decided}</span>벌을 정했어요` : m.holds ? `보류 <span class="num">${m.holds}</span>벌 · 아직 정하지 않았어요` : '아직 정한 옷이 없어요'}</h1>
        ${m.total ? '' : '<p class="t5 sub" style="margin-top:4px">걸어 본 옷을 살지 정하면 여기에 남아요.</p>'}
        ${m.total ? `<div class="sum"><div class="c"><div class="k">살게요</div><div class="v num">${m.buys}</div>${m.sum ? `<div class="t6 num nw" style="font-size:12px">${won(m.sum)} 수집가</div>` : ''}</div><div class="c"><div class="k">보류</div><div class="v num">${m.holds}</div></div><div class="c"><div class="k">안 살래요</div><div class="v num">${m.skips}</div></div></div>` : ''}
        ${m.waiting.length ? `<section class="section"><div class="h"><h2 class="h3">사기로 한 옷</h2></div>
          ${m.waiting.map((x) => `<div class="wait-row">${productPic(x.id)}<span class="grow"><span class="n">${esc(x.name)}</span><span class="t6">${esc(x.stageLabel)}</span></span><span class="acts">${x.next ? `<button class="btn ${x.next.keep ? 'go' : 'soft'}" data-adv="${x.id}" data-step="${x.next.step}">${esc(x.next.label)}</button>` : ''}${x.ret ? `<button class="quiet" data-ret="${x.id}">${esc(x.ret)}</button>` : ''}</span></div>`).join('')}</section>` : ''}
        <div class="tl">${m.days.map((d) => `<div class="day">${esc(d.label)}</div>${d.items.map((r) => `<button class="rec" data-pid="${r.id}">${productPic(r.id)}<span class="grow"><span class="n">${esc(r.name)}</span><span class="t6"><span class="pill ${r.buy ? 'buy' : ''}">${r.decision}</span>${r.stage ? ` ${esc(r.stage)}` : ''}</span>${r.collection ? `<span class="t6" data-record-collection>${esc(r.collection)}</span>` : ''}</span><span class="pr num">${esc(r.priceText)}</span></button>`).join('')}`).join('') || '<button class="btn soft wide" data-tabgo="home" style="margin-top:20px">옷 찾으러 가기</button>'}</div>`;
    },
  };

  // ── 화면별 동작
  const A = {
    home(params={}) {
      $('#q').oninput=()=>{params.q=$('#q').value};
      $('#sf').onsubmit = (e) => { e.preventDefault(); const q = $('#q').value.trim(); if (q) K.go('results', { q }); else $('#q').focus(); };
      wireWeather(); fadeChips();
    },
    reg() { wireReg(); },
    async results({ q, drop = [] }) {
      autoDomesticSearch(document);
      void recommendOpenProducts(q);
      $$('[data-drop]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: [...drop, b.dataset.drop] }, { replace: true }); });
      $$('[data-relax]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: JSON.parse(b.dataset.relax) }, { replace: true }); });
      fadeChips();
      const r = S.result;
      const box = $('#ai');
      if (!r?.products?.length || !box) { box?.remove(); return; }
      if (S.aiOrder[q]) return;
      const res = await AIRank.rank(q, r, { limit: 12 });
      if (!document.body.contains(box)) return;
      if (res.ok) {
        res.order.forEach((o) => { S.ai[o.id] = o; });
        S.aiOrder[q] = Object.fromEntries(res.order.map((o) => [o.id, o.rank]));
        (S.aiSummary ||= {})[q] = res.summary || '';
        const byId = Object.fromEntries(r.products.map((p) => [p.id, p]));
        const grid = $('#grid');
        const first = new Map($$('.card', grid).map((c) => [c.dataset.card, c.getBoundingClientRect()]));
        S.shown.main = res.order.map((o) => byId[o.id]).filter(Boolean);
        grid.innerHTML = gridHtml(S.shown.main);
        if (!K.reduce) $$('.card', grid).forEach((c) => { const a = first.get(c.dataset.card), b = c.getBoundingClientRect(); if (a) c.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px)` }, { transform: 'none' }], { duration: 420, easing: K.SPRING.css }); });
        box.className = 'ai'; box.innerHTML = `<i class="ph-fill ph-sparkle"></i><span>${esc(res.summary || 'AI가 후보 순서를 정했어요')}</span>`;
      } else {
        const why = AIRank.whyText(res.why);
        box.className = 'ai off'; box.innerHTML = `<i class="ph ph-info"></i><span>${esc(why)} · ${esc(r.listNote || '평점과 후기 수 순')}</span>`;
      }
    },
    detail({ id }) {
      const p = M.product(id); if (!p) return;
      drawDecision(id);
    },
    consult() {
      $('#bar').innerHTML = `<div class="chatbar"><form id="cf"><input id="cq" maxlength="400" enterkeyhint="send" autocomplete="off" placeholder="예: 베이지 니트에 어울리는 바지는?" aria-label="코디 질문"${C.busy ? ' disabled' : ''}><button aria-label="보내기"${C.busy ? ' disabled' : ''}><i class="ph ph-paper-plane-right"></i></button></form></div>`;
      $('#cf').onsubmit = (e) => { e.preventDefault(); const v = $('#cq').value; askConsult(v); };
      $$('[data-ask]').forEach((b) => { b.onclick = () => askConsult(b.dataset.ask); });
      $('[data-newchat]') && ($('[data-newchat]').onclick = () => { C.cur = null; C.busy = false; saveChat(); K.refresh(); });
      $('[data-chatlist]') && ($('[data-chatlist]').onclick = () => { C.cur = null; saveChat(); K.refresh(); });
      $$('[data-thread]').forEach((b) => { b.onclick = () => { C.cur = b.dataset.thread; saveChat(); K.refresh(); }; });
      $$('[data-delthread]').forEach((b) => { b.onclick = () => { const th = C.threads.find((x) => x.id === b.dataset.delthread); confirmSheet(`‘${th?.title || ''}’ 상담을 지울까요?`, '지우면 되돌릴 수 없어요.', '지우기', () => { delThread(b.dataset.delthread); K.refresh(); }); }; });
      $('[data-delall]') && ($('[data-delall]').onclick = () => confirmSheet(`상담 ${C.threads.length}개를 모두 지울까요?`, '지우면 되돌릴 수 없어요.', '모두 지우기', () => { C.threads = []; C.cur = null; saveChat(); K.refresh(); }));
      requestAnimationFrame(() => { if (C.turns.length) scrollTo(0, document.documentElement.scrollHeight); });
    },
    compare() {
      const b = $('[data-sametog]'); if (!b) return;
      b.onclick = () => { const on = $('#cmp').classList.toggle('showsame'); b.setAttribute('aria-expanded', on); b.innerHTML = `<i class="ph ph-caret-${on ? 'up' : 'down'}"></i>같은 항목 ${$$('#cmp tr.same').length}개 ${on ? '접기' : '보기'}`; };
    },
    closet() {
      $('#bar').innerHTML = '<div class="pinbar"><div class="in"><button class="btn go wide" data-add-open><i class="ph ph-plus"></i>옷 넣기</button></div></div>';
      $$('[data-g]').forEach((b) => { b.onclick = () => garmentSheet(b.dataset.g); });
      $$('[data-brand]').forEach((b) => { b.onclick = () => { S.brandFilter = S.brandFilter === b.dataset.brand ? null : b.dataset.brand || null; const y = scrollY; K.refresh(); requestAnimationFrame(() => scrollTo(0, y)); }; });
    },
    looks() { fadeChips(); wireWeather(); $$('[data-mood]').forEach((b) => { b.onclick = () => K.tab('looks', { mood: b.dataset.mood }); }); },
    add({ q = '' } = {}) {
      drawShelf();
      const inp = $('#aq');
      let t;
      const run = (submitted = false) => renderAddResults(inp.value, { submitted });
      inp.oninput = () => { clearTimeout(t); t = setTimeout(() => run(false), 120); };
      $('#af').onsubmit = (e) => { e.preventDefault(); clearTimeout(t); run(true); inp.blur(); };
      run(Boolean(q));
      if (!q) setTimeout(() => inp.focus(), 60);
    },
    records() {
      $$('[data-adv]').forEach((b) => { b.onclick = () => { try { M.advance(b.dataset.adv, b.dataset.step); K.refresh(); } catch (e) { K.toast(e.message, { bottom: 48 + ($('#strip').hidden ? 0 : 34) + 12 }); } }; });
      $$('[data-ret]').forEach((b) => { b.onclick = () => returnSheet(b.dataset.ret); });
    },
  };

  // 반품 기록: 엔진이 사유를 요구한다(사이즈·색·품질·마음 바뀜·기타). 기록하면 옷장에서 내려가고 같은 상품의 다음 판정에 주의로 남는다.
  const RETURN_REASONS = [['size', '사이즈가 안 맞아요'], ['color', '색이 달라요'], ['quality', '품질이 아쉬워요'], ['change-of-mind', '마음이 바뀌었어요'], ['other', '그 밖의 이유']];
  function returnSheet(id) {
    const p = M.product(id); if (!p || $('.sheet')) return;
    chromeSheet('return', { name: p.name, reasons: RETURN_REASONS, onPick: (reason) => {
      try { M.advance(id, 'returned', { reason }); } catch (e) { K.toast(e.message, { bottom: 48 + 12 }); return false; }
      return () => { K.refresh(); K.toast('반품으로 기록했어요 · 옷장에서 내렸어요', { bottom: 48 + ($('#strip').hidden ? 0 : 34) + 12 }); };
    } }, () => {
    const sh = sheet(`<h2 class="h2">${esc(p.name)} · 왜 반품했어요?</h2><p class="sub t6">기록하면 옷장에서 내려가고, 같은 상품을 다시 볼 때 알려 드려요. 확인된 거래가 아니라 직접 남기는 기록이에요.</p><div class="decs">${RETURN_REASONS.map(([k, l]) => `<button class="btn soft" data-reason="${k}">${l}</button>`).join('')}</div>`);
    $$('[data-reason]', sh.s).forEach((b) => { b.onclick = async () => { try { M.advance(id, 'returned', { reason: b.dataset.reason }); } catch (e) { K.toast(e.message, { bottom: 48 + 12 }); return; } await sh.close(); K.refresh(); K.toast('반품으로 기록했어요 · 옷장에서 내렸어요', { bottom: 48 + ($('#strip').hidden ? 0 : 34) + 12 }); }; });
    });
  }
  // ── 상세의 결정: 주 행동은 '판매처에서 사기' 하나. 돌아오면 묻고, 아직이면 조용한 글자 버튼으로 남긴다.
  // 아래 바 한 줄: 결정 전에는 가격·수집가와 조용한 '보류 · 안 살래요', 결정 뒤에는 상태 한 줄과 '바꾸기'. 말풍선은 띄우지 않는다.
  // 상세 아래 바의 내용(WO-04): 바닐라 바와 React 바가 같은 값을 그린다.
  function decisionModel(id) {
    const p = M.product(id); if (!p) return null;
    const rec = p.verdict.record;
    const dec = rec?.decision || null;
    return {
      id, url: p.url, decided: !!dec, priceText: p.priceText, priceShort: p.priceShort, store: M.newVsUsed(id).fresh.store,
      status: dec ? `${DEC[dec]}로 남겼어요${rec.stage !== 'candidate' ? ` · ${rec.stageLabel}` : dec === 'buy' ? ' · 주문·도착은 기록에서' : ''}` : '',
      canChange: !!dec && rec.stage === 'candidate',
      canReturn: !!dec && rec.stage === 'kept' && (rec.next || []).some((n) => n.step === 'returned'),
    };
  }
  function drawDecision(id) {
    if (detailUnmount) { detailCtl.changed(); return; }
    const p = M.product(id); if (!p) return;
    const m = decisionModel(id);
    const meta = m.decided
      ? `<span class="fb" role="status"><i class="ph-fill ph-check-circle"></i><span class="nt" style="color:inherit">${esc(m.status)}</span></span><span class="qs">${m.canChange ? '<button class="quiet" data-redecide>바꾸기</button>' : `${m.canReturn ? `<button class="quiet" data-ret="${esc(id)}">반품했어요</button>` : ''}<button class="quiet" data-tabgo="records">기록</button>`}</span>`
      : `<span class="pr"><b class="num">${esc(m.priceText)}</b><span class="nt">${esc(m.priceShort)} · ${esc(m.store)}</span></span><span class="qs"><button class="quiet" data-dec="hold">보류</button><button class="quiet" data-dec="skip">안 살래요</button></span>`;
    $('#bar').innerHTML = `<div class="buybar"><div class="in"><div class="meta">${meta}</div>
      <a class="btn go wide" href="${esc(p.url)}" target="_blank" rel="noopener" data-seller="${id}">판매처에서 사기<i class="ph ph-arrow-up-right"></i></a></div></div>`;
    $$('[data-dec]').forEach((b) => { b.onclick = () => decide(id, b.dataset.dec); });
    $('[data-redecide]') && ($('[data-redecide]').onclick = () => decisionSheet(id, { title: '어떻게 할까요?' }));
    $('#bar [data-ret]') && ($('#bar [data-ret]').onclick = () => returnSheet(id)); // 계속 입기로 한 뒤에도 반품을 남길 수 있게
    $('[data-seller]').onclick = () => { S.pending = { id, t: Date.now() }; };
  }
  function decide(id, dec) {
    const rec = M.product(id)?.verdict.record;
    if (rec && rec.stage !== 'candidate') return;
    if (dec === 'clear') M.removeRecord(id); else M.decide(id, dec);
    drawDecision(id);
  }
  function decisionSheet(id, { title = '판매처에서 돌아왔어요 · 어떻게 하셨어요?' } = {}) {
    const p = M.product(id); if (!p) return;
    if ($('.sheet')) return;
    const has = !!p.verdict.record?.decision;
    chromeSheet('decision', { title, sub: `${p.brand} ${p.name} · ${p.priceText}`, has, onPick: (d) => () => { if (d) decide(id, d); } }, () => {
    const sh = sheet(`<h2 class="h2">${esc(title)}</h2><p class="t6 sub">${esc(p.brand)} ${esc(p.name)} · ${esc(p.priceText)}</p>
      <div class="decs"><button class="btn go" data-d="buy"><i class="ph ph-check"></i>샀어요</button><button class="btn soft" data-d="hold">보류</button><button class="btn soft" data-d="skip">안 살래요</button>${has ? '<button class="btn line" data-d="clear">기록 지우기</button>' : ''}<button class="quiet" data-d="" style="justify-content:center;width:100%">${has ? '그대로 둘게요' : '아직 보는 중이에요'}</button></div>`);
    $$('[data-d]', sh.s).forEach((b) => { b.onclick = async () => { await sh.close(); if (b.dataset.d) decide(id, b.dataset.d); }; });
    });
  }
  // 판매처에서 돌아왔을 때(탭이 다시 보이거나 창이 다시 초점을 받으면) 한 번 묻는다.
  const onReturn = () => {
    const pd = S.pending; if (!pd) return;
    if (document.visibilityState !== 'visible') return;
    const dt = Date.now() - pd.t;
    if (dt < 700) return;
    if (dt > 30 * 60 * 1000 || curView !== 'detail' || curParams.id !== pd.id) { S.pending = null; return; }
    S.pending = null;
    setTimeout(() => { if (curView === 'detail' && curParams.id === pd.id && !M.product(pd.id)?.verdict.record?.decision) decisionSheet(pd.id); }, 300);
  };
  document.addEventListener('visibilitychange', onReturn);
  addEventListener('focus', onReturn);
  addEventListener('pageshow', onReturn);

  // ── 공통 이벤트(한 번만 건다)
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-back],[data-mirror],[data-measure],[data-collection],[data-pid],[data-tabgo],[data-menu],[data-q],[data-hang],[data-unhang],[data-go-compare],[data-zoom],[data-addlike],[data-disclose],[data-own],[data-edit],[data-add-open],[data-add-q],[data-addkind],[data-addphoto],[data-own-add],[data-trial],[data-mine],[data-reg-open],[data-crowd-add],[data-rakuten-search],[data-rakuten-plan],[data-adpick-search]');
    if (!t) return;
    if (t.hasAttribute('data-back')) K.back(curView==='add'?{view:'closet',params:{}}:curView==='mirror'?(curParams.id?{view:'detail',params:{id:curParams.id}}:{view:'closet',params:{}}):curView === 'collection' ? (curParams.id?{view:'detail',params:{id:curParams.id}}:{view:'closet',params:{}}) : curView === 'measure' ? {view:'detail',params:{id:curParams.id}} : curView === 'detail' ? {view:'home',params:{}} : null);
    else if(t.hasAttribute('data-mirror')) K.go('mirror',t.dataset.mirror?{id:t.dataset.mirror}:{});
    else if (t.hasAttribute('data-collection')) K.go('collection',t.dataset.collection?{id:t.dataset.collection}:{});
    else if (t.hasAttribute('data-measure')) K.go('measure',{id:t.dataset.measure});
    else if (t.hasAttribute('data-rakuten-search')) searchRakuten(t);
    else if (t.hasAttribute('data-rakuten-plan')) planRakuten(t);
    else if (t.hasAttribute('data-adpick-search')) searchAdpick(t);
    else if (t.hasAttribute('data-add-open')) K.go('add', {});
    else if (t.hasAttribute('data-add-q')) K.go('add', { q: t.dataset.addQ });
    else if (t.hasAttribute('data-reg-open')) { Input.reset(); K.go('reg', { q: t.dataset.regQ || '' }); }
    else if (t.dataset.crowdAdd) crowdAdd(t.dataset.crowdAdd, t);
    else if (t.hasAttribute('data-addkind')) addFlow();
    else if (t.hasAttribute('data-addphoto')) K.go('photoadd', {});
    else if (t.dataset.ownAdd) ownAdd(t.dataset.ownAdd, t);
    else if (t.hasAttribute('data-trial')) { M.loadTrialCloset(); K.refresh(); }
    else if (t.hasAttribute('data-mine')) { M.clearTrialCloset(); K.refresh(); }
    else if (t.dataset.hang) toggleHang(t.dataset.hang, t);
    else if (t.dataset.own) answerOwn(t.dataset.for, t.dataset.own === 'yes');
    else if (t.dataset.unhang) { M.compareRemove(t.dataset.unhang); K.refresh(); }
    else if (t.dataset.pid) K.go('detail', { id: t.dataset.pid });

    const showText = (text) => { ta.hidden = false; ta.value = text; ta.focus(); ta.select(); };
    const makeText = () => { try { return JSON.stringify(BK.make()); } catch (e) { msg(e.message); return null; } };
    $('[data-bk-save]', sh.s).onclick = async () => {
      const text = makeText(); if (text === null) return; const name = `closet-backup-${BK.stamp()}.json`; // 파일 이름은 영문으로: 일부 브라우저가 한글 이름을 'download'로 바꾼다
      try {
        const file = new File([text], name, { type: 'application/json' });
        if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); msg('공유 창에서 파일에 저장하거나 다른 기기로 보내세요.'); return; }
      } catch (e) { if (e?.name === 'AbortError') return; }
      try {
        const url = URL.createObjectURL(new Blob([text], { type: 'application/json' })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
        msg(`${name} 파일을 내보냈어요. 아이폰은 파일 앱의 다운로드 폴더에 저장돼요.`);
      } catch { showText(text); msg('내려받기가 막혀 글자로 보여 드려요. 전체 선택해 복사해 두세요.'); }

    const preview = (text) => {

        catch (e) { if (e.code === 'partial' || e.code === 'pending') { await sh.close(); backupSheet(e.message); } else msg(e.message); return; }

        msg(`복원했어요. 원문 ${new Set([...BK.lastReport.archives, ...BK.lastReport.archivedCurrent].map(a => a.key)).size}개 보관 · 기존 활성 자료 ${BK.lastReport.preserved.length}개 유지. 다시 불러와요.`);
        setTimeout(() => location.reload(), 300);

      msg('');
    };
    $('#bkfile', sh.s).onchange = async (e) => { const f = e.target.files?.[0]; const token = ++textSelection; msg(''); pv.hidden = true; pv.replaceChildren(); photoPanel?.invalidatePreview(); if (!f) return; if (new TextDecoder().decode(await f.slice(0,8).arrayBuffer()) === 'EOULPH01') { const panel = await photoPanelReady; if (token !== textSelection) return; if (panel?.previewFile) await panel.previewFile(f); else msg('사진 백업 화면을 열지 못했어요. 앱을 갱신한 뒤 다시 열어 주세요.'); return; } if (f.size > BK.MAX_BYTES) { if (token === textSelection) msg('파일이 너무 커요(5MB 초과).'); return; } const r = new FileReader(); r.onload = () => { if (token === textSelection) preview(String(r.result || '')); }; r.onerror = () => { if (token === textSelection) msg('파일을 읽지 못했어요.'); }; r.readAsText(f); };
    $('[data-bk-paste]', sh.s).onclick = () => { textSelection++; photoPanel?.invalidatePreview(); pv.replaceChildren(); ta.hidden = false; ta.value = ''; ta.placeholder = '백업 글자를 붙여 넣으세요'; ta.focus(); pv.hidden = false; pv.innerHTML = '<button class="btn line wide" data-bk-read>붙여 넣은 글자 확인</button>'; $('[data-bk-read]', pv).onclick = () => preview(ta.value); };
    if (window.EOUL_PHOTO_LOAD && !M.boot?.preview) photoPanelReady = window.EOUL_PHOTO_LOAD().then(({ mountPhotoBackup }) => { if (!sh.s.isConnected) return; return mountPhotoBackup({ element: $('.bk', sh.s), namespace: window.EOUL_MOCK_KEY, core: M, storage: localStorage, textBackup: BK, undoButton: $('[data-bk-undo]', sh.s), isBusy: () => C.busy || !!S.asking, setBusy: value => { photoBusy = value; }, onSelect: () => { textSelection++; msg(''); pv.hidden = true; pv.replaceChildren(); }, onState: () => storageNotice(), reload: () => { Input.reset(); M.reloadSaved(); K.refresh(); storageNotice(); location.reload(); } }); }).then(panel => { photoPanel = panel; return panel; }).catch(error => msg(`사진 보관함을 열지 못했어요. ${error.message}`));
    if (note) msg(note);
    const un = $('[data-bk-undo]', sh.s); if (un) un.onclick = async () => { try { await M.withStorageLock(() => BK.undo()); } catch (e) { msg(e.message); return; } msg('복원 전으로 되돌렸어요. 다시 불러와요.'); setTimeout(() => location.reload(), 300); };
  }
  function menu() {
    const theme = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
    const reset = () => { K.reset(); S.ai = {}; S.aiOrder = {}; S.asking = null; S.ui = { absent: {} }; saveUi(); REG.items = {}; REG.catalog = {}; saveReg(); WX.idx = {}; WX.day = 'today'; };

  const r0 = M.route.current();
  // Direct closet entry must not render the home example first: its M.ask
  // would otherwise persist an example query as a new personal recent search.
  K.start(render, { view: !M.boot?.q && r0.path === '/add' ? 'add' : !M.boot?.q && r0.path === '/mirror' ? 'mirror' : !M.boot?.q && r0.path === '/looks' ? 'looks' : !M.boot?.q && r0.path === '/community' ? 'community' : !M.boot?.q && r0.path === '/photoadd' ? 'photoadd' : !M.boot?.q && r0.path === '/collection' ? 'collection' : !M.boot?.q && r0.path === '/measure' && r0.params.id ? 'measure' : r0.path === '/closet' && !M.boot?.q ? 'closet' : 'home', params: ['/measure','/collection','/mirror'].includes(r0.path) ? (r0.params.id?{id:r0.params.id}:{}) : {} });
  // 저장소 문제는 잠깐 뜨는 안내가 아니라 해결될 때까지 남는 알림으로 보여 준다.
  // 안내 내용은 부를 때의 상태로 고정한다(원문도 그때 값). 바닐라와 React가 같은 모델을 쓴다.
  function storageModel() {
    let photoPending = false; try { photoPending = localStorage.getItem('eoul-backup:photos-pending') != null; } catch {}
    const core = M.storageIssue?.() || null;
    if (!core && regRaw === null) return null;
    const raws = [];
    noticeRaw = {};
    if (core?.code === 'storage_unreadable') { raws.push({ name: 'closet', label: '옷장' }); noticeRaw.closet = M.unreadableRaw(); }
    if (regRaw) { raws.push({ name: 'brand-link', label: '브랜드·링크' }); noticeRaw['brand-link'] = regRaw; }
    const lines = [photoPending ? '사진 백업 복구가 남아 있어 저장을 멈췄어요. 전체 백업 화면에서 복구해 주세요.' : '', core?.code === 'photo_recovery_pending' ? '' : core?.message, regRaw !== null ? REG_UNREADABLE : ''].filter(Boolean);
    return { lines, raws, fresh: raws.length > 0 && !photoPending };
  }
  const noticeHost = {
    backup: () => backupSheet(),
    download(name) {
      const text = noticeRaw[name];
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = `eoul-${name}-unreadable-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    fresh() {
      try {
        if (M.storageIssue?.()?.code === 'storage_unreadable') M.startFresh();
        if (regRaw !== null) startFreshReg();
        K.toast('원문은 이 기기에 따로 보관했어요. 새로 시작합니다.', { bottom: 128 });
      } catch (error) { K.toast(error.message, { bottom: 128 }); }
      K.refresh(); storageNotice();
    },
  };
  const storageNotice = () => {
    if (!chromeMounted) document.getElementById('eo-storage-issue')?.remove();
    let photoPending = false; try { photoPending = localStorage.getItem('eoul-backup:photos-pending') != null; } catch {}

    const model = storageModel();
    if (chromeMounted) { chromeState.notice = model && { gen: ++noticeGen, ...model }; chromeCtl.changed(); return !!model; }
    if (!model) return false;

    el.id = 'eo-storage-issue'; el.setAttribute('role', 'alert');

    const button = (text, onclick) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = text; b.style.cssText = 'min-height:40px;padding:0 12px;border:0;border-radius:10px;background:#3d2600;color:#fff;font:600 13px system-ui,sans-serif'; b.onclick = onclick; bar.append(b); return b; };

    return true;
  };
  window.addEventListener('eoul-registration-status',storageNotice);
  M.subscribe(() => { if (document.getElementById('eo-storage-issue') || M.storageIssue?.()) storageNotice(); });
  if (!storageNotice() && M.boot?.storageError) K.toast(M.boot.storageError, { bottom: 128 });
  // 공통 틀 섬(WO-08b). ?ui=vanilla이거나 불러오지 못하면 위의 바닐라 탭·띠·알림·안내를 그대로 쓴다.

  }
  if (M.boot?.q) K.go('results', { q: M.boot.q });
  else if (/^\/p\/.+/.test(r0.path)) K.go('detail', { id: r0.path.slice(3) });

  else if (['/records', '/consult', '/looks'].includes(r0.path)) K.tab(r0.path.slice(1));

  else if (r0.path === '/compare') K.go('compare', {});
