<script>
/* 디자인 설정(hangit:look)은 화면 설정이라 'eoul-' 접두사를 쓰지 않는다(백업 대상 아님). */
// WO-11: 새 디자인(v2)이 기본이다(10-27 21:55 대표 결정). ?look=v1이나 메뉴 '이전 디자인으로 보기'는
// 이 기기에서 이전 디자인으로 되돌리고(hangit:look = v1), ?look=v2나 '새 디자인으로 보기'는 다시 기본으로.
// 미리보기(?preview=1)는 이 기기 저장소를 읽거나 쓰지 않는다: ?look=v1은 그 페이지에만 적용한다.
(function () { var v1 = false; try { var sp = new URLSearchParams(location.search), lq = sp.get('look'); if (sp.get('preview') === '1') v1 = lq === 'v1'; else { if (lq === 'v1') localStorage.setItem('hangit:look', 'v1'); else if (lq === 'v2') localStorage.removeItem('hangit:look'); v1 = localStorage.getItem('hangit:look') === 'v1'; } } catch (e) {} if (!v1) document.documentElement.dataset.look = 'v2'; })();
</script>
<style>
/* 걸어 보고 사기(d12): 장바구니 대신 '걸어 보기'. 레일은 옷걸이 탭에만 있고, 다른 화면에는 걸린 옷이 있을 때만 한 줄 띠가 보인다.
   강조색은 가격표(택)의 주황 하나. 글자 단계 30 · 22 · 17 · 15 · 13. 고정 영역: 위 44 + 띠 34 + 탭 48 = 126px(844px의 14.9%). */
:root {
  --bg: #fbfbfa; --surface: #ffffff; --well: #f0f0ed; --tile: #ededea; --ptile: #efefec;
  --ink: #1b1b19; --ink2: #55554f; --ink3: #7c7c75; --line: #e2e2de;
  --brand: #5b3a24;
  --acc: #e4571e; --acc-text: #b23c0b; --acc-soft: #fdebe2; --btn-bg: #c94612; --btn-fg: #ffffff;
  --dim: rgba(0, 0, 0, .45); --shadow: 0 10px 28px rgba(40, 30, 20, .12);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --tile-on-well: #ffffff;
  --r: 14px; --gutL: max(16px, env(safe-area-inset-left, 0px)); --gutR: max(16px, env(safe-area-inset-right, 0px));
  --top: 44px; --tabs: 48px; --strip: 34px; --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141412; --surface: #1c1c19; --well: #252521; --tile: #2b2b27; --ptile: #e6e6e2;
  --ink: #f3f3ef; --ink2: #c8c8c0; --ink3: #9a9a92; --line: #31312c;
  --brand: #c4996b;
  --acc: #ff6b2c; --acc-text: #ff9a6b; --acc-soft: #3a2116; --btn-bg: #ff7a3d; --btn-fg: #1b0c05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); --tile-on-well: #e6e6e2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1c1c19; --well: #252521; --tile: #2b2b27; --ptile: #e6e6e2;
  --ink: #f3f3ef; --ink2: #c8c8c0; --ink3: #9a9a92; --line: #31312c;
  --brand: #c4996b;
  --acc: #ff6b2c; --acc-text: #ff9a6b; --acc-soft: #3a2116; --btn-bg: #ff7a3d; --btn-fg: #1b0c05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); --tile-on-well: #e6e6e2; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 400 16px/1.55 var(--font); letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; --k-font: var(--font); --k-toast-bg: var(--ink); --k-toast-fg: var(--bg); --k-info-bg: var(--surface); --k-info-fg: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.ph, .ph-fill { line-height: 1; }
.num { font-variant-numeric: tabular-nums; }
.nw { white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; padding: 0 var(--gutR) calc(var(--tabs) + 24px + var(--sab)) var(--gutL); }
.app.strip-on { padding-bottom: calc(var(--tabs) + var(--strip) + 24px + var(--sab)); }
.app.bar { padding-bottom: calc(112px + var(--sab)); }
.app.chat { padding-bottom: calc(var(--tabs) + 84px + var(--sab)); }
.app.pin { padding-bottom: calc(var(--tabs) + 88px + var(--sab)); }
.app.addv { padding-bottom: calc(96px + var(--sab)); }
.view { animation: in 240ms ease-out both; }
.view.back { animation-name: inback; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes inback { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.h1 { font-size: 30px; line-height: 38px; font-weight: 800; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.h2 { font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.h3 { font-size: 17px; line-height: 25px; font-weight: 700; margin: 0; }
.t5 { font-size: 15px; line-height: 22px; }
.t6 { font-size: 13px; line-height: 19px; color: var(--ink3); }
.sub { color: var(--ink2); }
.acc { color: var(--acc-text); }

/* 위쪽 막대(44px). 결과에서는 내리면 숨고 올리면 나온다. */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; height: var(--top); display: flex; align-items: center; gap: 2px; margin: 0 -6px; background: var(--bg); box-shadow: 22px 0 0 var(--bg), -22px 0 0 var(--bg); transition: transform 200ms ease; }
.top.hide { transform: translateY(-110%); }
.top .sp { flex: 1; }
.icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--ink); flex: none; }
.icon.quiet-i { font-size: 20px; color: var(--ink3); margin-left: -6px; }
.icon.quiet-i.end { margin-left: 0; }
.icon:active { background: var(--well); }
.mark { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.mark i { color: var(--acc); font-size: 22px; }
.mark .wm { display: block; height: 26px; width: auto; }
.wm .wm-h { stroke: currentColor; }
.wm .wm-i { stroke: var(--brand); }
.qbox { flex: 1; min-width: 0; height: 36px; margin: 0 6px 0 2px; border-radius: 10px; background: var(--well); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 600; text-align: left; }
.qbox i { font-size: 18px; color: var(--ink3); flex: none; }
.qbox span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink2); }
.tbtn i { font-size: 18px; }

/* 버튼 */
.btn { min-height: 52px; padding: 0 18px; border-radius: var(--r); font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 120ms ease; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.go { background: var(--btn-bg); color: var(--btn-fg); }
.btn.soft { background: var(--well); color: var(--ink); }
.btn.line { border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; border-radius: 12px; }
.quiet { min-height: 44px; min-width: 44px; padding: 0 4px; margin: 0 -4px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); white-space: nowrap; }

/* 아래 탭(48px) */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding-bottom: var(--sab); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { height: var(--tabs); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--ink3); white-space: nowrap; }
.tabs button i { font-size: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }

/* 걸린 옷 띠(34px): 걸린 옷이 있을 때만, 탭 위 한 줄. 누르면 옷걸이 탭. */
.strip { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabs) + var(--sab)); height: var(--strip); background: var(--ink); color: var(--bg); display: block; width: 100%; }
.strip .in { max-width: 560px; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 var(--gutR) 0 var(--gutL); font-size: 13px; font-weight: 700; }
.strip .in i { font-size: 18px; color: var(--acc); flex: none; }
.strip .in .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.strip .in .go { flex: none; display: inline-flex; align-items: center; gap: 2px; font-weight: 600; opacity: .8; }
.strip .in .go i { font-size: 14px; color: inherit; }
.strip.pop { animation: strip-in 320ms var(--spring, ease) both; }
@keyframes strip-in { from { transform: translateY(100%); } to { transform: none; } }

/* 사진: 모든 상품 칸은 3:4, 같은 밝은 바탕. 흰 배경 단독 사진은 바탕에 녹이고(multiply), 모델 사진은 채운다. */
.ph-box { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; background: var(--ptile); overflow: hidden; display: grid; place-items: center; }
.ph-box img { display: block; }
.ph-box img.cover { width: 100%; height: 100%; object-fit: cover; }
.ph-box img.flat { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
.ph-box .eo-ph, .ph-box .eo-tile { position: absolute; inset: 0; aspect-ratio: auto !important; border-radius: 0 !important; }
.ph-box .swatch { position: absolute; inset: 0; display: grid; place-items: center; }
.ph-box .swatch i { width: 46%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.ph-box .tag { position: absolute; left: 6px; top: 6px; max-width: calc(100% - 56px); height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(27, 27, 25, .82); color: #fff; }
.ph-box .tag.go { background: var(--btn-bg); color: var(--btn-fg); }
.ph-box .tag.ok { background: rgba(255, 255, 255, .92); color: #1b1b19; }
.hslot .rank { position: absolute; left: 6px; bottom: 6px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; background: rgba(27, 27, 25, .82); color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; pointer-events: none; }
.hslot .rank i { font-size: 12px; color: var(--acc); }
/* 걸기 토글: 사진 모서리의 옷걸이. 누르는 곳은 44px, 보이는 동그라미는 32px. */
.hangt { position: absolute; right: 0; top: 0; width: 44px; height: 44px; display: grid; place-items: center; }
.hangt span { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .92); color: #1b1b19; display: grid; place-items: center; font-size: 19px; box-shadow: 0 1px 4px rgba(0, 0, 0, .14); transition: transform 160ms var(--spring, ease), background 160ms ease; }
.hangt[aria-pressed="true"] span { background: var(--btn-bg); color: var(--btn-fg); }
.hangt.pop span { animation: pop 420ms var(--spring, ease); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
.hangt.big { width: 56px; height: 56px; right: 4px; top: 4px; }
.hslot { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 3 / 4; pointer-events: none; }
.hslot > * { pointer-events: auto; }
.strip[hidden], .tabs[hidden] { display: none; }
.pdp-photo .zoomb { display: grid; place-items: center; }
.hangt.big span { width: 44px; height: 44px; font-size: 24px; }

/* 홈 */
.hero { margin-top: 16px; }
.ask { margin-top: 16px; display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; height: 56px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); padding: 0 16px; font-size: 17px; outline: none; }
.ask input:focus { border-color: var(--acc); }
.ask input::placeholder { color: var(--ink3); }
.ask button { width: 56px; height: 56px; border-radius: var(--r); background: var(--btn-bg); color: var(--btn-fg); display: grid; place-items: center; font-size: 24px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--gutL)); margin-right: calc(-1 * var(--gutR)); padding: 0 var(--gutR) 0 var(--gutL); }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll::after { content: ""; flex: none; width: 28px; }
.chips.scroll.fade { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
.chip { min-height: 38px; padding: 0 13px; border-radius: 999px; background: var(--well); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); white-space: nowrap; flex: none; }
.chip i { font-size: 14px; color: var(--ink3); }
.chip.ex { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--bg); }
.section { margin-top: 24px; }
.section > .h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section > .h .h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proof { margin-top: 24px; padding: 16px; border-radius: 18px; background: var(--well); }
.proof .label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.proof .label i { font-size: 16px; color: var(--acc-text); }
.proof .h3 { margin-top: 4px; }
.prow { width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); text-align: left; }
.prow:first-of-type { border-top: 0; }
.prow .ph-box { width: 56px; flex: none; border-radius: 8px; }
.prow .grow { flex: 1; min-width: 0; }
.prow .n { font-size: 14px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.prow .d { font-size: 13px; line-height: 18px; font-weight: 700; color: var(--acc-text); display: block; }
.prow .n { white-space: normal; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.prow .d.stop { color: var(--ink2); }
.prow .arr { color: var(--ink3); font-size: 18px; flex: none; }
.demo { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; margin-top: 12px; }
.demo .ths { display: flex; gap: 6px; flex-wrap: wrap; }
.demo .ths .ph-box { width: 40px; border-radius: 7px; }
.demo .cap { margin-top: 8px; font-size: 13px; line-height: 18px; color: var(--ink2); }

/* 오늘 날씨 코디(R17): 첫 화면 맨 위. 기온 한 줄 → 사진 네 장 → 이유 한 줄. 설명문은 ⓘ에만. */
.wx { margin-top: 12px; padding: 14px 16px 12px; border-radius: 20px; background: var(--well); }
.wx .wx-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; margin-top: 2px; }
.wx .wx-t { font-size: 22px; line-height: 30px; font-weight: 800; letter-spacing: -.025em; min-width: 0; }
.wx .wx-days { display: inline-flex; flex: none; border-radius: 999px; background: var(--surface); margin: -6px -6px -6px 0; }
.wx .wx-place { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; margin: -12px 0; padding: 0 4px; font: inherit; color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.chips.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.wx .wx-day { min-height: 44px; min-width: 48px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--ink3); }
.wx .wx-day[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.wx .wx-band { margin-top: 2px; font-size: 15px; line-height: 22px; color: var(--ink2); }
.wx .wx-band b { color: var(--ink); }
.wx .wx-note { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--ink2); display: flex; gap: 6px; }
.wx .wx-note i { font-size: 17px; flex: none; color: var(--ink3); margin-top: 1px; }
.wx .wx-ps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.wx .wx-ps .p1 { min-width: 0; }
.wx .wx-ps .ph-box { border-radius: 10px; background: var(--tile-on-well); }
.wx .wx-ps .t6 { margin-top: 5px; font-size: 12px; line-height: 16px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wx .wx-why { margin: 10px 0 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--acc-text); display: flex; gap: 6px; }
.wx .wx-why i { font-size: 18px; flex: none; }
.wx .wx-ac { display: flex; align-items: center; gap: 14px; margin-top: 2px; flex-wrap: wrap; }
.wx .wx-ac .quiet { text-decoration: none; }
.wx .wx-ac .quiet i { font-size: 16px; }
.wx .wx-miss { margin-top: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
.wx .wx-miss .h3 { font-size: 15px; line-height: 22px; }
.wx .wx-miss .wx-mg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.wx .wx-miss .wx-mg .ph-box { background: var(--tile-on-well); }
.wx .wx-miss .wx-mg .card .n { -webkit-line-clamp: 1; }
.wx .wx-miss .wx-mg .card .p { font-size: 14px; white-space: normal; }
.wx .wx-miss .wx-mg .card .p small { display: block; margin-left: 0; line-height: 16px; }
.wx .wx-miss .quiet { text-decoration: none; }
.wx .wx-ex { display: flex; flex-direction: column; align-items: stretch; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.wx .wx-ex .t6 { font-size: 12px; font-weight: 700; }
.wx .wx-ex .chips.scroll { min-width: 0; margin: 0 -16px; padding: 0 16px; height: 44px; }
.wx .wx-ex .chips.scroll::after { width: 8px; }
.wx .wx-ex .chips .chip { min-height: 44px; padding: 0 12px; font-size: 13px; background: var(--surface); }
.wx .wx-ex .chips .chip.on { background: var(--ink); color: var(--bg); }
.wx .wx-invite { margin-top: 2px; }
.wx .wx-invite .h3 { margin-top: 4px; }
.wx .wx-invite .btns { display: flex; gap: 8px; margin-top: 12px; }
.wx .wx-invite .btns .btn { flex: 1; min-height: 46px; font-size: 15px; padding: 0 10px; }
.wx .label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; align-items: center; gap: 6px; min-height: 32px; }
.wx .label > i { font-size: 16px; color: var(--acc-text); }
.wx .label .sp { flex: 1; }
.wx .wx-wait { display: flex; align-items: center; gap: 8px; min-height: 44px; color: var(--ink2); font-size: 14px; }
.wx .wx-wait i { animation: spin 1.2s linear infinite; }

/* 직접 등록(목록에 없는 옷): 한 화면, 브랜드·상품명·종류·색·링크(선택). 사진은 받지 않는다. */
.field { margin-top: 14px; }
.field label { display: block; font-size: 13px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }

.regbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding: 10px var(--gutR) calc(10px + var(--sab)) var(--gutL); }
.regbar .in { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }

.crowd { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--acc-soft); font-size: 14px; line-height: 20px; display: flex; gap: 8px; align-items: flex-start; }

/* 결과: 무신사 밀도. 2열, 3:4 사진, 글 3줄. 카드마다 이유는 없고(위에 한 줄 총평), 걸기는 사진 모서리 토글. */
.chips.scroll { margin-top: 8px; height: 36px; overflow-y: hidden; align-items: center; }
.chips.scroll .chip { min-height: 36px; }
.chips.scroll .cnt { flex: none; font-size: 13px; color: var(--ink3); white-space: nowrap; padding-right: 2px; }
.ai { margin-top: 8px; min-height: 34px; padding: 7px 12px; border-radius: 10px; background: var(--acc-soft); color: var(--ink); font-size: 13px; line-height: 18px; display: flex; gap: 8px; align-items: center; }
.ai i { color: var(--acc-text); font-size: 17px; flex: none; }
.ai.wait, .ai.off { background: var(--well); color: var(--ink2); }
.ai.wait i { animation: spin 1.2s linear infinite; color: var(--ink3); }
.ai span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes spin { to { transform: rotate(360deg); } }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 8px; margin-top: 10px; }
.card { min-width: 0; display: flex; flex-direction: column; position: relative; }
.card .open-p { text-align: left; display: block; }
.card .b { margin-top: 7px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .n { font-size: 13px; line-height: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.card .d.stop { color: var(--ink2); }
/* 한 번 묻기: 걸었는데 옷장이 비어 있거나 이 종류가 없으면, 그 줄 아래에 두 칸짜리 한 줄로 묻는다(카드 높이는 그대로). */
.qrow { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 8px 6px 14px; border-radius: 12px; background: var(--well); margin-top: -4px; }
.qrow .qq { flex: 1; min-width: 0; font-size: 14px; line-height: 19px; font-weight: 700; }

.offh { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); }
.empty { margin-top: 32px; }
.row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line); }

/* 상세: 주 행동은 '판매처에서 사기' 하나. 걸기는 사진 모서리, 결정은 돌아왔을 때 묻거나 조용한 글자 버튼. */
.pdp-photo { margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); border-radius: 0; aspect-ratio: 4 / 5; }
.pdp-photo .ph-box { border-radius: 0; aspect-ratio: 4 / 5; }

.pricetag { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 22px; border-radius: 6px 10px 10px 6px; background: var(--surface); border: 1px solid var(--line); position: relative; clip-path: polygon(10px 0, 100% 0, 100% 100%, 10px 100%, 0 50%); }
.pricetag::before { content: ""; position: absolute; left: 11px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--acc); }

.pricetag small { font-size: 13px; color: var(--ink3); white-space: nowrap; }
.box { margin-top: 16px; padding: 16px; border-radius: 18px; background: var(--well); }

.box .label i { font-size: 16px; }

.box .h2 { margin-top: 6px; }
.box .h3 { margin-top: 6px; }
.box p { margin: 6px 0 0; }
.box .h2 b { color: var(--acc-text); }
.ownq { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ownq button { min-height: 48px; border-radius: 12px; font-size: 15px; font-weight: 700; background: var(--ink); color: var(--bg); }
.ownq button.no { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.looks2 { display: grid; gap: 14px; margin-top: 12px; }
.lk { padding: 0; }
.box .lk .ps .ph-box { background: var(--tile-on-well); }
.lk .ps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.lk .ps .ph-box { border-radius: 8px; }

.lk .ps .p1 .t6 { margin-top: 4px; font-size: 12px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lk .cap { margin-top: 8px; font-size: 13px; color: var(--ink2); }
.owned { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.owned .o { flex: none; width: 76px; }
.owned .o .ph-box { border-radius: 8px; }

.used { margin-top: 16px; border-top: 1px solid var(--line); }
.used summary { list-style: none; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }

.links { display: grid; }
.links a { min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; border-top: 1px solid var(--line); padding-left: 12px; }
.links a i { color: var(--ink3); }
.used .ug { margin: 12px 0 4px; font-weight: 700; color: var(--ink2); }
.links a .un { font-weight: 400; }
.buybar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px var(--gutR) calc(10px + var(--sab)) var(--gutL); }
.buybar .in { max-width: 560px; margin: 0 auto; }
.buybar .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 18px; color: var(--ink2); margin-bottom: 2px; min-height: 44px; }

.buybar .meta b { color: var(--ink); font-size: 15px; white-space: nowrap; }

.buybar .fb { color: var(--acc-text); font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
.buybar .fb i { font-size: 18px; flex: none; }
.buybar .btn { min-height: 52px; font-size: 16px; }
.buybar .btn i { font-size: 20px; }
.zoom { position: fixed; inset: 0; z-index: 60; background: #0f0f0e; display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 0 var(--sab); }
.zoom img { max-width: 100%; max-height: 100%; object-fit: contain; }
.zoom button { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); width: 48px; height: 48px; border-radius: 50%; background: rgba(255, 255, 255, .16); color: #fff; font-size: 24px; display: grid; place-items: center; }

/* 비교 */
.cmp { margin-top: 14px; overflow-x: auto; }

.cmp tr.same td { color: var(--ink3); }

/* 옷걸이 탭: 옷마다 한 번만, 종류별로. '가진 옷 걸기'는 엄지 영역에 고정. */
.rail { margin-top: 4px; position: relative; padding: 4px 0 2px; }
.rail .bar-line { position: absolute; left: 0; right: 0; top: 15px; height: 2px; background: var(--ink3); opacity: .55; }
.rail .hgs { display: flex; align-items: flex-start; gap: 8px; overflow-x: auto; scrollbar-width: none; position: relative; margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); padding: 0 var(--gutR) 0 var(--gutL); }
.rail .hgs::-webkit-scrollbar { display: none; }
.hg { flex: none; width: 112px; display: flex; flex-direction: column; align-items: center; padding-top: 6px; position: relative; text-align: center; }
.hg > i { font-size: 22px; color: var(--ink2); line-height: 1; position: relative; z-index: 1; margin-bottom: -3px; }
.hg .tile { flex: none; width: 108px; height: 140px; border-radius: 10px; overflow: hidden; background: var(--ptile); display: grid; place-items: center; position: relative; }
.hg .d { margin-top: 2px; width: 112px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--acc-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-align: center; }
.hg .d.stop { color: var(--ink2); }
.hg .tile .ph-box { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; }

.hg.cand > i { color: var(--acc); }

.hg .t6 { margin-top: 6px; font-size: 12px; line-height: 16px; width: 112px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink2); }
.hg.swing { animation: swing 900ms ease-out; transform-origin: 50% 6px; }
@keyframes swing { 0% { transform: rotate(7deg); } 35% { transform: rotate(-4deg); } 65% { transform: rotate(2deg); } 100% { transform: none; } }
.rail .gap { flex: none; width: 1px; margin: 26px 2px 12px; background: var(--line); }
.notice { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--well); display: flex; align-items: center; gap: 12px; }
.notice .grow { flex: 1; min-width: 0; font-size: 14px; line-height: 19px; color: var(--ink2); }
.notice button { min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--surface); font-size: 14px; font-weight: 700; flex: none; border: 1px solid var(--line); white-space: nowrap; }
.cgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; margin-top: 10px; }
.cgrid .g { text-align: left; min-width: 0; position: relative; }
.cgrid .g .ph-box { border-radius: 10px; }
.cgrid .g .t6 { margin-top: 5px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cgrid .g .d { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--acc-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cgrid .g .d.stop { color: var(--ink2); }
.pinbar { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabs) + var(--sab)); padding: 10px var(--gutR) 10px var(--gutL); background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }
.pinbar .in { max-width: 560px; margin: 0 auto; pointer-events: auto; }

.wait-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }

.wait-row .grow { flex: 1; min-width: 0; }
.box .warn { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; color: var(--ink2); }
.box .warn i { flex: none; font-size: 15px; margin-top: 1px; color: var(--acc-text); }
.wait-row .acts { display: grid; gap: 4px; justify-items: end; flex: none; }
.wait-row .acts .btn { min-height: 44px; font-size: 15px; padding: 0 14px; border-radius: 12px; }

/* 기록 */
.sum { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

.tl { margin-top: 8px; }

.rec { width: 100%; display: flex; gap: 12px; align-items: center; padding: 10px 0; text-align: left; border-bottom: 1px solid var(--line); }

.rec .grow { flex: 1; min-width: 0; }

.rec .pr { font-size: 15px; font-weight: 700; white-space: nowrap; }
.pill { display: inline-flex; height: 22px; padding: 0 8px; border-radius: 6px; align-items: center; font-size: 12px; font-weight: 700; background: var(--well); color: var(--ink2); white-space: nowrap; }

/* 시트 */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--dim); }
.sheet { position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88dvh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 12px var(--gutR) calc(20px + var(--sab)) var(--gutL); }

/* 백업·복원 */

.msg.me { justify-self: end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 6px; }
.msg.bot { justify-self: start; background: var(--well); color: var(--ink); border-bottom-left-radius: 6px; }
.msg.refuse { background: var(--surface); border: 1px dashed var(--ink3); color: var(--ink2); }
.msg.err { background: var(--surface); border: 1px solid var(--line); color: var(--ink2); }
.msg .who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--acc-text); margin-bottom: 4px; white-space: nowrap; min-width: 0; }
.msg .pcheck { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; line-height: 18px; color: var(--ink2); white-space: normal; }
.msg .pcheck i { flex: none; font-size: 15px; color: var(--acc-text); margin-top: 1px; }
.msg .ai-info { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; line-height: 18px; color: var(--ink2); white-space: normal; }
.ai-info summary { cursor: pointer; min-height: 28px; }
.ai-info dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 4px 0 0; }
.ai-info dd { margin: 0; overflow-wrap: anywhere; }
.msg.wait i { animation: spin 1.2s linear infinite; }
.recs { justify-self: stretch; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: -2px calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); padding: 0 var(--gutR) 0 var(--gutL); }
.recs::-webkit-scrollbar { display: none; }
.rc { flex: none; width: 132px; display: flex; flex-direction: column; position: relative; }
.rc .open-p { text-align: left; }
.rc .b { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc .n { font-size: 13px; line-height: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rc .p { font-size: 14px; font-weight: 800; white-space: nowrap; }
.rc .p small { font-size: 12px; font-weight: 500; color: var(--ink3); margin-left: 3px; }
.chatbar { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabs) + var(--sab)); background: var(--bg); border-top: 1px solid var(--line); padding: 10px var(--gutR) 10px var(--gutL); }
.chatbar form { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
.chatbar input { flex: 1; min-width: 0; height: 50px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); padding: 0 14px; font-size: 16px; outline: none; }
.chatbar input:focus { border-color: var(--acc); }
.chatbar button { width: 50px; height: 50px; border-radius: var(--r); background: var(--btn-bg); color: var(--btn-fg); display: grid; place-items: center; font-size: 22px; flex: none; }
.chatbar button:disabled { opacity: .5; }

/* 옷장 넣기(브랜드·품명 검색) */
.sbox { width: 100%; min-height: 52px; border-radius: var(--r); border: 2px solid var(--ink); background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 16px; color: var(--ink3); text-align: left; }
.sbox i { font-size: 20px; color: var(--ink); flex: none; }
.qform { flex: 1; min-width: 0; display: flex; margin: 0 6px 0 2px; }
.qform input { flex: 1; min-width: 0; height: 44px; border: 0; border-radius: 10px; background: var(--well); padding: 0 12px; font-size: 16px; outline: none; }
.qform input:focus { box-shadow: inset 0 0 0 2px var(--acc); }
.srow { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.srow .ph-box { width: 60px; flex: none; border-radius: 8px; }
.srow .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.srow .b { font-size: 12px; font-weight: 700; color: var(--ink3); }
.srow .n { font-size: 14px; line-height: 19px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.srow .m { font-size: 12px; color: var(--ink3); }
.srow .btn.sm { padding: 0 12px; font-size: 14px; flex: none; }
.srow .ok { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; line-height: 16px; font-weight: 700; color: var(--acc-text); flex: none; max-width: 42%; text-align: right; }
.srow .ok i { font-size: 18px; }
.shelfbar { position: fixed; z-index: 29; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding: 10px var(--gutR) calc(10px + var(--sab)) var(--gutL); }
.shelfbar .in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.shelfbar .ths { display: flex; gap: 4px; flex: none; }
.shelfbar .ths .ph-box { width: 34px; border-radius: 6px; }
.shelfbar .ths .ph-box.empty { border: 1.5px dashed var(--ink3); background: transparent; opacity: .6; }
.shelfbar .grow { flex: 1; min-width: 0; font-size: 14px; line-height: 19px; color: var(--ink2); }
.shelfbar .grow b { color: var(--ink); font-size: 15px; }
.shelfbar .btn.sm { flex: none; }
.shelfbar.pop .ths .ph-box:last-child { animation: pop 420ms var(--spring, ease); }

/* 옷장(모으는 재미): 같은 틀의 선반 타일, 종류별 묶음, 브랜드 칩 */
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 8px; margin-top: 10px; }
.gt { text-align: left; min-width: 0; display: flex; flex-direction: column; }
.gt .ph-box { border-radius: 10px; }
.gt .n { margin-top: 6px; font-size: 13px; line-height: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gt .m { font-size: 12px; line-height: 16px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gt .m.miss { color: var(--acc-text); }
.stat { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat .c { padding: 12px 14px; border-radius: 14px; background: var(--well); min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.stat .c .k { font-size: 12px; font-weight: 700; color: var(--ink3); white-space: nowrap; }
.stat .c .v { font-size: 22px; line-height: 28px; font-weight: 800; white-space: nowrap; }
.stat .c .v small { font-size: 13px; font-weight: 600; color: var(--ink2); margin-left: 2px; }
.stat .c .go { font-size: 13px; font-weight: 700; color: var(--acc-text); display: inline-flex; align-items: center; gap: 2px; }
.brands .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.brands .chip .num { color: inherit; opacity: .7; }
.recent { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 10px calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); padding: 0 var(--gutR) 0 var(--gutL); }
.recent::-webkit-scrollbar { display: none; }
.recent .gt { flex: none; width: 96px; }

/* 코디: 내 옷으로 입을 수 있는 조합(규칙으로 조합한 예시) */
.chips.scroll.moods { height: 44px; }
.chips.scroll.moods .chip { min-height: 44px; padding: 0 16px; }
.moods .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lk .ps .p1.cand .ph-box { box-shadow: inset 0 0 0 2px var(--acc); }
.lk .ps .p1 .pr { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--acc-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lk .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.lk .head b { font-size: 14px; min-width: 0; }
.lk .head .t6 { white-space: nowrap; flex: none; }
.lks { display: grid; gap: 20px; margin-top: 14px; }
.sg { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); position: relative; }
.sg .pic { width: 64px; flex: none; position: relative; display: block; }
.sg .pic .ph-box { border-radius: 8px; }
.sg .pic .hangt { width: 44px; height: 44px; right: -10px; top: -10px; }
.sg .pic .hangt span { width: 28px; height: 28px; font-size: 16px; }
.sg .grow { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; }
.sg .b { font-size: 12px; font-weight: 700; color: var(--ink3); }
.sg .n { font-size: 14px; line-height: 19px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.sg .why { font-size: 13px; line-height: 18px; color: var(--acc-text); font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sg .p { font-size: 14px; font-weight: 800; white-space: nowrap; }
.sg .p small { font-size: 12px; font-weight: 500; color: var(--ink3); margin-left: 3px; }

/* 상담 이력 */
.hist { margin-top: 12px; }
.hist .hrow { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid var(--line); text-align: left; }
.hist .hrow .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; min-height: 44px; justify-content: center; }
.hist .hrow .n { font-size: 15px; line-height: 21px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.hist .hrow .icon { width: 44px; }
.hist .hrow .icon i { color: var(--ink3); font-size: 20px; }
.ttl { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--well); display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink2); }
.ttl .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

@media (min-width: 900px) {
  .app, .tabs .in, .strip .in, .buybar .in, .chatbar form, .pinbar .in, .shelfbar .in { max-width: 920px; }
  .shelf { grid-template-columns: repeat(6, 1fr); }
  .stat { max-width: 560px; }
  .grid { grid-template-columns: repeat(4, 1fr); gap: 22px 14px; }
  .pdp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: start; margin-top: 8px; }
  .pdp-photo { margin: 0; border-radius: 18px; position: sticky; top: 64px; }
  .pdp-photo .ph-box { border-radius: 18px; }
  .pdp-head { margin-top: 0; }
  .cgrid { grid-template-columns: repeat(6, 1fr); }
  .sum { max-width: 560px; }
  .lks { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { .view, .hg.swing, .strip.pop, .hangt.pop span, .shelfbar.pop .ths .ph-box:last-child { animation: none !important; } .btn, .top, .hangt span { transition: none; } }

/* ── WO-11 새 디자인(v2, 기본): :root[data-look="v2"]에 적용. 위의 기본 규칙은 '이전 디자인'(?look=v1)이다.
   방향: 고급 패션 매장처럼 조용하게, 옷 사진이 먼저. 화면은 무채색(흰 바탕·잉크·중립 회색)이고 색은 옷이 가진다
   (10-28 00:04 대표). 브랜드색(--brand)은 나무 옷걸이 같은 월넛(10-28 00:07 대표)이고 로고 'it'과 앱 아이콘에만 쓴다.
   상자와 알약 줄이기(얇은 선과 여백으로 구분), 굵기 낮추기(800 → 600~700), 사진 칸 각진 모서리(2px)·크게. */
:root[data-look="v2"] {
  --bg: #ffffff; --surface: #ffffff; --well: #f7f7f8; --tile: #f4f4f5; --ptile: #f4f4f5; --tile-on-well: #ffffff;
  --ink: #202025; --ink2: #555560; --ink3: #6a6a74; --line: #e6e6ea;
  --brand: #5b3a24; --wood: #5b3a24; --wood-line: #5b3a24; --leaf: #4d6b4f;
  --acc: #202025; --acc-text: #202025; --acc-soft: #f1f1f3; --btn-bg: #202025; --btn-fg: #ffffff;
  --dim: rgba(13, 16, 15, .48); --shadow: 0 12px 32px rgba(13, 16, 15, .14), 0 2px 8px rgba(13, 16, 15, .08);
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root[data-look="v2"]:not([data-theme="light"]) {
  --bg: #151519; --surface: #1c1c21; --well: #202025; --tile: #232327; --ptile: #e9e9ec; --tile-on-well: #e9e9ec;
  --ink: #f7f7f8; --ink2: #c4c4cb; --ink3: #9898a3; --line: #33333b;
  --brand: #c4996b; --wood: #5b3a24; --wood-line: #c4996b; --leaf: #8fb592;
  --acc: #f7f7f8; --acc-text: #f7f7f8; --acc-soft: #2a2a30; --btn-bg: #f7f7f8; --btn-fg: #151519;
  --dim: rgba(0, 0, 0, .64); --shadow: 0 12px 32px rgba(0, 0, 0, .56); } }
:root[data-look="v2"][data-theme="dark"] {
  --bg: #151519; --surface: #1c1c21; --well: #202025; --tile: #232327; --ptile: #e9e9ec; --tile-on-well: #e9e9ec;
  --ink: #f7f7f8; --ink2: #c4c4cb; --ink3: #9898a3; --line: #33333b;
  --brand: #c4996b; --wood: #5b3a24; --wood-line: #c4996b; --leaf: #8fb592;
  --acc: #f7f7f8; --acc-text: #f7f7f8; --acc-soft: #2a2a30; --btn-bg: #f7f7f8; --btn-fg: #151519;
  --dim: rgba(0, 0, 0, .64); --shadow: 0 12px 32px rgba(0, 0, 0, .56); }
/* 글자: 굵기를 낮추고 단계를 줄인다(제목 26 · 20 · 16, 본문 15, 작은 글자 12). */
:root[data-look="v2"] body { font-size: 15px; letter-spacing: -.008em; }
:root[data-look="v2"] .h1 { font-size: 26px; line-height: 34px; font-weight: 700; letter-spacing: -.03em; }
:root[data-look="v2"] .h2 { font-size: 20px; line-height: 28px; font-weight: 650; letter-spacing: -.02em; }
:root[data-look="v2"] .h3 { font-size: 16px; line-height: 24px; font-weight: 650; }
:root[data-look="v2"] .t6 { font-size: 12px; line-height: 18px; }
/* 버튼·칩: 알약 대신 6~8px 모서리, 칩은 선만. */
:root[data-look="v2"] .btn { min-height: 50px; border-radius: 8px; font-size: 15px; font-weight: 600; }
:root[data-look="v2"] .btn.sm { border-radius: 8px; }
:root[data-look="v2"] .btn.soft { background: var(--well); }
:root[data-look="v2"] .chip { min-height: 34px; padding: 0 12px; border-radius: 6px; background: transparent; border: 1px solid var(--line); color: var(--ink); font-size: 13px; }
:root[data-look="v2"] .chip.ex { border-color: var(--line); }
:root[data-look="v2"] .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
:root[data-look="v2"] .chips.scroll .chip { min-height: 34px; }
:root[data-look="v2"] .quiet { font-weight: 500; text-decoration-color: var(--ink3); }
/* 탭·띠 */
:root[data-look="v2"] .tabs button { font-size: 11px; font-weight: 500; gap: 2px; }
:root[data-look="v2"] .tabs button[aria-current="page"] { font-weight: 700; }
:root[data-look="v2"] .tabs button i { font-size: 23px; }
:root[data-look="v2"] .strip .in { font-weight: 600; }
:root[data-look="v2"] .strip { background: var(--wood); color: #ffffff; }
:root[data-look="v2"] .strip .in i { color: #ffffff; }
/* 패널 D+ 3단계: 걸 때마다 띠의 옷걸이가 짧게 튄다(200ms). 처음만이 아니라 매번. */
:root[data-look="v2"] .strip.bump .in > i { animation: pop 200ms var(--spring, ease); }
/* 사진 칸: 각진 모서리, 회색 하나, 걸기 토글은 작게. */
:root[data-look="v2"] .ph-box { border-radius: 2px; }
:root[data-look="v2"] .hangt span { width: 30px; height: 30px; font-size: 17px; background: rgba(255, 255, 255, .94); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
:root[data-look="v2"] .hangt.big span { width: 42px; height: 42px; font-size: 22px; }
:root[data-look="v2"] .hangt span { width: 32px; height: 32px; }
:root[data-look="v2"] .hangt[aria-pressed="true"] span { background: var(--wood); color: #ffffff; box-shadow: 0 0 0 2px #ffffff, 0 1px 3px rgba(0, 0, 0, .18); }
:root[data-look="v2"] .hangt:not(.big)[aria-pressed="true"] span::after { content: "✓"; position: absolute; transform: translate(10px, 9px); width: 14px; height: 14px; border-radius: 50%; background: #ffffff; color: var(--wood); font: 700 10px/14px system-ui, sans-serif; text-align: center; }
:root[data-look="v2"] .pdp-photo .hangt.big { width: auto; height: 48px; right: 8px; top: 8px; }
:root[data-look="v2"] .pdp-photo .hangt.big span { width: auto; height: 40px; padding: 0 14px 0 12px; gap: 6px; display: inline-flex; align-items: center; border-radius: 8px; font-size: 20px; }
:root[data-look="v2"] .pdp-photo .hangt.big span::after { content: "걸어 보기"; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
:root[data-look="v2"] .pdp-photo .hangt.big[aria-pressed="true"] span::after { content: "걸어 보는 중"; }
:root[data-look="v2"] .ph-box .tag { border-radius: 2px; font-weight: 600; background: rgba(32, 32, 37, .86); }
:root[data-look="v2"] .hslot .rank { border-radius: 2px; font-weight: 650; background: rgba(32, 32, 37, .86); }
:root[data-look="v2"] .hslot .rank i { color: #c4c4cb; }
/* 홈: 검색창은 얇은 선, 날씨·보기 상자는 상자 대신 선으로 나눈 구역. */
:root[data-look="v2"] .ask input { height: 52px; border: 1px solid var(--ink); border-radius: 8px; font-size: 16px; }
:root[data-look="v2"] .ask button { width: 52px; height: 52px; border-radius: 8px; font-size: 22px; }
:root[data-look="v2"] .wx { margin-top: 8px; padding: 14px 0 16px; border-radius: 0; background: transparent; border-bottom: 1px solid var(--line); }
:root[data-look="v2"] .chips + .wx { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 16px; }
:root[data-look="v2"] .wx .wx-t { font-size: 20px; line-height: 28px; font-weight: 650; }
:root[data-look="v2"] .wx .wx-days { background: var(--well); margin: 0; }
:root[data-look="v2"] .wx .wx-day { min-height: 36px; border-radius: 6px; font-weight: 600; }
:root[data-look="v2"] .wx .wx-ps { gap: 4px; }
:root[data-look="v2"] .wx .wx-ps .ph-box, :root[data-look="v2"] .wx .wx-miss .wx-mg .ph-box { background: var(--ptile); border-radius: 2px; }
:root[data-look="v2"] .wx .wx-why { font-weight: 500; color: var(--ink); }
:root[data-look="v2"] .wx .wx-why i { color: var(--ink3); }
:root[data-look="v2"] .wx .wx-why.good i { color: var(--leaf); }
:root[data-look="v2"] #hangbox .h2 b.good { color: var(--leaf); }
:root[data-look="v2"] .wx .wx-ex .chips .chip { background: transparent; }
:root[data-look="v2"] .proof { padding: 16px 0; border-radius: 0; background: transparent; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
:root[data-look="v2"] .prow .ph-box { border-radius: 2px; }
:root[data-look="v2"] .section { margin-top: 32px; }
/* 결과: 사진을 화면 끝까지 2열로 크게, 글은 사진 아래 조용히. */
:root[data-look="v2"] .ai, :root[data-look="v2"] .ai.wait, :root[data-look="v2"] .ai.off { min-height: 28px; margin-top: 4px; padding: 4px 0; border-radius: 0; background: transparent; color: var(--ink2); font-size: 12px; line-height: 17px; }
:root[data-look="v2"] .ai i { font-size: 15px; }
:root[data-look="v2"] .grid { gap: 28px 2px; margin: 12px calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); }
:root[data-look="v2"] .grid .card > .open-p:last-child { padding: 0 12px; }
:root[data-look="v2"] .grid .qrow { margin: -12px 12px 0; border-radius: 6px; }
:root[data-look="v2"] .card .b { margin-top: 10px; font-size: 12px; font-weight: 600; color: var(--ink); }
:root[data-look="v2"] .card .n { margin-top: 2px; font-size: 13px; line-height: 18px; color: var(--ink2); }
:root[data-look="v2"] .card .p { margin-top: 6px; font-size: 14px; font-weight: 650; }
:root[data-look="v2"] .card .p small { font-weight: 400; }
:root[data-look="v2"] .card .d { font-weight: 600; }
:root[data-look="v2"] .qrow { border-radius: 6px; }
:root[data-look="v2"] .qrow button { border-radius: 6px; font-weight: 600; }
/* 상세: 사진 다음에 이름·가격만 크게. 가격표 모양은 걷어 낸다. */

  const REG_UNREADABLE = '저장된 브랜드·링크 정보를 읽지 못했어요. 지우지 않도록 저장을 멈췄어요.';
  const obj = (x) => x && typeof x === 'object' && !Array.isArray(x);

  try {

    } catch { throw keep; }
    regRaw = null; regWriteIssue=null; regObservedRaw = JSON.stringify({ items: {}, catalog: {} }); REG.items = {}; REG.catalog = {}; savedReg = structuredClone(REG);notifyRegStatus();

  };
  const assertRegCurrent = () => {

      { h: '직접 등록한 옷', lines: [`목록에 없는 옷은 브랜드·상품명·종류·색으로 등록할 수 있어요. 새 옷장 레일에서는 내가 찍은 옷 사진을 나중에 연결할 수 있고, 사진으로 브랜드나 상품을 자동 식별하지 않아요.`, `같은 옷을 ${NEED}명이 등록하면 모두가 검색할 수 있어요. 서버 연결 전에는 이 기기에만 남아요.`, '내 사진은 이 기기에 보관하고 서버·AI·공유 목록에 보내지 않아요. 새 레일에서 사진이 없으면 도형으로, 기존 일부 화면에서는 비슷한 상품 사진으로 표시해요. 비슷한 사진은 가진 옷 원본이 아니에요.'] },
    ];
    // 이 페이지는 사진을 함께 올린 사본(p/)에서 읽으므로 코어의 '이미지 서버에서 불러온다' 문장은 바꿔 적는다.
    const fixLine = (l) => (window.EOUL_PHOTO_BASE && /이미지 서버의 주소를 그대로/.test(l) ? '상품 사진은 확인용으로 이 페이지에 함께 올린 사본이에요. 사용 권리는 확인하지 않았어요. 링크를 외부에 공유하지 말아 주세요.' : l);
    const secs = [...base.sections.map((x) => ({ ...x, lines: x.lines.map(fixLine) })), ...extra];
    chromeSheet('disclose', { title: base.title, sections: secs }, () => {
    const sh = sheet(`<h2 class="h2">${esc(base.title)}</h2>${secs.map((x) => `<h3 class="t6" style="margin:16px 0 4px;font-weight:700">${esc(x.h)}</h3>${x.lines.map((l) => `<p class="t5" style="margin:0 0 6px;color:var(--ink2)">${esc(l)}</p>`).join('')}`).join('')}<button class="btn soft wide" data-close style="margin-top:18px">닫기</button>`);
    $('[data-close]', sh.s).onclick = () => sh.close();
    });
  }
  const FLAT = window.PHOTO_FLAT || new Set();
  const PIC = ['tee', 'shirt', 'knit', 'sweat', 'pants', 'jeans', 'jacket', 'coat', 'sneaker', 'loafer', 'cardigan', 'blazer'];
  const won = (n) => `${Number(n).toLocaleString('ko-KR')}원`;
  const dayKey = (iso) => { if (!iso) return '날짜 없음'; const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
  const DEC = { buy: '살게요', hold: '보류', skip: '안 살래요' };
  const josa = (w, a, b) => { const c = String(w || '').trim().slice(-1).charCodeAt(0); return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? a : b; };
  const GROUPS = [['상의', ['tee', 'longtee', 'shirt', 'polo', 'knit', 'sweat']], ['하의', ['pants', 'jeans', 'skirt']], ['아우터', ['jacket', 'blazer', 'cardigan', 'coat', 'down', 'vest']], ['신발', ['sneaker', 'loafer', 'boot']]];

  // ── 사진: 흰 배경 단독 사진은 칸에 띄우고(배경을 칸 색에 녹임), 나머지는 칸을 채운다. 내 옷은 같은 종류·색의 흰 배경 사진, 없으면 색 동그라미.
  // 칸 모델(WO-08c): 무엇을 보일지는 여기서 정하고, 바닐라는 아래 HTML로, React는 src/tiles의 Tile로 그린다.
  function productTile(id) {
    const ph = M.photo({ id });
    if (!ph) return { t: 'core', core: M.photoInfo({ id }, { caption: false }), html: M.photoHtml({ id }, { caption: false }) };
    return { t: 'img', cls: FLAT.has(id) || K.WHITE.has(id) ? 'flat' : 'cover', src: ph.src, alt: ph.alt };
  }
  function garmentTile(g) {
    if (g.photoId) return { t: 'mine', label: `${g.label || '내 옷'} · 내 사진 연결됨`, hex: g.colorHex || '#ccc' };
    if (g.photo?.example) return { t: 'img', cls: 'cover', src: g.photo.src, alt: g.photo.alt };
    if (g.productId && M.photo({ id: g.productId })) return productTile(g.productId);
    const id = K.CUT[`${g.gender || M.getState().gender || 'M'}|${g.kind}|${g.color}`]?.[0];
    if (id) { const ph = M.photo({ id }); if (ph) return { t: 'img', cls: 'flat', src: ph.src, alt: `${g.colorLabel || ''} ${g.kindName || ''}`.trim() }; }
    return { t: 'swatch', label: `${g.colorLabel || ''} ${g.kindName || ''}`.trim(), hex: g.colorHex || '#ccc' };
  }
  const pieceTile = (p) => {
    const g = p.garmentId && M.getState().closet.find((x) => x.id === p.garmentId);
    if (g) return garmentTile(g);
    if (p.product) return productTile(p.product.id);
    return garmentTile({ kind: p.kind, kindName: p.kindName, color: p.color, colorHex: p.colorHex, colorLabel: p.colorLabel });
  };
  // React에 넘길 때는 바닐라 전용 html을 뺀다.
  const tileData = (m) => { if (m.t !== 'core') return m; const { html, ...rest } = m; return rest; };
  function tileHtml(m, tail = '') {
    if (m.t === 'mine') return `<span class="ph-box" role="img" aria-label="${esc(m.label)}"><span class="swatch"><i style="background:${esc(m.hex)}"></i></span><span class="tag">내 사진 연결됨</span>${tail}</span>`;
    if (m.t === 'swatch') return `<span class="ph-box" role="img" aria-label="${esc(m.label)}"><span class="swatch"><i style="background:${esc(m.hex)}"></i></span>${tail}</span>`;
    if (m.t === 'core') return `<span class="ph-box">${m.html}${tail}</span>`;
    return `<span class="ph-box"><img class="${m.cls}" src="${esc(m.src)}" alt="${esc(m.alt)}" decoding="async">${tail}</span>`;
  }
  function productPic(id, { tag = '', tagCls = '', extra = '' } = {}) {
    return tileHtml(productTile(id), `${tag ? `<span class="tag ${tagCls}">${tag}</span>` : ''}${extra}`);
  }
  const garmentPic = (g) => tileHtml(garmentTile(g));
  const piecePic = (p) => tileHtml(pieceTile(p));
  const hangToggle = (id, cls = '') => { const on = M.compareHas(id); return `<button class="hangt ${cls}" data-hang="${id}" aria-pressed="${on}" aria-label="${on ? '걸어 보는 중 · 내리기' : '걸어 보기'}"><span><i class="${on ? 'ph-fill' : 'ph'} ph-coat-hanger"></i></span></button>`; };

  // ── 걸어 본 후보 = 비교함(최대 4개, 이 브라우저에 저장). 걸면 내 옷 기준 판정이 바로 따라온다.
  const hung = () => M.compareList();
  const sameOwned = (v) => (v?.owned || []).filter((o) => ['same-product', 'same-color'].includes(o.relation));
  const ownKey = (p) => `${p.gender || 'M'}|${p.kind}|${p.colorFromPhoto ? '' : p.color || ''}`;
  // 한 번 묻기가 필요한가: 옷장이 비었거나(코어가 판단 못 함), 이 종류가 옷장에 없어 코어가 묻는 중일 때.
  function needAsk(id) {
    const p = M.product(id); if (!p) return false;
    const v = p.verdict;
    if (v.basis === 'none') return !S.ui.absent[ownKey(p)];
    return !!(v.ask && v.ask.value === 'unknown');
  }
  const askText = (p) => `${p.colorFromPhoto ? '' : `${p.colorLabel} `}${p.kindName} 있어요?`;
  // 걸었을 때 달라지는 것 한 줄. 옷장이 없어도 '모른다'로 끝내지 않고, 사용자가 답한 사실로 말한다.
  function delta(id) {
    const p = M.product(id); if (!p) return null;
    const v = p.verdict;
    if (v.basis === 'none') {
      if (S.ui.absent[ownKey(p)]) return { text: `겹치는 ${p.kindName} 없음`, short: '겹침 없음', cls: 'ok', tone: 'ok' };
      return null;
    }
    const same = sameOwned(v).length;
    if (same || v.tone === 'stop') return { text: `비슷한 옷 ${same || 1}벌 있어요`, short: `비슷한 옷 ${same || 1}벌`, cls: '', tone: 'stop' };
    if (v.newLookCount) return { text: `새 코디 +${v.newLookCount}`, short: `새 코디 +${v.newLookCount}`, cls: 'go', tone: 'go' };
    if (v.ask && v.ask.value === 'absent') return { text: `겹치는 ${p.kindName} 없음`, short: '겹침 없음', cls: 'ok', tone: 'ok' };
    if (v.ask && v.ask.value === 'unknown') return null;
    const other = (v.owned || []).filter((o) => ['other-color', 'unknown-color'].includes(o.relation)).length;
    if (other) return { text: `${p.kindName} ${other}벌 있음 · 색 달라요`, short: '색 달라요', cls: 'ok', tone: 'info' };
    return { text: v.title, short: '옷과 비교함', cls: 'ok', tone: 'info' };
  }
  function stripText() {
    const ids = hung();
    if (!ids.length) return '';
    let looks = 0, same = 0;
    ids.forEach((id) => { const v = M.judge(id); if (!v || v.basis === 'none') return; looks += v.newLookCount || 0; same += sameOwned(v).length; });
    const parts = [`걸어 봄 ${ids.length}`];
    if (looks) parts.push(`새 코디 +${looks}`);
    if (same) parts.push(`비슷한 옷 ${same}`);
    if (!looks && !same && ids.length >= 2) parts.push('나란히 비교');
    return parts.join(' · ');
  }

  // 상품 카드 내용(WO-03): 바닐라 카드와 React 결과 카드가 같은 값을 그린다.
  function cardModel(p, ai) {
    const isHung = M.compareHas(p.id);
    const d = isHung ? delta(p.id) : null;
    const ph = M.photo({ id: p.id });
    return {
      id: p.id, brand: p.brand, name: p.name, priceText: p.priceText, priceShort: p.priceShort, hung: isHung,
      rank: ai ? ai.rank : null, dl: d ? `걸어 봄 · ${d.text}` : isHung ? '걸어 봄' : '', stop: d?.tone === 'stop',
      tag: d ? d.short : '', tagCls: d?.cls || '',
      photo: ph ? { src: ph.src, alt: ph.alt, flat: FLAT.has(p.id) || K.WHITE.has(p.id) } : null,
      tile: ph ? null : M.photoHtml({ id: p.id }, { caption: false }),
      core: ph ? null : M.photoInfo({ id: p.id }, { caption: false }),
    };
  }
  function cardHtml(p, ai) {
    const c = cardModel(p, ai);
    const extra = `${c.rank ? `<span class="rank num" aria-label="AI 순위 ${c.rank}위"><i class="ph-fill ph-sparkle"></i>${c.rank}</span>` : ''}${hangToggle(p.id)}`;
    const body = `<button class="open-p" data-pid="${p.id}"><div class="b">${esc(p.brand)}</div><div class="n">${esc(p.name)}</div>${c.dl ? `<div class="d ${c.stop ? 'stop' : ''}">${esc(c.dl)}</div>` : ''}<div class="p num">${esc(p.priceText)}<small>${esc(p.priceShort)}</small></div></button>`;
    return `<div class="card${c.dl ? ' has-d' : ''}" data-card="${p.id}"><button class="open-p" data-pid="${p.id}" aria-label="${esc(p.brand)} ${esc(p.name)}">${productPic(p.id, { tag: c.tag ? esc(c.tag) : '', tagCls: c.tagCls })}</button><span class="hslot">${extra}</span>${body}</div>`;
  }
  // 결과 격자: 걸린 카드에 한 번 묻기나 안내가 필요하면 그 카드가 든 줄 바로 아래에 두 칸짜리 줄을 끼운다.
  const cols = () => (matchMedia('(min-width: 900px)').matches ? 4 : 2);
  // 격자 항목(WO-03): 카드, 그 줄 아래의 안내 줄(note)·한 번 묻기 줄(ask). 바닐라와 React가 같은 순서를 쓴다.
  function gridModel(list) {
    const n = cols(); const out = []; const askedKeys = new Set();
    const aiOn = !!(S.curQ && S.aiOrder[S.curQ]);
    list.forEach((p, i) => {
      const ai = aiOn ? S.ai[p.id] : null;
      out.push({ type: 'card', id: p.id, p, ai, card: cardModel(p, ai) });
      if (i % n === n - 1 || i === list.length - 1) {
        const row = list.slice(i - (i % n), i + 1);
        row.forEach((q) => {
          if (S.note?.id === q.id) out.push({ type: 'note', id: q.id, text: S.note.text });
          else if (M.compareHas(q.id) && needAsk(q.id) && !askedKeys.has(ownKey(q))) {
            askedKeys.add(ownKey(q));
            const twins = hung().filter((id) => id !== q.id && needAsk(id) && ownKey(M.product(id)) === ownKey(q)).length;
            out.push({ type: 'ask', id: q.id, p: q, text: askText(q), twins, sub: twins ? `걸어 본 ${twins + 1}벌에 같이 적용돼요` : `${q.brand} ${q.name}` });
          }
        });
      }
    });
    return out;
  }
  function gridHtml(list) {
    return gridModel(list).map((e) => e.type === 'card' ? cardHtml(e.p, e.ai)
      : e.type === 'note' ? `<div class="qrow note" role="alert" data-for="${e.id}"><i class="ph ph-info"></i><span class="qq" style="font-weight:600">${esc(e.text)}</span></div>`
      : `<div class="qrow" role="group" aria-label="${esc(e.text)}" data-for="${e.id}"><span class="qq">${esc(e.text)}<small>${e.twins ? esc(e.sub) : `${esc(e.p.brand)} ${esc(e.p.name)}`}</small></span><button data-own="yes" data-for="${e.id}">있어요</button><button class="no" data-own="no" data-for="${e.id}">없어요</button></div>`).join('');
  }
  // 검색 결과 내용(WO-03): 바닐라 화면과 React 결과 화면이 같은 값을 그린다. S.result·S.shown·S.curQ는 예전처럼 여기서 정한다.
  function resultsModel({ q, drop = [] }) {
    const parsed = M.ask(q, { drop });
    // Do not present a broad local match as the requested brand/condition.
    // Provider search still receives the full request independently below.
    const partial = (parsed.notices || []).filter((n) => ['unknown', 'unsupported'].includes(n.kind));
    const r = partial.length ? { ...parsed, understood: false, products: [], notices: [{ text: '기존 상품 목록에서 요청의 일부를 확인하지 못해 다른 상품으로 채우지 않았어요. 브랜드·상품명으로 다시 검색하거나 아래 국내 상품 결과를 확인해 주세요.' }] } : parsed;
    const chips = (r.conditions || []).map((c) => ({ key: c.key, label: c.label, removable: !!c.removable }));
    S.result = null;
    if (partial.length && (window.EOUL_ADPICK || window.EOUL_OPEN_PRODUCT_SEARCH)) return { kind: 'partial', q, drop, chips, notice: r.notices[0].text };
    if (!r.understood || !r.products.length) {
      const rel = r.understood ? M.relax(r) : [];
      const note = (r.notices || []).find((n) => n.text)?.text;
      const kindLabel = (r.conditions || []).find((c) => c.key === 'kind')?.label || '';
      const alts = [];
      if (r.understood && kindLabel) {
        const genderNotice = /남성 상품에는/.test(note || '') ? 'F' : /여성 상품에는/.test(note || '') ? 'M' : null;
        if (genderNotice) alts.push({ label: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}로 보기`, q: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}` });
        M.kindChoices().filter((k) => k.name !== kindLabel).slice(0, 5).forEach((k) => alts.push({ label: `${k.name}${josa(k.name, '으로', '로')} 보기`, q: q.includes(kindLabel) ? q.replace(kindLabel, k.name) : k.name }));
      }
      return {
        kind: 'empty', q, drop, chips,
        title: partial.length ? '기존 목록에서 일부 조건을 확인하지 못했어요' : r.understood ? '조건에 맞는 옷이 없어요' : '무슨 옷인지 못 알아들었어요',
        sub: note || (r.understood ? '다른 옷으로 바꿔 채우지 않았어요.' : '종류를 넣어 다시 말해 주세요. 예: 셔츠, 코트, 운동화'),
        relax: rel.map((x) => ({ title: x.title, drop: x.drop })), alts,
        examples: !rel.length && !alts.length ? M.examples().slice(0, 3) : null,
      };
    }
    S.result = r;
    const basis = M.judge(r.products[0].id)?.basisLabel || '';
    const list = r.products.slice(0, 12);
    const order = S.aiOrder[q];
    const sorted = order ? [...list].sort((a, b) => (order[a.id] ?? 99) - (order[b.id] ?? 99)) : list;
    S.shown = { main: sorted, off: (r.offOccasion || []).slice(0, 6) }; S.curQ = q;
    return {
      kind: 'list', q, drop, chips, count: r.products.length, basis: basis.replace(' 판단했어요', ''),
      ranked: !!order, summary: order ? S.aiSummary?.[q] || 'AI가 후보 순서를 정했어요' : '', listNote: r.listNote || '평점과 후기 수 순',
      main: sorted, off: S.shown.off, offTitle: r.offOccasion?.length ? r.offOccasionTitle || '상황과 덜 맞는 옷' : '',
    };
  }  // 상품 상세 내용(WO-04): 바닐라 상세와 React 상세가 같은 값을 그린다.
  function detailModel(id) {
    const p = M.product(id); if (!p) return null;
    const ai = S.ai[id];
    const v = p.verdict;
    const same = sameOwned(v);
    const looks = (v.looks || []).slice(0, 2);
    const nvu = M.newVsUsed(id);
    const ask = needAsk(id);
    const d = delta(id);
    let head, sub = v.lines?.[0] || '';
    if (ask) { head = { kind: 'ask', text: askText(p) }; sub = ''; }
    else if (v.basis === 'none' && d) { head = { kind: 'none', kindName: p.kindName, josa: josa(p.kindName, '이', '가') }; sub = `가진 ${p.kindName}${josa(p.kindName, '이', '가')} 없다고 답했어요.`; }
    else if (same.length) head = { kind: 'same', n: same.length };
    else if (v.newLookCount) head = { kind: 'new', n: v.newLookCount };
    else head = { kind: 'title', text: v.title };
    const ph = M.photo({ id });
    return {
      id, p, v, ai: ai || null, same, looks, nvu, ask, head, sub,
      brand: p.brand, name: p.name, priceText: p.priceText, priceNote: p.priceNote, url: p.url,
      facts: `${p.colorLabel} · ${p.slotName}${p.rating ? ` · 평점 ${p.rating} · 후기 ${Number(p.reviews || 0).toLocaleString('ko-KR')}개` : ''}`,
      photo: ph ? { src: ph.src, alt: ph.alt, flat: FLAT.has(id) || K.WHITE.has(id) } : null,
      tile: ph ? null : M.photoHtml({ id }, { caption: false }),
      core: ph ? null : M.photoInfo({ id }, { caption: false }),
      hung: M.compareHas(id), basisLabel: v.basisLabel,
      cautions: (Array.isArray(v.cautions) ? v.cautions : []).slice(0, 3),
      addLike: !ask && v.addSuggestion && !(v.owned || []).length && !(v.basis === 'none' && d) ? { kindName: v.addSuggestion.kindName } : null,
      usedCount: nvu.used.groups.reduce((a, g) => a + g.links.length, 0),
    };

  // 홈의 증거 칸: 걸어 본 옷이 있으면 그 결과, 옷장이 있으면 예시 상품의 판정, 둘 다 없으면 체험용 옷장으로 한 번에 보여 준다.
  function homeProofModel(){

    // 옷장이 비어 있으면 날씨 카드가 초대를 맡는다(홈에 초대를 두 번 두지 않는다).

  // 옷장이 비었을 때의 초대: 브랜드·품명 검색 상자와 예시, 체험용 옷장. 옷장·코디에서 같이 쓴다.
  const ADD_EX = ['무신사 옥스포드', '유니클로', '나이키', '폴로', '뉴발란스', '아디다스'];
  const addExamples = () => ADD_EX.filter((b) => { try { return M.findProducts(b, { limit: 1 }).length; } catch { return false; } }).slice(0, 4);
  function inviteHtml({ label, h }) {

  // 코디 한 벌: 내 옷은 판매처 사진이나 비슷한 상품 사진, 후보는 주황 테두리. '규칙으로 조합한 예시' 같은 설명은 ⓘ에만.
  // 코디 카드 모델(WO-08c). sub는 그대로 넣는다(바닐라 호출 한 곳은 미리 esc한 글자를 넘긴다).
  function lookModel(o, { title = '', sub = '', owned = true } = {}) {
    const ps = o.pieces.filter((x) => ['outer', 'top', 'inner', 'bottom', 'shoes', 'dress'].includes(x.role));

  function lookHtml(o, opts = {}) {

      <div class="ps">${m.pieces.map((x) => `<div class="p1${x.cand ? ' cand' : ''}">${tileHtml(x.tile)}<div class="${x.capCls}">${esc(x.cap)}</div></div>`).join('')}</div></div>`;

  // ── 오늘 날씨 코디 카드: 기온 한 줄 → 사진 네 장 → 이유 한 줄. 홈 맨 위와 코디 탭 맨 위에서 같은 카드를 쓴다.
  // 날씨 카드의 내용은 한 곳(weatherModel)에서 계산한다. 바닐라 카드(weatherHtml)와 React 카드(src/weather)가
  // 같은 모델을 그린다. 옷 타일(piecePic)과 부족 아이템 상품 카드(cardHtml)는 결과 화면과 같은 공용 템플릿이라 html로 넘긴다.
  function weatherModel({ where = 'home' } = {}) {
    const st = M.getState();
    if (WX.loading || (WX.real === undefined && typeof window.EOUL_WEATHER === 'function')) return { status: 'loading', where };
    const src = wxSource();
    const day = WX.day === 'tomorrow' && src.tomorrow ? 'tomorrow' : 'today';
    const w = src[day];
    const base = {
      status: 'ready', where, kind: src.kind, place: src.kind === 'real' ? (src.place || '현재 위치') : '',
      canPlace: src.kind === 'real' && !!window.EOUL_WEATHER_PLACE, day, hasTomorrow: !!src.tomorrow,
      temp: { min: w.min, max: w.max, rain: !!w.rain }, failed: !!WX.failed,
      examples: src.kind === 'example' ? WX_EX.map((e) => ({ id: e.id, label: e.label, on: e.id === src.ex.id })) : null,
    };
    if (!st.closetCount) return { ...base, mode: 'invite' };
    let r;
    try { r = M.weatherOutfits(w, { limit: 3 }); } catch (e) { r = { ok: false, message: e.message }; }
    if (!r.ok) return { ...base, mode: 'message', message: r.message || '날씨 정보가 없어요.' };
    const key = `${day}|${w.min}|${w.max}|${w.rain ? 1 : 0}`;
    const n = r.outfits.length;
    const i = n ? (WX.idx[key] || 0) % n : 0;
    const o = n ? r.outfits[i] : null;
    const pieces = o ? o.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4) : [];
    let missing = null;
    if (r.missing) {
      let ps = [];
      try { const q = M.readSearch(r.missing.query); ps = q.understood ? q.products.slice(0, 3) : []; } catch {}
      missing = {
        label: r.missing.label, query: r.missing.query,
        heading: `${day === 'today' ? '오늘' : '내일'} 같은 날엔 ${r.missing.label}${josa(r.missing.label, '이', '가')} 있으면 좋아요`,
        products: ps.map((p) => ({ id: p.id, html: cardHtml(p, null), card: cardModel(p, null) })),
      };
    }
    return {
      ...base, mode: 'outfit',
      band: { label: r.band.label, advice: r.band.advice }, notes: r.notes.join(' '),
      outfit: !!o, pieces: pieces.map((x) => ({ label: x.label, trial: !!x.trial, html: piecePic(x), tile: tileData(pieceTile(x)) })),
      why: o ? (r.short ? '딱 맞는 조합이 없어서 가진 옷 중 가장 가까운 거예요' : (o.reasons[0] || `${r.band.label}에 맞는 조합이에요`)) : '상의·하의·신발이 한 벌씩 있어야 조합이 생겨요',
      good: !!o && !r.short,
      whyMore: o && !r.short && o.reasons.length > 1 ? ` · ${o.reasons.slice(1).join(' · ')}` : '',
      count: n, index: i, missing,
    };
  }
  function weatherHtml({ where = 'home' } = {}) {
    const m = weatherModel({ where });
    if (m.status === 'loading') {
      return `<section class="wx" aria-label="오늘 날씨 코디"><div class="wx-wait" role="status"><i class="ph ph-circle-notch"></i>오늘 날씨를 불러오는 중이에요</div></section>`;
    }
    const srcTag = m.kind === 'real'
      ? (m.canPlace ? `<button class="wx-place" data-wxplace aria-label="날씨 지역 바꾸기: ${esc(m.place)}">${esc(m.place)}<i class="ph ph-caret-down"></i></button>` : esc(m.place))
      : '예시 날씨';
    const temp = `<span class="wx-t num">${m.day === 'today' ? '오늘' : '내일'} · 아침 ${m.temp.min}° → 낮 ${m.temp.max}°${m.temp.rain ? ' · 비' : ''}</span>`;

    const head = `<div class="label"><i class="ph-fill ph-sun-horizon"></i>날씨 코디 · ${srcTag}<span class="sp"></span>${days}</div><div class="wx-h">${temp}</div>`;
    const exRow = m.examples ? `<div class="wx-ex"><span class="t6 nw">${m.failed ? '날씨를 못 받아 예시로' : '예시 날씨 · 설치 앱에서는 실제 날씨'}</span><div class="chips scroll" aria-label="예시 날씨 고르기">${m.examples.map((e) => `<button class="chip ${e.on ? 'on' : 'ex'}" data-wxex="${e.id}" aria-pressed="${e.on}">${esc(e.label)}</button>`).join('')}</div></div>` : '';
    if (m.mode === 'invite') {
      return `<section class="wx" aria-label="오늘 날씨 코디">${head}
        <div class="wx-invite"><h2 class="h3">옷장을 채우면 날씨에 맞춰 골라 드려요</h2>
