<title>옷장이 집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="shared/fonts/pretendard.css">
<link rel="stylesheet" href="shared/icons/regular.css">
<link rel="stylesheet" href="shared/icons/fill.css">
<script>window.EOUL_PHOTO_BASE='p/'; window.EOUL_MOCK_KEY='eoul-d15:v1';</script>
<script src="shared/eoul-mock.js"></script>
<script src="shared/cutouts.js"></script>
<script src="shared/photo-kinds.js"></script>
<script src="shared/kit.js"></script>
<script src="shared/ai-rank.js"></script>
<style>
/* 옷장이 집인 앱(d15): 첫 화면이 내 옷장이다. 레일(아우터·상의)과 선반(하의·신발)에 같은 틀의 상품 사진이 걸리고,
   빈 자리는 '찾아 넣기'로 초대한다. 쇼핑은 옷장의 빈 곳에서 시작한다. 강조색은 나무 옷장의 따뜻한 갈색 하나와 행동색 점토색 하나. */
:root {
  --bg: #f6f1e8; --surface: #fffdf9; --well: #efe8db; --tile: #ebe4d6; --ptile: #f0ebe1;
  --ink: #221d16; --ink2: #5d554a; --ink3: #837a6d; --line: #e2dacb;
  --wood: #c49a6c; --wood2: #a37b50; --wood-soft: #f3e7d6;
  --acc: #c2552a; --acc-text: #a1421d; --acc-soft: #f8e3d7; --btn-bg: #b64c21; --btn-fg: #ffffff;
  --dim: rgba(30, 20, 10, .45); --shadow: 0 10px 28px rgba(60, 40, 20, .12);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --r: 14px; --gutL: max(16px, env(safe-area-inset-left, 0px)); --gutR: max(16px, env(safe-area-inset-right, 0px));
  --top: 44px; --tabs: 50px; --sab: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16130e; --surface: #1f1b15; --well: #2a251d; --tile: #2f2922; --ptile: #e9e3d8;
  --ink: #f4efe6; --ink2: #cbc2b4; --ink3: #9b9183; --line: #352f27;
  --wood: #8f6a46; --wood2: #6b4d31; --wood-soft: #2d241a;
  --acc: #ff7c47; --acc-text: #ffa27d; --acc-soft: #3e2416; --btn-bg: #ff7c47; --btn-fg: #1d0d05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #16130e; --surface: #1f1b15; --well: #2a251d; --tile: #2f2922; --ptile: #e9e3d8;
  --ink: #f4efe6; --ink2: #cbc2b4; --ink3: #9b9183; --line: #352f27;
  --wood: #8f6a46; --wood2: #6b4d31; --wood-soft: #2d241a;
  --acc: #ff7c47; --acc-text: #ffa27d; --acc-soft: #3e2416; --btn-bg: #ff7c47; --btn-fg: #1d0d05;
  --dim: rgba(0, 0, 0, .62); --shadow: 0 10px 28px rgba(0, 0, 0, .5); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 400 16px/1.55 var(--font); letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; --k-font: var(--font); --k-toast-bg: var(--ink); --k-toast-fg: var(--bg); --k-info-bg: var(--surface); --k-info-fg: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.ph, .ph-fill { line-height: 1; }
.num { font-variant-numeric: tabular-nums; }
.nw { white-space: nowrap; }

.app { max-width: 560px; margin: 0 auto; padding: 0 var(--gutR) calc(var(--tabs) + 24px + var(--sab)) var(--gutL); }
.app.bar { padding-bottom: calc(118px + var(--sab)); }
.app.chat { padding-bottom: calc(var(--tabs) + 84px + var(--sab)); }
.app.pin { padding-bottom: calc(var(--tabs) + 88px + var(--sab)); }
.app.addv { padding-bottom: calc(96px + var(--sab)); }
.view { animation: in 240ms ease-out both; }
.view.back { animation-name: inback; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes inback { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.h1 { font-size: 28px; line-height: 36px; font-weight: 800; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.h2 { font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.h3 { font-size: 17px; line-height: 25px; font-weight: 700; margin: 0; }
.t5 { font-size: 15px; line-height: 22px; }
.t6 { font-size: 13px; line-height: 19px; color: var(--ink3); }
.sub { color: var(--ink2); }
.acc { color: var(--acc-text); }

/* 위쪽 막대(44px) */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; height: var(--top); display: flex; align-items: center; gap: 2px; margin: 0 -6px; background: var(--bg); box-shadow: 22px 0 0 var(--bg), -22px 0 0 var(--bg); }
.top .sp { flex: 1; }
.icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--ink); flex: none; }
.icon.quiet-i { font-size: 20px; color: var(--ink3); margin-left: -6px; }
.icon:active { background: var(--well); }
.mark { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; font-weight: 800; font-size: 17px; letter-spacing: -.02em; white-space: nowrap; }
.mark i { color: var(--wood2); font-size: 22px; }
.qbox { flex: 1; min-width: 0; height: 36px; margin: 0 6px 0 2px; border-radius: 10px; background: var(--well); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 15px; font-weight: 600; text-align: left; }
.qbox i { font-size: 18px; color: var(--ink3); flex: none; }
.qbox span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { height: 36px; padding: 0 12px; border-radius: 999px; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink2); }
.tbtn i { font-size: 18px; }
.ttl-mid { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 버튼 */
.btn { min-height: 52px; padding: 0 18px; border-radius: var(--r); font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 120ms ease; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn.go { background: var(--btn-bg); color: var(--btn-fg); }
.btn.soft { background: var(--well); color: var(--ink); }
.btn.line { border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn.wide { width: 100%; }
.btn.sm { min-height: 44px; font-size: 15px; padding: 0 14px; border-radius: 12px; }
.btn:disabled { opacity: .45; }
.quiet { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--ink2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); white-space: nowrap; }

/* 아래 탭(50px): 옷장이 첫 칸 */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding-bottom: var(--sab); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { height: var(--tabs); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; line-height: 14px; font-weight: 600; color: var(--ink3); white-space: nowrap; }
.tabs button i { font-size: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs[hidden] { display: none; }

/* 사진: 모든 칸은 3:4, 같은 밝은 바탕. 흰 배경 단독 사진은 바탕에 녹이고(multiply), 모델 사진은 채운다. */
.ph-box { position: relative; aspect-ratio: 3 / 4; border-radius: 10px; background: var(--ptile); overflow: hidden; display: grid; place-items: center; }
.ph-box img { display: block; }
.ph-box img.cover { width: 100%; height: 100%; object-fit: cover; }
.ph-box img.flat { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; }
.ph-box .eo-ph, .ph-box .eo-tile { position: absolute; inset: 0; aspect-ratio: auto !important; border-radius: 0 !important; }
.ph-box .swatch { position: absolute; inset: 0; display: grid; place-items: center; }
.ph-box .swatch i { width: 46%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.ph-box .tag { position: absolute; left: 6px; top: 6px; max-width: calc(100% - 12px); height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(34, 29, 22, .82); color: #fff; }
.ph-box .tag.go { background: var(--btn-bg); color: var(--btn-fg); }
.ph-box .tag.ok { background: rgba(255, 255, 255, .92); color: #221d16; }
.ph-box .tag.lo { top: auto; bottom: 6px; background: rgba(255, 255, 255, .9); color: #5d554a; font-weight: 600; font-size: 11px; height: 20px; }
.ph-box .rank { position: absolute; left: 6px; bottom: 6px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; background: rgba(34, 29, 22, .82); color: #fff; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; }
.ph-box .rank i { font-size: 12px; color: var(--acc); }

/* 옷장(집): 나무 틀 안에 레일 2줄 + 선반 2줄 */
.home-ask { margin-top: 12px; width: 100%; min-height: 48px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 15px; color: var(--ink3); text-align: left; }
.home-ask i { font-size: 20px; color: var(--ink); flex: none; }
.home-ask span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-ask b { color: var(--ink); font-weight: 600; }
.counts { margin-top: 14px; display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink2); }
.counts b { font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -.02em; margin-right: 2px; }
.wardrobe { margin: 14px calc(-1 * var(--gutR) + 4px) 0 calc(-1 * var(--gutL) + 4px); border: 2px solid var(--wood); border-radius: 20px; background: var(--surface); overflow: hidden; box-shadow: inset 0 0 0 6px var(--wood-soft); }
.wardrobe .sec { padding: 12px 12px 0; position: relative; }
.wardrobe .sec + .sec { border-top: 2px solid var(--wood-soft); }
.wardrobe .sec .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; padding: 0 2px; }
.wardrobe .sec .h .n { font-size: 14px; font-weight: 800; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 6px; }
.wardrobe .sec .h .n small { font-size: 13px; font-weight: 600; color: var(--ink3); }
.wardrobe .sec .h .gapb { min-height: 32px; padding: 0 10px; border-radius: 999px; background: var(--acc-soft); color: var(--acc-text); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.wardrobe .sec .h .gapb i { font-size: 13px; }
.rail { position: relative; margin-top: 2px; padding: 6px 0 12px; }
.rail .bar { position: absolute; left: -12px; right: -12px; top: 14px; height: 4px; background: linear-gradient(var(--wood), var(--wood2)); border-radius: 2px; }
.rail .items, .shelf .items { display: flex; align-items: flex-start; gap: 8px; overflow-x: auto; scrollbar-width: none; position: relative; margin: 0 -12px; padding: 0 12px; }
.rail .items::-webkit-scrollbar, .shelf .items::-webkit-scrollbar { display: none; }
.rail .items::after, .shelf .items::after { content: ""; flex: none; width: 4px; }
.gi { flex: none; width: 100px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; min-width: 0; }
.gi > i { font-size: 22px; color: var(--ink2); line-height: 1; margin-bottom: -4px; position: relative; z-index: 1; }
.gi .ph-box { width: 100px; border-radius: 10px; }
.gi .n { margin-top: 5px; width: 100px; font-size: 12px; line-height: 16px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.gi .m { width: 100px; font-size: 11px; line-height: 15px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gi .m.miss { color: var(--acc-text); font-weight: 700; }
.gi.slot .ph-box { background: transparent; border: 1.5px dashed var(--wood); display: grid; place-items: center; color: var(--wood2); }
.gi.slot .ph-box i { font-size: 24px; }
.gi.slot .n { color: var(--wood2); }
.gi.slot > i { color: var(--wood); }
.gi.swing { animation: swing 900ms ease-out; transform-origin: 50% 6px; }
@keyframes swing { 0% { transform: rotate(6deg); } 35% { transform: rotate(-4deg); } 65% { transform: rotate(2deg); } 100% { transform: none; } }
.shelf { position: relative; padding: 4px 0 14px; }
.shelf .items { align-items: flex-end; padding-bottom: 6px; }
.shelf .plank { position: absolute; left: -12px; right: -12px; bottom: 4px; height: 7px; background: linear-gradient(var(--wood), var(--wood2)); border-radius: 2px; box-shadow: 0 3px 0 var(--wood-soft); }
.shelf .gi > i { display: none; }
.wardrobe .foot { padding: 8px 14px 12px; font-size: 12px; line-height: 17px; color: var(--ink3); }
.empty-w { padding: 22px 16px 18px; text-align: center; }
.empty-w .h2 { font-size: 20px; }
.empty-w .doors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.empty-w .doors .ph-box { border: 1.5px dashed var(--wood); background: transparent; color: var(--wood2); display: grid; place-items: center; border-radius: 10px; }
.empty-w .doors .ph-box i { font-size: 26px; }
.sbox { width: 100%; min-height: 52px; border-radius: var(--r); border: 2px solid var(--ink); background: var(--surface); display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 16px; color: var(--ink3); text-align: left; }
.sbox i { font-size: 20px; color: var(--ink); flex: none; }
.section { margin-top: 24px; }
.section > .h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.section > .h .h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section > .h .t6 { white-space: nowrap; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--gutL)); margin-right: calc(-1 * var(--gutR)); padding: 0 var(--gutR) 0 var(--gutL); height: 44px; align-items: center; overflow-y: hidden; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll::after { content: ""; flex: none; width: 28px; }
.chips.scroll.fade { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--well); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); white-space: nowrap; flex: none; }
.chip i { font-size: 14px; color: var(--ink3); }
.chip.ex { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.chip.on, .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip .num { opacity: .7; }
.gaps { display: grid; gap: 8px; margin-top: 10px; }
.gap { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 14px; background: var(--acc-soft); text-align: left; }
.gap .grow { flex: 1; min-width: 0; }
.gap .grow b { display: block; font-size: 15px; line-height: 21px; }
.gap .grow span { display: block; font-size: 13px; line-height: 18px; color: var(--ink2); }
.gap .arr { color: var(--acc-text); font-size: 20px; flex: none; }
.today { margin-top: 24px; padding: 14px; border-radius: 18px; background: var(--well); }
.today .label { font-size: 13px; font-weight: 700; color: var(--ink3); display: flex; align-items: center; gap: 6px; }
.today .label i { font-size: 16px; color: var(--acc-text); }
.today .h3 { margin-top: 4px; }
.today .lk { margin-top: 10px; }
.stat { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat .c { padding: 12px 14px; border-radius: 14px; background: var(--well); min-width: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.stat .c .k { font-size: 12px; font-weight: 700; color: var(--ink3); white-space: nowrap; }
.stat .c .v { font-size: 22px; line-height: 28px; font-weight: 800; white-space: nowrap; }
.stat .c .v small { font-size: 13px; font-weight: 600; color: var(--ink2); margin-left: 2px; }
.stat .c .go { font-size: 13px; font-weight: 700; color: var(--acc-text); display: inline-flex; align-items: center; gap: 2px; }
.notice { margin-top: 14px; padding: 12px 14px; border-radius: var(--r); background: var(--well); display: flex; align-items: center; gap: 12px; }
.notice .grow { flex: 1; min-width: 0; font-size: 14px; line-height: 19px; color: var(--ink2); }
.notice button { min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--surface); font-size: 14px; font-weight: 700; flex: none; border: 1px solid var(--line); white-space: nowrap; }
.row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .arr { color: var(--ink3); font-size: 18px; }
.foot { margin-top: 24px; font-size: 12px; line-height: 17px; color: var(--ink3); }
.pinbar { position: fixed; z-index: 29; left: 0; right: 0; bottom: calc(var(--tabs) + var(--sab)); padding: 10px var(--gutR) 10px var(--gutL); background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }
.pinbar .in { max-width: 560px; margin: 0 auto; pointer-events: auto; }
.pinbar .btn { box-shadow: var(--shadow); }

/* 찾기 */
.hero { margin-top: 16px; }
.ask { margin-top: 16px; display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; height: 56px; border: 2px solid var(--ink); border-radius: var(--r); background: var(--surface); padding: 0 16px; font-size: 17px; outline: none; }
.ask input:focus { border-color: var(--acc); }
.ask input::placeholder { color: var(--ink3); }
.ask button { width: 56px; height: 56px; border-radius: var(--r); background: var(--btn-bg); color: var(--btn-fg); display: grid; place-items: center; font-size: 24px; flex: none; }
.chips.scroll .cnt { flex: none; font-size: 13px; color: var(--ink3); white-space: nowrap; padding-right: 2px; }
.ai { margin-top: 8px; min-height: 34px; padding: 7px 12px; border-radius: 10px; background: var(--acc-soft); color: var(--ink); font-size: 13px; line-height: 18px; display: flex; gap: 8px; align-items: center; }
.ai i { color: var(--acc-text); font-size: 17px; flex: none; }
.ai.wait, .ai.off { background: var(--well); color: var(--ink2); }
.ai.wait i { animation: spin 1.2s linear infinite; color: var(--ink3); }
.ai span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes spin { to { transform: rotate(360deg); } }
.gaphead { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--wood-soft); display: flex; gap: 10px; align-items: center; }
.gaphead i { color: var(--wood2); font-size: 22px; flex: none; }
.gaphead .grow { flex: 1; min-width: 0; font-size: 14px; line-height: 19px; }
.gaphead .grow b { display: block; font-size: 15px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 10px; margin-top: 10px; }
.card { min-width: 0; display: flex; flex-direction: column; position: relative; }
.card .open-p { text-align: left; display: block; }
.card .b { margin-top: 7px; font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .n { font-size: 13px; line-height: 17px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .p { margin-top: 3px; font-size: 15px; line-height: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

            <h1 class="h2">옷장이 비어 있어요</h1>
            <p class="t5 sub" style="margin-top:6px">첫 옷을 걸어 볼까요? 브랜드나 상품명으로 찾으면 판매처 사진이 그대로 걸려요.</p>
            <div class="doors" aria-hidden="true">${['코트·재킷', '셔츠·니트', '바지·신발'].map((t) => `<span class="ph-box"><i class="ph ph-coat-hanger"></i><span class="tag lo">${t}</span></span>`).join('')}</div>
            <button class="sbox" data-add-open=""><i class="ph ph-magnifying-glass"></i>브랜드나 상품명으로 찾아 넣기</button>
            <div class="chips" style="justify-content:center">${addExamples().map((b) => `<button class="chip ex" data-add-q="${esc(b)}">${esc(b)}</button>`).join('')}</div>
            <div style="display:flex;gap:16px;justify-content:center;margin-top:6px;flex-wrap:wrap"><button class="quiet" data-reg-open>목록에 없으면 직접 등록</button><button class="quiet" data-trial>체험용 옷장으로 먼저 보기</button></div>
          </div><p class="foot" style="margin:0">이 앱이 아는 상품 ${M.catalog.count}개 안에서 찾아요. 옷장은 비워 둬도 찾고 살 수 있어요.</p></div>
          <p class="foot">3벌만 넣으면 입을 수 있는 코디 수와 겹치는 옷을 알려 드려요. 옷장은 이 브라우저에만 저장돼요.</p>`;
      }
      const gaps = gapsOf(mine);
      const rows = ROWS.map((r) => rowHtml(r, mine.filter((g) => r.kinds.includes(g.kind))));
      const etc = mine.filter((g) => !rowOf(g.kind));
      const seen = new Set(); const first = out.list.filter((o) => !seen.has(o.key) && seen.add(o.key))[0];
      const avail = MOODS.map(([id, label]) => [id, label, moodAsk(label)]).filter((m) => m[2]);
      return `${head}${askBox}
        <div class="counts" aria-label="옷장 요약"><span>옷 <b class="num">${mine.length}</b>벌</span><span>코디 <b class="num">${out.total}</b>가지</span><span>브랜드 <b class="num">${brands.length}</b></span>${st.trialCount ? `<span class="t6" style="align-self:center">체험용 ${st.trialCount}벌 포함</span>` : ''}</div>
        <div class="wardrobe" aria-label="내 옷장">${rows.join('')}${etc.length ? `<section class="sec" aria-label="기타"><div class="h"><span class="n">기타<small class="num">${etc.length}</small></span></div><div class="shelf"><div class="items">${etc.map(tileHtml).join('')}</div><span class="plank" aria-hidden="true"></span></div></section>` : ''}
          <p class="foot">${out.total ? `코디 ${out.total}가지는 종류·색 규칙으로 센 숫자예요.` : '상의·하의·신발이 한 벌씩 모이면 코디를 세어 드려요.'} 판매처 사진이 없는 옷은 비슷한 상품 사진이에요.</p></div>
        ${gaps.length ? `<section class="section"><div class="h"><h2 class="h3">빈 자리를 채우면 코디가 늘어요</h2><span class="t6">실제 상품으로</span></div><div class="gaps">${gaps.map(({ row, n }) => `<button class="gap" data-gap="${row.id}"><span class="grow"><b>${row.name}${josa(row.name, '이', '가')} ${n ? `${n}벌뿐이에요` : '없어요'}</b><span>내 옷 ${mine.length}벌과 맞춰 보고 새 코디가 생기는 ${row.name}를 보여 드려요</span></span><i class="ph ph-arrow-right arr"></i></button>`).join('')}</div></section>` : ''}
        ${first ? `<section class="today" aria-label="오늘 뭐 입지"><div class="label"><i class="ph-fill ph-sun"></i>오늘 뭐 입지</div><h2 class="h3">내 옷으로 ${out.total}가지 중 하나</h2>${lookHtml(first, { sub: first.formulaLook ? '코디 공식' : '기본 조합' })}
          <div class="chips">${avail.map(([id, label]) => `<button class="chip ex" data-mood="${id}">${esc(label)} 코디</button>`).join('')}<button class="chip" data-tabgo="looks">전체 ${out.total}가지<i class="ph ph-caret-right"></i></button></div></section>` : `<section class="today"><div class="label"><i class="ph-fill ph-sun"></i>오늘 뭐 입지</div><h2 class="h3">상의·하의·신발이 한 벌씩 모이면 코디를 짜 드려요</h2><p class="t6" style="margin-top:4px">지금 ${mine.length}벌 · 규칙으로 조합한 예시예요</p></section>`}
        ${st.trialCount ? `<div class="notice"><span class="grow">체험용 옷 ${st.trialCount}벌이 걸려 있어요 · 내 옷을 넣으면 내려도 돼요</span><button data-mine>내리기</button></div>` : ''}
        ${received ? `<div class="notice"><span class="grow">사기로 한 옷 ${received}벌 · 받으면 기록에서 ‘계속 입을게요’를 누르면 옷장에 걸려요</span><button data-tabgo="records">기록</button></div>` : ''}
        ${brands.length ? `<section class="section"><div class="h"><h2 class="h3">모은 브랜드 <span class="t6 num">${brands.length}</span></h2></div><div class="chips">${brands.map(([b, n]) => `<button class="chip ex" data-add-q="${esc(b)}" aria-label="${esc(b)} 더 넣기">${esc(b)} <span class="num">${n}</span></button>`).join('')}</div></section>` : ''}
        <p class="foot">옷장과 기록은 이 브라우저에만 저장돼요. 직접 등록한 옷은 같은 옷을 3명이 등록하면 모두가 검색할 수 있게 돼요(서버 연결 전).</p>`;
    },

    // ── 옷장 넣기: 브랜드·품명으로 찾아 '가지고 있어요'. 목록 밖이면 직접 등록.
    add({ q = '', row = '' } = {}) {
      const r = ROWS.find((x) => x.id === row);
      return `${top({ mid: `<form class="qform" id="af" role="search"><input id="aq" value="${esc(q)}" enterkeyhint="search" autocomplete="off" placeholder="${r ? `${r.name} 브랜드나 상품명` : '브랜드나 상품명으로 찾기'}" aria-label="브랜드나 상품명"></form>` })}
        <p class="t6" style="margin-top:10px">이 앱이 아는 상품 ${M.catalog.count}개(${esc(M.catalog.store)} · ${esc(M.catalog.checkedLabel)}) 안에서 찾아요. 모든 상품이 있지는 않아요.</p>
        <div id="ares"></div>
        <button class="row" data-reg-open style="margin-top:8px"><span class="grow"><span class="t5">목록에 없어요 → 직접 등록</span><span class="t6" style="display:block">브랜드·상품명·종류·색만 적어요. 사진은 받지 않아요.</span></span><i class="ph ph-caret-right arr"></i></button>`;
    },

    // ── 직접 등록: 한 화면에 한 질문. 1 브랜드·상품명(비슷한 등록 확인) → 2 종류 → 3 색 → 4 판매처 링크(선택) → 넣기.
    reg() {
      const R = S.reg || (S.reg = { step: 1, brand: '', name: '', kind: '', color: '', url: '' });
      const steps = `<div class="steps" aria-label="단계 ${R.step}/4">${[1, 2, 3, 4].map((i) => `<i class="${i <= R.step ? 'on' : ''}"></i>`).join('')}</div>`;
      const head = top({ mid: `<span class="ttl-mid">직접 등록 ${R.step}/4</span>` });
      if (R.step === 1) return `${head}${steps}
        <h1 class="h2" style="margin-top:14px">어떤 옷이에요?</h1>
        <p class="t6" style="margin-top:4px">브랜드와 상품명을 적어 주세요. 사진은 받지 않아요(사진은 기기 밖으로 나가지 않아요).</p>
        <form id="rf1"><div class="field"><label for="rb">브랜드</label><input id="rb" value="${esc(R.brand)}" placeholder="예: 유니클로" autocomplete="off" enterkeyhint="next"></div>
        <div class="field"><label for="rn">상품명</label><input id="rn" value="${esc(R.name)}" placeholder="예: 옥스포드 슬림핏 셔츠" autocomplete="off" enterkeyhint="done"><div class="hint">택이나 주문 내역에 적힌 이름이면 다른 사람과 같은 옷으로 모여요.</div></div></form>
        <div id="dup"></div>`;
      const kinds = M.kindChoices().filter((k) => PIC.includes(k.id)).sort((a, b) => PIC.indexOf(a.id) - PIC.indexOf(b.id));
      const g0 = M.getState().gender || 'M';
      const thumbColor = (kid) => ['white', 'black', 'navy', 'grey', 'indigo', 'blue', 'beige'].find((c) => K.CUT[`${g0}|${kid}|${c}`]) || 'black';
      if (R.step === 2) return `${head}${steps}
        <h1 class="h2" style="margin-top:14px">${esc(R.brand)} ${esc(R.name)}${josa(R.name, '은', '는')} 어떤 종류예요?</h1>
        <div class="kinds">${kinds.map((k) => `<button data-k="${k.id}" aria-pressed="${R.kind === k.id}">${garmentPic({ kind: k.id, kindName: k.name, color: thumbColor(k.id), gender: g0 })}${esc(k.name)}</button>`).join('')}</div>
        <p class="t6" style="margin-top:14px">사진 대신 같은 종류·색의 비슷한 상품 사진으로 보여 드려요.</p>`;
      if (R.step === 3) return `${head}${steps}
        <h1 class="h2" style="margin-top:14px">무슨 색이에요?</h1>
        <div class="colors">${M.colorChoices().map((c) => `<button data-c="${c.id}" aria-pressed="${R.color === c.id}" aria-label="${esc(c.label)}"><i style="background:${c.hex}"></i>${esc(c.label)}</button>`).join('')}</div>`;
      const kname = kinds.find((k) => k.id === R.kind)?.name || '';
      const cl = M.colorChoices().find((c) => c.id === R.color)?.label || '';
      return `${head}${steps}
        <h1 class="h2" style="margin-top:14px">판매처 링크가 있으면 적어 주세요</h1>
        <p class="t6" style="margin-top:4px">선택이에요. 나중에 ‘같은 옷 더 사기’나 다른 사람 검색에 쓰여요.</p>
        <form id="rf4"><div class="field"><label for="ru">판매처 링크(선택)</label><input id="ru" value="${esc(R.url)}" inputmode="url" placeholder="https://" autocomplete="off" enterkeyhint="done"></div></form>
        <div class="done-card">${garmentPic({ kind: R.kind, kindName: kname, color: R.color, gender: M.getState().gender, colorLabel: cl }, { simTag: true })}<div class="grow"><div class="t6">넣을 옷</div><div class="h3">${esc(R.brand)} ${esc(R.name)}</div><div class="t6">${esc(cl)} ${esc(kname)} · 비슷한 상품 사진으로 보여요</div></div></div>
        <p class="t6" style="margin-top:14px">넣으면 내 옷장에 바로 걸리고, 공용 목록에 올라가요. 같은 옷을 ${NEED}명이 등록하면 모두가 검색할 수 있어요. 지금은 서버 연결 전이라 이 기기에만 남아요.</p>`;
    },

    // ── 옷 한 벌 페이지: 코디 n가지, 같은 옷 이미 있는 곳(중고 9곳), 상담에 물어보기.
    garment({ id }) {
      const g = M.getState().closet.find((x) => x.id === id);
      if (!g) return `${top()}<p class="t5" style="margin-top:16px">옷장에서 찾지 못했어요.</p>`;
      const reg = regOf(id); const brand = brandOf(g);
      const d = M.closetOutfits({ detail: true });
      const with_ = d.list.filter((o) => o.pieces.some((x) => x.garmentId === id));
      const seen = new Set(); const sets = with_.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 3);
      const sg = M.suggest({ limit: 6 });
      const more = sg.basis === 'closet' ? sg.items.filter((p) => (p.why || '').includes(g.label.slice(0, 8))).slice(0, 2) : [];
      const moreList = more.length ? more : (sg.basis === 'closet' ? sg.items.slice(0, 2) : []);
      const used = usedLinks(g);
      const sub = [g.color ? g.colorLabel : null, g.kindName, sourceOf(g)].filter(Boolean).join(' · ');
      const meter = reg ? `<span class="meter" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= (REG.catalog[reg.key]?.count || 1) ? 'on' : ''}"></i>`).join('')}</span>` : '';
      return `${top({ right: '<button class="tbtn" data-rm><i class="ph ph-minus-circle"></i>옷장에서 빼기</button>' })}
        <div class="gp-head"><span class="pic">${garmentPic(g, { simTag: !g.productId })}</span><div class="grow">${brand ? `<div class="b">${esc(brand)}</div>` : ''}<h1 class="h2">${esc(g.label)}</h1><div class="meta">${esc(sub)}</div>
          <div class="ac">${g.productId ? `<button class="btn line sm" data-pid="${g.productId}"><i class="ph ph-tag"></i>상품 보기</button>` : ''}<button class="btn line sm" data-gcolor><i class="ph ph-palette"></i>${g.color ? '색 바꾸기' : '색 고르기'}</button></div></div></div>
        ${reg ? `<div class="reg-state"><i class="ph ph-users-three"></i><span class="grow"><b>내 옷장에 넣었어요 · 공용 목록에 올렸어요</b>같은 옷을 ${NEED}명이 등록하면 모두가 검색할 수 있어요 (지금 ${REG.catalog[reg.key]?.count || 1}/${NEED}${meter} · 서버 연결 전에는 이 기기에만)${reg.url ? `<br><a href="${esc(reg.url)}" target="_blank" rel="noopener" class="quiet" style="min-height:32px">적어 둔 판매처 링크<i class="ph ph-arrow-up-right"></i></a>` : ''}</span></div>` : ''}
        ${g.detailMissing === '색 미확인' ? `<div class="notice"><span class="grow">색을 알려 주시면 코디에 셀 수 있어요</span><button data-gcolor>색 고르기</button></div>` : ''}
        <section class="section"><div class="h"><h2 class="h3">이 옷으로 입을 수 있는 코디 <span class="num acc">${with_.length}</span>가지</h2><span class="t6">종류·색 기준</span></div>
          ${sets.length ? `<div class="lks" style="margin-top:0">${sets.map((o) => lookHtml(o, { sub: o.formulaLook ? '코디 공식' : '기본 조합', meId: id })).join('')}</div>` : `<p class="t6">${g.detailMissing ? '색을 채우면 조합을 셀 수 있어요.' : '상의·하의·신발이 한 벌씩 있으면 조합이 생겨요. 옷장의 빈 자리를 채워 보세요.'}</p>`}
          ${with_.length > sets.length ? `<button class="quiet" data-tabgo="looks" style="margin-top:6px">전체 코디 보기<i class="ph ph-caret-right"></i></button>` : ''}</section>
        ${moreList.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2><span class="t6">실제 상품 · 수집가</span></div>${moreList.map((p) => sgRow(p)).join('')}</section>` : ''}
        <section class="used"><div class="h"><h2 class="h3"><i class="ph ph-recycle"></i>같은 옷, 이미 있는 곳 찾기</h2><span class="t6 nw">${used.total}곳</span></div>
          <p class="t6" style="margin-top:4px">하나 더 사거나 바꾸고 싶을 때, 새로 사기 전에 중고부터. 외부 검색 · 매물 확인 안 함 · ‘${esc(used.q)}’로 찾아요.</p>
          ${used.groups.map((gr) => `<p class="ug">${esc(gr.region)}</p><div class="links">${gr.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}${l.note ? `<span class="un">${esc(l.note)}</span>` : ''}</span><i class="ph ph-arrow-up-right"></i></a>`).join('')}</div>`).join('')}</section>
        <section class="section"><button class="row" data-consult-q="${esc(`내 ${g.colorLabel} ${g.kindName}(${g.label})에 어울리는 코디 알려 줘`)}" style="border-top:1px solid var(--line)"><span class="grow"><span class="t5" style="font-weight:700"><i class="ph ph-chats-circle" style="color:var(--acc-text)"></i> 이 옷으로 상담에 물어보기</span><span class="t6" style="display:block">‘${esc(g.label)}에 어울리는 코디는?’으로 시작해요</span></span><i class="ph ph-caret-right arr"></i></button></section>
        <p class="foot">${g.productId ? '판매처 사진이에요. 가격은 수집한 날의 판매가예요.' : '사진은 같은 종류·색의 비슷한 상품 사진이에요. 실제 옷과 달라요.'}</p>`;
    },

    // ── 찾기: 한 줄로 대충 말하기.
    search({ q = '' } = {}) {
      const ex = M.examples().slice(0, 4);
      const st = M.getState();
      return `${top({ back: false, right: menuBtn })}
        <h1 class="h1 hero">뭐 사려고요?<br><span class="acc">대충 말해도</span> 돼요.</h1>
        <form class="ask" id="sf" role="search"><input id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="예: 출근용 셔츠 10만원 이하" aria-label="찾는 옷" value="${esc(q)}"><button aria-label="찾기"><i class="ph ph-arrow-right"></i></button></form>
        <div class="chips">${ex.map((x) => `<button class="chip ex" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <section class="today" style="margin-top:20px"><div class="label"><i class="ph-fill ph-coat-hanger"></i>내 옷장 ${st.closetCount ? `${st.closetCount}벌 기준` : '없이도 돼요'}</div><h2 class="h3">${st.closetCount ? '겹치는 옷과 새로 생기는 코디 수를 같이 보여 드려요' : '옷장을 넣으면 겹치는 옷을 걸러 드려요'}</h2>
          <div class="chips" style="margin-top:8px"><button class="chip ex" data-tabgo="closet"><i class="ph ph-coat-hanger"></i>옷장 보기</button>${!st.closetCount ? '<button class="chip ex" data-add-open=""><i class="ph ph-plus"></i>옷 넣기</button>' : ''}</div></section>
        <p class="foot">조건에 맞는 상품은 규칙으로 고르고, 순서와 이유는 AI(Claude)가 정해요. 이 앱이 아는 상품 ${M.catalog.count}개 안에서 찾아요. 가격은 수집한 날의 판매가예요.</p>`;
    },

    results({ q, drop = [], gap = '' }) {
      const r = M.ask(q, { drop });
      const row = ROWS.find((x) => x.id === gap);
      const chips = (r.conditions || []).map((c) => c.removable ? `<button class="chip" data-drop="${esc(c.key)}" aria-label="${esc(c.label)} 조건 빼기">${esc(c.label)}<i class="ph ph-x"></i></button>` : `<span class="chip on">${esc(c.label)}</span>`).join('');
      const head = top({ mid: `<button class="qbox" data-edit="${esc(q)}" aria-label="다시 찾기: ${esc(q)}"><i class="ph ph-magnifying-glass"></i><span>${esc(q)}</span></button>` });
      S.result = null;
      if (!r.understood || !r.products.length) {
        const rel = r.understood ? M.relax(r) : [];
        const note = (r.notices || []).find((n) => n.text)?.text;
        const kindLabel = (r.conditions || []).find((c) => c.key === 'kind')?.label || '';
        const alts = [];
        if (r.understood && kindLabel) {
          const genderNotice = /남성 상품에는/.test(note || '') ? 'F' : /여성 상품에는/.test(note || '') ? 'M' : null;
          if (genderNotice) alts.push({ label: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}로 보기`, q: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}` });
          M.kindChoices().filter((k) => k.name !== kindLabel).slice(0, 5).forEach((k) => alts.push({ label: `${k.name}${josa(k.name, '으로', '로')} 보기`, q: q.includes(kindLabel) ? q.replace(kindLabel, k.name) : k.name }));
        }
        return `${head}${chips ? `<div class="chips scroll">${chips}</div>` : ''}
          <div class="empty"><h2 class="h2">${r.understood ? '조건에 맞는 옷이 없어요' : '무슨 옷인지 못 알아들었어요'}</h2>
          <p class="sub t5" style="margin-top:6px">${esc(note || (r.understood ? '다른 옷으로 바꿔 채우지 않았어요.' : '종류를 넣어 다시 말해 주세요. 예: 셔츠, 코트, 운동화'))}</p>
          ${rel.length ? `<div style="margin-top:12px">${rel.map((x) => `<button class="row" data-relax='${esc(JSON.stringify(x.drop))}'><span class="grow t5">${esc(x.title)}</span><i class="ph ph-caret-right arr"></i></button>`).join('')}</div>` : ''}
          ${alts.length ? `<p class="t6" style="margin-top:20px">대신 이렇게 볼 수도 있어요 · 고르면 그 조건으로 다시 찾아요</p><div class="chips">${alts.map((a) => `<button class="chip ex" data-q="${esc(a.q)}">${esc(a.label)}</button>`).join('')}</div>` : ''}
          ${!rel.length && !alts.length ? `<div class="chips" style="margin-top:18px">${M.examples().slice(0, 3).map((x) => `<button class="chip ex" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
          <p class="foot">이 앱이 아는 상품 ${M.catalog.count}개 안에서만 찾아요.</p></div>`;
      }
      S.result = r;
      const basis = M.judge(r.products[0].id)?.basisLabel || '';
      const list = r.products.slice(0, 12);
      const order = S.aiOrder[q];
      const sorted = order ? [...list].sort((a, b) => (order[a.id] ?? 99) - (order[b.id] ?? 99)) : list;
      S.shown = { main: sorted, off: (r.offOccasion || []).slice(0, 6) }; S.curQ = q;
      const mine = M.getState().closet.length;
      return `${head}
        ${row ? `<div class="gaphead"><i class="ph ph-coat-hanger"></i><span class="grow"><b>옷장의 ${row.name} 자리를 채워요</b>내 옷 ${mine}벌과 맞춰 보고 새 코디가 생기는 옷에 ‘새 코디 +n’을 붙였어요</span></div>` : ''}
        <div class="chips scroll" aria-label="조건"><span class="cnt num">${r.products.length}개 · ${esc(basis.replace(' 판단했어요', ''))}</span>${chips}</div>
        <div class="ai ${order ? '' : 'wait'}" id="ai" role="status">${order ? `<i class="ph-fill ph-sparkle"></i><span>${esc(S.aiSummary[q] || 'AI가 후보 순서를 정했어요')}</span>` : '<i class="ph ph-circle-notch"></i><span>AI가 후보 순서를 정하는 중이에요</span>'}</div>
        <div class="grid" id="grid">${gridHtml(sorted)}</div>
        ${r.offOccasion?.length ? `<section class="offh"><h2 class="h3">${esc(r.offOccasionTitle || '상황과 덜 맞는 옷')}</h2><div class="grid" id="offgrid">${gridHtml(S.shown.off)}</div></section>` : ''}
        <p class="foot">후보는 조건에 맞는 상품을 규칙으로 골랐고, 순서와 이유는 AI(Claude)가 상품 정보·평점·후기·내 옷장만 보고 정해요. 가격은 수집한 날의 판매가예요.</p>`;
    },

    detail({ id }) {
      const p = M.product(id);
      if (!p) return `${top()}<p class="t5">상품을 찾지 못했어요.</p>`;
      const ai = S.ai[id]; const v = p.verdict; const same = sameOwned(v); const looks = (v.looks || []).slice(0, 2);
      const nvu = M.newVsUsed(id); const d = delta(id);
      const inCloset = M.getState().closet.some((g) => g.productId === id);
      let head;
      if (inCloset) head = '이미 내 옷장에 <b>걸려 있어요</b>';
      else if (v.basis === 'none') head = '옷장이 비어 있어서 겹치는지 몰라요';
      else if (same.length) head = `비슷한 옷이 <b>${same.length}벌</b> 걸려 있어요`;
      else if (v.newLookCount) head = `옷장에 걸면 새 코디가 <b>${v.newLookCount}개</b> 생겨요`;
      else head = esc(v.title);
      const sub = inCloset ? '같은 상품이 옷장에 있어요. 하나 더 사기 전에 중고부터 찾아볼 수 있어요.' : v.basis === 'none' ? '옷장에 3벌만 넣으면 겹치는지와 새 코디 수를 알려 드려요.' : (v.lines?.[0] || '');
      const total = nvu.used.groups.reduce((a, g) => a + g.links.length, 0);
      return `${top()}
        <div class="pdp"><div class="pdp-photo"><span class="ph-box" style="display:block"><button class="zoomb" data-zoom="${id}" aria-label="사진 크게 보기">${productPic(id).replace(/^<span class="ph-box">|<\/span>$/g, '')}</button></span></div>
        <div>
        <div class="pdp-head"><div class="b">${esc(p.brand)}</div><h1 class="h2" style="margin-top:2px">${esc(p.name)}</h1>
          <div class="pricetag num"><b>${esc(p.priceText)}</b><small>${esc(p.priceNote)}</small></div>
          <p class="t6" style="margin-top:6px">${esc(p.colorLabel)} · ${esc(p.slotName)}${p.rating ? ` · 평점 ${esc(p.rating)} · 후기 ${Number(p.reviews || 0).toLocaleString('ko-KR')}개` : ''}</p></div>
        ${ai?.reason ? `<section class="box ai-why" aria-label="AI 이유"><div class="label"><i class="ph-fill ph-sparkle"></i>AI 순위 ${ai.rank}위${ai.fit ? ` · ${esc(ai.fit)}` : ''}</div><p class="h3">${esc(ai.reason)}</p></section>` : ''}
        <section class="box" id="closetbox" aria-label="내 옷장과"><div class="label"><i class="ph ph-coat-hanger"></i>내 옷장과 · ${esc(v.basisLabel)}</div>
          <h2 class="h2">${head}</h2>
          ${sub ? `<p class="t5 sub">${esc(sub)}</p>` : ''}
          ${same.length ? `<div class="owned">${same.map((o) => `<div class="o">${garmentPic(o)}<div class="t6">${esc(o.colorLabel)} ${esc(o.kindName)}${o.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : ''}
          ${looks.length ? `<div class="looks2">${looks.map((l) => { const ps = l.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4); return `<div class="lk"><div class="ps">${ps.map((x) => `<div class="p1${x.candidate ? ' me' : ''}">${piecePic(x)}<div class="t6">${x.candidate ? '이 옷' : `${esc(x.colorLabel)} ${esc(x.kindName)}${x.trial ? ' · 체험용' : ''}`}</div></div>`).join('')}</div><div class="cap">${esc(l.title || '')}${l.new ? ' · 새 코디' : ''} · 규칙으로 조합한 예시</div></div>`; }).join('')}</div>` : ''}
          <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap">${inCloset ? '<button class="quiet" data-tabgo="closet">옷장에서 보기</button>' : `<button class="quiet" data-own-add="${id}"><i class="ph ph-plus"></i>이 옷 이미 있어요 · 옷장에 걸기</button>`}${v.basis === 'none' ? '<button class="quiet" data-add-open="">옷장에 넣기</button>' : ''}</div>
        </section>
        <section class="used" aria-label="중고로 찾기"><div class="h"><h2 class="h3"><i class="ph ph-recycle"></i>이미 있는 걸 먼저 찾기</h2><span class="t6 nw">중고 ${total}곳</span></div>
          <p class="t6" style="margin-top:4px">외부 검색 · 매물 확인 안 함 · ${esc(nvu.used.groups[0] ? `국내는 ‘${p.brand} ${p.name}’으로 같은 상품을, 해외는 비슷한 종류·색을 찾아요.` : '')}</p>
          ${nvu.used.groups.map((g) => `<p class="ug">${esc(g.region)}</p><div class="links">${g.links.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener"><span>${esc(l.label)}${l.note ? `<span class="un">${esc(l.note)}</span>` : ''}</span><i class="ph ph-arrow-up-right"></i></a>`).join('')}</div>`).join('')}</section>
        <p class="foot">${esc(v.fine || '')}</p>
        </div></div>`;
    },

    // ── 오늘 뭐 입지: 내 옷으로 입을 수 있는 조합, 상황별(엔진이 읽는 상황만), '한 벌만 더 있으면'.
    looks({ mood = '' } = {}) {
      const st = M.getState(); const mine = st.closet;
      const head = top({ back: false, right: menuBtn });
      if (!mine.length) {
        return `${head}<h1 class="h1" style="margin-top:12px">오늘 뭐 입지, 내 옷으로 짜 드려요</h1>
          <p class="t5 sub" style="margin-top:4px">상의·하의·신발 3벌만 넣으면 입을 수 있는 조합과 ‘한 벌만 더 있으면’을 보여 드려요.</p>
          <div class="today"><div class="label"><i class="ph-fill ph-coat-hanger"></i>시작은 3벌</div><h2 class="h3">브랜드나 상품명으로 찾아 넣어 주세요</h2><button class="sbox" data-add-open="" style="margin-top:12px"><i class="ph ph-magnifying-glass"></i>브랜드나 상품명으로 찾기</button>
            <div style="display:flex;gap:16px;margin-top:4px"><button class="quiet" data-trial>체험용 옷장으로 먼저 보기</button><button class="quiet" data-reg-open>직접 등록</button></div></div>`;
      }
      const avail = MOODS.map(([id, label]) => [id, label, moodAsk(label)]).filter((m) => m[2]);
      const cur = avail.find((m) => m[0] === mood) || null;
      const chips = `<div class="chips scroll moods" aria-label="상황"><button class="chip ${cur ? 'ex' : ''}" data-mood="" aria-pressed="${!cur}">내 옷 전체</button>${avail.map(([id, label]) => `<button class="chip ${cur?.[0] === id ? '' : 'ex'}" data-mood="${id}" aria-pressed="${cur?.[0] === id}">${esc(label)}</button>`).join('')}</div>`;
      if (!cur) {
        const d = M.closetOutfits({ detail: true });
        const seen = new Set(); const list = d.list.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 12);
        const sg = M.suggest({ limit: 3 }); const sgRows = sg.basis === 'closet' ? sg.items : [];
        return `${head}<h1 class="h1" style="margin-top:12px">내 옷 ${mine.length}벌로 <span class="num">${d.total}</span>가지</h1>
          <p class="t5 sub" style="margin-top:4px">${d.total ? `코디 공식 ${d.formulas}개 · 기본 조합 ${d.basic}개 · 종류·색 기준` : '상의·하의·신발이 한 벌씩 있으면 조합이 생겨요'}</p>
          ${chips}
          ${list.length ? `<div class="lks">${list.map((o) => lookHtml(o, { sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : `<div class="empty"><h2 class="h2">아직 조합이 없어요</h2><p class="t5 sub" style="margin-top:6px">상의·하의·신발을 한 벌씩 넣으면 바로 세어 드려요.</p><button class="btn line wide sm" data-tabgo="closet" style="margin-top:12px"><i class="ph ph-coat-hanger"></i>옷장의 빈 자리 보기</button></div>`}
          ${sgRows.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2><span class="t6">내 옷과 함께 쓰는 코디 공식</span></div>${sgRows.map((p) => sgRow(p)).join('')}<p class="t6" style="margin-top:8px">규칙으로 고른 실제 상품이에요. 가격은 수집한 날의 판매가예요.</p></section>` : ''}
          <p class="foot">${esc(d.note)}</p>`;
      }
      const r = cur[2]; const o = r.outfit;
      const cands = o ? o.pieces.filter((x) => !x.owned && x.product) : [];
      const condText = (r.conditions || []).map((c) => c.label).join(' · ');
      return `${head}<h1 class="h1" style="margin-top:12px">${esc(cur[1])} 코디</h1>
        <p class="t5 sub" style="margin-top:4px">${o ? (o.buyCount ? `내 옷 ${o.ownedCount}벌에 ${o.buyCount === 1 ? '한 벌만' : `${o.buyCount}벌`} 더하면 돼요` : `내 옷 ${o.ownedCount}벌로 입을 수 있어요`) : '내 옷으로는 아직 맞는 코디 공식이 없어요'}</p>
        ${chips}
        ${o ? `<div class="lks">${lookHtml(o, { sub: esc(condText), owned: !o.buyCount })}</div>` : `<div class="empty" style="margin-top:20px"><p class="t5 sub">${esc(r.outfitNote || `${cur[1]} 조건에 맞는 코디 공식이 내 옷만으로는 아직 없어요. 조건을 풀지 않았어요.`)}</p></div>`}
        ${cands.length ? `<section class="section"><div class="h"><h2 class="h3">한 벌만 더 있으면</h2><span class="t6">${esc(condText)} 조건 안에서</span></div>${cands.map((x) => sgRow(M.product(x.product.id) || x.product, `${cur[1]} 코디의 ${x.kindName} 자리`)).join('')}</section>` : ''}
        ${r.products.length ? `<button class="row" data-q="${esc(r.text)}" style="margin-top:8px"><span class="grow t5">${esc(cur[1])} 조건에 맞는 옷 ${r.products.length}개 더 보기</span><i class="ph ph-caret-right arr"></i></button>` : ''}
        <p class="foot">조합은 정해 둔 코디 공식과 종류·색 규칙으로 고른 예시예요. 핏·소재·현재 가격은 판매처에서 확인해요.</p>`;
    },

    consult() {
      const th = C.thread();
      if (!th) {
        const list = [...C.threads].sort((a, b) => String(b.at).localeCompare(String(a.at)));
        return `${top({ back: false, right: list.length ? '<button class="tbtn" data-delall>모두 지우기</button>' : '' })}
          <h1 class="h1" style="margin-top:12px">코디 상담</h1>
          <p class="t5 sub" style="margin-top:4px">옷·코디 이야기만 할 수 있어요. 내 옷장을 보고 답해요.</p>
          <div class="chips">${CHAT_EX.map((q) => `<button class="chip ex" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>
          ${list.length ? `<section class="section"><div class="h"><h2 class="h3">이전 상담 <span class="t6 num">${list.length}</span></h2><span class="t6">누르면 이어서 물어봐요</span></div>
            <div class="hist">${list.map((t) => `<div class="hrow"><button class="grow" data-thread="${t.id}"><span class="n">${esc(t.title)}</span><span class="t6">${esc(whenText(t.at))} · 주고받은 말 ${t.turns.filter((x) => x.role !== 'note').length}개</span></button><button class="icon" data-delthread="${t.id}" aria-label="이 상담 지우기"><i class="ph ph-trash"></i></button></div>`).join('')}</div></section>` : '<p class="t6" style="margin-top:20px">상담 내용은 이 브라우저에만 남아요. 다음에 와서 이어서 물어볼 수 있어요.</p>'}
          <p class="foot">AI 답변이라 틀릴 수 있어요 · 옷·코디 주제만 답해요. 상품 가격은 수집한 날의 판매가예요.</p>`;
      }
      const body = th.turns.map((x) => {
        if (x.role === 'user') return `<div class="msg me">${esc(x.text)}</div>`;
        if (x.role === 'note') return `<div class="msg err" role="status">${esc(x.text)}</div>`;
        if (x.refused) return `<div class="msg bot refuse"><span class="who"><i class="ph ph-hand"></i>상담 범위 밖이에요</span>${esc(x.text)}</div>`;
        return `<div class="msg bot"><span class="who"><i class="ph-fill ph-sparkle"></i>AI 코디 상담</span>${esc(x.text)}</div>${x.ids?.length ? `<div class="recs">${x.ids.map(recCard).join('')}</div>` : ''}`;
      }).join('');
      return `${top({ back: false, right: '<button class="tbtn" data-chatlist><i class="ph ph-list-bullets"></i>이전 상담</button><button class="tbtn" data-newchat>새 상담</button>' })}
        <div class="ttl"><i class="ph ph-chats-circle"></i><span class="grow">${esc(th.title)}</span><span class="t6 nw">${esc(whenText(th.at))}</span></div>
        <div class="thread" id="thread" aria-live="polite">${body}${C.busy ? '<div class="msg bot wait" role="status"><span class="who"><i class="ph ph-circle-notch"></i>생각하는 중이에요</span></div>' : ''}</div>
        <p class="foot">AI 답변이라 틀릴 수 있어요 · 옷·코디 주제만 답해요. 이 상담은 이 브라우저에 남아요.</p>`;
    },

    records() {
      const all = M.getState().records.filter((r) => r.decision);
      const decided = all.filter((r) => r.decision !== 'hold');
      const buy = all.filter((r) => r.decision === 'buy');
      const holds = all.filter((r) => r.decision === 'hold');
      const sum = buy.reduce((a, r) => a + (r.product?.price || 0), 0);
      const waiting = buy.filter((x) => ['candidate', 'ordered', 'received'].includes(x.stage));
      const byDay = new Map();
      all.forEach((r) => { const k = dayKey(r.updatedAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(r); });
      const stage = (r) => r.decision === 'buy' ? (r.stage === 'candidate' ? '주문 전' : r.stageLabel) : (r.stage === 'candidate' ? '' : r.stageLabel);
      return `${top({ back: false })}
        <h1 class="h1" style="margin-top:12px">${decided.length ? `<span class="num">${decided.length}</span>벌을 정했어요` : holds.length ? `보류 <span class="num">${holds.length}</span>벌 · 아직 정하지 않았어요` : '아직 정한 옷이 없어요'}</h1>
        <p class="t5 sub" style="margin-top:4px">${all.length ? '직접 남긴 기록이에요. 보류는 정한 것으로 세지 않아요.' : '상품에서 살지 정하면 여기에 남아요. 받은 옷은 옷장에 걸려요.'}</p>
        ${all.length ? `<div class="sum"><div class="c"><div class="k">살게요</div><div class="v num">${buy.length}</div>${sum ? `<div class="t6 num nw" style="font-size:12px">${won(sum)} 수집가</div>` : ''}</div><div class="c"><div class="k">보류</div><div class="v num">${holds.length}</div></div><div class="c"><div class="k">안 살래요</div><div class="v num">${all.length - buy.length - holds.length}</div></div></div>` : ''}
        ${waiting.length ? `<section class="section"><div class="h"><h2 class="h3">사기로 한 옷</h2><span class="t6">받고 계속 입으면 옷장에 걸려요</span></div>
          ${waiting.map((x) => { const nx = (x.next || []).find((n) => !n.needsReason); return `<div class="wait-row">${productPic(x.productId)}<span class="grow"><span class="n">${esc(x.product?.name || '')}</span><span class="t6">${esc(x.stageLabel)}</span></span>${nx ? `<button class="btn ${nx.step === 'kept' ? 'go' : 'soft'}" data-adv="${x.productId}" data-step="${nx.step}">${nx.step === 'kept' ? '계속 입을게요 · 옷장에' : esc(nx.label)}</button>` : ''}</div>`; }).join('')}</section>` : ''}
        <div class="tl">${[...byDay.entries()].map(([d, rs]) => `<div class="day">${esc(d)}</div>${rs.map((r) => `<button class="rec" data-pid="${r.productId}">${productPic(r.productId)}<span class="grow"><span class="n">${esc(r.product?.name || '')}</span><span class="t6"><span class="pill ${r.decision === 'buy' ? 'buy' : ''}">${DEC[r.decision]}</span>${stage(r) ? ` ${esc(stage(r))}` : ''}</span></span><span class="pr num">${esc(r.product?.priceText || '')}</span></button>`).join('')}`).join('') || '<button class="btn soft wide" data-tabgo="search" style="margin-top:20px">옷 찾으러 가기</button>'}</div>`;
    },
  };

  // 결과 카드: 사진·브랜드·품명·옷장 비교·수집가·AI 이유(있을 때). 누르면 상세.
  function cardHtml(p, ai) {
    const d = delta(p.id);

  // ── 상세의 결정: 주 행동은 '판매처에서 사기' 하나. 결정은 조용한 글자 버튼(살게요·보류·안 살래요)으로 남긴다.
  function drawDecision(id) {
    const p = M.product(id); if (!p) return;
    const rec = p.verdict.record; const nvu = M.newVsUsed(id); const dec = rec?.decision;
    const meta = dec
      ? `<span class="fb" role="status"><i class="ph-fill ph-check-circle"></i><span class="nt" style="color:inherit">${esc(DEC[dec])}로 남겼어요${rec.stage !== 'candidate' ? ` · ${esc(rec.stageLabel)}` : dec === 'buy' ? ' · 주문·도착은 기록에서' : ''}</span></span><span class="qs">${rec.stage === 'candidate' ? '<button class="quiet" data-redecide>바꾸기</button>' : '<button class="quiet" data-tabgo="records">기록</button>'}</span>`
      : `<span class="pr"><b class="num">${esc(p.priceText)}</b><span class="nt">${esc(p.priceNote)} · ${esc(nvu.fresh.store)} · 현재 가격은 판매처에서</span></span><span class="qs"><button class="quiet" data-dec="buy">살게요</button><button class="quiet" data-dec="hold">보류</button><button class="quiet" data-dec="skip">안 살래요</button></span>`;
    $('#bar').innerHTML = `<div class="buybar"><div class="in"><div class="meta">${meta}</div><a class="btn go wide" href="${esc(p.url)}" target="_blank" rel="noopener" data-seller="${id}">판매처에서 사기<i class="ph ph-arrow-up-right"></i></a></div></div>`;
    $$('[data-dec]').forEach((b) => { b.onclick = () => decide(id, b.dataset.dec); });
    $('[data-redecide]') && ($('[data-redecide]').onclick = () => decisionSheet(id));
  }
  function decide(id, dec) {
    const rec = M.product(id)?.verdict.record;
    if (rec && rec.stage !== 'candidate') return;
    if (dec === 'clear') M.removeRecord(id); else M.decide(id, dec);
    drawDecision(id);
  }
  function decisionSheet(id) {
    const p = M.product(id); if (!p || $('.sheet')) return;
    const has = !!p.verdict.record?.decision;
    const sh = sheet(`<h2 class="h2">어떻게 할까요?</h2><p class="t6 sub">${esc(p.brand)} ${esc(p.name)} · ${esc(p.priceText)}</p>

  // ── 직접 등록 흐름. 1단계에서 비슷한 등록(이 앱이 아는 상품·이 기기의 공용 목록)을 찾아 보여 준다.
  function wireReg() {
    const R = S.reg;
    const bar = (html) => { $('#bar').innerHTML = `<div class="regbar"><div class="in">${html}</div></div>`; };
    if (R.step === 1) {
      const rb = $('#rb'), rn = $('#rn'); let t;
      const dupBox = $('#dup');
      const upd = () => {
        R.brand = rb.value.trim(); R.name = rn.value.trim();
        const okb = R.brand.length >= 1 && R.name.length >= 2;
        $('#rnext').disabled = !okb;
        clearTimeout(t); t = setTimeout(() => {
          if (!okb) { dupBox.innerHTML = ''; return; }
          // 비슷한 등록 찾기: 브랜드+상품명 → 상품명 → 상품명의 낱말(긴 것부터) 순으로, 처음 걸리는 것 3개.
          let hits = [];
          try { const tries = [`${R.brand} ${R.name}`, R.name, ...R.name.split(/\s+/).filter((w) => w.length >= 2).sort((a, b) => b.length - a.length)]; for (const t of tries) { hits = M.findProducts(t, { limit: 3 }); if (hits.length) break; } } catch {}
          const key = normKey(R.brand, R.name);
          const local = Object.values(REG.catalog).filter((c) => c.key !== key && (c.key.includes(key) || key.includes(c.key))).slice(0, 2);
          const mineHas = (id) => M.getState().closet.some((g) => g.productId === id);
          if (!hits.length && !local.length) { dupBox.innerHTML = `<p class="t6" style="margin-top:14px">이 앱이 아는 상품 ${M.catalog.count}개와 이 기기의 등록 목록에 비슷한 이름이 없어요. 새로 등록해요.</p>`; return; }
          dupBox.innerHTML = `<div class="dup"><h3 class="h3"><i class="ph ph-question"></i>비슷한 등록이 있어요?</h3><p class="t6" style="margin-top:2px">같은 옷이면 눌러서 바로 넣어요. 아니면 아래 ‘다음’으로 계속 등록해요.</p>
            ${hits.map((p) => `<div class="srow" data-srow="${p.id}">${productPic(p.id)}<span class="grow"><span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="m">이 앱이 아는 상품 · 판매처 사진</span></span>${mineHas(p.id) ? '<span class="ok"><i class="ph-fill ph-check-circle"></i>옷장에 있어요</span>' : `<button class="btn line sm" data-dup-own="${p.id}">이거예요</button>`}</div>`).join('')}
            ${local.map((c) => `<div class="srow">${garmentPic({ kind: c.kind, color: c.color, gender: M.getState().gender })}<span class="grow"><span class="b">${esc(c.brand)}</span><span class="n">${esc(c.name)}</span><span class="m">이 기기에서 직접 등록 · ${c.count}/${NEED}</span></span><button class="btn line sm" data-dup-reg="${esc(c.key)}">이거예요</button></div>`).join('')}</div>`;
          $$('[data-dup-own]', dupBox).forEach((b) => { b.onclick = async () => { let g; try { g = M.addOwnedProduct(b.dataset.dupOwn); } catch (err) { K.toast(err.message, { bottom: 96 }); return; } const go = () => K.go('garment', { id: g.id }, { replace: true }); if (!g.color) pickColor(g.id, M.product(g.id)?.kindName || '옷', null, go); else go(); }; });
          $$('[data-dup-reg]', dupBox).forEach((b) => { b.onclick = () => { const c = REG.catalog[b.dataset.dupReg]; if (!c) return; Object.assign(R, { brand: c.brand, name: c.name, kind: c.kind, color: c.color, url: c.url || '', step: 4 }); K.refresh(); }; });
        }, 160);
      };
      bar('<button class="btn go" id="rnext" disabled>다음 · 종류 고르기</button>');
      rb.oninput = rn.oninput = upd; upd();
      $('#rf1').onsubmit = (e) => { e.preventDefault(); if (!$('#rnext').disabled) { R.step = 2; K.refresh(); } else (R.brand ? rn : rb).focus(); };
      $('#rnext').onclick = () => { R.step = 2; K.refresh(); };
      if (!R.brand) setTimeout(() => rb.focus(), 60);
      const pre = curParams.q; if (pre && !R.brand && !R.name) { const [b, ...rest] = pre.split(' '); rb.value = b; rn.value = rest.join(' '); upd(); }
      return;
    }
    if (R.step === 2) {
      bar('<button class="btn soft" data-prev>이전</button><button class="btn go" id="rnext" disabled>다음 · 색 고르기</button>');
      const next = () => { R.step = 3; K.refresh(); };
      $$('[data-k]').forEach((b) => { b.onclick = () => { R.kind = b.dataset.k; $$('[data-k]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#rnext').disabled = false; setTimeout(next, 160); }; });
      $('#rnext').disabled = !R.kind; $('#rnext').onclick = next; $('[data-prev]').onclick = () => { R.step = 1; K.refresh(); };
      return;
    }
    if (R.step === 3) {
      bar('<button class="btn soft" data-prev>이전</button><button class="btn go" id="rnext" disabled>다음 · 링크(선택)</button>');
      const next = () => { R.step = 4; K.refresh(); };
      $$('[data-c]').forEach((b) => { b.onclick = () => { R.color = b.dataset.c; $$('[data-c]').forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#rnext').disabled = false; setTimeout(next, 160); }; });
      $('#rnext').disabled = !R.color; $('#rnext').onclick = next; $('[data-prev]').onclick = () => { R.step = 2; K.refresh(); };
      return;
    }
    bar('<button class="btn soft" data-prev>이전</button><button class="btn go" id="rdone"><i class="ph ph-coat-hanger"></i>옷장에 넣기</button>');
    $('[data-prev]').onclick = () => { R.step = 3; K.refresh(); };
    const done = () => {
      const url = $('#ru').value.trim();
      if (url && !/^https?:\/\/\S+$/i.test(url)) { K.toast('링크는 https://로 시작해야 해요', { bottom: 96 }); $('#ru').focus(); return; }
      R.url = url;
      const kname = M.kindChoices().find((k) => k.id === R.kind)?.name || '';
      const label = R.name.trim().slice(0, 80); // 브랜드는 따로 저장해 타일·페이지에서 한 번만 보인다.
      const before = M.getState().closetCount ? M.closetOutfits().total : 0;
      let g; try { g = M.addGarment({ kind: R.kind, color: R.color, slot: M.slotChoices(R.kind)[0]?.id || null, label }); } catch (err) { K.toast(err.message, { bottom: 96 }); return; }
      const key = normKey(R.brand, R.name);
      const c = REG.catalog[key] || { key, brand: R.brand, name: R.name, kind: R.kind, color: R.color, url: R.url, count: 0, mine: true, at: new Date().toISOString() };
      if (!c.mine || !c.count) c.count = Math.min(NEED, c.count + 1); // 같은 사람이 또 등록해도 한 명으로 센다.
      c.mine = true; if (R.url) c.url = R.url; REG.catalog[key] = c;
      REG.items[g.id] = { brand: R.brand, name: R.name, kind: R.kind, kindName: kname, color: R.color, url: R.url, key, at: new Date().toISOString() };
      saveReg();
      const gain = M.closetOutfits().total - before;
      S.reg = null;
      K.go('garment', { id: g.id }, { replace: true });
      K.toast(`내 옷장에 넣었어요${gain > 0 ? ` · 코디 +${gain}` : ''} · 같은 옷 등록 ${c.count}/${NEED}`, { bottom: 96 });
    };
    $('#rdone').onclick = done; $('#rf4').onsubmit = (e) => { e.preventDefault(); done(); };
  }

  function menu() {
    const sh = sheet(`<div class="menu"><button class="row" data-info><span class="grow t5">이 시안에 대해</span><i class="ph ph-info arr"></i></button><button class="row" data-theme><span class="grow t5">밝게 · 어둡게</span><i class="ph ph-moon arr"></i></button><button class="row" data-reset><span class="grow t5">처음부터 다시</span><i class="ph ph-arrow-counter-clockwise arr"></i></button></div>`);
    $('[data-info]', sh.s).onclick = async () => { await sh.close(); M.openDisclosure ? M.openDisclosure() : K.info(DESIGN); };
    $('[data-theme]', sh.s).onclick = async () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; await sh.close(); };
    $('[data-reset]', sh.s).onclick = async () => { K.reset(); S.ai = {}; S.aiOrder = {}; S.aiSummary = {}; REG.items = {}; REG.catalog = {}; saveReg(); await sh.close(); K.tab('closet'); };
  }

  const r0 = M.route.current();
  K.start(render, { view: 'closet', params: {} });
  if (M.boot?.q) K.go('results', { q: M.boot.q });
  else if (/^\/p\/.+/.test(r0.path)) K.go('detail', { id: r0.path.slice(3) });
  else if (r0.path === '/search' && r0.params.q) K.go('results', { q: r0.params.q });
  else if (['/records', '/consult', '/looks', '/search'].includes(r0.path)) K.tab(r0.path.slice(1));
  else if (r0.path === '/add') K.go('add', {});
})();
</script>
