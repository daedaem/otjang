<style>
/* 에디토리얼 쇼룸(d13): 사진이 화면이고, 글자는 Pretendard 한 가족의 크기·회색 농도로만 위계를 만든다.
   사진 칸은 전부 3:4, 같은 밝은 바탕, 모서리 2px. 색은 사진에서만 나오고, 강조색(와인)은 AI 이유·새 코디·'같은 옷, 이미 있는 곳'에만 쓴다.
   주 행동은 화면에 하나, 검정. 글자 단계 28 · 20 · 16 · 15 · 13 · 12. 고정 영역: 위 48 + 탭 50. */
:root {
  --bg: #f7f7f5; --surface: #ffffff; --well: #eeeeeb; --ptile: #ebebe7; --tile2: #e4e4df;
  --ink: #161615; --ink2: #5b5b56; --ink3: #8a8a83; --line: #e2e2dd; --line2: #cfcfc8;
  --acc: #7a1f2b; --acc-text: #7a1f2b; --acc-soft: #f6eaec;
  --btn-bg: #161615; --btn-fg: #ffffff; --dim: rgba(20, 18, 16, .5); --shadow: 0 12px 32px rgba(30, 24, 20, .14);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --gutL: max(16px, env(safe-area-inset-left, 0px)); --gutR: max(16px, env(safe-area-inset-right, 0px));
  --top: 48px; --tabs: 50px; --sab: env(safe-area-inset-bottom, 0px); --r: 2px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131312; --surface: #1b1b1a; --well: #242422; --ptile: #e6e6e2; --tile2: #2c2c29;
  --ink: #f2f2ee; --ink2: #c3c3bb; --ink3: #95958d; --line: #2e2e2b; --line2: #44443f;
  --acc: #e39aa4; --acc-text: #e8a7b0; --acc-soft: #3a2226;
  --btn-bg: #f2f2ee; --btn-fg: #131312; --dim: rgba(0, 0, 0, .64); --shadow: 0 12px 32px rgba(0, 0, 0, .55); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131312; --surface: #1b1b1a; --well: #242422; --ptile: #e6e6e2; --tile2: #2c2c29;
  --ink: #f2f2ee; --ink2: #c3c3bb; --ink3: #95958d; --line: #2e2e2b; --line2: #44443f;
  --acc: #e39aa4; --acc-text: #e8a7b0; --acc-soft: #3a2226;
  --btn-bg: #f2f2ee; --btn-fg: #131312; --dim: rgba(0, 0, 0, .64); --shadow: 0 12px 32px rgba(0, 0, 0, .55); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 400 15px/1.55 var(--font); letter-spacing: -.005em; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; --k-font: var(--font); --k-toast-bg: var(--ink); --k-toast-fg: var(--bg); --k-info-bg: var(--surface); --k-info-fg: var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; text-align: left; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
.ph, .ph-fill { line-height: 1; }
.num { font-variant-numeric: tabular-nums; }
.nw { white-space: nowrap; }
[hidden] { display: none !important; }

.app { max-width: 600px; margin: 0 auto; padding: 0 var(--gutR) calc(var(--tabs) + 32px + var(--sab)) var(--gutL); }
.app.bar { padding-bottom: calc(124px + var(--sab)); }
.app.chat { padding-bottom: calc(var(--tabs) + 86px + var(--sab)); }
.app.form { padding-bottom: calc(104px + var(--sab)); }
.app.shelfv { padding-bottom: calc(104px + var(--sab)); }
.view { animation: in 220ms ease-out both; }
.view.back { animation-name: inback; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes inback { from { opacity: 0; } to { opacity: 1; } }

/* 글자 단계 */
.h1 { font-size: 28px; line-height: 36px; font-weight: 500; letter-spacing: -.025em; margin: 0; text-wrap: balance; }
.h2 { font-size: 20px; line-height: 28px; font-weight: 500; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.h3 { font-size: 16px; line-height: 24px; font-weight: 600; margin: 0; }
.t5 { font-size: 15px; line-height: 22px; }
.t6 { font-size: 13px; line-height: 19px; color: var(--ink3); }
.eyebrow { font-size: 12px; line-height: 16px; letter-spacing: .06em; font-weight: 600; color: var(--ink3); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
.eyebrow i { font-size: 14px; }
.eyebrow.acc { color: var(--acc-text); }
.sub { color: var(--ink2); }
.acc { color: var(--acc-text); }
.rule { border: 0; border-top: 1px solid var(--line); margin: 24px 0 0; }

/* 위 막대 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; height: var(--top); display: flex; align-items: center; gap: 2px; margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); padding: 0 calc(var(--gutR) - 8px) 0 calc(var(--gutL) - 8px); background: var(--bg); }
.top .sp { flex: 1; }
.icon { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; color: var(--ink); flex: none; border-radius: 50%; }
.icon:active { background: var(--well); }
.icon.quiet-i { color: var(--ink3); font-size: 20px; }
.mark { display: inline-flex; align-items: baseline; gap: 8px; padding-left: 8px; font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.mark small { font-size: 12px; font-weight: 500; color: var(--ink3); letter-spacing: .04em; }
.qbox { flex: 1; min-width: 0; height: 38px; margin: 0 4px; border-bottom: 1px solid var(--ink); display: flex; align-items: center; gap: 8px; padding: 0 4px; font-size: 15px; font-weight: 500; }
.qbox i { font-size: 18px; color: var(--ink3); flex: none; }
.qbox span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbtn { height: 40px; padding: 0 10px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; color: var(--ink2); }
.tbtn i { font-size: 18px; }

/* 버튼 */
.btn { min-height: 52px; padding: 0 20px; border-radius: 4px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform 120ms ease; white-space: nowrap; letter-spacing: -.005em; }
.btn:active { transform: scale(.985); }
.btn.go { background: var(--btn-bg); color: var(--btn-fg); }
.btn.soft { background: var(--well); color: var(--ink); }
.btn.line { border: 1px solid var(--line2); color: var(--ink); background: transparent; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 44px; font-size: 14px; padding: 0 14px; }
.btn:disabled { opacity: .45; }
.quiet { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 500; color: var(--ink2); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line2); white-space: nowrap; }
.quiet i { font-size: 16px; }

/* 탭 */
.tabs { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); box-shadow: 0 -1px 0 var(--line); padding: 0 env(safe-area-inset-right, 0px) var(--sab) env(safe-area-inset-left, 0px); }
.tabs .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { height: var(--tabs); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; line-height: 14px; font-weight: 500; color: var(--ink3); white-space: nowrap; }
.tabs button i { font-size: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); }

/* 사진 칸: 전부 3:4, 같은 바탕, 모서리 2px. 흰 배경 단독 사진은 바탕에 녹이고 모델 사진은 채운다. */
.ph-box { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: var(--r); background: var(--ptile); overflow: hidden; display: grid; place-items: center; }
.ph-box img { display: block; }
.ph-box img.cover { width: 100%; height: 100%; object-fit: cover; }
.ph-box img.flat { width: 84%; height: 84%; object-fit: contain; mix-blend-mode: multiply; }
.ph-box .eo-ph, .ph-box .eo-tile { position: absolute; inset: 0; aspect-ratio: auto !important; border-radius: 0 !important; }
.ph-box .swatch { position: absolute; inset: 0; display: grid; place-items: center; }
.ph-box .swatch i { width: 44%; aspect-ratio: 1; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.ph-box .tag { position: absolute; left: 0; bottom: 0; max-width: 100%; height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(22, 22, 21, .84); color: #fff; }
.ph-box .tag.acc { background: var(--acc); color: #fff; }
.ph-box .tag.light { background: rgba(255, 255, 255, .9); color: #161615; }
.ph-box .rank, .hslot .rank { position: absolute; left: 0; top: 0; min-width: 28px; height: 26px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; background: rgba(22, 22, 21, .84); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.ph-box .rank i, .hslot .rank i { font-size: 12px; color: #f0c9cf; }
/* 후보 표시(비교함): 사진 모서리의 책갈피. 누르는 곳 44px, 보이는 것은 32px. */
.pick { position: absolute; right: 0; top: 0; width: 44px; height: 44px; display: grid; place-items: center; z-index: 2; }
.pick span { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .92); color: #161615; display: grid; place-items: center; font-size: 17px; box-shadow: 0 1px 4px rgba(0, 0, 0, .14); transition: transform 160ms var(--spring, ease); }
.pick[aria-pressed="true"] span { background: #161615; color: #fff; }
.pick.pop span { animation: pop 420ms var(--spring, ease); }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.18); } 100% { transform: none; } }
.pick.big { width: 56px; height: 56px; right: 6px; top: 6px; }
.pick.big span { width: 44px; height: 44px; font-size: 22px; }
.hslot { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 3 / 4; pointer-events: none; }
.hslot > * { pointer-events: auto; }

/* 홈 */
.hero { margin-top: 28px; }
.hero .h1 { font-size: 30px; line-height: 38px; }
.ask { margin-top: 18px; display: flex; gap: 0; border-bottom: 1.5px solid var(--ink); }
.ask input { flex: 1; min-width: 0; height: 54px; border: 0; background: transparent; padding: 0 2px; font-size: 18px; outline: none; letter-spacing: -.01em; }
.ask input::placeholder { color: var(--ink3); }
.ask button { width: 48px; height: 54px; display: grid; place-items: center; font-size: 24px; flex: none; color: var(--ink); }
.ask.focus { border-bottom-color: var(--acc); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: calc(-1 * var(--gutL)); margin-right: calc(-1 * var(--gutR)); padding: 0 var(--gutR) 0 var(--gutL); }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll::after { content: ""; flex: none; width: 24px; }
.chip { min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line2); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); white-space: nowrap; flex: none; background: transparent; }
.chip i { font-size: 14px; color: var(--ink3); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.soft { border-color: transparent; background: var(--well); color: var(--ink2); }
.section { margin-top: 28px; }
.section > .h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section > .h .h2, .section > .h .h3 { min-width: 0; }
.section > .h .t6 { white-space: nowrap; flex: none; }
.foot { margin-top: 28px; font-size: 12px; line-height: 17px; color: var(--ink3); }
.row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row .grow { flex: 1; min-width: 0; }
.row .arr { color: var(--ink3); font-size: 18px; flex: none; }

/* 편집 보드: 홈·옷장의 큰 사진 하나 + 작은 사진 묶음 */
.board { margin-top: 12px; display: grid; grid-template-columns: 2.5fr 1fr; gap: 10px; align-items: start; }
.board .big { grid-row: 1 / span 2; min-width: 0; }
.board .big, .board .sm { min-width: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; }
.board .cap { display: block; margin-top: 6px; font-size: 13px; line-height: 18px; }
.board .cap b { font-weight: 600; display: block; color: var(--ink3); font-size: 12px; }
.board .cap span { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.board .cap .pr { color: var(--ink); font-weight: 500; }
.invite { margin-top: 20px; padding: 20px 0 0; border-top: 1px solid var(--ink); }
.invite .h2 { margin-top: 6px; }
.sbox { width: 100%; min-height: 52px; border-bottom: 1.5px solid var(--ink); display: flex; align-items: center; gap: 10px; padding: 0 2px; font-size: 16px; color: var(--ink3); }
.sbox i { font-size: 20px; color: var(--ink); flex: none; }
.linkrow { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }

/* 결과: 2열, 3:4 사진, 브랜드 → 품명 → 가격 → AI 이유 */
.cond { margin-top: 6px; height: 40px; align-items: center; overflow-y: hidden; }
.cond .chip { min-height: 34px; font-size: 13px; }
.cnt { flex: none; font-size: 13px; color: var(--ink3); white-space: nowrap; padding-right: 2px; }
.ai { margin-top: 10px; min-height: 36px; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--ink); font-size: 13px; line-height: 18px; display: flex; gap: 8px; align-items: center; }
.ai i { color: var(--acc-text); font-size: 16px; flex: none; }
.ai.wait, .ai.off { color: var(--ink2); }
.ai.wait i { animation: spin 1.2s linear infinite; color: var(--ink3); }
.ai span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@keyframes spin { to { transform: rotate(360deg); } }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 12px; margin-top: 14px; }
.card { min-width: 0; display: flex; flex-direction: column; position: relative; }
.card .open-p { display: block; }
.card .b { margin-top: 8px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink3); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .n { font-size: 13px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink); }
.card .p { margin-top: 3px; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .p small { font-size: 12px; font-weight: 400; color: var(--ink3); margin-left: 4px; }
.card .why { margin-top: 3px; font-size: 12px; line-height: 16px; color: var(--acc-text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .why.stop { color: var(--ink2); }
.offh { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); }
.empty { margin-top: 28px; }
.opt { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 64px; }
.opt .ths { display: flex; gap: 4px; flex: none; }
.opt .ths .ph-box { width: 34px; }
.opt .grow { flex: 1; min-width: 0; }
.opt .arr { color: var(--ink3); font-size: 18px; }

/* 같은 옷, 이미 있는 곳: 중고·해외 검색 링크 9곳 */
.used { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--ink); }
.used .h2 { margin-top: 6px; }
.used .ug { margin: 14px 0 2px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--ink3); text-transform: uppercase; }
.links { display: grid; }
.links a { min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--line); }
.links a .un { font-weight: 400; color: var(--ink3); font-size: 12px; }
.links a i { color: var(--ink3); font-size: 16px; flex: none; }
.links a span { min-width: 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.ulinks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.ulinks a { min-height: 40px; padding: 0 13px; border: 1px solid var(--line2); border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.ulinks a i { font-size: 13px; color: var(--ink3); }
.ulinks a.ab { border-style: dashed; }

/* 상세 */
.pdp-photo { margin: 0 calc(-1 * var(--gutR)) 0 calc(-1 * var(--gutL)); }
.pdp-photo .ph-box { border-radius: 0; aspect-ratio: 4 / 5; display: block; }
.pdp-photo img.flat { width: 72%; height: 72%; }
.pdp-photo .zoomb { position: absolute; left: 0; top: 0; width: 100%; height: 100%; cursor: zoom-in; display: grid; place-items: center; }
.pdp-head { margin-top: 18px; }
.pdp-head .b { font-size: 13px; font-weight: 600; letter-spacing: .04em; color: var(--ink2); }
.pdp-head .h2 { margin-top: 2px; font-size: 21px; line-height: 29px; }
.price { margin-top: 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.price b { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -.01em; }
.price small { font-size: 13px; color: var(--ink3); white-space: nowrap; }
.meta-line { margin-top: 6px; font-size: 13px; color: var(--ink3); }
.box { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.box .h2 { margin-top: 6px; }
.box .h2 b { font-weight: 600; color: var(--acc-text); }
.box p { margin: 6px 0 0; }
.ownq { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ownq button { min-height: 48px; border-radius: 4px; font-size: 15px; font-weight: 600; background: var(--ink); color: var(--bg); display: grid; place-items: center; }
.ownq button.no { background: transparent; color: var(--ink); border: 1px solid var(--line2); }
.owned { display: flex; gap: 10px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.owned .o { flex: none; width: 76px; }
.owned .o .t6 { margin-top: 4px; font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.buybar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 8px var(--gutR) calc(10px + var(--sab)) var(--gutL); }
.buybar .in { max-width: 600px; margin: 0 auto; }
.buybar .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; line-height: 18px; color: var(--ink2); margin-bottom: 6px; min-height: 36px; }
.buybar .meta .pr { min-width: 0; display: flex; flex-direction: column; }
.buybar .meta b { color: var(--ink); font-size: 15px; font-weight: 600; white-space: nowrap; }
.buybar .meta .nt { font-size: 12px; color: var(--ink3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.buybar .meta .qs { display: flex; gap: 4px; flex: none; }
.buybar .meta .quiet { min-height: 36px; padding: 0 6px; }
.buybar .fb { color: var(--ink); font-weight: 500; display: flex; align-items: center; gap: 6px; min-width: 0; }
.buybar .fb i { font-size: 18px; flex: none; color: var(--acc-text); }
.buybar .btn i { font-size: 18px; }

  const ADD_EX = ['무신사 옥스포드', '유니클로', '나이키', '폴로', '뉴발란스', '아디다스'];
  const addExamples = () => ADD_EX.filter((b) => { try { return M.findProducts(b, { limit: 1 }).length; } catch { return false; } }).slice(0, 4);
  function inviteHtml({ label, h, sub }) {
    return `<section class="invite" aria-label="컬렉션 시작"><div class="eyebrow"><i class="ph ph-coat-hanger"></i>${esc(label)}</div>
      <h2 class="h2">${esc(h)}</h2>
      <p class="t6" style="margin-top:6px">${esc(sub)}</p>
      <button class="sbox" data-add-open style="margin-top:14px"><i class="ph ph-magnifying-glass"></i>브랜드나 상품명으로 찾기</button>
      <div class="chips" style="margin-top:10px">${addExamples().map((b) => `<button class="chip" data-add-q="${esc(b)}">${esc(b)}</button>`).join('')}</div>
      <div class="linkrow"><button class="quiet" data-register>목록에 없는 옷 직접 등록</button><button class="quiet" data-trial>체험용 컬렉션으로 먼저 보기</button></div></section>`;
  }
  // 홈의 보드: 후보가 있으면 후보, 옷장이 있으면 코디, 둘 다 없으면 이번 계절 기본템(옷장 없이 고른 것)을 편집 보드로.
  function homeBoard() {
    const st = M.getState();
    const ids = picked();
    const cap = (p, line) => `<span class="cap"><b>${esc(p.brand)}</b><span>${esc(p.name)}</span><span class="pr num">${esc(p.priceText)} <span class="t6">${esc(p.priceShort)}</span></span>${line ? `<span class="acc" style="font-size:12px">${esc(line)}</span>` : ''}</span>`;
    const tile = (p, cls, line) => `<button class="${cls}" data-pid="${p.id}">${productPic(p.id)}${cap(p, line)}</button>`;
    if (ids.length) {
      const ps = ids.map((id) => M.product(id)).filter(Boolean).slice(0, 3);
      return `<section class="section"><div class="h"><h2 class="h2">후보 ${ids.length}벌</h2><span class="t6">${esc(ps[0]?.verdict.basisLabel || '')}</span></div>
        <div class="board">${ps.map((p, i) => tile(p, i ? 'sm' : 'big', delta(p.id)?.text || '')).join('')}</div>
        <div class="linkrow" style="margin-top:10px">${ids.length >= 2 ? '<button class="quiet" data-go-compare>나란히 비교</button>' : ''}<button class="quiet" data-tabgo="closet">컬렉션에서 보기</button></div></section>`;
    }
    if (st.closetCount) {
      const d = M.closetOutfits({ detail: true });
      const seen = new Set(); const list = d.list.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 1);
      return `<section class="section"><div class="h"><h2 class="h2">내 옷 ${st.closetCount}벌로 코디 ${d.total}가지</h2><span class="t6">${st.trialCount ? `체험용 ${st.trialCount}벌 포함` : '종류·색 기준'}</span></div>
        ${list.length ? `<div class="lks">${list.map((o, i) => lookHtml(o, { no: i + 1, sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : '<p class="t6">상의·하의·신발이 한 벌씩 모이면 조합이 생겨요.</p>'}
        <div class="linkrow"><button class="quiet" data-tabgo="looks">코디 전부 보기</button><button class="quiet" data-add-open>옷 넣기</button></div></section>`;
    }
    let sg = null; try { sg = M.suggest({ limit: 3 }); } catch {}
    const items = (sg?.items || []).slice(0, 3);
    return `${items.length ? `<section class="section"><div class="h"><h2 class="h2">${esc(sg.title)}</h2><span class="t6">수집가</span></div>
      <div class="board">${items.map((p, i) => tile(p, i ? 'sm' : 'big', p.why || '')).join('')}</div></section>` : ''}
      ${inviteHtml({ label: '나의 컬렉션', h: '가진 옷 3벌만 넣으면 겹치는 옷과 코디가 보여요', sub: '브랜드나 상품명으로 찾아 넣는 게 가장 빨라요. 목록에 없는 옷은 직접 등록할 수 있어요.' })}`;
  }
  // 코디 보드 한 장: 조각 묶음과 역할 표시. 내 옷은 그대로, 후보는 와인 테두리.
  function lookHtml(o, { no = 0, title = '', sub = '', owned = true } = {}) {
    const ps = o.pieces.filter((x) => ['outer', 'top', 'inner', 'bottom', 'shoes', 'dress'].includes(x.role));
    const main = ps.filter((x) => x.role !== 'inner').slice(0, 4);
    const cap = (x) => x.owned ? `${esc(x.label)}${x.trial ? ' · 체험용' : ''}` : x.product ? `후보 · ${esc(x.product.priceText)}` : esc(x.label);
    const cell = (x) => {
      const inner = `${x.owned ? piecePic(x) : x.product ? productPic(x.product.id) : piecePic(x)}<div class="role">${esc(ROLE[x.role] || x.roleLabel || '')}</div><div class="${x.owned ? 't6' : 'pr'}">${cap(x)}</div>`;
      if (x.owned && x.garmentId) return `<button class="p1" data-g="${x.garmentId}" aria-label="${esc(x.label)}">${inner}</button>`;
      if (x.product) return `<button class="p1 cand" data-pid="${x.product.id}" aria-label="${esc(x.label)}">${inner}</button>`;
      return `<div class="p1">${inner}</div>`;
    };
    return `<div class="lk"><div class="head"><b>${no ? `<span class="no">LOOK ${pad2(no)}</span>` : ''}${esc(title || (o.formula && o.formula !== o.title ? o.formula : o.title))}</b><span class="t6">${sub}</span></div>
      <div class="ps">${main.map(cell).join('')}</div>
      <div class="cap">${owned ? '내 옷으로만 조합' : `내 옷 ${o.ownedCount}벌 + 후보 ${o.buyCount}벌`} · 규칙으로 조합한 예시 · 핏·소재는 안 따져요</div></div>`;
  }
  const MOODS = [['work', '출근'], ['date', '데이트'], ['weekend', '주말·여행'], ['formal', '격식·하객']];
  const moodAsk = (label) => { try { const r = M.ask(`${label} 코디`); return r.understood && (r.conditions || []).some((c) => c.key === 'occasion') ? r : null; } catch { return null; } };
  const sgRow = (p, why = '') => `<div class="sg" data-card="${p.id}"><span class="pic">${productPic(p.id)}${pickToggle(p.id)}</span><button class="grow" data-pid="${p.id}"><span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="why">${esc(why || p.why || p.reason || '')}</span><span class="p num">${esc(p.priceText)}<small>${esc(p.priceShort)}</small></span></button></div>`;

  const V = {
    home({ q = '' } = {}) {
      const ex = M.examples().slice(0, 4);
      return `${top({ back: false, right: menuBtn })}
        <h1 class="h1 hero">무엇을 찾으세요?<br><span class="sub">대충 말해도 실제 옷으로 찾아요.</span></h1>
        <form class="ask" id="sf" role="search"><input id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="예: 출근용 셔츠 10만원 이하" aria-label="찾는 옷" value="${esc(q)}"><button aria-label="찾기"><i class="ph ph-arrow-right"></i></button></form>
        <div class="chips">${ex.map((x) => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        <p class="t6" style="margin-top:10px">이 앱이 아는 상품 ${M.catalog.count}개 안에서 찾아요 · 가격은 수집한 날의 판매가예요</p>
        ${homeBoard()}
        <p class="foot">컬렉션은 비워 둬도 찾고 살 수 있어요. 중고는 외부 검색으로 이어 드려요(매물·가격 확인 안 함).</p>`;
    },

    results({ q, drop = [] }) {
      const r = M.ask(q, { drop });
      const chips = (r.conditions || []).map((c) => c.removable ? `<button class="chip" data-drop="${esc(c.key)}" aria-label="${esc(c.label)} 조건 빼기">${esc(c.label)}<i class="ph ph-x"></i></button>` : `<span class="chip on">${esc(c.label)}</span>`).join('');
      const head = top({ mid: `<button class="qbox" data-edit="${esc(q)}" aria-label="다시 찾기: ${esc(q)}"><i class="ph ph-magnifying-glass"></i><span>${esc(q)}</span></button>` });
      S.result = null;
      if (!r.understood || !r.products.length) {
        const rel = r.understood ? M.relax(r) : [];
        const note = (r.notices || []).find((n) => n.text)?.text;
        const kindLabel = (r.conditions || []).find((c) => c.key === 'kind')?.label || '';
        const alts = [];
        if (r.understood && kindLabel) {
          const genderNotice = /남성 상품에는/.test(note || '') ? 'F' : /여성 상품에는/.test(note || '') ? 'M' : null;
          if (genderNotice) alts.push({ label: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}로 보기`, q: `${genderNotice === 'F' ? '여성' : '남성'} ${kindLabel}` });
          M.kindChoices().filter((k) => k.name !== kindLabel).slice(0, 5).forEach((k) => alts.push({ label: `${k.name}${josa(k.name, '으로', '로')} 보기`, q: q.includes(kindLabel) ? q.replace(kindLabel, k.name) : k.name }));
        }
        return `${head}${chips ? `<div class="chips scroll cond">${chips}</div>` : ''}
          <div class="empty"><div class="eyebrow">0개 · 아는 상품 ${M.catalog.count}개 중</div><h2 class="h1" style="margin-top:6px">${r.understood ? '조건에 맞는 옷이 없어요' : '무슨 옷인지 못 알아들었어요'}</h2>
          <p class="sub t5" style="margin-top:8px">${esc(note || (r.understood ? '다른 옷으로 바꿔 채우지 않았어요. 조건을 하나 빼면 어떻게 되는지 아래에 보여 드려요.' : '종류를 넣어 다시 말해 주세요. 예: 셔츠, 코트, 운동화'))}</p>
          ${rel.length ? `<div style="margin-top:16px">${rel.map((x) => `<button class="opt" data-relax='${esc(JSON.stringify(x.drop))}'><span class="ths" aria-hidden="true">${x.preview.slice(0, 3).map((p) => productPic(p.id)).join('')}</span><span class="grow t5">${esc(x.title)}</span><i class="ph ph-arrow-right arr"></i></button>`).join('')}</div>` : ''}
          ${alts.length ? `<p class="t6" style="margin-top:20px">대신 이렇게 볼 수도 있어요 · 고르면 그 조건으로 다시 찾아요</p><div class="chips">${alts.map((a) => `<button class="chip" data-q="${esc(a.q)}">${esc(a.label)}</button>`).join('')}</div>` : ''}
          ${!rel.length && !alts.length ? `<div class="chips" style="margin-top:18px">${M.examples().slice(0, 3).map((x) => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}</div>`;
      }
      S.result = r;
      const basis = M.judge(r.products[0].id)?.basisLabel || '';
      const list = r.products.slice(0, 12);
      const order = S.aiOrder[q];
      const sorted = order ? [...list].sort((a, b) => (order[a.id] ?? 99) - (order[b.id] ?? 99)) : list;
      S.shown = { main: sorted, off: (r.offOccasion || []).slice(0, 6) }; S.curQ = q;
      const used = usedForText(r);
      return `${head}
        <div class="chips scroll cond" aria-label="조건"><span class="cnt num">${r.products.length}개 · ${esc(basis.replace(' 판단했어요', ''))}</span>${chips}</div>
        <div class="ai ${order ? '' : 'wait'}" id="ai" role="status">${order ? `<i class="ph-fill ph-sparkle"></i><span>${esc(S.aiSummary[q] || 'AI가 후보 순서를 정했어요')}</span>` : '<i class="ph ph-circle-notch"></i><span>AI가 후보 순서와 이유를 정하는 중이에요</span>'}</div>
        <div class="grid" id="grid">${gridHtml(sorted)}</div>
        ${r.offOccasion?.length ? `<section class="offh"><h2 class="h3">${esc(r.offOccasionTitle || '상황과 덜 맞는 옷')}</h2><div class="grid" id="offgrid">${gridHtml(S.shown.off)}</div></section>` : ''}
        ${used ? `<section class="used" id="used-search" aria-label="같은 옷, 이미 있는 곳"><div class="eyebrow acc"><i class="ph ph-recycle"></i>같은 옷, 이미 있는 곳</div><h2 class="h2">‘${esc(used.ko)}’ 중고로 찾기 · 9곳</h2><p class="t6" style="margin-top:4px">외부 검색 · 매물 확인 안 함. 해외는 영어·일본어로 비슷한 종류·색을 찾아요.</p>
          ${used.groups.map((g) => `<p class="ug">${esc(g.region)} ${g.links.length}곳</p><div class="ulinks">${g.links.map((l) => `<a class="${g.region === '해외' ? 'ab' : ''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}<i class="ph ph-arrow-up-right"></i></a>`).join('')}</div>`).join('')}</section>` : ''}
        <p class="foot">후보는 조건에 맞는 상품을 규칙으로 골랐고, 순서와 이유는 AI(Claude)가 상품 정보·평점·후기·내 옷장만 보고 정해요. 아는 상품 ${M.catalog.count}개 안에서 찾았고, 가격은 수집한 날의 판매가예요.</p>`;
    },

    detail({ id }) {
      const p = M.product(id);
      if (!p) return `${top()}<p class="t5">상품을 찾지 못했어요.</p>`;
      const ai = S.ai[id];
      const v = p.verdict;
      const same = sameOwned(v);
      const looks = (v.looks || []).slice(0, 2);
      const nvu = M.newVsUsed(id);
      const ask = needAsk(id);
      const d = delta(id);
      const inCloset = M.getState().closet.some((g) => g.productId === id);
      let head, sub = v.lines?.[0] || '';
      if (inCloset) { head = '이미 컬렉션에 있는 옷이에요'; sub = '같은 상품을 넣어 두셨어요. 다시 살 필요가 있는지 기록을 함께 보세요.'; }
      else if (ask) { head = esc(askText(p)); sub = v.basis === 'none' ? '한 번만 답하면 겹치는지 바로 알려 드려요. 컬렉션은 안 채워도 돼요.' : '한 번만 답하면 겹치는지 바로 알려 드려요.'; }
      else if (v.basis === 'none' && d) { head = `겹치는 ${esc(p.kindName)}${josa(p.kindName, '이', '가')} <b>없어요</b>`; sub = `가진 ${p.kindName}${josa(p.kindName, '이', '가')} 없다고 답했어요. 바지·신발도 넣으면 새 코디 수까지 세어 드려요.`; }
      else if (same.length) head = `비슷한 옷이 <b>${same.length}벌</b> 있어요`;
      else if (v.newLookCount) head = `넣으면 새 코디가 <b>${v.newLookCount}개</b> 생겨요`;
      else head = esc(v.title);
      return `${top({ right: pickToggle(id, 'tb') ? '' : '' })}
        <div class="pdp"><div class="pdp-photo"><span class="ph-box"><button class="zoomb" data-zoom="${id}" aria-label="사진 크게 보기">${productPic(id).replace(/^<span class="ph-box">|<\/span>$/g, '')}</button>${pickToggle(id, 'big')}</span></div>
        <div>
        <div class="pdp-head"><div class="b">${esc(p.brand)}</div><h1 class="h2">${esc(p.name)}</h1>
          <div class="price num"><b>${esc(p.priceText)}</b><small>${esc(p.priceNote)} · ${esc(nvu.fresh.store)}</small></div>
          <p class="meta-line">${esc(p.colorLabel)} · ${esc(p.slotName)}${p.rating ? ` · 평점 ${esc(p.rating)} · 후기 ${Number(p.reviews || 0).toLocaleString('ko-KR')}개` : ''}</p></div>
        ${ai?.reason ? `<section class="box" aria-label="AI 이유"><div class="eyebrow acc"><i class="ph-fill ph-sparkle"></i>AI 순위 ${ai.rank}위${ai.fit ? ` · ${esc(ai.fit)}` : ''}</div><p class="h2" style="margin-top:6px">${esc(ai.reason)}</p><p class="t6" style="margin-top:4px">넘겨준 상품 정보·평점·후기·내 옷장만 보고 쓴 이유예요.</p></section>` : ''}
        <section class="box" id="hangbox" aria-label="내 컬렉션과 비교"><div class="eyebrow"><i class="ph ph-coat-hanger"></i>내 컬렉션과 비교 · ${esc(v.basisLabel)}</div>
          <h2 class="h2">${head}</h2>
          ${sub ? `<p class="t5 sub">${esc(sub)}</p>` : ''}
          ${ask && !inCloset ? `<div class="ownq"><button data-own="yes" data-for="${id}">있어요</button><button class="no" data-own="no" data-for="${id}">없어요</button></div>` : ''}
          ${same.length ? `<div class="owned">${same.map((o) => `<div class="o">${garmentPic(o)}<div class="t6">${esc(o.colorLabel)} ${esc(o.kindName)}${o.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : ''}
          ${looks.length ? `<div class="lks" style="margin-top:8px">${looks.map((l, i) => { const ps = l.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4); return `<div class="lk"><div class="head"><b><span class="no">LOOK ${pad2(i + 1)}</span>${esc(l.title || '')}</b><span class="t6">${l.new ? '새 코디' : '있던 조합'}</span></div><div class="ps">${ps.map((x) => `<div class="p1${x.candidate ? ' me' : ''}">${piecePic(x)}<div class="role">${esc(ROLE[x.role] || '')}</div><div class="t6">${x.candidate ? '이 옷' : `${esc(x.colorLabel)} ${esc(x.kindName)}${x.trial ? ' · 체험용' : ''}`}</div></div>`).join('')}</div><div class="cap">규칙으로 조합한 예시</div></div>`; }).join('')}</div>` : ''}
          <div class="linkrow" style="margin-top:8px">${!inCloset ? `<button class="quiet" data-have="${id}"><i class="ph ph-plus"></i>이 옷 가지고 있어요</button>` : '<button class="quiet" data-tabgo="closet">컬렉션 보기</button>'}${!ask && !inCloset && v.addSuggestion && !(v.owned || []).length && !(v.basis === 'none' && d) ? `<button class="quiet" data-addlike="${id}">가진 ${esc(v.addSuggestion.kindName)} 넣기</button>` : ''}</div>
        </section>
        <section class="used" id="used-search" aria-label="같은 옷, 이미 있는 곳"><div class="eyebrow acc"><i class="ph ph-recycle"></i>같은 옷, 이미 있는 곳</div>
          <h2 class="h2">중고로 먼저 찾아보기 · 9곳</h2>
          <p class="t6" style="margin-top:4px">외부 검색 · 매물 확인 안 함. ${esc(nvu.used.groups.length ? '국내는 같은 상품명으로, 해외는 비슷한 종류·색으로 찾아요.' : '')}</p>
          ${usedLinksHtml(nvu.used.groups)}</section>
        <p class="foot">${esc(v.fine || '')}</p>
        </div></div>`;
    },

    compare() {
      const ids = picked();
      if (ids.length < 2) return `${top()}<h1 class="h2" style="margin-top:12px">두 벌 이상 후보로 두면 나란히 봐요</h1><p class="t5 sub" style="margin-top:6px">사진 모서리의 책갈피를 눌러 후보로 두세요. 지금 ${ids.length}벌이에요.</p>`;
      const c = M.compareRows(ids);
      const head = c.items.map((it) => `<th scope="col"><button data-pid="${it.id}" style="display:block;width:100%">${productPic(it.id)}<div class="n">${esc(it.brand)} ${esc(it.name)}</div></button><button class="rm" data-unpick="${it.id}">빼기</button></th>`).join('');
      const rows = (list) => list.map((r) => `<tr class="${r.same ? 'same' : ''}"><th scope="row">${esc(r.label)}</th>${r.values.map((v) => `<td class="num">${esc(v)}</td>`).join('')}</tr>`).join('');
      const nSame = c.rows.filter((r) => r.same).length;
      const ordered = [...c.rows.filter((r) => !r.same), ...c.rows.filter((r) => r.same)];
      return `${top()}<h1 class="h2" style="margin-top:12px">후보 ${ids.length}벌 나란히</h1><p class="t6" style="margin-top:4px">${esc(c.note)}</p>
        <div class="cmp" id="cmp"><table><colgroup><col style="width:64px">${c.items.map(() => '<col>').join('')}</colgroup><thead><tr><th scope="col"><span class="t6">항목</span></th>${head}</tr></thead><tbody>${rows(ordered)}</tbody></table></div>
        ${nSame ? `<button class="quiet" data-sametog aria-expanded="false" style="margin-top:8px"><i class="ph ph-caret-down"></i>같은 항목 ${nSame}개 보기</button>` : ''}`;
    },

    closet() {
      const st = M.getState();
      const mine = st.closet;
      const cands = picked().map((id) => M.product(id)).filter(Boolean);
      const out = mine.length ? M.closetOutfits().total : 0;
      const received = st.records.filter((x) => x.decision === 'buy' && ['ordered', 'received'].includes(x.stage)).length;
      const bc = new Map(); mine.forEach((g) => { const b = brandOf(g); if (b) bc.set(b, (bc.get(b) || 0) + 1); });
      const brands = [...bc.entries()].sort((a, b) => b[1] - a[1]);
      const bf = S.brandFilter && bc.has(S.brandFilter) ? S.brandFilter : null;
      const shown = bf ? mine.filter((g) => brandOf(g) === bf) : mine;
      const outfitsWith = (() => { if (!mine.length) return new Map(); const d = M.closetOutfits({ detail: true }); const m = new Map(); const seen = new Set(); d.list.forEach((o) => { if (seen.has(o.key)) return; seen.add(o.key); o.pieces.forEach((x) => { if (x.garmentId) m.set(x.garmentId, (m.get(x.garmentId) || 0) + 1); }); }); return m; })();
      const gt = (g) => { const b = brandOf(g); const sb = subOf(g); const miss = g.detailMissing; const n = outfitsWith.get(g.id) || 0; const meta = miss ? `${miss} · 눌러서 채우기` : sb ? `직접 등록 · ${sb.people}/${PEOPLE_NEED}` : g.trial ? '체험용' : n ? `코디 ${n}가지` : '코디 0가지'; return `<button class="gt" data-g="${g.id}" aria-label="${esc(g.label)}">${garmentPic(g)}<span class="b">${esc(b || g.kindName)}</span><span class="n">${esc(sb ? sb.name : g.productId ? g.label : `${g.colorLabel} ${g.kindName}`)}</span><span class="m${miss ? ' acc' : ''}">${esc(meta)}</span></button>`; };
      const candHtml = cands.length ? `<section class="section"><div class="h"><h2 class="h3">후보로 둔 옷 <span class="num">${cands.length}</span></h2>${cands.length >= 2 ? '<button class="quiet" data-go-compare>나란히 비교</button>' : ''}</div><div class="recent">${cands.map((p) => { const d = delta(p.id); return `<button class="gt" data-pid="${p.id}" aria-label="${esc(p.brand)} ${esc(p.name)}">${productPic(p.id, { tag: d ? esc(d.short) : '', tagCls: d?.cls || '' })}<span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="m">${esc(p.priceText)}</span></button>`; }).join('')}</div></section>` : '';
      const groups = [...GROUPS.map(([name, ks]) => [name, shown.filter((g) => ks.includes(g.kind))]), ['기타', shown.filter((g) => !GROUPS.some(([, ks]) => ks.includes(g.kind)))]].filter(([, items]) => items.length);
      if (!mine.length) {
        return `${top({ back: false, right: menuBtn })}
          <div class="eyebrow" style="margin-top:16px">나의 컬렉션 · 0벌</div>
          <h1 class="h1" style="margin-top:6px">아직 비어 있어요</h1>
          <p class="t5 sub" style="margin-top:6px">비워 둬도 찾고 살 수 있어요. 3벌만 넣으면 겹치는 옷과 코디를 세어 드려요.</p>
          ${inviteHtml({ label: '가장 빠른 방법', h: '브랜드나 상품명으로 찾아서 ‘가지고 있어요’', sub: `이 앱이 아는 상품 ${M.catalog.count}개 안에서 찾아요. 없으면 직접 등록해 넣을 수 있어요(사진은 안 올려요).` })}
          ${candHtml}`;
      }
      const subsN = mine.filter((g) => subOf(g)).length;
      return `${top({ back: false, right: menuBtn })}
        <div class="eyebrow" style="margin-top:16px">나의 컬렉션${bf ? ` · ${esc(bf)}` : ''}</div>
        <h1 class="h1" style="margin-top:6px">옷 <span class="num">${mine.length}</span>벌${out ? `, 코디 <span class="num">${out}</span>가지` : ''}</h1>
        <p class="t5 sub" style="margin-top:6px">${out ? '종류·색 기준으로 규칙이 센 숫자예요. 한 벌 더 넣으면 조합이 늘어요.' : '상의·하의·신발이 한 벌씩 모이면 입을 수 있는 조합을 세어 드려요.'}</p>
        <div class="stat"><button class="c" data-tabgo="looks"><span class="k">코디</span><span class="v num">${out}<small>가지</small></span></button><div class="c"><span class="k">브랜드</span><span class="v num">${brands.length}<small>곳</small></span></div><div class="c"><span class="k">직접 등록</span><span class="v num">${subsN}<small>벌</small></span></div></div>
        ${st.trialCount ? `<div class="notice"><span class="grow">체험용 옷 ${st.trialCount}벌이 섞여 있어요 · 내 옷을 넣으면 내려도 돼요</span><button data-mine>내리기</button></div>` : ''}
        ${received ? `<div class="notice"><span class="grow">사기로 한 옷 ${received}벌 · 받으면 기록에서 ‘계속 입을게요’를 누르면 컬렉션에 들어와요</span><button data-tabgo="records">기록</button></div>` : ''}
        ${candHtml}
        ${mine.length >= 4 && !bf ? `<section class="section"><div class="h"><h2 class="h3">최근 넣은 옷</h2></div><div class="recent">${[...mine].slice(-5).reverse().map(gt).join('')}</div></section>` : ''}
        ${brands.length ? `<section class="section"><div class="h"><h2 class="h3">모은 브랜드 <span class="t6 num">${brands.length}</span></h2>${bf ? '<button class="quiet" data-brand="">전체 보기</button>' : ''}</div><div class="chips brands">${brands.map(([b, n]) => `<button class="chip" data-brand="${esc(b)}" aria-pressed="${bf === b}">${esc(b)} <span class="num">${n}</span></button>`).join('')}</div></section>` : ''}
        ${groups.map(([name, items]) => `<section class="section"><div class="h"><h2 class="h3">${name} <span class="t6 num">${items.length}</span></h2></div><div class="shelf">${items.map(gt).join('')}</div></section>`).join('')}
        <p class="foot">상품으로 넣은 옷은 판매처 사진, 직접 등록한 옷과 종류·색으로 넣은 옷은 같은 종류·색의 비슷한 상품 사진이에요. 비슷한 사진이 없으면 색으로 보여 드려요. 직접 등록한 옷은 같은 옷을 ${PEOPLE_NEED}명이 등록하면 모두가 검색할 수 있어요(서버 연결 전에는 이 기기에만).</p>`;
    },

    add({ q = '' } = {}) {
      return `${top({ mid: `<form class="qform" id="af" role="search"><input id="aq" value="${esc(q)}" enterkeyhint="search" autocomplete="off" placeholder="브랜드나 상품명으로 찾기" aria-label="브랜드나 상품명"></form>` })}
        <p class="t6" style="margin-top:12px">이 앱이 아는 상품 ${M.catalog.count}개(${esc(M.catalog.store)} · ${esc(M.catalog.checkedLabel)})와 내가 직접 등록한 옷 안에서 찾아요.</p>
        <div id="ares"></div>
        <button class="regcta" data-register-q><span class="grow"><span class="t5">목록에 없어요 → 직접 등록하기</span><span class="t6" style="display:block">브랜드·품명·종류·색만 적어요. 사진은 올리지 않아요.</span></span><i class="ph ph-arrow-right arr"></i></button>`;
    },

    // 직접 등록: 목록에 없는 옷을 브랜드·품명·종류·색(·판매처 링크)으로. 바로 내 옷장에 들어가고, 공유 목록 제출은 이 기기에만 남는다.
    register({ q = '', brand = '', name = '' } = {}) {
      const g0 = M.getState().gender || 'M';
      const kinds = M.kindChoices().filter((k) => PIC.includes(k.id)).sort((a, b) => PIC.indexOf(a.id) - PIC.indexOf(b.id));
      const thumbColor = (kid) => ['white', 'black', 'navy', 'grey', 'indigo', 'blue', 'beige'].find((c) => K.CUT[`${g0}|${kid}|${c}`]) || 'black';
      const cs = M.colorChoices();
      return `${top()}
        <div class="form-wrap">
        <div class="eyebrow" style="margin-top:12px">직접 등록 · 목록에 없는 옷</div>
        <h1 class="h1" style="margin-top:6px">어떤 옷이에요?</h1>
        <p class="t5 sub" style="margin-top:6px">적는 즉시 내 컬렉션에 들어가요. 같은 옷을 ${PEOPLE_NEED}명이 등록하면 모두가 검색할 수 있어요.</p>
        <form id="rf" novalidate>
          <div class="field"><label for="rb">브랜드</label><input id="rb" name="brand" autocomplete="off" placeholder="예: 코스" value="${esc(brand)}" maxlength="40"></div>
          <div class="field"><label for="rn">품명</label><input id="rn" name="name" autocomplete="off" placeholder="예: 울 블렌드 싱글 코트" value="${esc(name || q)}" maxlength="80"></div>
          <div id="dup"></div>
          <div class="field"><label>종류</label><div class="kinds" id="rk" role="group" aria-label="종류">${kinds.map((k) => `<button type="button" data-k="${k.id}" aria-pressed="false">${garmentPic({ kind: k.id, kindName: k.name, color: thumbColor(k.id), gender: g0 })}${esc(k.name)}</button>`).join('')}</div></div>
          <div class="field"><label>색<small>고르면 코디에 셀 수 있어요</small></label><div class="colors" id="rc" role="group" aria-label="색">${cs.map((c) => `<button type="button" data-c="${c.id}" aria-pressed="false" aria-label="${esc(c.label)}"><i style="background:${c.hex}"></i>${esc(c.label)}</button>`).join('')}</div></div>
          <div class="field"><label for="ru">판매처 링크<small>선택</small></label><input id="ru" name="url" type="url" inputmode="url" autocomplete="off" placeholder="https://" maxlength="300"><p class="hint">사진은 올리지 않아요. 옷 사진은 이 기기 밖으로 나가지 않아요.</p></div>
        </form>
        <p class="foot">등록한 내용은 공유 목록 제출로 남아요. 서버 연결 전이라 지금은 이 기기에만 저장돼요.</p>
        </div>`;
    },

    looks({ mood = '' } = {}) {
      const st = M.getState();
      const mine = st.closet;
      const head = top({ back: false, right: menuBtn });
      if (!mine.length) {
        return `${head}<div class="eyebrow" style="margin-top:16px">코디</div><h1 class="h1" style="margin-top:6px">내 옷으로 코디를 짜 드려요</h1>
          <p class="t5 sub" style="margin-top:6px">상의·하의·신발 3벌만 넣으면 입을 수 있는 조합과 ‘한 벌만 더 있으면’을 보여 드려요.</p>
          ${inviteHtml({ label: '시작은 3벌', h: '브랜드나 상품명으로 찾아 넣어 주세요', sub: '판매처 사진이 그대로 컬렉션에 걸리고, 조합은 종류·색 규칙으로 세요.' })}`;
      }
      const avail = MOODS.map(([id, label]) => [id, label, moodAsk(label)]).filter((m) => m[2]);
      const cur = avail.find((m) => m[0] === mood) || null;
      const chips = `<div class="chips scroll moods" aria-label="상황"><button class="chip ${cur ? '' : 'on'}" data-mood="" aria-pressed="${!cur}">내 옷 전체</button>${avail.map(([id, label]) => `<button class="chip ${cur?.[0] === id ? 'on' : ''}" data-mood="${id}" aria-pressed="${cur?.[0] === id}">${esc(label)}</button>`).join('')}</div>`;
      if (!cur) {
        const d = M.closetOutfits({ detail: true });
        const seen = new Set(); const list = d.list.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 12);
        const sg = M.suggest({ limit: 3 });
        const sgRows = sg.basis === 'closet' ? sg.items : [];
        return `${head}<div class="eyebrow" style="margin-top:16px">코디 · 내 옷 ${mine.length}벌</div><h1 class="h1" style="margin-top:6px"><span class="num">${d.total}</span>가지 입을 수 있어요</h1>
          <p class="t5 sub" style="margin-top:6px">${d.total ? `코디 공식 ${d.formulas}개 · 기본 조합 ${d.basic}개 · 종류·색 기준` : '상의·하의·신발이 한 벌씩 있으면 조합이 생겨요'}</p>
          ${chips}
          ${list.length ? `<div class="lks">${list.map((o, i) => lookHtml(o, { no: i + 1, sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : `<div class="empty"><h2 class="h2">아직 조합이 없어요</h2><p class="t5 sub" style="margin-top:6px">상의·하의·신발을 한 벌씩 넣으면 바로 세어 드려요.</p><button class="btn line wide sm" data-add-open style="margin-top:12px"><i class="ph ph-plus"></i>옷 넣기</button></div>`}
          ${sgRows.length ? `<section class="section"><div class="h"><h2 class="h2">한 벌만 더 있으면</h2><span class="t6">내 옷과 함께 쓰는 코디 공식</span></div>${sgRows.map((p) => sgRow(p)).join('')}<p class="t6" style="margin-top:8px">규칙으로 고른 상품이에요. 가격은 수집한 날의 판매가예요.</p></section>` : ''}
          <p class="foot">${esc(d.note)}</p>`;
      }
      const r = cur[2];
      const o = r.outfit;
      const cands = o ? o.pieces.filter((x) => !x.owned && x.product) : [];
      const condText = (r.conditions || []).map((c) => c.label).join(' · ');
      return `${head}<div class="eyebrow" style="margin-top:16px">코디 · ${esc(cur[1])}</div><h1 class="h1" style="margin-top:6px">${o ? (o.buyCount ? `내 옷 ${o.ownedCount}벌에 한 벌만 더하면 돼요` : `내 옷 ${o.ownedCount}벌로 입을 수 있어요`) : '내 옷으로는 아직 맞는 코디 공식이 없어요'}</h1>
        ${chips}
        ${o ? `<div class="lks">${lookHtml(o, { no: 1, sub: esc(condText), owned: !o.buyCount })}</div>` : `<div class="empty" style="margin-top:20px"><p class="t5 sub">${esc(r.outfitNote || `${cur[1]} 조건에 맞는 코디 공식이 내 옷만으로는 아직 없어요. 조건을 풀지 않았어요.`)}</p></div>`}
        ${cands.length ? `<section class="section"><div class="h"><h2 class="h2">한 벌만 더 있으면</h2><span class="t6">${esc(condText)} 안에서 고름</span></div>${cands.map((x) => sgRow(M.product(x.product.id) || x.product, `${cur[1]} 코디의 ${x.kindName} 자리`)).join('')}</section>` : ''}
        ${r.products.length ? `<button class="row" data-q="${esc(r.text)}" style="margin-top:8px"><span class="grow t5">${esc(cur[1])} 조건에 맞는 옷 ${r.products.length}개 더 보기</span><i class="ph ph-arrow-right arr"></i></button>` : ''}
        <p class="foot">조합은 정해 둔 코디 공식과 종류·색 규칙으로 고른 예시예요. 핏·소재·현재 가격은 판매처에서 확인해요.</p>`;
    },

    consult() {
      const th = C.thread();
      if (!th) {
        const list = [...C.threads].sort((a, b) => String(b.at).localeCompare(String(a.at)));
        return `${top({ back: false, right: list.length ? '<button class="tbtn" data-delall>모두 지우기</button>' : '' })}
          <div class="eyebrow" style="margin-top:16px">코디 상담</div>
          <h1 class="h1" style="margin-top:6px">옷 이야기만, 내 컬렉션을 보고 답해요</h1>
          <p class="t5 sub" style="margin-top:6px">다른 주제는 진행하지 않아요. AI 답변이라 틀릴 수 있어요.</p>
          <div class="chips" style="margin-top:14px">${CHAT_EX.map((q) => `<button class="chip" data-ask="${esc(q)}">${esc(q)}</button>`).join('')}</div>
          ${list.length ? `<section class="section"><div class="h"><h2 class="h3">이전 상담 <span class="t6 num">${list.length}</span></h2><span class="t6">누르면 이어서 물어봐요</span></div>
            <div class="hist">${list.map((t) => `<div class="hrow"><button class="grow" data-thread="${t.id}"><span class="n">${esc(t.title)}</span><span class="t6">${esc(whenText(t.at))} · 주고받은 말 ${t.turns.filter((x) => x.role !== 'note').length}개</span></button><button class="icon" data-delthread="${t.id}" aria-label="이 상담 지우기"><i class="ph ph-trash"></i></button></div>`).join('')}</div></section>` : '<p class="t6" style="margin-top:20px">상담 내용은 이 브라우저에만 남아요. 다음에 와서 이어서 물어볼 수 있어요.</p>'}
          <p class="foot">상품 가격은 수집한 날의 판매가예요.</p>`;
      }
      const body = th.turns.map((x) => {
        if (x.role === 'user') return `<div class="msg me">${esc(x.text)}</div>`;
        if (x.role === 'note') return `<div class="msg err" role="status">${esc(x.text)}</div>`;
        if (x.refused) return `<div class="msg bot refuse"><span class="who"><i class="ph ph-hand"></i>상담 범위 밖이에요</span>${esc(x.text)}</div>`;
        return `<div class="msg bot"><span class="who"><i class="ph-fill ph-sparkle"></i>AI 코디 상담</span>${esc(x.text)}</div>${x.ids?.length ? `<div class="recs">${x.ids.map(recCard).join('')}</div>` : ''}`;
      }).join('');
      return `${top({ back: false, right: '<button class="tbtn" data-chatlist><i class="ph ph-list-bullets"></i>이전 상담</button><button class="tbtn" data-newchat>새 상담</button>' })}
        <div class="ttl"><i class="ph ph-chats-circle"></i><span class="grow">${esc(th.title)}</span><span class="t6 nw">${esc(whenText(th.at))}</span></div>
        <div class="thread" id="thread" aria-live="polite">${body}${C.busy ? '<div class="msg bot wait" role="status"><span class="who"><i class="ph ph-circle-notch"></i>생각하는 중이에요</span></div>' : ''}</div>
        <p class="foot">AI 답변이라 틀릴 수 있어요 · 옷·코디 주제만 답해요. 이 상담은 이 브라우저에 남아요.</p>`;
    },

    records() {
      const all = M.getState().records.filter((r) => r.decision);
      const decided = all.filter((r) => r.decision !== 'hold');
      const buy = all.filter((r) => r.decision === 'buy');
      const holds = all.filter((r) => r.decision === 'hold');
      const sum = buy.reduce((a, r) => a + (r.product?.price || 0), 0);
      const waiting = buy.filter((x) => ['candidate', 'ordered', 'received'].includes(x.stage));
      const byDay = new Map();
      all.forEach((r) => { const k = dayKey(r.updatedAt); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(r); });
      const stage = (r) => r.decision === 'buy' ? (r.stage === 'candidate' ? '주문 전' : r.stageLabel) : (r.stage === 'candidate' ? '' : r.stageLabel);
      return `${top({ back: false })}
        <div class="eyebrow" style="margin-top:16px">기록</div>
        <h1 class="h1" style="margin-top:6px">${decided.length ? `<span class="num">${decided.length}</span>벌을 정했어요` : holds.length ? `보류 <span class="num">${holds.length}</span>벌 · 아직 정하지 않았어요` : '아직 정한 옷이 없어요'}</h1>

  // ── 상세의 결정 바: 주 행동은 '판매처에서 사기' 하나.
  function drawDecision(id) {
    const p = M.product(id); if (!p) return;
    const rec = p.verdict.record;
    const nvu = M.newVsUsed(id);
    const dec = rec?.decision;
    const meta = dec
      ? `<span class="fb" role="status"><i class="ph-fill ph-check-circle"></i><span class="nt" style="color:inherit">${esc(DEC[dec])}로 남겼어요${rec.stage !== 'candidate' ? ` · ${esc(rec.stageLabel)}` : dec === 'buy' ? ' · 주문·도착은 기록에서' : ''}</span></span><span class="qs">${rec.stage === 'candidate' ? '<button class="quiet" data-redecide>바꾸기</button>' : '<button class="quiet" data-tabgo="records">기록</button>'}</span>`
      : `<span class="pr"><b class="num">${esc(p.priceText)}</b><span class="nt">${esc(p.priceNote)} · 현재 가격은 판매처에서</span></span><span class="qs"><button class="quiet" data-dec="hold">보류</button><button class="quiet" data-dec="skip">안 살래요</button></span>`;
    $('#bar').innerHTML = `<div class="buybar"><div class="in"><div class="meta">${meta}</div>
      <a class="btn go wide" href="${esc(p.url)}" target="_blank" rel="noopener" data-seller="${id}">${esc(nvu.fresh.store)}에서 새 상품 사기<i class="ph ph-arrow-up-right"></i></a></div></div>`;
    $$('[data-dec]').forEach((b) => { b.onclick = () => decide(id, b.dataset.dec); });

  function decide(id, dec) {

    drawDecision(id);
  }
  function decisionSheet(id, { title = '판매처에서 돌아왔어요 · 어떻게 하셨어요?' } = {}) {

      <div class="decs"><button class="btn go" data-d="buy"><i class="ph ph-check"></i>샀어요</button><button class="btn soft" data-d="hold">보류</button><button class="btn soft" data-d="skip">안 살래요</button>${has ? '<button class="btn line" data-d="clear">기록 지우기</button>' : ''}<button class="quiet" data-d="" style="justify-content:center;width:100%">${has ? '그대로 둘게요' : '아직 보는 중이에요'}</button></div>`);

    if (dt > 30 * 60 * 1000 || curView !== 'detail' || curParams.id !== pd.id) { S.pending = null; return; }
    S.pending = null;
    setTimeout(() => { if (curView === 'detail' && curParams.id === pd.id && !M.product(pd.id)?.verdict.record?.decision) decisionSheet(pd.id); }, 300);

  // ── 공통 이벤트
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-back],[data-pid],[data-tabgo],[data-menu],[data-q],[data-pick],[data-unpick],[data-go-compare],[data-zoom],[data-addlike],[data-disclose],[data-own],[data-edit],[data-add-open],[data-add-q],[data-register],[data-own-add],[data-trial],[data-mine],[data-g],[data-have],[data-sub-add]');

  const refreshKeep = () => { const y = scrollY; K.refresh(); requestAnimationFrame(() => scrollTo(0, y)); };
  // 상세의 '이 옷 가지고 있어요': 같은 상품을 컬렉션에 넣는다(색을 사진에서 추정한 상품은 색만 묻는다).

  function zoom(id) {
    const ph = M.photo({ id }); if (!ph) return;
    const w = document.createElement('div');

  // ── 시트
  function sheet(html) {
    const w = document.createElement('div');

    const close = async () => {

  const colorGrid = (first = null) => { const cs = M.colorChoices(); const sorted = first ? [...cs.filter((c) => c.id === first), ...cs.filter((c) => c.id !== first)] : cs; return `<div class="colors">${sorted.map((c) => `<button data-c="${c.id}" class="${c.id === first ? 'same' : ''}" aria-label="${esc(c.label)}${c.id === first ? ' (이 옷과 같은 색)' : ''}"><i style="background:${c.hex}"></i>${esc(c.label)}${c.id === first ? ' · 같은 색' : ''}</button>`).join('')}</div>`; };

  // 옷 한 벌 시트: 이 옷으로 입을 수 있는 코디(옷 ↔ 코디 관계), 색 바꾸기, 빼기. 직접 등록한 옷은 등록 상태도.

    const seen = new Set(); const sets = with_.filter((o) => !seen.has(o.key) && seen.add(o.key)).slice(0, 2);
    const sh = sheet(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><span style="width:84px;display:block;flex:none">${garmentPic(g)}</span><div style="min-width:0"><div class="eyebrow">${esc(brand || g.kindName)}</div><h2 class="h2" style="margin:2px 0 0">${esc(sb ? sb.name : g.label)}</h2><div class="t6">${esc([g.color ? g.colorLabel : null, g.kindName, g.trial ? '체험용' : sb ? `직접 등록 · ${picIsPhoto(g) ? '비슷한 상품 사진' : '색으로 표시'}` : g.productId ? '판매처 사진' : picIsPhoto(g) ? '비슷한 상품 사진' : '색으로 표시'].filter(Boolean).join(' · '))}</div></div></div>
      ${sb ? `<div class="state" style="margin-top:0"><div class="meter"><span class="dots" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= sb.people ? 'on' : ''}"></i>`).join('')}</span><span>같은 옷 등록 ${sb.people}/${PEOPLE_NEED}명 · ${PEOPLE_NEED}명이 되면 모두가 검색할 수 있어요 · 서버 연결 전에는 이 기기에만</span></div>${sb.url ? `<a class="quiet" href="${esc(sb.url)}" target="_blank" rel="noopener" style="margin-top:4px">판매처 링크<i class="ph ph-arrow-up-right"></i></a>` : ''}</div>` : ''}
      ${g.detailMissing === '색 미확인' ? `<div class="notice" style="margin:0 0 12px"><span class="grow">색을 알려 주시면 코디에 셀 수 있어요</span><button data-gcolor>색 고르기</button></div>` : ''}
      <h3 class="h3" style="margin:14px 0 4px">이 옷으로 입을 수 있는 코디 <span class="num acc">${with_.length}</span>가지</h3>
      ${sets.length ? `<div class="lks" style="margin-top:4px">${sets.map((o, i) => lookHtml(o, { no: i + 1, sub: o.formulaLook ? '코디 공식' : '기본 조합' })).join('')}</div>` : `<p class="t6">${g.detailMissing ? '색을 채우면 조합을 셀 수 있어요.' : '상의·하의·신발이 한 벌씩 있으면 조합이 생겨요.'}</p>`}
      <div style="display:flex;gap:8px;margin-top:16px">${g.detailMissing !== '색 미확인' ? '<button class="btn line sm" data-gcolor style="flex:1">색 바꾸기</button>' : ''}<button class="btn soft sm" data-rm style="flex:1">컬렉션에서 빼기</button></div>`);
    $$('[data-gcolor]', sh.s).forEach((b) => { b.onclick = async () => { await sh.close(); pickColor(id, g.kindName, g.color); }; });
    $('[data-rm]', sh.s).onclick = async () => { try { M.removeGarment(id); await sh.close(); K.refresh(); } catch (err) { K.toast(err.message, { bottom: 128 }); } };
  }
  function pickColor(gid, kindName, current = null, done = null) {
    const sh = sheet(`<h2 class="h2">${esc(kindName)}${josa(kindName, '은', '는')} 무슨 색이에요?</h2>${colorGrid(current)}`);
    $$('[data-c]', sh.s).forEach((b) => { b.onclick = async () => { M.updateGarment(gid, { color: b.dataset.c }); await sh.close(); if (done) done(); else K.refresh(); }; });
    return sh;
  }
  function confirmSheet(title, sub, okLabel, onOk) {
    const sh = sheet(`<h2 class="h2">${esc(title)}</h2><p class="t6 sub">${esc(sub)}</p><div class="decs"><button class="btn go" data-ok>${esc(okLabel)}</button><button class="btn soft" data-no>그대로 둘게요</button></div>`);
    $('[data-ok]', sh.s).onclick = async () => { await sh.close(); onOk(); };
    $('[data-no]', sh.s).onclick = () => sh.close();
  }

  // ── 옷장 넣기(브랜드·품명 검색): 아는 상품 + 내가 직접 등록한 옷
  function renderAddResults(q) {
    const box = $('#ares'); if (!box) return;
    const text = String(q || '').trim();
    const mine = M.getState().closet;
    const has = (id) => mine.find((g) => g.productId === id);
    if (!text) {
      const recent = [...mine].slice(-3).reverse();
      box.innerHTML = `<div class="chips" style="margin-top:12px">${addExamples().map((b) => `<button class="chip" data-aq="${esc(b)}">${esc(b)}</button>`).join('')}</div>
        ${recent.length ? `<section class="section"><div class="h"><h2 class="h3">최근 넣은 옷</h2></div>${recent.map((g) => { const sb = subOf(g); return `<div class="srow">${garmentPic(g)}<span class="grow"><span class="b">${esc(brandOf(g) || g.kindName)}</span><span class="n">${esc(sb ? sb.name : g.label)}</span><span class="m">${esc(g.detailMissing || (sb ? `직접 등록 · ${sb.people}/${PEOPLE_NEED}` : g.sourceLabel))}</span></span></div>`; }).join('')}</section>` : ''}`;
      $$('[data-aq]', box).forEach((b) => { b.onclick = () => { $('#aq').value = b.dataset.aq; renderAddResults(b.dataset.aq); }; });
      return;
    }
    let hits = [];
    try { hits = M.findProducts(text, { limit: 20 }); } catch {}
    const subs = findSubs(text);
    const subRow = (s) => { const g = mine.find((x) => x.id === s.garmentId); return `<div class="srow" data-srow="${s.id}">${garmentPic({ kind: s.kind, slot: s.slot, color: s.color, colorLabel: colorLabel(s.color), kindName: kindName(s.kind), gender: s.gender })}<span class="grow"><span class="b">${esc(s.brand)}</span><span class="n">${esc(s.name)}</span><span class="m acc">직접 등록 · ${s.people}/${PEOPLE_NEED} · ${esc(colorLabel(s.color) || '색 미정')} ${esc(kindName(s.kind))}</span></span>${g ? '<span class="ok"><i class="ph-fill ph-check-circle"></i>컬렉션에 있어요</span>' : `<button class="btn line sm" data-sub-add="${s.id}">가지고 있어요</button>`}</div>`; };
    if (!hits.length && !subs.length) { box.innerHTML = `<div class="empty" style="margin-top:24px"><h2 class="h2">‘${esc(text)}’로 찾은 상품이 없어요</h2><p class="t5 sub" style="margin-top:6px">이 앱이 아는 상품 ${M.catalog.count}개 안에서만 찾을 수 있어요. 브랜드만 적거나 한 단어로 줄여 보세요. 아래에서 직접 등록할 수도 있어요.</p></div>`; return; }
    const g0 = M.getState().gender;
    box.innerHTML = `${subs.length ? `<p class="t6" style="margin-top:12px">내가 직접 등록한 옷 ${subs.length}개</p>${subs.map(subRow).join('')}` : ''}
      ${hits.length ? `<p class="t6" style="margin-top:12px">${hits.length}개${hits.length >= 20 ? ' 이상' : ''} · 브랜드·품명에 적은 말이 모두 든 상품</p>
      ${hits.map((p) => { const g = has(p.id); return `<div class="srow${g ? ' done' : ''}" data-srow="${p.id}">${productPic(p.id)}<span class="grow"><span class="b">${esc(p.brand)}</span><span class="n">${esc(p.name)}</span><span class="m">${esc(p.colorFromPhoto ? p.kindName : `${p.colorLabel} ${p.kindName}`)}${p.gender !== g0 ? ` · ${p.gender === 'F' ? '여성' : '남성'}` : ''}</span></span>${g ? '<span class="ok"><i class="ph-fill ph-check-circle"></i>컬렉션에 있어요</span>' : `<button class="btn line sm" data-own-add="${p.id}">가지고 있어요</button>`}</div>`; }).join('')}` : ''}`;
  }
  function drawShelf({ pop = false } = {}) {
    const st = M.getState(); const mine = st.closet;
    const out = mine.length ? M.closetOutfits().total : 0;
    const last = [...mine].slice(-4);
    $('#bar').innerHTML = `<div class="shelfbar${pop && !K.reduce ? ' pop' : ''}" id="shelf"><div class="in"><span class="ths" aria-hidden="true">${last.map((g) => garmentPic(g)).join('')}${last.length < 4 ? '<span class="ph-box empty"></span>' : ''}</span><span class="grow"><b class="num">옷 ${mine.length}벌</b> · ${out ? `코디 ${out}가지` : '코디는 3종류부터'}</span><button class="btn sm go" data-tabgo="closet">컬렉션 보기</button></div></div>`;
  }
  function flyToShelf(rowSel, picHtml, okText) {
    const row = $(rowSel);
    if (row) {
      const from = row.querySelector('.ph-box')?.getBoundingClientRect();
      drawShelf({ pop: true });
      const to = $('#shelf .ths .ph-box:last-child');
      if (from && to) K.fly(picHtml, from, to, { radius: 2 });
      const ok = document.createElement('span'); ok.className = 'ok'; ok.setAttribute('role', 'status');
      ok.innerHTML = `<i class="ph-fill ph-check-circle"></i>${okText}`;
      (row.querySelector('[data-own-add]') || row.querySelector('[data-sub-add]'))?.replaceWith(ok);
    } else drawShelf({ pop: true });
  }
  async function ownAdd(id) {
    const p = M.product(id); if (!p) return;
    const before = M.getState().closetCount ? M.closetOutfits().total : 0;
    let g;
    try { g = M.addOwnedProduct(id); } catch (err) { K.toast(err.message, { bottom: 110 }); return; }
    const finish = () => { const gain = M.closetOutfits().total - before; flyToShelf(`.srow[data-srow="${id}"]`, productPic(id), gain > 0 ? `넣었어요 · 코디 +${gain}` : '컬렉션에 넣었어요'); };
    if (!g.color) { pickColor(g.id, p.kindName, null, finish); return; }
    finish();
  }
  // 직접 등록한 옷을 다시 컬렉션에 넣기(같은 기기의 재등록이라 사람 수는 그대로).
  function subAdd(sid) {
    const s = S.subs.find((x) => x.id === sid); if (!s) return;
    const g = M.addGarment({ kind: s.kind, color: s.color, slot: s.slot, gender: s.gender, label: `${s.brand} ${s.name}` });
    s.garmentId = g.id; saveSubs();
    flyToShelf(`.srow[data-srow="${sid}"]`, garmentPic(g), `넣었어요 · ${s.people}/${PEOPLE_NEED}`);
  }

  // ── 직접 등록 폼: 한 화면에 모두 보이되 질문은 위에서 아래로 하나씩. 비슷한 등록이 있으면 품명 아래에 바로 보인다.
  function registerForm() {
    const F = { kind: null, color: null, dupIgnore: false };
    const rb = $('#rb'), rn = $('#rn'), ru = $('#ru');
    const bar = () => { $('#bar').innerHTML = `<div class="formbar"><div class="in"><button class="btn go wide" id="rsubmit" type="button"${ready() ? '' : ' disabled'}>내 컬렉션에 넣고 등록하기</button><span class="t6" id="rneed">${needText()}</span></div></div>`; $('#rsubmit').onclick = submit; };
    const ready = () => rb.value.trim() && rn.value.trim() && F.kind;
    const needText = () => { const miss = [!rb.value.trim() && '브랜드', !rn.value.trim() && '품명', !F.kind && '종류'].filter(Boolean); return miss.length ? `${miss.join('·')}${josa(miss[miss.length - 1], '을', '를')} 적어 주세요` : F.color ? '사진 없이 등록돼요 · 같은 종류·색의 비슷한 상품 사진이 있으면 그걸로 보여요' : '색은 나중에 채워도 돼요'; };
    const dupBox = $('#dup');
    const drawDup = () => {
      if (F.dupIgnore || !(rb.value.trim() || rn.value.trim().length >= 2)) { dupBox.innerHTML = ''; return; }
      const sims = similarSubs({ brand: rb.value, name: rn.value, kind: F.kind });
      if (!sims.length) { dupBox.innerHTML = ''; return; }
      const mine = M.getState().closet;
      dupBox.innerHTML = `<div class="dup" role="region" aria-label="비슷한 등록"><div class="eyebrow acc"><i class="ph ph-copy"></i>비슷한 등록이 있어요?</div>
        ${sims.map((s) => `<div class="srow">${garmentPic({ kind: s.kind, slot: s.slot, color: s.color, kindName: kindName(s.kind), colorLabel: colorLabel(s.color), gender: s.gender })}<span class="grow"><span class="b">${esc(s.brand)}</span><span class="n">${esc(s.name)}</span><span class="m">${esc(colorLabel(s.color) || '색 미정')} ${esc(kindName(s.kind))} · 등록 ${s.people}/${PEOPLE_NEED}${mine.some((g) => g.id === s.garmentId) ? ' · 컬렉션에 있어요' : ''}</span></span></div>`).join('')}
        <div class="acts"><button class="btn line sm" type="button" data-same="${sims[0].id}">같은 옷이에요</button><button class="btn soft sm" type="button" data-diff>다른 옷이에요</button></div>
        <p class="t6" style="margin-top:8px">같은 옷이면 그 등록에 합쳐요. 같은 기기의 재등록은 사람 수(${PEOPLE_NEED}명)에 더하지 않아요.</p></div>`;
      $('[data-diff]', dupBox).onclick = () => { F.dupIgnore = true; drawDup(); };
      $('[data-same]', dupBox).onclick = () => { const s = S.subs.find((x) => x.id === $('[data-same]', dupBox).dataset.same); if (!s) return; const inCloset = M.getState().closet.some((g) => g.id === s.garmentId); if (!inCloset) { const g = M.addGarment({ kind: s.kind, color: s.color, slot: s.slot, gender: s.gender, label: `${s.brand} ${s.name}` }); s.garmentId = g.id; saveSubs(); } showDone(s, { merged: true, already: inCloset }); };
    };
    let t;
    const onChange = () => { clearTimeout(t); t = setTimeout(() => { drawDup(); bar(); }, 120); };
    rb.oninput = onChange; rn.oninput = onChange;
    $$('#rk [data-k]').forEach((b) => { b.onclick = () => { F.kind = F.kind === b.dataset.k ? null : b.dataset.k; $$('#rk [data-k]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.k === F.kind)); drawDup(); bar(); }; });
    $$('#rc [data-c]').forEach((b) => { b.onclick = () => { F.color = F.color === b.dataset.c ? null : b.dataset.c; $$('#rc [data-c]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.c === F.color)); bar(); }; });
    $('#rf').onsubmit = (e) => { e.preventDefault(); if (ready()) submit(); };
    function submit() {
      if (!ready()) return;
      const url = ru.value.trim();
      if (url && !/^https?:\/\/\S+$/i.test(url)) { K.toast('판매처 링크는 https://로 시작하는 주소만 받아요', { bottom: 100 }); ru.focus(); return; }
      const gender = M.getState().gender || 'M';
      const slot = M.slotChoices(F.kind, gender)[0]?.id || null;
      const brand = rb.value.trim().slice(0, 40), name = rn.value.trim().slice(0, 80);
      const g = M.addGarment({ kind: F.kind, color: F.color, slot, gender, label: `${brand} ${name}` });
      const s = { id: `s_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`, brand, name, kind: F.kind, slot, color: F.color, gender, url: url || null, garmentId: g.id, people: 1, at: new Date().toISOString() };
      S.subs.push(s); saveSubs();
      showDone(s, { merged: false });
    }
    function showDone(s, { merged, already = false }) {
      const g = M.getState().closet.find((x) => x.id === s.garmentId);
      const out = M.closetOutfits({ detail: true }).list.filter((o) => o.pieces.some((x) => x.garmentId === s.garmentId)).length;
      $('#app').innerHTML = `<div class="view">${top()}<div class="form-wrap">
        <div class="eyebrow acc" style="margin-top:12px"><i class="ph-fill ph-check-circle"></i>${already ? '이미 컬렉션에 있어요' : '내 컬렉션에 넣었어요'}</div>
        <h1 class="h1" style="margin-top:6px">${esc(s.brand)} ${esc(s.name)}</h1>
        <div class="done-tile">${g ? garmentPic(g) : ''}<div class="grow"><div class="t5">${esc(colorLabel(s.color) || '색 미정')} ${esc(kindName(s.kind))}${s.url ? ' · 판매처 링크 있음' : ''}</div><div class="t6">사진은 올리지 않았어요 · ${g && picIsPhoto(g) ? '같은 종류·색의 비슷한 상품 사진으로 보여요' : '사진 없이 색으로 보여요'}</div>${s.color ? `<div class="t6 acc" style="margin-top:4px">이 옷으로 입을 수 있는 코디 ${out}가지</div>` : '<div class="t6" style="margin-top:4px">색을 채우면 코디에 셀 수 있어요</div>'}</div></div>
        <section class="state" aria-label="등록 상태"><h2 class="h3"><i class="ph ph-users-three"></i>같은 옷을 ${PEOPLE_NEED}명이 등록하면 모두가 검색할 수 있어요</h2>
          <div class="meter"><span class="dots" aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= s.people ? 'on' : ''}"></i>`).join('')}</span><span class="num">지금 ${s.people}/${PEOPLE_NEED} · 서버 연결 전에는 이 기기에만</span></div>
          ${merged ? `<p class="t6" style="margin-top:8px">먼저 있던 등록에 합쳤어요. 같은 기기의 재등록은 사람 수에 더하지 않아요.</p>` : ''}</section>
        <div class="decs" style="margin-top:20px"><button class="btn go" data-tabgo="closet">컬렉션 보기</button><button class="btn line" data-register>하나 더 등록</button>${!s.color ? `<button class="btn soft" data-fillc="${s.garmentId}">색 채우기</button>` : ''}</div>
        </div></div>`;
      $('#bar').innerHTML = ''; $('#tabs').hidden = false; $('#app').className = 'app';
      $('[data-fillc]') && ($('[data-fillc]').onclick = () => pickColor(s.garmentId, kindName(s.kind), null, () => { s.color = M.getState().closet.find((x) => x.id === s.garmentId)?.color || null; saveSubs(); showDone(s, { merged }); }));
      scrollTo(0, 0);
    }
    drawDup(); bar();
    if (!rb.value) setTimeout(() => rb.focus(), 60);
  }

  function menu() {
    const sh = sheet(`<div class="menu"><button class="row" data-info><span class="grow t5">이 시안에 대해</span><i class="ph ph-info arr"></i></button><button class="row" data-theme><span class="grow t5">밝게 · 어둡게</span><i class="ph ph-moon arr"></i></button><button class="row" data-reset><span class="grow t5">처음부터 다시</span><i class="ph ph-arrow-counter-clockwise arr"></i></button></div>`);
    $('[data-info]', sh.s).onclick = async () => { await sh.close(); M.openDisclosure ? M.openDisclosure() : K.info(DESIGN); };
    $('[data-theme]', sh.s).onclick = async () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; await sh.close(); };
    $('[data-reset]', sh.s).onclick = async () => { K.reset(); S.ai = {}; S.aiOrder = {}; S.ui = { absent: {} }; saveUi(); S.subs = []; saveSubs(); await sh.close(); K.tab('home'); };
  }

  const r0 = M.route.current();
  K.start(render, { view: 'home', params: {} });
  if (M.boot?.q) K.go('results', { q: M.boot.q });
  else if (/^\/p\/.+/.test(r0.path)) K.go('detail', { id: r0.path.slice(3) });
  else if (r0.path === '/search' && r0.params.q) K.go('results', { q: r0.params.q });
  else if (['/closet', '/records', '/consult', '/looks'].includes(r0.path)) K.tab(r0.path.slice(1));
  else if (r0.path === '/add') K.go('add', {});
  else if (r0.path === '/register') K.go('register', {});
  else if (r0.path === '/compare') K.go('compare', {});
})();
</script>
