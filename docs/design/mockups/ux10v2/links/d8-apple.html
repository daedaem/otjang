  const DESIGN = '애플식 시안';
  const S = { landing: null, before: null, view: 'rank', ai: null, aiState: 'wait', aiWhy: '' };
  const FLAT = window.PHOTO_FLAT || new Set();
  const PIC = ['tee', 'shirt', 'knit', 'sweat', 'pants', 'jeans', 'jacket', 'coat', 'sneaker', 'loafer', 'cardigan', 'blazer'];
  const won = (n) => `${Number(n).toLocaleString('ko-KR')}원`;
  const day = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };

  // ── 사진: 흰 배경 단독 사진은 칸에 띄우고, 나머지는 칸을 채운다. 내 옷(종류·색)은 흰 배경 사진이 없으면 색 칸.
  function productPic(id, { tag = '', extra = '' } = {}) {
    const ph = M.photo({ id });
    const t = tag ? `<span class="tag">${esc(tag)}</span>` : '';
    if (!ph) return `<span class="ph-box">${M.photoHtml({ id }, { caption: false })}${t}${extra}</span>`;
    const flat = FLAT.has(id) || K.WHITE.has(id);
    return `<span class="ph-box"><img class="${flat ? 'flat' : 'cover'}" src="${esc(ph.src)}" alt="${esc(ph.alt)}" decoding="async">${t}${extra}</span>`;
  }
  function garmentPic(g) {
    const id = K.CUT[`${g.gender || 'M'}|${g.kind}|${g.color}`]?.[0];
    if (id) { const ph = M.photo({ id }); if (ph) return `<span class="ph-box"><img class="flat" src="${esc(ph.src)}" alt="${esc((g.colorLabel || '') + ' ' + (g.kindName || ''))}" decoding="async"></span>`; }
    return `<span class="ph-box"><span class="swatch"><i style="background:${esc(g.colorHex || '#ddd')}"></i>${esc(g.kindName || '')}</span></span>`;
  }
  const piecePic = (p) => {
    const g = p.garmentId && M.getState().closet.find((x) => x.id === p.garmentId);
    if (g) return garmentPic(g);
    if (p.product) return productPic(p.product.id);
    return garmentPic({ kind: p.kind, kindName: p.kindName, color: p.color, colorHex: p.colorHex, colorLabel: p.colorLabel });
  };

  // ── 탐색 막대와 큰 제목
  const nav = (title, { back = false, right = '' } = {}) => `<header class="nav" id="nav"><span class="l">${back ? '<button class="nb" data-back aria-label="뒤로"><i class="ph ph-caret-left"></i></button>' : ''}</span><span class="nt">${esc(title)}</span><span class="r">${right}</span></header>`;
  const menuBtn = '<button class="nb round" data-menu aria-label="더보기"><i class="ph ph-dots-three-circle"></i></button>';
  let io;
  function watchTitle() {
    io?.disconnect();
    const lt = $('.lt'), nv = $('#nav');
    if (!nv) return;
    if (!lt || !('IntersectionObserver' in window)) { nv.classList.add('compact'); return; }
    io = new IntersectionObserver(([e]) => nv.classList.toggle('compact', !e.isIntersecting), { rootMargin: '-52px 0px 0px 0px' });
    io.observe(lt);
  }

  // ── 결과 한 줄(순위 목록)과 사진 칸
  function rankRow(p, ai, i) {
    const fit = ai?.fit === '겹쳐요' ? '<span class="fit warn">겹쳐요</span> · ' : ai?.fit === '추천' ? '<span class="fit">추천</span> · ' : '';
    const rank = ai ? `<span class="rk num">${ai.rank}</span>` : `<span class="rk dim num">${i + 1}</span>`;
    const reason = S.aiState === 'wait' ? '<span class="skel"></span>' : ai?.reason ? `<div class="reason clip2">${fit}${esc(ai.reason)}</div>` : '';
    return `<button class="cell th" data-pid="${p.id}">${rank}<span class="thumb72">${productPic(p.id)}</span>
      <span class="grow"><span class="t13 clip1" style="display:block">${esc(p.brand)}</span><span class="t15 clip1" style="display:block">${esc(p.name)}</span>
      <span class="meta"><span class="price num">${esc(p.priceText)}<small>${esc(p.priceShort)}</small></span>${p.owned?.tone === 'stop' ? '<span class="t13">비슷한 옷 있음</span>' : ''}</span>${reason}</span></button>`;
  }
  function photoCard(p, ai) {
    return `<button class="pcard" data-pid="${p.id}">${productPic(p.id, { tag: p.owned?.tone === 'stop' ? '비슷한 옷 있어요' : '', extra: ai ? `<span class="rkb num">${ai.rank}</span>` : '' })}
      <span class="body" style="display:block"><span class="t13 clip1" style="display:block">${esc(p.brand)}</span><span class="t15 clip2" style="display:block">${esc(p.name)}</span><span class="price num sb" style="display:block;margin-top:4px;font-size:15px">${esc(p.priceText)} <span class="t13" style="font-weight:400">${esc(p.priceShort)}</span></span></span></button>`;
  }
  function orderedProducts() {
    const r = S.result; if (!r) return [];
    const list = r.products.slice(0, 12);
    if (!S.ai) return list.map((p) => [p, null]);
    const by = Object.fromEntries(list.map((p) => [p.id, p]));
    return Object.values(S.ai).sort((a, b) => a.rank - b.rank).filter((o) => by[o.id]).map((o) => [by[o.id], o]);
  }
  function aiHeader() {
    if (S.aiState === 'wait') return '<b><i class="ph ph-circle-notch spin"></i>AI가 순위를 매기는 중</b><span>내 옷장 기준</span>';
    if (S.aiState === 'ok') return '<b><i class="ph-fill ph-sparkle"></i>AI 추천 순위</b><span>내 옷장 기준</span>';
    return '<b>기본 순서</b>';
  }
  function aiFooter() {
    if (S.aiState === 'ok') return `${S.aiSummary ? `${esc(S.aiSummary)} ` : ''}후보는 조건에 맞는 상품을 규칙으로 골랐고, 순위와 이유는 AI(Claude)가 상품 정보·평점·후기·내 옷장만 보고 정했어요.`;
    if (S.aiState === 'wait') return '상품 정보와 내 옷장만 AI에 보내요. 사진은 보내지 않아요.';
    return `${esc(S.aiWhy)} 후보와 순서는 정해 둔 규칙으로 골랐어요.`;
  }
  function resultsBody() {
    const rows = orderedProducts();
    if (S.view === 'grid') return `<div class="group"><div class="gh">${aiHeader()}</div><div class="pgrid">${rows.map(([p, ai]) => photoCard(p, ai)).join('')}</div><div class="gf">${aiFooter()} 가격은 수집한 날의 판매가예요.</div></div>`;
    return `<div class="group"><div class="gh">${aiHeader()}</div><div class="cells" id="list">${rows.map(([p, ai], i) => rankRow(p, ai, i)).join('')}</div><div class="gf">${aiFooter()} 가격은 수집한 날의 판매가예요.</div></div>`;
  }

  // ── 화면
  function render(view, params, dir) {
    $('#bar').innerHTML = '';
    const html = (V[view] || V.home)(params);
    $('#app').innerHTML = `<div class="view ${dir === 'back' ? 'back' : ''}">${html}</div>`;
    const tabbed = ['home', 'closet', 'records'].includes(view);
    $('#tabs').hidden = !tabbed;
    $$('#tabs [data-tab]').forEach((b) => { const on = b.dataset.tab === view; if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); const i = b.querySelector('i'); i.className = `${on ? 'ph-fill' : 'ph'} ${i.className.split(' ').pop()}`; });
    watchTitle();
    (A[view] || (() => {}))(params);
  }

  const V = {
    home() {
      const st = M.getState();
      const mine = st.closet;
      const ex = M.examples().slice(0, 4);
      return `${nav('찾기', { right: menuBtn })}
        <h1 class="lt">찾기</h1>
        <form class="search" id="sf" role="search"><i class="ph ph-magnifying-glass"></i><input id="q" name="q" enterkeyhint="search" autocomplete="off" placeholder="출근할 때 입을 셔츠" aria-label="찾는 옷"><button aria-label="찾기"><i class="ph ph-arrow-up"></i></button></form>
        <div class="gf" style="padding-left:4px">대충 말해도 돼요. 종류·상황·예산·색을 알아들어요.</div>
        <div class="group"><div class="gh">이렇게 찾아보세요</div><div class="cells">
          ${ex.map((q) => `<button class="cell ic" data-q="${esc(q)}"><span class="badge-ic soft"><i class="ph ph-magnifying-glass"></i></span><span class="grow t17 clip1">${esc(q)}</span><i class="ph ph-caret-right chev"></i></button>`).join('')}
        </div></div>
        <div class="group"><div class="gh">내 옷장</div><div class="cells">
          <button class="cell" data-tabgo="closet"><span class="stack">${mine.slice(0, 3).map((g) => `<span>${garmentPic(g)}</span>`).join('')}</span>
            <span class="grow"><span class="t17 sb" style="display:block">${mine.length ? `옷 ${mine.length}벌 · ${M.closetOutfits().total}가지 조합` : '옷장이 비어 있어요'}</span><span class="t13">${st.trialCount ? '체험용 옷으로 보는 중' : mine.length ? '사기 전에 겹치는 옷을 알려 드려요' : '가진 옷을 넣으면 겹치는 옷을 알려 드려요'}</span></span>
            <i class="ph ph-caret-right chev"></i></button>
        </div></div>`;
    },

    results({ q, drop = [] }) {
      const r = M.ask(q, { drop });
      const tokens = (r.conditions || []).map((c) => c.removable ? `<button class="token" data-drop="${esc(c.key)}" aria-label="${esc(c.label)} 조건 빼기">${esc(c.label)}<i class="ph ph-x-circle"></i></button>` : `<span class="token">${esc(c.label)}</span>`).join('');
      if (!r.understood || !r.products.length) {
        S.result = null;
        const rel = r.understood ? M.relax(r) : [];
        return `${nav(q, { back: true })}<h1 class="lt">${esc(q)}</h1>${tokens ? `<div class="tokens">${tokens}</div>` : ''}
          <div class="group empty"><div class="gh">${r.understood ? '조건에 맞는 옷이 없어요' : '무슨 옷인지 못 알아들었어요'}</div>
          ${rel.length ? `<div class="cells">${rel.map((x) => `<button class="cell" data-relax='${esc(JSON.stringify(x.drop))}'><span class="grow t17">${esc(x.title)}</span><i class="ph ph-caret-right chev"></i></button>`).join('')}</div><div class="gf">조건을 하나 빼면 이만큼 찾을 수 있어요.</div>` : '<div class="gf">종류를 넣어 다시 말해 주세요. 예: 셔츠, 코트, 운동화</div>'}</div>`;
      }
      const same = S.result && S.lastKey === `${q}|${drop.join(',')}`;
      S.result = r; S.lastKey = `${q}|${drop.join(',')}`;
      if (!same) { S.ai = null; S.aiState = 'wait'; S.aiWhy = ''; S.aiSummary = ''; }
      return `${nav(q, { back: true })}<h1 class="lt">${esc(q)}</h1><div class="lt-sub">${r.total}개 찾았어요</div>
        ${tokens ? `<div class="tokens">${tokens}</div>` : ''}
        <div class="segc" data-v="${S.view}" role="group" aria-label="보기"><span class="thumb"></span><button data-view="rank" aria-pressed="${S.view === 'rank'}">순위</button><button data-view="grid" aria-pressed="${S.view === 'grid'}">사진</button></div>
        <div id="rbody">${resultsBody()}</div>`;
    },

    detail({ id }) {
      const p = M.product(id);
      const ai = S.ai?.[id];
      const v = p.verdict;
      const same = (v.owned || []).filter((o) => ['same-product', 'same-color'].includes(o.relation));
      const look = (v.looks || []).find((l) => l.pieces.some((x) => x.candidate));
      let head, why = v.basisLabel;
      if (v.basis === 'none') head = '아직 비교할 옷이 없어요';
      else if (same.length) { head = `비슷한 옷이 <b>${same.length}벌</b> 있어요`; why = `${v.basisLabel} · 같은 종류·색이에요`; }
      else if (v.newLookCount) head = `새 조합이 <b>${v.newLookCount}개</b> 생겨요`;
      else head = esc(v.title);
      const dec = v.record?.decision;
      return `${nav(p.brand, { back: true })}
        <div class="hero">${productPic(id)}</div>
        <div class="pdp-head"><div class="brand">${esc(p.brand)}</div><h1 class="lt">${esc(p.name)}</h1>
          <div class="price num">${esc(p.priceText)}<small>${esc(p.priceNote)}</small></div></div>
        ${ai?.reason ? `<div class="group"><div class="gh"><b><i class="ph-fill ph-sparkle"></i>AI 추천</b><span>내 옷장 기준</span></div><div class="cells"><div class="ai-cell"><div class="k"><span class="big num">${ai.rank}</span>위 · ${ai.fit ? esc(ai.fit) : '이번 검색 결과 중'}</div><p>${esc(ai.reason)}</p></div></div></div>` : ''}
        <div class="group"><div class="gh">내 옷과 비교</div><div class="cells">
          <div class="cell" style="display:block;padding-top:14px;padding-bottom:14px"><div class="verdict-h">${head}</div><div class="t13" style="margin-top:4px">${esc(why)}</div></div>
          ${same.length ? `<div class="owned">${same.map((o) => `<div class="o">${garmentPic(o)}<div class="t13" style="margin-top:5px">${esc(o.colorLabel)} ${esc(o.kindName)}${o.trial ? ' · 체험용' : ''}</div></div>`).join('')}</div>` : ''}
          ${!same.length && look ? `<div class="look">${look.pieces.slice(0, 4).map((x) => `<span class="ph-box${x.candidate ? ' me' : ''}">${piecePic(x).replace(/^<span class="ph-box[^"]*">|<\/span>$/g, '')}</span>`).join('')}</div>` : ''}
          ${v.basis === 'none' ? '<button class="cell" data-tabgo="closet"><span class="grow t17">옷장 채우러 가기</span><i class="ph ph-caret-right chev"></i></button>' : ''}
        </div>${!same.length && look ? '<div class="gf">이 옷을 더한 조합이에요. 테두리가 이 옷이에요.</div>' : ''}</div>
        <div class="group"><div class="cells">
          <a class="cell" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="grow t17">무신사에서 보기</span><i class="ph ph-arrow-up-right chev"></i></a>
          <button class="cell" data-dec="skip"><span class="grow t17" style="color:var(--ink3)">${dec === 'skip' ? '안 사기로 했어요' : '이 옷은 안 살래요'}</span></button>
        </div></div>`;
    },

    done({ id, d }) {
      const p = M.product(id);
      const T = { buy: ['사기로 했어요', '받으면 옷장에 넣을 수 있어요', 'ph-check'], hold: ['고민 중에 담았어요', '기록에서 언제든 다시 볼 수 있어요', 'ph-bookmark-simple'], skip: ['안 사기로 했어요', '같은 옷이 또 보이면 알려 드릴게요', 'ph-x'] }[d];
      return `<div class="done"><span class="sym ${d === 'skip' ? 'soft' : ''}"><i class="ph-fill ${T[2]}"></i></span>
        <h1 class="lt">${T[0]}</h1><p class="t15" style="color:var(--ink2);margin:0">${esc(p.brand)} ${esc(p.name)}</p><p class="t13" style="margin:0">${T[1]}</p></div>`;
    },

    closet() {
      const st = M.getState();
      const mine = st.closet;
      const out = M.closetOutfits({ detail: true });
      const groups = [['상의', ['tee', 'longtee', 'shirt', 'polo', 'knit', 'sweat']], ['하의', ['pants', 'jeans', 'skirt']], ['아우터', ['jacket', 'blazer', 'cardigan', 'coat', 'down', 'vest']], ['신발', ['sneaker', 'loafer', 'boot']]];
      const other = mine.filter((g) => !groups.some(([, ks]) => ks.includes(g.kind)));
      const sect = (name, items) => `<div class="group"><div class="gh">${name}<span class="num">${items.length}</span></div><div class="cells"><div class="cgrid">${items.map((g) => `<button class="g${g.id === S.landing ? ' landing' : ''}" data-g="${g.id}">${garmentPic(g)}<div class="t13">${esc(g.colorLabel)} ${esc(g.kindName)}${g.trial ? ' · 체험용' : ''}</div></button>`).join('')}</div></div></div>`;
      return `${nav('옷장', { right: `<button class="nb" data-add aria-label="옷 넣기"><i class="ph ph-plus"></i></button>${menuBtn}` })}
        <h1 class="lt">옷장</h1>
        <div class="group" style="margin-top:16px"><div class="cells"><div class="sum"><div><b class="num">${mine.length}</b><span class="t13">벌</span></div><div><b class="num" id="lookN">${out.total}</b><span class="t13">가지 조합</span></div></div>
          ${st.trialCount ? `<div class="cell"><span class="grow t15" style="color:var(--ink2)">체험용 옷 ${st.trialCount}벌로 보는 중이에요</span><button class="mini-btn" data-mine>내 옷으로</button></div>` : ''}</div>
          ${mine.length ? '' : '<div class="gf">오른쪽 위 +로 가진 옷을 넣어 보세요. 종류와 색만 고르면 돼요.</div>'}</div>
        ${out.list.length ? `<div class="group"><div class="gh">입을 수 있는 조합<span>종류·색 기준</span></div>
          <div class="looks">${out.list.slice(0, 10).map((l) => { const ps = l.pieces.filter((x) => ['outer', 'top', 'bottom', 'shoes', 'dress'].includes(x.role)).slice(0, 4); return `<div class="lk"><div class="grid4">${ps.map(piecePic).join('')}</div><div class="t13 clip2">${ps.map((x) => `${esc(x.colorLabel)} ${esc(x.kindName)}`).join(' · ')}</div></div>`; }).join('')}</div></div>` : ''}
        ${groups.map(([name, ks]) => { const items = mine.filter((g) => ks.includes(g.kind)); return items.length ? sect(name, items) : ''; }).join('')}
        ${other.length ? sect('기타', other) : ''}
        ${mine.length ? '<div class="gf" style="margin-top:12px">옷장 사진은 내 옷이 아니라 종류·색이 같은 상품 사진이에요.</div>' : ''}`;
    },

    records({ f = 'all' } = {}) {
      const all = M.getState().records.filter((r) => r.decision);
      const rs = all.filter((r) => f === 'all' || r.decision === f);
      const buy = all.filter((r) => r.decision === 'buy');
      const sum = buy.reduce((a, r) => a + (r.product?.price || 0), 0);
      const segs = [['all', '전체'], ['buy', '살게요'], ['hold', '고민 중'], ['skip', '안 살래요']];
      const idx = segs.findIndex(([k]) => k === f);
      return `${nav('기록', { right: menuBtn })}
        <h1 class="lt">기록</h1>
        <div class="group" style="margin-top:16px"><div class="cells"><div class="sum"><div><b class="num">${all.length}</b><span class="t13">벌 결정</span></div><div><b class="num" style="font-size:${sum >= 1e6 ? 26 : 30}px">${buy.length ? won(sum) : '0원'}</b><span class="t13">사기로 한 옷 · 수집가 합계</span></div></div></div></div>
        <div class="segc" style="grid-template-columns:repeat(4,1fr)" role="group" aria-label="결정 종류"><span class="thumb" style="width:calc(25% - 1px);transform:translateX(${idx * 100}%)"></span>${segs.map(([k, l]) => `<button data-f="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
        ${rs.length ? `<div class="group" style="margin-top:16px"><div class="cells">${rs.map((r) => `<button class="cell th" data-pid="${r.productId}" style="align-items:center"><span class="thumb72" style="width:48px">${productPic(r.productId)}</span><span class="grow"><span class="t15 clip1" style="display:block">${esc(r.product?.name || '')}</span><span class="t13"><span class="pill ${r.decision === 'buy' ? 'buy' : ''}">${{ buy: '살게요', hold: '고민 중', skip: '안 살래요' }[r.decision]}</span>${day(r.updatedAt)}</span></span><span class="price num">${esc(r.product?.priceText || '')}</span></button>`).join('')}</div></div>`
          : `<div class="group" style="margin-top:16px"><div class="cells">${all.length ? '<div class="cell"><span class="grow t15" style="color:var(--ink3)">이 종류로 결정한 옷이 없어요</span></div>' : '<button class="cell" data-tabgo="home"><span class="grow t17">옷 찾으러 가기</span><i class="ph ph-caret-right chev"></i></button>'}</div>${all.length ? '' : '<div class="gf">옷을 보고 살지 말지 정하면 여기에 남아요.</div>'}</div>`}`;
    },
  };

  // ── 화면별 동작
  const A = {
    home() {
      $('#sf').onsubmit = (e) => { e.preventDefault(); const q = $('#q').value.trim(); if (q) K.go('results', { q }); else $('#q').focus(); };
      $$('[data-q]').forEach((b) => { b.onclick = () => K.go('results', { q: b.dataset.q }); });
    },
    async results({ q, drop = [] }) {
      $$('[data-drop]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: [...drop, b.dataset.drop] }, { replace: true }); });
      $$('[data-relax]').forEach((b) => { b.onclick = () => K.go('results', { q, drop: JSON.parse(b.dataset.relax) }, { replace: true }); });
      $$('[data-view]').forEach((b) => { b.onclick = () => { S.view = b.dataset.view; const seg = $('.segc'); seg.dataset.v = S.view; $$('[data-view]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.view === S.view))); $('#rbody').innerHTML = resultsBody(); }; });
      const r = S.result;
      if (!r?.products?.length || S.aiState !== 'wait') return;
      const key = S.lastKey;
      const res = await AIRank.rank(q, r, { limit: 12 });
      if (S.lastKey !== key || !$('#rbody')) return;
      const first = new Map($$('#rbody [data-pid]').map((c) => [c.dataset.pid, c.getBoundingClientRect()]));
      if (res.ok) { S.ai = Object.fromEntries(res.order.map((o) => [o.id, o])); S.aiState = 'ok'; S.aiSummary = res.summary; }
      else { S.aiState = 'off'; S.aiWhy = AIRank.whyText(res.why); }
      $('#rbody').innerHTML = resultsBody();
      if (!K.reduce && res.ok) $$('#rbody [data-pid]').forEach((c) => { const a = first.get(c.dataset.pid), b = c.getBoundingClientRect(); if (a && Math.abs(a.top - b.top) > 1) c.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px)` }, { transform: 'none' }], { duration: 560, easing: K.SPRING.css }); });
    },
    detail({ id }) {
      const v = M.product(id).verdict;
      const dec = v.record?.decision;
      $('#bar').innerHTML = `<div class="bar"><div class="in"><button class="btn tint" data-dec="hold">${dec === 'hold' ? '고민 중' : '고민할게요'}</button><button class="btn fill" data-dec="buy">${dec === 'buy' ? '사기로 했어요' : '살게요'}</button></div></div>`;
      $$('[data-dec]').forEach((b) => { b.onclick = () => { M.decide(id, b.dataset.dec); K.go('done', { id, d: b.dataset.dec }, { replace: true }); }; });
    },
    done() {
      $('#bar').innerHTML = `<div class="bar"><div class="in col"><button class="btn fill" data-ok>확인</button><button class="btn plain" data-rec>기록 보기</button></div></div>`;
      $('[data-ok]').onclick = () => K.back();
      $('[data-rec]').onclick = () => K.tab('records');
    },
    closet() {
      $$('[data-add]').forEach((b) => { b.onclick = () => addFlow(); });
      $('[data-mine]') && ($('[data-mine]').onclick = () => { M.clearTrialCloset(); K.refresh(); K.toast('체험용 옷을 뺐어요'); });
      $$('[data-g]').forEach((b) => { b.onclick = () => garmentSheet(b.dataset.g); });
      if (S.landing) land();
    },
    records() {
      $$('[data-f]').forEach((b) => { b.onclick = () => K.go('records', { f: b.dataset.f }, { replace: true }); });
    },
  };

  // ── 공통 이벤트(화면이 바뀌어도 한 번만 건다)
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-back],[data-pid],[data-tabgo],[data-menu]');
    if (!t) return;
    if (t.hasAttribute('data-back')) K.back();
    else if (t.dataset.pid) K.go('detail', { id: t.dataset.pid });
    else if (t.dataset.tabgo) K.tab(t.dataset.tabgo);
    else if (t.hasAttribute('data-menu')) menu();
  });
  $$('#tabs [data-tab]').forEach((b) => { b.onclick = () => K.tab(b.dataset.tab); });

  // ── 시트
  function sheet(html) {
    const w = document.createElement('div');
    w.innerHTML = `<div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    document.body.appendChild(w);
    const s = $('.sheet', w);
    if (!K.reduce) { s.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }], { duration: K.SPRING.ms, easing: K.SPRING.css }); $('.scrim', w).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 }); }
    const close = async () => {
      if (!K.reduce) { await Promise.all([s.animate([{ transform: 'none' }, { transform: 'translateY(100%)' }], { duration: 240, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' }).finished, $('.scrim', w).animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'forwards' }).finished]); }
      w.remove();
    };
    $('.scrim', w).onclick = close;
    const esc_ = (e) => { if (e.key === 'Escape') { close(); removeEventListener('keydown', esc_); } };
    addEventListener('keydown', esc_);
    return { w, s, close };
  }

  // 옷 넣기: 한 번에 한 질문(종류 → 색).
  function addFlow() {
    const kinds = M.kindChoices().filter((k) => PIC.includes(k.id)).sort((a, b) => PIC.indexOf(a.id) - PIC.indexOf(b.id));
    const thumbColor = (kid) => ['white', 'black', 'navy', 'grey', 'indigo', 'blue', 'beige'].find((c) => K.CUT[`M|${kid}|${c}`]) || 'black';
    const sh = sheet(`<div class="sh-title">옷 넣기</div><div class="sh-sub">어떤 옷이에요?</div><div class="kinds">${kinds.map((k) => `<button data-k="${k.id}">${garmentPic({ kind: k.id, kindName: k.name, color: thumbColor(k.id), gender: 'M' })}${esc(k.name)}</button>`).join('')}</div>`);
    $$('[data-k]', sh.s).forEach((b) => { b.onclick = () => {
      const kind = b.dataset.k, kname = kinds.find((k) => k.id === kind).name;
      sh.s.innerHTML = `<div class="grab"></div><div class="sh-title">옷 넣기</div><div class="sh-sub">무슨 색이에요?</div>
        <div class="pick"><span class="pv" id="pv">${garmentPic({ kind, kindName: kname, color: thumbColor(kind), gender: 'M' })}</span><span class="t17 sb">${esc(kname)}</span></div>
        <div class="colors">${M.colorChoices().map((c) => `<button data-c="${c.id}" aria-label="${esc(c.label)}"><i style="background:${c.hex}"></i>${esc(c.label)}</button>`).join('')}</div>`;
      $$('[data-c]', sh.s).forEach((cb) => { cb.onclick = async () => {
        const color = cb.dataset.c;
        const before = M.closetOutfits().total;
        const g = M.addGarment({ kind, color, slot: M.slotChoices(kind)[0]?.id || null });
        const from = $('#pv', sh.s).getBoundingClientRect();
        const html = garmentPic({ ...g });
        await sh.close();
        S.landing = g.id; S.before = before; S.fromRect = from; S.flyHtml = html;
        K.refresh();
      }; });
    }; });
  }
  async function land() {
    const id = S.landing; S.landing = null;
    const el = $(`[data-g="${id}"]`);
    if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: 'instant' });
    await K.fly(S.flyHtml, S.fromRect, el.querySelector('.ph-box'), { radius: 10 });
    el.classList.remove('landing'); el.classList.add('settle');
    const after = M.closetOutfits().total, gain = after - S.before;
    K.toast(gain > 0 ? `옷장에 넣었어요 · 조합 +${gain}` : '옷장에 넣었어요', { bottom: 80 });
  }
  function garmentSheet(id) {
    const g = M.getState().closet.find((x) => x.id === id);
    if (!g) return;
    const sh = sheet(`<div class="pick"><span class="pv" style="width:72px">${garmentPic(g)}</span><span><span class="t17 sb" style="display:block">${esc(g.colorLabel)} ${esc(g.kindName)}</span><span class="t13">${g.trial ? '체험용 옷' : '내 옷'} · 사진은 비슷한 상품</span></span></div><div class="cells"><button class="cell" data-rm><span class="grow t17" style="text-align:center">옷장에서 빼기</span></button></div>`);
    $('[data-rm]', sh.s).onclick = async () => { try { M.removeGarment(id); await sh.close(); K.refresh(); K.toast('옷장에서 뺐어요', { bottom: 80 }); } catch (e) { K.toast(e.message); } };
  }
  function menu() {
    const sh = sheet(`<div class="cells"><button class="cell ic" data-info><span class="badge-ic soft"><i class="ph ph-info"></i></span><span class="grow t17">이 시안에 대해</span></button><button class="cell ic" data-theme><span class="badge-ic soft"><i class="ph ph-moon"></i></span><span class="grow t17">밝게·어둡게</span></button><button class="cell ic" data-reset><span class="badge-ic soft"><i class="ph ph-arrow-counter-clockwise"></i></span><span class="grow t17">처음부터 다시</span></button></div>`);
    $('[data-info]', sh.s).onclick = async () => { await sh.close(); K.info(DESIGN); };
    $('[data-theme]', sh.s).onclick = async () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; await sh.close(); };
    $('[data-reset]', sh.s).onclick = async () => { K.reset(); M.loadTrialCloset('M'); await sh.close(); K.tab('home'); K.toast('처음 상태로 돌렸어요'); };
  }

  if (!M.getState().closetCount) M.loadTrialCloset('M');
  K.start(render, { view: 'home', params: {} });
})();
</script>
