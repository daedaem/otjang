<!doctype html>
<html lang="ko" data-team="05">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>디자인 보드 05 코디 먼저</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
  /* 05 고유 부품: 코디 보드(실제 사진 타일), 주인공 정보, 구성 옷 목록 */
  .look-h { display: flex; align-items: center; justify-content: space-between; margin: 14px var(--gut) 8px; }
  .look-h b { font-size: 16px; } .look-h .nav { display: flex; gap: 6px; }
  .look-h .nav span { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line-2); display: grid; place-items: center; background: var(--bg); }
  .lookb { margin: 0 var(--gut); padding: 8px; border-radius: var(--r-card); background: #fff; box-shadow: var(--shadow-1); }
  .lookb .g { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; }
  .lookb .side { display: grid; gap: 6px; }
  .lookb .t { position: relative; border-radius: 6px; overflow: hidden; }
  .lookb .t .lab { position: absolute; left: 6px; top: 6px; z-index: 2; height: 22px; padding: 0 7px; border-radius: 4px; background: rgba(255, 255, 255, .92); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; }
  .lookb .t.hero .lab { background: var(--ink); color: #fff; }
  .lookb .low { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
  .lookb .cap { margin: 8px 2px 0; font-size: 12px; color: var(--sub); display: flex; justify-content: space-between; }
  .hero-info { margin: 14px var(--gut) 0; }
  .hero-info .b { font-size: 13px; font-weight: 700; } .hero-info .n { font-size: 16px; } .hero-info .p { font-size: 20px; font-weight: 800; margin-top: 2px; }
  .hero-info .sum { font-size: 13px; color: var(--sub); margin-top: 6px; }
  .pieces .pc { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .pieces .pc .ph { width: 64px; height: 80px; border-radius: 4px; overflow: hidden; }
  .pieces .pc b { display: block; font-size: 12px; color: var(--sub); font-weight: 700; }
</style>
<script src="../shared/eoul-mock.js"></script>
<script src="kit.js"></script>
</head>
<body>
<script>
(() => {
  if (!window.K) return;
  const { M, esc, ico, ph } = K;
  K.board({ n: '05', name: '코디 먼저', idea: '결과를 입은 조합으로 시작한다. 실제 상품 사진(내 옷은 비슷한 상품 사진)을 같은 비율 타일로 모은 코디 보드 → 주인공 옷의 판정·결정 → 다른 후보. 합성 이미지 없음.', refs: 'baymard-product-suggestions · if-hugoboss-app-2011 · baymard-human-model · DVF(Webby 2025 People\'s Voice, 수상 사실만)' });
  const { r, d } = K.data();
  const look = (dd) => {
    const o = dd.outfit; if (!o) return '';
    const hero = o.pieces.find((x) => x.focus) || o.pieces[0];
    const rest = o.pieces.filter((x) => x !== hero);
    const t = (x, cls = '') => `<div class="t ${cls}"><span class="lab">${x === hero ? '주인공' : esc(x.roleLabel)}${x.owned ? ' · 내 옷' : ''}</span>${ph(x.product || x, { caption: x.owned })}</div>`;
    return `<div class="lookb"><div class="g">${t(hero, 'hero')}<div class="side">${rest.slice(0, 2).map((x) => t(x)).join('')}</div></div><div class="low">${rest.slice(2, 5).map((x) => t(x)).join('')}</div><div class="cap"><span>규칙으로 조합한 예시 · 착용 사진 아님</span><span>LOOK 01</span></div></div>`;
  };
  const head = (dd) => `<div class="hero-info"><div class="b">${esc(dd.brand)}</div><div class="n">${esc(dd.name)}</div><div class="p">${esc(dd.priceText)} <span class="f12 sub" style="font-weight:400">${esc(dd.priceShort)}</span></div><div class="sum">함께 고른 후보 ${dd.outfit?.buyCount ?? 0}벌(이 상품 제외) · 수집가 합 ${esc(dd.outfit?.buyTotalText || '0원')}</div><div class="sum-verdict ${esc(dd.verdict.tone)}">${ico(dd.verdict.tone === 'stop' ? 'warn' : 'info', 's')}${esc(dd.verdict.title)}</div><div style="margin-top:12px">${K.decide(dd.verdict)}</div></div>`;
  const results = (dd) => `${K.hdr({ n: '05', closet: M.getState().closetCount })}<div class="pad">${K.search(K.Q)}<div style="margin-top:10px">${K.chips(r)}</div></div><div class="look-h"><b>이렇게 입어요 · 1/3</b><span class="nav"><span>${ico('back', 's')}</span><span style="transform:scaleX(-1)">${ico('back', 's')}</span></span></div>${look(dd)}${head(dd)}<div class="sec"><h2>다른 후보</h2><div class="grid2">${r.products.slice(1, 5).map((x) => K.card(x, { cmp: true })).join('')}</div></div>${K.tabbar(0)}`;
  const f1 = K.phone('결과 · 코디 보드', results(d), { notes: ['보드 바탕 흰색, 타일 비율 하나, 주인공 칸 2배', '칸을 누르면 그 상품 상세. 사진 없는 칸은 색 카드(그림 금지)', '‹ ›는 다른 주인공 후보의 보드'] });
  const pdp = `${K.pdpMobile(d, { n: '05' }).replace('<div class="sec"><h2>같은 조건 다른 선택</h2>', `<div class="sec"><h2>같이 입을 옷</h2>${look(d)}</div><div class="sec"><h2>비슷한 다른 옷</h2>`)}`;
  const f2 = K.phone('상품 상세', pdp, { notes: ['‘같이 입을 옷’(보완)과 ‘비슷한 다른 옷’(대체)을 다른 줄로'] });
  M.loadTrialCloset();
  const d2 = M.product(M.ask(K.Q).products[0].id);
  const f3 = K.phone('체험용 옷장 · 내 옷이 들어간 보드', results(d2), { notes: ['내 옷 칸은 ‘내 옷’ 꼬리표 + 비슷한 상품 사진 표시'] });
  K.row(f1 + f2 + f3);
  const pc = `${K.hdrPc({ n: '05', q: K.Q })}<div style="display:grid;grid-template-columns:7fr 5fr;gap:40px;padding:20px 32px 0;max-width:1280px;margin:0 auto"><div>${K.chips(r)}<div style="margin-top:14px">${look(d2).replace('class="lookb"', 'class="lookb" style="margin:0"')}</div></div><div>${head(d2).replace('class="hero-info"', 'class="hero-info" style="margin:0"')}<div class="pieces" style="margin-top:20px"><div class="f14" style="font-weight:700;margin-bottom:6px">구성 옷</div>${(d2.outfit?.pieces || []).map((x) => `<div class="pc"><div class="ph">${ph(x.product || x, { caption: false })}</div><div><b>${esc(x.roleLabel)}${x.owned ? ' · 내 옷' : ''}</b>${esc(x.label)}</div><div class="f14" style="font-weight:700">${x.product ? esc(x.product.priceText) : ''}</div></div>`).join('')}</div></div></div>`;
  K.row(K.pc('PC · 보드 왼쪽, 주인공·구성 옷 오른쪽', pc, { clip: true }));
})();
</script>
</body>
</html>
