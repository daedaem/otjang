<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="theme-color" content="#ffffff">
<title>어울 · 옷장 레일</title>
<!-- 시안 08 2판 「옷장 레일」. 내 옷장이 늘 레일로 보이고 후보가 거기에 반응한다(겹쳐요·색만 달라요·새 코디). 빈 옷장으로 시작. 검토용 설명은 시안 표시(고지)에만 둔다. -->
<script src="../shared/eoul-mock.js"></script>
<style>
  :root {
    color-scheme: light;
    --ink: #151515; --ink2: #333; --sub: #666; --line: #e8e6e2; --soft: #f5f4f1; --bg: #fff;
    --rail: #f3f1ec; --rod: #d2cbc0; --dash: #9a9387;
    --dup: #b42318; --dup-bg: #fdeceb; --alt: #8f5300; --alt-bg: #fff1cf; --pair: #0f6b3f; --pair-bg: #e2f3e9; --rec: #284a7e; --rec-bg: #e7eef9; --new: #3d3d3d; --new-bg: #eeece8;
    --focus: #1f5fbf;
    --bar: 56px; --rail-full: 94px; --rail-mini: 46px; --rail-empty: 58px;
    --eo-ratio: 5/6;
    --font: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--bar) + var(--rail-rest, 0px) + 12px); scroll-padding-bottom: 96px; }
  body { margin: 0; font: 15px/1.5 var(--font); color: var(--ink); background: var(--bg); padding-top: calc(var(--bar) + var(--rail-rest, 0px)); padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  h1, h2, h3, p, figure, ul, dl { margin: 0; }
  ul { padding: 0; list-style: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { display: block; flex: none; }
  .eo-cap { font-size: 12px !important; }
  html.lock { overflow: hidden; }

  /* ── 머리글 */
  .appbar { position: fixed; z-index: 40; top: 0; left: 0; right: 0; height: var(--bar); background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
  .ab-in { height: 100%; max-width: 1440px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 16px; }
  .logo { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding-right: 4px; font-size: 21px; font-weight: 800; letter-spacing: -.04em; text-decoration: none; }
  .ib { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 10px; background: none; color: var(--ink); text-decoration: none; position: relative; }
  .search { position: relative; flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; border-radius: 10px; background: var(--soft); }
  .search:focus-within { background: #fff; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; padding: 0 0 0 12px; font-size: 16px; outline: none; }
  .search input::placeholder { color: #767676; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .s-go { flex: none; width: 44px; height: 40px; border: 0; background: none; display: grid; place-items: center; }
  .ab-title { display: none; flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s; }
  .ab-title.on { opacity: 1; }
  .ab-nav { display: flex; align-items: center; gap: 2px; flex: none; }
  .ab-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 600; }
  .ab-link[aria-current="page"] { background: var(--soft); }
  .cnt { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; line-height: 1; }
  .cnt.zero { background: var(--soft); color: var(--sub); }
  .ib .cnt { position: absolute; top: 3px; right: 1px; min-width: 18px; height: 18px; padding: 0 4px; }
  .mock { flex: none; min-height: 36px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--sub); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .ab-back, .ab-search, .ab-cmp, .ab-title { display: none; }
  .pc-nav { display: none; }
  /* 휴대폰 상세: 뒤로 · 제목 · 검색 · 비교 */
  body[data-screen="pdp"] .ab-back, body[data-screen="pdp"] .ab-search, body[data-screen="pdp"] .ab-cmp, body[data-screen="pdp"] .ab-title { display: grid; }
  body[data-screen="pdp"] .ab-title { display: block; }
  body[data-screen="pdp"] .logo, body[data-screen="pdp"] .search { display: none; }

  .sugs { position: fixed; z-index: 60; left: 8px; right: 8px; top: calc(var(--bar) + 4px); max-height: 70vh; overflow: auto; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.16); }
  .sg-h { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; font-size: 12px; color: var(--sub); }
  .sg { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 10px; border: 0; border-radius: 10px; background: none; text-align: left; font-size: 15px; }
  .sg:hover, .sg:focus-visible { background: var(--soft); }
  .sg-k { flex: none; min-width: 34px; font-size: 12px; color: var(--sub); }
  .link { border: 0; background: none; padding: 0 4px; min-height: 32px; font-size: 13px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  /* ── 아래 탭바(휴대폰) */
  .tabbar { position: fixed; z-index: 38; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); height: calc(60px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: rgba(255,255,255,.98); border-top: 1px solid var(--line); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; text-decoration: none; font-size: 12px; font-weight: 600; color: var(--sub); position: relative; }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab .cnt { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 4px; }
  body[data-screen="pdp"] .tabbar { display: none; }

  /* ── 옷장 레일(휴대폰: 위 고정, 스크롤하면 접힘) */
  .rail { position: fixed; z-index: 30; top: var(--bar); left: 0; right: 0; height: var(--rail-h, var(--rail-full)); background: var(--rail); border-bottom: 1px solid var(--line); overflow: hidden; transition: height .22s ease, box-shadow .2s; }
  .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: var(--rod); opacity: .7; }
  .rail[data-state="full"] { --rail-h: var(--rail-full); }
  .rail[data-state="mini"] { --rail-h: var(--rail-mini); }
  .rail[data-state="empty"] { --rail-h: var(--rail-empty); }
  .rail[data-state="empty"]::before { display: none; }
  .rail.over { box-shadow: 0 10px 24px -12px rgba(0,0,0,.35); }
  body[data-screen="closet"] .rail { display: none; }
  .rail-head, .rg-h, .rail-pc { display: none; }
  .rail-track { position: relative; display: flex; align-items: flex-start; gap: 8px; height: 100%; padding: 12px 16px 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
  .rail-track::-webkit-scrollbar { display: none; }
  .rg { display: flex; gap: 8px; flex: none; }
  .rg + .rg { padding-left: 8px; border-left: 1px solid rgba(0,0,0,.08); }
  .rl { flex: none; width: 66px; height: 62px; display: flex; flex-direction: column; justify-content: center; text-decoration: none; font-size: 12px; line-height: 15px; color: var(--ink2); }
  .rl b { font-size: 13px; color: var(--ink); }
  .rl .rl-n { font-weight: 700; color: var(--ink); }
  .rl .rl-sub { margin-top: 3px; color: var(--sub); }
  .tile { flex: none; width: 62px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; border: 0; background: none; text-align: center; }
  .tph { position: relative; display: block; width: 62px; height: 62px; border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); --eo-ratio: 1; transition: width .22s, height .22s, border-radius .22s, box-shadow .2s; }
  .tile.trial .tph { outline: 1.5px dashed var(--dash); outline-offset: 1px; }
  .tile.r-dup .tph { box-shadow: 0 0 0 2.5px var(--dup); }
  .tile.r-alt .tph { box-shadow: 0 0 0 2.5px #c98a12; }
  .tile.r-pair .tph { box-shadow: 0 0 0 2.5px var(--pair); }
  .tt { display: flex; flex-direction: column; align-items: center; min-width: 0; max-width: 66px; }
  .tcap { max-width: 66px; font-size: 12px; line-height: 16px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tsub { display: none; }
  .trel { font-size: 12px; line-height: 16px; font-weight: 700; padding: 0 4px; border-radius: 4px; white-space: nowrap; }
  .tile.has-rel .tcap { display: none; }
  .pill, .trel { background: var(--new-bg); color: var(--new); }
  .dup { background: var(--dup-bg); color: var(--dup); }
  .alt { background: var(--alt-bg); color: var(--alt); }
  .pair { background: var(--pair-bg); color: var(--pair); }
  .rec { background: var(--rec-bg); color: var(--rec); }
  .sim { position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: rgba(255,255,255,.94); color: var(--ink2); font-size: 12px; line-height: 18px; font-weight: 700; text-align: center; }
  .bdg { position: absolute; left: 3px; bottom: 3px; padding: 0 4px; border-radius: 4px; background: var(--rec); color: #fff; font-size: 12px; line-height: 16px; font-weight: 700; }
  .tile.pending .tph { outline: 1.5px dashed var(--rec); outline-offset: 1px; opacity: .85; }
  .tile-add .tph { display: grid; place-items: center; background: transparent; box-shadow: none; outline: 1.5px dashed var(--dash); outline-offset: -1.5px; color: var(--ink); }
  .tile.flash .tph { animation: hang .75s ease-out; transform-origin: 50% 0; }
  @keyframes hang { 0% { transform: translateY(-16px) rotate(-7deg); opacity: 0; } 55% { transform: translateY(2px) rotate(2deg); opacity: 1; } 100% { transform: none; } }
  .rail-expand { display: none; }
  .rail[data-state="mini"] .rail-track { align-items: center; gap: 6px; padding: 9px 56px 7px 16px; }
  .rail[data-state="mini"] .rg { gap: 6px; }
  .rail[data-state="mini"] .rg + .rg { padding-left: 6px; }
  .rail[data-state="mini"] .tile { width: 30px; }
  .rail[data-state="mini"] .tph { width: 30px; height: 30px; border-radius: 50%; }
  .rail[data-state="mini"] .tt, .rail[data-state="mini"] .sim, .rail[data-state="mini"] .bdg, .rail[data-state="mini"] .rl-sub, .rail[data-state="mini"] .rail-end { display: none; }
  .rail[data-state="mini"] .eo-tile { color: transparent !important; }
  .rail[data-state="mini"] .rl { width: auto; height: 30px; flex-direction: row; align-items: center; gap: 4px; padding-right: 4px; }
  .rail[data-state="mini"] .rail-expand { display: grid; place-items: center; position: absolute; inset: 0; z-index: 2; width: 100%; border: 0; background: linear-gradient(90deg, transparent calc(100% - 64px), var(--rail) calc(100% - 48px)); justify-items: end; padding-right: 12px; color: var(--ink); }
  .rail-empty { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px 0 16px; }
  .rail-empty .t { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; color: var(--ink2); }
  .rail-empty .t b { display: block; color: var(--ink); font-size: 13px; }
  .btn-s { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--ink); background: #fff; font-size: 13px; font-weight: 600; white-space: nowrap; text-decoration: none; }
  .btn-s.ghost { border-color: var(--line); }
  .rail-end { display: flex; gap: 8px; flex: none; }

  /* ── 공통 페이지 */
  .shell { display: block; }
  main { display: block; max-width: 1440px; margin: 0 auto; padding: 16px 16px 24px; min-width: 0; outline: none; }
  .page-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .page-h h1 { font-size: 20px; letter-spacing: -.02em; }
  .sub { font-size: 13px; color: var(--sub); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 14px; white-space: nowrap; text-decoration: none; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--ink); }
  .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.line { border-color: var(--ink); }
  .btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .grow { flex: 1; }
  .sec { margin-top: 32px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .sec-h h2 { font-size: 17px; letter-spacing: -.01em; }
  .fine { font-size: 12px; color: var(--sub); line-height: 1.5; }
  .pill { display: inline-flex; align-items: center; font-size: 12px; line-height: 20px; padding: 0 6px; border-radius: 4px; font-weight: 700; white-space: nowrap; }

  /* ── 상품 카드(결과) */
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 10px; }
  .card { position: relative; min-width: 0; }
  .card-open { display: block; text-decoration: none; color: inherit; border-radius: 6px; }
  .cph { display: block; border-radius: 6px; overflow: hidden; background: var(--soft); }
  .cb { display: block; margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cn { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; font-size: 14px; line-height: 1.4; color: var(--ink2); word-break: keep-all; overflow-wrap: anywhere; }
  .cp { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; margin-top: 4px; }
  .cp b { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .cp small { font-size: 12px; color: var(--sub); }
  .cw { display: block; margin-top: 4px; font-size: 12px; color: var(--sub); line-height: 1.4; }
  .ctags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .cmp-ic { position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; padding: 0; }
  .cmp-ic > span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.94); box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .cmp-ic[aria-pressed="true"] > span { background: var(--ink); color: #fff; }

  /* ── 결과 */
  .res-h h1 { font-size: 17px; line-height: 1.4; letter-spacing: -.01em; }
  .res-meta { margin-top: 2px; font-size: 13px; color: var(--sub); }
  .scope { display: flex; gap: 6px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
  .scope::-webkit-scrollbar { display: none; }
  .cond { flex: none; padding: 0 8px 0 14px; }
  .cond.fixed { padding: 0 14px; background: var(--soft); border-color: var(--soft); font-weight: 600; }
  .cond.dropped { border-style: dashed; color: var(--sub); padding: 0 14px; }
  .rules { flex: none; align-self: center; font-size: 12px; color: var(--sub); padding: 0 4px; white-space: nowrap; }
  .closet-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--rail); font-size: 13px; }
  .closet-sum b { font-weight: 700; }
  .notice { display: flex; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--ink2); line-height: 1.45; }
  .notice .ic { margin-top: 2px; color: var(--sub); }
  .results { margin-top: 18px; }
  .more-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .empty { margin-top: 20px; padding: 24px 16px; border-radius: 14px; background: var(--soft); }
  .empty h2 { font-size: 17px; margin-bottom: 6px; }
  .empty p { font-size: 14px; color: var(--ink2); }
  .empty .chips { margin-top: 14px; }
  .empty .act-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }

  /* ── 코디 사진 줄 */
  .look-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .lp { min-width: 0; text-decoration: none; color: inherit; display: block; }
  .lp .ph { display: block; border-radius: 6px; overflow: hidden; background: var(--soft); }
  .lp.me .ph { box-shadow: 0 0 0 2px var(--ink); }
  .lp.own .ph { box-shadow: 0 0 0 2px var(--pair); }
  .lp .r { display: block; margin-top: 4px; font-size: 12px; font-weight: 700; }
  .lp .s { display: block; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── 상품 상세 */
  main.pdp-main { padding-top: 0; }
  .pdp-media { margin: 0 -16px; }
  .hero { position: relative; display: block; width: 100%; padding: 0; border: 0; background: var(--soft); cursor: zoom-in; }
  .zoom-badge { position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.94); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .buy { padding-top: 16px; }
  .p-brand { font-size: 13px; font-weight: 700; }
  .p-name { margin: 4px 0 10px; font-size: 18px; font-weight: 500; line-height: 1.4; letter-spacing: -.01em; word-break: keep-all; overflow-wrap: anywhere; }
  .p-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
  .p-price b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .p-price span { font-size: 12px; color: var(--sub); }
  .p-why { margin-top: 10px; font-size: 14px; color: var(--ink2); }
  .p-meta { margin-top: 4px; font-size: 13px; color: var(--sub); }
  .p-links { display: flex; gap: 8px; margin-top: 16px; }
  .p-size { margin-top: 8px; font-size: 12px; color: var(--sub); }
  .decide { position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 56px repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.98); border-top: 1px solid var(--line); }
  .decide button { min-height: 48px; padding: 0 4px; border-radius: 10px; border: 1px solid #cfccc6; background: #fff; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .decide button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .decide .d-cmp { flex-direction: column; gap: 0; font-size: 12px; font-weight: 600; border-color: var(--line); }
  .decide .d-cmp[aria-pressed="true"] { background: var(--soft); color: var(--ink); border-color: var(--ink); }
  .rec-line { margin-top: 12px; font-size: 13px; color: var(--ink2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .rec-line a { min-height: 32px; display: inline-flex; align-items: center; }

  .sbs { margin-top: 28px; padding: 16px; border-radius: 16px; background: var(--rail); }
  .sbs .sec-h { margin-bottom: 6px; }
  .sbs .sec-h h2 { font-size: 15px; }
  .verdict { font-size: 19px; font-weight: 800; line-height: 1.35; letter-spacing: -.02em; margin-bottom: 12px; word-break: keep-all; }
  .changed { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 4px 10px; border-radius: 999px; background: #fff; font-size: 12px; color: var(--ink2); }
  .changed s { color: var(--sub); }
  .sbs-row { display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 6px; scrollbar-width: none; }
  .sbs-row::-webkit-scrollbar { display: none; }
  .cand, .own { flex: none; }
  .cand { width: 124px; }
  .own { width: 100px; }
  .cand .ph, .own .ph { display: block; border-radius: 8px; overflow: hidden; background: #fff; }
  .cand .ph { box-shadow: 0 0 0 2px var(--ink); }

  // ── 옷장 레일

    const pending = s.records.filter((x) => x.stage === 'received');
    const byGroup = GROUPS.map((g) => ({ ...g, list: s.closet.filter((x) => groupOf(x.kind) === g.id) })).filter((g) => g.list.length);
    const ct = (g) => `<button class="ct ${g.trial ? 'trial' : ''}" type="button" data-act="tile" data-id="${esc(g.id)}" aria-label="${esc(gName(g))}, ${esc(gSource(g))}. 눌러서 고치기"><span class="ph">${photo(g)}</span><span class="n">${esc(gName(g))}</span><span class="s">${esc(gSource(g))}</span></button>`;
    return `<section aria-labelledby="clT">
      <div class="page-h"><h1 id="clT">내 옷장 ${s.closetCount}벌</h1><span class="sub">${s.trialCount ? `체험용 ${s.trialCount}벌 포함 · 점선은 예시 옷` : '사진 없이 종류·색으로 넣어요'}</span></div>
      <div class="closet-acts">
        <button class="btn dark" type="button" data-flow="closet-add">${ic('plus', 18)}가진 옷 넣기</button>
        ${s.trialCount ? '<button class="btn" type="button" data-act="trial-off">체험용 옷 내리기</button>' : '<button class="btn" type="button" data-flow="trial-closet" aria-label="체험용 옷 걸어 보기(예시 옷, 내 옷 아님)">체험용 옷 걸어 보기</button>'}
      </div>
      ${s.closetCount ? `<div class="sec">${byGroup.map((g) => `<div class="cgroup"><h2>${g.name} ${g.list.length}</h2><div class="cgrid">${g.list.map(ct).join('')}</div></div>`).join('')}</div>` : `<div class="empty-page sec">옷장이 비어 있어도 찾고 비교할 수 있어요.<br>가진 옷을 넣으면 후보가 겹치는지 레일에서 바로 보여요.</div>`}
      ${pending.length ? `<div class="sec cgroup"><h2>받은 옷 ${pending.length}</h2><p class="sub" style="margin-bottom:10px">계속 입기로 하면 ‘기록에서 산 옷’으로 옷장에 걸려요</p><div class="cgrid">${pending.map((r) => `<a class="ct" href="#/records"><span class="ph">${photo(r.product || r)}</span><span class="n">${esc(r.product?.name)}</span><span class="s">받음 · 기록에서 정하기</span></a>`).join('')}</div></div>` : ''}
      <div class="sec"><p class="fine">${esc(M.note.similar)}</p>
        <button class="btn sm danger" type="button" data-flow="reset" style="margin-top:12px">${resetArmed ? '한 번 더 누르면 옷장·기록·비교함을 모두 지워요' : '처음 상태로 돌리기'}</button></div>
    </section>`;
  }

  // ── 겹친 화면
  function renderOverlay(r) {
    const box = $('#overlay');
    const was = box.innerHTML !== '';
    let html = '';
    if (r.params.view === 'photo' && screen === 'pdp') html = viewerHtml(curId);
    else if (r.params.add) { if (!sheet) initSheet(); html = addSheetHtml(); }
    else if (r.params.edit) html = editSheetHtml(r.params.edit);
    if (!r.params.add) sheet = null;
    box.innerHTML = html;
    document.documentElement.classList.toggle('lock', !!html);
    if (html) {
      const f = $('[data-autofocus]', box) || $('button, a[href], input', box);
      if (f && !box.contains(document.activeElement)) f.focus({ preventScroll: true });
    } else if (was && opener && opener.isConnected) { opener.focus({ preventScroll: true }); opener = null; }
  }
  function viewerHtml(id) {
    const d = M.product(id);
    if (!d) return '';
    return `<div class="viewer" data-flow="photo-viewer" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
      <div class="v-top"><span>${esc(d.brand)} · ${esc(d.name)}</span><button class="ib" type="button" data-act="close-overlay" aria-label="닫기" data-autofocus>${ic('close')}</button></div>
      <div class="v-stage"><button class="v-img" type="button" data-act="zoom-toggle" aria-label="두 배로 확대하기">${M.photoHtml(d, { fit: 'contain', eager: true, caption: false })}</button></div>
      <p class="v-hint">사진을 누르면 확대돼요 · 판매처 대표 사진</p>
    </div>`;
  }
  function initSheet() {
    const v = screen === 'pdp' && curId ? judge(curId) : null;
    if (v?.addSuggestion) {
      const a = v.addSuggestion;
      sheet = { from: curId, kind: a.kind, slot: a.slot, color: null, showKinds: false, group: groupOf(a.kind), hint: a.color, base: { kind: a.kind, slot: a.slot } };
    } else sheet = { from: null, kind: null, slot: null, color: null, showKinds: true, group: 'top', hint: null, base: null };
  }
  function addSheetHtml() {
    const s = sheet;
    const kinds = M.kindChoices();
    const kindName = kinds.find((k) => k.id === s.kind)?.name || '';
    const slots = s.kind ? M.slotChoices(s.kind) : [];
    const slotName = slots.find((x) => x.id === s.slot)?.name || '';
    const colors = M.colorChoices();
    const groupKinds = kinds.filter((k) => groupOf(k.id) === s.group);
    const kindsBlock = s.showKinds ? `
      <h3 class="sh-step">종류</h3>
      <div class="chips" role="group" aria-label="묶음">${GROUPS.map((g) => `<button class="chip" type="button" data-act="sheet-group" data-id="${g.id}" aria-pressed="${s.group === g.id}">${g.name}</button>`).join('')}</div>
      <div class="chips" style="margin-top:8px">${groupKinds.map((k) => `<button class="chip" type="button" data-flow="kind-option" data-kind="${esc(k.id)}" aria-pressed="${s.kind === k.id}">${esc(k.name)}</button>`).join('')}</div>
      ${slots.length ? `<h3 class="sh-step">세부 종류 <span style="font-weight:400">(고르면 비슷한 상품 사진으로 보여요)</span></h3><div class="chips">${slots.map((x) => `<button class="chip" type="button" data-flow="slot-option" data-slot="${esc(x.id)}" aria-pressed="${s.slot === x.id}">${esc(x.name)}</button>`).join('')}</div>` : ''}` : '';
    const ready = s.kind && s.color;
    const col = s.color && s.color !== 'none' ? s.color : null;
    let prev = '';
    if (ready) {
      const target = { kind: s.kind, kindName, slot: s.slot, color: col };
      const has = !!(s.slot && col && M.photo({ slot: s.slot, color: col }));
      prev = `<div class="sh-prev"><span class="ph">${photo(target)}</span><div><b>${esc(col ? colors.find((c) => c.id === col)?.label : '색 미확인')} ${esc(slotName || kindName)}</b><span>${has ? '옷장에는 비슷한 상품 사진으로 보여요. 실제 옷과 다를 수 있어요.' : '사진 없이 색 카드로 보여요.'}</span></div></div>`;
    }
    const title = s.from && !s.showKinds ? `가진 ${esc(kindName)}, 색만 골라 주세요` : '가진 옷 넣기';
    return `<div class="scrim" data-act="close-overlay"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
      <div class="grab" aria-hidden="true"></div>
      <h2 id="shT">${title}</h2>
      <p class="sh-sub">${s.from && !s.showKinds ? `종류는 이 상품과 같은 <b>${esc(slotName || kindName)}</b>로 넣어요. <button class="link" type="button" data-act="sheet-kinds" aria-expanded="false">종류 바꾸기</button>` : '사진 없이 종류와 색만 골라요. 이 브라우저에만 저장돼요.'}</p>
      ${kindsBlock}
      ${s.kind ? `<h3 class="sh-step">색</h3>
      <div class="swatches" role="group" aria-label="색">${colors.map((c) => `<button class="sw" type="button" data-flow="color-option" data-color="${esc(c.id)}" aria-pressed="${s.color === c.id}"${s.color === null && c.id === 'white' ? ' data-autofocus' : ''}><i style="background:${esc(c.hex)}"></i>${esc(c.label)}${s.hint === c.id ? '<em>이 상품</em>' : ''}</button>`).join('')}
        <button class="sw" type="button" data-flow="color-option" data-color="none" aria-pressed="${s.color === 'none'}"><i class="unk">?</i>잘 몰라요</button></div>` : '<p class="sub" style="margin-top:12px">종류를 고르면 색을 고를 수 있어요.</p>'}
      ${prev}
      ${s.msg ? `<p class="warn" role="alert">${esc(s.msg)}</p>` : ''}
      <div class="sheet-foot">
        <button class="btn" type="button" data-act="close-overlay">닫기</button>
        <button class="btn dark grow" type="button" data-flow="closet-save"${ready ? '' : ' aria-disabled="true"'}>${s.from ? '옷장에 걸고 이 상품으로' : '옷장에 걸기'}</button>
      </div>
    </div>`;
  }
  function editSheetHtml(gid) {
    const s = st();
    const g = s.closet.find((x) => x.id === gid);
    if (!g) return '';
    const colors = M.colorChoices();
    const slots = M.slotChoices(g.kind, g.gender);
    return `<div class="scrim" data-act="close-overlay"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edT">
      <div class="grab" aria-hidden="true"></div>
      <div class="sh-prev" style="margin-top:0"><span class="ph">${photo(g)}</span><div><b id="edT">${esc(gName(g))}</b><span>${esc(gSource(g))}${g.slotName ? ` · ${esc(g.slotName)}` : ' · 세부 종류 미확인'}</span></div></div>
      <h3 class="sh-step">색 고치기</h3>
      <div class="swatches">${colors.map((c) => `<button class="sw" type="button" data-act="edit-color" data-id="${esc(g.id)}" data-color="${esc(c.id)}" aria-pressed="${g.color === c.id}"><i style="background:${esc(c.hex)}"></i>${esc(c.label)}</button>`).join('')}</div>
      ${slots.length ? `<h3 class="sh-step">세부 종류 <span style="font-weight:400">(선택)</span></h3><div class="chips">${slots.map((x) => `<button class="chip" type="button" data-act="edit-slot" data-id="${esc(g.id)}" data-slot="${esc(x.id)}" aria-pressed="${g.slot === x.id}">${esc(x.name)}</button>`).join('')}</div>` : ''}
      ${g.bought ? '<p class="fine" style="margin-top:12px">기록에서 산 옷은 기록 화면에서 반품으로 정리해요.</p>' : ''}
      <div class="sheet-foot">
        ${g.bought ? '' : `<button class="btn danger" type="button" data-act="edit-remove" data-id="${esc(g.id)}">옷장에서 빼기</button>`}
        <button class="btn dark grow" type="button" data-act="close-overlay" data-autofocus>다 됐어요</button>
      </div>
    </div>`;
  }
  const rerenderSheet = () => { const r = M.route.current(); const keep = document.activeElement?.dataset || {}; renderOverlay(r); const sel = keep.flow ? `[data-flow="${keep.flow}"]${keep.color ? `[data-color="${keep.color}"]` : ''}${keep.kind ? `[data-kind="${keep.kind}"]` : ''}${keep.slot ? `[data-slot="${keep.slot}"]` : ''}` : keep.act ? `[data-act="${keep.act}"]${keep.id ? `[data-id="${CSS.escape(keep.id)}"]` : ''}${keep.color ? `[data-color="${keep.color}"]` : ''}${keep.slot ? `[data-slot="${keep.slot}"]` : ''}` : ''; const el = sel && $(`#overlay ${sel}`); if (el) el.focus({ preventScroll: true }); };

  // ── 알림
  let toastTimer = null, toastFn = null;
  function toast(text, action = null) {
    const t = $('#toast');
    $('#toastText').textContent = text;
    const b = $('#toastAct');
    toastFn = action?.fn || null;
    b.hidden = !action; b.textContent = action?.label || '';
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), action ? 5000 : 3200);
  }
  $('#toastAct').addEventListener('click', () => { const fn = toastFn; toastFn = null; $('#toast').classList.remove('on'); try { fn?.(); } catch (e) { toast(e.message || '다시 시도해 주세요.'); } });

  // ── 동작
  function toggleCompare(id) {
    if (M.compareHas(id)) {
      M.compareRemove(id);
      toast('비교함에서 뺐어요', { label: '되돌리기', fn: () => { M.compareAdd(id); refresh(); } });
    } else {
      try { M.compareAdd(id); } catch (e) { toast(e.message); return; }
      const n = M.compareList().length;
      toast(`비교함에 담았어요 · ${n}개`, n >= 2 ? { label: '비교 보기', fn: () => go('/compare') } : null);
    }
    refresh();
  }
  function decide(id, k) {
    const prev = judge(id)?.record || null;
    let rec;
    try { rec = M.decide(id, k); } catch (e) { toast(e.message); return; }
    toast(`기록했어요 · ${rec.stageLabel}`, { label: '되돌리기', fn: () => { if (!prev) M.removeRecord(id); else if (prev.decision && prev.stage === 'candidate') M.decide(id, prev.decision); refresh(); } });
    refresh();
  }
  function saveSheet() {
    const s = sheet;
    if (!s || !s.kind || !s.color) { if (s) { s.msg = s.kind ? '색을 골라 주세요. 모르면 ‘잘 몰라요’를 눌러요.' : '종류를 골라 주세요.'; rerenderSheet(); } return; }
    const before = s.from ? judge(s.from)?.title : null;
    let g;
    try { g = M.addGarment({ kind: s.kind, slot: s.slot, color: s.color === 'none' ? null : s.color }); } catch (e) { s.msg = e.message; rerenderSheet(); return; }
    flashId = g.id;
    if (s.from) changed = { id: s.from, before };
    sheet = null;
    opener = null;
    closeOverlay();
    refresh();
    peekRail();
    const nm = gName(g);
    const after = s.from ? judge(s.from)?.title : null;
    toast(`${nm}${josa(nm, '을', '를')} 옷장에 걸었어요${after ? ` · ${after}` : ''}`, { label: '되돌리기', fn: () => { M.removeGarment(g.id); changed = null; refresh(); } });
  }
  function navAsk() {
    if (screen === 'search' || screen === 'home') { const q = $('#q'); q.focus(); showSugs(); return; }
    if (lastSearch) go('/search', lastSearch.params); else go('/');
    setTimeout(() => { if (!isPC()) return; $('#q')?.focus(); }, 50);
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-flow], [data-act]');
    if (!t) return;
    const flow = t.dataset.flow, act = t.dataset.act;
    if (t.tagName === 'A' && !act && flow !== 'nav-ask') {
      if (flow === 'compare-open' && screen === 'compare') e.preventDefault();
      return; // 주소 이동은 링크 그대로
    }
    if (t.matches('form, div:not([data-act]), section, article, li, figure')) return;
    try { handle(e, t, flow, act); } catch (err) { console.error(err); toast(err.message || '다시 시도해 주세요.'); }
  });
  function handle(e, t, flow, act) {
    const pid = t.dataset.productId || curId;
    if (flow === 'mock-label') return M.openDisclosure();
    if (flow === 'example') { hideSugs(); $('#q').blur(); return go('/search', { q: t.dataset.q }); }
    if (flow === 'condition-remove') { const p = M.route.current().params; const d = (p.drop ? p.drop.split(',') : []).concat(t.dataset.key); return go('/search', { ...p, drop: d.join(',') }); }
    if (act === 'readd') { const p = M.route.current().params; const d = (p.drop ? p.drop.split(',') : []).filter((k) => k !== t.dataset.key); return go('/search', { ...p, drop: d.join(',') }); }
    if (act === 'drop-one') { const p = M.route.current().params; const d = (p.drop ? p.drop.split(',') : []).concat(t.dataset.key); return go('/search', { ...p, drop: d.join(',') }); }
    if (act === 'gender-search') { M.setGender(t.dataset.g); return go('/search', { q: t.dataset.q }); }
    if (act === 'cheaper') return go('/search', { q: '더 싼 걸로', prev: t.dataset.q });
    if (act === 'toggle-off') { offOpen = !offOpen; return refresh(); }
    if (flow === 'compare-add') return toggleCompare(t.dataset.productId);
    if (flow === 'compare-open') return go('/compare');
    if (act === 'cmp-remove') { const id = t.dataset.id; M.compareRemove(id); toast('비교함에서 뺐어요', { label: '되돌리기', fn: () => { M.compareAdd(id); refresh(); } }); return refresh(); }
    if (act === 'cmp-clear') { const keep = M.compareList(); M.compareClear(); toast('비교함을 비웠어요', { label: '되돌리기', fn: () => { keep.forEach((x) => { try { M.compareAdd(x); } catch { /* 무시 */ } }); refresh(); } }); return refresh(); }
    if (flow && flow.startsWith('decide-')) return decide(pid, flow.slice(7));
    if (act === 'own') { M.setOwnership(curId, t.dataset.v); return refresh(); }
    if (act === 'gender') { M.setGender(t.dataset.g); return refresh(); }
    if (flow === 'photo-zoom') return openOverlay('view', 'photo');
    if (act === 'zoom-toggle') {
      const v = t.closest('.viewer');
      const r = t.getBoundingClientRect();
      if (!v.classList.contains('zoomed') && e.clientX) { t.style.setProperty('--ox', `${((e.clientX - r.left) / r.width) * 100}%`); t.style.setProperty('--oy', `${((e.clientY - r.top) / r.height) * 100}%`); }
      v.classList.toggle('zoomed');
      t.setAttribute('aria-label', v.classList.contains('zoomed') ? '원래 크기로' : '두 배로 확대하기');
      return;
    }
    if (act === 'close-overlay') return closeOverlay();
    if (act === 'back') { if (visits > 1) return history.back(); return go(lastSearch ? '/search' : '/', lastSearch ? lastSearch.params : {}); }
    if (flow === 'nav-ask') return navAsk();
    if (act === 'rail-open') { railOpen = true; openScrollY = window.scrollY; syncRail(); $('#rail .tile')?.focus({ preventScroll: true }); return; }

    // 옷 넣기(상세에서는 이 상품 종류를 미리 고르고 색만 묻는다)
    if (flow === 'closet-add') { sheet = null; return openOverlay('add', '1'); }
    if (act === 'sheet-kinds') { sheet.showKinds = true; return rerenderSheet(); }
    if (act === 'sheet-group') { sheet.group = t.dataset.id; return rerenderSheet(); }
    if (flow === 'kind-option') { const k = t.dataset.kind; sheet.kind = k; sheet.slot = sheet.base && sheet.base.kind === k ? sheet.base.slot : null; sheet.group = groupOf(k); sheet.msg = null; return rerenderSheet(); }
    if (flow === 'slot-option') { sheet.slot = sheet.slot === t.dataset.slot ? null : t.dataset.slot; return rerenderSheet(); }
    if (flow === 'color-option') { sheet.color = t.dataset.color; sheet.msg = null; return rerenderSheet(); }
    if (flow === 'closet-save') return saveSheet();
    if (flow === 'trial-closet') {
      M.loadTrialCloset();
      refresh(); if (!isPC()) peekRail();
      return toast(`체험용 옷 ${st().trialCount}벌을 걸었어요 · 내 옷이 아니에요`, { label: '내리기', fn: () => { M.clearTrialCloset(); refresh(); } });
    }
    if (act === 'trial-off') { M.clearTrialCloset(); refresh(); return toast('체험용 옷을 내렸어요'); }
    if (act === 'tile') return openOverlay('edit', t.dataset.id);
    if (act === 'edit-color') { M.updateGarment(t.dataset.id, { color: t.dataset.color }); refresh(); return rerenderSheet(); }
    if (act === 'edit-slot') { const g = st().closet.find((x) => x.id === t.dataset.id); M.updateGarment(t.dataset.id, { slot: g && g.slot === t.dataset.slot ? null : t.dataset.slot }); refresh(); return rerenderSheet(); }
    if (act === 'edit-remove') {
      const g = st().closet.find((x) => x.id === t.dataset.id);
      try { M.removeGarment(t.dataset.id); } catch (err) { return toast(err.message); }
      closeOverlay(); refresh();
      return toast(`${gName(g)}${josa(gName(g), '을', '를')} 옷장에서 뺐어요`, { label: '되돌리기', fn: () => { M.addGarment({ kind: g.kind, slot: g.slot, color: g.color, label: g.label, trial: g.trial }); refresh(); } });
    }

    // 기록
    if (flow === 'record-step') {
      const id = t.dataset.productId;
      if (t.dataset.step === 'returned') { returning = id; return refresh(); }
      const rec = M.advance(id, t.dataset.step);
      if (t.dataset.step === 'kept') {
        const g = st().closet.find((x) => x.productId === id);
        if (g) { flashId = g.id; refresh(); if (!isPC()) peekRail(); return toast('옷장 레일에 ‘기록에서 산 옷’으로 걸었어요', { label: '옷장 보기', fn: () => go('/closet') }); }
      }
      refresh();
      return toast(t.dataset.step === 'received' ? '받았다고 기록했어요 · 계속 입을지 정하면 옷장에 걸려요' : `기록했어요 · ${rec.stageLabel}`);
    }
    if (act === 'return-reason') { const rec = M.advance(t.dataset.productId, 'returned', { reason: t.dataset.reason }); returning = null; refresh(); return toast(`기록했어요 · ${rec.stageLabel}`); }
    if (act === 'return-cancel') { returning = null; return refresh(); }
    if (act === 'rm-record') {
      const id = t.dataset.id; const prev = judge(id)?.record;
      try { M.removeRecord(id); } catch (err) { return toast(err.message); }
      refresh();
      return toast('기록을 지웠어요', prev?.decision ? { label: '되돌리기', fn: () => { M.decide(id, prev.decision); refresh(); } } : null);
    }
    if (flow === 'reset') {
      if (!resetArmed) { resetArmed = true; return refresh(); }
      M.reset(); resetArmed = false; lastSearch = null; changed = null;
      toast('처음 상태로 돌렸어요');
      return go('/', {}, { replace: true });
    }
    if (act === 'clear-recent') { M.clearRecent(); return showSugs(); }
  }

  // ── 검색칸: 한 곳, 입력 중 제안(최근·예시·종류)
  const qEl = $('#q');
  function showSugs() {
    const list = M.searchSuggestions(qEl.value, { limit: 6 });
    const box = $('#sugs');
    if (!list.length) { hideSugs(); return; }
    const hasRecent = list.some((x) => x.kind === 'recent');
    box.innerHTML = `<div class="sg-h"><span>${qEl.value.trim() ? '이어지는 요청' : '최근·예시'}</span>${hasRecent ? '<button class="link" type="button" data-act="clear-recent">최근 지우기</button>' : ''}</div>
      ${list.map((x) => `<button class="sg" type="button" data-flow="example" data-q="${esc(x.q)}"><span class="sg-k">${esc(x.label)}</span><span>${esc(x.q)}</span></button>`).join('')}`;
    box.hidden = false;
    qEl.setAttribute('aria-expanded', 'true');
  }
  function hideSugs() { $('#sugs').hidden = true; qEl.setAttribute('aria-expanded', 'false'); }
  qEl.addEventListener('focus', showSugs);
  qEl.addEventListener('input', showSugs);
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('#searchForm')) hideSugs(); });
  $('#searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = qEl.value.trim();
    if (!q) { qEl.focus(); showSugs(); return; }
    hideSugs(); qEl.blur();
    go('/search', { q });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (document.querySelector('#eo-disclosure[open]')) return;
    if (!$('#sugs').hidden) { hideSugs(); return; }
    if (railOpen) { railOpen = false; syncRail(); return; }
    if ($('#overlay').innerHTML) closeOverlay();
  });

  // PC: 카드에 올리면 왼쪽 옷장이 그 후보 기준으로 반응
  function setHover(id) {
    if (id === hoverId) return;
    hoverId = id;
    renderRail();
  }
  document.addEventListener('mouseover', (e) => {
    if (!isPC() || !['search', 'home', 'compare'].includes(screen)) return;
    const c = e.target.closest('.card[data-card], .cmp-item[data-product-id]');
    setHover(c ? (c.dataset.card || c.dataset.productId) : null);
  });
  document.addEventListener('focusin', (e) => {
    if (!isPC() || !['search', 'home', 'compare'].includes(screen)) return;
    const c = e.target.closest('.card[data-card], .cmp-item[data-product-id]');
    if (c) setHover(c.dataset.card || c.dataset.productId);
  });

  // 아이콘 채우기
  $('.ab-back').innerHTML = ic('back');
  $('.s-go').innerHTML = ic('search');
  $('.ab-search').innerHTML = ic('search');
  $$('[data-icon]').forEach((el) => { el.outerHTML = ic(el.dataset.icon, 22); });

  mqPC.addEventListener('change', () => { refresh(); });
  M.subscribe(() => { /* 다른 창에서 바뀐 경우 */ });
  window.addEventListener('storage', () => setTimeout(refresh, 0));

  // ── 시작
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (M.boot.q && !location.hash) history.replaceState(null, '', M.route.href('/search', { q: M.boot.q }));
  window.addEventListener('hashchange', onRoute);
  onRoute();
})();
</script>
</body>
</html>
