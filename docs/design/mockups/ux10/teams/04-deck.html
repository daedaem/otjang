<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>어울 시안 04 · 한 장씩</title>
<!-- 팀 04 「한 장씩」: 후보를 카드 더미로 한 장씩 보고 살래·보류·패스로 바로 정한다. 결정이 곧 기록이 된다.
     실제 전문가가 아니라 AI가 모션·인터랙션 디자이너, 프론트엔드 개발자 역할로 만든 시안. 판정 문장은 모두 window.EoulMock이 만든다. -->
<style>
:root{
  --bg:#1b1c1e; --bg2:#25272a; --bg3:#303337; --on:#f3f2ee; --on2:#c9ccd1; --on3:#a7abb2; --edge:#4c5056;
  --card:#fbfaf7; --card2:#efece6; --ink:#17181a; --sub:#50535a; --line:#dcd8d0;
  --go:#17643f; --stop:#a3301c; --think:#7a4f00; --own:#1f4f8a; --none:#4a4d52;
  --focus:#ffd34d; --r:22px;
  --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--on);font:15px/1.5 var(--font);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card :focus-visible,.light :focus-visible{outline-color:#1546c4}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4,p{margin:0}
.fine{font-size:12px;line-height:1.55;color:var(--on3)}
.light .fine,.card .fine{color:var(--sub)}

/* 목업 표시 */
.mock{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:2px 12px;background:#0b0c0d;color:#d6d8dc;font-size:12px;border-bottom:1px solid #303236}
.mock .lbl{flex:1 1 170px;font-weight:600}
.mock .lbl b{color:var(--focus);font-weight:800}
.mock a,.mock button{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:8px;color:#f3f2ee;background:transparent;border:1px solid #474a50;text-decoration:none;font-size:12px}

/* 머리 */
.top{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 10px;padding:8px 16px}
.logo{font-weight:900;font-size:21px;letter-spacing:-.04em}
.logo i{font-style:normal;color:var(--on3);font-weight:600;font-size:12px;margin-left:6px;letter-spacing:0}
.nav{justify-self:end;display:flex;gap:6px;grid-row:1;grid-column:2}
.nav button{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:transparent;font-size:14px;white-space:nowrap}
.nav button[aria-current="page"]{background:var(--on);color:#111;border-color:var(--on)}
.nav b{font-weight:800;margin-left:3px}
.qbar{grid-column:1/-1;grid-row:2;display:flex;gap:6px}
.qbar input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--edge);background:var(--bg2);color:var(--on);padding:0 12px;font-size:16px;font-family:inherit}
.qbar input::placeholder{color:#a2a6ad}
.go{height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--on);color:#111;font-weight:800}

/* 칩·안내 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--bg2);color:var(--on);font-size:14px}
.chip.fixed{background:transparent;border-style:dashed;color:var(--on2)}
.chip .x{font-weight:800;color:var(--on2)}
.chip.more{border-color:#8f8a6a;color:#f6e7b0}
.chips.cond{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.cond>*{flex:0 0 auto}
.notices{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.notice{background:#2a2c30;border-left:3px solid #e2b54a;padding:7px 10px;border-radius:8px;font-size:13px;line-height:1.5;color:var(--on)}
.light .notice{background:#f3eee2;color:var(--ink);border-left-color:#9a6b00}

/* 첫 화면 */
.home{max-width:1120px;margin:0 auto;padding:16px 16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
.home>section{min-width:0}
.kicker{font-size:13px;color:var(--on2);font-weight:800;letter-spacing:.03em;margin-bottom:8px}
.home h1{font-size:28px;line-height:1.28;letter-spacing:-.035em;margin-bottom:18px}
.bigask{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.bigask input{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-family:inherit;padding:0 12px;height:52px;color:var(--ink)}
.bigask input::placeholder{color:#6b6e75}
.bigask input:focus-visible{outline:none}
.bigask:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.bigask button{height:52px;padding:0 22px;border-radius:14px;border:0;background:#111;color:#fff;font-weight:800;font-size:16px}
.exlabel{font-size:13px;color:var(--on2);margin:16px 0 8px;font-weight:700}
.trialbox{display:grid;gap:10px;background:var(--bg2);border:1px solid #393c41;border-radius:18px;padding:16px}
.trialbox h2{font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--edge);background:var(--bg3);color:var(--on);font-weight:700;text-decoration:none;font-size:15px}
.btn.primary{background:var(--on);color:#111;border-color:var(--on)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor;line-height:1.5;white-space:nowrap}
.tag.trial{color:#f6d77a}
.light .tag.trial,.card .tag.trial{color:#7a4f00}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.seg button{min-height:40px;padding:0 14px;background:transparent;border:0;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--on);color:#111;font-weight:800}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how li{background:var(--bg2);border-radius:14px;padding:10px;font-size:13px;color:var(--on2);line-height:1.4}
.how b{display:block;color:var(--on);font-size:14px;margin-bottom:2px}
.preview{position:relative;height:290px;max-width:360px;width:100%;margin:0 auto}
.pv{position:absolute;left:50%;top:10px;width:200px;height:260px;margin-left:-100px;border-radius:20px;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.5);padding:16px;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.pv .pa{flex:1;background:radial-gradient(circle at 50% 40%,#fff,#ebe7df);border-radius:12px;padding:16px;--art-line:#3a3a3a}
.pv i{display:block;height:8px;border-radius:4px;background:#d8d4cc}
.pv i.s{width:60%}
.pv1{transform:rotate(-9deg) translateX(-56px);background:#e7e4dd}
.pv2{transform:rotate(7deg) translateX(54px);background:#efede7}

/* 결과(카드 더미) */
.deck{padding:0 16px 112px}
.deckgrid{display:block}
.ctx{display:grid;gap:8px;margin:2px 0 10px}
.rtitle{font-size:14px;font-weight:700;color:var(--on2)}
.listnote{font-size:12px;color:var(--on3)}
.prog{display:flex;align-items:center;gap:8px;max-width:460px;margin:0 auto 10px}
.ghostbtn{min-height:40px;min-width:40px;padding:0 12px;border-radius:12px;border:1px solid var(--edge);background:transparent;font-size:14px;white-space:nowrap}
.pbar{flex:1;min-width:0;display:grid;gap:4px;font-size:13px;color:var(--on2)}
.pbar .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;white-space:nowrap}
.pbar .pt span{font-size:12px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pbar b{color:var(--on);font-size:15px;font-variant-numeric:tabular-nums}
.pbar .track{height:4px;border-radius:2px;background:#3a3d42;overflow:hidden}
.pbar .track i{display:block;height:100%;background:var(--on);width:var(--p);transition:width .3s ease}
.stack{position:relative;height:clamp(430px,calc(100dvh - 372px),620px);perspective:1600px;margin:0 auto;max-width:460px;width:100%}
.ghost{position:absolute;inset:0;border-radius:var(--r);background:#d4d1ca;transform:translateY(18px) scale(.9);box-shadow:0 12px 26px rgba(0,0,0,.45)}
.ghost.g1{background:#e6e3dc;transform:translateY(9px) scale(.95)}
.card{position:absolute;inset:0;border-radius:var(--r);color:var(--ink);--tone:#8d8a83}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.card.enter{animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(9px) scale(.95)}to{transform:none}}
.face{position:absolute;inset:0;border-radius:var(--r);background:var(--card);box-shadow:0 22px 44px rgba(0,0,0,.5),inset 0 1px 0 #fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s linear .16s;overflow:hidden auto;overscroll-behavior:contain;padding:14px 16px 14px 20px}
.face::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:6px;border-radius:0 4px 4px 0;background:var(--tone)}
.back{transform:rotateY(180deg);visibility:hidden}
.card.is-flipped .front{transform:rotateY(-180deg);visibility:hidden}
.card.is-flipped .back{transform:rotateY(0);visibility:visible}
.front{display:flex;flex-direction:column;gap:6px;touch-action:pan-y;padding-top:12px;padding-bottom:12px}
.ftop{display:flex;gap:6px;align-items:center}
.ftags{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;line-height:1.3}
.ftop .lbtn{flex:0 0 auto;min-height:40px;padding:0 12px;font-size:13px}
.basis{font-size:12px;color:var(--sub);font-weight:700}
.tag.off{color:#7a4f00}
.tag.rec{color:#1f4f8a}
.fart{position:relative;flex:1 1 110px;min-height:48px;max-height:clamp(48px,calc(100dvh - 600px),240px);display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#fff,#ebe7df 75%);border-radius:16px;padding:12px;touch-action:pan-y;cursor:grab;--art-line:#3a3a3a;container-type:size}
@container (max-height: 96px){.fart .hint{display:none}}
.fart svg{width:100%;height:100%;max-width:220px;max-height:220px}
.fart .hint{position:absolute;right:8px;top:8px;font-size:12px;color:var(--sub);font-weight:600;background:rgba(251,250,247,.85);padding:0 6px;border-radius:6px}
.meta .brand{font-size:13px;color:var(--sub);font-weight:700}
.pname{font-size:15.5px;line-height:1.3;font-weight:700;margin:1px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--sub)}
.price .slink{flex:0 0 auto}
.price b{font-size:17px;color:var(--ink);font-weight:800;margin-right:4px;font-variant-numeric:tabular-nums}
.judge{border-top:1px solid var(--line);padding-top:6px;display:grid;gap:3px}
.vt{font-size:19px;line-height:1.28;font-weight:850;letter-spacing:-.025em;color:var(--ink)}
.vt.changed span{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:#ffe27a}100%{background:transparent}}
.was{font-size:12px;color:var(--sub)}
.was s{color:#6a6d74}
.vlines{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:1.4;color:#33363b;display:grid;gap:2px}
.vlines li{padding-left:12px;position:relative}
.vlines li::before{content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--tone)}
.caution{font-size:13px;color:#7d1f10;background:#fbe9e4;border-radius:8px;padding:6px 8px}
.askq{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;font-weight:700;line-height:1.35}
.askq>span:first-child{flex:1 1 100px;min-width:0}
.askq .seg{border-color:#b9b5ac;justify-self:start}
.askq .seg button{font-weight:600;color:var(--ink);min-height:40px;padding:0 9px}
.askq .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.askq .hint{flex-basis:100%;font-weight:500;color:var(--sub);font-size:12px}
.frow{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.lbtn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}
.lbtn.solid{background:var(--ink);color:#fff}
.lbtn.soft{border-color:#c4c0b7;font-weight:700}
.lbtn.grow{flex:1}
/* 뒷면 */
.back{display:block}
.btop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.btop p{flex:1;font-size:13px;color:var(--sub);font-weight:700;line-height:1.35}
.bsec{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:6px}
.bsec:first-of-type{border-top:0;padding-top:0}
.bsec h4{font-size:14px;font-weight:850;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bsec ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:#2c2f33}
.bsec p{font-size:14px;color:#2c2f33}
.owned{list-style:none;padding:0!important;display:grid;gap:6px}
.owned li,.pieces li{display:flex;gap:8px;align-items:center}
.mini{flex:0 0 40px;width:40px;height:40px;border-radius:10px;background:#efece5;padding:4px;--art-line:#3a3a3a}
.mini svg{width:100%;height:100%}
.pieces{list-style:none;padding:0!important;display:grid;gap:6px}
.pieces li span:last-child{font-size:13px;line-height:1.35}
.pieces small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.pieces li.focus .mini{outline:2px solid var(--ink)}
.look{display:grid;gap:6px;background:#f4f1eb;border-radius:12px;padding:10px}
.tag.go{color:var(--go)}
.used .links{display:grid;gap:6px}
.used .region{font-size:12px;font-weight:800;color:var(--sub);margin-top:4px}
.used .lgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ulink{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding:4px 10px;border-radius:10px;border:1px solid #c9c5bc;background:#fff;text-decoration:none;font-weight:800;font-size:14px;line-height:1.25}
.ulink small{font-weight:500;font-size:12px;color:var(--sub)}
.tag.pre{color:#50535a}
/* 옷 넣기 패널 */
.addp{display:grid;gap:8px;background:#f1eee7;border:1.5px solid var(--ink);border-radius:14px;padding:12px;margin-bottom:12px}
.page .addp{background:var(--card);color:var(--ink)}
.addp h4{font-size:15px;font-weight:850}
.step{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.02em}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:40px;padding:0 11px;border-radius:10px;border:1px solid #bdb9b0;background:#fff;color:var(--ink);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:800}
.opt .sw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);flex:0 0 16px}
.addact{display:flex;gap:6px;flex-wrap:wrap}
/* 결정 버튼 */
.actions{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(27,28,30,0))}
.act{min-height:58px;border-radius:16px;border:1.5px solid #767a81;background:#26282c;color:var(--on);font-weight:850;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;gap:2px;transition:transform .12s ease}
.act:active{transform:scale(.96)}
.act small{font-size:12px;font-weight:700;color:var(--on2)}
.act.lean{border:2.5px solid var(--on)}
.act.lean small{color:var(--on);font-weight:800}
.act kbd{display:none;font:inherit;font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:4px}
.foot{max-width:460px;margin:14px auto 0;display:grid;gap:4px}
/* 도장 */
.stamp{position:absolute;left:50%;top:34%;z-index:5;transform:translate(-50%,-50%) rotate(-14deg);font-size:46px;font-weight:900;letter-spacing:.06em;padding:2px 18px;border:6px solid currentColor;border-radius:14px;background:rgba(251,250,247,.86);pointer-events:none;animation:stamp .18s cubic-bezier(.3,1.6,.5,1) both}
.stamp.s-buy{color:#0f5a36}.stamp.s-hold{color:#7a4f00}.stamp.s-skip{color:#3c3f45}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(1.9);opacity:0}to{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:1}}
.drag-hint{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) rotate(-14deg);font-size:40px;font-weight:900;padding:2px 16px;border:5px solid currentColor;border-radius:12px;opacity:0;pointer-events:none;z-index:4}
.fly{will-change:transform,opacity}
/* 정리·안내 카드 */
.sumc .front{gap:10px}
.sumc h2{font-size:24px;font-weight:900;letter-spacing:-.03em}
.sumsec{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.sumsec h3{font-size:15px;font-weight:850;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sumsec h3 span{font-size:13px;font-weight:700;color:var(--sub)}
.sumsec ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sumsec li{display:flex;gap:8px;align-items:center;font-size:14px;line-height:1.35}
.sumsec li .t{flex:1;min-width:0}
.sumsec li .t small{display:block;color:var(--sub);font-size:12px}
.infoc h2{font-size:21px;font-weight:850;line-height:1.3}
/* 목록·트레이 */
.list{display:none}
.list.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:74vh;overflow:auto;z-index:45;background:var(--bg2);border-radius:20px 20px 0 0;padding:12px 16px 24px;box-shadow:0 -12px 40px rgba(0,0,0,.55)}
.scrim{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.55);border:0}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.lhead h2{font-size:15px}
.lsub{font-size:12px;color:var(--on3);font-weight:700;margin:10px 0 6px}
.litems{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.li{width:100%;display:flex;gap:10px;align-items:center;text-align:left;min-height:56px;padding:6px 10px 6px 6px;border-radius:14px;border:1px solid #3a3d42;background:#202225}
.li[aria-current="true"]{border-color:var(--on);background:#2d3034}
.li .lart{flex:0 0 44px;height:44px;border-radius:10px;background:#efece5;padding:4px;--art-line:#3a3a3a}
.li .lart svg{width:100%;height:100%}
.li .ltxt{flex:1;min-width:0;display:grid;font-size:13px;line-height:1.3}
.li .ltxt b{font-size:12px;color:var(--on2)}
.li .lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .lprice{color:var(--on2);font-size:12px}
.lst{font-size:12px;font-weight:800;padding:1px 7px;border-radius:999px;white-space:nowrap}
.lst.buy{background:#d9efe2;color:#0f4d2f}.lst.hold{background:#f4e6c4;color:#5c3b00}.lst.skip{background:#45484e;color:#eceef1}.lst.now{background:var(--on);color:#111}
.tray{display:none}
.tray h2{font-size:16px}
.tcount{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tcount div{background:#202225;border:1px solid #3a3d42;border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--on2)}
.tcount b{display:block;font-size:22px;color:var(--on);font-variant-numeric:tabular-nums}
.tsec{display:grid;gap:6px}
.tsec h3{font-size:13px;color:var(--on2)}
.titem{display:flex;gap:8px;align-items:center;font-size:13px;line-height:1.35;background:#202225;border-radius:12px;padding:6px 6px 6px 10px}
.titem .t{flex:1;min-width:0}
.titem .t small{display:block;color:var(--on3);font-size:12px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;color:var(--on2);align-items:center}
.keys kbd{font:inherit;font-weight:800;color:var(--on);border:1px solid var(--edge);border-radius:6px;padding:0 6px;text-align:center}
.slink{display:inline-flex;align-items:center;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid #c4c0b7;font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap;color:var(--ink);background:#fff}
.tray .slink,.page .slink{background:transparent;color:var(--on);border-color:var(--edge)}
/* 내 옷·기록 */
.page{max-width:880px;margin:0 auto;padding:8px 16px 56px;display:grid;gap:16px;align-content:start}
.page h1{font-size:24px;letter-spacing:-.03em}
.page .lead{color:var(--on2);font-size:14px}
.group{display:grid;gap:8px}
.group h2{font-size:14px;color:var(--on2);display:flex;gap:8px;align-items:center}
.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid #393c41;border-radius:16px;padding:10px}
.item .t{flex:1;min-width:0;font-size:14px;line-height:1.4}
.item .t small{display:block;color:var(--on3);font-size:12px}
.item .tile{flex:0 0 52px;height:52px;border-radius:12px;background:#efece5;padding:5px;--art-line:#3a3a3a}
.item .tile svg{width:100%;height:100%}
.rec{display:grid;gap:8px;background:var(--bg2);border:1px solid #393c41;border-radius:16px;padding:12px}
.rec .head{display:flex;gap:10px;align-items:center}
.rec .stage{font-size:13px;font-weight:800;color:var(--on)}
.rec .stage small{display:block;font-weight:500;color:var(--on3);font-size:12px}
.err{color:#ffb4a6;font-size:13px}
#toast{position:fixed;left:50%;top:calc(54px + env(safe-area-inset-top));transform:translateX(-50%) translateY(10px);z-index:60;background:var(--on);color:#111;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;width:max-content;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.undo-row{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:var(--on);color:#111;font-weight:800;font-size:14px;padding:4px 4px 4px 14px;border-radius:14px;min-height:48px;animation:pop .2s cubic-bezier(.3,1.4,.5,1)}
.undo-row span{flex:1;min-width:0}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.undo-row button{min-height:40px;min-width:40px;padding:0 16px;border-radius:10px;border:0;background:#111;color:#fff;font-weight:800;font-size:14px}
.deck.flow{padding-bottom:24px}
.deck.flow .actions{position:static;background:none;padding:12px 0 0;max-width:460px;margin:0 auto}
.only-pc{display:none}

@media (min-width:1024px){
  .top{grid-template-columns:auto minmax(0,560px) 1fr;padding:10px 24px}
  .qbar{grid-column:2;grid-row:1}
  .nav{grid-column:3}
  .chips.cond{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
  .home{grid-template-columns:1.1fr .9fr;align-items:center;padding:40px 24px 56px;gap:48px}
  .home h1{font-size:40px}
  .preview{height:360px}
  .pv{width:240px;height:310px;margin-left:-120px}
  .deck{padding:0 24px 24px}
  .deckgrid{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:28px;max-width:1280px;margin:0 auto;align-items:start}
  .list,.list.open{display:block;position:sticky;top:12px;max-height:calc(100vh - 140px);overflow:auto;background:transparent;box-shadow:none;padding:4px 4px 12px;border-radius:0;z-index:auto}
  .scrim,.only-mobile{display:none!important}
  .only-pc{display:revert}
  .ctx{max-width:560px;margin:2px auto 10px;width:100%}
  .stack{height:clamp(430px,calc(100vh - 360px),600px)}
  .actions{position:static;background:none;padding:14px 0 0;max-width:460px;margin:0 auto}
  .act kbd{display:inline-block}
  .act{flex-direction:column}
  .tray{display:grid;gap:12px;position:sticky;top:12px;align-content:start;max-height:calc(100vh - 140px);overflow:auto;padding:4px 4px 12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="mock" data-flow="mock-label" title="실제 전문가가 참여한 결과가 아니라 AI가 디자이너·프론트 개발자 역할로 만든 시안이에요.">
  <span class="lbl"><b>목업</b> · 시안 04 한 장씩 · AI 역할 시안</span>
  <a href="../index.html">갤러리로</a>
  <button type="button" data-flow="reset" data-act="reset">처음부터</button>
</div>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="undo" class="sr" aria-live="polite" aria-atomic="true"></div>
<noscript><p style="padding:16px">이 시안은 자바스크립트가 필요해요.</p></noscript>
<script src="../shared/eoul-mock.js"></script>
<script>
(function () {
'use strict';
const M = window.EoulMock;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
const DEC = { buy: '살래', hold: '보류', skip: '패스' };
const DEC_FULL = { buy: '살래(사기로 함)', hold: '보류', skip: '패스(안 살래)' };
const FLY = { buy: 'translate(125%,-6%) rotate(16deg)', hold: 'translate(0,-125%) scale(.92)', skip: 'translate(-125%,-6%) rotate(-16deg)' };

const fresh = () => ({ screen: 'home', result: null, deck: [], pos: 0, flipped: false, adding: null, changed: null, listOpen: false, returning: null, enter: false, err: null });
let view = fresh();
let quiet = false; // 시안이 직접 바꾸는 중에는 subscribe 렌더를 건너뛴다.

// ── 공통 조각
const art = (t) => M.art(t);
const recMap = (s) => Object.fromEntries(s.records.map((r) => [r.productId, r]));
const cardsOf = (r) => (r ? [...r.products, ...r.offOccasion] : []);
const pmap = () => Object.fromEntries(cardsOf(view.result).map((p) => [p.id, p]));
const currentId = () => view.deck[view.pos] || null;
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('on'), 2200);
}
function act(fn) {
  quiet = true;
  try { return fn(); }
  catch (error) { view.err = error.message; toast(error.message); return null; }
  finally { quiet = false; }
}

// ── 화면 이동(history)
function hist(push) {
  const st = { screen: view.screen, q: view.result?.text || '', said: view.result?.said || '', drop: view.result?.dropped || [], pos: view.pos };
  const p = new URLSearchParams();
  if (st.screen === 'deck' && st.q) p.set('q', st.q);
  if (st.screen === 'closet' || st.screen === 'records') p.set('view', st.screen);
  const url = location.pathname + (p.toString() ? `?${p}` : '');
  try { history[push ? 'pushState' : 'replaceState'](st, '', url); }
  catch { try { history[push ? 'pushState' : 'replaceState'](st, ''); } catch { /* 기록 없이도 동작 */ } }
}
function go(screen, { push = true } = {}) {
  hideUndo();
  view.screen = screen;
  view.flipped = false; view.adding = null; view.listOpen = false; view.returning = null; view.err = null;
  hist(push);
  render();
  window.scrollTo(0, 0);
}
window.addEventListener('popstate', (e) => {
  const st = e.state;
  view.flipped = false; view.adding = null; view.listOpen = false; view.returning = null; view.changed = null;
  if (!st) { view.screen = 'home'; return render(); }
  view.screen = st.screen;
  if (st.q && (!view.result || view.result.text !== st.q || JSON.stringify(view.result.dropped) !== JSON.stringify(st.drop || []))) {
    view.result = M.ask(st.q, { drop: st.drop || [] });
    view.deck = cardsOf(view.result).map((p) => p.id);
  }
  view.pos = Math.min(st.pos || 0, view.deck.length);
  render();
});

// ── 요청
function doAsk(text, { drop = [], previous = view.result } = {}) {
  hideUndo();
  const r = M.ask(text, { drop, previous });
  view.result = r;
  view.deck = cardsOf(r).map((p) => p.id);
  Object.assign(view, { pos: 0, flipped: false, adding: null, changed: null, listOpen: false, enter: true, screen: 'deck' });
  hist(true);
  render();
  window.scrollTo(0, 0);
}

// ── 머리
function headerHTML(s) {
  const q = view.screen === 'home' ? '' : `<form class="qbar" data-form="ask" role="search">
      <label class="sr" for="q-top">찾을 옷 한 줄 요청</label>
      <input id="q-top" name="q" data-flow="ask-input" autocomplete="off" enterkeyhint="search" value="${esc(view.result?.said || '')}" placeholder="예: 겨울 데이트 코트">
      <button class="go" data-flow="ask-submit">찾기</button></form>`;
  const cur = (n) => (view.screen === n ? ' aria-current="page"' : '');
  return `<header class="top">
    <span class="logo">어울<i>한 장씩</i></span>
    ${q}
    <nav class="nav" aria-label="화면">
      <button type="button" data-flow="nav-ask" data-act="nav-ask"${cur('home')}>새 요청</button>
      <button type="button" data-flow="nav-closet" data-act="nav-closet"${cur('closet')} aria-label="내 옷 ${s.closetCount}벌">내 옷<b>${s.closetCount}</b></button>
      <button type="button" data-flow="nav-records" data-act="nav-records"${cur('records')} aria-label="기록 ${s.records.length}건">기록<b>${s.records.length}</b></button>
    </nav></header>`;
}

// ── 첫 화면
function homeHTML(s) {
  const ex = M.examples().map((q) => `<button type="button" class="chip" data-flow="example" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  const edge = M.edgeExamples().filter((q) => !/^더/.test(q)).map((q) => `<button type="button" class="chip" data-flow="example" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  const trial = s.trialCount
    ? `<p>체험용 옷 <b>${s.trialCount}벌</b>이 들어 있어요. 카드 판정이 이 옷 기준으로 나와요. <span class="tag trial">체험용</span></p>
       <div class="row"><button type="button" class="btn small" data-act="trial-clear">체험용 옷 빼기</button></div>`
    : `<p class="fine" style="font-size:13px">옷장은 없어도 돼요. 가진 옷은 카드에서 비교할 때 그 자리에서 한 벌씩 넣어요. 미리 보고 싶으면 예시 옷으로 해 보세요.</p>
       <div class="row"><button type="button" class="btn small" data-flow="trial-closet" data-act="trial">체험용 옷으로 해 보기</button><span class="tag trial">체험용 · 선택</span></div>`;
  return `<main class="home">
    <section>
      <p class="kicker">옷장 없이 바로 시작</p>
      <h1>찾는 옷을 한 줄로.<br>후보는 한 장씩 보고 바로 정해요.</h1>
      <form class="bigask" data-form="ask" role="search">
        <label class="sr" for="q-home">찾을 옷 한 줄 요청</label>
        <input id="q-home" name="q" data-flow="ask-input" autocomplete="off" enterkeyhint="search" placeholder="예: 겨울 데이트 코트">
        <button data-flow="ask-submit">찾기</button>
      </form>
      <p class="exlabel">이렇게 적어 보세요</p>
      <div class="chips">${ex}</div>
      <p class="exlabel">없거나 못 읽는 요청은 솔직하게 알려요</p>
      <div class="chips">${edge}</div>
    </section>
    <section style="display:grid;gap:18px">
      <div class="preview" aria-hidden="true">
        <div class="pv pv1"><div class="pa">${art({ kind: 'shirt', color: 'white' })}</div><i></i><i class="s"></i></div>
        <div class="pv pv2"><div class="pa">${art({ kind: 'sneaker', color: 'white' })}</div><i></i><i class="s"></i></div>
        <div class="pv pv3" style="position:absolute"><div class="pa" style="position:relative">${art({ kind: 'coat', color: 'brown' })}</div><i></i><i class="s"></i></div>
      </div>
      <ol class="how">
        <li><b>1 한 줄</b>대충 적어도 조건으로 읽어요</li>
        <li><b>2 한 장씩</b>판정과 함께 카드 한 장</li>
        <li><b>3 살래·보류·패스</b>누르면 바로 기록</li>
      </ol>
      <div class="trialbox">
        <h2>가진 옷과 비교 <span class="fine" style="font-size:12px;font-weight:600">(선택)</span></h2>
        ${trial}
        <div class="row"><span class="fine" style="font-size:13px">상품</span>
          <div class="seg" role="group" aria-label="상품 성별">
            <button type="button" data-act="gender" data-g="M" aria-pressed="${s.gender === 'M'}">남성</button>
            <button type="button" data-act="gender" data-g="F" aria-pressed="${s.gender === 'F'}">여성</button>
          </div></div>
      </div>
      <div style="display:grid;gap:4px">
        <p class="fine">${esc(M.note.rules)}</p>
        <p class="fine">${esc(M.note.catalog)}</p>
        <p class="fine">${esc(M.note.ai)}</p>
        <p class="fine">참고한 패턴: 스와이프형 카드 판단(참고 실서비스·수상 여부 미확인), Coupang R.Lux의 마이크로 애니메이션·흑백 인터페이스(Red Dot Design Concept 2025). 화면·상표는 따라 하지 않았어요.</p>
      </div>
    </section>
  </main>`;
}

// ── 결과: 조건 칩·안내
function chipsHTML(r, withMore) {
  const chips = r.conditions.map((c) => (c.removable
    ? `<button type="button" class="chip" data-flow="condition-remove" data-key="${esc(c.key)}" aria-label="${esc(c.label)} 조건 빼기">${esc(c.label)} <span class="x" aria-hidden="true">×</span></button>`
    : `<span class="chip fixed" title="종류는 뺄 수 없어요">${esc(c.label)}</span>`)).join('');
  const more = withMore ? `<button type="button" class="chip more" data-act="cheaper">더 싼 걸로 ↓</button>` : '';
  return chips || more ? `<div class="chips cond" aria-label="읽은 조건">${chips}${more}</div>` : '';
}
const noticesHTML = (list) => (list.length ? `<ul class="notices">${list.map((n) => `<li class="notice">${esc(n.text)}</li>`).join('')}</ul>` : '');

function deckHTML(s) {
  const r = view.result;
  if (!r) return homeHTML(s);
  const n = view.deck.length;
  if (!n) {
    return `<main class="deck"><div class="ctx" style="max-width:460px;margin-left:auto;margin-right:auto">${chipsHTML(r, false)}</div>
      <div class="stack"><article class="card infoc" id="top-card"><div class="face front light">
        <p class="basis">${r.understood ? '맞는 상품 0건' : '읽지 못한 요청'}</p>
        <h2>${esc(r.title)}</h2>
        ${noticesHTML(r.notices)}
        <p style="font-size:14px;color:#2c2f33">상품을 억지로 채우지 않았어요. ${r.conditions.some((c) => c.removable) ? '위 조건 칩을 직접 빼거나 ' : ''}다른 말로 다시 적어 주세요.</p>
        <p class="step">이렇게 적어 보세요</p>
        <div class="opts">${(r.examples || M.examples()).slice(0, 4).map((q) => `<button type="button" class="opt" data-flow="example" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
        <p class="fine" style="margin-top:auto">${esc(M.note.rules)}</p>
      </div></article></div></main>`;
  }
  const recs = recMap(s);
  const done = view.pos >= n;
  const id = currentId();
  const shown = Math.min(view.pos + 1, n);
  const listnote = `${esc(r.listNote)} · 후보 ${n}장${r.offOccasionTitle ? ` (그중 ${esc(r.offOccasionTitle)})` : ''}`;
  const ctx = `<div class="ctx">
      <h1 class="rtitle">${esc(r.title)}</h1>
      ${chipsHTML(r, r.products.length > 0)}
      ${noticesHTML(r.notices)}
      <p class="listnote only-pc">${listnote}</p>
    </div>`;
  const prog = `<div class="prog">
      <button type="button" class="ghostbtn" data-act="prev" ${view.pos === 0 ? 'disabled' : ''} aria-label="이전 카드">← 이전</button>
      <div class="pbar"><div class="pt"><b aria-label="${done ? `${n}장 다 봤어요` : `${n}장 중 ${shown}번째`}">${done ? `${n} / ${n} 끝` : `${shown} / ${n}`}</b></div>
        <div class="track" aria-hidden="true"><i style="--p:${Math.round((Math.min(view.pos, n) / n) * 100)}%"></i></div></div>
      <button type="button" class="ghostbtn only-mobile" data-act="list" aria-expanded="${view.listOpen}" aria-controls="cand-list">후보 목록</button>
    </div>`;
  const ghosts = `${view.pos + 2 <= n ? '<div class="ghost" aria-hidden="true"></div>' : ''}${view.pos + 1 <= n ? '<div class="ghost g1" aria-hidden="true"></div>' : ''}`;
  const top = done ? summaryCard(s, recs) : productCard(id, recs);
  let actions = '';
  if (!done) {
    const v = M.judge(id);
    const b = (d, label, arrow, key) => {
      const lean = v.lean === d;
      const txt = d === 'buy' ? `${label} ${arrow}` : `${arrow} ${label}`;
      return `<button type="button" class="act ${d}${lean ? ' lean' : ''}" data-flow="decide-${d}" data-act="decide" data-d="${d}" aria-label="${DEC_FULL[d]}${lean ? ' · 판정이 기운 쪽' : ''}">
        <span>${txt}</span><small>${lean ? '판정 쪽' : d === 'buy' ? '사기로 함' : d === 'hold' ? '나중에' : '안 살래'}</small></button>`;
    };
    actions = `<div class="actions" role="group" aria-label="이 카드 결정">${undoRow()}${b('skip', '패스', '←', 'ArrowLeft')}${b('hold', '보류', '↑', 'ArrowUp')}${b('buy', '살래', '→', 'ArrowRight')}</div>`;
  } else {
    actions = `<div class="actions" role="group" aria-label="정리 다음">${undoRow()}<button type="button" class="act" data-act="restart" aria-label="첫 카드부터 다시 보기"><span>다시 보기</span><small>첫 카드부터</small></button>
      <button type="button" class="act" data-act="nav-records" style="grid-column:span 2"><span>기록으로 →</span><small>주문·받음 남기기</small></button></div>`;
  }
  return `<main class="deck"><div class="deckgrid">
      ${listHTML(recs, r)}
      <div class="center">${ctx}${prog}
        <div class="stack">${ghosts}${top}</div>
        ${actions}
        <div class="foot"><p class="fine only-mobile">${listnote}</p><p class="fine">${esc(M.note.price)}</p><p class="fine">${esc(M.note.catalog)}</p></div>
      </div>
      ${trayHTML(s, recs)}
    </div>${view.listOpen ? '<button type="button" class="scrim only-mobile" data-act="list-close" aria-label="후보 목록 닫기"></button>' : ''}</main>`;
}

// ── 카드 앞·뒤
function productCard(id, recs) {
  const d = M.product(id);
  const v = d.verdict;
  const idx = view.deck.indexOf(id);
  const changed = view.changed && view.changed.id === id && view.changed.from !== v.title ? view.changed.from : null;
  const rec = recs[id];
  const flipped = view.flipped;
  const ask = v.ask ? `<div class="askq" role="group" aria-label="${esc(v.ask.question)}"><span>${esc(v.ask.question)}</span>
      <div class="seg">${v.ask.choices.map((c) => `<button type="button" data-act="own" data-v="${c.id}" aria-pressed="${v.ask.value === c.id}">${esc(c.label)}</button>`).join('')}</div>
      ${v.ask.hint ? `<span class="hint">${esc(v.ask.hint)}</span>` : ''}</div>` : '';
  const addBtn = v.basis === 'none' && v.addSuggestion
    ? `<button type="button" class="lbtn solid grow" data-flow="closet-add" data-act="open-add" data-kind="${esc(v.addSuggestion.kind)}">가진 ${esc(v.addSuggestion.kindName)} 넣고 비교</button>` : '';
  const front = `<div class="face front"${flipped ? ' inert aria-hidden="true"' : ''}>
      <div class="ftop"><span class="ftags">
        ${d.offOccasion ? `<span class="tag off" title="${esc(view.result.offOccasionTitle || '')}">덜 맞는 대안</span>` : ''}
        ${rec?.decision ? `<span class="tag rec">지난 결정 · ${esc(DEC[rec.decision])}</span>` : ''}<span class="basis">${esc(v.basisLabel)}</span></span>
        <button type="button" class="lbtn soft" data-act="flip" aria-label="카드 뒤집어 이유·코디·판매처·중고 보기">근거·판매처 ↻</button></div>
      <div class="fart" data-swipe>${art(d)}<span class="hint only-mobile" aria-hidden="true">좌우로 밀기 · 누르면 뒤집기</span><span class="hint only-pc" aria-hidden="true">누르면 뒤집혀요</span></div>
      <div class="meta"><p class="brand">${esc(d.brand)} · ${esc(d.slotName)} · ${esc(d.colorLabel)}</p>
        <h2 class="pname">${esc(d.name)}</h2>
        <p class="price"><span><b>${esc(d.priceText)}</b>${esc(d.priceNote)}</span><a class="slink" data-flow="seller-link" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(d.store)}에서 보기(새 창)">${esc(d.store)} ↗</a></p></div>
      <div class="judge">
        <h3 class="vt${changed ? ' changed' : ''}"><span data-flow="verdict">${esc(v.title)}</span></h3>
        ${changed ? `<p class="was">방금 바뀜 · 전에는 <s>${esc(changed)}</s></p>` : ''}
        <ul class="vlines">${v.lines.slice(0, 2).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
        ${ask}
        ${v.cautions.length ? `<p class="caution">${esc(v.cautions[0])}${v.cautions.length > 1 ? ` 외 ${v.cautions.length - 1}건` : ''}</p>` : ''}
      </div>
      ${addBtn ? `<div class="frow">${addBtn}</div>` : ''}
    </div>`;
  return `<article class="card tone-${v.tone}${flipped ? ' is-flipped' : ''}${view.enter ? ' enter' : ''}" id="top-card" tabindex="0" data-id="${esc(id)}" aria-label="후보 ${idx + 1} / ${view.deck.length}: ${esc(d.brand)} ${esc(d.name)}. 판정: ${esc(v.title)}. 카드에서 방향키 → 살래, ↑ 보류, ← 패스, 스페이스 뒤집기">
    ${front}
    <div class="face back"${flipped ? '' : ' inert aria-hidden="true"'}>${backHTML(d, v)}</div>
  </article>`;
}

function piecesHTML(look) {
  return `<ul class="pieces">${look.pieces.map((pc) => `<li class="${pc.focus ? 'focus' : ''}"><span class="mini" aria-hidden="true">${art(pc)}</span>
    <span><small>${esc(pc.roleLabel)} · ${pc.focus ? '이 상품' : pc.owned ? (pc.trial ? '체험용 옷' : '내 옷') : '함께 볼 후보'}</small>${esc(pc.label)}${pc.product && !pc.focus ? ` · ${esc(pc.product.priceText)} 수집가` : ''}</span></li>`).join('')}</ul>`;
}

function backHTML(d, v) {
  const used = M.usedSearch(d.id);
  const a = view.adding && view.adding.ctx === 'card' && view.adding.forId === d.id ? addPanelHTML('card') : '';
  const looks = (v.looks || []).length
    ? `<section class="bsec"><h4>가진 옷으로 만든 코디 ${v.newLookCount ? `<span class="tag go">새 코디 ${v.newLookCount}개</span>` : ''}</h4>
        ${v.looks.slice(0, 2).map((l) => `<div class="look"><p style="font-size:14px;font-weight:800">${l.new ? '새로 · ' : ''}${esc(l.formula || l.title)}</p>${piecesHTML(l)}</div>`).join('')}</section>`
    : d.outfit
      ? `<section class="bsec"><h4>이 상품으로 만든 코디</h4><div class="look"><p style="font-size:14px;font-weight:800">${esc(d.outfit.formula || d.outfit.title)}</p>${piecesHTML(d.outfit)}<p class="fine">${esc(d.outfit.note)}</p></div>
          ${d.outfitNote || view.result?.outfitNote ? `<p class="fine">${esc(d.outfitNote || view.result.outfitNote)}</p>` : ''}</section>`
      : `<section class="bsec"><h4>이 상품으로 만든 코디</h4><p class="fine">${esc(d.outfitNote || '이 조건으로 만들 수 있는 코디가 없어요.')}</p></section>`;
  return `<div class="btop"><p>${esc(d.brand)}<br>${esc(d.name)}</p><button type="button" class="lbtn soft" data-act="flip" aria-label="카드 앞면으로">앞면 ↻</button></div>
    ${a}
    <section class="bsec"><h4>판매처 · 고른 이유</h4>
      <div class="price"><span><b>${esc(d.priceText)}</b>${esc(d.priceNote)}</span><a class="lbtn solid" data-flow="seller-link" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">${esc(d.store)}에서 보기 ↗</a></div>
      <p class="fine">${esc(M.note.price)}</p>
      <ul>${d.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
      ${d.tip ? `<p style="font-size:13px">${esc(d.tip)}</p>` : ''}
      <p class="fine">${esc(d.colorNote)}${d.popularity ? ` · ${esc(d.popularity)}` : ''}</p></section>
    <section class="bsec">
      <p class="basis">${esc(v.basisLabel)}</p>
      <h3 class="vt" style="font-size:18px"><span data-flow="verdict">${esc(v.title)}</span></h3>
      <ul>${v.lines.map((l) => `<li>${esc(l)}</li>`).join('')}${(v.reasons || []).map((l) => `<li>${esc(l)}</li>`).join('')}</ul>
      ${(v.owned || []).length ? `<p style="font-size:13px;font-weight:800">겹칠 수 있는 내 옷</p><ul class="owned">${v.owned.map((g) => `<li><span class="mini" aria-hidden="true">${art(g)}</span><span style="font-size:13px">${esc(g.colorLabel)} ${esc(g.label)} · ${esc(g.relationLabel)} <span class="tag${g.trial ? ' trial' : ''}">${esc(g.sourceLabel)}</span></span></li>`).join('')}</ul>` : ''}
      ${v.companion ? `<p style="font-size:13px">함께 더하면 ${esc(v.companion.pairTitle)}: ${esc(v.companion.brand)} ${esc(v.companion.name)} · ${esc(v.companion.priceText)} 수집가</p>` : ''}
      ${v.cautions.map((c) => `<p class="caution">${esc(c)}</p>`).join('')}
      ${v.basis === 'none' && !a ? `<div class="row"><button type="button" class="lbtn solid" data-flow="closet-add" data-act="open-add" data-kind="${esc(v.addSuggestion?.kind || '')}">가진 옷 넣고 비교</button><button type="button" class="lbtn soft" data-flow="trial-closet" data-act="trial">체험용 옷으로 보기</button><span class="tag trial">체험용</span></div>` : ''}
      <p class="fine">${esc(v.fine)}</p>
    </section>
    ${looks}
    ${used ? `<section class="bsec used" data-flow="used-search"><h4>중고로도 찾아보기 <span class="tag pre">매물 연동 전 · 검색 링크만</span></h4>
      <p class="fine">${esc(used.note)} ${esc(used.exactNote)}</p>
      <div class="links">${used.groups.map((g) => `<p class="region">${esc(g.region)}</p><div class="lgrid">${g.links.map((l) => `<a class="ulink" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)} 검색 ↗${l.note ? `<small>${esc(l.note)}</small>` : ''}</a>`).join('')}</div>`).join('')}</div>
      <p class="fine">${esc(used.abroadNote)}</p></section>` : ''}
    <p class="fine" style="padding-top:6px">${esc(M.note.catalog)}</p>`;
}

// ── 가진 옷 넣기 패널(카드 뒷면·내 옷 화면 공용)
function addPanelHTML(where) {
  const a = view.adding;
  const kinds = M.kindChoices();
  const first = a.suggest ? [...kinds.filter((k) => k.id === a.suggest), ...kinds.filter((k) => k.id !== a.suggest)] : kinds;
  const slots = a.kind ? M.slotChoices(a.kind) : [];
  const kindName = kinds.find((k) => k.id === a.kind)?.name;
  return `<div class="addp light" role="group" aria-labelledby="addp-h">
    <h4 id="addp-h">${where === 'card' ? '가진 옷 한 벌 넣고 이 카드 다시 판정' : '옷 한 벌 넣기'}</h4>
    <p class="step">1 종류</p>
    <div class="opts">${first.map((k) => `<button type="button" class="opt" data-flow="kind-option" data-kind="${k.id}" aria-pressed="${a.kind === k.id}">${esc(k.name)}</button>`).join('')}</div>
    ${a.kind ? `<p class="step">2 색</p>
      <div class="opts">${M.colorChoices().map((c) => `<button type="button" class="opt" data-flow="color-option" data-color="${c.id}" aria-pressed="${a.color === c.id}"><span class="sw" style="background:${esc(c.hex)}" aria-hidden="true"></span>${esc(c.label)}</button>`).join('')}</div>` : ''}
    ${a.kind && slots.length > 1 ? `<p class="step">3 세부 종류 (몰라도 돼요)</p>
      <div class="opts">${slots.map((sl) => `<button type="button" class="opt" data-flow="slot-option" data-slot="${sl.id}" aria-pressed="${a.slot === sl.id}">${esc(sl.name)}</button>`).join('')}</div>` : ''}
    <div class="addact">
      <button type="button" class="lbtn solid" data-flow="closet-save" data-act="save" ${a.kind ? '' : 'disabled'}>${a.kind ? `${a.color ? '' : '색 없이 '}${esc(kindName)} 넣${where === 'card' ? '고 다시 판정' : '기'}` : '종류를 먼저 골라 주세요'}</button>
      <button type="button" class="lbtn soft" data-act="cancel-add">취소</button>
    </div>
    <p class="fine">사진 없이 종류·색만 넣어요. 저장은 이 브라우저에만 돼요.</p>
  </div>`;
}

// ── 정리 카드
function summaryCard(s, recs) {
  const pm = pmap();
  const g = { buy: [], hold: [], skip: [], none: [] };
  view.deck.forEach((id, i) => { const d = recs[id]?.decision; (g[d] || g.none).push({ id, i, p: pm[id] }); });
  const sum = g.buy.reduce((t, x) => t + (x.p?.price || 0), 0);
  const line = (x, right) => `<li><span class="mini" aria-hidden="true">${art(x.p)}</span><span class="t">${esc(x.p.brand)} ${esc(x.p.name)}<small>${esc(x.p.priceText)} · ${esc(x.p.priceNote)}</small></span>${right}</li>`;
  const jump = (x) => `<button type="button" class="slink" data-act="jump" data-i="${x.i}" aria-label="${esc(x.p.name)} 카드 다시 보기">다시 보기</button>`;
  return `<article class="card sumc" id="top-card" tabindex="0" aria-label="정리 카드"><div class="face front light" style="--tone:#17181a">
    <p class="basis">이 요청 후보 ${view.deck.length}장을 다 봤어요</p>
    <h2>정리</h2>
    <section class="sumsec"><h3>살래 ${g.buy.length}개 <span>수집가 합계 ${esc(M.formatPrice(sum))}</span></h3>
      ${g.buy.length ? `<ul>${g.buy.map((x) => line(x, `<a class="slink" data-flow="seller-link" href="${esc(x.p.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(x.p.name)} ${esc(x.p.store)}에서 보기">${esc(x.p.store)} ↗</a>`)).join('')}</ul>` : '<p class="fine">아직 없어요.</p>'}</section>
    <section class="sumsec"><h3>보류 ${g.hold.length}개</h3>${g.hold.length ? `<ul>${g.hold.map((x) => line(x, jump(x))).join('')}</ul>` : ''}</section>
    <section class="sumsec"><h3>패스 ${g.skip.length}개</h3>${g.skip.length ? `<p class="fine">${g.skip.map((x) => esc(x.p.brand + ' ' + x.p.name)).join(' · ')}</p>` : ''}</section>
    ${g.none.length ? `<section class="sumsec"><h3>아직 안 정함 ${g.none.length}개</h3><ul>${g.none.map((x) => line(x, jump(x))).join('')}</ul></section>` : ''}
    <p class="fine">${esc(M.note.price)} ${esc(M.note.records)}</p>
  </div></article>`;
}

// ── 후보 목록(PC 왼쪽·모바일 시트)
function listHTML(recs, r) {
  const pm = pmap();
  const item = (id, i) => {
    const p = pm[id];
    const d = recs[id]?.decision;
    const now = i === view.pos;
    return `<li><button type="button" class="li" data-flow="result" data-product-id="${esc(id)}" data-act="jump" data-i="${i}" aria-current="${now}">
      <span class="lart" aria-hidden="true">${art(p)}</span>
      <span class="ltxt"><b>${esc(p.brand)}</b><span class="lname">${esc(p.name)}</span><span class="lprice">${esc(p.priceText)} · ${esc(p.priceNote)}</span></span>
      ${now ? '<span class="lst now">지금</span>' : d ? `<span class="lst ${d}">${DEC[d]}</span>` : ''}</button></li>`;
  };
  const fit = r.products.length;
  return `<aside class="list${view.listOpen ? ' open' : ''}" id="cand-list" aria-label="후보 목록">
    <div class="lhead"><h2>후보 ${view.deck.length}장</h2><button type="button" class="ghostbtn only-mobile" data-act="list-close">닫기</button></div>
    <ul class="litems">${view.deck.slice(0, fit).map(item).join('')}</ul>
    ${r.offOccasion.length ? `<p class="lsub">${esc(r.offOccasionTitle)}</p><ul class="litems">${view.deck.slice(fit).map((id, j) => item(id, fit + j)).join('')}</ul>` : ''}
  </aside>`;
}

// ── 결정 트레이(PC 오른쪽)
function trayHTML(s, recs) {
  const pm = pmap();
  const ids = { buy: [], hold: [], skip: [] };
  view.deck.forEach((id) => { const d = recs[id]?.decision; if (ids[d]) ids[d].push(id); });
  const sum = ids.buy.reduce((t, id) => t + (pm[id]?.price || 0), 0);
  return `<aside class="tray" aria-label="결정 트레이">
    <h2>결정 트레이</h2>
    <div class="tcount"><div><b>${ids.buy.length}</b>살래</div><div><b>${ids.hold.length}</b>보류</div><div><b>${ids.skip.length}</b>패스</div></div>
    <section class="tsec"><h3>살래 · 수집가 합계 ${esc(M.formatPrice(sum))}</h3>
      ${ids.buy.map((id) => `<div class="titem"><span class="t">${esc(pm[id].name)}<small>${esc(pm[id].brand)} · ${esc(pm[id].priceText)}</small></span><a class="slink" href="${esc(pm[id].url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(pm[id].name)} 판매처에서 보기">판매처 ↗</a></div>`).join('') || '<p class="fine">살래를 누르면 여기에 모여요.</p>'}</section>
    ${ids.hold.length ? `<section class="tsec"><h3>보류</h3>${ids.hold.map((id) => `<div class="titem"><span class="t">${esc(pm[id].name)}<small>${esc(pm[id].priceText)}</small></span><button type="button" class="slink" data-act="jump" data-i="${view.deck.indexOf(id)}" aria-label="${esc(pm[id].name)} 다시 보기">다시 보기</button></div>`).join('')}</section>` : ''}
    <button type="button" class="btn" data-act="nav-records">기록에서 주문·받음 남기기 →</button>
    <p class="fine">${esc(M.note.records)}</p>
    <p class="fine">방향키는 카드에 포커스가 있을 때만 결정해요(Tab으로 카드 선택).</p><div class="keys" aria-label="키보드"><kbd>→</kbd><span>살래</span><kbd>↑</kbd><span>보류</span><kbd>←</kbd><span>패스</span><kbd>Space</kbd><span>카드 뒤집기</span></div>
  </aside>`;
}

// ── 내 옷
function closetHTML(s) {
  const groups = [['내 옷', s.closet.filter((g) => !g.trial && !g.bought)], ['기록에서 산 옷', s.closet.filter((g) => g.bought && !g.trial)], ['체험용', s.closet.filter((g) => g.trial)]];
  const adding = view.adding && view.adding.ctx === 'closet';
  return `<main class="page">
    <div><h1>내 옷 ${s.closetCount}벌</h1>
      <p class="lead">옷장은 없어도 돼요. 카드에서 “가진 옷 넣고 비교”를 누르면 그 자리에서 한 벌씩 넣고, 같은 카드 판정이 바로 바뀌어요.</p></div>
    <div class="row">
      <button type="button" class="btn primary" data-flow="closet-add" data-act="open-add">옷 한 벌 넣기</button>
      ${s.trialCount ? '<button type="button" class="btn" data-act="trial-clear">체험용 옷 빼기</button>' : '<button type="button" class="btn" data-flow="trial-closet" data-act="trial">체험용 옷 넣기</button>'}
      <span class="tag trial">체험용은 예시 옷이에요</span>
    </div>
    ${adding ? addPanelHTML('closet') : ''}
    ${view.err ? `<p class="err" role="alert">${esc(view.err)}</p>` : ''}
    ${groups.map(([name, list]) => (list.length ? `<section class="group"><h2>${name} <span class="fine">${list.length}벌</span></h2><ul class="items">${list.map((g) => `<li class="item">
        <span class="tile" aria-hidden="true">${art(g)}</span>
        <span class="t">${esc(g.label)}<small>${esc(g.colorLabel)} · ${esc(g.slotName || g.kindName)}${g.detailMissing ? ` · ${esc(g.detailMissing)}` : ''} · ${esc(g.sourceLabel)}</small></span>
        <button type="button" class="btn small" data-act="remove-garment" data-id="${esc(g.id)}" aria-label="${esc(g.colorLabel)} ${esc(g.label)} 빼기">빼기</button></li>`).join('')}</ul></section>` : '')).join('')}
    ${s.closetCount ? '' : '<p class="fine" style="font-size:13px">아직 넣은 옷이 없어요. 판정은 “옷장 없이 판단했어요”로 나와요.</p>'}
    <div class="row"><span class="fine" style="font-size:13px">상품</span><div class="seg" role="group" aria-label="상품 성별">
      <button type="button" data-act="gender" data-g="M" aria-pressed="${s.gender === 'M'}">남성</button>
      <button type="button" data-act="gender" data-g="F" aria-pressed="${s.gender === 'F'}">여성</button></div></div>
  </main>`;
}

// ── 기록
function recordsHTML(s) {
  const list = s.records;
  const G = [
    ['사기로 함 · 주문 전', (r) => r.stage === 'candidate' && r.decision === 'buy'],
    ['주문·받음 진행 중', (r) => r.stage === 'ordered' || r.stage === 'received'],
    ['계속 입는 옷', (r) => r.stage === 'kept'],
    ['보류', (r) => r.stage === 'candidate' && r.decision === 'hold'],
    ['안 살래(패스)', (r) => r.stage === 'candidate' && r.decision === 'skip'],
    ['반품', (r) => r.stage === 'returned'],
    ['비교 중', (r) => r.stage === 'candidate' && !r.decision],
  ];
  const recHTML = (r) => {
    const p = r.product || {};
    let steps = '';
    if (r.stage === 'candidate' && r.decision !== 'buy') {
      steps = `<button type="button" class="btn small" data-act="redecide" data-id="${esc(r.productId)}" data-d="buy">살래로 바꾸기</button>${r.decision !== 'hold' ? `<button type="button" class="btn small" data-act="redecide" data-id="${esc(r.productId)}" data-d="hold">보류로</button>` : ''}`;
    } else {
      steps = r.next.map((n) => `<button type="button" class="btn small${n.step === 'ordered' || n.step === 'kept' ? ' primary' : ''}" data-flow="record-step" data-step="${n.step}" data-product-id="${esc(r.productId)}" data-act="step"${n.needsReason ? ' data-needs="1"' : ''}>${esc(n.label)}${n.step === 'worn' && r.wearCount ? ` (${r.wearCount}번)` : ''}</button>`).join('');
      if (r.stage === 'candidate') steps += `<button type="button" class="btn small" data-act="redecide" data-id="${esc(r.productId)}" data-d="hold">보류로</button>`;
    }
    const reasons = view.returning === r.productId ? `<div class="row" role="group" aria-label="반품 사유"><span class="fine" style="font-size:13px">반품 사유</span>${M.returnReasons.map((x) => `<button type="button" class="chip" data-act="return-reason" data-id="${esc(r.productId)}" data-reason="${x.id}">${esc(x.label)}</button>`).join('')}<button type="button" class="chip" data-act="return-cancel">취소</button></div>` : '';
    return `<article class="rec" data-flow="record" data-product-id="${esc(r.productId)}">
      <div class="head"><span class="tile item" style="padding:0;border:0;background:none"><span class="tile" aria-hidden="true">${art(p)}</span></span>
        <div style="flex:1;min-width:0"><p style="font-size:13px;color:var(--on2)">${esc(p.brand)}</p><h3 style="font-size:15px;line-height:1.35">${esc(p.name)}</h3>
          <p class="fine">${esc(p.priceText)} 수집가 · ${esc(p.colorLabel)} ${esc(p.kindName)}</p></div></div>
      <p class="stage">${esc(r.stageLabel)}<small>결정: ${esc(r.decisionLabel)}${r.returnReasonLabel ? ` · 반품 사유: ${esc(r.returnReasonLabel)}` : ''}${r.wearCount ? ` · 입은 날 ${r.wearCount}번` : ''}</small></p>
      <div class="row">${steps}${p.url && r.stage === 'candidate' ? `<a class="slink" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">판매처 ↗</a>` : ''}${r.stage === 'candidate' ? `<button type="button" class="btn small" data-act="remove-record" data-id="${esc(r.productId)}" aria-label="${esc(p.name)} 기록 지우기">지우기</button>` : ''}</div>
      ${reasons}
    </article>`;
  };
  return `<main class="page">
    <div><h1>기록 ${list.length}건</h1><p class="lead">카드에서 누른 살래·보류·패스가 그대로 기록이 돼요. 주문하고 받으면 여기서 한 번씩 눌러 남겨요.</p>
      <p class="fine" style="margin-top:4px">${esc(M.note.records)}</p></div>
    ${view.err ? `<p class="err" role="alert">${esc(view.err)}</p>` : ''}
    ${list.length ? G.map(([name, f]) => { const rows = list.filter(f); return rows.length ? `<section class="group"><h2>${name} <span class="fine">${rows.length}</span></h2>${rows.map(recHTML).join('')}</section>` : ''; }).join('')
      : `<p class="lead">아직 기록이 없어요. 요청하고 카드에서 살래·보류·패스를 누르면 여기에 남아요.</p><div class="row"><button type="button" class="btn primary" data-act="nav-ask">요청하러 가기</button></div>`}
  </main>`;
}

// ── 그리기
function focusKey(el) {
  if (!el || el === document.body) return null;
  const d = el.dataset || {};
  return [d.flow || d.act || el.id, d.kind, d.color, d.slot, d.v, d.i, d.step, d.d, d.g, d.reason, d.productId].join('|');
}
function render() {
  const s = M.getState();
  const fk = focusKey(document.activeElement);
  const body = view.screen === 'deck' ? deckHTML(s) : view.screen === 'closet' ? closetHTML(s) : view.screen === 'records' ? recordsHTML(s) : homeHTML(s);
  $('#app').innerHTML = headerHTML(s) + body;
  view.enter = false;
  fitStack();
  if (fk) {
    const el = [...document.querySelectorAll('#app button, #app a, #app input')].find((x) => focusKey(x) === fk && !x.closest('[inert]'));
    if (el) el.focus({ preventScroll: true });
  }
}

// 카드 높이를 남은 화면에 맞춘다(위의 조건·안내 길이가 달라도 카드와 결정 버튼이 한 화면에).
const PCQ = window.matchMedia('(min-width: 1024px)');
function fitStack() {
  const st = $('.stack');
  if (!st) return;
  const actions = $('.actions');
  const deck = $('main.deck');
  deck?.classList.remove('flow');
  const front = $('#top-card .front');
  st.style.height = '0px';
  const need = front ? front.scrollHeight + 2 : 400; // 그림을 가장 작게 줄였을 때 앞면 전체 높이
  const top = st.getBoundingClientRect().top + window.scrollY;
  const reserve = actions && !$('.undo-row') ? 52 : 0; // 되돌리기 줄 자리를 늘 비워 둔다(나타나도 카드를 가리지 않게)
  const below = actions ? actions.offsetHeight + reserve + (PCQ.matches ? 14 : 6) : 16;
  const avail = Math.round(window.innerHeight - top - below - 10);
  const cap = PCQ.matches ? 600 : 640;
  if (need > avail && deck) deck.classList.add('flow'); // 화면이 낮으면 결정 버튼을 카드 아래로(고정 바가 카드를 가리지 않게)
  st.style.height = `${Math.min(cap, Math.max(avail, need, 300))}px`;
}
window.addEventListener('resize', () => { if (view.screen === 'deck') fitStack(); });

// ── 카드 동작
function setFlip(on, { focus = true } = {}) {
  view.flipped = on;
  const card = $('#top-card');
  if (!card || !card.querySelector('.back')) return;
  card.classList.toggle('is-flipped', on);
  const f = card.querySelector('.front'), b = card.querySelector('.back');
  f.inert = on; b.inert = !on;
  f.setAttribute('aria-hidden', String(on)); b.setAttribute('aria-hidden', String(!on));
  if (on) b.scrollTop = 0;
  if (!focus) return;
  const target = on ? (b.querySelector('.addp .opt') || b.querySelector('[data-act="flip"]')) : f.querySelector('[data-act="flip"]');
  setTimeout(() => target?.focus({ preventScroll: true }), RM.matches ? 0 : 180);
}
function flyOut(card, d, start) {
  if (RM.matches || !card || !card.animate) return;
  const stack = $('.stack');
  const r = (stack || card).getBoundingClientRect();
  const c = card.cloneNode(true);
  c.removeAttribute('id');
  c.querySelectorAll('[data-flow],[id]').forEach((el) => { el.removeAttribute('data-flow'); el.removeAttribute('id'); });
  c.setAttribute('aria-hidden', 'true');
  c.inert = true;
  c.classList.remove('enter');
  c.classList.add('fly');
  Object.assign(c.style, { position: 'fixed', left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px`, right: 'auto', bottom: 'auto', zIndex: 50, pointerEvents: 'none', transform: start || 'none', visibility: 'visible', transition: 'none' });
  const st = document.createElement('div');
  st.className = `stamp s-${d}`;
  st.textContent = DEC[d];
  c.appendChild(st);
  document.body.appendChild(c);
  const anim = c.animate([
    { transform: start || 'none', opacity: 1, offset: 0 },
    { transform: start || 'none', opacity: 1, offset: 0.4 },
    { transform: FLY[d], opacity: 0 },
  ], { duration: 560, easing: 'cubic-bezier(.55,0,.8,.3)', fill: 'forwards' });
  const done = () => c.remove();
  anim.onfinish = done;
  setTimeout(done, 1000);
}
function decide(d, { start = null } = {}) {
  const id = currentId();
  if (!id || view.screen !== 'deck') return;
  const prior = M.getState().records.find((r) => r.productId === id) || null;
  const undoInfo = !prior || prior.stage === 'candidate' ? { id, d, pos: view.pos, created: !prior, prev: prior?.decision || null } : null;
  const rec = act(() => M.decide(id, d));
  if (!rec) return;
  flyOut($('#top-card'), d, start);
  view.pos++;
  Object.assign(view, { flipped: false, adding: null, changed: null, enter: true });
  const n = view.deck.length;
  const msg = `${DEC[d]}로 정했어요 · ${view.pos >= n ? '다 봤어요' : `다음 ${view.pos + 1} / ${n}`}`;
  clearTimeout(undoTimer);
  undoData = undoInfo ? { ...undoInfo, msg } : null;
  if (undoData) undoTimer = setTimeout(hideUndo, 6000);
  hist(false);
  render();
  // 결정 뒤 포커스는 새 카드로(같은 버튼에 남아 Enter 두 번에 다음 상품까지 정해지지 않게).
  $('#top-card')?.focus({ preventScroll: true });
  if (undoData) $('#undo').textContent = `${msg}. 결정 버튼 위 되돌리기로 취소할 수 있어요.`;
  else toast(msg);
}
const undoRow = () => (undoData && view.screen === 'deck' ? `<div class="undo-row" role="group" aria-label="방금 결정"><span>${esc(undoData.msg)}</span><button type="button" data-act="undo" aria-label="방금 결정 되돌리기">되돌리기</button></div>` : '');
// 결정 직후 몇 초 동안 되돌리기. 새로 생긴 기록이면 지우고, 전에 결정이 있었으면 그 결정으로 돌린다(주문 뒤 단계는 건드리지 않음).
let undoTimer = null, undoData = null;
function hideUndo() {
  clearTimeout(undoTimer);
  undoData = null;
  const row = $('.undo-row');
  if (row) {
    const had = row.contains(document.activeElement);
    row.remove();
    if (had) $('#top-card')?.focus({ preventScroll: true });
    fitStack();
  }
  $('#undo').textContent = '';
}
function undo() {
  const u = undoData;
  hideUndo();
  if (!u) return;
  act(() => { if (u.created) M.removeRecord(u.id); else if (u.prev) M.decide(u.id, u.prev); });
  Object.assign(view, { screen: 'deck', pos: u.pos, flipped: false, adding: null, changed: null, listOpen: false, enter: true });
  hist(false);
  render();
  $('#top-card')?.focus({ preventScroll: true });
  toast(`되돌렸어요 · ${u.prev ? `전 결정(${DEC[u.prev]})으로` : '결정 전으로'} ${u.pos + 1} / ${view.deck.length}`);
}
function jump(i) {
  view.pos = Math.max(0, Math.min(i, view.deck.length));
  Object.assign(view, { flipped: false, adding: null, changed: null, listOpen: false, enter: true });
  hist(false);
  render();
}
function openAdd(kind, ctx) {
  view.adding = { ctx, forId: ctx === 'card' ? currentId() : null, kind: kind || null, suggest: kind || null, color: null, slot: null };
  if (ctx === 'card') {
    const wasFlipped = view.flipped;
    view.flipped = wasFlipped; // 앞면에서 열면 패널을 그린 뒤 뒤집는다.
    render();
    if (!wasFlipped) requestAnimationFrame(() => setFlip(true));
    else setFlip(true);
  } else render();
}
function saveGarment() {
  const a = view.adding;
  if (!a?.kind) return;
  const before = a.ctx === 'card' && a.forId ? M.judge(a.forId)?.title : null;
  const g = act(() => M.addGarment({ kind: a.kind, color: a.color, slot: a.slot }));
  if (!g) return;
  view.adding = null;
  if (a.ctx === 'card') {
    view.changed = { id: a.forId, from: before };
    view.flipped = true;
    render();
    requestAnimationFrame(() => setFlip(false));
    toast(`${g.colorLabel !== '색 미확인' ? `${g.colorLabel} ` : ''}${g.kindName}를 넣었어요 · 판정을 다시 봤어요`);
  } else {
    render();
    toast(`${g.kindName}를 넣었어요`);
  }
}
function loadTrial(fromCard) {
  const id = currentId();
  const before = fromCard && id ? M.judge(id)?.title : null;
  if (act(() => M.loadTrialCloset()) === null && view.err) return;
  const s = M.getState();
  if (fromCard && id && view.screen === 'deck') {
    view.adding = null;
    view.changed = { id, from: before };
    view.flipped = true;
    render();
    requestAnimationFrame(() => setFlip(false));
  } else render();
  toast(`체험용 옷 ${s.trialCount}벌을 넣었어요`);
}

// ── 이벤트
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form="ask"]');
  if (!f) return;
  e.preventDefault();
  const q = new FormData(f).get('q');
  doAsk(String(q || ''));
});
let suppressClick = false;
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, a');
  if (!t) {
    // 카드 앞면의 빈 곳(그림 포함)을 누르면 뒤집는다.
    const front = e.target.closest('#top-card .front');
    if (front && $('#top-card .back') && !suppressClick) setFlip(true);
    suppressClick = false;
    return;
  }
  const a = t.dataset.act;
  const flow = t.dataset.flow;
  if (flow === 'example') { e.preventDefault(); return doAsk(t.dataset.q, { previous: null }); }
  if (flow === 'condition-remove') { const r = view.result; return doAsk(r.text, { drop: [...r.dropped, t.dataset.key], previous: null }); }
  if (flow === 'kind-option') { view.adding.kind = t.dataset.kind; view.adding.slot = null; return renderKeep(); }
  if (flow === 'color-option') { view.adding.color = view.adding.color === t.dataset.color ? null : t.dataset.color; return renderKeep(); }
  if (flow === 'slot-option') { view.adding.slot = view.adding.slot === t.dataset.slot ? null : t.dataset.slot; return renderKeep(); }
  switch (a) {
    case 'reset':
      hideUndo();
      act(() => M.reset());
      view = fresh();
      hist(true); render(); window.scrollTo(0, 0);
      return toast('처음 상태로 돌렸어요');
    case 'nav-ask': return go('home');
    case 'nav-closet': return go('closet');
    case 'nav-records': return go('records');
    case 'cheaper': return doAsk('더 싼 걸로', { previous: view.result });
    case 'decide': return decide(t.dataset.d);
    case 'undo': return undo();
    case 'flip': return setFlip(!view.flipped);
    case 'prev': return jump(view.pos - 1);
    case 'restart': return jump(0);
    case 'jump': return jump(Number(t.dataset.i));
    case 'list': view.listOpen = !view.listOpen; render(); if (view.listOpen) $('#cand-list .li[aria-current="true"]')?.focus(); return;
    case 'list-close': view.listOpen = false; render(); $('[data-act="list"]')?.focus(); return;
    case 'own': act(() => M.setOwnership(currentId(), t.dataset.v)); return renderKeep();
    case 'open-add': return openAdd(t.dataset.kind || (view.screen === 'deck' ? M.judge(currentId())?.addSuggestion?.kind : null), view.screen === 'deck' ? 'card' : 'closet');
    case 'cancel-add': view.adding = null; return renderKeep();
    case 'save': return saveGarment();
    case 'trial': return loadTrial(view.screen === 'deck');
    case 'trial-clear': act(() => M.clearTrialCloset()); render(); return toast('체험용 옷을 뺐어요');
    case 'gender': act(() => M.setGender(t.dataset.g)); return render();
    case 'remove-garment': view.err = null; act(() => M.removeGarment(t.dataset.id)); return render();
    case 'step':
      if (t.dataset.needs) { view.returning = t.dataset.productId; return render(); }
      view.err = null; act(() => M.advance(t.dataset.productId, t.dataset.step)); view.returning = null; return render();
    case 'return-reason': view.err = null; act(() => M.advance(t.dataset.id, 'returned', { reason: t.dataset.reason })); view.returning = null; render(); return toast('반품했다고 기록했어요');
    case 'return-cancel': view.returning = null; return render();
    case 'redecide': act(() => M.decide(t.dataset.id, t.dataset.d)); return render();
    case 'remove-record': view.err = null; act(() => M.removeRecord(t.dataset.id)); return render();
    default:
  }
});
// 뒤집힌 상태를 유지한 채 다시 그린다(옵션 고르기 등).
function renderKeep() {
  const back = $('#top-card .back');
  const top = back ? back.scrollTop : 0;
  const y = window.scrollY;
  render();
  const nb = $('#top-card .back');
  if (nb) nb.scrollTop = top;
  window.scrollTo(0, y);
}

// 키보드: → 살래, ↑ 보류, ← 패스, 스페이스 뒤집기
document.addEventListener('keydown', (e) => {
  if (view.screen !== 'deck' || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'Escape') {
    if (view.listOpen) { view.listOpen = false; render(); return; }
    if (view.flipped) { setFlip(false); return; }
  }
  // 방향키·스페이스는 카드 자체에 포커스가 있을 때만(스크롤하거나 다른 버튼 위에서 누른 방향키로 기록되지 않게).
  const card = $('#top-card');
  if (!currentId() || view.adding || !card || e.target !== card) return;
  const map = { ArrowRight: 'buy', ArrowUp: 'hold', ArrowLeft: 'skip' };
  if (map[e.key] && !e.repeat) { e.preventDefault(); decide(map[e.key]); return; }
  if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); setFlip(!view.flipped); }
});

// 밀기(포인터). 버튼이 기본이고, 밀기는 보조다.
let drag = null;
document.addEventListener('pointerdown', (e) => {
  if (view.screen !== 'deck' || view.flipped || view.adding || !currentId()) return;
  const card = e.target.closest('#top-card');
  if (!card || !card.querySelector('.back') || e.target.closest('button, a, input')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, dy: 0, moved: false, card, hint: null };
});
document.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(drag.dx, drag.dy) < 10) return;
  if (!drag.moved && Math.abs(drag.dy) >= Math.abs(drag.dx)) { drag = null; return; } // 세로 움직임은 화면 스크롤로 둔다.
  if (!drag.moved) {
    drag.moved = true;
    try { drag.card.setPointerCapture(e.pointerId); } catch { /* 무시 */ }
    drag.hint = document.createElement('div');
    drag.hint.className = 'drag-hint';
    drag.hint.setAttribute('aria-hidden', 'true');
    drag.card.appendChild(drag.hint);
  }
  const dir = drag.dx > 130 ? 'buy' : drag.dx < -130 ? 'skip' : null;
  drag.card.style.transition = 'none';
  drag.card.style.transform = `translate(${drag.dx}px, 0) rotate(${drag.dx / 24}deg)`;
  drag.hint.textContent = dir ? DEC[dir] : '';
  drag.hint.className = `drag-hint stamp-hint s-${dir || 'skip'}`;
  drag.hint.style.color = dir === 'buy' ? '#0f5a36' : dir === 'hold' ? '#7a4f00' : '#3c3f45';
  drag.hint.style.opacity = dir ? '1' : String(Math.max(0, (Math.abs(drag.dx) - 60) / 140));
  if (!dir) { drag.hint.textContent = drag.dx > 0 ? DEC.buy : DEC.skip; drag.hint.style.color = drag.dx > 0 ? '#0f5a36' : '#3c3f45'; }
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const g = drag; drag = null;
  if (!g.moved) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 0);
  const d = Math.abs(g.dx) > 130 && Math.abs(g.dx) > 2 * Math.abs(g.dy) ? (g.dx > 0 ? 'buy' : 'skip') : null; // 위로 밀기 결정은 없다.
  const start = g.card.style.transform;
  g.hint?.remove();
  if (d && e.type === 'pointerup') { g.card.style.visibility = 'hidden'; decide(d, { start }); return; }
  g.card.style.transition = 'transform .2s ease';
  g.card.style.transform = '';
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

// 다른 탭에서 바뀌면 다시 그린다.
M.subscribe(() => { if (!quiet) render(); });

// ── 시작
(function boot() {
  const p = new URLSearchParams(location.search);
  const v = p.get('view');
  if (M.boot.q) {
    const r = M.ask(M.boot.q);
    view.result = r;
    view.deck = cardsOf(r).map((x) => x.id);
    view.screen = 'deck';
  } else if (v === 'closet' || v === 'records') view.screen = v;
  hist(false); // ?reset=1·?closet=trial은 주소에서 지워 새로 고침 때 다시 적용되지 않게 한다.
  render();
})();
})();
</script>
</body>
</html>
