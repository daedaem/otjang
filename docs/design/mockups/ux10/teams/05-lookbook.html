<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어울 시안 05 · 코디 먼저</title>
<meta name="description" content="결과를 '이렇게 입어요' 룩보드로 시작하는 어울 UX 시안(AI 역할 시안, 목업)">
<style>
  :root {
    --paper: #F5F0E6; --sheet: #FBF8F2; --cell: #ECE5D7; --cell-own: #FFFFFF;
    --ink: #1E1A15; --sub: #574F45; --line: #D3C8B6; --line-strong: #1E1A15;
    --accent: #8A3A22; --go: #2C5A37; --stop: #8A3A22; --info: #3D4F6B;
    --focus: #1F4FD1; --art-line: #3a3a3a;
    --serif: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", "Batang", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "WenQuanYi Zen Hei", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); word-break: keep-all; overflow-wrap: anywhere; }
  button, input, a { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  h1[tabindex="-1"]:focus, h1[tabindex="-1"]:focus-visible, main:focus-visible { outline: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  /* 목업 띠 */
  .mock { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 4px 16px; background: var(--ink); color: #F5F0E6; font-size: 12px; letter-spacing: .02em; }
  .mock .mock-text { flex: 1 1 140px; padding: 4px 0; }
  .mock a, .mock button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 40px; padding: 0 12px; border: 1px solid #8C8273; border-radius: 999px; background: transparent; color: #F5F0E6; text-decoration: none; font-size: 12px; }

  /* 머리 */
  .top { position: sticky; top: 0; z-index: 5; background: rgba(245, 240, 230, .96); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  .top-in { max-width: 1240px; margin: 0 auto; padding: 4px 16px; display: flex; align-items: center; gap: 8px; }
  .wordmark { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .04em; margin-right: auto; background: none; border: 0; padding: 0 4px; min-height: 44px; }
  .wordmark small { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--sub); letter-spacing: .14em; margin-left: 6px; }
  .nav { display: flex; gap: 4px; }
  .nav button { min-height: 44px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 14px; }
  .nav button[aria-current="page"] { border-bottom-color: var(--ink); font-weight: 700; }
  .nav .count { font-size: 12px; color: var(--sub); margin-left: 3px; }

  main { max-width: 1240px; margin: 0 auto; padding: 16px 16px 48px; }
  h1, h2, h3 { margin: 0; font-weight: 700; }
  .eyebrow { font-size: 12px; letter-spacing: .16em; color: var(--sub); font-weight: 600; }
  .display { font-family: var(--serif); font-weight: 700; letter-spacing: -.01em; }
  .muted { color: var(--sub); }
  .small { font-size: 13px; }
  .fine { font-size: 12px; color: var(--sub); line-height: 1.6; }
  hr.rule { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }

  /* 버튼 */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 1px solid var(--ink); border-radius: 2px; background: var(--sheet); color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.25; text-align: center; }
  .btn.solid { background: var(--ink); color: var(--sheet); }
  .btn.quiet { border-color: var(--line); background: transparent; }
  .btn.link { border: 0; background: none; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .btn.sm { min-height: 40px; font-size: 14px; padding: 0 12px; }

  /* 요청 */
  .ask { display: flex; gap: 8px; }
  .ask input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 2px; background: var(--sheet); font-size: 16px; }
  .ask input::placeholder { color: #776E62; }
  .ask button { min-width: 72px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--sheet); font-size: 14px; text-align: left; }
  .chip.static { background: transparent; }
  .chip .x { font-size: 16px; line-height: 1; color: var(--sub); }

  /* 첫 화면 */
  .home { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; padding-top: 12px; }
  .home > *, .chips > *, .page-h > *, .rec > * { min-width: 0; }
  .chip { max-width: 100%; }
  .home h1 { font-size: 32px; line-height: 1.25; }
  .home .lede { font-size: 16px; color: var(--sub); margin: 10px 0 0; }
  .home-plate { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; background: var(--sheet); border: 1px solid var(--line); }
  .home-plate span { aspect-ratio: 1; background: var(--cell); display: grid; place-items: center; padding: 16%; }
  .gender { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .gender button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font-size: 14px; }
  .gender button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }

  /* 결과 머리 */
  .res-head { display: grid; gap: 12px; margin-bottom: 18px; }
  .res-head h1 { font-size: 24px; line-height: 1.3; }
  .notice { margin: 0; padding: 10px 12px; border-left: 3px solid var(--ink); background: var(--sheet); font-size: 14px; }
  .notice.warn { border-left-color: var(--accent); }

  /* 배치 */
  .split { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); }
  .split > *, .boards, .boards > *, .res-head > * { min-width: 0; }
  .only-pc { display: none; }
  .pc-only-grid { display: none !important; }

  /* 룩보드 */
  .boards { display: grid; gap: 10px; }
  .board-bar { display: flex; align-items: center; gap: 8px; }
  .board-bar .where { flex: 1; min-width: 0; }
  .board-bar .where b { display: block; font-size: 12px; letter-spacing: .16em; color: var(--sub); font-weight: 600; }
  .board-bar .where span { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arrow { width: 44px; height: 44px; border: 1px solid var(--ink); border-radius: 50%; background: var(--sheet); font-size: 18px; display: grid; place-items: center; padding: 0; }
  .arrow[disabled] { opacity: .3; cursor: default; }
  .track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 0; }
  .track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; scroll-snap-align: start; padding: 0 1px; }
  .sheet { background: var(--sheet); border: 1px solid var(--line); padding: 10px; position: relative; }
  .sheet .look-no { display: block; text-align: right; margin-top: 6px; font-family: var(--serif); font-size: 12px; color: var(--sub); letter-spacing: .16em; line-height: 1.2; }
  .look { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: dense; gap: 6px; }
  .cell { position: relative; aspect-ratio: 1 / 1; display: flex; flex-direction: column; padding: 6px 7px; background: var(--cell); border: 1px solid transparent; border-radius: 0; text-align: left; min-width: 0; overflow: hidden; }
  button.cell:hover { border-color: var(--line); }
  .cell.own { background: var(--cell-own); border: 1px dashed #8C8273; }
  .cell.hero { grid-column: span 2; grid-row: span 2; border: 2px solid var(--line-strong); padding: 10px 12px; }
  .cell .ct { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 2px 4px; }
  .cell .role { font-size: 12px; letter-spacing: .08em; color: var(--sub); font-weight: 600; line-height: 1.5; }
  .cell .tag { font-size: 12px; line-height: 1.4; padding: 0 5px; border: 1px solid currentColor; border-radius: 2px; background: var(--sheet); }
  .cell .tag.hero-tag { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
  .cell .tag.own-tag { color: var(--go); }
  .cell .tag.trial-tag { color: var(--info); }
  .cell .pic { flex: 1; min-height: 0; display: grid; place-items: center; padding: 2px 8%; }
  .cell .pic svg { width: 100%; height: 100%; max-height: 100%; }
  .cell .cb { font-size: 12px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell.hero .role { font-size: 13px; letter-spacing: .16em; }
  .cell.hero .pic { padding: 4px 14%; }
  .cell.hero .cb { font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
  .cell.hero .swap-hint { font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .board-empty { display: flex; gap: 14px; align-items: center; }
  .board-empty .cell.hero { flex: 0 0 56%; max-width: 320px; }
  .board-empty .msg { flex: 1; min-width: 0; margin: 0; font-size: 14px; }
  .board-empty .msg b { display: block; font-family: var(--serif); font-size: 16px; margin-bottom: 4px; }

  .caption { display: grid; gap: 6px; padding: 2px 2px 0; }
  .caption .t { font-family: var(--serif); font-size: 16px; line-height: 1.35; }
  .caption .sum { font-size: 14px; }
  .caption .sum { color: var(--sub); }
  .hero-cap { margin: 0 0 4px; padding: 10px 12px; background: var(--sheet); border: 1px solid var(--line); border-left: 3px solid var(--ink); display: grid; gap: 2px; }
  .hero-cap .hc-name { font-size: 15px; line-height: 1.4; }
  .hero-cap .hc-price { font-size: 15px; }
  .hero-cap small { font-size: 12px; color: var(--sub); }

  /* 바꾸기 줄 */
  .swap { border: 1px solid var(--ink); background: var(--sheet); padding: 12px; display: grid; gap: 10px; }
  .swap-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .swap-row button { flex: 0 0 132px; display: grid; gap: 2px; padding: 8px; border: 1px solid var(--line); background: var(--paper); text-align: left; min-height: 44px; }
  .swap-row button[aria-current="true"] { border: 2px solid var(--ink); }
  .swap-row .pic { aspect-ratio: 1; background: var(--cell); display: grid; place-items: center; padding: 14%; }
  .swap-row .b { font-size: 12px; color: var(--sub); }
  .swap-row .n { font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .swap-row .p { font-size: 13px; font-weight: 700; }

  /* 판정 */
  .verdict-card { background: var(--sheet); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 16px; display: grid; gap: 12px; }
  .verdict-card.go { border-top-color: var(--go); }
  .verdict-card.stop { border-top-color: var(--stop); }
  .hero-line { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
  .hero-line .pic { aspect-ratio: 1; background: var(--cell); display: grid; place-items: center; padding: 12%; }
  .brand { font-size: 13px; color: var(--sub); letter-spacing: .04em; }
  .pname { font-size: 16px; line-height: 1.4; }
  .price { font-size: 16px; font-weight: 700; }
  .price small { font-size: 12px; font-weight: 400; color: var(--sub); margin-left: 6px; }
  .verdict-title { font-family: var(--serif); font-size: 21px; line-height: 1.35; }
  .verdict-card.go .verdict-title { color: var(--go); }
  .verdict-card.stop .verdict-title { color: var(--stop); }
  .lines { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; }
  .lines li { padding-left: 14px; position: relative; }
  .lines li::before { content: ''; position: absolute; left: 0; top: .72em; width: 6px; height: 1px; background: var(--ink); }
  .cautions { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .cautions li { padding: 8px 10px; background: #F6E7DF; border-left: 3px solid var(--accent); font-size: 14px; }
  .decide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .decide button { min-height: 48px; padding: 4px 6px; border: 1px solid var(--ink); background: var(--sheet); font-size: 15px; border-radius: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; line-height: 1.3; }
  .decide button.lean { border-width: 2px; font-weight: 700; }
  .decide .lean-tag { font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: .04em; }
  .decide button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
  .decide button[aria-pressed="true"] .lean-tag { color: var(--sheet); }
  .decide button[aria-pressed="true"] > span:first-child::after { content: ' ✓'; }
  .lean-note { font-size: 13px; color: var(--sub); margin: -4px 0 0; }
  .ownq { display: grid; gap: 8px; padding: 10px 12px; border: 1px dashed var(--line-strong); }
  .ownq .chips button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
  .record-line { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--paper); border: 1px solid var(--line); font-size: 14px; }
  .record-line b { margin-right: auto; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .compare { display: grid; gap: 10px; padding: 12px; background: var(--paper); border: 1px solid var(--line); }
  .compare p { margin: 0; font-size: 14px; }

  /* 가진 옷 넣기 */
  .adder { display: grid; gap: 12px; padding: 14px; border: 2px solid var(--ink); background: var(--sheet); }
  .adder h3 { font-size: 16px; }
  .adder .step { display: grid; gap: 8px; }
  .adder .step > b { font-size: 12px; letter-spacing: .14em; color: var(--sub); }
  .opt { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); font-size: 14px; }
  .opt[aria-pressed="true"] { border: 2px solid var(--ink); background: var(--sheet); font-weight: 700; }
  .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #8C8273; flex: none; }

  /* 목록 */
  .sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; margin: 4px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); }
  .sec-h h2 { font-family: var(--serif); font-size: 19px; }
  .sec-h h2 { white-space: nowrap; }
  .comp { list-style: none; margin: 0; padding: 0; }
  .comp li { border-bottom: 1px solid var(--line); }
  .comp .ci { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; width: 100%; min-height: 48px; padding: 8px 0; background: none; border: 0; text-align: left; }
  .comp .ci .role { font-size: 12px; letter-spacing: .12em; color: var(--sub); font-weight: 600; }
  .comp .ci .nm { font-size: 14px; line-height: 1.4; }
  .comp .ci .pr { font-size: 14px; font-weight: 700; text-align: right; white-space: nowrap; }
  .comp .ci .pr small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); }
  .comp .ci.is-hero .nm { font-weight: 700; }
  .cands { list-style: none; margin: 0; padding: 0; display: grid; }
  .cands li { border-bottom: 1px solid var(--line); }
  .cand { display: grid; grid-template-columns: 30px 72px 1fr; gap: 10px; align-items: start; width: 100%; padding: 12px 0; background: none; border: 0; text-align: left; min-height: 44px; }
  .cand .no { font-family: var(--serif); font-size: 15px; color: var(--sub); padding-top: 2px; }
  .cand .pic { aspect-ratio: 1; background: var(--cell); display: grid; place-items: center; padding: 14%; }
  .cand .pic svg { width: 100%; height: 100%; }
  .cand .nm { font-size: 15px; line-height: 1.4; display: block; }
  .cand .rs { font-size: 13px; color: var(--sub); display: block; margin-top: 2px; }
  .cand .pr { display: block; font-size: 15px; font-weight: 700; margin-top: 2px; }
  .cand .pr small { font-size: 12px; font-weight: 400; color: var(--sub); margin-left: 4px; }
  .cand .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .pill { font-size: 12px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--sheet); }
  .pill.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
  .pill.stop { color: var(--stop); border-color: currentColor; }
  .pill.new { color: var(--go); border-color: currentColor; }

  /* 상세 */
  .back { margin-bottom: 8px; }
  .detail-head { display: grid; gap: 4px; }
  .detail-head h1 { font-family: var(--serif); font-size: 22px; line-height: 1.35; font-weight: 700; }
  .detail-head .meta { font-size: 13px; color: var(--sub); }
  .why { margin: 0; padding-left: 18px; font-size: 15px; display: grid; gap: 4px; }
  .used { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); background: var(--sheet); }
  .used h3 { font-size: 16px; }
  .used .grp { display: grid; gap: 6px; }
  .used .grp b { font-size: 12px; letter-spacing: .14em; color: var(--sub); }
  .used a.chip { text-decoration: none; }
  .seller { width: 100%; }

  /* 옷장·기록 */
  .page-h { display: grid; gap: 6px; margin-bottom: 16px; }
  .page-h h1 { font-family: var(--serif); font-size: 26px; }
  .gl { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .gl li { background: var(--sheet); border: 1px solid var(--line); padding: 8px; display: grid; gap: 4px; }
  .gl .pic { aspect-ratio: 1; background: var(--cell); display: grid; place-items: center; padding: 16%; }
  .gl .nm { font-size: 14px; line-height: 1.35; }
  .rec { background: var(--sheet); border: 1px solid var(--line); padding: 12px; display: grid; grid-template-columns: 64px 1fr; gap: 12px; }
  .rec .pic { aspect-ratio: 1; background: var(--cell); display: grid; place-items: center; padding: 14%; }
  .rec-list { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
  .stage { font-size: 14px; font-weight: 700; }
  .steps { display: flex; gap: 0; margin: 6px 0; padding: 0; list-style: none; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
  .steps li { padding: 2px 8px 2px 0; }
  .steps li.done { color: var(--ink); font-weight: 700; }
  .steps li + li::before { content: '— '; color: var(--line-strong); }
  .status { position: sticky; bottom: 12px; z-index: 4; margin: 12px auto 0; max-width: 560px; padding: 10px 14px; background: var(--ink); color: var(--sheet); font-size: 14px; border-radius: 2px; }
  .status:empty { display: none; }
  footer.notes { max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; border-top: 1px solid var(--line); display: grid; gap: 4px; }

  @media (min-width: 1000px) {
    main { padding: 24px 32px 64px; }
    .top-in { padding: 4px 32px; }
    .mock { padding: 4px 32px; }
    footer.notes { padding: 18px 32px 40px; }
    .only-m { display: none !important; }
    .only-pc { display: block; }
    .pc-only-grid { display: grid !important; }
    .home { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: center; padding-top: 40px; gap: 56px; }
    .home h1 { font-size: 44px; }
    .split { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 40px; align-items: start; }
    .split > .left { position: sticky; top: 68px; }
    .split.detail { grid-template-areas: "left top" "left rest"; }
    .split.detail > .left { grid-area: left; grid-row: 1 / span 2; }
    .split.detail > .d-top { grid-area: top; }
    .split.detail > .d-rest { grid-area: rest; }
    .look { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .sheet { padding: 14px; }
    .res-head h1 { font-size: 28px; }
    .res-head { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .track { scroll-behavior: smooth; }
  }
</style>
</head>
<body>
<div class="mock" data-flow="mock-label">
  <span class="mock-text">목업 · 시안 05 코디 먼저 · AI 역할 시안</span>
  <a href="../index.html">갤러리로</a>
  <button type="button" data-flow="reset">처음부터</button>
</div>
<header class="top">
  <div class="top-in">
    <button type="button" class="wordmark" data-act="home" aria-label="어울 첫 화면">어울<small>LOOKBOOK</small></button>
    <nav class="nav" aria-label="화면" id="nav"></nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div class="status" id="status" role="status" aria-live="polite"></div>
<footer class="notes" id="notes"></footer>
<script src="../shared/eoul-mock.js"></script>
<script>
(function () {
  'use strict';
  const M = window.EoulMock;
  const app = document.getElementById('app');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KIND_BY_NAME = new Map();
  ['M', 'F'].forEach((g) => M.kindChoices(g).forEach((k) => KIND_BY_NAME.set(k.name, k.id)));
  const pad2 = (n) => String(n).padStart(2, '0');
  // 체험용 옷 이름에는 이미 색이 들어 있어서 색을 한 번만 쓴다.
  const gName = (g) => (g.trial || !g.colorLabel || String(g.label).includes(g.colorLabel) ? g.label : `${g.colorLabel} ${g.label}`);
  const art = (t) => M.art(t);
  const pieceArt = (p) => M.art({ slot: p.slot, kind: KIND_BY_NAME.get(p.kindName), colorHex: p.colorHex, color: p.color });

  // ── 상태: 화면(history에 들어감)과 잠깐 쓰는 표시(ui)
  let view = { name: 'home' };
  const freshUi = () => ({ adding: null, swapOpen: false, returnPick: null });
  let ui = freshUi();
  let statusText = '';

  function urlFor(name) { return location.href.split('#')[0] + '#' + name; }
  function go(next, { replace = false, focus = true } = {}) {
    view = JSON.parse(JSON.stringify(next));
    ui = freshUi();
    try { history[replace ? 'replaceState' : 'pushState'](view, '', urlFor(view.name)); } catch (e) { /* file:// 제한 */ }
    render({ toTop: true, focus });
  }
  function patch(p) {
    view = { ...view, ...p };
    try { history.replaceState(view, '', urlFor(view.name)); } catch (e) { /* 무시 */ }
  }
  function say(text) { statusText = text; const el = document.getElementById('status'); el.textContent = text; clearTimeout(say.t); say.t = setTimeout(() => { el.textContent = ''; }, 6000); }

  // ── 결과 계산
  const resultsOf = (v) => M.ask(v.said, { drop: v.drop || [], previous: v.prev || null });
  const listOf = (r) => (r.products.length ? r.products : r.offOccasion);
  function heroOfAsk(r) {
    const list = listOf(r);
    if (!r.outfit || !list.length) return null;
    const ids = new Set([...r.products, ...r.offOccasion].map((p) => p.id));
    const kn = list[0].kindName;
    const piece = r.outfit.pieces.find((p) => p.product && ids.has(p.product.id) && p.kindName === kn)
      || r.outfit.pieces.find((p) => p.product && p.kindName === kn);
    return piece ? piece.product.id : null;
  }
  function productBoard(id, criteria, label) {
    const d = M.product(id, { criteria });
    return { outfit: d.outfit, note: d.outfitNote, heroId: id, label, src: 'product', hero: d };
  }
  function resultBoards(r, swaps = {}) {
    const list = listOf(r);
    if (!list.length) return [];
    const boards = [];
    const askHero = heroOfAsk(r);
    const nameOf = (id) => { const p = [...r.products, ...r.offOccasion].find((x) => x.id === id); return p ? `${p.brand} ${p.kindName}` : '후보'; };
    if (r.outfit && askHero === list[0].id) boards.push({ outfit: r.outfit, note: r.outfitNote, heroId: askHero, label: `요청 그대로 맞춘 코디 · 주인공 ${nameOf(askHero)}`, src: 'ask' });
    else boards.push(productBoard(list[0].id, r.criteria, `1번 후보가 주인공 · ${nameOf(list[0].id)}`));
    if (r.outfit && askHero && askHero !== list[0].id) boards.push({ outfit: r.outfit, note: r.outfitNote, heroId: askHero, label: `요청 그대로 맞춘 코디 · 주인공 ${nameOf(askHero)}`, src: 'ask' });
    list.slice(1).forEach((p) => {
      if (boards.length >= 3 || boards.some((b) => b.heroId === p.id)) return;
      boards.push(productBoard(p.id, r.criteria, `${list.indexOf(p) + 1}번 후보가 주인공 · ${p.brand} ${p.kindName}`));
    });
    Object.entries(swaps).forEach(([i, id]) => {
      if (!boards[i]) return;
      const d = M.product(id, { criteria: r.criteria });
      boards[i] = { outfit: d.outfit, note: d.outfitNote, heroId: id, label: `바꾼 주인공 · ${d.brand} ${d.kindName}`, src: 'product', swapped: true, hero: d };
    });
    return boards;
  }
  const pieceSig = (o) => (o ? o.pieces.map((p) => `${p.role}:${p.owned ? 'o' : ''}${p.product?.id || p.label}`).join('|') : '');
  function detailBoards(d) {
    const boards = [{ outfit: d.outfit, note: d.outfitNote, heroId: d.id, label: '이 옷이 주인공인 코디', src: 'product' }];
    const seen = new Set([pieceSig(d.outfit)]);
    (d.verdict.looks || []).forEach((l) => {
      if (boards.length >= 3 || seen.has(pieceSig(l))) return;
      seen.add(pieceSig(l));
      boards.push({ outfit: l, note: null, heroId: d.id, label: l.new ? '내 옷과 새로 생기는 코디' : '내 옷과 이미 되는 코디', src: 'look' });
    });
    return boards;
  }

  // ── 조각: 룩보드
  function cellHTML(p, b, i) {
    const isHero = !!p.product && p.product.id === b.heroId;
    const tag = isHero ? '<span class="tag hero-tag">주인공</span>'
      : p.owned ? (p.trial ? '<span class="tag trial-tag">체험용</span>' : '<span class="tag own-tag">내 옷</span>')
      : p.uncertain ? '<span class="tag">확인 필요</span>' : '';
    const body = `<span class="ct"><span class="role">${esc(p.roleLabel)}</span>${tag}</span>
      <span class="pic" aria-hidden="true">${pieceArt(p)}</span>`;
    if (isHero) {
      return `<button type="button" class="cell hero" data-act="swap" data-i="${i}" aria-expanded="${ui.swapOpen ? 'true' : 'false'}"
        aria-label="주인공 ${esc(p.kindName)} · ${esc(p.colorLabel)} · ${esc(p.label)}. 같은 조건의 다른 ${esc(p.kindName)}로 바꿔 보기">${body}
        <span class="cb"><span>${esc(p.kindName)} · ${esc(p.colorLabel)}</span><span class="swap-hint" aria-hidden="true">⇄ 바꿔 보기</span></span></button>`;
    }
    if (p.owned) {
      return `<div class="cell own" role="img" aria-label="${esc(p.roleLabel)}: ${p.trial ? '체험용' : '내 옷'} ${esc(gName(p))}">${body}<span class="cb">${esc(p.kindName)}</span></div>`;
    }
    if (p.product) {
      return `<button type="button" class="cell" data-act="open" data-id="${esc(p.product.id)}" data-strict="0"
        aria-label="${esc(p.roleLabel)}: ${esc(p.colorLabel)} ${esc(p.label)} ${esc(p.product.priceText)} · 자세히">${body}<span class="cb">${esc(p.kindName)}</span></button>`;
    }
    return `<div class="cell" role="img" aria-label="${esc(p.roleLabel)}: ${esc(p.label)}">${body}<span class="cb">${esc(p.kindName)}</span></div>`;
  }
  function boardHTML(b, i, n, heroCard, cur) {
    let inner;
    if (b.outfit) {
      inner = `<div class="look">${b.outfit.pieces.map((p) => cellHTML(p, b, i)).join('')}</div>`;
    } else {
      const h = heroCard;
      inner = `<div class="board-empty">
        <button type="button" class="cell hero" data-act="swap" data-i="${i}" aria-expanded="${ui.swapOpen ? 'true' : 'false'}" aria-label="주인공 ${esc(h.kindName)} ${esc(h.brand)} ${esc(h.name)}. 같은 조건의 다른 ${esc(h.kindName)}로 바꿔 보기">
          <span class="ct"><span class="role">${esc(h.kindName)}</span><span class="tag hero-tag">주인공</span></span>
          <span class="pic" aria-hidden="true">${art(h)}</span>
          <span class="cb"><span>${esc(h.kindName)} · ${esc(h.colorLabel)}</span><span class="swap-hint" aria-hidden="true">⇄</span></span></button>
        <p class="msg"><b>이 조건으로 만든 코디가 없어요</b>${esc(b.note || '이 상품으로 만들 수 있는 코디 공식이 없어요.')}</p></div>`;
    }
    return `<div class="slide" ${i === cur ? '' : 'inert'} role="group" aria-roledescription="코디 보드" aria-label="코디 ${i + 1} / ${n}"><div class="sheet">${inner}<span class="look-no" aria-hidden="true">LOOK ${pad2(i + 1)}</span></div></div>`;
  }
  function boardsHTML(boards, idx, heroCards) {
    const n = boards.length;
    const b = boards[idx];
    return `<section class="boards" aria-label="이렇게 입어요 · 코디 보드">
      <div class="board-bar">
        <button type="button" class="arrow" data-act="prev" aria-label="이전 코디" ${idx <= 0 ? 'disabled' : ''}>←</button>
        <p class="where" style="margin:0"><b>이렇게 입어요 · ${pad2(idx + 1)} / ${pad2(n)}</b><span>${esc(b.label)}</span></p>
        <button type="button" class="arrow" data-act="next" aria-label="다음 코디" ${idx >= n - 1 ? 'disabled' : ''}>→</button>
      </div>
      <div class="track" id="track">${boards.map((x, i) => boardHTML(x, i, n, heroCards[i], idx)).join('')}</div>
      ${n > 1 ? `<p class="fine only-m" style="margin:0">옆으로 넘기면 다른 후보가 주인공인 코디 ${n - 1}개가 더 있어요.</p>` : ''}
    </section>`;
  }
  function captionHTML(b, hero, hasBudget) {
    const heroLine = hero ? `<p class="hero-cap"><span class="eyebrow">주인공</span>
      <span class="hc-name"><b>${esc(hero.brand)}</b> ${esc(hero.name)}</span>
      <span class="hc-price"><b>${esc(hero.priceText)}</b> <small>${esc(hero.priceNote)}</small></span></p>` : '';
    if (!b.outfit) return `<div class="caption">${heroLine}<p class="fine" style="margin:0">조건을 풀어서 코디를 만들지 않았어요. 위 조건 칩을 직접 빼면 다시 찾을 수 있어요.</p></div>`;
    const o = b.outfit;
    const others = o.pieces.filter((p) => !p.owned && p.product && p.product.id !== b.heroId);
    const own = o.pieces.filter((p) => p.owned);
    const trialN = own.filter((p) => p.trial).length, mineN = own.length - trialN;
    const ownText = [mineN ? `내 옷 ${mineN}벌` : '', trialN ? `체험용 옷 ${trialN}벌` : ''].filter(Boolean).join(' · ');
    const onlyOwnedRest = own.length && o.pieces.every((p) => p.owned || (p.product && p.product.id === b.heroId));
    const sum = others.reduce((t, p) => t + (p.product.price || 0), 0);
    const budgetNoted = (b.note || '').includes('예산') || (o.note || '').includes('예산');
    const rows = [];
    if (others.length) rows.push(`함께 고른 후보 ${others.length}벌(이 상품 제외) · 수집가 합계 ${esc(M.formatPrice(sum))}${hasBudget && !budgetNoted ? ' · 예산은 한 벌 기준' : ''}`);
    if (onlyOwnedRest) rows.push(`이 조합의 다른 옷은 모두 가진 옷이에요(${ownText})`);
    else if (own.length) rows.push(`이 조합에 들어간 가진 옷: ${ownText}`);
    return `<div class="caption">
      ${heroLine}
      <p class="t" style="margin:0">코디 · ${esc(o.formula || o.title)}</p>
      ${rows.map((x) => `<p class="sum" style="margin:0">${x}</p>`).join('')}
      <p class="fine" style="margin:0">${esc(o.note)}${b.note ? ' ' + esc(b.note) : ''}</p>
    </div>`;
  }
  function compHTML(b, title) {
    if (!b.outfit) return '';
    const rows = b.outfit.pieces.map((p) => {
      const isHero = p.product && p.product.id === b.heroId;
      const inner = `<span class="role">${esc(p.roleLabel)}</span>
        <span class="nm">${p.owned ? `<span class="pill">${p.trial ? '체험용' : '내 옷'}</span> ${esc(gName(p))}` : `${esc(p.label)}${isHero ? ' <span class="pill on">주인공</span>' : ''}`}</span>
        <span class="pr">${p.product ? `${esc(p.product.priceText)}<small>수집가</small>` : ''}</span>`;
      if (p.product && !isHero) return `<li><button type="button" class="ci" data-act="open" data-id="${esc(p.product.id)}" data-strict="0" aria-label="${esc(p.roleLabel)} ${esc(p.label)} ${esc(p.product.priceText)} 자세히">${inner}</button></li>`;
      return `<li><div class="ci${isHero ? ' is-hero' : ''}">${inner}</div></li>`;
    }).join('');
    return `<section aria-label="${esc(title)}"><div class="sec-h"><h2>${esc(title)}</h2><span class="fine">칸·줄을 누르면 그 옷 자세히</span></div><ul class="comp">${rows}</ul></section>`;
  }
  function swapHTML(d, current) {
    const alts = d.alternatives || [];
    return `<section class="swap" aria-label="주인공 바꾸기">
      <div class="sec-h" style="margin:0;border:0;padding:0"><h2 style="font-size:16px">같은 조건의 다른 ${esc(d.kindName)} ${alts.length}개</h2>
      <button type="button" class="btn sm quiet" data-act="swap-close">닫기</button></div>
      ${alts.length ? `<div class="swap-row">${alts.map((a) => `<button type="button" data-act="swap-to" data-id="${esc(a.id)}" aria-current="${a.id === current ? 'true' : 'false'}" aria-label="${esc(a.brand)} ${esc(a.name)} ${esc(a.priceText)}로 주인공 바꾸기">
        <span class="pic" aria-hidden="true">${art(a)}</span><span class="b">${esc(a.brand)}</span><span class="n">${esc(a.name)}</span><span class="p">${esc(a.priceText)}</span></button>`).join('')}</div>`
        : '<p class="small" style="margin:0">같은 조건에 맞는 다른 상품이 없어요. 조건을 넓히지 않았어요.</p>'}
      ${d.alternativesNote ? `<p class="fine" style="margin:0">${esc(d.alternativesNote)}</p>` : ''}
      <p class="fine" style="margin:0">가격은 수집일 가격이에요.</p>
    </section>`;
  }

  // ── 조각: 판정
  const DECIDE = [['buy', '사기로 함'], ['hold', '보류'], ['skip', '안 살래']];
  function decideHTML(d) {
    const v = d.verdict;
    const cur = v.record?.decision || null;
    return `<div class="decide" role="group" aria-label="구매 판단">${DECIDE.map(([k, label]) =>
      `<button type="button" data-flow="decide-${k}" data-product-id="${esc(d.id)}" class="${v.lean === k ? 'lean' : ''}" aria-pressed="${cur === k ? 'true' : 'false'}"><span>${label}</span>${v.lean === k ? '<span class="lean-tag">판정 쪽</span>' : ''}</button>`).join('')}</div>
      ${v.lean ? `<p class="lean-note">‘판정 쪽’은 판정이 기우는 방향이에요. 고르는 건 직접 해요.</p>` : ''}`;
  }
  function recordLineHTML(d) {
    const rec = d.verdict.record;
    if (!rec) return '';
    return `<div class="record-line" data-flow="record" data-product-id="${esc(d.id)}"><b>기록 · ${esc(rec.stageLabel)}</b>
      ${rec.next.map((n) => `<button type="button" class="btn sm" data-flow="record-step" data-step="${n.step}" data-product-id="${esc(d.id)}">${esc(n.label)}</button>`).join('')}
      ${returnPickHTML(d.id)}</div>`;
  }
  function returnPickHTML(id) {
    if (ui.returnPick !== id) return '';
    return `<div class="chips" role="group" aria-label="반품 사유" style="flex-basis:100%"><span class="small" style="align-self:center">반품 사유:</span>${M.returnReasons.map((r) =>
      `<button type="button" class="chip" data-act="return-reason" data-reason="${r.id}" data-product-id="${esc(id)}">${esc(r.label)}</button>`).join('')}
      <button type="button" class="chip static" data-act="return-cancel">취소</button></div>`;
  }
  function ownAskHTML(d) {
    const a = d.verdict.ask;
    if (!a) return '';
    return `<div class="ownq"><b class="small">${esc(a.question)}</b><div class="chips" role="group" aria-label="${esc(a.question)}">${a.choices.map((c) =>
      `<button type="button" class="chip" data-act="own" data-v="${c.id}" data-product-id="${esc(d.id)}" aria-pressed="${a.value === c.id ? 'true' : 'false'}">${esc(c.label)}</button>`).join('')}</div>
      ${a.hint ? `<p class="fine" style="margin:0">${esc(a.hint)}</p>` : ''}</div>`;
  }
  function compareHTML(d) {
    const v = d.verdict;
    if (ui.adding && ui.adding.forId === d.id) return adderHTML();
    if (v.basis !== 'none') return '';
    const s = v.addSuggestion;
    const st = M.getState();
    return `<div class="compare">
      <p><b>가진 옷과 비교해 볼까요?</b> 옷장 없이도 결정할 수 있어요. 종류·색만 넣으면 이 자리에서 판정과 코디가 바뀌어요.</p>
      <div class="row-actions">
        <button type="button" class="btn solid" data-flow="closet-add" data-kind="${esc(s.kind)}" data-product-id="${esc(d.id)}">가진 ${esc(s.kindName)} 넣고 비교</button>
        <button type="button" class="btn" data-act="add-other" data-product-id="${esc(d.id)}">다른 종류 넣기</button>
        ${st.trialCount ? '' : `<button type="button" class="btn quiet" data-flow="trial-closet" data-product-id="${esc(d.id)}">체험용 옷 넣어 보기 <span class="pill">체험용</span></button>`}
      </div>
      <p class="fine">체험용 옷은 예시 옷장이에요. 넣으면 보드와 옷장에 ‘체험용’으로 표시돼요.</p>
    </div>`;
  }
  function adderHTML() {
    const a = ui.adding;
    const kinds = M.kindChoices();
    const slots = a.kind ? M.slotChoices(a.kind) : [];
    const kindName = kinds.find((k) => k.id === a.kind)?.name || '';
    return `<section class="adder" aria-label="가진 옷 넣기">
      <h3>가진 옷 한 벌 넣기 <span class="fine">사진 없이 종류·색만</span></h3>
      <div class="step"><b>1 · 종류</b><div class="chips" role="group" aria-label="종류">${kinds.map((k) =>
        `<button type="button" class="opt" data-flow="kind-option" data-kind="${k.id}" aria-pressed="${a.kind === k.id}">${esc(k.name)}</button>`).join('')}</div></div>
      ${a.kind ? `<div class="step"><b>2 · 색</b><div class="chips" role="group" aria-label="색">${M.colorChoices().map((c) =>
        `<button type="button" class="opt" data-flow="color-option" data-color="${c.id}" aria-pressed="${a.color === c.id}"><span class="sw" style="background:${c.hex}" aria-hidden="true"></span>${esc(c.label)}</button>`).join('')}</div></div>` : ''}
      ${a.kind && slots.length ? `<div class="step"><b>3 · 세부 종류 (몰라도 돼요)</b><div class="chips" role="group" aria-label="세부 종류">${slots.map((s) =>
        `<button type="button" class="opt" data-flow="slot-option" data-slot="${s.id}" aria-pressed="${a.slot === s.id}">${esc(s.name)}</button>`).join('')}</div></div>` : ''}
      <div class="row-actions">
        <button type="button" class="btn solid" data-flow="closet-save" ${a.kind && a.color ? '' : 'disabled'}>${a.kind && a.color ? `${esc(M.colorChoices().find((c) => c.id === a.color)?.label || '')} ${esc(kindName)} 넣기` : '종류와 색을 고르면 넣을 수 있어요'}</button>
        <button type="button" class="btn quiet" data-act="add-cancel">취소</button>
      </div>
      <p class="fine" style="margin:0">넣은 옷은 이 브라우저에만 저장돼요. ‘내 옷’ 화면에서 뺄 수 있어요.</p>
    </section>`;
  }
  function verdictHTML(d, { compact }) {
    const v = d.verdict;
    const tone = v.tone === 'go' ? 'go' : v.tone === 'stop' ? 'stop' : '';
    return `<section class="verdict-card ${tone}" aria-label="판정">
      ${compact ? `<div class="hero-line pc-only-grid"><span class="pic" aria-hidden="true">${art(d)}</span><div>
        <div class="brand">${esc(d.brand)} · ${esc(d.slotName)}</div><div class="pname">${esc(d.name)}</div>
        <div class="price">${esc(d.priceText)}<small>${esc(d.priceNote)}</small></div></div></div>` : ''}
      <div><p class="eyebrow" style="margin:0 0 4px">${esc(v.basisLabel)}</p>
        <h2 class="verdict-title"><span data-flow="verdict">${esc(v.title)}</span></h2></div>
      ${v.lines.length ? `<ul class="lines">${v.lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
      ${!compact && v.reasons?.length ? `<ul class="lines">${v.reasons.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
      ${v.cautions.length ? `<ul class="cautions">${v.cautions.map((l) => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
      ${!compact && v.owned?.length ? `<div><p class="eyebrow" style="margin:0 0 4px">비교한 내 옷</p><ul class="lines">${v.owned.map((g) => `<li>${esc(gName(g))} · ${esc(g.relationLabel)}${g.trial ? ' (체험용)' : ''}</li>`).join('')}</ul></div>` : ''}

  // ── 화면: 결과
  function askBar(r) {
    return `<form class="ask" id="ask-form" role="search">
      <label class="sr" for="q">다시 찾거나 이어서 묻기</label>
      <input id="q" name="q" data-flow="ask-input" autocomplete="off" value="${esc(r?.said || '')}" placeholder="예: 출근용 셔츠 10만원 이하" enterkeyhint="search">
      <button type="submit" class="btn solid" data-flow="ask-submit">찾기</button>
    </form>`;
  }
  function resultsHTML() {
    const r = resultsOf(view);
    const list = listOf(r);
    const head = `<div class="res-head">
      ${askBar(r)}
      <div><p class="eyebrow" style="margin:0 0 4px">‘${esc(r.said)}’</p><h1 class="display" id="screen-h" tabindex="-1">${esc(r.title)}</h1></div>
      ${r.conditions.length ? `<div class="chips" aria-label="읽은 조건">${r.conditions.map((c) => c.removable
        ? `<button type="button" class="chip" data-flow="condition-remove" data-key="${esc(c.key)}" aria-label="${esc(c.label)} 조건 빼고 다시 찾기">${esc(c.label)} <span class="x" aria-hidden="true">×</span></button>`
        : `<span class="chip static">${esc(c.label)} <span class="fine">고정</span></span>`).join('')}</div>` : ''}
      ${r.notices.map((n) => `<p class="notice ${/empty|unavailable|not-understood|error|missing/.test(n.kind) ? 'warn' : ''}">${esc(n.text)}</p>`).join('')}
    </div>`;
    if (!list.length) {
      return `${head}<section aria-label="다시 묻기"><div class="sec-h"><h2>이렇게 다시 물어볼 수 있어요</h2></div>
        <div class="chips">${(r.examples || M.examples()).map((q) => `<button type="button" class="chip" data-flow="example" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
        <p class="fine">상품도 코디 보드도 만들지 않았어요. 조건을 몰래 넓히지 않아요.</p></section>`;
    }
    const boards = resultBoards(r, view.swaps || {});
    const idx = Math.min(Math.max(view.boardIndex || 0, 0), boards.length - 1);
    if (idx !== view.boardIndex) patch({ boardIndex: idx });
    const heroCards = boards.map((b) => b.hero || M.product(b.heroId, { criteria: r.criteria }));
    const b = boards[idx];
    const d = heroCards[idx];
    const others = r.offOccasion.length && r.products.length;
    const candRow = (p, n) => `<li><button type="button" class="cand" data-flow="result" data-product-id="${esc(p.id)}">
        <span class="no">${pad2(n)}</span><span class="pic" aria-hidden="true">${art(p)}</span>
        <span><span class="brand">${esc(p.brand)} · ${esc(p.colorLabel)}</span><span class="nm">${esc(p.name)}</span>
        <span class="pr">${esc(p.priceText)}<small>${esc(p.priceNote)}</small></span>
        <span class="rs">${esc(p.reason)}</span>
        <span class="tags">${p.id === b.heroId ? '<span class="pill on">지금 보드 주인공</span>' : ''}${p.owned.text ? `<span class="pill ${p.owned.tone === 'stop' ? 'stop' : p.owned.tone === 'new' ? 'new' : ''}">${esc(p.owned.label)}</span>` : ''}${p.record ? `<span class="pill">${esc(p.record.stageLabel)}</span>` : ''}</span>${p.owned.text ? `<span class="rs">${esc(p.owned.text)}</span>` : ''}</span>
      </button></li>`;
    const compTitle = '이 보드의 옷';
    return `${head}
      <div class="split">
        <div class="left">
          ${boardsHTML(boards, idx, heroCards)}
          ${ui.swapOpen ? swapHTML(d, b.heroId) : ''}
          ${captionHTML(b, d, r.criteria && r.criteria.maxPrice != null)}
          <div class="only-pc" style="margin-top:18px">${compHTML(b, compTitle)}</div>
        </div>
        <div class="right" style="display:grid;gap:22px">
          ${verdictHTML(d, { compact: true })}
          <div class="only-m">${compHTML(b, compTitle)}</div>
          <section aria-label="이 조합의 후보들">
            <div class="sec-h"><h2>이 조합의 후보들 ${r.products.length || list.length}</h2><span class="fine">${esc(r.listNote)}</span></div>
            <ul class="cands">${list.slice(0, ui.moreCands ? list.length : 5).map((p, n) => candRow(p, n + 1)).join('')}</ul>
            ${list.length > 5 ? `<button type="button" class="btn quiet" style="width:100%;margin-top:10px" data-act="more-cands" aria-expanded="${ui.moreCands ? 'true' : 'false'}">${ui.moreCands ? '5개만 보기' : `나머지 ${list.length - 5}개 더 보기`}</button>` : ''}
            <p class="fine">누르면 그 옷이 주인공인 코디와 판정을 봐요.</p>
          </section>
          ${others ? `<section aria-label="${esc(r.offOccasionTitle)}">
            <button type="button" class="btn quiet" style="width:100%" data-act="show-off" aria-expanded="${ui.showOff ? 'true' : 'false'}">${esc(r.offOccasionTitle)} ${ui.showOff ? '접기' : '보기'}</button>
            ${ui.showOff ? `<ul class="cands">${r.offOccasion.map((p, n) => candRow(p, n + 1)).join('')}</ul>` : ''}</section>` : ''}
          <section aria-label="이어서 묻기" style="display:grid;gap:8px">
            <div class="sec-h"><h2 style="font-size:16px">이어서 묻기</h2></div>
            <div class="chips"><button type="button" class="chip" data-act="cheaper">더 싼 걸로</button></div>
            <p class="fine" style="margin:0">지금 조건을 그대로 두고 수집가가 낮은 순서로 다시 찾아요.</p>
          </section>
        </div>
      </div>`;
  }

        </div>

          <div class="only-pc" style="margin-top:18px">${compHTML(b, '이 보드의 옷')}</div>
        </div>
        <div class="d-rest" style="display:grid;gap:20px">
          <div class="only-m">${compHTML(b, '이 보드의 옷')}</div>
          <section aria-label="이유"><div class="sec-h"><h2>왜 이 옷인가요</h2></div>

            <button type="button" class="btn" data-act="swap" data-i="${idx}" aria-expanded="${ui.swapOpen ? 'true' : 'false'}" ${d.alternatives.length ? '' : 'disabled'}>다른 ${esc(d.kindName)} 넘겨 보기</button>
          </section>
          ${used ? `<section class="used" aria-label="중고로도 찾아보기">
            <h3>중고로도 찾아보기 <span class="pill">검색 링크만 · 앱 안 매물은 연동 전</span></h3>
            <p class="small" style="margin:0">${esc(used.note)}</p>

              `<a class="chip" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}에서 검색${l.note ? ` <span class="fine">${esc(l.note)}</span>` : ''} <span aria-hidden="true">↗</span><span class="sr">(새 창)</span></a>`).join('')}</div></div>`).join('')}</div>
            <p class="fine" style="margin:0">${esc(used.abroadNote)}</p>
          </section>` : ''}
        </div>

  // ── 화면: 내 옷
  function closetHTML() {
    const st = M.getState();
    const groups = [['체험용', '체험용 옷'], ['내 옷', '내가 넣은 옷'], ['기록에서 산 옷', '기록에서 받은 옷']];

      return `<section style="margin-top:18px"><div class="sec-h"><h2>${esc(title)} ${rows.length}</h2>${key === '체험용' ? '<button type="button" class="btn sm quiet" data-act="clear-trial">체험용 모두 빼기</button>' : ''}</div>
        <ul class="gl">${rows.map((g) => `<li><span class="pic" aria-hidden="true">${art(g)}</span>
          <span class="pill" style="justify-self:start">${esc(g.sourceLabel)}</span>
          <span class="nm">${esc(gName(g))}</span>
          <span class="fine">${esc(g.kindName)}${g.slotName ? ' · ' + esc(g.slotName) : ''}${g.detailMissing ? ' · ' + esc(g.detailMissing) : ''}</span>
          ${g.bought ? '<span class="fine">구매 기록과 연결된 옷이에요. 기록에서 반품으로 정리해요.</span>' : `<button type="button" class="btn sm quiet" data-act="remove-garment" data-gid="${esc(g.id)}" aria-label="${esc(gName(g))} 빼기">빼기</button>`}

      ${ui.adding ? adderHTML() : `<div class="row-actions">
        <button type="button" class="btn solid" data-flow="closet-add">옷 한 벌 넣기</button>

  // ── 화면: 기록
  function recordsHTML() {
    const st = M.getState();
    const STEPS = [['candidate', '결정'], ['ordered', '주문'], ['received', '받음'], ['kept', '계속 입음']];

    const rows = st.records.map((r) => {
      const p = r.product;
      const at = order[r.stage];
      return `<li class="rec" data-flow="record" data-product-id="${esc(r.productId)}">
        <span class="pic" aria-hidden="true">${p ? art(p) : ''}</span>
        <div style="display:grid;gap:4px;min-width:0">
          <div class="brand">${esc(p?.brand || '')}</div>
          <div class="pname">${esc(p?.name || '상품')}</div>
          <div class="small">${esc(p?.priceText || '')} <span class="fine">수집가</span></div>
          <div class="stage">${esc(r.stageLabel)}${r.returnReasonLabel ? ` · 사유 ${esc(r.returnReasonLabel)}` : ''}${r.wearCount ? ` · ${r.wearCount}번 입음` : ''}</div>
          <ol class="steps" aria-label="진행">${STEPS.map(([k, l], i) => `<li class="${i <= at && !(r.stage === 'returned' && i === 3) ? 'done' : ''}">${l}</li>`).join('')}${r.stage === 'returned' ? '<li class="done">반품</li>' : ''}</ol>
          <div class="row-actions">
            ${r.next.map((n) => `<button type="button" class="btn sm${n.step === 'returned' ? ' quiet' : ''}" data-flow="record-step" data-step="${n.step}" data-product-id="${esc(r.productId)}">${esc(n.label)}</button>`).join('')}
            <button type="button" class="btn sm quiet" data-act="open" data-id="${esc(r.productId)}" data-strict="0">판정·코디 보기</button>
            ${r.stage === 'candidate' ? `<button type="button" class="btn sm link" data-act="unrecord" data-product-id="${esc(r.productId)}">기록 지우기</button>` : ''}

  }

  // ── 그리기
  function navHTML() {
    const st = M.getState();
    const cur = view.name === 'closet' ? 'closet' : view.name === 'records' ? 'records' : 'ask';
    return [['ask', '묻기', ''], ['closet', '내 옷', st.closetCount], ['records', '기록', st.records.length]].map(([k, l, c]) =>
      `<button type="button" data-flow="nav-${k}" ${cur === k ? 'aria-current="page"' : ''}>${l}${c !== '' ? `<span class="count">${c}</span>` : ''}</button>`).join('');
  }
  function notesHTML() {
    return `<p class="fine" style="margin:0"><b>시안 05 · 코디 먼저</b> — 결과를 ‘이렇게 입어요’ 보드로 시작해요. ${esc(M.note.ai)}</p>
      <p class="fine" style="margin:0">${esc(M.note.catalog)} 그림은 종류·색을 나타낸 것이고 실제 상품 사진이 아니에요.</p>
      <p class="fine" style="margin:0">${esc(M.note.price)}</p>
      <p class="fine" style="margin:0">${esc(M.note.rules)}</p>
      <p class="fine" style="margin:0">${esc(M.note.records)} 옷장·기록은 이 브라우저에만 저장돼요.</p>`;
  }
  const keyOf = (el) => (el ? ['flow', 'act', 'productId', 'id', 'kind', 'color', 'slot', 'step', 'key', 'v', 'i', 'gid', 'reason', 'q'].map((k) => el.dataset?.[k] || '').join('|') + '|' + (el.getAttribute?.('name') || '') : '');
  function render({ toTop = false, focus = true } = {}) {
    const active = document.activeElement;
    const fk = active && active !== document.body && app.contains(active) ? keyOf(active) : null;
    const inputVal = active?.id === 'q' ? active.value : null;
    let html;
    try {
      html = view.name === 'results' ? resultsHTML() : view.name === 'detail' ? detailHTML() : view.name === 'closet' ? closetHTML() : view.name === 'records' ? recordsHTML() : homeHTML();
    } catch (e) {
      console.error(e);
      html = `<h1 id="screen-h" tabindex="-1">화면을 그리지 못했어요</h1><p>${esc(e.message)}</p>`;
    }
    app.innerHTML = html;
    document.getElementById('nav').innerHTML = navHTML();
    const track = document.getElementById('track');
    if (track) {
      const i = view.boardIndex || 0;
      track.style.scrollBehavior = 'auto';
      track.scrollLeft = i * track.clientWidth;
      track.style.scrollBehavior = '';
      let t = null;
      track.addEventListener('scroll', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          const n = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
          if (n !== (view.boardIndex || 0)) { patch({ boardIndex: n }); ui.swapOpen = false; render(); }
        }, 140);
      }, { passive: true });
    }
    if (toTop) {
      window.scrollTo(0, 0);
      const h = document.getElementById('screen-h');
      if (h && focus && view.name !== 'home') h.focus({ preventScroll: true });
    } else if (fk) {
      const el = [...app.querySelectorAll('button, a, input')].find((x) => keyOf(x) === fk);
      if (el) { el.focus({ preventScroll: true }); if (inputVal != null) el.value = inputVal; }
    }
  }

  // ── 동작
  function submitAsk(text) {
    const said = String(text || '').trim();
    const prev = view.name === 'results' ? resultsOf(view).text : null;
    go({ name: 'results', said, prev, drop: [], boardIndex: 0, swaps: {} });
  }
  function currentHeroId() {
    if (view.name === 'detail') return view.productId;
    if (view.name !== 'results') return null;
    const r = resultsOf(view);
    const boards = resultBoards(r, view.swaps || {});
    return boards[view.boardIndex || 0]?.heroId || null;
  }
  function afterCloset(msg) {
    // 옷장이 바뀌면 보던 주인공을 그대로 두고 판정·보드를 다시 그린다.
    if (view.name === 'results') {
      const hero = ui.keepHero;
      const r = resultsOf(view);
      const boards = resultBoards(r, view.swaps || {});
      const i = hero ? boards.findIndex((b) => b.heroId === hero) : -1;
      if (i >= 0) patch({ boardIndex: i });
    }
    ui.adding = null;
    say(msg);
    render();
    const v = app.querySelector('[data-flow="verdict"]');
    if (v) { const box = v.closest('section'); box?.scrollIntoView({ block: 'nearest' }); }
  }

  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'ask-form') return;
    e.preventDefault();
    submitAsk(new FormData(e.target).get('q'));
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, a');
    if (!t || t.disabled) return;
    const flow = t.dataset.flow;
    const act = t.dataset.act;
    const pid = t.dataset.productId;
    try {
      if (flow === 'reset') { M.reset(); say('처음 상태로 돌렸어요. 옷장·기록이 비었어요.'); return go({ name: 'home' }); }
      if (flow === 'nav-ask') return go(view.name === 'results' || view.name === 'detail' ? { name: 'home' } : { name: 'home' });
      if (flow === 'nav-closet') return go({ name: 'closet' });
      if (flow === 'nav-records') return go({ name: 'records' });
      if (act === 'home') return go({ name: 'home' });
      if (flow === 'example') return go({ name: 'results', said: t.dataset.q, prev: null, drop: [], boardIndex: 0, swaps: {} });
      if (flow === 'condition-remove') {
        const r = resultsOf(view);
        return go({ ...view, drop: [...r.dropped, t.dataset.key], boardIndex: 0, swaps: {} });
      }
      if (act === 'cheaper') {
        const r = resultsOf(view);
        return go({ name: 'results', said: '더 싼 걸로', prev: r.text, drop: r.dropped, boardIndex: 0, swaps: {} });
      }
      if (flow === 'result') {
        const ctx = { said: view.said, prev: view.prev || null, drop: view.drop || [] };
        return go({ name: 'detail', productId: pid, ctx, strict: true, boardIndex: 0 });
      }
      if (act === 'open') {
        const ctx = view.name === 'results' ? { said: view.said, prev: view.prev || null, drop: view.drop || [] } : view.name === 'detail' ? view.ctx : null;
        return go({ name: 'detail', productId: t.dataset.id, ctx, strict: t.dataset.strict === '1' || (view.name === 'detail' && t.dataset.strict === '1'), boardIndex: 0 });
      }
      if (act === 'back') {
        if (history.state && history.length > 1 && view.ctx) return history.back();
        return go(view.ctx ? { name: 'results', ...view.ctx, boardIndex: 0, swaps: {} } : { name: 'home' });
      }
      if (act === 'prev' || act === 'next') {
        const track = document.getElementById('track');
        const n = track ? track.children.length : 1;
        const i = Math.min(Math.max((view.boardIndex || 0) + (act === 'next' ? 1 : -1), 0), n - 1);
        patch({ boardIndex: i }); ui.swapOpen = false;
        return render();
      }
      if (act === 'swap') { ui.swapOpen = !ui.swapOpen; return render(); }
      if (act === 'more-cands') { ui.moreCands = !ui.moreCands; return render(); }
      if (act === 'show-off') { ui.showOff = !ui.showOff; return render(); }
      if (act === 'swap-close') { ui.swapOpen = false; return render(); }
      if (act === 'swap-to') {
        if (view.name === 'detail') return go({ name: 'detail', productId: t.dataset.id, ctx: view.ctx, strict: view.strict, boardIndex: 0 });
        const i = view.boardIndex || 0;
        patch({ swaps: { ...(view.swaps || {}), [i]: t.dataset.id } });
        ui.swapOpen = false;
        const d = M.product(t.dataset.id);
        say(`주인공을 ${d.brand} ${d.name}(으)로 바꿨어요. 보드와 판정을 다시 그렸어요.`);
        return render();
      }
      if (flow && flow.startsWith('decide-')) {
        const k = flow.slice(7);
        M.decide(pid, k);
        say(`‘${{ buy: '사기로 함', hold: '보류', skip: '안 살래' }[k]}’로 기록했어요. ${k === 'buy' ? '주문하면 ‘주문했어요’를 눌러 이어서 남겨요.' : '기록 화면에서 언제든 바꿀 수 있어요.'}`);
        return render();
      }
      if (act === 'own') { M.setOwnership(pid, t.dataset.v); say('답을 반영해 판정을 다시 했어요.'); return render(); }
      if (flow === 'closet-add' || act === 'add-other') {
        ui.keepHero = pid || currentHeroId();
        ui.adding = { forId: pid || null, kind: act === 'add-other' ? null : (t.dataset.kind || null), color: null, slot: null };
        render();
        app.querySelector('.adder')?.scrollIntoView({ block: 'nearest' });
        return;
      }
      if (flow === 'kind-option') { ui.adding.kind = t.dataset.kind; ui.adding.slot = null; return render(); }
      if (flow === 'color-option') { ui.adding.color = t.dataset.color; return render(); }
      if (flow === 'slot-option') { ui.adding.slot = ui.adding.slot === t.dataset.slot ? null : t.dataset.slot; return render(); }
      if (act === 'add-cancel') { ui.adding = null; return render(); }
      if (flow === 'closet-save') {
        const a = ui.adding;
        const g = M.addGarment({ kind: a.kind, color: a.color, slot: a.slot });
        return afterCloset(`‘${gName(g)}’ 한 벌을 내 옷에 넣었어요.${a.forId ? ' 같은 옷의 판정을 다시 했어요.' : ''}`);
      }
      if (flow === 'trial-closet') {
        ui.keepHero = pid || currentHeroId();
        M.loadTrialCloset();
        return afterCloset(`체험용 옷 ${M.getState().trialCount}벌을 넣었어요(‘체험용’ 표시). 판정과 보드를 다시 그렸어요.`);
      }
      if (act === 'clear-trial') { M.clearTrialCloset(); say('체험용 옷을 모두 뺐어요.'); return render(); }
      if (act === 'remove-garment') { M.removeGarment(t.dataset.gid); say('옷장에서 뺐어요.'); return render(); }
      if (act === 'gender') { M.setGender(t.dataset.v); return render(); }
      if (flow === 'record-step') {
        if (t.dataset.step === 'returned') { ui.returnPick = pid; return render(); }
        M.advance(pid, t.dataset.step);
        say({ ordered: '주문했다고 기록했어요.', received: '받았다고 기록했어요. 이 옷이 내 옷에 들어갔어요.', kept: '계속 입는 내 옷으로 기록했어요.', worn: '오늘 입었다고 기록했어요.' }[t.dataset.step] || '기록했어요.');
        return render();
      }
      if (act === 'return-reason') { M.advance(pid, 'returned', { reason: t.dataset.reason }); ui.returnPick = null; say('반품했다고 기록했어요.'); return render(); }
      if (act === 'return-cancel') { ui.returnPick = null; return render(); }
      if (act === 'unrecord') { M.removeRecord(pid); say('기록을 지웠어요.'); return render(); }
    } catch (error) {
      say(error.message || '처리하지 못했어요.');
    }
  });
  window.addEventListener('popstate', (e) => { view = e.state && e.state.name ? e.state : { name: 'home' }; ui = freshUi(); render({ toTop: true }); });
  let pending = false;
  M.subscribe(() => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; render(); }); });
  let resizeT = null;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { const tr = document.getElementById('track'); if (tr) { tr.style.scrollBehavior = 'auto'; tr.scrollLeft = (view.boardIndex || 0) * tr.clientWidth; tr.style.scrollBehavior = ''; } }, 120); });

  document.getElementById('notes').innerHTML = notesHTML();
  if (M.boot.q) go({ name: 'results', said: M.boot.q, prev: null, drop: [], boardIndex: 0, swaps: {} }, { replace: true, focus: false });
  else if (!M.boot.reset && history.state && history.state.name) { view = history.state; render(); }
  else go({ name: 'home' }, { replace: true, focus: false });
})();
</script>
</body>
