<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4ef" />
    <meta
      name="description"
      content="내 옷장에서 시작하는, 나다운 다음 한 벌. 웨어넥스트 개인 프로토타입."
    />
    <title>WearNext — 내 옷장에서 시작하는 다음 한 벌</title>
    <style>
      :root {
  --bg: #f6f5f1;
  --paper: #fff;
  --ink: #27332d;
  --muted: #737972;
  --line: #e4e6df;
  --green: #304e3e;
  --green-light: #e7ece3;
  --sand: #eee9dd;
  --gold: #b5915e;
  --danger: #a44436;
  --radius: 16px;
  --font:
    -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic',
    sans-serif;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.6 var(--font);
  -webkit-font-smoothing: antialiased;
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
}
button {
  color: inherit;
}
button:disabled {
  opacity: 0.45;
  cursor: wait;
}
a {
  color: inherit;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  line-height: 1.35;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid #9eaa70;
  outline-offset: 4px;
}
svg {
  display: block;
}
img {
  display: block;
  max-width: 100%;
}
[hidden] {
  display: none !important;
}
.skip-link {
  position: fixed;
  top: -80px;
  left: 12px;
  z-index: 99;
  background: white;
  padding: 12px;
}
.skip-link:focus {
  top: 12px;
}
.icon {
  width: 20px;
  height: 20px;
  flex: none;
}
.btn {
  border: 1px solid var(--line);
  background: white;
  border-radius: 8px;
  min-height: 42px;
  padding: 10px 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  text-decoration: none;
  line-height: 1.4;
  font-weight: 600;
  transition:
    background 0.15s,
    transform 0.15s;
}
.btn:hover {
  background: #f0f1eb;
  transform: translateY(-1px);
}
.btn.primary {
  background: var(--green);
  border-color: var(--green);
  color: white;
}
.btn.primary:hover {
  background: #223c2e;
}
.btn.soft {
  background: var(--green-light);
  border-color: var(--green-light);
  color: var(--green);
}
.btn.ghost {
  background: transparent;
}
.btn.small {
  padding: 7px 11px;
  min-height: 35px;
  font-size: 12px;
}
.btn.danger {
  color: var(--danger);
}
.btn.wide {
  width: 100%;
}
.icon-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--line);
  background: white;
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex: none;
}
.icon-btn.active {
  background: var(--green);
  color: white;
  border-color: var(--green);
}
.text-link {
  border: 0;
  background: none;
  color: var(--green);
  display: inline-flex;
  gap: 7px;
  align-items: center;
  font-weight: 600;
  padding: 6px 0;
  text-decoration: none;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 12px;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 2.3px;
  text-transform: uppercase;
  font-weight: 650;
  color: var(--muted);
}
.serif {
  font-family: Georgia, 'Times New Roman', serif;
  font-weight: 400;
}
.badge {
  display: inline-flex;
  gap: 5px;
  align-items: center;
  padding: 3px 8px;
  border-radius: 5px;
  background: var(--green-light);
  color: var(--green);
  font-size: 10px;
  font-weight: 600;
  line-height: 1.7;
}
.badge.sand {
  background: #f0eadd;
  color: #816644;
}
.badge.outline {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
}
.badge.warn {
  background: #fff0df;
  color: #976b30;
}
.row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.stack {
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.grow {
  flex: 1;
  min-width: 0;
}
.mb {
  margin-bottom: 22px;
}
.mt {
  margin-top: 22px;
}
.divider {
  height: 1px;
  background: var(--line);
  margin: 24px 0;
}
.notice {
  padding: 12px 16px;
  background: #eeeee6;
  border: 1px solid #e3e4d6;
  border-radius: 9px;
  color: #636b58;
  font-size: 12px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.notice .icon {
  width: 16px;
  height: 16px;
  margin-top: 2px;
}
.notice.error {
  color: var(--danger);
  background: #fbeeea;
  border-color: #edccc3;
}
.notice.demo {
  background: #efeee9;
  border-color: #e5e3db;
}
.empty {
  text-align: center;
  border: 1px dashed #c8cec2;
  border-radius: var(--radius);
  padding: 46px 22px;
  color: var(--muted);
}
.empty h3 {
  color: var(--ink);
  margin: 12px 0 7px;
}
.empty .icon {
  margin: auto;
  width: 36px;
  height: 36px;
}
.empty .btn {
  margin-top: 18px;
}
.boot {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font:
    40px Georgia,
    serif;
  gap: 15px;
}
.boot span {
  font: 14px var(--font);
}
/* Frame */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: 226px;
  background: #fdfdfb;
  border-right: 1px solid var(--line);
  padding: 30px 22px;
  display: flex;
  flex-direction: column;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.brand-mark {
  width: 33px;
  height: 36px;
  display: grid;
  place-items: center;
  color: var(--green);
  font:
    38px/1 Georgia,
    serif;
  transform: scaleX(0.9);
}
.brand-name {
  font:
    28px/1.1 Georgia,
    serif;
  letter-spacing: -1.5px;
}
.brand-caption {
  font-size: 8px;
  letter-spacing: 2.4px;
  margin: 8px 0 0 46px;
  color: #7c857b;
}
.nav-section {
  margin-top: 49px;
  padding-left: 12px;
  font-size: 9px;
  color: #969c91;
  letter-spacing: 1.9px;
}
.nav {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 16px;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 8px;
  color: #7a8078;
  font-weight: 500;
  text-decoration: none;
}
.nav-link .icon {
  width: 18px;
  height: 18px;
}
.nav-link:hover {
  background: #f2f3ed;
}
.nav-link.active {
  background: var(--green-light);
  color: var(--green);
  font-weight: 650;
}
.nav-link .count {
  margin-left: auto;
  font-size: 10px;
  background: white;
  border-radius: 4px;
  padding: 0 5px;
}
.sidebar-bottom {
  margin-top: auto;
}
.profile-link {
  display: flex;
  align-items: center;
  gap: 11px;
  border-top: 1px solid var(--line);
  padding-top: 18px;
  margin-top: 18px;
}
.avatar {
  width: 33px;
  height: 33px;
  background: #e7e6dc;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font:
    18px Georgia,
    serif;
  color: #6d785d;
}
.local-status {
  display: flex;
  gap: 7px;
  align-items: center;
  font-size: 10px;
  color: var(--muted);
  padding-left: 6px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #76905e;
}
.layout {
  margin-left: 226px;
}
.topbar {
  height: 76px;
  border-bottom: 1px solid var(--line);
  padding: 0 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: rgba(253, 253, 251, 0.75);
}
.breadcrumb {
  font-size: 12px;
  color: var(--muted);
}
.breadcrumb b {
  font-weight: 500;
  color: var(--ink);
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.top-date {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.8px;
}
.mobile-brand {
  display: none;
}
.main {
  padding: 33px 42px 48px;
  max-width: 1510px;
  margin: auto;
}
.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}
.page-heading h1 {
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -1.1px;
  margin-top: 6px;
}
.page-heading p {
  color: var(--muted);
  margin-top: 8px;
  font-size: 12px;
}
.page-actions {
  display: flex;
  gap: 8px;
  flex: none;
}
.footnote {
  color: #90958c;
  font-size: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 25px;
}
.bottom-nav {
  display: none;
}
/* Welcome */
.welcome-shell {
  max-width: 1380px;
  margin: auto;
  padding: 34px 5vw 38px;
}
.welcome-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.welcome-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 45px;
  align-items: center;
  padding: 62px 0 48px;
}
.welcome-copy h1 {
  font-size: clamp(34px, 4.2vw, 59px);
  line-height: 1.35;
  letter-spacing: -2.4px;
  font-weight: 500;
  margin: 18px 0 22px;
}
.welcome-copy h1 em {
  font-style: normal;
  color: #718565;
}
.welcome-copy > p {
  color: var(--muted);
  line-height: 1.95;
  max-width: 400px;
}
.welcome-buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 30px 0 16px;
}
.welcome-visual {
  background: linear-gradient(150deg, #ebe8df, #e1e6d9);
  position: relative;
  border-radius: 120px 16px 16px 16px;
  padding: 30px 20px 10px;
  overflow: hidden;
}
.welcome-visual > svg {
  width: 100%;
  height: auto;
  max-height: 465px;
}
.floating-label {
  position: absolute;
  bottom: 28px;
  right: 20px;
  padding: 14px 19px;
  border: 1px solid #ffffffc9;
  border-radius: 9px;
  background: #ffffffdc;
  box-shadow: 0 10px 30px #35493612;
  font-size: 11px;
}
.floating-label b {
  display: block;
  font-size: 14px;
  margin-top: 4px;
}
.welcome-steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  border-top: 1px solid var(--line);
  padding-top: 29px;
}
.welcome-step {
  display: flex;
  gap: 16px;
}
.step-number {
  font:
    28px Georgia,
    serif;
  color: #a3ab95;
}
.welcome-step h3 {
  font-size: 14px;
  font-weight: 600;
  margin: 3px 0 7px;
}
.welcome-step p {
  font-size: 12px;
  color: var(--muted);
  max-width: 250px;
}
/* Closet */
.dashboard-hero {
  display: grid;
  grid-template-columns: 1fr 44%;
  min-height: 245px;
  background: #e8ecdf;
  border: 1px solid #e1e5d8;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 22px;
}
.hero-copy {
  padding: 30px 32px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
}
.hero-copy .eyebrow {
  color: #798266;
}
.hero-copy h2 {
  font-size: 28px;
  font-weight: 500;
  line-height: 1.55;
  letter-spacing: -1.1px;
  margin: 12px 0;
}
.hero-copy p {
  font-size: 12px;
  color: #76806e;
  margin-bottom: 14px;
}
.hero-visual {
  position: relative;
  background: radial-gradient(ellipse at 50% 50%, #f5f5e9, #e7eadc);
  overflow: hidden;
  min-height: 245px;
}
.hero-garment {
  position: absolute;
  width: 46%;
  height: 100%;
  filter: drop-shadow(3px 9px 8px #34423313);
}
.hero-garment svg {
  width: 100%;
  height: 100%;
}
.hero-garment:nth-child(1) {
  left: 2%;
  top: -15px;
  transform: rotate(-10deg);
  z-index: 2;
}
.hero-garment:nth-child(2) {
  left: 39%;
  top: 17px;
  transform: rotate(9deg);
}
.hero-visual .hero-note {
  position: absolute;
  bottom: 15px;
  right: 19px;
  font-size: 9px;
  letter-spacing: 1.3px;
  color: #77806b;
}
.insights {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 29px;
}
.insight {
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fdfdfb;
  display: flex;
  align-items: center;
  gap: 13px;
}
.insight-icon {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: #f0f0e9;
  display: grid;
  place-items: center;
  color: #7a886a;
}
.insight .value {
  font:
    25px/1.15 Georgia,
    serif;
  margin-bottom: 4px;
}
.insight .label {
  font-size: 10px;
  color: var(--muted);
}
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 25px 0 17px;
  gap: 14px;
}
.section-heading h2 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.5px;
}
.section-heading h2 .muted {
  font-size: 12px;
  margin-left: 8px;
  font-weight: 400;
}
.filters {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.filter-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.filter {
  border: 0;
  background: transparent;
  padding: 7px 13px;
  border-radius: 6px;
  color: var(--muted);
  font-size: 12px;
}
.filter.active {
  background: var(--green);
  color: white;
}
.filter span {
  font-size: 10px;
  margin-left: 5px;
  opacity: 0.65;
}
.search {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  padding: 7px 10px;
  max-width: 230px;
}
.search .icon {
  width: 15px;
  height: 15px;
  color: #999f94;
}
.search input {
  border: 0;
  outline: 0;
  background: transparent;
  width: 100%;
  font-size: 11px;
  color: var(--ink);
}
.closet-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 19px 16px;
}
.garment-card {
  min-width: 0;
}
.garment-picture {
  position: relative;
  aspect-ratio: 1/1.13;
  background: #edece5;
  border-radius: 11px;
  overflow: hidden;
}
.garment-picture > svg,
.garment-picture > img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 0.3s;
}
.garment-card:hover .garment-picture > svg,
.garment-card:hover .garment-picture > img {
  transform: scale(1.025);
}
.garment-picture .corner {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
}
.garment-picture .picture-action {
  position: absolute;
  right: 9px;
  top: 9px;
  z-index: 2;
  border: 0;
  background: #ffffffdb;
  width: 29px;
  height: 29px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: #818776;
}
.picture-action .icon {
  width: 14px;
  height: 14px;
}
.garment-info {
  padding: 12px 1px 0;
}
.garment-info .brand-label {
  font-size: 9px;
  letter-spacing: 1.15px;
  text-transform: uppercase;
  color: #95998f;
  margin-bottom: 3px;
}
.garment-info h3 {
  font-size: 12px;
  letter-spacing: -0.2px;
  font-weight: 600;
}
.garment-info .item-meta {
  font-size: 10px;
  color: #93998e;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.swatch {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  border: 1px solid #00000010;
}
.add-card {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 11px;
  border: 1px dashed #c9cfc0;
  border-radius: 11px;
  background: #f0f2eb;
  color: #80906f;
  aspect-ratio: 1/1.13;
}
.add-card strong {
  font-weight: 500;
  font-size: 12px;
}
.add-card span {
  font-size: 10px;
  color: #9ba58e;
}
.add-circle {
  width: 37px;
  height: 37px;
  border: 1px solid #c8d1bf;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.garment-picture .unavailable {
  position: absolute;
  bottom: 10px;
  left: 10px;
  padding: 2px 7px;
  background: #fff9;
  font-size: 10px;
  border-radius: 3px;
}
.item-open {
  border: 0;
  padding: 0;
  text-align: left;
  display: block;
  background: none;
  width: 100%;
}
/* Onboarding */
.steps-bar {
  display: flex;
  justify-content: center;
  gap: 37px;
  margin: 8px 0 33px;
}
.step {
  display: flex;
  gap: 9px;
  align-items: center;
  color: #9ba291;
  font-size: 12px;
}
.step .num {
  border: 1px solid #d5daca;
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  font:
    12px Georgia,
    serif;
}
.step.active {
  color: var(--green);
  font-weight: 650;
}
.step.active .num {
  color: white;
  background: var(--green);
  border-color: var(--green);
}
.upload-panel {
  max-width: 790px;
  margin: 0 auto;
}
.upload-intro {
  text-align: center;
  margin-bottom: 24px;
}
.upload-intro h2 {
  font-size: 26px;
  letter-spacing: -0.9px;
  font-weight: 500;
  margin: 12px 0;
}
.upload-intro p {
  font-size: 13px;
  color: var(--muted);
}
.dropzone {
  position: relative;
  border: 1.5px dashed #aebba1;
  background: #edf0e7;
  min-height: 240px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  gap: 12px;
  padding: 30px;
  cursor: pointer;
}
.dropzone.dragover {
  border-color: var(--green);
  background: #dfe8d6;
}
.upload-icon {
  width: 58px;
  height: 58px;
  background: #ffffffb0;
  border-radius: 15px;
  display: grid;
  place-items: center;
  color: #7d906c;
}
.upload-icon .icon {
  width: 26px;
  height: 26px;
}
.dropzone h3 {
  font-size: 16px;
}
.dropzone p {
  font-size: 12px;
  color: var(--muted);
}
.upload-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin: 18px 0 23px;
}
.mini-panel {
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 20px;
  background: white;
}
.mini-panel h3 {
  font-size: 14px;
  margin-bottom: 8px;
}
.mini-panel p {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 15px;
}
.tips {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-top: 24px;
}
.tip {
  font-size: 11px;
  color: var(--muted);
}
.tip b {
  display: block;
  font-size: 12px;
  color: var(--ink);
  margin-bottom: 5px;
}
.draft-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}
.draft-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
}
.draft-card.excluded {
  opacity: 0.55;
}
.draft-card .garment-picture {
  aspect-ratio: 1.2;
}
.draft-card .draft-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0;
}
.draft-card .field:first-child {
  grid-column: 1/-1;
}
.draft-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  margin-bottom: 10px;
}
.draft-top label {
  display: flex;
  gap: 7px;
  align-items: center;
}
.draft-top input {
  accent-color: var(--green);
  width: 16px;
  height: 16px;
}
.draft-note {
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 10px;
}
.sticky-actions {
  position: sticky;
  bottom: 14px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #fffffff5;
  backdrop-filter: blur(10px);
  padding: 14px 18px;
  display: flex;
  gap: 12px;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  z-index: 8;
  box-shadow: 0 8px 25px #2c382d10;
}
.progress {
  height: 5px;
  overflow: hidden;
  background: #dfe5d7;
  border-radius: 9px;
  max-width: 260px;
  width: 100%;
  margin-top: 15px;
}
.progress div {
  height: 100%;
  background: #83966d;
  transition: width 0.2s;
}
.style-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 20px 0;
}
.style-option {
  border: 1px solid var(--line);
  border-radius: 10px;
  text-align: left;
  padding: 16px;
  background: white;
  position: relative;
}
.style-option.active {
  border-color: #5b7951;
  background: #eef2e8;
  box-shadow: 0 0 0 1px #5b7951;
}
.style-option strong {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
}
.style-option span {
  font-size: 11px;
  color: var(--muted);
}
/* Recommendations */
.context-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  background: white;
  border: 1px solid var(--line);
  padding: 16px 18px;
  border-radius: 11px;
  margin-bottom: 23px;
  flex-wrap: wrap;
}
.context-bar .field {
  min-width: 120px;
  flex: 1;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.field > span,
.field > label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fdfdfb;
  color: var(--ink);
  padding: 9px 10px;
  font-size: 12px;
}
.field textarea {
  resize: vertical;
  min-height: 78px;
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.form-grid .full {
  grid-column: 1/-1;
}
.outfit-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}
.outfit-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: white;
}
.outfit-art {
  position: relative;
  aspect-ratio: 1.02;
  background: #eeeae2;
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 22px 9px 12px;
}
.outfit-piece {
  min-width: 0;
  min-height: 0;
}
.outfit-piece svg,
.outfit-piece img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.outfit-piece:nth-of-type(1) {
  grid-column: 1;
  grid-row: 1/3;
  transform: rotate(-7deg);
}
.outfit-piece:nth-of-type(2) {
  grid-column: 2;
  grid-row: 1/3;
  transform: rotate(6deg);
}
.outfit-piece:nth-of-type(3) {
  position: absolute;
  bottom: 5%;
  left: 7%;
  width: 48%;
  height: 40%;
  transform: rotate(-8deg);
}
.outfit-piece:nth-of-type(4) {
  position: absolute;
  top: 8%;
  left: 17%;
  width: 42%;
  height: 49%;
  transform: rotate(-8deg);
}
.outfit-art .outfit-tag {
  position: absolute;
  top: 13px;
  left: 15px;
  font-size: 9px;
  letter-spacing: 1.4px;
  color: #8a897c;
}
.outfit-body {
  padding: 19px;
}
.outfit-body h3 {
  font-size: 16px;
  margin-bottom: 9px;
}
.reasons {
  padding: 0;
  list-style: none;
  margin: 14px 0;
  color: var(--muted);
  font-size: 11px;
}
.reasons li {
  position: relative;
  padding-left: 13px;
  margin: 7px 0;
}
.reasons li:before {
  content: '';
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #8b9d7b;
  left: 0;
  top: 7px;
}
.outfit-names {
  font-size: 11px;
  color: var(--muted);
  min-height: 34px;
}
.gap-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
  margin: 20px 0 27px;
}
.gap-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fdfdf9;
  padding: 18px;
}
.gap-card h3 {
  font-size: 13px;
  margin: 8px 0;
}
.gap-card p {
  font-size: 11px;
  color: var(--muted);
}
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 19px;
}
.product-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
}
.product-card .garment-picture {
  border-radius: 0;
  aspect-ratio: 1.25;
}
.product-body {
  padding: 18px;
}
.product-body h3 {
  font-size: 15px;
  margin-top: 9px;
}
.price {
  font-size: 16px;
  font-weight: 600;
  margin: 7px 0;
}
.price small {
  font-size: 10px;
  font-weight: 400;
  color: var(--muted);
  margin-left: 5px;
}
.product-reason {
  font-size: 11px;
  color: var(--muted);
  min-height: 35px;
  margin: 10px 0 16px;
}
.product-details {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 24px;
}
.product-details .garment-picture {
  aspect-ratio: 1/1.15;
}
.detail-tabs {
  display: flex;
  gap: 4px;
  margin: 22px 0 16px;
  border-bottom: 1px solid var(--line);
  overflow: auto;
}
.detail-tab {
  border: 0;
  background: transparent;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.detail-tab.active {
  color: var(--green);
  border-bottom: 2px solid var(--green);
  font-weight: 650;
}
.pairing-list {
  display: flex;
  gap: 10px;
  overflow: auto;
  margin-top: 13px;
}
.pairing {
  width: 100px;
  flex: none;
}
.pairing .garment-picture {
  aspect-ratio: 1;
}
.pairing p {
  font-size: 10px;
  margin-top: 6px;
}
.review {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  margin-top: 10px;
}
.review p {
  font-size: 12px;
  margin: 7px 0;
}
.review .meta {
  font-size: 10px;
  color: var(--muted);
}
.decision-choices {
  display: flex;
  gap: 8px;
  margin: 16px 0;
  flex-wrap: wrap;
}
.decision-choice {
  border: 1px solid var(--line);
  background: white;
  padding: 10px 15px;
  border-radius: 7px;
  font-size: 12px;
}
.decision-choice.active {
  border-color: var(--green);
  background: var(--green-light);
}
.record-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(250px, 1fr);
  gap: 22px;
}
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 23px;
}
.panel h2 {
  font-size: 16px;
  margin-bottom: 7px;
}
.record-row {
  display: flex;
  gap: 13px;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.record-row:last-child {
  border-bottom: 0;
}
.record-row h3 {
  font-size: 12px;
}
.record-row p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 4px;
}
.record-thumb {
  width: 52px;
  height: 60px;
  border-radius: 5px;
  background: #efece4;
  flex: none;
  overflow: hidden;
}
.record-thumb svg,
.record-thumb img {
  height: 100%;
  width: 100%;
  object-fit: contain;
}
.record-action {
  margin-left: auto;
}
.storage-note {
  font-size: 11px;
  color: var(--muted);
  margin: 12px 0;
}
.data-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 18px;
}
/* Dialog / feedback */
dialog {
  width: min(750px, calc(100vw - 32px));
  max-height: 90dvh;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--bg);
  color: var(--ink);
  box-shadow: 0 28px 100px #17322430;
}
dialog::backdrop {
  background: #23312879;
  backdrop-filter: blur(3px);
}
.dialog-head {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  padding: 19px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.dialog-head h2 {
  font-size: 17px;
}
.dialog-body {
  padding: 23px;
}
.dialog-footer {
  display: flex;
  gap: 9px;
  justify-content: flex-end;
  margin-top: 23px;
  flex-wrap: wrap;
}
.edit-layout {
  display: grid;
  grid-template-columns: 180px 1fr;
  gap: 22px;
}
.edit-layout .garment-picture {
  aspect-ratio: 1/1.25;
}
.crop-preview {
  position: relative;
  max-height: 360px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  background: #deded4;
}
.crop-preview img {
  object-fit: contain;
  max-height: 360px;
  width: auto;
}
.crop-frame {
  position: relative;
  margin: auto;
}
.crop-box {
  position: absolute;
  border: 2px solid #fff;
  box-shadow: 0 0 0 2000px #0005;
  pointer-events: none;
}
.crop-form {
  margin-top: 18px;
}
.crop-form input {
  padding: 0;
}
.toast {
  position: fixed;
  bottom: 25px;
  left: calc(50% + 90px);
  transform: translateX(-50%);
  background: #2d4335;
  color: white;
  padding: 13px 24px;
  border-radius: 8px;
  font-size: 12px;
  box-shadow: 0 8px 30px #0002;
  z-index: 100;
  max-width: calc(100vw - 32px);
  text-align: center;
}
.spinner {
  height: 24px;
  width: 24px;
  border-radius: 50%;
  border: 2px solid #d1ddc7;
  border-top-color: var(--green);
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

        const bits = view.getUint32(start + 1, true);
        width = (bits & 0x3fff) + 1;
        height = ((bits >>> 14) & 0x3fff) + 1;
      }
      if (width && height) {
        type = 'image/webp';
        break;
      }
      offset = start + size + (size % 2);
    }
  } else if (bytes.length >= 4 && bytes[0] === 0xff && bytes[1] === 0xd8) {
    let offset = 2;
    while (offset + 4 <= bytes.length) {
      if (bytes[offset++] !== 0xff) break;
      while (bytes[offset] === 0xff) offset++;
      const marker = bytes[offset++];
      if (marker === 0xd9 || marker === 0xda) break;
      if (marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) continue;
      if (offset + 2 > bytes.length) break;
      const length = view.getUint16(offset);
      if (length < 2 || offset + length > bytes.length) break;
      if (
        [0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(
          marker,
        ) &&
        length >= 7
      ) {
        height = view.getUint16(offset + 3);
        width = view.getUint16(offset + 5);
        type = 'image/jpeg';
        break;
      }
      offset += length;
    }
  }
  if (!width || !height || !type)
    throw new Error(
      '읽을 수 있는 JPEG, PNG, WebP 또는 GIF 사진을 선택해 주세요. HEIC·SVG는 지원하지 않습니다.',
    );
  if (
    width > PHOTO_LIMITS.side ||
    height > PHOTO_LIMITS.side ||
    width * height > PHOTO_LIMITS.pixels
  ) {
    throw new Error('사진 해상도가 너무 큽니다. 2,400만 화소 이하로 줄인 뒤 다시 선택해 주세요.');
  }
  return { width, height, type };
}

function canvasFor(width, height) {
  if (typeof document === 'undefined')
    throw new Error('사진 처리는 Canvas를 지원하는 브라우저에서 사용할 수 있습니다.');
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(width));
  canvas.height = Math.max(1, Math.round(height));
  const context = canvas.getContext('2d', { willReadFrequently: true });
  if (!context) throw new Error('브라우저에서 사진을 처리할 수 없습니다.');
  context.fillStyle = '#fff';
  context.fillRect(0, 0, canvas.width, canvas.height);
  return { canvas, context };
}

async function decodeBlob(blob, signal) {
  abortIfNeeded(signal);
  if (typeof createImageBitmap === 'function') {
    const image = await createImageBitmap(blob);
    if (signal?.aborted) {
      image.close();
      abortIfNeeded(signal);
    }
    return { image, width: image.width, height: image.height, close: () => image.close() };
  }
  return new Promise((resolve, reject) => {
    const image = new Image(),
      url = URL.createObjectURL(blob);
    const cleanup = () => {
      signal?.removeEventListener('abort', onAbort);
      URL.revokeObjectURL(url);
      image.onload = null;
      image.onerror = null;
    };
    const onAbort = () => {
      cleanup();
      image.src = '';
      reject(new DOMException('사진 처리를 취소했습니다.', 'AbortError'));
    };
    image.onload = () => {
      cleanup();
      resolve({ image, width: image.naturalWidth, height: image.naturalHeight, close() {} });
    };
    image.onerror = () => {
      cleanup();
      reject(new Error('손상되었거나 브라우저가 읽을 수 없는 사진입니다.'));
    };
    signal?.addEventListener('abort', onAbort, { once: true });
    image.src = url;
  });
}

function drawCrop(source, width, height, region) {
  const safe = normalizeRegion(region);
  const sx = safe.x * width,
    sy = safe.y * height,
    sw = safe.width * width,
    sh = safe.height * height;
  const scale = Math.min(1, PHOTO_LIMITS.outputSide / Math.max(sw, sh));
  const { canvas, context } = canvasFor(sw * scale, sh * scale);
  context.drawImage(source, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas;
}

function sameBytes(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;

}

/**
 * Generates unconfirmed drafts. Source images are metadata-free JPEGs, not the originals.
 * Cancellation stops after the current local decode and returns completed drafts/errors.
 * Progress: {completed,total,name,status:'processing'|'done'|'error'|'cancelled'}.
 */
async function analyzePhotos(files, { onProgress = () => {}, signal } = {}) {
  const incoming = Array.from(files || []),
    accepted = incoming.slice(0, PHOTO_LIMITS.files);
  const drafts = [],
    errors = incoming
      .slice(PHOTO_LIMITS.files)
      .map((file) => ({
        name: file.name || '사진',
        message: '한 번에 최대 12장까지 처리합니다. 나머지는 다음에 추가해 주세요.',
      }));
  const seen = [];
  let completed = 0;
  const progress = (name, status) => {
    try {
      onProgress({ completed, total: accepted.length, name, status });
    } catch {
      /* UI callbacks cannot destroy photo results. */
    }
  };
  for (const file of accepted) {
    const name = file.name || '사진';
    if (signal?.aborted) {
      errors.push({ name, message: '처리를 취소했습니다. 완료된 초안은 유지됩니다.' });
      progress(name, 'cancelled');
      break;
    }
    progress(name, 'processing');
    let decoded;
    try {
      abortIfNeeded(signal);
      if (!file.size || file.size > PHOTO_LIMITS.bytes)
        throw new Error('사진 한 장은 0바이트보다 크고 12MB 이하여야 합니다.');
      const bytes = new Uint8Array(await file.arrayBuffer());
      abortIfNeeded(signal);
      const { type } = readImageDimensions(bytes);
      decoded = await decodeBlob(new Blob([bytes], { type }), signal);
      if (
        !decoded.width ||
        !decoded.height ||
        decoded.width > PHOTO_LIMITS.side ||
        decoded.height > PHOTO_LIMITS.side ||
        decoded.width * decoded.height > PHOTO_LIMITS.pixels
      )
        throw new Error('사진 해상도가 너무 큽니다. 크기를 줄인 뒤 다시 선택해 주세요.');
      abortIfNeeded(signal);
      const sourceCanvas = drawCrop(decoded.image, decoded.width, decoded.height, WHOLE);
      const sourceImage = sourceCanvas.toDataURL('image/jpeg', 0.84);
      const analysisScale = Math.min(1, 256 / Math.max(sourceCanvas.width, sourceCanvas.height));
      const { canvas: small, context } = canvasFor(
        sourceCanvas.width * analysisScale,
        sourceCanvas.height * analysisScale,
      );
      context.drawImage(sourceCanvas, 0, 0, small.width, small.height);
      const analysis = detectPhotoRegions(context.getImageData(0, 0, small.width, small.height));
      const duplicate = seen.find((previous) => sameBytes(previous.bytes, bytes));
      const perFile = analysis.regions.map((detected, index) => {
        const { x, y, width, height } = detected;
        const region = { x, y, width, height };
        const draft = {
          id: newId(),
          name: `${name.replace(/\.[^.]+$/, '')}${analysis.mode === 'regions' ? ` · 영역 ${index + 1}` : ' · 전체 사진'}`,
          category: 'unknown',
          kind: 'unknown',
          color: detected.color,
          pattern: 'unknown',
          image: drawCrop(sourceCanvas, sourceCanvas.width, sourceCanvas.height, region).toDataURL(
            'image/jpeg',
            0.84,
          ),
          sourceImage,
          region,
          source: 'photo',
          confirmed: false,
          selected: true,
          analysisNote: `사진 영역 분리 베타 · ${analysis.reason} 종류·무늬는 미확인이고 대표색도 조명·배경의 영향을 받는 추정입니다.`,
        };
        if (duplicate?.ids[index]) draft.duplicateOf = duplicate.ids[index];
        return draft;
      });
      abortIfNeeded(signal);
      drafts.push(...perFile);
      seen.push({ bytes, ids: perFile.map((draft) => draft.id) });
      completed++;
      progress(name, 'done');
    } catch (error) {
      const cancelled = error?.name === 'AbortError';
      errors.push({
        name,
        message: cancelled
          ? '처리를 취소했습니다. 완료된 초안은 유지됩니다.'
          : error.message || '사진을 처리하지 못했습니다.',
      });
      if (!cancelled) completed++;
      progress(name, cancelled ? 'cancelled' : 'error');
      if (cancelled) break;
    } finally {
      decoded?.close();
    }
    // Let the browser render progress/cancellation between photos without any network use.
    await new Promise((resolve) => setTimeout(resolve, 0));
  }
  return { drafts, errors };
}

/** Manual crop accepts inline raster images only; remote URLs are never loaded. */
async function cropImage(dataURL, region) {
  const match = /^data:(image\/(?:jpeg|png|webp|gif));base64,([A-Za-z0-9+/=]+)$/.exec(
    dataURL || '',
  );
  if (!match || match[2].length > Math.ceil((PHOTO_LIMITS.bytes * 4) / 3) + 4)
    throw new Error('로컬 사진 데이터만 잘라낼 수 있습니다.');
  const safe = normalizeRegion(region);
  const binary = atob(match[2]);
  const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
  const { type } = readImageDimensions(bytes);
  const decoded = await decodeBlob(new Blob([bytes], { type }));
  try {
    return drawCrop(decoded.image, decoded.width, decoded.height, safe).toDataURL(
      'image/jpeg',
      0.84,
    );
  } finally {
    decoded.close();
  }
}

    selected.length <= 2
      ? [
          [-35, 10, 0.66],
          [192, 73, 0.63],

      : [
          [-45, -5, 0.65],
          [181, 38, 0.63],

async function analyze(files) {
  if (ui.processing || !files?.length) return;
  const epoch = stateEpoch;
  ui.step = 1;
  ui.processing = true;
  ui.progress = 0;
  ui.errors = [];
  ui.mergeUndo = null;
  abortController = new AbortController();
  render();
  try {
    const result = await Photo.analyzePhotos(files, {
      signal: abortController.signal,
      onProgress: ({ completed, total }) => {
        if (epoch !== stateEpoch) return;
        ui.progress = Math.round((completed / total) * 100);
        if (ui.route === 'onboarding' && ui.step === 1) render();
      },
    });
    if (epoch !== stateEpoch) return;
    ui.errors = result.errors;
    const drafts = result.drafts.map((d) => ({
      ...d,
      selected: !d.duplicateOf,
      available: true,
      attributesConfirmed: false,
    }));
    if (drafts.length) {
      const saved = await mutate((s) => {
        s.drafts.push(...drafts);
      });
      if (epoch !== stateEpoch) return;
      if (saved) ui.step = 2;
      else
        ui.errors.push({
          name: '로컬 저장',
          message:
            '처리한 초안을 저장하지 못했어요. 기존 옷장은 유지됩니다. 저장 공간을 확인한 뒤 다시 시도해 주세요.',
        });
    }
  } catch (error) {
    if (epoch === stateEpoch) ui.errors.push({ name: '사진 처리', message: errorText(error) });
  } finally {
    if (epoch === stateEpoch) {
      ui.processing = false;
      render();
    }
  }
}
function readFile(accept, onFile) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = accept;
  input.addEventListener(
    'change',
    () => {
      if (input.files?.[0]) onFile(input.files[0]);
    },
    { once: true },
  );
  input.click();
}

function downloadBackup(includeImages) {

    const url = URL.createObjectURL(new Blob([content], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;

    productDetail(id);
    return;
  }
  if (action === 'product-tab') {
    productDetail(ui.product, id);
    return;
  }
  if (action === 'save-product') {
    const saved = state.savedProducts.includes(id);
    await mutate(
      (s) => {
        s.savedProducts = s.savedProducts.includes(id)
          ? s.savedProducts.filter((x) => x !== id)
          : [...s.savedProducts, id];
      },
      saved ? '후보 저장을 취소했어요.' : '다음 한 벌 후보를 저장했어요.',
    );
    if ($('#dialog').open) productDetail(id, ui.detailTab);
    return;
  }
  if (action === 'mark-owned') {
    const p = state.products.find((x) => x.id === id);
    if (!p || p.source === 'demo') return toast('예시 상품은 실제 구매로 등록할 수 없어요.');
    if (state.items.some((i) => i.productRef === id)) return toast('이미 옷장에 담은 상품이에요.');
    ui.ownedProduct = id;
    confirmDialog(
      '실제로 구매한 옷인가요?',
      '구매 의향과는 별개로, 실제로 가진 옷으로 추가해요. 입력한 상품 속성은 추정 상태로 남겨 확인할 수 있어요.',
      'confirm-owned',
      '보유 옷에 추가',
    );
    return;
  }
  if (action === 'confirm-owned') {
    const p = state.products.find((x) => x.id === ui.ownedProduct);
    if (!p || state.items.some((i) => i.productRef === p.id)) return;
    const ok = await mutate((s) => {
      if (s.items.some((i) => i.productRef === p.id)) return;
      s.items.push({
        id: uid('item'),
        productRef: p.id,
        name: p.name,
        brand: p.brand,
        category: p.category,
        kind: p.kind,
        color: p.color,
        pattern: p.pattern || 'unknown',
        available: true,
        source: 'manual',
        confirmed: true,
        attributesConfirmed: false,
      });
    }, '실제로 구매한 옷을 옷장에 담았어요.');
    if (ok) {
      closeDialog();
      go('closet');
    }
    return;
  }
  if (action === 'record-tab') {
    ui.recordTab = id;
    render();
    return;
  }
  if (action === 'export' || action === 'export-no-images') {
    downloadBackup(action === 'export');
    return;
  }
  if (action === 'import') {
    readFile('.json,application/json', importBackup);
    return;
  }
  if (action === 'confirm-import') {
    if (ui.importState) {
      await replaceState(ui.importState);
      ui.importState = null;
      closeDialog();
      go('closet');
      toast('백업의 옷장과 기록을 불러왔어요.');
    }
    return;
  }
  if (action === 'reset') {
    confirmDialog(
      '이 브라우저의 기록을 모두 지울까요?',
      '옷·사진 초안·저장한 코디·구매 기록이 삭제돼요. 내려받은 백업 파일은 별도로 남아 있어요.',
      'confirm-reset',
      '모두 삭제',
    );
    return;
  }
  if (action === 'confirm-reset') {
    const epoch = ++stateEpoch;
    abortController?.abort();
    ui.processing = false;
    const task = saveQueue.then(async () => {
      if (epoch !== stateEpoch) return;
      await Model.clearState();
      state = Model.createState('personal');
      welcome = true;
      ui.mergeUndo = null;
      ui.importState = null;
      closeDialog();
      render();
      toast('이 브라우저의 옷장 기록을 삭제했어요.');
    });
    saveQueue = task.catch(() => {});
    await task;
    return;
  }
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-action]');
  if (!target || target.disabled) return;
  event.preventDefault();
  event.stopPropagation();
  handleAction(target.dataset.action, target.dataset.id).catch((error) => toast(errorText(error)));
});
document.addEventListener('input', (event) => {
  if (event.target.id === 'closet-search') {
    ui.search = event.target.value;
    $('#closet-results').innerHTML = closetResults();
  }
  if (event.target.closest('#crop-form')) updateCropBox();
});
document.addEventListener('change', async (event) => {
  const target = event.target;
  if (['photo-files', 'camera-file'].includes(target.id)) {
    await analyze([...target.files]);
    return;
  }
  if (target.dataset.draftSelect) {
    ui.mergeUndo = null;
    await mutate((s) => {
      const d = s.drafts.find((x) => x.id === target.dataset.draftSelect);
      if (d) d.selected = target.checked;
    });
  }
  if (target.dataset.draftField) {
    ui.mergeUndo = null;
    const value = target.value;
    await mutate((s) => {
      const d = s.drafts.find((x) => x.id === target.dataset.id);
      if (d) {
        d[target.dataset.draftField] = value || '이름 없는 옷';
        if (target.dataset.draftField === 'category')
          d.kind = {
            top: 'shirt',
            bottom: 'chino',
            outer: 'jacket',
            shoes: 'sneaker',
            unknown: 'unknown',
          }[value];
      }
    });
  }
});
document.addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  const submit = form.querySelector('[type="submit"]');
  if (submit?.disabled) return;
  if (submit) submit.disabled = true;
  try {
    if (form.id === 'item-form') {
      const id = form.dataset.id;
      const ok = await mutate((s) => {
        let item = s.items.find((i) => i.id === id);
        if (!item) {
          item = { id: uid('item'), source: 'manual', confirmed: true, pattern: 'unknown' };
          s.items.push(item);
        }
        Object.assign(item, {
          name: String(data.get('name')).trim(),
          category: data.get('category'),
          kind: data.get('kind'),
          color: data.get('color'),
          brand: String(data.get('brand')).trim(),
          note: data.get('note'),
          available: data.has('available'),
          attributesConfirmed: data.has('attributesConfirmed'),
        });
      }, '옷 기록을 저장했어요.');
      if (ok) {
        closeDialog();
        if (ui.route === 'onboarding' && state.items.length) {
          ui.step = 3;
          render();
        }
      }
    }
    if (form.id === 'profile-form' || form.id === 'context-form') {
      const budget = data.get('budget');
      const ok = await mutate((s) => {
        s.profile = {
          ...s.profile,
          occasion: data.get('occasion'),
          budget: budget === '' ? null : Number(budget),
          ...(data.has('fit') ? { fit: data.get('fit') } : { style: data.get('style') }),
        };
        s.onboarded = true;
      }, '선택한 조건을 적용했어요.');
      if (ok) {
        ui.outfitOffset = 0;
        if (form.id === 'profile-form') {
          closeDialog();
          go('closet');
        }
      }
    }
    if (form.id === 'product-form') {
      const price = data.get('price');
      const review = String(data.get('review') || '').trim();
      const p = {
        id: uid('product'),
        name: String(data.get('name')).trim(),
        category: data.get('category'),
        kind: data.get('kind'),
        color: data.get('color'),
        brand: String(data.get('brand')).trim(),
        price: price === '' ? null : Number(price),
        url: String(data.get('url')).trim() || null,
        source: 'manual',
        pattern: 'unknown',
        checkedAt: data.get('checkedAt') || null,
        reviews: review
          ? [
              {
                text: review,
                topic: '직접 확인한 후기',
                sourceLabel: '사용자가 직접 기록한 원문 메모',
                kind: 'manual',
                url: String(data.get('reviewUrl')).trim() || null,
              },
            ]
          : [],
      };
      if (
        await mutate((s) => {
          s.products.push(p);
        }, '비교할 후보에 담았어요.')
      ) {
        closeDialog();
        go('discover');
      }
    }
    if (form.id === 'decision-form') {
      const ok = await mutate((s) => {
        s.decisions.push({
          id: uid('record'),
          type: data.get('decision'),
          productId: form.dataset.id,
          note: String(data.get('note')),
          createdAt: new Date().toISOString(),
        });
      }, '선택의 이유를 기록했어요.');
      if (ok) {
        closeDialog();
        go('saved');
      }
    }
    if (form.id === 'crop-form') {
      ui.mergeUndo = null;
      const d = state.drafts.find((x) => x.id === ui.cropId);
      const region = Photo.normalizeRegion(cropRegion());
      const image = await Photo.cropImage(d.sourceImage, region);
      if (
        await mutate((s) => {
          const draft = s.drafts.find((x) => x.id === d.id);
          draft.image = image;
          draft.region = region;
          draft.analysisNote = '직접 영역을 수정했어요. 종류와 색을 확인해 주세요.';
        }, '사진 영역을 수정했어요.')
      )
        closeDialog();
    }
  } catch (error) {
    toast(errorText(error));
  } finally {
    if (submit) submit.disabled = false;
  }
});
document.addEventListener('keydown', (event) => {
  if ((event.key === 'Enter' || event.key === ' ') && event.target.id === 'dropzone') {
    event.preventDefault();
    $('#photo-files')?.click();
  }
});
document.addEventListener('dragover', (event) => {
  const drop = event.target.closest('#dropzone');
  if (drop) {
    event.preventDefault();
    drop.classList.add('dragover');
  }
});
document.addEventListener('dragleave', (event) => {
  event.target.closest('#dropzone')?.classList.remove('dragover');
});
document.addEventListener('drop', (event) => {
  if (event.target.closest('#dropzone')) {
    event.preventDefault();
    analyze([...event.dataTransfer.files]);
  }
});
$('#dialog').addEventListener('click', (event) => {
  if (event.target === $('#dialog')) {
    const rect = $('#dialog').getBoundingClientRect();
    if (
      event.clientX < rect.left ||
      event.clientX > rect.right ||
      event.clientY < rect.top ||
      event.clientY > rect.bottom
    )
      closeDialog();
  }
});
window.addEventListener('hashchange', render);
try {
  state = await Model.loadState();
  welcome = !state;
  state ||= Model.createState('personal');
} catch (error) {
  loadError = errorText(error);
  state = Model.createState('personal');
  welcome = true;
}
ui.step = state.drafts.length ? 2 : 1;
render();
// Read-only snapshots for reproducible browser tests; never exposes live mutable state.
window.__wearnext = { snapshot: () => clone(state), ready: true };

})();
    </script>
  </body>
