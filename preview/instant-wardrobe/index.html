<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)">
  <meta name="description" content="내 스타일과 옷장에 맞는 실제 브랜드 아이템을 바로 추천합니다.">
  <title>어울</title>
  <style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --sunk: #F2F1ED;
  --ink: #141413;
  --ink-2: #57574F;
  --ink-3: #8F8E86;
  --line: #E9E7E1;
  --accent: #1F4D3A;
  --accent-soft: #E6EFE9;
  --heart: #D6453D;
  --art-line: #B9B6AD;
  --shadow: 0 1px 2px rgba(20, 20, 19, .04), 0 8px 24px rgba(20, 20, 19, .06);
  --radius: 18px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121312; --surface: #1B1C1B; --sunk: #232523; --ink: #F3F3EF; --ink-2: #BDBDB5; --ink-3: #8A8A83;
    --line: #2C2E2C; --accent: #8FD1B0; --accent-soft: #1E3329; --art-line: #7D7D76; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121312; --surface: #1B1C1B; --sunk: #232523; --ink: #F3F3EF; --ink-2: #BDBDB5; --ink-3: #8A8A83;
  --line: #2C2E2C; --accent: #8FD1B0; --accent-soft: #1E3329; --art-line: #7D7D76; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }

/* 상단 */
.top { padding: 12px 16px 4px; padding-top: calc(12px + env(safe-area-inset-top)); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
.brand small { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-left: 6px; }
.profile-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--sunk); font-size: 13px; font-weight: 600; color: var(--ink-2); }

.ask { margin-top: 12px; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
.ask svg { color: var(--ink-3); flex: none; }
.ask input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.ask input::placeholder { color: var(--ink-3); }
.ask .clear { width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-3); border-radius: 10px; }

.suggest-pop { margin-top: 10px; padding: 12px 14px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.suggest-pop .suggest { padding-top: 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips > :first-child { margin-left: 16px; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.ghost { background: transparent; }
.chip.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* 섹션 */
.section { padding: 22px 16px 4px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section h2 { font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
.section .sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.link { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

/* 코디 카드 */
.looks { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none; }
.looks::-webkit-scrollbar { display: none; }
.look { flex: none; width: 84%; scroll-snap-align: start; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; text-align: left; border: 1px solid var(--line); }
.look-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: var(--line); aspect-ratio: 1 / 1; }
.look-grid.n3 > :first-child { grid-row: span 2; }
.look-grid.n5 > :nth-child(n+5) { display: none; }
.tile { position: relative; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile .art { width: 62%; height: 62%; }
.tile .badge { position: absolute; left: 8px; top: 8px; }
.badge { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--accent); color: var(--bg); }
.look-body { padding: 14px 16px 16px; }
.look-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.look-note { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.look-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--ink-3); }
.look-meta b { color: var(--ink); font-size: 15px; }

/* 아이템 카드 */
.list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 104px 1fr; gap: 14px; padding: 10px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); position: relative; text-align: left; }
.thumb { aspect-ratio: 4 / 5; border-radius: 12px; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .art { width: 70%; height: 70%; }
.item-body { min-width: 0; padding: 2px 34px 0 0; display: flex; flex-direction: column; }
.brand-name { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.01em; }
.name { font-size: 14.5px; font-weight: 600; line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.price { font-size: 16px; font-weight: 800; margin-top: 6px; letter-spacing: -0.02em; }
.rating { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-weight: 500; }
.rating svg { color: #E2A33B; }
.reason { margin-top: auto; padding-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; line-height: 1.4; }
.heart { position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink-3); border-radius: 12px; }
.heart[aria-pressed="true"] { color: var(--heart); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 10px; }
.card { text-align: left; position: relative; }
.card .thumb { border-radius: 14px; }
.card .heart { top: 6px; right: 6px; background: color-mix(in srgb, var(--surface) 85%, transparent); }
.card .name { font-size: 13.5px; margin-top: 8px; }
.card .brand-name { margin-top: 8px; }
.card .brand-name + .name { margin-top: 1px; }
.card .price { font-size: 15px; margin-top: 4px; }
.card .reason { font-size: 12px; padding-top: 4px; }

/* 검색 결과 머리 */
.result-head { padding: 18px 16px 0; }
.result-head h2 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: -0.03em; }
.result-head .terms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.notice { margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--sunk); font-size: 13.5px; color: var(--ink-2); }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 0; }

/* 옷장 */
.closet-group { margin-top: 18px; }
.closet-group h3 { font-size: 14px; color: var(--ink-3); font-weight: 700; margin: 0 0 10px; }
.closet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.own { position: relative; padding: 10px 8px 12px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: center; }
.own .art { width: 56px; height: 56px; margin: 2px auto 6px; }
.own span { font-size: 12.5px; font-weight: 600; line-height: 1.3; display: block; color: var(--ink-2); }
.own[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.own[aria-pressed="true"] span { color: var(--ink); }
.own .tick { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--bg); opacity: 0; transform: scale(.6); transition: .15s; }
.own[aria-pressed="true"] .tick { opacity: 1; transform: none; }
.progress { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 12px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }

.empty { text-align: center; padding: 48px 24px; color: var(--ink-3); font-size: 14px; }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.total { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-top: 12px; border-radius: 16px; background: var(--sunk); font-size: 14px; }
.total b { font-size: 17px; }

/* 하단 내비 */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); position: relative; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav .count { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 10.5px; display: grid; place-items: center; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 52px; padding: 0 20px; border-radius: 14px; font-weight: 700; font-size: 16px; background: var(--ink); color: var(--bg); width: 100%; }
.btn.secondary { background: var(--sunk); color: var(--ink); }
.btn.small { height: 40px; font-size: 14px; border-radius: 12px; width: auto; }

/* 시트 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.36); z-index: 40; animation: fade .18s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); animation: up .24s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
.grabber { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 10px; }
.sheet-close { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); background: var(--sunk); z-index: 2; }
.hero { aspect-ratio: 1 / 1; border-radius: 20px; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .art { width: 60%; height: 60%; }
.detail-title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.35; margin: 4px 0 0; }
.detail-price { font-size: 22px; font-weight: 800; margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.fine { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.why { margin: 16px 0 0; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.why h3 { margin: 0 0 8px; font-size: 15px; font-weight: 800; }
.why ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.why li + li { margin-top: 4px; }
.row-scroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.row-scroll .card { flex: none; width: 128px; }
.sheet h3.block { font-size: 16px; font-weight: 800; margin: 22px 0 10px; }
.cta { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom)); margin: 18px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 8px; }
.cta .btn.secondary { width: 56px; flex: none; padding: 0; }
.look-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.look-row .thumb { border-radius: 10px; }
.look-row .role { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.look-row .nm { font-size: 14px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.look-row .pr { font-size: 14px; font-weight: 800; white-space: nowrap; }

.opt-group { margin-top: 18px; }
.opt-group h3 { font-size: 14px; margin: 0 0 10px; color: var(--ink-2); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }

/* 시작 화면 */
.onboard { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.onboard-inner { max-width: 480px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top)) 20px 40px; }
.onboard .logo { font-size: 40px; font-weight: 800; letter-spacing: -0.05em; }
.onboard .lead { font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.35; margin: 18px 0 6px; }
.onboard .lead-sub { color: var(--ink-2); font-size: 15px; }
.step { margin-top: 32px; }
.step h2 { font-size: 15px; color: var(--ink-3); margin: 0 0 12px; font-weight: 700; }
.pick2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { text-align: left; border-radius: 18px; padding: 16px; border: 1.5px solid var(--line); background: var(--surface); }
.pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.pick b { display: block; font-size: 17px; }
.pick span { font-size: 13px; color: var(--ink-3); }
.style-pick { display: grid; gap: 10px; }
.style-pick .pick { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
.mini { display: flex; gap: 4px; }
.mini > div { width: 52px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--sunk); display: grid; place-items: center; }
.mini img { width: 100%; height: 100%; object-fit: cover; }
.mini .art { width: 70%; height: 70%; }
.onboard .privacy { margin-top: 20px; font-size: 12.5px; color: var(--ink-3); text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); transform: translate(-50%, 20px); z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; display: flex; gap: 14px; align-items: center; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); width: max-content; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--accent-soft); font-weight: 700; text-decoration: underline; }

.footer { padding: 28px 16px 8px; font-size: 12px; color: var(--ink-3); line-height: 1.6; }

@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 600px) { .look { width: 300px; } }

.section .notice { margin: 0; }

.demo-banner { margin: 16px 16px 0; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--accent-soft); }
.demo-heading { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: center; }
.demo-heading b { font-size: 14px; }
.demo-heading .link { display: inline-flex; align-items: center; min-height: 40px; color: var(--accent); }
.demo-banner p { margin: 2px 0 10px; font-size: 13px; color: var(--ink-2); }
.demo-garments { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; }
.demo-garments span { display: grid; place-items: center; min-width: 0; padding: 6px; aspect-ratio: 1; border-radius: 10px; background: var(--surface); }
.demo-garments svg { width: 100%; height: 100%; }
.owned-grid { margin-top: 18px; }
.closet-add { margin-top: 20px; }
.closet-add summary { padding: 12px 14px; border-radius: 12px; background: var(--sunk); font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module">
(() => {
// ── src/data/slots.js
// 아이템 자리(slot): "화이트 옥스퍼드 셔츠"처럼 옷장에서 한 역할을 맡는 아이템 종류.
// 실제 상품(products.js)은 각 자리에 연결된다. 스타일 점수와 설명은 편집자 판단이다.
//
// style: 스타일별 중요도 0~3 (3 = 그 스타일 옷장의 기본)
// occ: 어울리는 상황 daily 데일리 · work 출근 · date 데이트 · weekend 주말·여행 · formal 격식·하객
// seasons: spring summer fall winter
// shape: 대체 그림 모양, color: 대체 그림 색

const STYLES = {
  classic: { label: '클래식', desc: '셔츠 · 치노 · 로퍼' },
  minimal: { label: '미니멀', desc: '모노톤 · 깔끔한 핏' },
  casual: { label: '캐주얼', desc: '편한 데일리 · 워크웨어' },
};

const OCCASIONS = {
  daily: '데일리',
  work: '출근',
  date: '데이트',
  weekend: '주말·여행',
  formal: '격식·하객',
};

const CATS = {
  outer: '아우터',
  top: '상의',
  dress: '원피스',
  bottom: '하의',
  shoes: '신발',
  acc: '소품',
};

const ALL = ['spring', 'summer', 'fall', 'winter'];
const SFW = ['spring', 'fall', 'winter'];
const SF = ['spring', 'fall'];
const FW = ['fall', 'winter'];

const SLOTS = [
  // ── 남성 상의
  { id: 'm-oxford-white', g: 'M', cat: 'top', shape: 'shirt', color: '#F4F3EF', name: '화이트 옥스퍼드 셔츠',
    style: { classic: 3, minimal: 2, casual: 1 }, occ: ['work', 'date', 'formal', 'daily'], seasons: ALL, formal: 4,
    why: '블레이저·니트·치노 어디에나 붙는 셔츠 한 장', tip: '단추 하나 풀고 소매를 두 번 접으면 덜 딱딱해 보여요' },

// "X에 어울리는 Y", "X랑 입을 Y", "X와 매치할 Y"
const ANCHOR_SPLIT = /(.+?)(?:에|랑|이랑|하고|와|과|이랑도|에도)\s*(?:잘\s*)?(?:어울리는|어울릴|맞는|입을|신을|매치할|매치하기\s*좋은|코디할|같이\s*입을|받쳐\s*입을)\s*(.*)/;

function itemMatchers(text) {
  const matched = [];
  for (const [re, fn, label] of ITEM_WORDS) {
    if (re.test(text)) {
      matched.push({ fn, label });
      text = text.replace(re, ' ');
    }
  }
  return matched;
}

function objectParticle(word) {
  const code = word.trim().slice(-1).charCodeAt(0) - 0xac00;
  if (code < 0 || code > 11171) return '를';
  return code % 28 ? '을' : '를';
}

function firstMatch(table, text) {
  for (const [re, value, label] of table) if (re.test(text)) return { value, label };
  return null;
}

function parseQuery(raw = '') {
  const text = ` ${raw.trim().toLowerCase()} `;
  const terms = [];

  let anchorText = '';
  let targetText = text;
  const split = text.match(ANCHOR_SPLIT);
  if (split) {
    anchorText = split[1];
    targetText = split[2] || '';
  }

  const anchors = itemMatchers(anchorText);
  const targets = itemMatchers(targetText);
  for (const a of anchors) terms.push(`${a.label}와 함께`);
  for (const t of targets) terms.push(t.label);

  const occ = firstMatch(OCCASION_WORDS, text);
  if (occ) terms.push(occ.label);
  const season = firstMatch(SEASON_WORDS, text);
  if (season) terms.push(season.label);
  const style = firstMatch(STYLE_WORDS, text);
  if (style) terms.push(style.label);
  const color = firstMatch(COLOR_WORDS, targetText);
  if (color) terms.push(color.label);

  let gender = null;
  if (/여자|여성|여친|여자친구/.test(text)) gender = 'F';
  else if (/남자|남성|남친|남자친구/.test(text)) gender = 'M';

  let maxPrice = null;
  const won = text.match(/(\d+(?:\.\d+)?)\s*만\s*(?:원)?\s*(대)?/);
  const plain = text.match(/(\d{4,7})\s*원/);
  if (won) {
    const n = parseFloat(won[1]);
    maxPrice = Math.round(n * 10000) + (won[2] ? (n < 10 ? 9999 : 99999) : 0);
  } else if (plain) {
    maxPrice = parseInt(plain[1], 10);
  }
  const cheap = /저렴|가성비|싼|저가|부담\s*없/.test(text);
  const premium = /고급|명품|비싸도|좋은\s*거|퀄리티|오래\s*입을/.test(text);
  if (!maxPrice && cheap) maxPrice = 60000;
  if (maxPrice) terms.push(`${Math.round(maxPrice / 10000)}만원 이하`);
  if (premium) terms.push('품질 우선');

  const occLabel = { work: '출근', formal: '격식 있는 자리', date: '데이트', weekend: '주말', daily: '데일리' }[occ?.value] || '';
  const what = targets.map((t) => t.label).join('·') || (anchors.length ? '함께 입을 아이템' : '');
  let summary = '';
  if (what || occLabel) {
    const noun = what || '아이템';
    const head = [
      anchors.length ? `${anchors.map((a) => a.label).join('·')}에 어울리는` : '',
      season ? season.label : '',
      occLabel ? `${occLabel}용` : '',
      color ? color.label : '',
      noun,
    ].filter(Boolean).join(' ');
    summary = `${head}${objectParticle(noun)} ${maxPrice ? `${Math.round(maxPrice / 10000)}만원 이하로 ` : ''}골랐어요`;
  }

  return {
    raw,
    summary,
    terms,
    occasion: occ?.value || null,
    season: season?.value || null,
    style: style?.value || null,
    color: color?.value || null,
    gender,
    maxPrice,
    premium,
    slotNamed: targets.length > 0,
    anchorMatch: (slot) => anchors.some((a) => a.fn(slot)),
    targetMatch: (slot) => targets.some((t) => t.fn(slot)),
  };
}

// ── src/engine.js
// 추천 엔진: 스타일·상황·계절·예산·가진 옷으로 실제 상품과 코디를 고른다.
// 같은 입력이면 같은 결과가 나오는 규칙 기반 계산이며, 개인 정보는 이 기기 밖으로 나가지 않는다.





const SEASON_LABEL = { spring: '봄', summer: '여름', fall: '가을', winter: '겨울' };
const OPTIONAL_ROLES = new Set(['acc']);

function seasonOf(date = new Date()) {
  const m = date.getMonth() + 1;
  if (m >= 3 && m <= 5) return 'spring';
  if (m >= 6 && m <= 8) return 'summer';
  if (m >= 9 && m <= 11) return 'fall';
  return 'winter';
}

// 받침 여부로 조사를 고른다: 치노와 / 셔츠와 / 로퍼와 / 슬랙스와
function josa(word, withFinal, withoutFinal) {
  const ch = word.trim().slice(-1);
  const code = ch.charCodeAt(0) - 0xac00;
  if (code < 0 || code > 11171) return withoutFinal;
  return code % 28 ? withFinal : withoutFinal;
}

const PRODUCTS_BY_SLOT = PRODUCTS.reduce((acc, p) => {
  (acc[p.slot] ||= []).push(p);
  return acc;
}, {});

function quality(p) {
  const rating = p.rating ?? 4.5;
  return rating * Math.log10((p.reviews ?? 0) + 10);
}

function withinBudget(p, maxPrice) {
  return !maxPrice || p.price <= maxPrice;
}

function productsFor(slotId, { maxPrice = null, hidden = [], color = null } = {}) {
  const hide = new Set(hidden);
  return (PRODUCTS_BY_SLOT[slotId] || [])
    .filter((p) => !hide.has(p.id) && withinBudget(p, maxPrice) && (!color || p.color === color))
    .sort((a, b) => quality(b) - quality(a) || a.price - b.price);
}

function ctx(state) {
  return {
    gender: state.gender || 'M',
    style: state.style || 'classic',
    occasion: state.occasion || null,
    season: state.season || seasonOf(state.now ? new Date(state.now) : new Date()),
    maxPrice: state.budget || null,
    owned: new Set(state.owned || []),
    hidden: state.hidden || [],
  };
}

function matchingLooks(c, { occasion = c.occasion } = {}) {
  return LOOKS.filter(
    (l) => l.g === c.gender && l.styles.includes(c.style) && l.seasons.includes(c.season) && (!occasion || l.occ.includes(occasion)),
  );
}

function slotsInLook(look) {
  return Object.values(look.roles).flat();
}

// 한 아이템 자리의 점수와 이유
function scoreSlot(slot, c, looks = matchingLooks(c)) {
  let score = (slot.style[c.style] || 0) * 2;
  const reasons = [];

  const inSeason = slot.seasons.includes(c.season);
  score += inSeason ? 2 : -6;

  if (c.occasion) score += slot.occ.includes(c.occasion) ? 2.5 : -2;

  const pairs = new Set();
  let lookCount = 0;
  for (const look of looks) {
    const ids = slotsInLook(look);
    if (!ids.includes(slot.id)) continue;
    lookCount += 1;
    for (const other of ids) if (other !== slot.id && c.owned.has(other) && SLOT_BY_ID[other].cat !== slot.cat) pairs.add(other);
  }
  score += Math.min(lookCount, 3) * 1;
  score += Math.min(pairs.size, 4) * 1.5;

  if (pairs.size) {
    const names = [...pairs].slice(0, 2).map((id) => shortName(SLOT_BY_ID[id]));
    const last = names[names.length - 1];
    reasons.push(`가진 ${names.join('·')}${josa(last, '과', '와')} 바로 입을 수 있어요`);
  }
  if (slot.style[c.style] === 3) reasons.push(`${STYLES[c.style].label} 옷장의 기본이에요`);
  if (c.occasion && slot.occ.includes(c.occasion)) reasons.push(`${OCCASIONS[c.occasion]}에 잘 맞아요`);
  if (inSeason && slot.seasons.length < 4) reasons.push(`${SEASON_LABEL[c.season]}에 많이 입어요`);

  return { score, reasons, pairs: [...pairs], inSeason };
}

const SHORT = {
  'm-oxford-white': '흰 셔츠', 'm-oxford-blue': '블루 셔츠', 'f-shirt-white': '흰 셔츠', 'm-tee-white': '흰 티', 'f-tee': '티셔츠',
  'm-denim': '청바지', 'f-denim': '청바지', 'm-chino': '치노', 'm-slacks-grey': '그레이 슬랙스', 'm-slacks-wide': '와이드 슬랙스', 'f-slacks': '슬랙스',
  'm-knit-crew': '니트', 'f-knit': '니트', 'm-knit-cable': '케이블 니트', 'm-loafer': '로퍼', 'f-loafer': '로퍼', 'm-derby': '구두',
  'm-sneaker-leather': '흰 스니커즈', 'm-chuck': '캔버스 스니커즈', 'm-nb': '운동화', 'f-sneaker': '스니커즈', 'm-boots': '부츠',
  'm-blazer': '블레이저', 'f-blazer': '블레이저', 'm-sweat': '맨투맨', 'm-longtee': '긴팔 티', 'f-skirt': '롱 스커트',
};
function shortName(slot) {
  return SHORT[slot.id] || slot.name.replace(/^(화이트|블루|베이지|그레이|블랙|네이비|생지|페니|스웨이드|코튼|울|피케|무지|베이직)\s+/, '');
}

const CAT_LIMIT = { acc: 1 };

// 지금 사면 좋은 아이템
function recommendItems(state, { limit = 8 } = {}) {
  const c = ctx(state);
  const looks = matchingLooks(c);
  const ranked = SLOTS.filter((s) => s.g === c.gender && !c.owned.has(s.id))
    .map((slot) => ({ slot, ...scoreSlot(slot, c, looks) }))
    .filter((r) => r.inSeason && r.score > 3)
    .sort((a, b) => b.score - a.score);

  const out = [];
  const perCat = {};
  const perBrand = {};
  for (const r of ranked) {
    const products = productsFor(r.slot.id, { maxPrice: c.maxPrice, hidden: c.hidden });
    if (!products.length) continue;
    const limitForCat = CAT_LIMIT[r.slot.cat] ?? 2;
    if ((perCat[r.slot.cat] || 0) >= limitForCat) continue;
    perCat[r.slot.cat] = (perCat[r.slot.cat] || 0) + 1;
    // 한 브랜드가 목록을 채우지 않도록 두 번까지만 먼저 고른다
    const product = products.find((p) => (perBrand[p.brand] || 0) < 2) || products[0];
    perBrand[product.brand] = (perBrand[product.brand] || 0) + 1;
    const pair = r.reasons.find((x) => x.startsWith('가진 '));
    const reasons = pair ? [pair, r.slot.why] : [r.slot.why, ...r.reasons];
    out.push({ slot: r.slot, product, alternatives: products.filter((p) => p !== product).slice(0, 3), score: r.score, reasons: reasons.slice(0, 2) });
    if (out.length >= limit) break;
  }
  return out;
}

function fillLook(look, c, { anchorSlots = new Set(), product = null } = {}) {
  const items = [];
  for (const role of ROLE_ORDER) {
    const candidates = look.roles[role];
    if (!candidates) continue;
    // 검색의 기준 아이템("청바지에 어울리는")을 먼저, 그다음 가진 옷
    // 상품 상세에서 연 코디에는 선택한 상품 자체를 넣는다.
    if (product && candidates.includes(product.slot)) {
      items.push({ role, slot: SLOT_BY_ID[product.slot], owned: false, product });
      continue;
    }
    const anchorId = candidates.find((id) => anchorSlots.has(id));
    const ownedId = anchorId && c.owned.has(anchorId) ? anchorId : !anchorId ? candidates.find((id) => c.owned.has(id)) : null;
    if (ownedId) {
      items.push({ role, slot: SLOT_BY_ID[ownedId], owned: true });
      continue;
    }
    const inSeason = anchorId ? [anchorId] : candidates.filter((id) => SLOT_BY_ID[id].seasons.includes(c.season));
    if (!inSeason.length) continue; // 이 계절엔 필요 없는 역할(예: 여름 아우터)
    let picked = null;
    for (const id of inSeason) {
      const product = productsFor(id, { maxPrice: c.maxPrice, hidden: c.hidden })[0];
      if (product) {
        picked = { role, slot: SLOT_BY_ID[id], owned: false, product };
        break;
      }
    }
    if (picked) items.push(picked);
    else if (!OPTIONAL_ROLES.has(role)) return null; // 코디의 핵심 역할을 채울 수 없으면 보여 주지 않는다
  }
  const buy = items.filter((i) => !i.owned);
  return {
    look,
    items,
    ownedCount: items.length - buy.length,
    buyCount: buy.length,
    buyTotal: buy.reduce((sum, i) => sum + i.product.price, 0),
  };
}

// 오늘의 코디
function recommendLooks(state, { limit = 3, anchorSlots = [], product = null, occasion } = {}) {
  const c = ctx(state);
  const force = new Set(anchorSlots);
  let looks = matchingLooks(c, { occasion: occasion ?? c.occasion });
  if (!looks.length) looks = matchingLooks(c, { occasion: null });
  if (force.size) looks = looks.filter((l) => slotsInLook(l).some((id) => force.has(id)));
  if (product) looks = looks.filter((l) => slotsInLook(l).includes(product.slot));
  return looks
    .map((look) => fillLook(look, c, { anchorSlots: force, product }))
    .filter(Boolean)
    .map((r) => {
      const styleScore = r.look.styles[0] === c.style ? 2 : 1;
      const occScore = c.occasion && r.look.occ[0] === c.occasion ? 1.5 : 0;
      const ownedScore = (r.ownedCount / r.items.length) * 4;
      return { ...r, score: styleScore + occScore + ownedScore };
    })
    .sort((a, b) => b.score - a.score || a.buyTotal - b.buyTotal)
    .slice(0, limit);
}

// 자연어 한 줄 검색: "출근용 셔츠 10만원 이하", "청바지에 어울리는 신발"
function search(state, text) {
  const q = parseQuery(text);
  const c = ctx({
    ...state,
    gender: q.gender || state.gender,
    style: q.style || state.style,
    occasion: q.occasion || state.occasion || null,
    season: q.season || state.season,
    budget: q.maxPrice ?? state.budget,
  });

  const genderSlots = SLOTS.filter((s) => s.g === c.gender);
  const anchors = genderSlots.filter((s) => q.anchorMatch(s));
  let targets = genderSlots.filter((s) => q.targetMatch(s));
  if (!targets.length && anchors.length) targets = genderSlots.filter((s) => !anchors.some((a) => a.cat === s.cat));
  const understood = q.terms.length > 0;
  if (!targets.length) targets = genderSlots;

  const looks = LOOKS.filter((l) => l.g === c.gender);
  const anchorIds = new Set(anchors.map((a) => a.id));
  const results = [];
  for (const slot of targets) {
    if (anchorIds.has(slot.id)) continue;
    const base = scoreSlot(slot, { ...c, owned: new Set([...c.owned, ...anchorIds]) }, matchingLooks(c, { occasion: null }));
    let score = base.score;
    let reasons = [slot.why, ...base.reasons].slice(0, 2);
    if (anchors.length) {
      const a = shortName(anchors[0]);
      reasons = [`${a}${josa(a, '과', '와')} 잘 어울려요`, ...base.reasons.filter((r) => !r.startsWith('가진 '))].slice(0, 2);
      const together = looks.filter((l) => slotsInLook(l).includes(slot.id) && slotsInLook(l).some((id) => anchorIds.has(id))).length;
      score += together * 3;
      if (!together) score -= 4;
    }
    // 계절을 말했으면 그 계절 옷만, 아이템을 콕 집었으면 계절이 지나도 보여 준다
    if (!base.inSeason && (q.season || !q.slotNamed)) continue;
    let products = productsFor(slot.id, { maxPrice: c.maxPrice, hidden: c.hidden, color: q.color });
    if (q.premium) products = [...products].sort((a, b) => b.price - a.price);
    products.slice(0, 3).forEach((product, i) => {
      results.push({ slot, product, score: score - i * 1.2 + quality(product) * 0.3, reasons });
    });
  }
  results.sort((a, b) => b.score - a.score);

  const items = results.slice(0, 12);
  const outfit = anchors.length || c.occasion
    ? recommendLooks({ ...state, gender: c.gender, style: c.style, season: c.season, budget: c.maxPrice, occasion: c.occasion }, { limit: 1, anchorSlots: [...anchorIds] })[0] || null
    : null;

  return { query: q, understood, items, outfit, season: c.season, gender: c.gender };
}

function formatPrice(n) {
  return `${n.toLocaleString('ko-KR')}원`;
}

function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp((n >> 16) + amount);
  const g = clamp(((n >> 8) & 255) + amount);
  const b = clamp((n & 255) + amount);
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function garmentSvg(slot, { size = '100%' } = {}) {
  const d = SHAPES[slot.shape] || SHAPES.tee;
  const fill = slot.color || '#cccccc';
  const n = parseInt(fill.slice(1), 16);
  const luma = 0.2126 * (n >> 16) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255);
  // 아주 밝거나 어두운 옷은 테마의 선 색으로 윤곽을 그려 배경에 묻히지 않게 한다
  const stroke = luma > 200 || luma < 60 ? 'var(--art-line)' : shade(fill, -40);
  let pattern = '';
  let fillRef = fill;
  if (slot.pattern === 'stripe' || slot.pattern === 'check') {
    const id = `p-${slot.id}`;
    const lines = slot.pattern === 'stripe'
      ? `<rect width="10" height="10" fill="${fill}"/><rect width="10" height="3" fill="${shade(fill, 70)}"/>`
      : `<rect width="10" height="10" fill="${fill}"/><path d="M0 5H10M5 0V10" stroke="${shade(fill, 60)}" stroke-width="1.6"/>`;
    pattern = `<defs><pattern id="${id}" width="10" height="10" patternUnits="userSpaceOnUse">${lines}</pattern></defs>`;
    fillRef = `url(#${id})`;
  }
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true">${pattern}<path d="${d}" fill="${fillRef}" style="stroke:${stroke}" stroke-width="1.6" stroke-linejoin="round" fill-rule="evenodd"/></svg>`;
}

          .map((slot) => ({ slot, product: productsFor(slot.id)[0] }))
          .filter((x) => x.product)
          .slice(0, 3);
        picks.forEach((x) => used.add(x.slot.id));
        return `<button class="pick" data-action="pick-style" data-style="${key}" aria-pressed="${state.style === key}">
          <div><b>${s.label}</b><span>${s.desc}</span></div>
          <div class="mini">${picks.map((x) => `<div>${x.product.img ? `<img src="${esc(x.product.img)}" alt="" referrerpolicy="no-referrer" data-slot="${x.slot.id}">` : `<div class="art">${garmentSvg(x.slot)}</div>`}</div>`).join('')}</div>
        </button>`;
      }).join('')
    : '';
  return `<div class="onboard"><div class="onboard-inner">
    <div class="logo">어울</div>
    <p class="lead">나에게 어울리는<br>다음 한 벌을 바로 골라 드릴게요</p>
    <p class="lead-sub">가입 없이 두 번만 누르면 실제 브랜드 상품을 추천해요.</p>
    <div class="step">
      <h2>1. 누구의 옷을 찾으세요?</h2>
      <div class="pick2">
        <button class="pick" data-action="pick-gender" data-g="M" aria-pressed="${g === 'M'}"><b>남성 옷</b><span>셔츠·재킷·치노</span></button>
        <button class="pick" data-action="pick-gender" data-g="F" aria-pressed="${g === 'F'}"><b>여성 옷</b><span>셔츠·원피스·코트</span></button>
      </div>
    </div>
    ${g ? `<div class="step"><h2>2. 끌리는 스타일을 골라 주세요</h2><div class="style-pick">${styleTiles}</div></div>` : ''}
    <p class="privacy">선택한 내용은 이 기기에만 저장돼요.</p>
  </div></div>`;
}

// ── 홈
function topBar() {
  const budgetLabel = BUDGETS.find(([v]) => v === state.budget)?.[1] || '예산 전체';
  return `<header class="top">
    <div class="top-row">
      <div class="brand">어울<small>다음 한 벌</small></div>
      <button class="profile-btn" data-action="open-profile">${ICON.user}${state.gender === 'F' ? '여성' : '남성'} · ${STYLES[state.style].label}</button>
    </div>
    <form class="ask" data-action="ask" role="search">
      ${ICON.search}
      <input id="ask-input" name="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="예) ${esc(EXAMPLES[state.gender][0])}" value="${esc(query)}" aria-label="찾는 옷을 한 줄로 적어 주세요">
      ${query ? `<button type="button" class="clear" data-action="clear-q" aria-label="검색 지우기">${ICON.close}</button>` : ''}
    </form>
    <div class="suggest-pop" id="suggest" hidden><div class="sub">이렇게 물어보세요</div><div class="suggest">${EXAMPLES[state.gender].map((e) => `<button class="chip" data-action="example" data-q="${esc(e)}">${esc(e)}</button>`).join('')}</div></div>
    <div class="chips" role="group" aria-label="상황과 예산">
      ${Object.entries(OCCASIONS).map(([k, v]) => `<button class="chip" data-action="occasion" data-occ="${k}" aria-pressed="${state.occasion === k}">${v}</button>`).join('')}
      <button class="chip ghost" data-action="open-budget" aria-pressed="${!!state.budget}">${budgetLabel}${ICON.chevron}</button>
    </div>
  </header>`;
}

function renderHome() {
  if (query) return renderSearch();
  const season = seasonOf();
  lastLooks = recommendLooks(state, { limit: 4 });
  const items = recommendItems(state, { limit: 8 });
  const ctxLine = [SEASON_LABEL[season], STYLES[state.style].label, state.occasion ? OCCASIONS[state.occasion] : null].filter(Boolean).join(' · ');
  const ownedCount = state.owned.filter((id) => SLOT_BY_ID[id]?.g === state.gender).length;
  return `
    <section class="section">
      <div class="section-head"><div><h2>오늘의 코디</h2><div class="sub">${ctxLine}${ownedCount ? ` · ${ownedLabel()} ${ownedCount}개 반영` : ''}</div></div></div>
      ${lastLooks.length ? `<div class="looks">${lastLooks.map((r, i) => lookCard(r, i)).join('')}</div>` : `<div class="notice">이 조건에 맞는 코디가 아직 없어요. 예산이나 상황을 바꿔 보세요.</div>`}
      ${ownedCount ? '' : `<div class="notice" style="margin:8px 0 0">가진 옷을 알려 주면 그 옷을 살린 코디로 바꿔 드려요. <button class="link" data-action="tab" data-tab="closet" style="text-decoration:underline">옷장 채우기</button></div>`}
    </section>
    <section class="section">
      <div class="section-head"><div><h2>${state.demo ? '예시 옷장' : '내 옷장'}에 더할 한 벌</h2><div class="sub">${ownedCount ? `${ownedLabel()}을 활용할 코디가 많은 순서예요` : `${STYLES[state.style].label} 옷장의 기본부터 골랐어요`}</div></div></div>
      ${items.length ? `<div class="list">${items.map(itemCard).join('')}</div>` : `<div class="empty"><b>추천할 아이템이 없어요</b>예산을 넓히거나 다른 상황을 골라 보세요.</div>`}
    </section>
    ${footer()}`;
}

function renderSearch() {
  const r = search(state, query);
  lastSearch = r;
  lastLooks = r.outfit ? [r.outfit] : [];
  const head = `<div class="result-head">
    <h2>${r.query.summary ? esc(r.query.summary) : `‘${esc(query)}’`}</h2>
    ${r.query.terms.length ? `<div class="terms">${r.query.terms.map((t) => `<span class="chip soft">${esc(t)}</span>`).join('')}</div>` : ''}
  </div>`;
  const notice = r.understood ? '' : `<div class="notice">아직 이해하지 못한 표현이에요. 대신 지금 ${STYLES[state.style].label} 스타일에 맞는 아이템을 보여 드릴게요.<div class="suggest">${EXAMPLES[state.gender].map((e) => `<button class="chip" data-action="example" data-q="${esc(e)}">${esc(e)}</button>`).join('')}</div></div>`;
  const outfit = r.outfit ? `<section class="section"><div class="section-head"><div><h2>이렇게 입어 보세요</h2><div class="sub">${esc(r.outfit.look.title)}</div></div></div>${lookCard(r.outfit, 0, { wide: true })}</section>` : '';
  const items = r.items.length
    ? `<section class="section"><div class="section-head"><div><h2>추천 아이템 ${r.items.length}개</h2><div class="sub">${SEASON_LABEL[r.season]} 기준 · 평점과 후기 수를 함께 봤어요</div></div></div><div class="grid">${r.items.map(gridCard).join('')}</div></section>`
    : `<div class="empty"><b>조건에 맞는 상품이 없어요</b>예산을 조금 넓히거나 다른 표현으로 찾아보세요.</div>`;
  return head + notice + outfit + items + footer();
}

function renderCloset() {
  const mine = SLOTS.filter((s) => s.g === state.gender);
  const owned = mine.filter((s) => state.owned.includes(s.id));
  const ownButton = (s) => `<button class="own" data-action="toggle-own" data-slot="${s.id}" aria-pressed="${state.owned.includes(s.id)}"><i class="tick">${ICON.check}</i><div class="art">${garmentSvg(s)}</div><span>${esc(s.name)}</span></button>`;
  const groups = Object.entries(CATS)
    .map(([cat, label]) => [label, mine.filter((s) => s.cat === cat && !state.owned.includes(s.id))])
    .filter(([, list]) => list.length);
  return `<section class="section">
    <h2>${state.demo ? '예시 옷장' : '내 옷장'} · ${owned.length}벌</h2>
    <div class="sub">${state.demo ? '체험용 옷이에요. 눌러서 빼면 추천이 달라져요.' : '비슷한 옷을 눌러 추가해 주세요. 한 벌만 있어도 시작할 수 있어요.'}</div>
    ${owned.length ? `<div class="closet-grid owned-grid">${owned.map(ownButton).join('')}</div>` : ''}
    <details class="closet-add" ${closetPickerOpen || !owned.length ? 'open' : ''}><summary>옷 추가하기</summary>
    ${groups.map(([label, list]) => `<div class="closet-group"><h3>${label}</h3><div class="closet-grid">
      ${list.map(ownButton).join('')}
    </div></div>`).join('')}
    </details>
    <div style="margin-top:24px"><button class="btn" data-action="tab" data-tab="home">이 옷장으로 추천 보기</button></div>
  </section>`;
}

function renderSaved() {
  const list = state.saved.map((id) => PRODUCT_BY_ID[id]).filter(Boolean);
  if (!list.length) return `<section class="section"><h2>찜</h2><div class="empty"><b>아직 찜한 아이템이 없어요</b>마음에 드는 상품의 ♡를 눌러 모아 두세요.</div></section>`;
  const total = list.reduce((s, p) => s + p.price, 0);
  return `<section class="section">
    <h2>찜</h2><div class="sub">구매는 각 상품의 판매 페이지에서 해요.</div>
    <div class="list" style="margin-top:14px">${list.map((p) => itemCard({ slot: SLOT_BY_ID[p.slot], product: p, reasons: [SLOT_BY_ID[p.slot].why] })).join('')}</div>
    <div class="total"><span>찜한 ${list.length}개</span><b>${formatPrice(total)}</b></div>
  </section>`;
}

function footer() {
  return `<p class="footer">상품명·가격·평점은 ${esc(CATALOG.store)} 판매 페이지에서 ${esc(CATALOG.checkedLabel)}에 확인한 값이에요. 할인·쿠폰·재고에 따라 달라질 수 있으니 구매 전에 판매 페이지에서 확인해 주세요. 내 옷장과 찜 목록은 이 기기에만 저장돼요.</p>`;
}

function nav() {
  const tabs = [
    ['home', '추천', ICON.sparkle, 0],
    ['closet', '내 옷장', ICON.hanger, state.owned.filter((id) => SLOT_BY_ID[id]?.g === state.gender).length],
    ['saved', '찜', ICON.heart, state.saved.length],
  ];
  return `<nav class="nav" aria-label="주요 메뉴"><div class="nav-inner">${tabs.map(([k, label, icon, n]) => `<button data-action="tab" data-tab="${k}" aria-current="${state.tab === k ? 'page' : 'false'}">${icon}${label}${n ? `<span class="count">${n}</span>` : ''}</button>`).join('')}</div></nav>`;
}

function render() {
  if (!state.onboarded || !state.gender || !state.style) {
    $app.innerHTML = renderOnboarding();
    return;
  }
  const body = state.tab === 'closet' ? renderCloset() : state.tab === 'saved' ? renderSaved() : renderHome();
  $app.innerHTML = (state.tab === 'home' ? topBar() : '') + demoBanner() + `<main>${body}</main>` + nav();
}

// ── 시트
function openSheet(html) {
  $sheet.innerHTML = `<div class="scrim" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div><button class="sheet-close" data-action="close-sheet" aria-label="닫기">${ICON.close}</button>${html}</div>`;
  document.body.style.overflow = 'hidden';
  $sheet.querySelector('.sheet-close')?.focus({ preventScroll: true });
}
function closeSheet() {
  $sheet.innerHTML = '';
  document.body.style.overflow = '';
}

function itemSheet(id) {
  const p = PRODUCT_BY_ID[id];
  if (!p) return;
  const slot = SLOT_BY_ID[p.slot];
  const c = { gender: state.gender, style: state.style, occasion: state.occasion, season: seasonOf(), owned: new Set(state.owned) };
  const { reasons } = scoreSlot(slot, c);
  const alts = productsFor(slot.id).filter((x) => x.id !== p.id).slice(0, 6);
  const withLooks = recommendLooks({ ...state, budget: null }, { limit: 1, product: p });
  const look = withLooks[0];
  openSheet(`
    ${picture(p, slot, 'hero')}
    <div style="margin-top:14px" class="brand-name">${esc(p.brand)}</div>
    <h2 class="detail-title">${esc(p.name)}</h2>
    <div class="detail-price">${formatPrice(p.price)}${stars(p)}</div>
    <div class="fine">${esc(p.store)} 판매가 · ${esc(CATALOG.checkedLabel)} 확인</div>
    <div class="why"><h3>이래서 추천해요</h3><ul>
      ${[...new Set([slot.why, ...reasons])].slice(0, 3).map((r) => `<li>${esc(reasonText(r))}</li>`).join('')}
      <li>이렇게 입어요: ${esc(slot.tip)}</li>
    </ul></div>
    ${look ? `<h3 class="block">이 아이템으로 만든 코디</h3>${lookRows(look)}` : ''}
    ${alts.length ? `<h3 class="block">같은 아이템, 다른 선택</h3><div class="row-scroll">${alts.map((a) => gridCard({ slot, product: a })).join('')}</div>` : ''}
    <div class="cta">
      <button class="btn secondary" data-action="save" data-id="${p.id}" aria-pressed="${state.saved.includes(p.id)}" aria-label="찜하기" style="color:${state.saved.includes(p.id) ? 'var(--heart)' : 'inherit'}">${state.saved.includes(p.id) ? ICON.heartFill : ICON.heart}</button>
      <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.store)}에서 보기 ${ICON.arrow}</a>
    </div>
    <div style="text-align:center;margin-top:6px"><button class="link" data-action="own" data-slot="${slot.id}" style="padding:10px">${state.demo ? '예시 옷장에 넣기' : state.owned.includes(slot.id) ? '이미 옷장에 있어요' : '비슷한 옷이 이미 있어요'}</button></div>
  `);
}

function lookRows(r) {
  return r.items.map((i) => i.owned
    ? `<div class="look-row"><div class="thumb"><div class="art">${garmentSvg(i.slot)}</div></div><div><div class="role">${ROLE_LABEL[i.role]} · ${ownedLabel()}</div><div class="nm">${esc(i.slot.name)}</div></div><span class="badge">${state.demo ? '예시' : '보유'}</span></div>`
    : `<button class="look-row" data-action="open-item" data-id="${i.product.id}">${picture(i.product, i.slot)}<div><div class="role">${ROLE_LABEL[i.role]} · ${esc(i.product.brand)}</div><div class="nm">${esc(i.product.name)}</div></div><span class="pr">${formatPrice(i.product.price)}</span></button>`).join('');
}

function lookSheet(index) {
  const r = lastLooks[index];
  if (!r) return;
  const buyIds = r.items.filter((i) => !i.owned).map((i) => i.product.id);
  openSheet(`
    <h2 class="detail-title" style="padding-right:48px">${esc(r.look.title)}</h2>
    <p class="sub" style="margin:6px 0 10px;color:var(--ink-2)">${esc(r.look.note)}</p>
    ${lookRows(r)}
    <div class="total"><span>${r.buyCount ? `새로 살 것 ${r.buyCount}개` : `${ownedLabel()}으로 완성`}</span><b>${r.buyCount ? formatPrice(r.buyTotal) : ''}</b></div>
    ${buyIds.length ? `<div class="cta"><button class="btn" data-action="save-all" data-ids="${buyIds.join(',')}">필요한 ${buyIds.length}개 모두 찜하기</button></div>` : ''}
  `);
}

function optionSheet(kind) {
  const budgetOpts = BUDGETS.map(([v, label]) => `<button class="chip" data-action="set-budget" data-v="${v ?? ''}" aria-pressed="${state.budget === v}">${label}</button>`).join('');
  if (kind === 'budget') {
    openSheet(`<h2 class="detail-title">한 벌 예산</h2><p class="sub" style="margin-top:4px">이 가격 이하 상품만 추천해요.</p><div class="opts" style="margin-top:16px">${budgetOpts}</div>`);
    return;
  }
  openSheet(`
    <h2 class="detail-title">내 취향</h2>
    <div class="opt-group"><h3>누구의 옷</h3><div class="opts">
      <button class="chip" data-action="set-gender" data-g="M" aria-pressed="${state.gender === 'M'}">남성</button>
      <button class="chip" data-action="set-gender" data-g="F" aria-pressed="${state.gender === 'F'}">여성</button>
    </div></div>
    <div class="opt-group"><h3>스타일</h3><div class="opts">
      ${Object.entries(STYLES).map(([k, s]) => `<button class="chip" data-action="set-style" data-style="${k}" aria-pressed="${state.style === k}">${s.label} · ${s.desc}</button>`).join('')}
    </div></div>
    <div class="opt-group"><h3>한 벌 예산</h3><div class="opts">${budgetOpts}</div></div>
    <div class="opt-group"><h3>저장된 정보</h3><p class="sub">옷장·찜·취향은 이 기기의 브라우저에만 있어요.</p>
      <button class="chip" data-action="reset" style="margin-top:10px">모두 지우고 처음부터</button></div>
  `);
}

// ── 알림
let toastTimer;
function toast(message, undo) {
  clearTimeout(toastTimer);
  $toast.innerHTML = `<span>${esc(message)}</span>${undo ? '<button data-action="undo">되돌리기</button>' : ''}`;
  $toast.classList.add('show');
  toast.undo = undo;
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 3200);
}

function refreshHearts(id) {
  const on = state.saved.includes(id);
  document.querySelectorAll(`[data-action="save"][data-id="${CSS.escape(id)}"]`).forEach((b) => {
    b.setAttribute('aria-pressed', String(on));
    b.innerHTML = on ? ICON.heartFill : ICON.heart;
    if (b.classList.contains('secondary')) b.style.color = on ? 'var(--heart)' : 'inherit';
  });
  const navCount = state.saved.length;
  const savedBtn = document.querySelector('.nav [data-tab="saved"]');
  if (savedBtn) savedBtn.innerHTML = `${ICON.heart}찜${navCount ? `<span class="count">${navCount}</span>` : ''}`;
}

function toggleOwn(slotId, { fromItem = false } = {}) {
  const had = state.owned.includes(slotId);
  if (fromItem && had) {
    closeSheet();
    toast('이미 옷장에 있어요');
    return;
  }
  closetPickerOpen = !!document.querySelector('.closet-add')?.open;
  const before = state.owned;
  set({ owned: had ? state.owned.filter((x) => x !== slotId) : [...state.owned, slotId] });
  if (fromItem) {
    closeSheet();
    const name = SLOT_BY_ID[slotId].name;
    toast(`${name}${josa(name, '을', '를')} ${state.demo ? '예시 ' : ''}옷장에 넣었어요`, () => set({ owned: before }));
  }
}

// ── 이벤트
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'ask') return;
  switch (a) {
    case 'start-personal':
      query = '';
      closetPickerOpen = true;
      set({ demo: false, owned: [], tab: 'closet' });
      window.scrollTo(0, 0);
      break;
    case 'pick-gender':
      set({ gender: el.dataset.g, style: null });
      requestAnimationFrame(() => document.querySelector('.style-pick')?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
      break;
    case 'pick-style':
      set({ style: el.dataset.style, onboarded: true, tab: 'home' });
      window.scrollTo(0, 0);
      break;
    case 'occasion':
      set({ occasion: state.occasion === el.dataset.occ ? null : el.dataset.occ });
      break;
    case 'open-budget': optionSheet('budget'); break;
    case 'open-profile': optionSheet('profile'); break;
    case 'set-budget':
      set({ budget: el.dataset.v ? Number(el.dataset.v) : null });
      closeSheet();
      break;
    case 'set-gender': set({ gender: el.dataset.g, ...(state.demo ? { owned: [...DEMO_OWNED[el.dataset.g]] } : {}) }); optionSheet('profile'); break;
    case 'set-style': set({ style: el.dataset.style }); optionSheet('profile'); break;
    case 'reset':
      if (el.dataset.armed !== '1') {
        el.dataset.armed = '1';
        el.textContent = '한 번 더 누르면 모두 지워져요';
        break;
      }
      state = { ...defaults };
      persist();
      closeSheet();
      render();
      break;
    case 'clear-q': query = ''; render(); document.getElementById('ask-input')?.focus(); break;
    case 'example': query = el.dataset.q; render(); window.scrollTo(0, 0); break;
    case 'tab':
      closeSheet();
      if (el.dataset.tab === 'home' && state.tab === 'home' && query) query = '';
      set({ tab: el.dataset.tab });
      window.scrollTo(0, 0);
      break;
    case 'open-item': e.preventDefault(); itemSheet(el.dataset.id); break;
    case 'open-look': lookSheet(Number(el.dataset.index)); break;
    case 'close-sheet': closeSheet(); break;
    case 'save': {
      e.stopPropagation();
      const id = el.dataset.id;
      const on = state.saved.includes(id);
      set({ saved: on ? state.saved.filter((x) => x !== id) : [...state.saved, id] }, { rerender: state.tab === 'saved' });
      refreshHearts(id);
      if (!on) toast('찜했어요');
      break;
    }
    case 'save-all': {
      const ids = el.dataset.ids.split(',');
      set({ saved: [...new Set([...state.saved, ...ids])] }, { rerender: false });
      ids.forEach(refreshHearts);
      closeSheet();
      toast(`${ids.length}개를 찜했어요`);
      break;
    }
    case 'own': toggleOwn(el.dataset.slot, { fromItem: true }); break;
    case 'toggle-own': toggleOwn(el.dataset.slot); break;
    case 'undo': toast.undo?.(); $toast.classList.remove('show'); break;
    default: break;
  }
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-action="ask"]');
  if (!form) return;
  e.preventDefault();
  query = form.q.value.trim();
  form.q.blur();
  render();
  window.scrollTo(0, 0);
});

// 검색창을 비운 채 누르면 예시 요청을 보여 준다
document.addEventListener('focusin', (e) => {
  if (e.target.id === 'ask-input' && !e.target.value) document.getElementById('suggest')?.removeAttribute('hidden');
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'ask-input') document.getElementById('suggest')?.toggleAttribute('hidden', !!e.target.value);
});
document.addEventListener('focusout', (e) => {
  if (e.target.id === 'ask-input') setTimeout(() => document.getElementById('suggest')?.setAttribute('hidden', ''), 180);
});
document.addEventListener('mousedown', (e) => {
  if (e.target.closest('#suggest')) e.preventDefault();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $sheet.innerHTML) closeSheet();
});

// 상품 사진을 못 불러오면 옷 그림으로 바꾼다
document.addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.dataset.slot) return;
  const slot = SLOT_BY_ID[img.dataset.slot];
  const art = document.createElement('div');
  art.className = 'art';
  art.innerHTML = garmentSvg(slot);
  img.replaceWith(art);
}, true);

render();

})();
</script>
</body>
</html>
