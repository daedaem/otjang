<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)">
  <meta name="description" content="내 스타일과 옷장에 맞는 실제 브랜드 아이템을 바로 추천합니다.">
  <title>어울</title>
  <style>
:root {
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --sunk: #F2F1ED;
  --ink: #141413;
  --ink-2: #57574F;
  --ink-3: #8F8E86;
  --line: #E9E7E1;
  --accent: #1F4D3A;
  --accent-soft: #E6EFE9;
  --heart: #D6453D;
  --art-line: #B9B6AD;
  --shadow: 0 1px 2px rgba(20, 20, 19, .04), 0 8px 24px rgba(20, 20, 19, .06);
  --radius: 18px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121312; --surface: #1B1C1B; --sunk: #232523; --ink: #F3F3EF; --ink-2: #BDBDB5; --ink-3: #8A8A83;
    --line: #2C2E2C; --accent: #8FD1B0; --accent-soft: #1E3329; --art-line: #7D7D76; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121312; --surface: #1B1C1B; --sunk: #232523; --ink: #F3F3EF; --ink-2: #BDBDB5; --ink-3: #8A8A83;
  --line: #2C2E2C; --accent: #8FD1B0; --accent-soft: #1E3329; --art-line: #7D7D76; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }

/* 상단 */
.top { padding: 12px 16px 4px; padding-top: calc(12px + env(safe-area-inset-top)); }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
.brand small { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: 0; margin-left: 6px; }
.profile-btn { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--sunk); font-size: 13px; font-weight: 600; color: var(--ink-2); }

.ask { margin-top: 12px; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
.ask svg { color: var(--ink-3); flex: none; }
.ask input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
.ask input::placeholder { color: var(--ink-3); }
.ask .clear { width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-3); border-radius: 10px; }

.suggest-pop { margin-top: 10px; padding: 12px 14px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.suggest-pop .suggest { padding-top: 8px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips > :first-child { margin-left: 16px; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.ghost { background: transparent; }
.chip.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* 섹션 */
.section { padding: 22px 16px 4px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section h2 { font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
.section .sub { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.link { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

/* 코디 카드 */
.looks { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none; }
.looks::-webkit-scrollbar { display: none; }
.look { flex: none; width: 84%; scroll-snap-align: start; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; text-align: left; border: 1px solid var(--line); }
.look-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; background: var(--line); aspect-ratio: 1 / 1; }
.look-grid.n3 > :first-child { grid-row: span 2; }
.look-grid.n5 > :nth-child(n+5) { display: none; }
.tile { position: relative; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile .art { width: 62%; height: 62%; }
.tile .badge { position: absolute; left: 8px; top: 8px; }
.badge { display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--accent); color: var(--bg); }
.look-body { padding: 14px 16px 16px; }
.look-title { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.look-note { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.look-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; color: var(--ink-3); }
.look-meta b { color: var(--ink); font-size: 15px; }

/* 아이템 카드 */
.list { display: grid; gap: 10px; }
.item { display: grid; grid-template-columns: 104px 1fr; gap: 14px; padding: 10px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--line); position: relative; text-align: left; }
.thumb { aspect-ratio: 4 / 5; border-radius: 12px; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .art { width: 70%; height: 70%; }
.item-body { min-width: 0; padding: 2px 34px 0 0; display: flex; flex-direction: column; }
.brand-name { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.01em; }
.name { font-size: 14.5px; font-weight: 600; line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.price { font-size: 16px; font-weight: 800; margin-top: 6px; letter-spacing: -0.02em; }
.rating { font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-weight: 500; }
.rating svg { color: #E2A33B; }
.reason { margin-top: auto; padding-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; line-height: 1.4; }
.heart { position: absolute; top: 8px; right: 8px; width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink-3); border-radius: 12px; }
.heart[aria-pressed="true"] { color: var(--heart); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 10px; }
.card { text-align: left; position: relative; }
.card .thumb { border-radius: 14px; }
.card .heart { top: 6px; right: 6px; background: color-mix(in srgb, var(--surface) 85%, transparent); }
.card .name { font-size: 13.5px; margin-top: 8px; }
.card .brand-name { margin-top: 8px; }
.card .brand-name + .name { margin-top: 1px; }
.card .price { font-size: 15px; margin-top: 4px; }
.card .reason { font-size: 12px; padding-top: 4px; }

/* 검색 결과 머리 */
.result-head { padding: 18px 16px 0; }
.result-head h2 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: -0.03em; }
.result-head .terms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.notice { margin: 12px 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--sunk); font-size: 13.5px; color: var(--ink-2); }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 0; }

/* 옷장 */
.closet-group { margin-top: 18px; }
.closet-group h3 { font-size: 14px; color: var(--ink-3); font-weight: 700; margin: 0 0 10px; }
.closet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.own { position: relative; padding: 10px 8px 12px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: center; }
.own .art { width: 56px; height: 56px; margin: 2px auto 6px; }
.own span { font-size: 12.5px; font-weight: 600; line-height: 1.3; display: block; color: var(--ink-2); }
.own[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.own[aria-pressed="true"] span { color: var(--ink); }
.own .tick { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--bg); opacity: 0; transform: scale(.6); transition: .15s; }
.own[aria-pressed="true"] .tick { opacity: 1; transform: none; }
.progress { height: 6px; border-radius: 99px; background: var(--sunk); overflow: hidden; margin-top: 12px; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }

.empty { text-align: center; padding: 48px 24px; color: var(--ink-3); font-size: 14px; }
.empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.total { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-top: 12px; border-radius: 16px; background: var(--sunk); font-size: 14px; }
.total b { font-size: 17px; }

/* 하단 내비 */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.nav-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--nav-h); }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); position: relative; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav .count { position: absolute; top: 8px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--ink); color: var(--bg); font-size: 10.5px; display: grid; place-items: center; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 52px; padding: 0 20px; border-radius: 14px; font-weight: 700; font-size: 16px; background: var(--ink); color: var(--bg); width: 100%; }
.btn.secondary { background: var(--sunk); color: var(--ink); }
.btn.small { height: 40px; font-size: 14px; border-radius: 12px; width: auto; }

/* 시트 */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.36); z-index: 40; animation: fade .18s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; max-height: 92dvh; overflow-y: auto; background: var(--bg); border-radius: 24px 24px 0 0; padding: 8px 16px calc(24px + env(safe-area-inset-bottom)); animation: up .24s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
.grabber { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 4px auto 10px; }
.sheet-close { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--ink-2); background: var(--sunk); z-index: 2; }
.hero { aspect-ratio: 1 / 1; border-radius: 20px; background: var(--sunk); overflow: hidden; display: grid; place-items: center; }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .art { width: 60%; height: 60%; }
.detail-title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.35; margin: 4px 0 0; }
.detail-price { font-size: 22px; font-weight: 800; margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.fine { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.why { margin: 16px 0 0; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.why h3 { margin: 0 0 8px; font-size: 15px; font-weight: 800; }
.why ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
.why li + li { margin-top: 4px; }
.row-scroll { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px; scrollbar-width: none; }
.row-scroll::-webkit-scrollbar { display: none; }
.row-scroll .card { flex: none; width: 128px; }
.sheet h3.block { font-size: 16px; font-weight: 800; margin: 22px 0 10px; }
.cta { position: sticky; bottom: calc(-24px - env(safe-area-inset-bottom)); margin: 18px -16px 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; gap: 8px; }
.cta .btn.secondary { width: 56px; flex: none; padding: 0; }
.look-row { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); text-align: left; width: 100%; }
.look-row .thumb { border-radius: 10px; }
.look-row .role { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.look-row .nm { font-size: 14px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.look-row .pr { font-size: 14px; font-weight: 800; white-space: nowrap; }

.opt-group { margin-top: 18px; }
.opt-group h3 { font-size: 14px; margin: 0 0 10px; color: var(--ink-2); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }

/* 시작 화면 */
.onboard { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.onboard-inner { max-width: 480px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top)) 20px 40px; }
.onboard .logo { font-size: 40px; font-weight: 800; letter-spacing: -0.05em; }
.onboard .lead { font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.35; margin: 18px 0 6px; }
.onboard .lead-sub { color: var(--ink-2); font-size: 15px; }
.step { margin-top: 32px; }
.step h2 { font-size: 15px; color: var(--ink-3); margin: 0 0 12px; font-weight: 700; }
.pick2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { text-align: left; border-radius: 18px; padding: 16px; border: 1.5px solid var(--line); background: var(--surface); }
.pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.pick b { display: block; font-size: 17px; }
.pick span { font-size: 13px; color: var(--ink-3); }
.style-pick { display: grid; gap: 10px; }
.style-pick .pick { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
.mini { display: flex; gap: 4px; }
.mini > div { width: 52px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--sunk); display: grid; place-items: center; }
.mini img { width: 100%; height: 100%; object-fit: cover; }
.mini .art { width: 70%; height: 70%; }
.onboard .privacy { margin-top: 20px; font-size: 12.5px; color: var(--ink-3); text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px); transform: translate(-50%, 20px); z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; display: flex; gap: 14px; align-items: center; opacity: 0; pointer-events: none; transition: .2s; max-width: calc(100% - 32px); width: max-content; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--accent-soft); font-weight: 700; text-decoration: underline; }

.footer { padding: 28px 16px 8px; font-size: 12px; color: var(--ink-3); line-height: 1.6; }

@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (min-width: 600px) { .look { width: 300px; } }

.section .notice { margin: 0; }

/* v2: 시작 단계, 브랜드, 옷장 */
.steps { display: flex; gap: 6px; margin-top: 18px; }
.steps i { width: 28px; height: 4px; border-radius: 99px; background: var(--line); }
.steps i.on { background: var(--ink); }
.order { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 12px; margin-left: 4px; vertical-align: 2px; }
.ob-cta { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 16px 0 calc(8px + env(safe-area-inset-bottom)); margin-top: 20px; background: linear-gradient(to top, var(--bg) 75%, transparent); }
.ob-cta .btn.secondary { width: auto; flex: none; padding: 0 18px; height: 52px; }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.mine { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; }
.ways { display: grid; gap: 10px; }
.way { display: grid; grid-template-columns: 24px 1fr; gap: 2px 12px; align-items: center; text-align: left; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.way svg { grid-row: span 2; color: var(--accent); }
.way b { font-size: 15px; }
.way span { font-size: 13px; color: var(--ink-3); }
.closet-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 8px; margin-top: 12px; }
.citem { text-align: left; min-width: 0; }
.citem .thumb { border-radius: 12px; }
.cname { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cbrand { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.tile-in { width: 100%; height: 100%; display: grid; place-items: center; overflow: hidden; }
.tile-in img { width: 100%; height: 100%; object-fit: cover; }
.tile-in .art { width: 62%; height: 62%; }
.sheet-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; margin-top: 8px; }
.sheet-links .link { padding: 10px 4px; }
.link.danger { color: var(--heart); }
.link[disabled] { color: var(--ink-3); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; border: 2px solid transparent; }
.sw i { width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.draft-preview { width: 140px; height: 168px; margin: 14px auto 0; border-radius: 16px; background: var(--sunk); display: grid; place-items: center; overflow: hidden; }
.draft-preview img { width: 100%; height: 100%; object-fit: cover; }
.draft-preview .art { width: 70%; height: 70%; }
.draft-photo { width: 96px; height: 116px; border-radius: 12px; overflow: hidden; margin-top: 10px; }
.draft-photo img { width: 100%; height: 100%; object-fit: cover; }
.toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; font-weight: 600; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.row-scroll .card .brand-name { margin-top: 8px; }

/* 내 옷 등록: 필수 종류 하나, 선택 사진·이름 */
.add-garment { margin-top: 18px; }
.closet-actions { display: grid; gap: 12px; margin-top: 24px; }
.closet-actions .link { min-height: 44px; }
.garment-card { padding: 10px; }
.garment-thumb { width: 100%; aspect-ratio: 3/4; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: var(--sunk); }
.garment-thumb img { width: 100%; height: 100%; object-fit: contain; }
.garment-thumb .art { width: 75%; height: 75%; margin: 0; }
.garment-card small { display: block; margin-top: 4px; color: var(--ink-3); font-size: 11px; }

// Runtime and generation share the same conservative exclusions. This is not visual recognition.

function productClassificationConflict(product) {
  const slot = SLOT_BY_ID[product?.slot];
  if (!slot) return null;
  const name = String(product.name || '').replace(/베스트\s*셀러/gi, ' ');
  const pants = /팬츠|바지|트라우저|\b(?:pants?|trousers?)\b/i.test(name);
  const vest = /베스트|조끼|\bvests?\b/i.test(name);
  const shirt = /셔츠|\bshirts?\b/i.test(
    name.replace(/티\s*셔츠|t-?shirts?|스웨트\s*셔츠|스웻\s*셔츠|sweat\s*shirts?/gi, ' '),
  );
  const outer = /재킷|자켓|jacket|코트|coat|오버셔츠|overshirt|셔켓|shacket|파카|parka|블루종|blouson|점퍼/i.test(name);
  const insulated = /패딩|다운|구스|푸퍼|프리마로프트|\b(?:down|puffer|padded)\b|insulat|primaloft/i.test(
    name.replace(/버튼\s*다운|button\s*down/gi, ' '),
  );
  const fleece = /플리스|후리스|fleece|베터\s*스웨터|better\s*sweater/i.test(name);
  const sweater = /니트|스웨터|knit|sweater/i.test(name);

  if (pants && slot.cat !== 'bottom') return 'category-conflict';
  if (vest && slot.shape !== 'vest' && !(slot.shape === 'cardigan' && /가디건|카디건|cardigan/i.test(name)))
    return 'shape-conflict';
  if (shirt && slot.cat === 'outer' && !outer) return 'shape-conflict';
  if (slot.shape === 'shirt' && /\bpk\b|피케|pique|카라\s*티|폴로\s*셔츠|polo\s*shirt/i.test(name))
    return 'shape-conflict';
  // A generic or fleece vest must not be presented as a padded/down vest.
  if (slot.id === 'm-downvest' && !insulated) return 'insulation-unverified';
  if (slot.id === 'm-vest' && (insulated || fleece)) return 'shape-conflict';
  // "Down Sweater" and knitted-shell down jackets have insulation evidence.
  if (slot.shape === 'down' && (fleece || sweater) && !insulated) return 'shape-conflict';
  return null;
}

function productExclusionReason(product) {
  const name = String(product?.name || '');
  if (
    /구두\s*주걱|슈혼|shoe\s*horn|슈\s*트리|shoe\s*tree|슈즈?\s*클리너|구두\s*약|가죽\s*클리너|가죽\s*크림|슈\s*케어|신발\s*관리|shoe\s*care|슈\s*레이스|신발\s*끈|깔창|인솔|insole|방수\s*스프레이/i.test(
      name,
    )
  )
    return 'care-tool';
  if (
    /키즈|아동|남아|여아|주니어|베이비|토들러|보이즈|걸즈|쇼트올|쇼트\s*올|\b(kids?|junior|baby|infant|toddler|shortall)\b/i.test(
      name,
    )
  )
    return 'childrenswear';
  if (!name || !Number.isFinite(product.price) || product.price <= 0) return 'incomplete';
  return productClassificationConflict(product);
}
function productEligible(product) {
  return !productExclusionReason(product);
}
function evidenceColor(product) {
  return product.colorSource === 'image' ? null : product.color;
}

    const snapshot = await new Promise((resolve, reject) => {
      const tx = db.transaction(['records', 'photos'], 'readonly');
      const records = tx.objectStore('records').getAll(),
        recordKeys = tx.objectStore('records').getAllKeys();
      const photos = tx.objectStore('photos').getAll(),
        photoKeys = tx.objectStore('photos').getAllKeys();
      tx.oncomplete = () =>
        resolve({
          records: records.result.map((value, index) => ({ key: recordKeys.result[index], value })),
          photos: photos.result.map((value, index) => ({ key: photoKeys.result[index], value })),
        });
      tx.onabort = () => reject(tx.error || new Error('저장 원문을 읽지 못했습니다. 원본은 변경하지 않았습니다.'));
    });
    return packBackup(
      {
        format: 'eoul-wardrobe-recovery',
        version: 2,
        exportedAt: new Date().toISOString(),
        legacyRaw,
        records: snapshot.records,
      },
      snapshot.photos.map((row) => ({
        id: row.key,
        ...(row.value instanceof Blob ? { blob: row.value } : { value: row.value }),
      })),
    );
  }

  return {
    load,
    read,
    commit,
    backup,
    recoveryState,
    recover,
    recoveryBackup,
    currentEpoch: () => observedEpoch,
    close() {
      connection?.close();
      connection = null;
    },
  };
}

async function parseLegacyWardrobeBackup(text) {
  if (text.length > 10000000) throw new Error('이전 JSON 백업이 너무 큽니다. 개발 지원으로 원본을 보존해 주세요.');
  const backup = JSON.parse(text);
  if (
    !backup ||
    backup.format !== 'eoul-wardrobe-backup' ||
    backup.version !== 1 ||
    Object.keys(backup).some((key) => !['format', 'version', 'exportedAt', 'state', 'photos'].includes(key))
  )
    throw new Error('지원하는 옷장 백업 파일이 아닙니다.');
  validateWardrobe(backup.state);
  if (!Array.isArray(backup.photos) || backup.photos.length > 200) throw new Error('백업 사진 목록을 읽지 못했습니다.');
  const refs = new Set(backup.state.garments.map((garment) => garment.photoId).filter(Boolean));
  const assets = [],
    ids = new Set();
  for (const value of backup.photos) {
    if (
      !value ||
      Object.keys(value).some((key) => !['id', 'type', 'base64'].includes(key)) ||
      !refs.has(value.id) ||
      ids.has(value.id) ||
      value.type !== 'image/jpeg' ||
      typeof value.base64 !== 'string' ||
      value.base64.length > Math.ceil(MAX_GARMENT_PHOTO_BYTES / 3) * 4
    )
      throw new Error('백업 사진 정보가 올바르지 않습니다.');
    const decoded = Uint8Array.from(atob(value.base64), (character) => character.charCodeAt(0));
    const asset = await photoAsset(new Blob([decoded], { type: value.type }));
    if (asset.id !== value.id) throw new Error('백업 사진이 변경되거나 손상됐습니다.');
    ids.add(asset.id);
    assets.push(asset);
  }
  if (refs.size !== ids.size) throw new Error('백업에 필요한 사진이 빠져 있습니다.');
  return { state: backup.state, assets };
}

async function parseWardrobeBackup(file) {
  if (typeof file === 'string') return parseLegacyWardrobeBackup(file);
  if (!(file instanceof Blob) || file.size > MAX_BACKUP_FILE_BYTES)
    throw new Error('지원 크기를 넘거나 읽을 수 없는 백업 파일입니다.');
  const header = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  if (new TextDecoder().decode(header.subarray(0, 8)) !== BACKUP_MAGIC) {
    if (file.size > 10000000) throw new Error('이전 JSON 백업이 너무 큽니다. 개발 지원으로 원본을 보존해 주세요.');
    return parseLegacyWardrobeBackup(await file.text());
  }
  if (header.length !== 12) throw new Error('백업 파일의 머리 부분이 손상됐습니다.');
  const length = new DataView(header.buffer).getUint32(8, true);
  if (!length || length > MAX_BACKUP_MANIFEST_BYTES || file.size < 12 + length)
    throw new Error('백업 기록의 길이가 올바르지 않습니다.');
  const backup = JSON.parse(await file.slice(12, 12 + length).text());
  if (
    !backup ||
    backup.format !== 'eoul-wardrobe-backup' ||
    backup.version !== 2 ||
    Object.keys(backup).some((key) => !['format', 'version', 'exportedAt', 'state', 'photos'].includes(key))
  )
    throw new Error('지원하는 옷장 백업 파일이 아닙니다.');
  validateWardrobe(backup.state);
  if (!Array.isArray(backup.photos) || backup.photos.length > 200)
    throw new Error('백업 사진 목록이 올바르지 않습니다.');
  const refs = new Set(backup.state.garments.map((garment) => garment.photoId).filter(Boolean));
  const assets = [],
    ids = new Set();
  let offset = 0;
  for (const row of backup.photos) {
    if (
      !row ||
      Object.keys(row).some((key) => !['id', 'type', 'offset', 'bytes'].includes(key)) ||
      !refs.has(row.id) ||
      ids.has(row.id) ||
      row.type !== 'image/jpeg' ||
      row.offset !== offset ||
      !Number.isSafeInteger(row.bytes) ||
      row.bytes < 3 ||
      row.bytes > MAX_GARMENT_PHOTO_BYTES ||
      12 + length + offset + row.bytes > file.size
    )
      throw new Error('백업 사진의 구간 정보가 올바르지 않습니다.');
    const asset = await photoAsset(file.slice(12 + length + offset, 12 + length + offset + row.bytes, row.type));
    if (asset.id !== row.id) throw new Error('백업 사진이 변경되거나 손상됐습니다.');
    ids.add(asset.id);
    assets.push(asset);
    offset += row.bytes;
  }
  if (ids.size !== refs.size || 12 + length + offset !== file.size)
    throw new Error('백업 사진이 빠지거나 불필요한 내용이 포함돼 있습니다.');
  return { state: backup.state, assets };
}

// Call only after showing this scope, confirming twice, stopping saves and closing
// this tab's store connections. Other wardrobe tabs must be closed by the user.
// Transactions are atomic within one database; this entire operation is not.
const WARDROBE_ERASE_SCOPE = Object.freeze({
  databases: Object.freeze(['eoul-wardrobe-v2', 'eoul']),
  localStorageKeys: Object.freeze(['eoul:v1', 'eoul:v2', 'eoul:v2:unreadable']),
});

const DATABASE_VERSION = 1;
const DEFAULT_TIMEOUT_MS = 5000;
const finished = (entry) => entry.status === 'cleared' || entry.status === 'absent' || entry.status === 'removed';

function failure(code, status, phase, reason, cause) {
  return { code, status, phase, reason, cause };
}

function clearDatabase(indexedDB, name, timeoutMs) {
  return new Promise((resolve, reject) => {
    let request,
      db,
      tx,
      settled = false,
      missing = false,
      blocked = false,
      transactionFailure;
    const close = () => {
      try {
        db?.close();
      } catch {
        /* Already closed. */
      }
    };
    const finish = (outcome, failed = false) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      close();
      if (failed) reject(outcome);
      else resolve(outcome);
    };
    const timer = setTimeout(() => {
      // An IDB open cannot be cancelled. Its late success closes the connection;
      // its late upgrade is aborted. Clear transactions can be aborted. Never
      // start deleteDatabase: a blocked deletion could run after reporting failure.
      try {
        tx?.abort();
      } catch {
        /* Completion might already be queued. */
      }
      finish(
        failure(
          blocked ? 'blocked' : 'timeout',
          'uncertain',
          blocked ? 'blocked' : tx ? 'clearing' : 'opening',
          blocked
            ? '다른 옷장 탭 때문에 제한 시간 안에 저장소에 접근하지 못했습니다.'
            : '저장소 작업의 완료를 제한 시간 안에 확인하지 못했습니다.',
        ),
        true,
      );
    }, timeoutMs);

    try {
      request = indexedDB.open(name, DATABASE_VERSION);
    } catch (cause) {
      finish(failure('open-failed', 'retained', 'opening', '저장소를 열지 못해 삭제하지 않았습니다.', cause), true);
      return;
    }

    request.onblocked = () => {
      blocked = true;
    };
    request.onupgradeneeded = () => {
      // Opening a missing DB would create an empty DB. Abort instead, including
      // upgrades arriving after the timeout; no empty legacy DB is left behind.
      missing = true;
      db = request.result;
      try {
        request.transaction.abort();
      } catch (cause) {
        finish(
          failure('open-failed', 'uncertain', 'opening', '빈 저장소 생성 취소 여부를 확인하지 못했습니다.', cause),
          true,
        );
      }
    };
    request.onerror = () => {
      if (settled) return;
      if (missing && request.error?.name === 'AbortError') {
        finish({ status: 'absent', phase: 'complete', reason: '저장소가 없어 삭제할 자료가 없습니다.' });
        return;
      }
      const higherVersion = request.error?.name === 'VersionError';
      finish(
        failure(
          higherVersion ? 'higher-version' : 'open-failed',
          'retained',
          'opening',
          higherVersion ? '더 최신 버전의 저장소라서 원본을 보존했습니다.' : '저장소를 열지 못해 삭제하지 않았습니다.',
          request.error,
        ),
        true,
      );
    };
    request.onsuccess = () => {
      db = request.result;
      if (settled) {
        close();
        return;
      }
      db.onversionchange = () => {
        try {
          tx?.abort();
        } catch {
          /* The exact completion state is uncertain. */
        }
        finish(
          failure(
            'version-change',
            'uncertain',
            tx ? 'clearing' : 'opening',
            '다른 탭에서 저장소 버전이 바뀌어 삭제 완료를 확인하지 못했습니다.',
          ),
          true,
        );
      };
      const stores = [...db.objectStoreNames];
      if (!stores.length) {
        finish({ status: 'cleared', phase: 'complete', reason: '저장소에 보관된 자료가 없습니다.' });
        return;
      }
      try {
        tx = db.transaction(stores, 'readwrite');
        tx.oncomplete = () =>
          finish({ status: 'cleared', phase: 'complete', reason: '기록·사진·저장 원문을 모두 삭제했습니다.' });
        tx.onabort = () =>
          finish(
            failure(
              'transaction-failed',
              'retained',
              'clearing',
              '삭제 작업이 취소되어 이 저장소의 자료는 보존됐습니다.',
              transactionFailure || tx.error,
            ),
            true,
          );
        for (const store of stores) tx.objectStore(store).clear();
      } catch (cause) {
        if (!tx) {
          finish(
            failure(
              'transaction-failed',
              'retained',
              'clearing',
              '삭제 작업을 시작하지 못해 이 저장소의 자료는 보존됐습니다.',
              cause,
            ),
            true,
          );
          return;
        }
        transactionFailure = cause;
        try {
          tx.abort();
        } catch {
          finish(
            failure('transaction-failed', 'uncertain', 'clearing', '삭제 작업 취소 여부를 확인하지 못했습니다.', cause),
            true,
          );
        }
      }
    };
  });
}

function eraseError(result, cause) {
  result.ok = false;
  const entries = [...result.databases, ...result.localStorageEntries];
  result.mayRemain = entries.filter((entry) => !finished(entry)).map((entry) => entry.name || entry.key);
  result.uncertain = entries.filter((entry) => entry.status === 'uncertain').map((entry) => entry.name || entry.key);
  const done = entries.filter(finished).map((entry) => entry.name || entry.key);
  const message = result.mayRemain.length
    ? `전체 삭제를 완료하지 못했습니다. ${done.length ? `삭제 완료 또는 자료 없음: ${done.join(', ')}. ` : ''}남아 있거나 삭제 여부를 확인하지 못한 범위: ${result.mayRemain.join(', ')}. 다른 옷장 탭을 모두 닫은 뒤 다시 시도해 주세요.`
    : '각 저장 범위는 삭제된 상태로 확인됐지만 삭제 작업 중 오류가 발생했습니다. 완료 상태를 다시 확인해 주세요.';
  const error = new Error(message, { cause });
  error.name = 'WardrobeEraseError';
  error.code = entries.find((entry) => entry.code)?.code || 'erase-failed';
  // A detached snapshot cannot later turn into success when a delayed IDB event
  // arrives. It contains only scope/status metadata, never customer record values.
  error.result = structuredClone(result);
  return error;
}

async function eraseWardrobeData(options = {}) {
  const localStorageEntries = WARDROBE_ERASE_SCOPE.localStorageKeys.map((key) => ({
    key,
    status: 'not-started',
    phase: 'not-started',
  }));
  const result = {
    ok: false,
    databases: WARDROBE_ERASE_SCOPE.databases.map((name) => ({ name, status: 'not-started', phase: 'not-started' })),
    localStorageEntries,
    // Compatibility alias; all scope reporting must use localStorageEntries.
    localStorage: localStorageEntries[0],
    mayRemain: [],
    uncertain: [],
  };
  let indexedDB, localStorage, timeoutMs, inspectedEntry;
  try {
    indexedDB = Object.hasOwn(options, 'indexedDB') ? options.indexedDB : globalThis.indexedDB;
    localStorage = Object.hasOwn(options, 'localStorage') ? options.localStorage : globalThis.localStorage;
    timeoutMs = options.timeoutMs ?? DEFAULT_TIMEOUT_MS;
    if (!Number.isSafeInteger(timeoutMs) || timeoutMs < 1) throw new Error('삭제 확인 제한 시간이 올바르지 않습니다.');
    if (!indexedDB?.open || !localStorage?.getItem || !localStorage?.removeItem)
      throw new Error('브라우저 저장소에 접근할 수 없습니다.');
    // Check every allowed source before any database mutation. A source that
    // cannot be inspected must not be silently left behind by a success result.
    for (const entry of localStorageEntries) {
      inspectedEntry = entry;
      entry.status = localStorage.getItem(entry.key) === null ? 'absent' : 'retained';
    }
  } catch (cause) {
    Object.assign(inspectedEntry || localStorageEntries[0], {
      status: 'uncertain',
      code: 'unavailable',
      reason: '브라우저 저장소에 접근하지 못했습니다.',
    });
    throw eraseError(result, cause);
  }

  for (const entry of result.databases) {
    try {
      Object.assign(entry, await clearDatabase(indexedDB, entry.name, timeoutMs));
    } catch ({ cause, ...outcome }) {
      Object.assign(entry, outcome);
      throw eraseError(result, cause);
    }
  }

  // Keep every migration/raw-recovery source until BOTH DB transactions finish.
  // Removal is sequential so a partial failure can report each exact key.
  for (const entry of localStorageEntries) {
    try {
      localStorage.removeItem(entry.key);
      if (localStorage.getItem(entry.key) !== null) throw new Error('이전 기록 키의 삭제가 반영되지 않았습니다.');
      Object.assign(entry, { status: 'removed', phase: 'complete', reason: '이전 기록 키를 삭제했습니다.' });
    } catch (cause) {
      let status = 'uncertain';
      try {
        status = localStorage.getItem(entry.key) === null ? 'removed' : 'retained';
      } catch {
        /* Access itself may have failed. */
      }
      Object.assign(entry, {
        status,
        phase: 'removing',
        code: 'storage-failed',
        reason: '이전 기록 키의 삭제 완료를 확인하지 못했습니다.',
      });
      throw eraseError(result, cause);
    }
  }
  result.ok = true;
  return result;
}

async function prepareGarmentPhoto(file) {
  if (!file || !['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) throw new Error('JPG·PNG·WebP 사진을 골라 주세요. HEIC 사진은 JPG로 변환해 주세요.');
  if (file.size > 25000000) throw new Error('25MB 이하 사진을 골라 주세요.');
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    if (!image.naturalWidth || !image.naturalHeight) throw new Error('사진을 읽지 못했습니다. 다른 사진을 골라 주세요.');
    const scale = Math.min(1, 1024 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('사진을 준비하지 못했습니다.');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', .82));
    if (!blob || blob.size > MAX_GARMENT_PHOTO_BYTES) throw new Error('사진 용량을 줄여 다시 골라 주세요.');
    return photoAsset(blob);
  } finally { URL.revokeObjectURL(url); }
}

async function readLegacyPhotos(ids, indexedDB = globalThis.indexedDB) {
  if (!ids.length) return new Map();
  const db = await new Promise((resolve, reject) => {
    const req = indexedDB.open('eoul');
    let settled = false;
    const timeout = setTimeout(() => {
      settled = true;
      reject(new Error('이전 사진 저장소를 열지 못했습니다. 다른 탭을 닫고 다시 시도해 주세요.'));
    }, 5000);
    let absent = false;
    req.onupgradeneeded = () => {
      absent = true;
      req.transaction.abort();
    }; // Never create or upgrade the source DB.
    req.onerror = () => {
      clearTimeout(timeout);
      if (absent) {
        resolve(null);
        return;
      }
      reject(new Error('이전 사진 저장소가 없습니다. 원본을 변경하지 않았습니다.'));
    };
    req.onsuccess = () => {
      clearTimeout(timeout);
      if (settled) {
        req.result.close();
        return;
      }
      resolve(req.result);
    };
  });
  if (!db) return new Map();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction('photos', 'readonly'),
        rows = new Map();
      let failure;
      for (const id of ids) {
        const req = tx.objectStore('photos').get(id);
        req.onsuccess = () => {
          if (req.result !== undefined) rows.set(id, req.result);
        };
      }
      tx.oncomplete = () => resolve(rows);
      tx.onabort = () => reject(failure || tx.error);
    });
  } finally {
    db.close();
  }
}
async function prepareLegacyWardrobe(raw, indexedDB = globalThis.indexedDB) {
  const state = migrateLegacyWardrobe(raw),
    assets = [];
  const old = raw === null ? null : JSON.parse(raw);
  const ids = old?.v === 2 ? old.closet.filter((i) => i.photo).map((i) => i.id) : [];
  const photos = await readLegacyPhotos(ids, indexedDB);
  for (const [id, data] of photos) {
    if (!/^data:image\/jpeg;base64,[A-Za-z0-9+/]*={0,2}$/.test(data) || data.length > 1100000)
      throw new Error('이전 사진 형식이나 크기를 확인해 주세요. 원본은 유지됩니다.');
    const asset = await photoAsset(
      new Blob([Uint8Array.from(atob(data.split(',')[1]), (c) => c.charCodeAt(0))], { type: 'image/jpeg' }),
    );
    const item = state.garments.find((i) => i.id === id);
    item.photoId = asset.id;
    item.photoMissing = false;
    if (!assets.some((a) => a.id === asset.id)) assets.push(asset);
  }
  state.legacyFingerprint = await legacyWardrobeFingerprint(raw);
  return { state, assets, missing: ids.filter((id) => !photos.has(id)) };
}

const BRAND_ALIASES = {
  '폴로 랄프 로렌': ['폴로', '랄프로렌', '랄프 로렌', 'polo', 'ralph'], '리바이스': ['levis', "levi's", '리바이스'], '칼하트': ['carhartt', '칼하트'],

  '노스페이스': ['north face', '노페', '노스페이스'], '뉴발란스': ['new balance', '뉴발'], '레드윙': ['red wing', '레드윙'], '파타고니아': ['patagonia', '파타고니아'],
  '아크테릭스': ['arcteryx', '아크'], '닥터마틴': ['dr.martens', '닥마', '닥터마틴'], '컨버스': ['converse', '컨버스'], '디키즈': ['dickies', '디키즈'],
};

// "X에 어울리는 Y", "X랑 입을 Y", "X와 매치할 Y"
const ANCHOR_SPLIT = /(.+?)(?:에|랑|이랑|하고|와|과|이랑도|에도)\s*(?:잘\s*)?(?:어울리는|어울릴|맞는|입을|신을|매치할|매치하기\s*좋은|코디할|같이\s*입을|받쳐\s*입을)\s*(.*)/;

function itemMatchers(text) {
  const matched = [];
  for (const [re, fn, label] of ITEM_WORDS) {
    if (re.test(text)) {
      matched.push({ fn, label });
      text = text.replace(re, ' ');
    }
  }
  return matched;
}

function objectParticle(word) {
  const code = word.trim().slice(-1).charCodeAt(0) - 0xac00;
  if (code < 0 || code > 11171) return '를';
  return code % 28 ? '을' : '를';
}

function firstMatch(table, text) {
  for (const [re, value, label] of table) if (re.test(text)) return { value, label };
  return null;
}

function parseQuery(raw = '', { brands = [] } = {}) {
  let text = ` ${raw.trim().toLowerCase()} `;
  const terms = [];

  // 브랜드: 긴 이름부터 찾고, 찾은 글자는 아이템 단어 해석에서 뺀다
  let brand = null;
  const candidates = brands.flatMap((b) => [b, ...(BRAND_ALIASES[b] || [])].map((alias) => [alias.toLowerCase(), b]))
    .sort((a, b) => b[0].length - a[0].length);
  for (const [alias, name] of candidates) {
    if (alias.length < 2) continue;
    if (text.includes(alias)) {
      brand = name;
      text = text.replace(alias, ' ');
      terms.push(name);
      break;
    }
  }

  let anchorText = '';
  let targetText = text;
  const split = text.match(ANCHOR_SPLIT);
  if (split) {
    anchorText = split[1];
    targetText = split[2] || '';
  }

  const anchors = itemMatchers(anchorText);
  const targets = itemMatchers(targetText);
  for (const a of anchors) terms.push(`${a.label}와 함께`);
  for (const t of targets) terms.push(t.label);

  const occ = firstMatch(OCCASION_WORDS, text);
  if (occ) terms.push(occ.label);
  const season = firstMatch(SEASON_WORDS, text);
  if (season) terms.push(season.label);
  const style = firstMatch(STYLE_WORDS, text);
  if (style) terms.push(style.label);
  const color = firstMatch(COLOR_WORDS, targetText);
  if (color) terms.push(color.label);

  let gender = null;
  if (/여자|여성|여친|여자친구/.test(text)) gender = 'F';
  else if (/남자|남성|남친|남자친구/.test(text)) gender = 'M';

  let maxPrice = null;
  const won = text.match(/(\d+(?:\.\d+)?)\s*만\s*(?:원)?\s*(대)?/);
  const plain = text.match(/(\d{1,3}(?:,\d{3})+|\d{4,7})\s*원/);
  if (won) {
    const n = parseFloat(won[1]);
    maxPrice = Math.round(n * 10000) + (won[2] ? (n < 10 ? 9999 : 99999) : 0);
  } else if (plain) {
    maxPrice = parseInt(plain[1].replaceAll(',', ''), 10);
  }
  const ascendingPrice = /최저\s*가|낮은\s*가격\s*순|가격\s*낮은\s*순|가격\s*오름차순/.test(text);
  const plainPriceOrder = /가격\s*순/.test(text) && !/높은\s*가격\s*순/.test(text);
  const priceSort = ascendingPrice || plainPriceOrder ? 'asc' : null;
  const cheap = /저렴|가성비|싼|저가|부담\s*없/.test(text);
  const premium = /고급|명품|비싸도|좋은\s*거|퀄리티|오래\s*입을/.test(text);
  if (!maxPrice && cheap && !priceSort) maxPrice = 60000;
  if (maxPrice) terms.push(`${Math.round(maxPrice / 10000)}만원 이하`);
  if (premium) terms.push('품질 우선');
  if (priceSort) terms.push('낮은 가격순');

  const occLabel = { work: '출근', formal: '격식 있는 자리', date: '데이트', weekend: '주말', daily: '데일리' }[occ?.value] || '';
  const what = targets.map((t) => t.label).join('·') || (anchors.length ? '함께 입을 아이템' : '');
  const brandLabel = brand ? `${brand} ` : '';
  let summary = '';
  if (what || occLabel || brand || style) {
    const noun = `${brandLabel}${what || '아이템'}`;
    const head = [
      anchors.length ? `${anchors.map((a) => a.label).join('·')}에 어울리는` : '',
      season ? season.label : '',
      style && !what.includes(style.label) ? style.label : '',
      occLabel ? `${occLabel}용` : '',
      color ? color.label : '',
      noun,
    ].filter(Boolean).join(' ');
    summary = `${head}${objectParticle(noun)} ${maxPrice ? `${Math.round(maxPrice / 10000)}만원 이하로 ` : ''}${priceSort ? '낮은 가격순으로 ' : ''}골랐어요`;
  }

  return {
    raw,
    summary,
    terms,
    occasion: occ?.value || null,
    season: season?.value || null,
    style: style?.value || null,
    color: color?.value || null,
    gender,
    maxPrice,
    priceSort,
    premium,
    brand,
    slotNamed: targets.length > 0,
    anchorMatch: (slot) => anchors.some((a) => a.fn(slot)),
    targetMatch: (slot) => targets.some((t) => t.fn(slot)),
  };
}

// 같은 입력이면 같은 결과가 나오는 규칙 기반 계산이며, 개인 정보는 이 기기 밖으로 나가지 않는다.







const SAFE_PRODUCTS = PRODUCTS.filter(productEligible);

const SEASON_LABEL = { spring: '봄', summer: '여름', fall: '가을', winter: '겨울' };

function seasonOf(date = new Date()) {
  const m = date.getMonth() + 1;
  if (m >= 3 && m <= 5) return 'spring';
  if (m >= 6 && m <= 8) return 'summer';
  if (m >= 9 && m <= 11) return 'fall';
  return 'winter';
}

// 받침 여부로 조사를 고른다: 치노와 / 재킷과
function josa(word, withFinal, withoutFinal) {
  const ch = String(word).trim().slice(-1);
  const code = ch.charCodeAt(0) - 0xac00;
  if (code < 0 || code > 11171) return withoutFinal;
  return code % 28 ? withFinal : withoutFinal;
}

function formatPrice(n) {
  return `${n.toLocaleString('ko-KR')}원`;
}

const PRODUCTS_BY_SLOT = SAFE_PRODUCTS.reduce((acc, p) => {
  (acc[p.slot] ||= []).push(p);
  return acc;
}, {});
const PRODUCT_BY_ID = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));

// 브랜드 목록: 성별마다 상품 수가 많은 순서
function brandsFor(gender) {
  const counts = {};
  for (const p of SAFE_PRODUCTS) if (SLOT_BY_ID[p.slot].g === gender) counts[p.brand] = (counts[p.brand] || 0) + 1;
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([name, count]) => ({ name, count }));
}

// 브랜드가 어떤 스타일에 가까운지: 그 브랜드 상품들이 속한 아이템 종류의 스타일 점수 평균
function brandStyleAffinity(brand, gender, style) {
  const list = SAFE_PRODUCTS.filter((p) => p.brand === brand && SLOT_BY_ID[p.slot].g === gender);
  if (!list.length) return 0;
  return list.reduce((s, p) => s + (SLOT_BY_ID[p.slot].style[style] || 0), 0) / list.length;
}

function quality(p) {
  const rating = p.rating ?? 4.4;
  return rating * Math.log10((p.reviews || 0) + (p.likes || 0) / 8 + 10);
}

const light = (c) => COLORS[c]?.light ?? 50;

// 색 조화: 포인트 색은 하나까지, 상·하의는 밝기 차이가 있을 때 정돈돼 보인다
function harmony(entries, { tonal = false } = {}) {
  const colors = entries.map((e) => e.color).filter(Boolean);
  let score = 0;
  const accents = colors.filter((c) => COLORS[c] && !COLORS[c].neutral).length;
  score -= Math.max(0, accents - 1) * 2;
  const top = entries.find((e) => e.cat === 'top' || e.cat === 'dress');
  const bottom = entries.find((e) => e.cat === 'bottom');
  if (top?.color && bottom?.color) {
    const d = Math.abs(light(top.color) - light(bottom.color));
    if (!tonal && d >= 25) score += 1;
    if (!tonal && top.color === bottom.color && top.color !== 'indigo') score -= 1;
    if (tonal && d < 25) score += 0.5;
  }
  return score;
}

function ctx(state) {
  const gender = state.gender || 'M';
  const styles = (state.styles?.length ? state.styles : [state.style || 'classic']).filter((s) =>
    STYLES[s]?.g.includes(gender),
  );
  const closet = (state.closet || [])
    .map((i) => ({ ...i, gender: i.gender || SLOT_BY_ID[i.slot]?.g }))
    .filter((i) => i.gender === gender);
  return {
    gender,
    styles: styles.length ? styles : [gender === 'F' ? 'classic' : 'classic'],
    occasion: state.occasion || null,
    season: state.season || seasonOf(state.now ? new Date(state.now) : new Date()),
    maxPrice: state.budget || null,
    closet,
    ownedSlots: new Set([
      ...SLOTS.filter((s) => wardrobeSlotStatus(closet, s) === 'confirmed').map((s) => s.id),
      ...(state.owned || []),
    ]),
    brands: new Set(state.brands || []),
    brandOnly: !!state.brandOnly && (state.brands || []).length > 0,
    hidden: new Set(state.hidden || []),
  };
}

function styleScore(slot, styles) {
  let best = 0;
  styles.forEach((s, i) => {
    best = Math.max(best, (slot.style[s] || 0) * (i === 0 ? 1 : 0.85));
  });
  return best;
}

function productsFor(
  slotId,
  {
    maxPrice = null,
    hidden = new Set(),
    color = null,
    brands = new Set(),
    brandOnly = false,
    season = null,
    brand = null,
  } = {},
) {
  const hide = hidden instanceof Set ? hidden : new Set(hidden);
  return (PRODUCTS_BY_SLOT[slotId] || [])
    .filter(
      (p) =>
        !hide.has(p.id) &&
        (!maxPrice || p.price <= maxPrice) &&
        (!color || evidenceColor(p) === color) &&
        (!brand || p.brand === brand) &&
        (!brandOnly || brands.has(p.brand)) &&
        (!season || season === 'summer' || !p.summer),
    )
    .sort((a, b) => brands.has(b.brand) - brands.has(a.brand) || quality(b) - quality(a) || a.price - b.price);
}

function productOpts(c, extra = {}) {
  return {
    maxPrice: c.maxPrice,
    hidden: c.hidden,
    brands: c.brands,
    brandOnly: c.brandOnly,
    season: c.season,
    ...extra,
  };
}

function roleOf(look, role) {
  const r = look.roles[role];
  if (!r) return null;
  return Array.isArray(r) ? { s: r, c: [] } : r;
}

function slotsInLook(look) {
  return ROLE_ORDER.flatMap((r) => roleOf(look, r)?.s || []);
}

function matchingLooks(c, { occasion = c.occasion, anySeason = false } = {}) {
  return LOOKS.filter(
    (l) =>
      l.g === c.gender &&
      l.styles.some((s) => c.styles.includes(s)) &&
      (anySeason || l.seasons.includes(c.season)) &&
      (!occasion || l.occ.includes(occasion)),
  );
}

function shortName(slot) {
  return SHORT[slot.id] || slot.name.split('·')[0];
}

// 한 아이템 종류의 점수와 이유
function scoreSlot(slot, c, looks = matchingLooks(c)) {
  const st = styleScore(slot, c.styles);
  let score = st * 2;
  const reasons = [];
  const inSeason = slot.seasons.includes(c.season);
  score += inSeason ? 2 : -6;
  if (c.occasion) score += slot.occ.includes(c.occasion) ? 2.5 : -2;

  const pairs = new Map();
  let lookCount = 0;
  for (const look of looks) {
    const ids = slotsInLook(look);
    if (!ids.includes(slot.id)) continue;
    lookCount += 1;
    for (const item of c.closet)
      if (
        ids.some((id) => id !== slot.id && SLOT_BY_ID[id].cat !== slot.cat && garmentMatchesSlot(item, SLOT_BY_ID[id]))
      )
        pairs.set(item.id, item);
  }
  score += Math.min(lookCount, 3);
  score += Math.min(pairs.size, 4) * 1.5;

  if (pairs.size) {
    const names = [...pairs.values()].slice(0, 2).map(garmentLabel);
    const last = names[names.length - 1];
    reasons.push(`가진 ${names.join('·')}${josa(last, '과', '와')} 함께 쓰는 코디 공식이 있어요`);
  }
  const top = c.styles.find((s) => slot.style[s] === 3);
  if (top) reasons.push(`${STYLES[top].label} 옷장의 기본이에요`);
  if (c.occasion && slot.occ.includes(c.occasion)) reasons.push(`${OCCASIONS[c.occasion]}에 잘 맞아요`);
  return { score, reasons, pairs: [...pairs.keys()], inSeason };
}

const CAT_LIMIT = { acc: 1 };

// 지금 사면 좋은 아이템
function recommendItems(state, { limit = 8 } = {}) {
  const c = ctx(state);
  const looks = matchingLooks(c);
  const ranked = SLOTS.filter((s) => s.g === c.gender && !c.ownedSlots.has(s.id))
    .map((slot) => ({ slot, ...scoreSlot(slot, c, looks) }))
    .filter((r) => r.inSeason && r.score > 3)
    .sort((a, b) => b.score - a.score);

  const out = [];
  const perCat = {};
  const perBrand = {};
  for (const r of ranked) {
    const products = productsFor(r.slot.id, productOpts(c));
    if (!products.length) continue;
    if ((perCat[r.slot.cat] || 0) >= (CAT_LIMIT[r.slot.cat] ?? 2)) continue;
    perCat[r.slot.cat] = (perCat[r.slot.cat] || 0) + 1;
    // 선호 브랜드가 없으면 한 브랜드가 목록을 채우지 않도록 두 번까지만 먼저 고른다
    const product = c.brands.size ? products[0] : products.find((p) => (perBrand[p.brand] || 0) < 2) || products[0];
    perBrand[product.brand] = (perBrand[product.brand] || 0) + 1;
    const pair = r.reasons.find((x) => x.startsWith('가진 '));
    const reasons = pair ? [pair, r.slot.why] : [r.slot.why, ...r.reasons];
    const ownership = wardrobeSlotStatus(c.closet, r.slot);
    out.push({
      slot: r.slot,
      product,
      alternatives: products.filter((p) => p !== product).slice(0, 6),
      score: r.score,
      ownership,
      reasons:
        ownership === 'uncertain'
          ? [`비슷한 종류가 있어요. ${shortName(r.slot)}인지 먼저 확인해요`, ...reasons].slice(0, 2)
          : reasons.slice(0, 2),
    });
    if (out.length >= limit) break;
  }
  return out;
}

// 코디 공식의 역할을 가진 옷과 상품으로 채운다
// ownedOnly: 가진 옷만으로, maxBuy: 새로 살 아이템 수 한도.
// Search anchors only select formulas; they never create an owned garment.
function fillLook(
  look,
  c,
  { forceOwned = new Set(), ownedOnly = false, maxBuy = Infinity, anchorItem = null, pinnedProduct = null } = {},
) {
  const items = [],
    used = new Set();
  const tonal = c.styles[0] === 'minimal' || look.styles[0] === 'minimal';
  let buys = 0;
  for (const role of ROLE_ORDER) {
    const r = roleOf(look, role);
    if (!r) continue;
    const optional = role === 'acc' || (role === 'inner' && ownedOnly);
    const anchorChoices = r.s.filter((id) => forceOwned.has(id));
    const candidates =
      anchorChoices.length && !items.some((i) => anchorChoices.includes(i.slot.id)) ? anchorChoices : r.s;
    const inSeason = candidates.filter((id) => SLOT_BY_ID[id].seasons.includes(c.season));
    const current = items.map((i) => ({ color: i.color, cat: i.slot.cat }));

    // 1) 기준 아이템 · 가진 옷
    if (
      pinnedProduct &&
      candidates.includes(pinnedProduct.slot) &&
      !c.closet.some((i) => i.productId === pinnedProduct.id)
    ) {
      if (ownedOnly || buys >= maxBuy) return null;
      items.push({
        role,
        slot: SLOT_BY_ID[pinnedProduct.slot],
        owned: false,
        product: pinnedProduct,
        color: evidenceColor(pinnedProduct),
      });
      buys++;
      continue;
    }
    if (
      anchorItem &&
      !used.has(anchorItem.id) &&
      candidates.some((id) => garmentMatchesSlot(anchorItem, SLOT_BY_ID[id]))
    ) {
      const id = candidates.find((id) => garmentMatchesSlot(anchorItem, SLOT_BY_ID[id]));
      const certainty = garmentSlotStatus(anchorItem, SLOT_BY_ID[id]);
      if (ownedOnly && certainty !== 'confirmed') return null;
      items.push({ role, slot: SLOT_BY_ID[id], owned: true, item: anchorItem, color: anchorItem.color, certainty });
      used.add(anchorItem.id);
      continue;
    }
    const ownedItems = c.closet
      .filter(
        (i) =>
          !used.has(i.id) &&
          candidates.some(
            (id) =>
              garmentMatchesSlot(i, SLOT_BY_ID[id]) &&
              (!ownedOnly || garmentSlotStatus(i, SLOT_BY_ID[id]) === 'confirmed'),
          ),
      )
      .map((i) => ({ ...i, matchedSlot: i.slot || candidates.find((id) => garmentMatchesSlot(i, SLOT_BY_ID[id])) }));
    if (ownedItems.length) {
      const best = ownedItems
        .map((i) => ({
          i,
          s:
            harmony([...current, { color: i.color, cat: SLOT_BY_ID[i.matchedSlot].cat }], { tonal }) +
            (r.c.includes(i.color) ? 1 : 0) +
            (i.slot ? 3 : 0) -
            r.s.indexOf(i.matchedSlot) * 0.3,
        }))
        .sort((a, b) => b.s - a.s)[0].i;
      items.push({
        role,
        slot: SLOT_BY_ID[best.matchedSlot],
        owned: true,
        item: best,
        color: best.color,
        certainty: garmentSlotStatus(best, SLOT_BY_ID[best.matchedSlot]),
      });
      used.add(best.id);
      continue;
    }
    if (!inSeason.length) continue; // 이 계절엔 필요 없는 역할(예: 여름 아우터)
    if (ownedOnly || buys >= maxBuy) {
      if (optional) continue;
      return null;
    }

    // 2) 상품: 품질·권장 색·색 조화·선호 브랜드를 함께 본다
    let best = null;
    inSeason.forEach((id, order) => {
      for (const p of productsFor(id, productOpts(c)).slice(0, 10)) {
        const s =
          quality(p) / 5 +
          (r.c.includes(evidenceColor(p)) ? 1.5 : 0) +
          harmony([...current, { color: evidenceColor(p), cat: SLOT_BY_ID[id].cat }], { tonal }) +
          (c.brands.has(p.brand) ? 2 : 0) -
          order * 0.4;
        if (!best || s > best.s) best = { s, p, id };
      }
    });
    if (best) {
      items.push({ role, slot: SLOT_BY_ID[best.id], owned: false, product: best.p, color: evidenceColor(best.p) });
      buys += 1;
    } else if (!optional) return null;
  }
  const buy = items.filter((i) => !i.owned);
  const requiredCats = [...new Set([...forceOwned].map((id) => SLOT_BY_ID[id]?.cat))];
  if (requiredCats.some((cat) => !items.some((i) => i.slot.cat === cat && forceOwned.has(i.slot.id)))) return null;
  return {
    look,
    items,
    ownedCount: items.length - buy.length,
    uncertainCount: items.filter((i) => i.owned && i.certainty === 'uncertain').length,
    buyCount: buy.length,
    buyTotal: buy.reduce((sum, i) => sum + i.product.price, 0),
    harmony: harmony(
      items.map((i) => ({ color: i.color, cat: i.slot.cat })),
      { tonal },
    ),
  };
}

function rankLooks(results, c) {
  return results
    .filter(Boolean)
    .map((r) => {
      const styleScoreLook = c.styles.indexOf(r.look.styles.find((s) => c.styles.includes(s)));
      const styleBonus = styleScoreLook === 0 ? 2 : 1;
      const occBonus = c.occasion && r.look.occ[0] === c.occasion ? 1.5 : 0;
      const ownedBonus = (r.ownedCount / r.items.length) * 4;
      return { ...r, score: styleBonus + occBonus + ownedBonus + r.harmony * 0.5 };
    })
    .sort((a, b) => b.score - a.score || a.buyTotal - b.buyTotal);
}

// 오늘의 코디 (사야 할 상품 포함)
function recommendLooks(
  state,
  { limit = 3, forceOwned = [], occasion, anchorItem = null, pinnedProduct = null } = {},
) {
  if (pinnedProduct && !productEligible(pinnedProduct)) return [];
  const c = ctx(state);
  const force = new Set(forceOwned);
  let looks = matchingLooks(c, { occasion: occasion ?? c.occasion });
  if (!looks.length) looks = matchingLooks(c, { occasion: null });
  if (force.size) {
    const cats = [...new Set([...force].map((id) => SLOT_BY_ID[id]?.cat))];
    looks = looks.filter((l) =>
      cats.every((cat) => slotsInLook(l).some((id) => force.has(id) && SLOT_BY_ID[id].cat === cat)),
    );
  }
  if (anchorItem)
    looks = looks.filter((l) => slotsInLook(l).some((id) => garmentMatchesSlot(anchorItem, SLOT_BY_ID[id])));
  if (pinnedProduct) looks = looks.filter((l) => slotsInLook(l).includes(pinnedProduct.slot));
  return rankLooks(
    looks.map((look) => fillLook(look, c, { forceOwned: force, anchorItem, pinnedProduct })),
    c,
  ).slice(0, limit);
}

// 내 옷장: 가진 옷만으로 되는 코디와, 하나만 사면 되는 코디
function closetLooks(state, { limit = 3 } = {}) {
  const c = ctx(state);
  const looks = matchingLooks(c, { occasion: null });
  const ready = rankLooks(
    looks.map((l) => fillLook(l, c, { ownedOnly: true })),
    c,
  ).slice(0, limit);
  const readyIds = new Set(ready.map((r) => r.look.id));
  const almost = rankLooks(
    looks.filter((l) => !readyIds.has(l.id)).map((l) => fillLook(l, c, { maxBuy: 1 })),
    c,
  )
    .filter((r) => r.buyCount === 1 && r.ownedCount >= 2 && r.uncertainCount === 0)
    .slice(0, limit);
  return { ready, almost };
}

// 고른 스타일의 기본 아이템을 가졌는지
function essentials(state) {
  const c = ctx(state);
  return SLOTS.filter((s) => s.g === c.gender && styleScore(s, c.styles) >= 3 && s.cat !== 'acc').map((slot) => ({
    slot,
    owned: wardrobeSlotStatus(c.closet, slot) === 'confirmed',
    needsCheck: wardrobeSlotStatus(c.closet, slot) === 'uncertain',
  }));
}

// 한 줄 검색: "출근용 셔츠 10만원 이하", "청바지에 어울리는 신발", "폴로 니트"
function search(state, text) {
  const brandNames = [...new Set(SAFE_PRODUCTS.map((p) => p.brand))];
  const q = parseQuery(text, { brands: brandNames });
  const c = ctx({
    ...state,
    gender: q.gender || state.gender,
    styles: q.style ? [q.style, ...(state.styles || [])] : state.styles,
    occasion: q.occasion || state.occasion || null,
    season: q.season || state.season,
    budget: q.maxPrice ?? state.budget,
    brandOnly: q.brand ? false : state.brandOnly,
  });

  const genderSlots = SLOTS.filter((s) => s.g === c.gender);
  const anchors = genderSlots.filter((s) => q.anchorMatch(s));
  let targets = genderSlots.filter((s) => q.targetMatch(s));
  if (!targets.length && anchors.length) targets = genderSlots.filter((s) => !anchors.some((a) => a.cat === s.cat));
  const understood = q.terms.length > 0;
  if (!targets.length) targets = genderSlots;

  const looks = LOOKS.filter((l) => l.g === c.gender);
  const anchorIds = new Set(anchors.map((a) => a.id));
  const results = [];
  for (const slot of targets) {
    if (anchorIds.has(slot.id)) continue;
    const base = scoreSlot(slot, { ...c, ownedSlots: c.ownedSlots }, matchingLooks(c, { occasion: null }));
    let score = base.score;
    let reasons = [slot.why, ...base.reasons].slice(0, 2);
    if (anchors.length) {
      const a = shortName(anchors[0]);
      reasons = [`${a}${josa(a, '과', '와')} 잘 어울려요`, ...base.reasons.filter((r) => !r.startsWith('가진 '))].slice(
        0,
        2,
      );
      const together = looks.filter(
        (l) => slotsInLook(l).includes(slot.id) && slotsInLook(l).some((id) => anchorIds.has(id)),
      ).length;
      score += together * 3;
      if (!together) score -= 4;
    }
    // 계절을 말했으면 그 계절 옷만, 아이템을 콕 집었으면 계절이 지나도 보여 준다
    if (!base.inSeason && (q.season || !q.slotNamed)) continue;
    let products = productsFor(slot.id, {
      ...productOpts(c),
      color: q.color,
      brand: q.brand,
      season: q.season || (q.slotNamed ? null : c.season),
    });
    if (q.premium) products = [...products].sort((a, b) => b.price - a.price);
    const selected = q.priceSort === 'asc' ? products : products.slice(0, q.brand ? 6 : 3);
    selected.forEach((product, i) => {
      results.push({ slot, product, score: score - i * 1.2 + quality(product) * 0.3, reasons });
    });
  }
  results.sort(
    q.priceSort === 'asc'
      ? (a, b) => a.product.price - b.product.price || a.product.id.localeCompare(b.product.id)
      : (a, b) => b.score - a.score,
  );

  const items = results.slice(0, 16);
  const anchorItem =
    c.closet
      .filter((i) => anchors.some((slot) => garmentMatchesSlot(i, slot)))
      .sort((a, b) => Number(!!b.slot) - Number(!!a.slot) || a.id.localeCompare(b.id))[0] || null;
  const outfit =
    anchors.length || c.occasion
      ? recommendLooks(
          { ...state, gender: c.gender, styles: c.styles, season: c.season, budget: c.maxPrice, occasion: c.occasion },
          { limit: 1, forceOwned: [...anchorIds], anchorItem },
        )[0] || null
      : null;
  return { query: q, understood, items, outfit, season: c.season, gender: c.gender };
}

function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const clamp = (v) => Math.max(0, Math.min(255, v));
  const r = clamp((n >> 16) + amount);
  const g = clamp(((n >> 8) & 255) + amount);
  const b = clamp((n & 255) + amount);
