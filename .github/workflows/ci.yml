name: App and server checks

'on':
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  app:
    name: App tests and build (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
      - name: Install locked app dependencies
        run: npm ci
      - name: Run app tests
        run: npm test
      - name: Build the standalone app
        run: npm run build
      - name: Record validation scope
        if: always()
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ### App validation scope
          Runs the app's Node tests (including bundled DOM/IndexedDB doubles and local HTTP integration) and standalone HTML build.
          This does not verify real mobile layout, camera/HEIC support, photo recognition quality, or a deployed service.
          SUMMARY

  server:
    name: Server tests without optional model runtime (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked server dependencies without optional ONNX runtime
        run: npm ci --omit=optional
      - name: Run server tests
        run: npm test
      - name: Record optional model test omission
        if: always()
        run: |
          cat <<'SUMMARY' >> "$GITHUB_STEP_SUMMARY"
          ### Server validation scope
          Installs with `npm ci --omit=optional`; neither the optional ONNX runtime nor the U-2-Net model is downloaded.
          Server/API and injected-runtime tests run normally. The real U-2-Net inference test reports `SKIP: model or runtime not installed`.
          A passing job therefore does not establish real-model background-removal quality. Run that test separately with the pinned model and runtime installed.
          SUMMARY
